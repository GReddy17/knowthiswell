name: Weekly content health check

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays, 13:00 UTC
  workflow_dispatch: {} # allow manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run health check
        id: check
        run: node scripts/health-check.mjs | tee health-check-output.txt

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .health-check-snapshot.json
          git diff --staged --quiet || git commit -m "chore: update health check snapshot [skip ci]"
          git push

      - name: Open issue if problems found
        if: contains(steps.check.outputs.stdout, '⚠')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('health-check-output.txt', 'utf-8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly health check — issues found (${new Date().toISOString().slice(0,10)})`,
              body: '```\n' + body + '\n```',
              labels: ['content-health'],
            });
