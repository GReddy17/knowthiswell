name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint content frontmatter (fails on missing YMYL sources)
        run: node scripts/lint-content.mjs

      - name: Content health check (broken links, missing assets, taxonomy drift)
        run: node scripts/health-check.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify sitemap, robots, and search index output
        run: |
          test -f .next/server/app/sitemap.xml.body || (echo "sitemap.xml missing from build output" && exit 1)
          test -f .next/server/app/robots.txt.body || (echo "robots.txt missing from build output" && exit 1)
          test -f .next/server/app/api/search/metadata/route.js || (echo "search metadata API route missing from build output" && exit 1)

      # Preview deploys on PRs, production deploy on merge to main —
      # handled natively by Vercel's GitHub integration once the repo
      # is connected in the Vercel dashboard (Section 4.1). This job's
      # job is to fail the build loudly before Vercel ever sees a
      # broken commit, per Section 4.4: "Fail build + alert on error."
      #
      # NOTE: this is a hybrid Next.js app (middleware.ts + the
      # /api/search/metadata route handler), not a static export — Vercel
      # builds and serves it as Functions, not a static `out/` bundle.
