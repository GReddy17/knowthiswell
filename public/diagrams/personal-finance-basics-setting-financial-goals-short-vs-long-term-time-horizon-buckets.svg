<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="800" height="320" fill="#FBF8F1"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F1B16">Financial Goals Grouped by Time Horizon</text>

  <line x1="60" y1="80" x2="740" y2="80" stroke="#2C4A3E" stroke-width="3"/>
  <polygon points="740,80 726,72 726,88" fill="#2C4A3E"/>
  <text x="60" y="66" font-size="11" fill="#4A443C">Now</text>
  <text x="740" y="66" text-anchor="end" font-size="11" fill="#4A443C">Further out</text>

  <g>
    <rect x="60" y="110" width="200" height="170" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="160" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1F1B16">Short-Term</text>
    <text x="160" y="156" text-anchor="middle" font-size="11" fill="#4A443C">Under 1 year</text>
    <line x1="80" y1="168" x2="240" y2="168" stroke="#2C4A3E" stroke-width="1"/>
    <text x="160" y="192" text-anchor="middle" font-size="11" fill="#4A443C">Priority:</text>
    <text x="160" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#B5493A">Safety &amp; access</text>
    <text x="160" y="250" text-anchor="middle" font-size="11" fill="#4A443C">e.g. holiday fund,</text>
    <text x="160" y="265" text-anchor="middle" font-size="11" fill="#4A443C">car repair fund</text>
  </g>

  <g>
    <rect x="300" y="110" width="200" height="170" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="400" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1F1B16">Medium-Term</text>
    <text x="400" y="156" text-anchor="middle" font-size="11" fill="#4A443C">1 to 5 years</text>
    <line x1="320" y1="168" x2="480" y2="168" stroke="#2C4A3E" stroke-width="1"/>
    <text x="400" y="192" text-anchor="middle" font-size="11" fill="#4A443C">Priority:</text>
    <text x="400" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#4A443C">Balance safety &amp; growth</text>
    <text x="400" y="250" text-anchor="middle" font-size="11" fill="#4A443C">e.g. down payment</text>
    <text x="400" y="265" text-anchor="middle" font-size="11" fill="#4A443C">fund</text>
  </g>

  <g>
    <rect x="540" y="110" width="200" height="170" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="640" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1F1B16">Long-Term</text>
    <text x="640" y="156" text-anchor="middle" font-size="11" fill="#4A443C">5-plus years</text>
    <line x1="560" y1="168" x2="720" y2="168" stroke="#2C4A3E" stroke-width="1"/>
    <text x="640" y="192" text-anchor="middle" font-size="11" fill="#4A443C">Priority:</text>
    <text x="640" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4A3E">Growth potential</text>
    <text x="640" y="250" text-anchor="middle" font-size="11" fill="#4A443C">e.g. retirement</text>
    <text x="640" y="265" text-anchor="middle" font-size="11" fill="#4A443C">savings</text>
  </g>
</svg>
