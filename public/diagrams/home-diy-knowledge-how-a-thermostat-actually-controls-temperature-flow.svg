<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thermostatLoopTitle">
  <title id="thermostatLoopTitle">A four-step feedback loop diagram showing a thermostat sensing room temperature, comparing it to the setpoint, switching the heating or cooling system on or off, which changes the room temperature, which is then sensed again, forming a continuous loop.</title>
  <defs>
    <marker id="arrowT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A443C"/>
    </marker>
  </defs>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">The thermostat feedback loop</text>

  <rect x="30" y="70" width="150" height="70" rx="8" fill="#2C4A3E"/>
  <text x="105" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FBF8F1">1. Sense</text>
  <text x="105" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">Read current room</text>
  <text x="105" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">temperature</text>

  <rect x="230" y="70" width="150" height="70" rx="8" fill="#8B6F4E"/>
  <text x="305" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FBF8F1">2. Compare</text>
  <text x="305" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">Check reading against</text>
  <text x="305" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">the setpoint</text>

  <rect x="430" y="70" width="150" height="70" rx="8" fill="#4A443C"/>
  <text x="505" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FBF8F1">3. Adjust</text>
  <text x="505" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">Switch heating or</text>
  <text x="505" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">cooling on or off</text>

  <rect x="630" y="70" width="130" height="70" rx="8" fill="#2C4A3E"/>
  <text x="695" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FBF8F1">4. Result</text>
  <text x="695" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">Room temperature</text>
  <text x="695" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">changes</text>

  <line x1="180" y1="105" x2="222" y2="105" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowT)"/>
  <line x1="380" y1="105" x2="422" y2="105" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowT)"/>
  <line x1="580" y1="105" x2="622" y2="105" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowT)"/>

  <path d="M 695 145 C 695 235 105 235 105 145" fill="none" stroke="#4A443C" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowT)"/>
  <text x="390" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Feedback: the new temperature is sensed again, and the loop repeats</text>

  <text x="390" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">A deadband (hysteresis) around the setpoint keeps the system from switching on and off too rapidly</text>
</svg>
