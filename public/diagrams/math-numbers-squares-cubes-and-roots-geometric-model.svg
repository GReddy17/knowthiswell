<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sqCubeRootTitle">
  <title id="sqCubeRootTitle">Diagram showing a square with side length n labeled with area n squared, next to a cube with side length n labeled with volume n cubed, with curved arrows pointing from the area back to the side length labeled square root and from the volume back to the side length labeled cube root, illustrating squaring and cubing as forward operations and roots as their reverse</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- LEFT: square panel -->
  <text x="63" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1F1B16">n</text>
  <line x1="95" y1="52" x2="175" y2="52" stroke="#2C4A3E" stroke-width="1.5"/>
  <path d="M 175,52 L 167,48 L 167,56 Z" fill="#2C4A3E"/>
  <text x="130" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">squaring</text>
  <text x="195" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">n&#178;</text>

  <rect x="90" y="100" width="160" height="160" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M 100,110 L 100,120 L 90,120" fill="none" stroke="#1F1B16" stroke-width="1.2"/>
  <text x="170" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="#2C4A3E">n&#178;</text>
  <text x="170" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">area</text>

  <line x1="90" y1="275" x2="250" y2="275" stroke="#1F1B16" stroke-width="1"/>
  <line x1="90" y1="270" x2="90" y2="280" stroke="#1F1B16" stroke-width="1"/>
  <line x1="250" y1="270" x2="250" y2="280" stroke="#1F1B16" stroke-width="1"/>
  <text x="170" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">side = n</text>

  <path d="M 250,315 Q 170,352 90,315" fill="none" stroke="#C9412C" stroke-width="2"/>
  <path d="M 90,315 L 99,310 L 101,318 Z" fill="#C9412C"/>
  <text x="170" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">&#8730;</text>
  <text x="170" y="386" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">square root reverses squaring</text>

  <!-- divider -->
  <line x1="320" y1="20" x2="320" y2="400" stroke="#E3DCC9" stroke-width="1.5"/>

  <!-- RIGHT: cube panel -->
  <text x="363" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1F1B16">n</text>
  <line x1="395" y1="42" x2="460" y2="42" stroke="#2C4A3E" stroke-width="1.5"/>
  <path d="M 460,42 L 452,38 L 452,46 Z" fill="#2C4A3E"/>
  <text x="427" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">cubing</text>
  <text x="475" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">n&#179;</text>

  <!-- isometric cube: front, top, right faces -->
  <polygon points="390,110 510,110 550,80 430,80" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <polygon points="510,110 550,80 550,200 510,230" fill="#E3DCC9" stroke="#2C4A3E" stroke-width="1.5"/>
  <polygon points="390,110 510,110 510,230 390,230" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>

  <text x="450" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#20362D">n&#179;</text>
  <text x="450" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">volume</text>

  <line x1="390" y1="250" x2="510" y2="250" stroke="#1F1B16" stroke-width="1"/>
  <line x1="390" y1="245" x2="390" y2="255" stroke="#1F1B16" stroke-width="1"/>
  <line x1="510" y1="245" x2="510" y2="255" stroke="#1F1B16" stroke-width="1"/>
  <text x="450" y="269" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">side = n</text>

  <path d="M 510,315 Q 450,352 390,315" fill="none" stroke="#C9412C" stroke-width="2"/>
  <path d="M 390,315 L 399,310 L 401,318 Z" fill="#C9412C"/>
  <text x="450" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">&#8731;</text>
  <text x="450" y="386" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">cube root reverses cubing</text>
</svg>
