<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="desertFormationTitle">
  <title id="desertFormationTitle">Four simplified side-by-side diagrams showing how deserts form: a subtropical-high desert with descending dry air near 30 degrees latitude, a rain-shadow desert with moist air dropping rain on a mountain's windward side and arriving dry on the leeward side, a continental-interior desert far from any ocean moisture source, and a coastal cold-current desert where a cold ocean current suppresses evaporation next to the coastline</title>
  <rect width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Four ways a desert forms</text>

  <!-- panel frames -->
  <g fill="none" stroke="#E3DCC9" stroke-width="1">
    <rect x="14" y="46" width="146" height="290" rx="4"/>
    <rect x="174" y="46" width="146" height="290" rx="4"/>
    <rect x="334" y="46" width="146" height="290" rx="4"/>
    <rect x="494" y="46" width="146" height="290" rx="4"/>
  </g>

  <!-- PANEL 1: subtropical high -->
  <g>
    <circle cx="87" cy="78" r="11" fill="#B08D3E"/>
    <g stroke="#B08D3E" stroke-width="1.5">
      <line x1="87" y1="60" x2="87" y2="53"/><line x1="105" y1="78" x2="112" y2="78"/>
      <line x1="62" y1="78" x2="69" y2="78"/><line x1="100" y1="63" x2="105" y2="58"/>
      <line x1="74" y1="63" x2="69" y2="58"/>
    </g>
    <g stroke="#4A443C" stroke-width="1.6" fill="none" marker-end="url(#arrowDown)">
      <path d="M 70,100 L 70,190"/>
      <path d="M 87,100 L 87,195"/>
      <path d="M 104,100 L 104,190"/>
    </g>
    <line x1="20" y1="205" x2="154" y2="205" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="152" y="201" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8B6F4E">~30&#176; N/S</text>
    <line x1="20" y1="300" x2="154" y2="300" stroke="#1F1B16" stroke-width="1.5"/>
    <path d="M 30,300 Q 48,282 66,300 Q 84,285 102,300 Q 120,283 138,300 Z" fill="#EDE7D8" stroke="#D8CFBB"/>
    <text x="87" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Subtropical high</text>
    <text x="87" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Air sinks and dries near 30&#176;</text>
  </g>

  <!-- PANEL 2: rain shadow -->
  <g>
    <path d="M 187,300 L 237,150 L 247,150 L 297,300 Z" fill="#EDE7D8" stroke="#D8CFBB"/>
    <line x1="187" y1="300" x2="307" y2="300" stroke="#1F1B16" stroke-width="1.5"/>
    <ellipse cx="205" cy="110" rx="20" ry="11" fill="#8FA9A0" opacity="0.7"/>
    <ellipse cx="220" cy="103" rx="15" ry="9" fill="#8FA9A0" opacity="0.7"/>
    <g stroke="#5B7A99" stroke-width="1.5">
      <line x1="200" y1="126" x2="196" y2="138"/>
      <line x1="210" y1="128" x2="206" y2="142"/>
      <line x1="220" y1="126" x2="216" y2="138"/>
    </g>
    <text x="200" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#3F5E78">Windward</text>
    <circle cx="288" cy="180" r="9" fill="#B08D3E"/>
    <path d="M 264,300 Q 280,286 296,300 Q 306,288 316,300" fill="#EDE7D8" stroke="#D8CFBB" opacity="0.9"/>
    <text x="285" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8B6F4E">Leeward</text>
    <text x="285" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8B6F4E">(dry)</text>
    <text x="247" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Rain shadow</text>
    <text x="247" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Mountain blocks moisture</text>
  </g>

  <!-- PANEL 3: continental interior -->
  <g>
    <rect x="347" y="120" width="16" height="180" fill="#5B7A99" opacity="0.35"/>
    <g stroke="#5B7A99" stroke-width="1" opacity="0.7">
      <path d="M 347,140 q 4,-4 8,0 q 4,4 8,0" fill="none"/>
      <path d="M 347,170 q 4,-4 8,0 q 4,4 8,0" fill="none"/>
      <path d="M 347,200 q 4,-4 8,0 q 4,4 8,0" fill="none"/>
    </g>
    <rect x="363" y="120" width="103" height="180" fill="#EDE7D8"/>
    <line x1="347" y1="300" x2="466" y2="300" stroke="#1F1B16" stroke-width="1.5"/>
    <line x1="368" y1="145" x2="450" y2="145" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 368,145 l 5,-3 v 6 z M 450,145 l -5,-3 v 6 z" fill="#8B6F4E"/>
    <text x="409" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#8B6F4E">far from ocean</text>
    <path d="M 425,300 Q 442,280 459,300 Z" fill="#D8CFBB"/>
    <circle cx="440" cy="165" r="9" fill="#B08D3E"/>
    <text x="409" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Continental interior</text>
    <text x="409" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Too far inland for rain</text>
  </g>

  <!-- PANEL 4: cold coastal current -->
  <g>
    <rect x="507" y="120" width="60" height="180" fill="#5B7A99" opacity="0.3"/>
    <g stroke="#5B7A99" stroke-width="1" opacity="0.7">
      <path d="M 512,150 q 5,-5 10,0 q 5,5 10,0 q 5,-5 10,0" fill="none"/>
      <path d="M 512,200 q 5,-5 10,0 q 5,5 10,0 q 5,-5 10,0" fill="none"/>
      <path d="M 512,250 q 5,-5 10,0 q 5,5 10,0 q 5,-5 10,0" fill="none"/>
    </g>
    <path d="M 520,175 L 555,175" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrowRight)"/>
    <text x="537" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#20362D">cold current</text>
    <rect x="567" y="120" width="59" height="180" fill="#EDE7D8"/>
    <line x1="507" y1="300" x2="626" y2="300" stroke="#1F1B16" stroke-width="1.5"/>
    <g stroke="#8B6F4E" stroke-width="1" opacity="0.8">
      <line x1="567" y1="140" x2="600" y2="140"/>
      <line x1="567" y1="150" x2="610" y2="150"/>
      <line x1="567" y1="160" x2="595" y2="160"/>
    </g>
    <text x="596" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#8B6F4E">coastal fog, little rain</text>
    <path d="M 592,300 Q 608,282 624,300 Z" fill="#D8CFBB"/>
    <text x="566" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Cold coastal current</text>
    <text x="566" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Cold water limits evaporation</text>
  </g>

  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M 0,0 L 8,0 L 4,7 Z" fill="#4A443C"/>
    </marker>
    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="320" y="405" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Simplified mechanisms; most deserts combine more than one of these factors.</text>
</svg>
