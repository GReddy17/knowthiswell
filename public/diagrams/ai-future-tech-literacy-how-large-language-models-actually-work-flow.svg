<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="llmFlowTitle">
  <title id="llmFlowTitle">Huge volumes of text train a neural network to predict the next token repeatedly; at use time, a prompt is fed in and the model generates a response one token at a time.</title>
  <rect width="560" height="320" fill="#FBF8F1"/>
  <rect x="30" y="40" width="220" height="55" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="140" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Huge volumes of text</text>
  <text x="140" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(training data)</text>
  <text x="140" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="30" y="125" width="220" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="140" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Predict next token,</text>
  <text x="140" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">adjust, repeat billions of times</text>
  <text x="140" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="30" y="210" width="220" height="55" rx="6" fill="#2C4A3E"/>
  <text x="140" y="233" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Trained language model</text>
  <text x="140" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">(learned patterns)</text>
  <text x="270" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">→</text>
  <rect x="300" y="40" width="230" height="55" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="415" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">User prompt fed in</text>
  <text x="415" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">at use time</text>
  <text x="415" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="300" y="125" width="230" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="415" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Generate one token,</text>
  <text x="415" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">feed it back in, repeat</text>
  <text x="415" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="300" y="210" width="230" height="55" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="415" y="233" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Generated response</text>
  <text x="415" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(no live fact-check step)</text>
</svg>
