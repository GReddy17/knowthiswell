<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crackTimeTitle">
  <title id="crackTimeTitle">A bar chart comparing estimated brute-force crack time on a logarithmic-feeling scale for four password patterns: a 6-character lowercase-only password (under a second), an 8-character password mixing upper, lower, and numbers (a few hours), a 12-character password mixing all four character types (centuries), and a 16-character multi-word passphrase (far beyond any practical timeframe). Each added character multiplies the total combinations, not just adds to them.</title>
  <rect width="800" height="320" fill="#FBF8F1"/>
  <text x="30" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Estimated brute-force crack time (illustrative, offline attack)</text>

  <line x1="220" y1="60" x2="220" y2="270" stroke="#E3DCC9" stroke-width="1"/>

  <!-- Bar 1 -->
  <text x="210" y="85" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">6 chars, lowercase only</text>
  <rect x="220" y="70" width="14" height="26" fill="#C9412C"/>
  <text x="245" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#C9412C">under 1 second</text>

  <!-- Bar 2 -->
  <text x="210" y="140" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">8 chars, upper+lower+digit</text>
  <rect x="220" y="125" width="60" height="26" fill="#B5493A"/>
  <text x="290" y="143" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5493A">a few hours</text>

  <!-- Bar 3 -->
  <text x="210" y="195" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">12 chars, all 4 types</text>
  <rect x="220" y="180" width="330" height="26" fill="#8B6F4E"/>
  <text x="560" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">on the order of centuries</text>

  <!-- Bar 4 -->
  <text x="210" y="250" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">16-char passphrase</text>
  <rect x="220" y="235" width="530" height="26" fill="#2C4A3E"/>
  <text x="400" y="253" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1" font-weight="700">far beyond any practical attack timeframe</text>

  <text x="400" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Bar lengths are illustrative, not to a linear scale — each extra character multiplies the guess space rather than adding to it.</text>
</svg>
