<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cropMapTitle">
  <title id="cropMapTitle">A world map with climate zone bands and overlaid crop belt labels: rice paddies across monsoon Asia, wheat belts across the North American Great Plains and the Ukraine-Russia plains, coffee highlands near the equator in Ethiopia, Colombia, and Kenya, and Mediterranean climate zones for olives and grapes in southern Europe, California, and Chile</title>
  <rect width="640" height="470" fill="#FBF8F1"/>

  <text x="320" y="28" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Major crop belts and the climate zones behind them</text>

  <!-- climate zone bands (horizontal, behind landmasses) -->
  <g opacity="0.4">
    <rect x="40" y="70" width="560" height="30" fill="#E3DCC9"/>
    <text x="46" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">polar / subarctic</text>
    <rect x="40" y="100" width="560" height="70" fill="#EEF3EE"/>
    <text x="46" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">temperate</text>
    <rect x="40" y="170" width="560" height="90" fill="#FBEDEA"/>
    <text x="46" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">arid / subtropical</text>
    <rect x="40" y="260" width="560" height="55" fill="#EFE6D3"/>
    <text x="46" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">tropical (equatorial)</text>
    <rect x="40" y="315" width="560" height="55" fill="#FBEDEA"/>
    <text x="46" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">arid / subtropical</text>
    <rect x="40" y="370" width="560" height="41" fill="#EEF3EE"/>
    <text x="46" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">temperate (S. hemisphere)</text>
  </g>

  <!-- base landmasses -->
  <g fill="#EDE7D8" stroke="#D8CFBB" stroke-width="1" fill-opacity="0.85">
    <path d="M63,114 L102,110 L172,100 L196,104 L219,130 L234,150 L211,166 L196,200 L169,198 L177,222 L191,232 L157,210 L138,184 L127,154 L118,140 L87,130 L63,130 Z"/>
    <path d="M200,226 L227,230 L242,250 L266,266 L258,296 L230,320 L214,360 L211,330 L209,286 L194,258 L200,240 Z"/>
    <path d="M306,164 L306,178 L343,176 L364,178 L374,160 L382,140 L367,130 L351,110 L328,126 L312,150 Z"/>
    <path d="M294,208 L336,176 L370,188 L387,226 L399,226 L382,280 L374,300 L351,318 L339,286 L334,246 L304,238 L294,220 Z"/>
    <path d="M382,160 L390,220 L413,200 L429,180 L426,234 L444,210 L460,206 L468,210 L483,230 L507,200 L510,170 L530,150 L546,130 L476,96 L413,110 L390,140 Z"/>
    <path d="M496,294 L521,274 L541,272 L558,304 L553,324 L533,320 L499,318 Z"/>
  </g>

  <!-- crop belt markers -->
  <!-- Rice: monsoon Asia -->
  <circle cx="460" cy="205" r="5" fill="#2C4A3E"/>
  <text x="460" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Rice</text>
  <text x="460" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">monsoon Asia</text>

  <!-- Wheat: North American Great Plains -->
  <circle cx="150" cy="140" r="5" fill="#B08D3E"/>
  <text x="150" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Wheat</text>
  <text x="150" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Great Plains</text>

  <!-- Wheat: Ukraine-Russia plains -->
  <circle cx="395" cy="145" r="5" fill="#B08D3E"/>
  <text x="395" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Wheat</text>
  <text x="395" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Ukraine–Russia</text>

  <!-- Coffee: Ethiopia -->
  <circle cx="388" cy="222" r="5" fill="#8B6F4E"/>
  <text x="405" y="220" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Coffee — Ethiopia</text>

  <!-- Coffee: Kenya -->
  <circle cx="378" cy="255" r="5" fill="#8B6F4E"/>
  <text x="392" y="262" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Coffee — Kenya</text>

  <!-- Coffee: Colombia -->
  <circle cx="205" cy="238" r="5" fill="#8B6F4E"/>
  <text x="150" y="250" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Coffee — Colombia</text>

  <!-- Mediterranean: S Europe -->
  <circle cx="330" cy="168" r="5" fill="#C9412C"/>
  <text x="245" y="172" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Olives &amp; grapes — S. Europe</text>

  <!-- Mediterranean: California -->
  <circle cx="122" cy="172" r="5" fill="#C9412C"/>
  <text x="30" y="185" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1F1B16">Olives &amp; grapes</text>
  <text x="30" y="196" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">California</text>

  <!-- Mediterranean: Chile -->
  <circle cx="222" cy="318" r="5" fill="#C9412C"/>
  <text x="235" y="322" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Olives &amp; grapes — Chile</text>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">
    <circle cx="66" cy="424" r="5" fill="#2C4A3E"/>
    <text x="78" y="428">Rice paddies</text>
    <circle cx="176" cy="424" r="5" fill="#B08D3E"/>
    <text x="188" y="428">Wheat belts</text>
    <circle cx="286" cy="424" r="5" fill="#8B6F4E"/>
    <text x="298" y="428">Coffee highlands</text>
    <circle cx="426" cy="424" r="5" fill="#C9412C"/>
    <text x="438" y="428">Mediterranean olives &amp; grapes</text>
  </g>

  <text x="320" y="452" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Climate bands are simplified and schematic, not precise latitude lines.</text>
</svg>
