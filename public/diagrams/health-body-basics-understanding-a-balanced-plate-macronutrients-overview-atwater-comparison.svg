<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atwaterTitle">
  <title id="atwaterTitle">A bar comparison of three macronutrient bars each labeled with grams and calories per gram: protein at 4 calories per gram, carbohydrate at 4 calories per gram, and fat at 9 calories per gram, with the fat bar's calorie total visually more than double the height of the equal-weight protein and carbohydrate bars.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="390" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">10 grams of each macronutrient — same weight, different calories</text>

  <!-- baseline -->
  <line x1="80" y1="270" x2="700" y2="270" stroke="#2C4A3E" stroke-width="1.6"/>

  <!-- Protein bar: 40 cal -->
  <rect x="140" y="230" width="110" height="40" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="195" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">40 cal</text>
  <text x="195" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Protein</text>
  <text x="195" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">10g x 4 cal/g</text>

  <!-- Carb bar: 40 cal -->
  <rect x="335" y="230" width="110" height="40" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">40 cal</text>
  <text x="390" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Carbohydrate</text>
  <text x="390" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">10g x 4 cal/g</text>

  <!-- Fat bar: 90 cal, more than double height -->
  <rect x="530" y="140" width="110" height="130" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="585" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">90 cal</text>
  <text x="585" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Fat</text>
  <text x="585" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">10g x 9 cal/g</text>
</svg>
