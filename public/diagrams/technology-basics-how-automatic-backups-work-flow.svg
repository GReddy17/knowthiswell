<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backupFlowTitle">
  <title id="backupFlowTitle">A flow diagram showing a device's files first sent as one large full backup to cloud storage, then a timeline of much smaller incremental backups sent afterward, each one only containing the files that changed since the previous backup, with old versions kept rather than overwritten.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <rect x="30" y="120" width="120" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="90" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Device files</text>
  <text x="90" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(everything)</text>

  <defs>
    <marker id="arrowBk" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M150,145 L228,145" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowBk)"/>

  <rect x="230" y="115" width="130" height="60" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="295" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Full backup</text>
  <text x="295" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">day 1 — large, slow</text>

  <path d="M360,145 L428,145" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowBk)"/>

  <rect x="430" y="60" width="100" height="42" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="480" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Incremental</text>
  <text x="480" y="91" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">day 2 changes</text>

  <rect x="550" y="60" width="100" height="42" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="600" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Incremental</text>
  <text x="600" y="91" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">day 3 changes</text>

  <rect x="670" y="60" width="100" height="42" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="720" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Incremental</text>
  <text x="720" y="91" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">day 4 changes</text>

  <path d="M430,110 L360,140" fill="none" stroke="#2C4A3E" stroke-width="1.2" marker-end="url(#arrowBk)"/>
  <path d="M480,102 L480,145" fill="none" stroke="#2C4A3E" stroke-width="1.2"/>
  <path d="M600,102 L600,145" fill="none" stroke="#2C4A3E" stroke-width="1.2"/>
  <path d="M720,102 L720,145" fill="none" stroke="#2C4A3E" stroke-width="1.2"/>
  <line x1="480" x2="720" y1="145" y2="145" stroke="#2C4A3E" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="600" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">each version kept separately, not overwritten</text>

  <rect x="430" y="190" width="340" height="46" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="600" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Restore = full backup + incrementals replayed in order</text>
  <text x="600" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">or a single version picked from the timeline</text>

  <text x="400" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">A backup keeps history — it doesn&apos;t just mirror the newest state.</text>
</svg>
