<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="paperSizeTitle">
  <title id="paperSizeTitle">A nested diagram showing A0 paper halved into two A1 sheets, each A1 halved into two A2 sheets, continuing down to A4, all sharing the same root-2 aspect ratio, alongside a separate non-nesting US Letter rectangle of a different proportion.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>
  <text x="30" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">ISO A-series: each size is exactly half the one before it</text>

  <!-- A0 -->
  <rect x="30" y="50" width="200" height="283" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="130" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">A0</text>

  <!-- A1 (right half of A0) -->
  <rect x="240" y="50" width="141" height="200" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">A1</text>

  <!-- A2 -->
  <rect x="391" y="50" width="100" height="141" fill="#F3ECE4" stroke="#2C4A3E" stroke-width="2"/>
  <text x="441" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">A2</text>

  <!-- A3 -->
  <rect x="501" y="50" width="70" height="100" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="536" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">A3</text>

  <!-- A4 -->
  <rect x="581" y="50" width="49" height="70" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="605" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1F1B16">A4</text>

  <text x="30" y="360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each size folds/cuts exactly in half into the next — the shape (aspect ratio) never changes.</text>

  <!-- US Letter, separate proportion -->
  <rect x="650" y="180" width="90" height="116" fill="#EDE7D8" stroke="#B5493A" stroke-width="2.2"/>
  <text x="695" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">US Letter</text>
  <text x="695" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5493A">different shape — doesn't nest into the A-series</text>
</svg>
