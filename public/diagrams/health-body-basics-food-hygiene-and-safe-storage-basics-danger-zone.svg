<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dangerZoneTitle">
  <title id="dangerZoneTitle">A vertical temperature scale from freezing to boiling, with a shaded band labeled the danger zone spanning roughly 40 to 140 degrees Fahrenheit, marked as the range where bacteria multiply fastest, with refrigeration marked safely below the band and cooking/hot-holding marked safely above it</title>
  <rect width="500" height="400" fill="#FBF8F1"/>

  <line x1="150" y1="30" x2="150" y2="370" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">212&#176;F boiling</text>
  <text x="150" y="385" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">32&#176;F freezing</text>

  <rect x="130" y="150" width="40" height="130" fill="#B5493A" opacity="0.3"/>
  <text x="260" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A">Danger Zone</text>
  <text x="260" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">40&#176;F&#8211;140&#176;F (4&#8211;60&#176;C)</text>
  <text x="260" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">bacteria multiply fastest</text>

  <rect x="130" y="60" width="40" height="90" fill="#EEF3EE"/>
  <text x="260" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Cooking / hot-holding</text>
  <text x="260" y="118" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">above 140&#176;F — safe</text>

  <rect x="130" y="280" width="40" height="80" fill="#EEF3EE"/>
  <text x="260" y="315" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Refrigeration</text>
  <text x="260" y="333" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">below 40&#176;F — safe</text>
</svg>
