<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="historicalUnitsTitle">
  <title id="historicalUnitsTitle">A horizontal timeline from ancient Egypt to 1959 showing the royal cubit fixed around 2700 BCE at 52.4 centimeters using a master granite rod, the yard attributed to King Henry the First around 1120 CE as the distance from his nose to his outstretched thumb, and the international yard and pound agreement of 1959 that fixed the modern inch at exactly 2.54 centimeters.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>
  <text x="390" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">From body parts to a fixed international standard</text>

  <line x1="60" y1="150" x2="720" y2="150" stroke="#2C4A3E" stroke-width="2"/>

  <circle cx="110" cy="150" r="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">~2700 BCE</text>
  <text x="110" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Royal cubit</text>
  <text x="110" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">fixed at 52.4 cm</text>
  <text x="110" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">(master granite rod)</text>

  <circle cx="390" cy="150" r="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">~1120 CE</text>
  <text x="390" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Yard defined as</text>
  <text x="390" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Henry I's nose-to-thumb</text>

  <circle cx="670" cy="150" r="9" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="670" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">1959</text>
  <text x="670" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#B5493A">International yard/pound</text>
  <text x="670" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#B5493A">agreement: 1 in = 2.54 cm exactly</text>

  <text x="390" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Every historical unit eventually got redefined against a fixed, reproducible physical or metric standard.</text>
</svg>
