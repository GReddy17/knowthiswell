<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="680" height="280" fill="#FBF8F1"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" fill="#1F1B16" font-weight="700">Estate assets</text>
  <path d="M340 36 V56" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M340 56 H150" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M340 56 H530" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M150 56 V70" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M530 56 V70" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="50" y="70" width="200" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-size="11" fill="#1F1B16" font-weight="600">Probate assets</text>
  <text x="150" y="106" text-anchor="middle" font-size="10" fill="#4A443C">solely owned, no beneficiary</text>

  <rect x="430" y="70" width="200" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="530" y="90" text-anchor="middle" font-size="11" fill="#1F1B16" font-weight="600">Non-probate assets</text>
  <text x="530" y="106" text-anchor="middle" font-size="10" fill="#4A443C">joint w/ survivorship, named beneficiary</text>

  <path d="M150 120 V150" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="50" y="150" width="200" height="60" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="172" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">Probate Court: validate</text>
  <text x="150" y="186" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">will or apply intestate</text>
  <text x="150" y="200" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">rules; pay debts</text>

  <path d="M150 210 V230" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="30" y="230" width="240" height="36" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="252" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">Distributed to heirs/beneficiaries</text>

  <path d="M530 120 V230" stroke="#B5493A" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="410" y="230" width="240" height="36" rx="6" fill="#EDE7D8" stroke="#B5493A" stroke-width="2"/>
  <text x="530" y="252" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">Transfers directly (bypasses court)</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,8 z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
