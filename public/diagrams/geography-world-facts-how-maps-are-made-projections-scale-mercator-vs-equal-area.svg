<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="projectionCompareTitle">
  <title id="projectionCompareTitle">Side-by-side simplified world maps: a Mercator projection where Greenland appears nearly as large as Africa even though Africa is about 14 times larger, and an equal-area projection where the two landmasses appear at their correct relative sizes but shapes are more visibly distorted</title>
  <rect width="640" height="400" fill="#FBF8F1"/>

  <text x="160" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Mercator projection</text>
  <text x="480" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Equal-area projection</text>

  <line x1="320" y1="20" x2="320" y2="350" stroke="#E3DCC9" stroke-width="1"/>

  <!-- LEFT: Mercator, Greenland exaggerated -->
  <g transform="translate(35,50)">
    <rect x="0" y="0" width="250" height="230" fill="#EEF3EE" opacity="0.5"/>
    <g fill="#2C4A3E" opacity="0.85">
      <path d="M 30,40 L 70,20 L 100,45 L 90,80 L 70,65 L 55,90 L 35,70 Z"/>
      <path d="M 95,110 L 110,105 L 118,140 L 108,175 L 92,165 L 88,130 Z"/>
      <path d="M 140,20 L 220,15 L 250,35 L 230,55 L 200,50 L 175,75 L 155,60 L 135,40 Z"/>
      <path d="M 220,150 L 245,145 L 250,165 L 230,175 L 215,165 Z"/>
    </g>
    <!-- Africa highlighted -->
    <path d="M 150,90 L 175,85 L 190,105 L 185,140 L 165,165 L 150,140 L 145,110 Z" fill="#C97C3D"/>
    <text x="163" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B4A3A">Africa</text>
    <!-- Greenland, exaggerated large -->
    <path d="M 50,-45 L 85,-50 L 100,-10 L 80,15 L 45,10 L 30,-20 Z" fill="#4A7A9E"/>
    <text x="65" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3D6A83">Greenland</text>
  </g>
  <text x="160" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Greenland looks almost as big as Africa</text>
  <text x="160" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B4A3A">but Africa is actually ~14x larger</text>

  <!-- RIGHT: equal-area, Greenland correct small size -->
  <g transform="translate(355,50)">
    <rect x="0" y="0" width="250" height="230" fill="#EEF3EE" opacity="0.5"/>
    <g fill="#2C4A3E" opacity="0.85">
      <path d="M 26,45 Q 65,15 95,42 Q 100,60 80,72 Q 78,90 55,90 Q 30,75 26,45 Z"/>
      <path d="M 95,112 Q 112,106 118,138 Q 112,168 96,166 Q 86,135 95,112 Z"/>
      <path d="M 140,22 Q 225,10 252,32 Q 235,52 205,48 Q 178,72 158,58 Q 138,42 140,22 Z"/>
      <path d="M 220,150 Q 248,142 250,163 Q 232,178 214,164 Q 213,154 220,150 Z"/>
    </g>
    <!-- Africa highlighted, correct proportion -->
    <path d="M 150,92 Q 178,84 192,106 Q 190,140 168,166 Q 148,142 144,112 Q 143,98 150,92 Z" fill="#C97C3D"/>
    <text x="166" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B4A3A">Africa</text>
    <!-- Greenland, correct small size -->
    <path d="M 63,3 L 72,5 L 74,15 L 68,23 L 60,25 L 55,16 L 56,7 Z" fill="#4A7A9E"/>
    <text x="66" y="-4" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#3D6A83">Greenland</text>
  </g>
  <text x="480" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Sizes are correct, but shapes bend</text>
  <text x="480" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B4A3A">outlines are visibly more distorted</text>

  <text x="320" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Every flat map trades off either true area, true shape, or true distance &#8212; never all three at once.</text>
</svg>
