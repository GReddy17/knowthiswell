<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bullBearTitle">
  <title id="bullBearTitle">How bull, bear and correction labels are measured: an index falls from a peak, passes the 10% correction line and the 20% bear-market line, reaches a low, and is confirmed as a new bull market once it closes 20% above the low. Example: S&amp;P 500 peak about 4,797 in January 2022, low about 3,577 in October 2022 (down about 25%), 20% recovery mark about 4,292 reached June 2023.</title>
  <rect width="640" height="440" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- reference lines -->
    <line x1="40" y1="60" x2="600" y2="60" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="44" y="54" font-size="10" fill="#4A443C">Peak (0%)</text>
    <line x1="40" y1="115" x2="600" y2="115" stroke="#B8860B" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="44" y="109" font-size="10" fill="#4A443C">−10%: correction line</text>
    <line x1="40" y1="170" x2="600" y2="170" stroke="#C9412C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="44" y="164" font-size="10" fill="#C9412C">−20%: bear market line</text>

    <!-- shaded zones -->
    <rect x="40" y="60" width="560" height="55" fill="#B8860B" opacity="0.06"/>
    <rect x="40" y="170" width="560" height="60" fill="#C9412C" opacity="0.06"/>

    <!-- price path -->
    <polyline fill="none" stroke="#1F1B16" stroke-width="2.5" points="60,120 110,80 150,60 190,95 220,85 260,140 290,125 320,190 345,215 370,200 400,165 430,175 470,128 510,110 560,70 590,55"/>
    <circle cx="150" cy="60" r="5" fill="#8B6F4E"/>
    <circle cx="345" cy="215" r="5" fill="#C9412C"/>
    <text x="345" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#C9412C">Low</text>

    <!-- 20% above low marker -->
    <line x1="345" y1="128" x2="600" y2="128" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="2 3"/>
    <circle cx="470" cy="128" r="5" fill="#2C4A3E"/>
    <text x="478" y="148" font-size="10" font-weight="700" fill="#2C4A3E">+20% from low:</text>
    <text x="478" y="161" font-size="10" fill="#2C4A3E">new bull market confirmed,</text>
    <text x="478" y="174" font-size="10" fill="#2C4A3E">dated back to the low</text>

    <!-- example box -->
    <rect x="40" y="270" width="560" height="110" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="320" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Real example: S&amp;P 500, 2022 to 2023 (daily closes, rounded)</text>
    <text x="60" y="318" font-size="11" fill="#1F1B16">Peak: about 4,797 (Jan 3, 2022)</text>
    <text x="60" y="338" font-size="11" fill="#1F1B16">Low: about 3,577 (Oct 12, 2022), down about 25%</text>
    <text x="60" y="358" font-size="11" fill="#1F1B16">Bull confirmed: about 4,292 = low × 1.2 (June 8, 2023)</text>
    <text x="580" y="338" text-anchor="end" font-size="10" fill="#4A443C">Bear label used</text>
    <text x="580" y="352" text-anchor="end" font-size="10" fill="#4A443C">from June 2022</text>

    <text x="320" y="410" text-anchor="middle" font-size="10" fill="#4A443C">Recovery math: a loss of L needs a gain of L ÷ (100% − L). −25% needs +33%; −50% needs +100%.</text>
  </g>
</svg>
