<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jobBoardRankingTitle">
  <title id="jobBoardRankingTitle">A flow diagram showing how a job board ranks listings: a posting is indexed by keywords, skills, and location, then scored on four ranking factors (keyword relevance, recency, applicant engagement, and sponsored placement), producing a composite score that sets the listing's position in search results.</title>
  <rect width="780" height="240" fill="#FBF8F1"/>

  <rect x="20" y="70" width="140" height="90" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="90" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Job posting</text>
  <text x="90" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">title, description,</text>
  <text x="90" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">tags</text>

  <line x1="160" y1="115" x2="196" y2="115" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowJB)"/>

  <rect x="200" y="70" width="150" height="90" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="275" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Indexed</text>
  <text x="275" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">by keywords, skills,</text>
  <text x="275" y="137" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">and location</text>

  <line x1="350" y1="115" x2="386" y2="115" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowJB)"/>

  <rect x="390" y="40" width="230" height="150" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="505" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Ranking factors scored</text>
  <text x="410" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">• Keyword relevance match</text>
  <text x="410" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">• Recency (freshness)</text>
  <text x="410" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">• Applicant engagement</text>
  <text x="410" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">• Sponsored placement</text>

  <line x1="620" y1="115" x2="656" y2="115" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowJB)"/>

  <rect x="660" y="65" width="100" height="100" rx="8" fill="#2C4A3E"/>
  <text x="710" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">Composite</text>
  <text x="710" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">score</text>
  <text x="710" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">sets search</text>
  <text x="710" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">position</text>

  <text x="390" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Recalculated on every search — a listing's position shifts as these factors change, not once and done.</text>

  <defs>
    <marker id="arrowJB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
