<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="siVsCiTitle">
  <title id="siVsCiTitle">A chart showing simple interest growing as a straight line and compound interest growing as an upward curve, both starting from the same principal, with the curve pulling further above the line each year.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>

  <line x1="80" y1="230" x2="720" y2="230" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="80" y1="30" x2="80" y2="230" stroke="#2C4A3E" stroke-width="2"/>
  <text x="60" y="235" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">$5,000</text>
  <text x="60" y="45" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">$11,000</text>

  <polyline points="80,225 200,208 320,191 440,174 560,157 680,140" fill="none" stroke="#4A443C" stroke-width="2.5"/>
  <text x="500" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Simple interest (straight line)</text>

  <path d="M80,225 C 250,215 400,180 560,110 680,55 680,55 680,55" fill="none" stroke="#B5493A" stroke-width="3"/>
  <text x="470" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5493A">Compound interest (curve)</text>

  <line x1="680" y1="55" x2="680" y2="140" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="695" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#2C4A3E">gap widens</text>

  <text x="80" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Yr 0</text>
  <text x="680" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Yr 20</text>
</svg>
