<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ringOfFireTitle">
  <title id="ringOfFireTitle">Simplified map showing the horseshoe-shaped Pacific Ring of Fire and clusters of volcanoes along it</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- Pacific ocean basin, simplified -->
  <ellipse cx="320" cy="210" rx="230" ry="170" fill="#EEF3EE" stroke="#E3DCC9" stroke-width="1"/>
  <text x="320" y="215" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" fill="#4A443C" opacity="0.7">Pacific Ocean</text>

  <!-- Ring of Fire path, horseshoe shape open at bottom -->
  <path d="M 130,120 Q 90,210 130,300 Q 180,380 320,395 Q 460,380 510,300 Q 550,210 510,120 Q 460,60 320,45 Q 180,60 130,120"
        fill="none" stroke="#C9412C" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- volcano markers -->
  <g fill="#2C4A3E">
    <circle cx="128" cy="118" r="6"/><text x="105" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Japan</text>
    <circle cx="150" cy="230" r="6"/><text x="90" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Philippines</text>
    <circle cx="185" cy="300" r="6"/><text x="140" y="325" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Indonesia</text>
    <circle cx="320" cy="393" r="6"/><text x="280" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">New Zealand</text>
    <circle cx="505" cy="290" r="6"/><text x="500" y="315" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Andes (S. America)</text>
    <circle cx="525" cy="150" r="6"/><text x="500" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Cascades (N. America)</text>
    <circle cx="320" cy="200" r="6"/><text x="290" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8B6F4E">Hawaii (hotspot, off-boundary)</text>
  </g>

  <text x="320" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="600" fill="#1F1B16">The Pacific Ring of Fire</text>
  <text x="320" y="418" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Dashed line traces the belt of subduction-zone volcanic activity ringing the Pacific Plate.</text>
</svg>
