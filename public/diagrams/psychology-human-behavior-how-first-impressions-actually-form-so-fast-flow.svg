<svg viewBox="0 0 560 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fiTitle">
  <title id="fiTitle">How a first impression forms: cues arrive in about 100 milliseconds; the brain asks about warmth and competence; a snap verdict forms and longer looks mostly raise confidence; the halo spreads to unrelated traits; later information is read through that frame. Clearly diagnostic new information can loop back and revise the verdict.</title>
  <rect width="560" height="500" fill="#FBF8F1"/>
  <text x="280" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">How a first impression forms</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="150" y="48" width="260" height="46" rx="6" fill="#2C4A3E"/>
    <text x="280" y="68" font-size="12" font-weight="700" fill="#FBF8F1">1. Cues arrive (~100 ms)</text>
    <text x="280" y="84" font-size="11" fill="#FBF8F1">face, posture, voice, clothing</text>
    <path d="M280 98 V108 M140 108 H420 M140 108 V120 M420 108 V120" fill="none" stroke="#8B6F4E" stroke-width="2"/>
    <rect x="40" y="122" width="200" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="140" y="143" font-size="12" font-weight="700" fill="#1F1B16">2a. Warmth?</text>
    <text x="140" y="160" font-size="11" fill="#4A443C">friend or threat</text>
    <rect x="320" y="122" width="200" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="420" y="143" font-size="12" font-weight="700" fill="#1F1B16">2b. Competence?</text>
    <text x="420" y="160" font-size="11" fill="#4A443C">able to act on it</text>
    <path d="M140 176 V188 M420 176 V188 M140 188 H420 M280 188 V198" fill="none" stroke="#8B6F4E" stroke-width="2"/>
    <rect x="150" y="200" width="260" height="46" rx="6" fill="#8B6F4E"/>
    <text x="280" y="220" font-size="12" font-weight="700" fill="#FBF8F1">3. Snap verdict</text>
    <text x="280" y="236" font-size="11" fill="#FBF8F1">more time mostly adds confidence</text>
    <text x="280" y="264" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="150" y="272" width="260" height="46" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="280" y="292" font-size="12" font-weight="700" fill="#1F1B16">4. Halo spreads</text>
    <text x="280" y="308" font-size="11" fill="#4A443C">unrelated traits rated to match</text>
    <text x="280" y="336" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="150" y="344" width="260" height="46" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="280" y="364" font-size="12" font-weight="700" fill="#1F1B16">5. Later info read through it</text>
    <text x="280" y="380" font-size="11" fill="#4A443C">same answer, different meaning</text>
    <path d="M410 367 H500 V223 H414" fill="none" stroke="#2C4A3E" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="520" y="300" font-size="10" fill="#2C4A3E" transform="rotate(90 520 300)">revision loop</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">
    <rect x="40" y="414" width="480" height="66" rx="6" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="280" y="436" text-anchor="middle" font-weight="700">What revises a verdict</text>
    <text x="280" y="453" text-anchor="middle" fill="#4A443C">Clearly diagnostic new information that reframes the first cues,</text>
    <text x="280" y="469" text-anchor="middle" fill="#4A443C">not time alone or one small gesture (Mann &amp; Ferguson, 2015).</text>
  </g>
</svg>
