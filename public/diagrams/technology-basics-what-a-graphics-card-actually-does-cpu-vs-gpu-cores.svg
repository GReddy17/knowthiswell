<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cpuGpuTitle">
  <title id="cpuGpuTitle">Diagram comparing a CPU's small number of large, complex cores handling tasks one after another to a GPU's thousands of small, simple cores handling the same kind of task on many pieces of data at once</title>
  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <text x="160" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="700" fill="#1F1B16">CPU</text>
  <text x="480" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="700" fill="#1F1B16">GPU</text>
  <text x="160" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">few, powerful cores</text>
  <text x="480" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">thousands of simple cores</text>

  <!-- CPU: 4 big cores -->
  <g>
    <rect x="70" y="80" width="80" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="160" y="80" width="80" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="70" y="170" width="80" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="160" y="170" width="80" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="110" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Core 1</text>
    <text x="200" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Core 2</text>
    <text x="110" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Core 3</text>
    <text x="200" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Core 4</text>
  </g>
  <text x="160" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Good at: varied, sequential,</text>
  <text x="160" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">branching logic — one task at a time, fast</text>

  <!-- GPU: grid of tiny cores -->
  <g fill="#C9412C" opacity="0.8">
    <!-- 10 columns x 8 rows small squares -->
  </g>
  <g transform="translate(400,80)">
    <rect x="-10" y="-10" width="180" height="170" fill="none" stroke="#2C4A3E" stroke-width="2" rx="6"/>
    <g fill="#C9412C" opacity="0.85">
      <!-- generate grid programmatically-ish, manual rows -->
      <g id="row"></g>
    </g>
    <g fill="#C9412C" opacity="0.85">
      <rect x="0" y="0" width="12" height="12"/><rect x="18" y="0" width="12" height="12"/><rect x="36" y="0" width="12" height="12"/><rect x="54" y="0" width="12" height="12"/><rect x="72" y="0" width="12" height="12"/><rect x="90" y="0" width="12" height="12"/><rect x="108" y="0" width="12" height="12"/><rect x="126" y="0" width="12" height="12"/><rect x="144" y="0" width="12" height="12"/>
      <rect x="0" y="18" width="12" height="12"/><rect x="18" y="18" width="12" height="12"/><rect x="36" y="18" width="12" height="12"/><rect x="54" y="18" width="12" height="12"/><rect x="72" y="18" width="12" height="12"/><rect x="90" y="18" width="12" height="12"/><rect x="108" y="18" width="12" height="12"/><rect x="126" y="18" width="12" height="12"/><rect x="144" y="18" width="12" height="12"/>
      <rect x="0" y="36" width="12" height="12"/><rect x="18" y="36" width="12" height="12"/><rect x="36" y="36" width="12" height="12"/><rect x="54" y="36" width="12" height="12"/><rect x="72" y="36" width="12" height="12"/><rect x="90" y="36" width="12" height="12"/><rect x="108" y="36" width="12" height="12"/><rect x="126" y="36" width="12" height="12"/><rect x="144" y="36" width="12" height="12"/>
      <rect x="0" y="54" width="12" height="12"/><rect x="18" y="54" width="12" height="12"/><rect x="36" y="54" width="12" height="12"/><rect x="54" y="54" width="12" height="12"/><rect x="72" y="54" width="12" height="12"/><rect x="90" y="54" width="12" height="12"/><rect x="108" y="54" width="12" height="12"/><rect x="126" y="54" width="12" height="12"/><rect x="144" y="54" width="12" height="12"/>
      <rect x="0" y="72" width="12" height="12"/><rect x="18" y="72" width="12" height="12"/><rect x="36" y="72" width="12" height="12"/><rect x="54" y="72" width="12" height="12"/><rect x="72" y="72" width="12" height="12"/><rect x="90" y="72" width="12" height="12"/><rect x="108" y="72" width="12" height="12"/><rect x="126" y="72" width="12" height="12"/><rect x="144" y="72" width="12" height="12"/>
      <rect x="0" y="90" width="12" height="12"/><rect x="18" y="90" width="12" height="12"/><rect x="36" y="90" width="12" height="12"/><rect x="54" y="90" width="12" height="12"/><rect x="72" y="90" width="12" height="12"/><rect x="90" y="90" width="12" height="12"/><rect x="108" y="90" width="12" height="12"/><rect x="126" y="90" width="12" height="12"/><rect x="144" y="90" width="12" height="12"/>
      <rect x="0" y="108" width="12" height="12"/><rect x="18" y="108" width="12" height="12"/><rect x="36" y="108" width="12" height="12"/><rect x="54" y="108" width="12" height="12"/><rect x="72" y="108" width="12" height="12"/><rect x="90" y="108" width="12" height="12"/><rect x="108" y="108" width="12" height="12"/><rect x="126" y="108" width="12" height="12"/><rect x="144" y="108" width="12" height="12"/>
      <rect x="0" y="126" width="12" height="12"/><rect x="18" y="126" width="12" height="12"/><rect x="36" y="126" width="12" height="12"/><rect x="54" y="126" width="12" height="12"/><rect x="72" y="126" width="12" height="12"/><rect x="90" y="126" width="12" height="12"/><rect x="108" y="126" width="12" height="12"/><rect x="126" y="126" width="12" height="12"/><rect x="144" y="126" width="12" height="12"/>
    </g>
  </g>
  <text x="480" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Good at: the same simple math</text>
  <text x="480" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">(shading a pixel) on millions of pixels at once</text>

  <text x="320" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Every frame, the GPU shades every pixel in parallel instead of one by one</text>
  <text x="320" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">— which is why it renders far faster than a CPU could for this specific kind of work.</text>
</svg>
