<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="studFinderTitle">
  <title id="studFinderTitle">A cross-section of a wall showing a capacitive stud finder sliding along the drywall surface: over an empty hollow cavity its sensing field stays small and the indicator stays off, but over a wood stud the denser material shifts the sensor's electric field and lights the indicator, showing the tool reacts to a change in material density behind the wall rather than to metal.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">A capacitive stud finder reacts to density, not metal</text>

  <!-- drywall surface -->
  <rect x="60" y="70" width="660" height="18" fill="#E8DEC8" stroke="#4A443C" stroke-width="1.5"/>
  <text x="60" y="63" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">drywall surface</text>

  <!-- wall cavity -->
  <rect x="60" y="88" width="660" height="140" fill="#FBF8F1" stroke="#4A443C" stroke-width="1.5"/>

  <!-- studs -->
  <rect x="170" y="88" width="42" height="140" fill="#8B6F4E"/>
  <rect x="470" y="88" width="42" height="140" fill="#8B6F4E"/>
  <text x="191" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">wood stud (dense)</text>
  <text x="491" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">wood stud (dense)</text>
  <text x="340" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">hollow cavity (air)</text>

  <!-- device A over hollow, no reading -->
  <rect x="300" y="35" width="80" height="26" rx="5" fill="#4A443C"/>
  <circle cx="340" cy="48" r="5" fill="#B0A98F"/>
  <text x="340" y="24" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">no reading</text>
  <path d="M320,61 A 20,10 0 0 0 360,61" fill="none" stroke="#4A443C" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- device B over stud, lit -->
  <rect x="151" y="35" width="80" height="26" rx="5" fill="#4A443C"/>
  <circle cx="191" cy="48" r="5" fill="#2C4A3E"/>
  <text x="191" y="24" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2C4A3E">stud detected</text>
  <path d="M156,61 A 35,26 0 0 0 226,61" fill="none" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="390" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">The sensor's field changes when denser material (wood) replaces air behind the wall — a magnetic stud finder instead looks for the metal fasteners inside the stud.</text>
</svg>
