<svg viewBox="0 0 560 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cfCompTitle">
  <title id="cfCompTitle">Profit versus cash flow: profit counts a sale when it is earned; cash flow counts money when it actually arrives or leaves, so a profitable business can still run out of cash.</title>
  <rect width="560" height="336" fill="#FBF8F1"/>
  <rect x="20" y="20" width="250" height="56" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="145" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Profit</text>
  <text x="145" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">(income statement)</text>
  <rect x="20" y="92" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Counts a sale when you invoice it</text>
  <rect x="20" y="136" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Ignores when the customer pays</text>
  <rect x="20" y="180" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Spreads equipment cost over years</text>
  <rect x="20" y="224" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Answers: is the business worth running?</text>
  <rect x="290" y="20" width="250" height="56" rx="6" fill="#2C4A3E"/>
  <text x="415" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">Cash flow</text>
  <text x="415" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">(bank account reality)</text>
  <rect x="290" y="92" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Counts money when it actually lands</text>
  <rect x="290" y="136" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Late payers drain it immediately</text>
  <rect x="290" y="180" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Equipment hits cash all at once</text>
  <rect x="290" y="224" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Answers: can we pay bills this week?</text>
  <text x="280" y="314" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Profitable on paper, broke in the bank: the gap is timing</text>
</svg>
