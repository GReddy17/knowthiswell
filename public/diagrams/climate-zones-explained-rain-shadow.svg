<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rainShadowTitle">
  <title id="rainShadowTitle">Cross-section diagram of a mountain range showing moist air rising on the windward side, cooling and dropping rain, then descending as dry air on the leeward side, creating a rain shadow desert region on that side of the mountain despite both sides being at the same latitude</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="24" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15.5" font-weight="600" fill="#1F1B16">How mountains create a rain shadow</text>

  <!-- same-latitude reference -->
  <line x1="20" y1="60" x2="620" y2="60" stroke="#E3DCC9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="320" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">both sides sit at the same latitude</text>

  <!-- ocean -->
  <rect x="0" y="310" width="150" height="40" fill="#5B7A99" opacity="0.32"/>
  <path d="M10,318 Q20,313 30,318 T50,318 T70,318" stroke="#3D6A83" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M10,330 Q20,325 30,330 T50,330 T70,330" stroke="#3D6A83" stroke-width="1.2" fill="none" opacity="0.6"/>
  <text x="60" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#3D6A83">Ocean</text>

  <!-- mountain: windward (wet, green) and leeward (dry, brown) halves -->
  <path d="M150,350 L340,80 L340,350 Z" fill="#2C4A3E" opacity="0.82"/>
  <path d="M340,80 L530,350 L340,350 Z" fill="#8B6F4E" opacity="0.82"/>
  <line x1="340" y1="80" x2="340" y2="350" stroke="#1F1B16" stroke-width="1" opacity="0.35"/>

  <!-- desert ground on leeward side -->
  <rect x="530" y="330" width="110" height="20" fill="#E3DCC9"/>
  <path d="M545,330 Q560,320 575,330 Z" fill="#D8CFBB"/>
  <path d="M585,330 Q605,315 622,330 Z" fill="#D8CFBB"/>
  <path d="M600,325 L600,312 M600,318 L593,312 M600,318 L607,312" stroke="#6B7A4A" stroke-width="1.5" fill="none"/>
  <text x="585" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#6B5636">rain shadow desert</text>

  <!-- cloud + rain over windward peak -->
  <g fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.3">
    <circle cx="258" cy="128" r="15"/>
    <circle cx="278" cy="120" r="19"/>
    <circle cx="300" cy="130" r="14"/>
  </g>
  <g stroke="#3D6A83" stroke-width="1.5" stroke-linecap="round">
    <line x1="255" y1="148" x2="248" y2="168"/>
    <line x1="272" y1="150" x2="265" y2="172"/>
    <line x1="290" y1="148" x2="284" y2="168"/>
  </g>
  <text x="278" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">rain falls</text>

  <!-- moist air rising, windward -->
  <path d="M95,300 C150,255 210,205 250,165" fill="none" stroke="#3D6A83" stroke-width="2.4" marker-end="url(#rsArrow)"/>
  <text x="120" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3D6A83">moist air rises</text>
  <text x="120" y="267" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3D6A83">&amp; cools</text>

  <!-- dry air descending, leeward -->
  <path d="M368,112 C420,175 470,240 505,295" fill="none" stroke="#C97C3D" stroke-width="2.4" marker-end="url(#rsArrow2)"/>
  <text x="450" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8A4A1E">dry air descends</text>
  <text x="450" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8A4A1E">&amp; warms</text>

  <defs>
    <marker id="rsArrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3D6A83"/>
    </marker>
    <marker id="rsArrow2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C97C3D"/>
    </marker>
  </defs>

  <text x="245" y="375" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Windward side</text>
  <text x="245" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">wetter, vegetated</text>
  <text x="435" y="375" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Leeward side</text>
  <text x="435" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">dry, in the rain shadow</text>
</svg>
