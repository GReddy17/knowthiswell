<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="photodegTitle">
  <title id="photodegTitle">A left-to-right timeline showing a whole plastic bottle on the left, then a cracked and brittle bottle in the middle-left under a sun icon representing UV exposure, then medium plastic fragments in the middle-right, and finally a cluster of tiny microplastic dots on the right, with a caption noting the material persists rather than disappearing at each stage</title>
  <rect width="900" height="260" fill="#FBF8F1"/>

  <!-- sun icon above -->
  <circle cx="450" cy="45" r="18" fill="#EDE7D8" stroke="#B5493A" stroke-width="2"/>
  <g stroke="#B5493A" stroke-width="2">
    <line x1="450" y1="15" x2="450" y2="5"/>
    <line x1="450" y1="75" x2="450" y2="85"/>
    <line x1="420" y1="45" x2="410" y2="45"/>
    <line x1="480" y1="45" x2="490" y2="45"/>
    <line x1="429" y1="24" x2="422" y2="17"/>
    <line x1="471" y1="24" x2="478" y2="17"/>
  </g>
  <text x="450" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">UV exposure over years</text>

  <!-- Stage 1: whole bottle -->
  <rect x="40" y="130" width="150" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M110 145 h20 v8 h6 v12 h-32 v-12 h6 z" fill="#7FA98B" stroke="#2C4A3E" stroke-width="1.4"/>
  <rect x="98" y="165" width="44" height="45" rx="6" fill="#7FA98B" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="115" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16" font-weight="600">Whole bottle</text>

  <path d="M198 175 L232 175" stroke="#B5493A" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Stage 2: brittle cracked bottle -->
  <rect x="234" y="130" width="150" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M292 165 L300 175 L294 185 L302 195 L296 210 L336 210 L330 195 L338 185 L332 175 L340 165 Z" fill="#A9C2B0" stroke="#2C4A3E" stroke-width="1.4"/>
  <line x1="300" y1="170" x2="316" y2="190" stroke="#4A443C" stroke-width="1"/>
  <line x1="330" y1="172" x2="316" y2="195" stroke="#4A443C" stroke-width="1"/>
  <text x="309" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16" font-weight="600">Brittle, cracking</text>

  <path d="M392 175 L426 175" stroke="#B5493A" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Stage 3: medium fragments -->
  <rect x="428" y="130" width="180" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <polygon points="460,170 480,160 495,175 480,190" fill="#C9D9CD" stroke="#2C4A3E" stroke-width="1.2"/>
  <polygon points="510,165 528,172 520,192 500,185" fill="#C9D9CD" stroke="#2C4A3E" stroke-width="1.2"/>
  <polygon points="545,175 565,168 570,188 550,195" fill="#C9D9CD" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="518" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16" font-weight="600">Medium fragments</text>

  <path d="M610 175 L644 175" stroke="#B5493A" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Stage 4: microplastics -->
  <rect x="646" y="130" width="215" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2.5"/>
  <g fill="#B5493A">
    <circle cx="680" cy="160" r="2.5"/>
    <circle cx="695" cy="175" r="2"/>
    <circle cx="710" cy="158" r="2.2"/>
    <circle cx="725" cy="180" r="2.5"/>
    <circle cx="740" cy="165" r="2"/>
    <circle cx="755" cy="185" r="2.3"/>
    <circle cx="770" cy="160" r="2"/>
    <circle cx="785" cy="178" r="2.4"/>
    <circle cx="800" cy="165" r="2"/>
    <circle cx="690" cy="195" r="2.2"/>
    <circle cx="720" cy="200" r="2"/>
    <circle cx="760" cy="198" r="2.3"/>
    <circle cx="795" cy="195" r="2"/>
  </g>
  <text x="753" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16" font-weight="600">Microplastics (&lt;5mm)</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/>
    </marker>
  </defs>
</svg>
