<svg viewBox="0 0 780 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gwCcTitle">
  <title id="gwCcTitle">A large outer circle labeled climate change containing several smaller connected circles labeled rising average temperature (global warming), shifting precipitation patterns, more intense storms in some regions, melting ice and rising seas, and disrupted circulation causing regional cold snaps, illustrating that global warming is one specific measurement inside the broader set of climate change effects.</title>
  <rect width="780" height="460" fill="#FBF8F1"/>

  <circle cx="390" cy="240" r="205" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1F1B16">Climate change</text>

  <circle cx="390" cy="240" r="80" fill="#EDE7D8" stroke="#B5493A" stroke-width="2.5"/>
  <text x="390" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Rising average</text>
  <text x="390" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">temperature</text>
  <text x="390" y="267" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">(global warming)</text>

  <!-- surrounding effect bubbles -->
  <circle cx="220" cy="120" r="62" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="220" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Shifting</text>
  <text x="220" y="127" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">precipitation</text>

  <circle cx="560" cy="120" r="62" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="560" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">More intense</text>
  <text x="560" y="127" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">storms</text>

  <circle cx="180" cy="330" r="62" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="180" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Melting ice,</text>
  <text x="180" y="337" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">rising seas</text>

  <circle cx="600" cy="330" r="62" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="600" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">Disrupted circulation,</text>
  <text x="600" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">regional cold</text>
  <text x="600" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">snaps</text>

  <!-- connecting lines from center -->
  <line x1="335" y1="195" x2="255" y2="150" stroke="#4A443C" stroke-width="1.4"/>
  <line x1="445" y1="195" x2="525" y2="150" stroke="#4A443C" stroke-width="1.4"/>
  <line x1="335" y1="285" x2="225" y2="310" stroke="#4A443C" stroke-width="1.4"/>
  <line x1="450" y1="285" x2="555" y2="310" stroke="#4A443C" stroke-width="1.4"/>

  <text x="390" y="440" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Global warming is one measured driver inside the broader climate change umbrella.</text>
</svg>
