<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="disputedFrameworkTitle">
  <title id="disputedFrameworkTitle">Three-column diagram labeled 'who administers it day to day (de facto control)', 'who else claims it (competing sovereignty claims)', and 'what have neutral bodies like the UN said (resolutions, referenda, mediation status)', each illustrated with a simplified icon, showing how these three separate questions combine to form a complete, neutral picture of any disputed territory</title>
  <rect width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15.5" font-weight="600" fill="#1F1B16">Three questions for reading any disputed region</text>

  <!-- three columns -->
  <g>
    <rect x="20" y="50" width="190" height="270" rx="6" fill="#EEF3EE" opacity="0.55" stroke="#E3DCC9"/>
    <rect x="225" y="50" width="190" height="270" rx="6" fill="#EEF3EE" opacity="0.55" stroke="#E3DCC9"/>
    <rect x="430" y="50" width="190" height="270" rx="6" fill="#EEF3EE" opacity="0.55" stroke="#E3DCC9"/>
  </g>

  <!-- column 1: de facto control -->
  <g>
    <circle cx="115" cy="100" r="26" fill="none" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="103" y="88" width="24" height="18" fill="#2C4A3E"/>
    <path d="M 103,88 L 115,76 L 127,88 Z" fill="#2C4A3E"/>
    <text x="115" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Who administers it</text>
    <text x="115" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">day to day</text>
    <text x="115" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">De facto control:</text>
    <text x="115" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">police, schools, courts,</text>
    <text x="115" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">and government offices</text>
    <text x="115" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">actually running there</text>
  </g>

  <!-- column 2: competing claims -->
  <g>
    <circle cx="320" cy="100" r="26" fill="none" stroke="#B24A38" stroke-width="2"/>
    <rect x="299" y="93" width="18" height="12" fill="#B24A38"/>
    <rect x="323" y="93" width="18" height="12" fill="#5B7A99"/>
    <line x1="320" y1="80" x2="320" y2="120" stroke="#1F1B16" stroke-width="1.5"/>
    <text x="320" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Who else claims it</text>
    <text x="320" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Competing sovereignty</text>
    <text x="320" y="181" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">claims: one or more other</text>
    <text x="320" y="197" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">states formally assert</text>
    <text x="320" y="213" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">the same territory</text>
  </g>

  <!-- column 3: neutral bodies -->
  <g>
    <circle cx="525" cy="100" r="26" fill="none" stroke="#8B6F4E" stroke-width="2"/>
    <path d="M 525,86 L 525,114 M 511,93 L 539,93" stroke="#8B6F4E" stroke-width="1.6"/>
    <path d="M 511,93 Q 511,105 503,105 Q 495,105 495,93 Z" fill="none" stroke="#8B6F4E" stroke-width="1.3"/>
    <path d="M 539,93 Q 539,105 547,105 Q 555,105 555,93 Z" fill="none" stroke="#8B6F4E" stroke-width="1.3"/>
    <rect x="514" y="112" width="22" height="5" fill="#8B6F4E"/>
    <text x="525" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">What neutral bodies</text>
    <text x="525" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">like the UN have said</text>
    <text x="525" y="181" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Resolutions, referenda,</text>
    <text x="525" y="197" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">and mediation status</text>
    <text x="525" y="213" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">from outside observers</text>
  </g>

  <!-- plus signs between columns -->
  <text x="217" y="105" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" fill="#8B6F4E">+</text>
  <text x="422" y="105" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" fill="#8B6F4E">+</text>

  <!-- combined result banner -->
  <rect x="70" y="342" width="500" height="46" rx="6" fill="#2C4A3E"/>
  <text x="320" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">Together: a complete, neutral picture</text>
  <text x="320" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#EEF3EE">of any disputed territory — without declaring a single "right" answer</text>
</svg>
