<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="leverClassesTitle">
  <title id="leverClassesTitle">Three lever classes shown as a bar with a fulcrum triangle and downward effort and load arrows: first class with the fulcrum between effort and load like a seesaw, second class with the load between the fulcrum and effort like a wheelbarrow, and third class with the effort between the fulcrum and load like a fishing rod or forearm</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">
    <path d="M 20,32 L 12,44 L 28,44 Z" fill="#2C4A3E"/>
    <text x="34" y="42">Fulcrum</text>
    <line x1="110" y1="24" x2="110" y2="42" stroke="#C9412C" stroke-width="2.5"/>
    <path d="M 110,42 L 105,34 M 110,42 L 115,34" stroke="#C9412C" stroke-width="2.5" fill="none"/>
    <text x="120" y="42">Effort (E)</text>
    <line x1="220" y1="24" x2="220" y2="42" stroke="#8B6F4E" stroke-width="2.5"/>
    <path d="M 220,42 L 215,34 M 220,42 L 225,34" stroke="#8B6F4E" stroke-width="2.5" fill="none"/>
    <text x="230" y="42">Load (L)</text>
  </g>

  <!-- row 1: first class -->
  <line x1="100" y1="110" x2="540" y2="110" stroke="#1F1B16" stroke-width="4" stroke-linecap="round"/>
  <path d="M 320,110 L 300,140 L 340,140 Z" fill="#2C4A3E"/>
  <g stroke="#C9412C" stroke-width="2.5" fill="none">
    <line x1="140" y1="70" x2="140" y2="105"/>
    <path d="M 140,105 L 134,95 M 140,105 L 146,95"/>
  </g>
  <text x="140" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#C9412C">E</text>
  <g stroke="#8B6F4E" stroke-width="2.5" fill="none">
    <line x1="500" y1="70" x2="500" y2="105"/>
    <path d="M 500,105 L 494,95 M 500,105 L 506,95"/>
  </g>
  <text x="500" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8B6F4E">L</text>
  <text x="320" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16"><tspan font-weight="600">1st class</tspan> — fulcrum between effort and load (seesaw)</text>

  <!-- row 2: second class -->
  <line x1="100" y1="230" x2="540" y2="230" stroke="#1F1B16" stroke-width="4" stroke-linecap="round"/>
  <path d="M 140,230 L 120,260 L 160,260 Z" fill="#2C4A3E"/>
  <g stroke="#8B6F4E" stroke-width="2.5" fill="none">
    <line x1="320" y1="190" x2="320" y2="225"/>
    <path d="M 320,225 L 314,215 M 320,225 L 326,215"/>
  </g>
  <text x="320" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8B6F4E">L</text>
  <g stroke="#C9412C" stroke-width="2.5" fill="none">
    <line x1="500" y1="190" x2="500" y2="225"/>
    <path d="M 500,225 L 494,215 M 500,225 L 506,215"/>
  </g>
  <text x="500" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#C9412C">E</text>
  <text x="320" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16"><tspan font-weight="600">2nd class</tspan> — load between fulcrum and effort (wheelbarrow)</text>

  <!-- row 3: third class -->
  <line x1="100" y1="350" x2="540" y2="350" stroke="#1F1B16" stroke-width="4" stroke-linecap="round"/>
  <path d="M 140,350 L 120,380 L 160,380 Z" fill="#2C4A3E"/>
  <g stroke="#C9412C" stroke-width="2.5" fill="none">
    <line x1="320" y1="310" x2="320" y2="345"/>
    <path d="M 320,345 L 314,335 M 320,345 L 326,335"/>
  </g>
  <text x="320" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#C9412C">E</text>
  <g stroke="#8B6F4E" stroke-width="2.5" fill="none">
    <line x1="500" y1="310" x2="500" y2="345"/>
    <path d="M 500,345 L 494,335 M 500,345 L 506,335"/>
  </g>
  <text x="500" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8B6F4E">L</text>
  <text x="320" y="408" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16"><tspan font-weight="600">3rd class</tspan> — effort between fulcrum and load (fishing rod, forearm)</text>
</svg>
