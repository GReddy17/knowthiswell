<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dvFormulaTitle">
  <title id="dvFormulaTitle">A flow diagram showing a nutrition label's sodium amount of 460 milligrams divided by the Daily Value reference of 2300 milligrams, multiplied by 100, resulting in a Percent Daily Value of 20 percent, with a scale below showing 5 percent as the low threshold and 20 percent as the high threshold per FDA guidance.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <rect x="20" y="40" width="140" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="90" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">460 mg</text>
  <text x="90" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">sodium in serving</text>

  <text x="178" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">/</text>

  <rect x="196" y="40" width="150" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="271" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">2,300 mg</text>
  <text x="271" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Daily Value ref.</text>

  <text x="364" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">x100</text>

  <text x="410" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">=</text>

  <rect x="430" y="30" width="130" height="90" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="495" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1F1B16">20%</text>
  <text x="495" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Daily Value</text>

  <!-- scale -->
  <line x1="80" y1="200" x2="700" y2="200" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="80" y1="190" x2="80" y2="210" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="700" y1="190" x2="700" y2="210" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="230" cy="200" r="5" fill="#2C4A3E"/>
  <text x="230" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">5% — low</text>
  <circle cx="450" cy="200" r="5" fill="#B5493A"/>
  <text x="450" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">20% — high</text>
  <circle cx="450" cy="200" r="9" fill="none" stroke="#B5493A" stroke-width="2"/>
  <text x="450" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">this example lands here</text>
</svg>
