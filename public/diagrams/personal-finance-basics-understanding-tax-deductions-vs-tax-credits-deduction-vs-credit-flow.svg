<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dedCredFlowTitle">
  <title id="dedCredFlowTitle">A left-to-right flow diagram showing Gross Income, then an arrow labeled minus Deduction leading into Taxable Income, then an arrow labeled times Tax Rate leading into Tax Owed Before Credits, then a final arrow labeled minus Credit leading into Final Tax Bill, showing the deduction acts before the rate is applied and the credit acts after</title>
  <rect width="760" height="200" fill="#FBF8F1"/>

  <rect x="15" y="70" width="140" height="60" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Gross Income</text>

  <text x="185" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">− Deduction</text>
  <path d="M165 100 L215 100" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="225" y="70" width="140" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="295" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Taxable</text>
  <text x="295" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Income</text>

  <text x="400" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">× Tax Rate</text>
  <path d="M375 100 L430 100" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="70" width="150" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="515" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Tax Owed</text>
  <text x="515" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">(Before Credits)</text>

  <text x="628" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">− Credit</text>
  <path d="M600 100 L655 100" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="70" width="0" height="0"/>
  <rect x="655" y="70" width="95" height="60" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="702" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Final Tax</text>
  <text x="702" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Bill</text>

  <text x="295" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Deduction acts before the rate — value depends on the rate</text>
  <text x="700" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Credit acts after — full face value</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
