<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="voterFlowTitle">
  <title id="voterFlowTitle">A flow diagram showing four sequential steps: Confirm Eligibility, Submit Registration Application by the Deadline, Added to Voter Roll, and Vote on Election Day, with a note that the registration deadline typically falls before election day, not on it</title>
  <rect width="720" height="260" fill="#FBF8F1"/>

  <rect x="20" y="60" width="150" height="70" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="95" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Confirm</text>
  <text x="95" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Eligibility</text>

  <rect x="200" y="60" width="150" height="70" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="275" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Submit Registration</text>
  <text x="275" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">by the Deadline</text>
  <text x="275" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">(before election day)</text>

  <rect x="380" y="60" width="150" height="70" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="455" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Added to</text>
  <text x="455" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Voter Roll</text>

  <rect x="560" y="60" width="150" height="70" rx="6" fill="#2C4A3E"/>
  <text x="635" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Vote on</text>
  <text x="635" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Election Day</text>

  <line x1="170" y1="95" x2="200" y2="95" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="350" y1="95" x2="380" y2="95" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="530" y1="95" x2="560" y2="95" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow3)"/>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="360" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The registration deadline typically falls weeks before election day — not on it</text>
</svg>
