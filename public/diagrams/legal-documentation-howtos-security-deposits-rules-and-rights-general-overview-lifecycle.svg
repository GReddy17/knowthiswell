<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="640" height="260" fill="#FBF8F1"/>

  <g>
    <rect x="20" y="90" width="130" height="70" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="85" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">Deposit paid</text>
    <text x="85" y="136" text-anchor="middle" font-size="11" fill="#4A443C">at move-in</text>
  </g>

  <path d="M150 125 L188 125" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="188" y="90" width="130" height="70" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="253" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">Held during</text>
    <text x="253" y="136" text-anchor="middle" font-size="11" fill="#4A443C">tenancy</text>
  </g>

  <path d="M318 125 L356 125" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="356" y="90" width="130" height="70" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="421" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">Move-out</text>
    <text x="421" y="136" text-anchor="middle" font-size="11" fill="#4A443C">inspection</text>
  </g>

  <path d="M486 125 L524 125" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="524" y="80" width="100" height="90" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
    <text x="574" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">Return</text>
    <text x="574" y="126" text-anchor="middle" font-size="11" fill="#4A443C">full deposit</text>
    <text x="574" y="146" text-anchor="middle" font-size="11" fill="#4A443C">or itemized</text>
    <text x="574" y="160" text-anchor="middle" font-size="11" fill="#4A443C">deductions</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#4A443C">Legally, it remains the tenant&#8217;s money at every stage until legitimately deducted</text>
</svg>
