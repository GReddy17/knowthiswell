<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ponziFlowTitle">
  <title id="ponziFlowTitle">A circular flow diagram showing new investor money flowing into a central operator box, which redirects that money out to pay earlier investors labeled as returns, with no separate box representing any real investment or profit-generating activity anywhere in the loop, and a growing arrow labeled more new investors needed each cycle to sustain the payouts.</title>
  <rect width="620" height="340" fill="#FBF8F1"/>

  <rect x="230" y="140" width="160" height="60" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
  <text x="310" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Operator</text>
  <text x="310" y="183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(no real investment)</text>

  <rect x="40" y="40" width="150" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="115" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">New investor money</text>

  <rect x="430" y="40" width="150" height="50" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="505" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Paid to earlier</text>
  <text x="505" y="79" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">investors as "returns"</text>

  <path d="M115 90 L115 120 L245 145" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M375 150 L505 120 L505 90" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M505 90 Q560 20 310 20 Q60 20 115 90" fill="none" stroke="#B5493A" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRust)"/>
  <text x="310" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#B5493A">reinvestment + referrals bring in the next round</text>

  <rect x="200" y="250" width="220" height="50" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="310" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Requires a GROWING pool of</text>
  <text x="310" y="289" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">new investors every cycle</text>
  <path d="M310 200 L310 245" fill="none" stroke="#B5493A" stroke-width="2" marker-end="url(#arrowRust)"/>

  <text x="310" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">No box represents real profit-generating activity — every payout is redirected investor money.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2C4A3E"/></marker>
    <marker id="arrowRust" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B5493A"/></marker>
  </defs>
</svg>
