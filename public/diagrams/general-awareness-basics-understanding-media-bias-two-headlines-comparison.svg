<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="biasHeadlineTitle">
  <title id="biasHeadlineTitle">Two headline cards side by side reporting the same underlying event — one reading "Company Cuts Jobs Despite Record Profits" and the other reading "Company Streamlines Operations, Reports Record Profits" — connected below by a shared box labeled "same underlying facts, different framing".</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <rect x="30" y="30" width="330" height="110" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="195" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">"Company Cuts Jobs</text>
  <text x="195" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Despite Record Profits"</text>
  <text x="195" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Outlet A</text>

  <rect x="420" y="30" width="330" height="110" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="585" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">"Company Streamlines</text>
  <text x="585" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Operations, Reports Record Profits"</text>
  <text x="585" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Outlet B</text>

  <line x1="195" y1="140" x2="330" y2="190" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="585" y1="140" x2="450" y2="190" stroke="#2C4A3E" stroke-width="1.6"/>

  <rect x="230" y="190" width="320" height="55" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Same underlying facts,</text>
  <text x="390" y="233" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">different framing</text>
</svg>
