<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="680" height="260" fill="#FBF8F1"/>
  <!-- Step boxes -->
  <g>
    <rect x="20" y="40" width="140" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="90" y="70" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">Will drafted,</text>
    <text x="90" y="86" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">signed &amp; witnessed</text>
  </g>
  <path d="M160 80 H190" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="190" y="40" width="140" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="260" y="80" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">Testator dies</text>
  </g>
  <path d="M330 80 H360" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="360" y="40" width="150" height="80" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="435" y="70" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">Executor files will</text>
    <text x="435" y="86" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">with probate court</text>
  </g>
  <path d="M510 80 H540" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="540" y="40" width="120" height="80" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="600" y="65" text-anchor="middle" font-size="11" fill="#1F1B16" font-weight="600">Court validates,</text>
    <text x="600" y="80" text-anchor="middle" font-size="11" fill="#1F1B16" font-weight="600">debts paid,</text>
    <text x="600" y="95" text-anchor="middle" font-size="11" fill="#1F1B16" font-weight="600">estate distributed</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <rect x="20" y="150" width="640" height="70" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="340" y="178" text-anchor="middle" font-size="12" fill="#4A443C">A defect anywhere earlier (missing witness, unsigned page) can prevent</text>
  <text x="340" y="196" text-anchor="middle" font-size="12" fill="#4A443C">court validation — diverting the estate into default intestate succession</text>
  <text x="340" y="214" text-anchor="middle" font-size="12" fill="#4A443C">instead of following the testator's actual written wishes.</text>
</svg>
