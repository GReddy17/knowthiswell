<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exprPartsTitle">
  <title id="exprPartsTitle">The expression 4x plus 7 minus 2 labeled piece by piece: 4 is the coefficient, x is the variable, 4x together is a term, 7 and negative 2 are each constant terms, and the plus and minus signs are labeled operators</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- the expression itself -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700">
    <text x="130" y="215" fill="#20362D">4</text>
    <text x="175" y="215" fill="#3D6A83">x</text>
    <text x="225" y="215" fill="#4A443C">+</text>
    <text x="280" y="215" fill="#C9412C">7</text>
    <text x="335" y="215" fill="#4A443C">−</text>
    <text x="390" y="215" fill="#C9412C">2</text>
  </g>

  <!-- term bracket over 4x -->
  <path d="M 122,168 Q 122,158 132,158 L 195,158 Q 205,158 205,168" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <text x="163" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">term</text>

  <!-- operator callouts, above -->
  <line x1="235" y1="192" x2="235" y2="172" stroke="#4A443C" stroke-width="1.5"/>
  <text x="235" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">operator</text>
  <line x1="343" y1="192" x2="343" y2="172" stroke="#4A443C" stroke-width="1.5"/>
  <text x="343" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">operator</text>

  <!-- coefficient / variable callouts, below -->
  <line x1="140" y1="228" x2="140" y2="255" stroke="#20362D" stroke-width="1.5"/>
  <text x="140" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#20362D">coefficient</text>

  <line x1="181" y1="228" x2="181" y2="300" stroke="#3D6A83" stroke-width="1.5"/>
  <text x="181" y="317" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#3D6A83">variable</text>

  <!-- constant term callouts, below -->
  <line x1="286" y1="228" x2="286" y2="255" stroke="#C9412C" stroke-width="1.5"/>
  <text x="286" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C9412C">constant term</text>

  <line x1="396" y1="228" x2="396" y2="300" stroke="#C9412C" stroke-width="1.5"/>
  <text x="396" y="317" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C9412C">constant term (−2)</text>

  <!-- footer note -->
  <rect x="90" y="355" width="460" height="46" rx="10" fill="#EDE7D8" stroke="#E3DCC9"/>
  <text x="320" y="375" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">An expression is built from terms separated by + or − signs.</text>
  <text x="320" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Each variable term has a coefficient; a term with no variable is a constant.</text>
</svg>
