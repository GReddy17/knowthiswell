<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="refundRuleTitle">
  <title id="refundRuleTitle">A comparison diagram splitting refund situations into two paths: store policy covering simple change-of-mind returns, versus legal right covering defective products, cooling-off rule cancellations, and prorated refunds for unused prepaid services</title>
  <rect width="700" height="340" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="30" y="30" width="290" height="270" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="175" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1F1B16">Store policy</text>
    <line x1="60" y1="72" x2="290" y2="72" stroke="#2C4A3E" stroke-width="1"/>
    <text x="175" y="100" text-anchor="middle" font-size="12" fill="#4A443C">Simple change of mind</text>
    <text x="175" y="120" text-anchor="middle" font-size="12" fill="#4A443C">"I don't want it anymore"</text>
    <text x="175" y="150" text-anchor="middle" font-size="11" fill="#4A443C">Governed entirely by the</text>
    <text x="175" y="167" text-anchor="middle" font-size="11" fill="#4A443C">seller's own stated policy —</text>
    <text x="175" y="184" text-anchor="middle" font-size="11" fill="#4A443C">no general law requires it</text>

    <rect x="380" y="30" width="290" height="270" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.8"/>
    <text x="525" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1F1B16">Legal right</text>
    <line x1="410" y1="72" x2="640" y2="72" stroke="#B5493A" stroke-width="1"/>
    <text x="525" y="96" text-anchor="middle" font-size="12" fill="#1F1B16">Defective product</text>
    <text x="525" y="118" text-anchor="middle" font-size="11" fill="#4A443C">(warranty law)</text>
    <text x="525" y="146" text-anchor="middle" font-size="12" fill="#1F1B16">Cooling-off rule sale</text>
    <text x="525" y="168" text-anchor="middle" font-size="11" fill="#4A443C">(specific cancellation window)</text>
    <text x="525" y="196" text-anchor="middle" font-size="12" fill="#1F1B16">Unused prepaid service</text>
    <text x="525" y="218" text-anchor="middle" font-size="11" fill="#4A443C">(prorated refund)</text>
  </g>

  <text x="350" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Everything outside the right-hand list defaults back to the seller's own policy.</text>
</svg>
