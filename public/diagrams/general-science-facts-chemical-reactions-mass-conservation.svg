<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="massConservationTitle">
  <title id="massConservationTitle">Labeled reactant molecules on the left combining through an arrow labeled reaction into differently arranged product molecules on the right, with a balance scale beneath showing reactant mass exactly equal to product mass</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="34" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="600" fill="#1F1B16">Reactants Rearrange Into Products — Mass Stays Fixed</text>

  <!-- Reactants panel -->
  <text x="150" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Reactants</text>
  <g stroke="#1F1B16" stroke-width="1.5">
    <!-- molecule A: two circles bonded -->
    <circle cx="110" cy="110" r="14" fill="#EEF3EE"/>
    <circle cx="140" cy="110" r="10" fill="#FBEDEA"/>
    <line x1="122" y1="110" x2="132" y2="110" stroke="#1F1B16" stroke-width="2"/>
    <!-- molecule B -->
    <circle cx="90" cy="160" r="10" fill="#EDE7D8"/>
    <circle cx="115" cy="160" r="10" fill="#EDE7D8"/>
    <line x1="98" y1="160" x2="107" y2="160" stroke="#1F1B16" stroke-width="2"/>
    <!-- molecule C -->
    <circle cx="170" cy="165" r="12" fill="#EEF3EE"/>
    <circle cx="150" cy="180" r="9" fill="#FBEDEA"/>
    <line x1="160" y1="172" x2="156" y2="176" stroke="#1F1B16" stroke-width="2"/>
  </g>
  <text x="150" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Molecule A + Molecule B + Molecule C</text>

  <!-- reaction arrow -->
  <line x1="230" y1="140" x2="360" y2="140" stroke="#2C4A3E" stroke-width="2.5"/>
  <path d="M 360,140 L 348,133 L 348,147 Z" fill="#2C4A3E"/>
  <text x="295" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2C4A3E">reaction</text>

  <!-- Products panel -->
  <text x="480" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Products</text>
  <g stroke="#1F1B16" stroke-width="1.5">
    <!-- rearranged: new bonds, same atom count -->
    <circle cx="440" cy="120" r="14" fill="#EEF3EE"/>
    <circle cx="465" cy="140" r="10" fill="#EDE7D8"/>
    <line x1="450" y1="128" x2="458" y2="134" stroke="#1F1B16" stroke-width="2"/>

    <circle cx="500" cy="110" r="10" fill="#FBEDEA"/>
    <circle cx="500" cy="135" r="9" fill="#EDE7D8"/>
    <line x1="500" y1="120" x2="500" y2="127" stroke="#1F1B16" stroke-width="2"/>

    <circle cx="420" cy="175" r="10" fill="#FBEDEA"/>
    <circle cx="445" cy="185" r="12" fill="#EEF3EE"/>
    <line x1="430" y1="179" x2="435" y2="181" stroke="#1F1B16" stroke-width="2"/>
  </g>
  <text x="470" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Same atoms, new arrangement</text>

  <!-- Balance scale -->
  <line x1="320" y1="255" x2="320" y2="290" stroke="#1F1B16" stroke-width="3"/>
  <rect x="200" y="248" width="240" height="4" fill="#1F1B16" rx="2"/>
  <line x1="230" y1="252" x2="230" y2="300" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M 190,300 L 270,300 L 260,325 L 200,325 Z" fill="#EEF3EE" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="230" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Reactant mass</text>
  <line x1="410" y1="252" x2="410" y2="300" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M 370,300 L 450,300 L 440,325 L 380,325 Z" fill="#EEF3EE" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="410" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Product mass</text>
  <path d="M 300,255 L 340,255 L 320,280 Z" fill="#C9412C"/>

  <text x="320" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F1B16">Reactant mass = Product mass</text>
  <text x="320" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Atoms are only rearranged — never created or destroyed</text>
</svg>
