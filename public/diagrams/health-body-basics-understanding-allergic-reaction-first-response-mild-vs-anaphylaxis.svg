<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="allergyCompareTitle">
  <title id="allergyCompareTitle">A comparison diagram showing a human figure outline on the left with a single highlighted area labeled localized mild reaction such as hives at contact site, versus a human figure outline on the right with three highlighted systems labeled skin, breathing, and circulation simultaneously, labeled anaphylaxis whole-body reaction, with an arrow to a box reading epinephrine if prescribed plus call emergency services.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="185" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Mild, localized reaction</text>
  <circle cx="185" cy="90" r="16" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="185" y1="106" x2="185" y2="180" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="185" y1="125" x2="150" y2="160" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="185" y1="125" x2="220" y2="160" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="185" y1="180" x2="160" y2="230" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="185" y1="180" x2="210" y2="230" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="205" cy="145" r="9" fill="#EDE7D8" stroke="#B5493A" stroke-width="1.6"/>
  <text x="185" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">one area: hives at</text>
  <text x="185" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">contact site only</text>

  <line x1="390" y1="60" x2="390" y2="280" stroke="#4A443C" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="595" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#B5493A">Anaphylaxis (whole-body)</text>
  <circle cx="595" cy="90" r="16" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="595" y1="106" x2="595" y2="180" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="595" y1="125" x2="560" y2="160" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="595" y1="125" x2="630" y2="160" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="595" y1="180" x2="570" y2="230" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="595" y1="180" x2="620" y2="230" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="615" cy="145" r="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
  <circle cx="565" cy="150" r="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
  <ellipse cx="595" cy="98" rx="10" ry="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
  <text x="595" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">skin + breathing +</text>
  <text x="595" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">circulation, all at once</text>

  <rect x="480" y="10" width="230" height="0" fill="none"/>
</svg>
