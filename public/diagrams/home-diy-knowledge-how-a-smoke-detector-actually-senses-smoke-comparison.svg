<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="smokeCompareTitle">
  <title id="smokeCompareTitle">Comparison of an ionization smoke detector, which senses smoke through disrupted electrical current between two charged plates near a tiny radioactive source, and a photoelectric smoke detector, which senses smoke through light scattered onto a sensor by smoke particles crossing a light beam.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Two different ways to sense smoke</text>

  <!-- LEFT: ionization chamber -->
  <rect x="55" y="48" width="320" height="200" rx="4" fill="#E8DEC8" stroke="#4A443C" stroke-width="2"/>
  <text x="215" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Ionization chamber</text>

  <!-- chamber -->
  <rect x="120" y="85" width="190" height="90" rx="3" fill="#FBF8F1" stroke="#1F1B16" stroke-width="1.5"/>
  <circle cx="150" cy="130" r="7" fill="#8B6F4E"/>
  <text x="150" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#1F1B16">Am-241</text>
  <!-- ion path dots -->
  <circle cx="185" cy="120" r="2" fill="#4A443C"/>
  <circle cx="205" cy="135" r="2" fill="#4A443C"/>
  <circle cx="225" cy="118" r="2" fill="#4A443C"/>
  <circle cx="245" cy="132" r="2" fill="#4A443C"/>
  <!-- plates -->
  <rect x="122" y="88" width="4" height="84" fill="#1F1B16"/>
  <rect x="284" y="88" width="4" height="84" fill="#1F1B16"/>
  <text x="215" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Smoke particles block ion flow,</text>
  <text x="215" y="209" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">current drops, alarm trips fast</text>
  <text x="215" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Best for fast, flaming fires</text>

  <!-- RIGHT: photoelectric -->
  <rect x="405" y="48" width="320" height="200" rx="4" fill="#E8DEC8" stroke="#4A443C" stroke-width="2"/>
  <text x="565" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Photoelectric sensor</text>

  <rect x="470" y="85" width="190" height="90" rx="3" fill="#FBF8F1" stroke="#1F1B16" stroke-width="1.5"/>
  <!-- LED -->
  <circle cx="500" cy="130" r="8" fill="#C9A45C" stroke="#1F1B16" stroke-width="1"/>
  <text x="500" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#1F1B16">LED</text>
  <!-- light beam, angled away from sensor when clear -->
  <line x1="508" y1="130" x2="620" y2="130" stroke="#C9A45C" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- scattered beam hitting sensor when smoke present -->
  <path d="M560,128 L595,110" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrowSmoke1)"/>
  <circle cx="600" cy="105" r="3" fill="#4A443C"/>
  <circle cx="590" cy="118" r="2.5" fill="#4A443C"/>
  <!-- photodetector -->
  <rect x="592" y="100" width="14" height="10" fill="#1F1B16"/>
  <text x="620" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#1F1B16">sensor</text>
  <text x="565" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Smoke scatters light onto a</text>
  <text x="565" y="209" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">sensor that&#8217;s otherwise dark</text>
  <text x="565" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Best for slow, smoldering fires</text>

  <defs>
    <marker id="arrowSmoke1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/>
    </marker>
  </defs>
</svg>
