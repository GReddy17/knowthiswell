<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="debitCreditTitle">
  <title id="debitCreditTitle">Two side-by-side flow diagrams. Left, labeled Debit Card: a box for Checking Account Balance with an arrow directly to Merchant, labeled Your money, spent immediately. Right, labeled Credit Card: a box for Card Issuer with an arrow to Merchant labeled Issuer's money, spent now, and a separate arrow from a Cardholder box back to Card Issuer labeled Repaid later, via monthly bill.</title>
  <rect width="800" height="260" fill="#FBF8F1"/>

  <text x="200" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Debit Card</text>
  <rect x="60" y="55" width="280" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Checking Account</text>
  <text x="200" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Balance</text>

  <line x1="200" y1="118" x2="200" y2="168" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="330" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Your money,</text>
  <text x="330" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">spent immediately</text>

  <rect x="60" y="172" width="280" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Merchant</text>

  <line x1="400" y1="20" x2="400" y2="240" stroke="#B9AF98" stroke-width="1.5" stroke-dasharray="4,4"/>

  <text x="600" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Credit Card</text>
  <rect x="460" y="55" width="280" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Card Issuer</text>

  <line x1="600" y1="113" x2="600" y2="163" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="730" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Issuer's money,</text>
  <text x="730" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">spent now</text>

  <rect x="460" y="167" width="280" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="197" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Merchant</text>

  <path d="M 460 235 Q 350 250 460 235" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Cardholder repays issuer later, via monthly bill</text>
  <line x1="600" y1="225" x2="600" y2="217" stroke="#2C4A3E" stroke-width="1"/>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
