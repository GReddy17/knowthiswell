<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="times11StepsTitle">
  <title id="times11StepsTitle">Flowchart showing the four steps of the multiply-by-11 shortcut: split the two-digit number into its two digits, add the two digits together, check whether the sum is 10 or more and carry into the leading digit if so, then assemble the leading digit, middle digit, and trailing digit into the final three-digit answer</title>
  <rect width="640" height="440" fill="#FBF8F1"/>

  <defs>
    <marker id="mmArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="200" y="20" width="240" height="58" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="43" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">1. Split into digits</text>
  <text x="320" y="62" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12.5" fill="#4A443C">57 → 5, 7</text>

  <line x1="320" y1="78" x2="320" y2="106" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#mmArrow)"/>

  <!-- Step 2 -->
  <rect x="200" y="110" width="240" height="58" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">2. Add the digits</text>
  <text x="320" y="152" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12.5" fill="#4A443C">5 + 7 = 12</text>

  <line x1="320" y1="168" x2="320" y2="192" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#mmArrow)"/>

  <!-- Step 3 diamond -->
  <polygon points="320,192 400,225 320,258 240,225" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="221" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">3. Sum ≥ 10?</text>
  <text x="320" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">(carry check)</text>

  <!-- Yes branch (right) -->
  <path d="M400,225 L428,230" fill="none" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#mmArrow)"/>
  <text x="410" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Yes</text>
  <rect x="430" y="195" width="190" height="72" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="525" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Carry the 1</text>
  <text x="525" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#4A443C">leading: 5+1 = 6</text>
  <text x="525" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#4A443C">middle digit: 2</text>

  <!-- No branch (left) -->
  <path d="M240,225 L212,230" fill="none" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#mmArrow)"/>
  <text x="220" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">No</text>
  <rect x="20" y="195" width="190" height="72" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="115" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">No carry needed</text>
  <text x="115" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#4A443C">leading digit stays</text>
  <text x="115" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#4A443C">middle digit = sum</text>

  <!-- converge -->
  <path d="M500,267 L385,330" fill="none" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#mmArrow)"/>
  <path d="M140,267 L255,330" fill="none" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#mmArrow)"/>

  <!-- Step 4 -->
  <rect x="200" y="334" width="240" height="90" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="320" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">4. Assemble digits</text>
  <text x="320" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">leading | middle | trailing</text>
  <text x="320" y="400" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#1F1B16">6 | 2 | 7 → 627</text>
</svg>
