<svg viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="llcCmpTitle">
  <title id="llcCmpTitle">What an LLC's limited liability usually covers: the business's own debts, lawsuits against the business, and obligations of the company, which stay with the company. What it usually does not cover: debts you personally guarantee, harm you personally cause, and cases where a court pierces the veil because personal and business money were mixed.</title>
  <rect width="560" height="290" fill="#FBF8F1"/>
  <text x="150" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">LLC usually shields you from</text>
  <rect x="40" y="46" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">The company's own debts</text>
  <text x="150" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(suppliers, leases)</text>
  <rect x="40" y="104" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Lawsuits against</text>
  <text x="150" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">the business itself</text>
  <rect x="40" y="162" width="220" height="50" rx="6" fill="#2C4A3E"/>
  <text x="150" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Your house, car and savings</text>
  <text x="150" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">stay out of business claims</text>
  <text x="410" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8B6F4E">LLC usually does not shield</text>
  <rect x="300" y="46" width="220" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="410" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Loans you personally</text>
  <text x="410" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">guarantee</text>
  <rect x="300" y="104" width="220" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="410" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Harm you personally cause</text>
  <text x="410" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(your own negligence)</text>
  <rect x="300" y="162" width="220" height="50" rx="6" fill="#8B6F4E"/>
  <text x="410" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Veil piercing: mixed money,</text>
  <text x="410" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">ignored formalities</text>
  <line x1="280" y1="46" x2="280" y2="212" stroke="#E3DCC9" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="280" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">The shield is real but conditional:</text>
  <text x="280" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">keep business money and records separate.</text>
</svg>
