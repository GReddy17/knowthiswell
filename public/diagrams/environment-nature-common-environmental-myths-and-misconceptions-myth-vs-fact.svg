<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mythVsFactTitle">
  <title id="mythVsFactTitle">Three rows, each with a myth on the left in a red-tinted box and the corrected reality on the right in a green-tinted box: row one, plastic recycling rate myth "gets recycled" vs reality "5 to 9 percent actually recycled"; row two, EV emissions myth "worse for the planet" vs reality "offsets manufacturing emissions within 1 to 2 years"; row three, cold winter myth "disproves warming" vs reality "weather noise around a decades-long warming trend"</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="200" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4A443C">MYTH</text>
  <text x="580" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4A443C">REALITY</text>

  <!-- Row 1 -->
  <rect x="30" y="50" width="340" height="66" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">"Plastic in the bin</text>
  <text x="200" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">gets recycled"</text>
  <text x="400" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">→</text>
  <rect x="410" y="50" width="340" height="66" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Only ~5-9% of US plastic</text>
  <text x="580" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">is actually recycled (EPA)</text>

  <!-- Row 2 -->
  <rect x="30" y="130" width="340" height="66" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">"EVs are worse for</text>
  <text x="200" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">the planet overall"</text>
  <text x="400" y="166" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">→</text>
  <rect x="410" y="130" width="340" height="66" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Emissions offset within</text>
  <text x="580" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">~1-2 years of driving (DOE)</text>

  <!-- Row 3 -->
  <rect x="30" y="210" width="340" height="66" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">"This cold winter</text>
  <text x="200" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">disproves warming"</text>
  <text x="400" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">→</text>
  <rect x="410" y="210" width="340" height="66" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Weather noise around a</text>
  <text x="580" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">decades-long warming trend</text>

  <text x="390" y="305" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Each myth starts from a real fact, stretched past what the full data actually supports.</text>
</svg>
