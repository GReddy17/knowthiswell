<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="contract-elements-title">
  <title id="contract-elements-title">Diagram showing four elements — Offer, Acceptance, Consideration, and Mutual Intent — each feeding into a single box labeled Binding Contract.</title>
  <rect width="640" height="320" fill="#FBF8F1"/>
  <style>
    .box { fill: #EEF3EE; stroke: #2C4A3E; stroke-width: 2; }
    .boxc { fill: #FBEDEA; stroke: #2C4A3E; stroke-width: 2; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; fill: #1F1B16; font-weight: 600; }
    .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #4A443C; }
    .arrow { stroke: #2C4A3E; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="130" height="60" rx="8" class="box"/>
  <text x="85" y="55" text-anchor="middle" class="label">Offer</text>

  <rect x="170" y="20" width="130" height="60" rx="8" class="box"/>
  <text x="235" y="55" text-anchor="middle" class="label">Acceptance</text>

  <rect x="340" y="20" width="140" height="60" rx="8" class="box"/>
  <text x="410" y="55" text-anchor="middle" class="label">Consideration</text>

  <rect x="500" y="20" width="120" height="60" rx="8" class="box"/>
  <text x="560" y="48" text-anchor="middle" class="label">Mutual</text>
  <text x="560" y="65" text-anchor="middle" class="label">Intent</text>

  <path d="M85,80 L280,220" class="arrow"/>
  <path d="M235,80 L300,220" class="arrow"/>
  <path d="M410,80 L340,220" class="arrow"/>
  <path d="M560,80 L360,220" class="arrow"/>

  <rect x="200" y="230" width="240" height="70" rx="8" class="boxc"/>
  <text x="320" y="258" text-anchor="middle" class="label">Binding Contract</text>
  <text x="320" y="278" text-anchor="middle" class="sub">Enforceable regardless of format</text>
</svg>
