<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Insurance claim sequence: report the loss, an adjuster investigates, the loss is evaluated against covered perils and exclusions (or denied), and the payout is calculated after subtracting the deductible and applying the policy limit.</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F1B16"/></marker></defs>
<rect width="680" height="330" fill="#FBF8F1"/>
<rect x="20" y="70" width="130" height="100" rx="8" fill="#EEF3EE" stroke="#8B6F4E" stroke-width="1.5"/>
<text x="85" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1. Report</text>
<text x="85" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4A443C">the loss</text>
<line x1="152" y1="120" x2="181" y2="120" stroke="#1F1B16" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="185" y="70" width="130" height="100" rx="8" fill="#EEF3EE" stroke="#8B6F4E" stroke-width="1.5"/>
<text x="250" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">2. Adjuster</text>
<text x="250" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4A443C">investigates</text>
<line x1="317" y1="120" x2="346" y2="120" stroke="#1F1B16" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="350" y="70" width="130" height="100" rx="8" fill="#EEF3EE" stroke="#8B6F4E" stroke-width="1.5"/>
<text x="415" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">3. Evaluate</text>
<text x="415" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4A443C">covered perils &amp;</text>
<text x="415" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4A443C">exclusions</text>
<line x1="482" y1="120" x2="511" y2="120" stroke="#1F1B16" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="515" y="70" width="130" height="100" rx="8" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1.5"/>
<text x="580" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">4. Payout</text>
<text x="580" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4A443C">after deductible,</text>
<text x="580" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4A443C">within policy limit</text>
<line x1="415" y1="172" x2="415" y2="215" stroke="#1F1B16" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="315" y="217" width="200" height="56" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
<text x="415" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Denied</text>
<text x="415" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4A443C">if loss is excluded or not covered</text>
<text x="340" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="400" fill="#4A443C">Payout = covered loss, minus the deductible, capped at the policy limit</text>
</svg>
