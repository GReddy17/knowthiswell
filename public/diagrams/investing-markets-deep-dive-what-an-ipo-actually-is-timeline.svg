<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ipoTitle">
  <title id="ipoTitle">IPO timeline: hire underwriters; file the S-1 with the prospectus and answer SEC comments; roadshow to institutional investors; pricing the evening before listing, with shares allocated mostly to institutions; first trading day, when most individuals can first buy; lock-up expiry around 180 days later, when insiders may sell.</title>
  <rect width="660" height="320" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">How a private company becomes a public stock</text>
    <line x1="50" y1="150" x2="620" y2="150" stroke="#4A443C" stroke-width="2"/>
    <rect x="378" y="136" width="94" height="28" fill="#FBEFE6" stroke="#B5552B" stroke-width="1" stroke-dasharray="4 3"/>

    <g fill="#8B6F4E"><circle cx="70" cy="150" r="7"/><circle cx="180" cy="150" r="7"/><circle cx="290" cy="150" r="7"/></g>
    <circle cx="390" cy="150" r="8" fill="#2C4A3E"/>
    <circle cx="460" cy="150" r="8" fill="#B5552B"/>
    <circle cx="600" cy="150" r="7" fill="#8B6F4E"/>

    <g font-size="12" font-weight="700" fill="#1F1B16" text-anchor="middle">
      <text x="70" y="78">1. Hire</text>
      <text x="70" y="94">underwriters</text>
      <text x="180" y="78">2. File S-1</text>
      <text x="180" y="94">with SEC</text>
      <text x="290" y="78">3. Roadshow</text>
      <text x="390" y="222">4. Pricing night</text>
      <text x="470" y="78">5. Day 1 trading</text>
      <text x="600" y="222">6. Lock-up ends</text>
    </g>
    <g font-size="10" fill="#4A443C" text-anchor="middle">
      <text x="70" y="112">banks plan,</text>
      <text x="70" y="125">price, distribute</text>
      <text x="180" y="112">prospectus, risks;</text>
      <text x="180" y="125">SEC reviews disclosure</text>
      <text x="290" y="96">pitch institutions,</text>
      <text x="290" y="110">collect orders</text>
      <text x="390" y="238">offer price set;</text>
      <text x="390" y="252">shares mostly to</text>
      <text x="390" y="266">institutions</text>
      <text x="470" y="96">exchange listing;</text>
      <text x="470" y="110">most individuals</text>
      <text x="470" y="124" font-weight="700" fill="#B5552B">first buy here</text>
      <text x="600" y="238">commonly ~180 days;</text>
      <text x="600" y="252">insiders may sell</text>
    </g>
    <g stroke="#4A443C" stroke-width="1" stroke-dasharray="3 3">
      <line x1="70" y1="130" x2="70" y2="143"/><line x1="180" y1="130" x2="180" y2="143"/><line x1="290" y1="116" x2="290" y2="143"/><line x1="390" y1="158" x2="390" y2="208"/><line x1="465" y1="130" x2="462" y2="143"/><line x1="600" y1="158" x2="600" y2="208"/>
    </g>
    <text x="425" y="186" text-anchor="middle" font-size="10" font-style="italic" fill="#B5552B">overnight</text>
    <text x="530" y="168" text-anchor="middle" font-size="10" fill="#4A443C">. . . months . . .</text>
  </g>
  <text x="330" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">US process (Securities Act of 1933). Steps 1 to 4 typically take months; the gap from 4 to 5 is one night.</text>
</svg>
