<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="borderProcessTitle">
  <title id="borderProcessTitle">Two-stage diagram: delimitation, where two countries agree on a treaty defining a border as a dotted line on a map, followed by demarcation, where physical markers, monuments, and fencing are placed along that same line on the actual ground, with a note that a gap in time or precision between the two stages is a common source of border disputes</title>
  <rect width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">From treaty line to marked ground</text>

  <!-- STAGE 1: Delimitation -->
  <g>
    <rect x="24" y="52" width="272" height="270" rx="6" fill="#EEF3EE" opacity="0.5" stroke="#E3DCC9"/>
    <text x="160" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">1. Delimitation</text>

    <!-- two flags -->
    <g>
      <line x1="66" y1="108" x2="66" y2="160" stroke="#1F1B16" stroke-width="1.5"/>
      <rect x="66" y="108" width="26" height="17" fill="#B24A38"/>
      <text x="66" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">Country A</text>
    </g>
    <g>
      <line x1="254" y1="108" x2="254" y2="160" stroke="#1F1B16" stroke-width="1.5"/>
      <rect x="228" y="108" width="26" height="17" fill="#5B7A99"/>
      <text x="254" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">Country B</text>
    </g>

    <!-- treaty document -->
    <rect x="128" y="106" width="64" height="46" rx="2" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="1.3"/>
    <line x1="136" y1="118" x2="184" y2="118" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="136" y1="126" x2="184" y2="126" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="136" y1="134" x2="170" y2="134" stroke="#8B6F4E" stroke-width="1"/>
    <text x="160" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#6B5636">Treaty</text>

    <!-- simplified map with dotted line -->
    <rect x="52" y="200" width="216" height="96" rx="3" fill="#FBF8F1" stroke="#D8CFBB"/>
    <path d="M 52,200 L 130,200 L 150,230 L 130,296 L 52,296 Z" fill="#B24A38" opacity="0.18"/>
    <path d="M 268,200 L 190,200 L 170,230 L 190,296 L 268,296 Z" fill="#5B7A99" opacity="0.18"/>
    <path d="M 160,200 L 160,296" stroke="#1F1B16" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="160" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#1F1B16">Border agreed on paper</text>
  </g>

  <!-- arrow between stages -->
  <path d="M 300,187 L 336,187" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="318" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8B6F4E">on the ground</text>

  <!-- STAGE 2: Demarcation -->
  <g>
    <rect x="344" y="52" width="272" height="270" rx="6" fill="#EEF3EE" opacity="0.5" stroke="#E3DCC9"/>
    <text x="480" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">2. Demarcation</text>

    <!-- same map, now with physical markers -->
    <rect x="372" y="96" width="216" height="130" rx="3" fill="#FBF8F1" stroke="#D8CFBB"/>
    <path d="M 372,96 L 450,96 L 470,161 L 450,226 L 372,226 Z" fill="#B24A38" opacity="0.18"/>
    <path d="M 588,96 L 510,96 L 490,161 L 510,226 L 588,226 Z" fill="#5B7A99" opacity="0.18"/>
    <line x1="480" y1="96" x2="480" y2="226" stroke="#1F1B16" stroke-width="2"/>
    <!-- markers/monuments along the line -->
    <g fill="#1F1B16">
      <rect x="476" y="108" width="8" height="10"/>
      <rect x="476" y="146" width="8" height="10"/>
      <rect x="476" y="184" width="8" height="10"/>
      <rect x="476" y="210" width="8" height="10"/>
    </g>
    <!-- fencing ticks -->
    <g stroke="#4A443C" stroke-width="1">
      <line x1="480" y1="100" x2="480" y2="106"/>
      <line x1="480" y1="120" x2="480" y2="126"/>
      <line x1="480" y1="132" x2="480" y2="138"/>
      <line x1="480" y1="158" x2="480" y2="164"/>
      <line x1="480" y1="170" x2="480" y2="176"/>
      <line x1="480" y1="196" x2="480" y2="202"/>
    </g>
    <text x="480" y="243" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#1F1B16">Markers, monuments &amp; fencing</text>
    <text x="480" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#1F1B16">placed on the actual land</text>

    <!-- callout -->
    <rect x="368" y="270" width="224" height="42" rx="4" fill="#FBEDEA" stroke="#C9412C" stroke-width="1"/>
    <text x="480" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#8A3626">A gap in time or precision</text>
    <text x="480" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8A3626">between these two stages is a</text>
    <text x="480" y="309" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8A3626">common source of border disputes</text>
  </g>

  <defs>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#8B6F4E"/>
    </marker>
  </defs>
</svg>
