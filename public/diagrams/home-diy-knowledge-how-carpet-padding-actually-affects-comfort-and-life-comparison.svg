<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carpetPadTitle">
  <title id="carpetPadTitle">Comparison diagram showing a thick, low-density pad compressing significantly under a footstep, letting the carpet backing flex further, versus a thinner, high-density pad resisting compression and limiting backing flex under the same footstep.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Same footstep, different pad density</text>

  <!-- Left: thick low-density pad -->
  <text x="190" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Thick, low-density pad</text>
  <path d="M120,90 Q190,70 260,90 L260,105 Q190,90 120,105 Z" fill="#8A6D3B" stroke="#1F1B16" stroke-width="1.5"/>
  <ellipse cx="190" cy="95" rx="15" ry="10" fill="#4A443C"/>
  <text x="190" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">footstep</text>
  <rect x="120" y="108" width="140" height="60" fill="#D9C89A" stroke="#1F1B16" stroke-width="2"/>
  <path d="M150,108 Q190,150 230,108" fill="none" stroke="#C9412C" stroke-width="2.5"/>
  <text x="190" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#C9412C">pad compresses deeply</text>
  <rect x="120" y="170" width="140" height="16" fill="#B7A98C" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="190" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#C9412C">backing flexes further</text>

  <!-- Right: thin dense pad -->
  <text x="590" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Thin, high-density pad</text>
  <path d="M520,90 Q590,80 660,90 L660,100 Q590,92 520,100 Z" fill="#8A6D3B" stroke="#1F1B16" stroke-width="1.5"/>
  <ellipse cx="590" cy="94" rx="15" ry="10" fill="#4A443C"/>
  <text x="590" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">footstep</text>
  <rect x="520" y="103" width="140" height="35" fill="#6E5A34" stroke="#1F1B16" stroke-width="2"/>
  <path d="M550,103 Q590,116 630,103" fill="none" stroke="#3F7D5C" stroke-width="2.5"/>
  <text x="590" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3F7D5C">pad resists compression</text>
  <rect x="520" y="140" width="140" height="16" fill="#B7A98C" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="590" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3F7D5C">backing flex stays limited</text>

  <text x="390" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Density resists permanent compression — thickness alone doesn't protect the carpet backing above it</text>
</svg>
