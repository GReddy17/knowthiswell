<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="circulationTitle">
  <title id="circulationTitle">Cross-section of Earth's atmosphere from equator to pole showing warm air rising at the equator forming a low-pressure belt, cool air sinking near 30 degrees latitude and at the pole forming high-pressure belts, labeled Hadley, Ferrel, and Polar circulation cells, and surface wind directions between them, driven by uneven solar heating</title>

  <defs>
    <marker id="ah6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F1B16"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- sun heating angle -->
  <circle cx="60" cy="32" r="13" fill="#C97C3D"/>
  <line x1="60" y1="48" x2="60" y2="92" stroke="#C97C3D" stroke-width="3" marker-end="url(#ah6)"/>
  <line x1="558" y1="14" x2="580" y2="92" stroke="#C97C3D" stroke-width="1.6" marker-end="url(#ah6)"/>
  <text x="60" y="107" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Direct sunlight</text>
  <text x="580" y="107" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Low-angle sunlight</text>

  <!-- aloft flow, y=120 -->
  <line x1="63" y1="120" x2="228" y2="120" stroke="#1F1B16" stroke-width="2" marker-end="url(#ah6)"/>
  <line x1="403" y1="120" x2="238" y2="120" stroke="#1F1B16" stroke-width="2" marker-end="url(#ah6)"/>
  <line x1="411" y1="120" x2="577" y2="120" stroke="#1F1B16" stroke-width="2" marker-end="url(#ah6)"/>

  <!-- rise/sink vertical columns -->
  <line x1="60" y1="345" x2="60" y2="125" stroke="#C9412C" stroke-width="2.4" marker-end="url(#ah6)"/>
  <line x1="233" y1="125" x2="233" y2="345" stroke="#5B7C99" stroke-width="2.4" marker-end="url(#ah6)"/>
  <line x1="406" y1="345" x2="406" y2="125" stroke="#C9412C" stroke-width="2.4" marker-end="url(#ah6)"/>
  <line x1="580" y1="125" x2="580" y2="345" stroke="#5B7C99" stroke-width="2.4" marker-end="url(#ah6)"/>

  <!-- surface flow, y=345 -->
  <line x1="228" y1="345" x2="63" y2="345" stroke="#1F1B16" stroke-width="2" marker-end="url(#ah6)"/>
  <line x1="238" y1="345" x2="403" y2="345" stroke="#1F1B16" stroke-width="2" marker-end="url(#ah6)"/>
  <line x1="577" y1="345" x2="411" y2="345" stroke="#1F1B16" stroke-width="2" marker-end="url(#ah6)"/>

  <!-- ground -->
  <rect x="40" y="349" width="560" height="9" fill="#8B6F4E" opacity="0.4"/>

  <!-- cell labels -->
  <text x="146" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Hadley cell</text>
  <text x="320" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Ferrel cell</text>
  <text x="493" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Polar cell</text>

  <!-- surface wind labels -->
  <text x="146" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Trade winds</text>
  <text x="320" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Westerlies</text>
  <text x="493" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Polar easterlies</text>

  <!-- latitude / pressure labels -->
  <text x="60" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#C9412C">Equator</text>
  <text x="60" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Low pressure — rising</text>

  <text x="233" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5B7C99">30°N</text>
  <text x="233" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">High pressure — sinking</text>

  <text x="406" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#C9412C">60°N</text>
  <text x="406" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Low pressure — rising</text>

  <text x="580" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5B7C99">Pole</text>
  <text x="580" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">High pressure — sinking</text>
</svg>
