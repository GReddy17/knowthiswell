<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dutiesTitle">
  <title id="dutiesTitle">Two columns. The left column, labeled Legally Mandatory, lists Paying taxes, Jury duty when summoned, and Obeying court orders, each with a gavel icon indicating legal enforcement. The right column, labeled Socially Expected, lists Voting in most countries, Staying informed, and Community participation, each with an outline icon indicating no legal penalty.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="200" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Legally Mandatory</text>
  <rect x="60" y="55" width="280" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Paying taxes</text>
  <rect x="60" y="115" width="280" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Jury duty when summoned</text>
  <rect x="60" y="175" width="280" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Obeying court orders</text>
  <text x="200" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Legal penalty if ignored</text>

  <line x1="400" y1="20" x2="400" y2="280" stroke="#D8D2C0" stroke-width="1"/>

  <text x="580" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Socially Expected</text>
  <rect x="440" y="55" width="280" height="50" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Voting (in most countries)</text>
  <rect x="440" y="115" width="280" height="50" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Staying informed</text>
  <rect x="440" y="175" width="280" height="50" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Community participation</text>
  <text x="580" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">No legal penalty</text>
</svg>
