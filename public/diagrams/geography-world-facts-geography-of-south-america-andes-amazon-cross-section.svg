<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="saCrossTitle">
  <title id="saCrossTitle">A west-to-east cross-section of South America showing the narrow Atacama Desert along the Pacific coast, the towering Andes mountain range rising sharply behind it with the Altiplano plateau marked near its crest, moist air arrows sweeping west from the Atlantic and rising over the Amazon Basin before dropping rain on the Andes' eastern slopes, and the vast Amazon rainforest and river system filling the continent's northern interior</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="24" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15.5" font-weight="600" fill="#1F1B16">South America: Andes-to-Amazon cross-section</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B7E5E">
    <text x="50" y="46">Pacific &#8592;</text>
    <text x="590" y="46" text-anchor="end">&#8594; Atlantic</text>
  </g>

  <line x1="40" y1="330" x2="600" y2="330" stroke="#1F1B16" stroke-width="1.5"/>

  <!-- Atacama desert: narrow strip along Pacific coast -->
  <rect x="40" y="315" width="55" height="15" fill="#C9A66B" opacity="0.55"/>
  <text x="67" y="352" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#6B5636">Atacama</text>
  <text x="67" y="363" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#8B7E5E">driest place on Earth</text>

  <!-- Andes: sharp, tall -->
  <path d="M 95,330 L 115,220 L 130,180 L 145,220 L 160,170 L 178,225 L 195,330 Z" fill="#B24A38" opacity="0.4" stroke="#8A3626" stroke-width="1.2"/>
  <!-- Altiplano plateau shelf near the crest -->
  <path d="M 130,180 L 145,220 L 160,170" fill="#8B6F4E" opacity="0.5" stroke="#6B5636" stroke-width="1"/>
  <text x="143" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#1F1B16">Altiplano</text>
  <text x="145" y="352" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#8A3626">Andes</text>

  <!-- Amazon Basin & rainforest: wide area east of the Andes -->
  <path d="M 195,330 L 195,290 C 300,265 450,265 600,290 L 600,330 Z" fill="#2C4A3E" opacity="0.4" stroke="#20362D" stroke-width="1.2"/>
  <path d="M 220,310 C 300,300 380,320 460,305 C 510,297 550,308 590,300" fill="none" stroke="#4A7A9E" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="352" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#EEF3EE" stroke="#20362D" stroke-width="0.3">Amazon Basin &amp; Rainforest</text>
  <text x="510" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#3F5E78">Amazon River</text>

  <!-- moist air arrows sweeping west from the Atlantic, rising over the Andes -->
  <g fill="none" stroke="#5B7A99" stroke-width="1.6" marker-end="url(#arrowhead)">
    <path d="M 580,130 C 480,110 380,105 280,120 C 240,128 210,150 190,190"/>
    <path d="M 560,160 C 460,145 360,145 270,165 C 235,173 205,195 195,225"/>
  </g>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5B7A99"/>
    </marker>
  </defs>
  <text x="560" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#3F5E78">moist Atlantic air</text>

  <!-- raindrops on the Andes' eastern slope -->
  <g fill="#5B7A99">
    <path d="M 190,205 c 3,5 -6,9 -3,14 c 3,3 8,-1 6,-6 c -1,-3 -2,-6 -3,-8 z"/>
    <path d="M 202,235 c 3,5 -6,9 -3,14 c 3,3 8,-1 6,-6 c -1,-3 -2,-6 -3,-8 z"/>
  </g>

  <text x="320" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Moist air rises over the eastern Andes slopes and drops its rain there, leaving the western, Pacific-facing side extremely dry.</text>
</svg>
