<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="leapTitle">
  <title id="leapTitle">A timeline showing the calendar year of 365 days drifting away from the true solar year of 365.2422 days by about a quarter day each year, accumulating over four years, then a leap day is added to snap the calendar back in sync, with century years like 1900 shown skipping the leap day and year 2000 shown keeping it</title>
  <rect width="780" height="280" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Why the calendar needs a leap day</text>

  <line x1="60" y1="100" x2="720" y2="100" stroke="#2C4A3E" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">
    <circle cx="120" cy="100" r="5" fill="#2C4A3E"/><text x="120" y="85" text-anchor="middle">Year 1</text>
    <circle cx="280" cy="100" r="5" fill="#2C4A3E"/><text x="280" y="85" text-anchor="middle">Year 2</text>
    <circle cx="440" cy="100" r="5" fill="#2C4A3E"/><text x="440" y="85" text-anchor="middle">Year 3</text>
    <circle cx="600" cy="100" r="5" fill="#B5493A"/><text x="600" y="85" text-anchor="middle" fill="#B5493A" font-weight="700">Year 4</text>
  </g>
  <path d="M 120 115 Q 360 165 600 115" fill="none" stroke="#B5493A" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="360" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">calendar drifts ~0.2422 days/year behind the true solar year</text>

  <rect x="560" y="180" width="140" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="630" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Feb 29 added</text>
  <text x="630" y="217" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">drift corrected</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">
    <rect x="60" y="240" width="330" height="30" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="225" y="260" text-anchor="middle">1900: divisible by 100, not 400 → NOT a leap year</text>
    <rect x="410" y="240" width="330" height="30" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="575" y="260" text-anchor="middle" font-weight="700">2000: divisible by 400 → IS a leap year</text>
  </g>
</svg>
