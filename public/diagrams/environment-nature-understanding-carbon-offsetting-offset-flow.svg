<svg viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="offsetFlowTitle">
  <title id="offsetFlowTitle">A flow diagram: on the left, an airplane icon labeled emissions source, 0.9 tons CO2e, with a dollar-sign arrow pointing right to a verification checkmark box labeled additionality and permanence check, then an arrow continuing right to a tree-planting or solar-panel icon labeled funded reduction project, 0.9 tons CO2e avoided, with a dashed line connecting back to the airplane labeled net accounting balance.</title>
  <rect width="820" height="220" fill="#FBF8F1"/>

  <rect x="30" y="70" width="150" height="80" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="105" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">✈</text>
  <text x="105" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Emissions source</text>
  <text x="105" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">0.9 tons CO2e</text>

  <text x="230" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">$ →</text>
  <line x1="182" y1="110" x2="290" y2="110" stroke="#2C4A3E" stroke-width="1.8"/>
  <polygon points="285,105 295,110 285,115" fill="#2C4A3E"/>

  <rect x="300" y="65" width="180" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#2C4A3E">✓</text>
  <text x="390" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">Additionality &amp;</text>
  <text x="390" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">permanence check</text>

  <line x1="482" y1="110" x2="590" y2="110" stroke="#2C4A3E" stroke-width="1.8"/>
  <polygon points="585,105 595,110 585,115" fill="#2C4A3E"/>

  <rect x="600" y="70" width="180" height="80" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="690" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">🌳</text>
  <text x="690" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Funded reduction project</text>
  <text x="690" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">0.9 tons CO2e avoided</text>

  <path d="M 690 155 Q 400 205 105 155" fill="none" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="400" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">net accounting balance</text>
</svg>
