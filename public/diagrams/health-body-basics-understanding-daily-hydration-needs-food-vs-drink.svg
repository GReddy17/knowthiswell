<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hydrationTitle">
  <title id="hydrationTitle">A stacked bar showing total daily fluid intake made up of two segments: a larger segment representing fluid from drinking water and beverages, and a smaller segment representing fluid obtained from food such as fruits, vegetables, and soups, together forming the NIH's total water intake concept.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="390" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Total daily water intake (NIH framing)</text>

  <rect x="240" y="60" width="300" height="60" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Drinking water &amp; beverages</text>

  <rect x="240" y="120" width="300" height="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Water from food (fruits, vegetables, soups)</text>

  <line x1="240" y1="60" x2="240" y2="150" stroke="#2C4A3E" stroke-width="2.5"/>
  <line x1="540" y1="60" x2="540" y2="150" stroke="#2C4A3E" stroke-width="2.5"/>

  <text x="390" y="190" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">= Total water intake</text>
  <path d="M 300 165 L 480 165 L 480 175 L 500 160 L 480 145 L 480 155 L 300 155 Z" fill="#B5493A" opacity="0" />
  <text x="390" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Guidance is based on this combined total, not drinking water alone</text>
</svg>
