<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Ocean acidification chain: atmospheric CO2 dissolves in ocean water and reacts to form carbonic acid, which partly breaks apart into hydrogen ions and bicarbonate. The extra hydrogen ions react with carbonate ions, converting them to more bicarbonate, which leaves reduced carbonate available for shell-building organisms.</title>
  <rect width="680" height="330" fill="#FBF8F1"/>
  <rect x="20" y="30" width="200" height="90" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="120" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8B6F4E">1</text>
  <text x="120" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Atmospheric CO₂</text>
  <text x="120" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">dissolves into</text>
  <text x="120" y="111" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">ocean water</text>
  <path d="M220 75 L237 75" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="240" y="30" width="200" height="90" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="340" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8B6F4E">2</text>
  <text x="340" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Carbonic acid</text>
  <text x="340" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(H₂CO₃) forms</text>
  <path d="M440 75 L457 75" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="460" y="30" width="200" height="90" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="560" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C9412C">3</text>
  <text x="560" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Partly breaks apart into</text>
  <text x="560" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">H⁺ and bicarbonate</text>
  <text x="560" y="111" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(HCO₃⁻)</text>
  <path d="M560 120 L560 177" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="460" y="180" width="200" height="90" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="560" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C9412C">4</text>
  <text x="560" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Extra H⁺ reacts with</text>
  <text x="560" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">carbonate ions</text>
  <text x="560" y="261" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(CO₃²⁻)</text>
  <path d="M460 225 L443 225" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="240" y="180" width="200" height="90" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="340" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C9412C">5</text>
  <text x="340" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Carbonate converted</text>
  <text x="340" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">into more bicarbonate</text>
  <path d="M240 225 L223 225" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="20" y="180" width="200" height="90" rx="6" fill="#2C4A3E"/>
  <path d="M34 258 A22 22 0 0 1 78 258 Z" fill="#EEF3EE"/>
  <path d="M56 258 L56 238 M56 258 L44 241 M56 258 L68 241 M56 258 L38 249 M56 258 L74 249" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>
  <text x="152" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Reduced carbonate</text>
  <text x="152" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">available for</text>
  <text x="152" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">shell-building</text>
  <text x="340" y="303" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">The end result, less carbonate, is what constrains shell and skeleton builders</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F1B16"/></marker></defs>
</svg>
