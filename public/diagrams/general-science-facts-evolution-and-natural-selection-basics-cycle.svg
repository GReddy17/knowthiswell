<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evolutionCycleTitle">
  <title id="evolutionCycleTitle">A circular three-stage cycle of natural selection: Variation, a population with heritable trait differences; Selection, an environmental pressure reducing reproduction of some variants; and Inheritance, surviving individuals passing traits to offspring, looping back to Variation for the next generation</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <defs>
    <marker id="cycArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <!-- connecting arrows forming the loop -->
  <path d="M 385,150 C 430,180 460,205 468,238" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#cycArrow)"/>
  <path d="M 400,335 C 340,360 300,360 240,335" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#cycArrow)"/>
  <path d="M 172,238 C 180,205 210,180 255,150" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#cycArrow)"/>

  <text x="320" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">repeats each</text>
  <text x="320" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">generation</text>
  <path d="M 300,222 A 20 20 0 1 1 296,240" fill="none" stroke="#8B6F4E" stroke-width="1.5" marker-end="url(#cycArrow)"/>

  <!-- Variation node (top) -->
  <rect x="225" y="40" width="190" height="110" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">1. Variation</text>
  <circle cx="255" cy="95" r="6" fill="#2C4A3E"/>
  <circle cx="278" cy="98" r="9" fill="#5E8A73"/>
  <circle cx="305" cy="93" r="5" fill="#2C4A3E"/>
  <circle cx="330" cy="97" r="10" fill="#A6C9B4"/>
  <circle cx="358" cy="94" r="7" fill="#5E8A73"/>
  <circle cx="382" cy="98" r="6" fill="#2C4A3E"/>
  <text x="320" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Population shows heritable</text>
  <text x="320" y="143" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">trait differences</text>

  <!-- Selection node (bottom right) -->
  <rect x="385" y="240" width="190" height="110" rx="10" fill="#DCE7DE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="480" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">2. Selection</text>
  <path d="M 445,295 L 460,320 L 430,320 Z" fill="#C9412C"/>
  <circle cx="500" cy="308" r="7" fill="#5E8A73"/>
  <circle cx="522" cy="310" r="6" fill="#A6C9B4" opacity="0.5"/>
  <text x="480" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Environment removes or</text>
  <text x="480" y="343" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">limits some variants' reproduction</text>

  <!-- Inheritance node (bottom left) -->
  <rect x="65" y="240" width="190" height="110" rx="10" fill="#DCE7DE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="160" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">3. Inheritance</text>
  <circle cx="120" cy="300" r="9" fill="#2C4A3E"/>
  <path d="M 129,300 L 155,290" stroke="#4A443C" stroke-width="1.5"/>
  <path d="M 129,300 L 155,310" stroke="#4A443C" stroke-width="1.5"/>
  <circle cx="163" cy="288" r="6" fill="#5E8A73"/>
  <circle cx="163" cy="312" r="6" fill="#5E8A73"/>
  <text x="160" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Survivors pass their traits</text>
  <text x="160" y="343" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">on to offspring</text>
</svg>
