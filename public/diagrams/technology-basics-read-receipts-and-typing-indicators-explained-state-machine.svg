<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="msgStateTitle">
  <title id="msgStateTitle">A state machine diagram showing a message moving through four possible states in sequence: Sent, Delivered, Read, with a separate typing indicator shown as a temporary side state that appears and disappears independently of the main message states.</title>
  <rect width="800" height="260" fill="#FBF8F1"/>

  <rect x="30" y="60" width="140" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="100" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Sent</text>
  <text x="100" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">left sender's device</text>

  <rect x="250" y="60" width="150" height="50" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="325" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Delivered</text>
  <text x="325" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">reached recipient device</text>

  <rect x="480" y="60" width="150" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="555" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Read</text>
  <text x="555" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">opened / on screen</text>

  <defs>
    <marker id="arrowState" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M170,85 L248,85" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowState)"/>
  <path d="M400,85 L478,85" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowState)"/>
  <text x="209" y="77" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">network ack</text>
  <text x="439" y="77" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">app-level signal</text>

  <text x="400" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">Each arrow can stall independently — a message can sit at "Delivered" indefinitely if read receipts are off, notifications are muted, or the recipient just hasn't opened the chat.</text>

  <rect x="250" y="185" width="300" height="55" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="400" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Typing indicator</text>
  <text x="400" y="224" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">a separate, temporary signal — sent while composing,</text>
  <text x="400" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">not stored as part of the message's own state history</text>
</svg>
