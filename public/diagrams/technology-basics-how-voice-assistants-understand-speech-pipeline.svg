<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="voicePipelineTitle">
  <title id="voicePipelineTitle">Five-step pipeline: a microphone captures a sound wave, the wave is broken into small sound units called phonemes, the phonemes are matched to the most statistically likely words to form text, that text is parsed for intent by matching it against known command patterns, and finally an action is taken and a spoken response is generated.</title>
  <rect width="820" height="300" fill="#FBF8F1"/>

  <rect x="15" y="70" width="145" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="87" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">1. Sound wave</text>
  <text x="87" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">mic captures</text>
  <text x="87" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">air vibration</text>

  <rect x="180" y="70" width="145" height="80" rx="8" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="252" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">2. Phonemes</text>
  <text x="252" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">wave split into</text>
  <text x="252" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">smallest sound units</text>

  <rect x="345" y="70" width="145" height="80" rx="8" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="417" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">3. Text</text>
  <text x="417" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">phonemes matched</text>
  <text x="417" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">to likeliest words</text>

  <rect x="510" y="70" width="145" height="80" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="582" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">4. Intent match</text>
  <text x="582" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">text compared to</text>
  <text x="582" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">known command patterns</text>

  <rect x="675" y="70" width="130" height="80" rx="8" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="740" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">5. Action</text>
  <text x="740" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">runs command,</text>
  <text x="740" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">speaks a reply</text>

  <defs>
    <marker id="arrowVoice" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M160,110 L180,110" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowVoice)"/>
  <path d="M325,110 L345,110" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowVoice)"/>
  <path d="M490,110 L510,110" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowVoice)"/>
  <path d="M655,110 L675,110" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowVoice)"/>

  <rect x="120" y="195" width="580" height="80" rx="8" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1"/>
  <text x="410" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Steps 1-3 are sound-pattern matching, not comprehension</text>
  <text x="410" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">The assistant only "understands meaning" at step 4, where the transcribed text</text>
  <text x="410" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">is matched against a limited set of recognized intents and their required details (slots)</text>
</svg>
