<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pomodoroCycleTitle">
  <title id="pomodoroCycleTitle">A flow diagram showing four repeating blocks, each labeled 25 minutes of focused work followed by a 5 minute break, followed by a fifth, wider block labeled 15 to 30 minute long break, illustrating one full Pomodoro cycle of four work intervals capped by an extended recovery break.</title>
  <rect width="780" height="220" fill="#FBF8F1"/>

  <g>
    <rect x="30" y="60" width="110" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="85" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">25 min</text>
    <text x="85" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">focused work</text>
    <rect x="140" y="70" width="34" height="50" fill="#F2ECE0" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="157" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#8B6F4E">5 min</text>
  </g>

  <g>
    <rect x="190" y="60" width="110" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="245" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">25 min</text>
    <text x="245" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">focused work</text>
    <rect x="300" y="70" width="34" height="50" fill="#F2ECE0" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="317" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#8B6F4E">5 min</text>
  </g>

  <g>
    <rect x="350" y="60" width="110" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="405" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">25 min</text>
    <text x="405" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">focused work</text>
    <rect x="460" y="70" width="34" height="50" fill="#F2ECE0" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="477" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#8B6F4E">5 min</text>
  </g>

  <g>
    <rect x="510" y="60" width="110" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="565" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">25 min</text>
    <text x="565" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">focused work</text>
  </g>

  <rect x="640" y="55" width="110" height="80" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="695" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#B5493A">15–30 min</text>
  <text x="695" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#B5493A">long break</text>

  <path d="M620,95 L638,95" fill="none" stroke="#B5493A" stroke-width="2" marker-end="url(#arrowPomo)"/>
  <defs>
    <marker id="arrowPomo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/>
    </marker>
  </defs>

  <text x="390" y="175" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Four short work-and-break cycles, then one longer break to reset accumulated fatigue.</text>
</svg>
