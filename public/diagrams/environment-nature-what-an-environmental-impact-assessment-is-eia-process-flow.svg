<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eiaFlowTitle">
  <title id="eiaFlowTitle">A horizontal flow diagram with five connected stages from left to right: Screening (is a full assessment required), Scoping (which effects will be studied), Impact Analysis (predicting effects on air, water, noise, and ecosystems), Mitigation and Public Comment (proposed fixes and a public review period), and Decision and Monitoring (final approval with binding conditions, followed by ongoing compliance checks).</title>
  <rect width="900" height="260" fill="#FBF8F1"/>

  <rect x="15" y="80" width="150" height="100" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="90" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Screening</text>
  <text x="90" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Is a full EIA</text>
  <text x="90" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">required at all?</text>

  <text x="182" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="200" y="80" width="150" height="100" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="275" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Scoping</text>
  <text x="275" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Which effects</text>
  <text x="275" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">get studied?</text>

  <text x="367" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="385" y="70" width="160" height="120" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="465" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Impact Analysis</text>
  <text x="465" y="127" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Air, water, noise,</text>
  <text x="465" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">ecosystems</text>
  <text x="465" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">(produces the EIS)</text>

  <text x="562" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="580" y="70" width="165" height="120" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="662" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Mitigation &amp;</text>
  <text x="662" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Public Comment</text>
  <text x="662" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Proposed fixes +</text>
  <text x="662" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">public review period</text>

  <text x="762" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="780" y="70" width="105" height="120" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="832" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Decision &amp;</text>
  <text x="832" y="119" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Monitoring</text>
  <text x="832" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">Approval with</text>
  <text x="832" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">binding conditions</text>

  <text x="450" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each stage narrows the scope of the one after it — a project can exit at Screening if no full EIA is required.</text>
</svg>
