<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waterTreatTitle">
  <title id="waterTreatTitle">A flow diagram showing raw source water passing through sequential treatment stages: filtration removing particles and some pathogens, then disinfection such as chlorination inactivating most remaining bacteria and viruses, arriving at safe distributed tap water, with a side note that a disruption at any stage can trigger a boil water advisory</title>
  <rect width="800" height="220" fill="#FBF8F1"/>

  <rect x="20" y="70" width="140" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="90" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Raw source water</text>

  <text x="185" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="205" y="70" width="160" height="60" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="285" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Filtration</text>
  <text x="285" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">removes particles/pathogens</text>

  <text x="380" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="400" y="70" width="180" height="60" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="490" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Disinfection</text>
  <text x="490" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">chlorination inactivates pathogens</text>

  <text x="595" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="615" y="70" width="160" height="60" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.2"/>
  <text x="695" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Safe tap water</text>
  <text x="695" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">distributed</text>

  <text x="400" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">A disruption at any stage can trigger a boil water advisory.</text>
</svg>
