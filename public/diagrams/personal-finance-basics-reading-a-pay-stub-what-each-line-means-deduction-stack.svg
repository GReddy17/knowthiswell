<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="payStubTitle">
  <title id="payStubTitle">A vertical stacked bar starting with a tall box labeled Gross Pay at the top, followed by four progressively subtracted slices labeled Federal and State Income Tax, Social Security and Medicare (FICA), Pre-Tax Benefits and Retirement, and Post-Tax Deductions, ending in a final shorter box at the bottom labeled Net Pay (Take-Home)</title>
  <rect width="720" height="420" fill="#FBF8F1"/>

  <rect x="220" y="20" width="280" height="50" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Gross Pay</text>

  <text x="360" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#B5493A">−</text>

  <rect x="220" y="98" width="280" height="46" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Federal &amp; State Income Tax</text>

  <text x="360" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#B5493A">−</text>

  <rect x="220" y="172" width="280" height="46" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Social Security &amp; Medicare (FICA)</text>

  <text x="360" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#B5493A">−</text>

  <rect x="220" y="246" width="280" height="46" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Pre-Tax Benefits &amp; Retirement</text>

  <text x="360" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#B5493A">−</text>

  <rect x="220" y="320" width="280" height="46" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Post-Tax Deductions</text>

  <text x="360" y="384" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">=</text>

  <rect x="250" y="392" width="220" height="20" rx="4" fill="#2C4A3E"/>
  <text x="360" y="406" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Net Pay (Take-Home)</text>
</svg>
