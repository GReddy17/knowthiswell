<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agTitle">
  <title id="agTitle">Chatbot versus AI agent. Chatbot: the user's message goes to the model, the model writes one reply, and the user decides what to do. Agent: a goal goes to the model, which decides an action, a tool runs it, the result returns as an observation, and the model decides again, looping until the goal is met or a step limit is hit. Human approval sits before irreversible actions such as paying or deleting.</title>
  <defs>
    <marker id="agArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A443C"/></marker>
  </defs>
  <rect width="640" height="380" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="130" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">Chatbot</text>
    <text x="130" y="52" text-anchor="middle" font-size="11" fill="#4A443C">one reply, then stops</text>
    <rect x="45" y="70" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="1.5"/>
    <text x="130" y="97" text-anchor="middle" font-size="12" fill="#1F1B16">You ask a question</text>
    <line x1="130" y1="114" x2="130" y2="140" stroke="#4A443C" stroke-width="1.5" marker-end="url(#agArr)"/>
    <rect x="45" y="142" width="170" height="44" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="130" y="169" text-anchor="middle" font-size="12" fill="#1F1B16">Model writes a reply</text>
    <line x1="130" y1="186" x2="130" y2="212" stroke="#4A443C" stroke-width="1.5" marker-end="url(#agArr)"/>
    <rect x="45" y="214" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="1.5"/>
    <text x="130" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">You take the action</text>
    <text x="130" y="255" text-anchor="middle" font-size="11" fill="#4A443C">(click, book, send)</text>

    <line x1="262" y1="30" x2="262" y2="330" stroke="#E3DCC9" stroke-width="2"/>

    <text x="455" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">AI agent</text>
    <text x="455" y="52" text-anchor="middle" font-size="11" fill="#4A443C">loops until done or stopped</text>
    <rect x="370" y="70" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="1.5"/>
    <text x="455" y="95" text-anchor="middle" font-size="12" fill="#1F1B16">You give a goal</text>
    <line x1="455" y1="110" x2="455" y2="132" stroke="#4A443C" stroke-width="1.5" marker-end="url(#agArr)"/>
    <rect x="370" y="134" width="170" height="44" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="455" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">1. Model decides</text>
    <text x="455" y="170" text-anchor="middle" font-size="11" fill="#4A443C">next action or &quot;done&quot;</text>
    <line x1="540" y1="156" x2="590" y2="156" stroke="#4A443C" stroke-width="1.5"/>
    <line x1="590" y1="156" x2="590" y2="226" stroke="#4A443C" stroke-width="1.5" marker-end="url(#agArr)"/>
    <rect x="530" y="228" width="100" height="44" rx="8" fill="#F6EBD9" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="580" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">2. Tool runs</text>
    <text x="580" y="264" text-anchor="middle" font-size="10" fill="#4A443C">search, code, email</text>
    <line x1="530" y1="250" x2="472" y2="250" stroke="#4A443C" stroke-width="1.5" marker-end="url(#agArr)"/>
    <rect x="330" y="228" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="1.5"/>
    <text x="400" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">3. Observe result</text>
    <text x="400" y="264" text-anchor="middle" font-size="10" fill="#4A443C">added to context</text>
    <line x1="400" y1="228" x2="400" y2="180" stroke="#4A443C" stroke-width="1.5" marker-end="url(#agArr)"/>
    <text x="352" y="208" text-anchor="middle" font-size="11" font-style="italic" fill="#2C4A3E">repeat</text>
    <rect x="300" y="296" width="330" height="40" rx="8" fill="#FBEFE6" stroke="#B5552B" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="465" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#B5552B">Safeguard: human approves before paying,</text>
    <text x="465" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="#B5552B">sending or deleting. Step limit stops runaway loops.</text>
  </g>
  <text x="320" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Same language model in both. The agent adds tools and the loop.</text>
</svg>
