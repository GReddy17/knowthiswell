<svg viewBox="0 0 560 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fedFlowTitle">
  <title id="fedFlowTitle">How a Federal Reserve rate decision reaches you: the FOMC sets a target range, it adjusts the rate it pays banks on reserves, overnight bank lending rates follow, loan and savings rates shift, and spending and inflation respond over months.</title>
  <rect width="560" height="510" fill="#FBF8F1"/>
  <rect x="130" y="20" width="300" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">1. FOMC meets 8 times a year</text>
  <text x="280" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">and sets a fed funds target range</text>
  <text x="280" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="130" y="106" width="300" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">2. The Fed moves the interest it</text>
  <text x="280" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">pays banks on their reserves</text>
  <text x="280" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="130" y="192" width="300" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">3. Overnight bank-to-bank</text>
  <text x="280" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">lending rates follow into the range</text>
  <text x="280" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="130" y="278" width="300" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">4. Card, auto and savings rates</text>
  <text x="280" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">shift; mortgages react more loosely</text>
  <text x="280" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="130" y="364" width="300" height="60" rx="6" fill="#2C4A3E"/>
  <text x="280" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">5. Borrowing, spending and hiring</text>
  <text x="280" y="406" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">adjust, then inflation, with a lag</text>
  <text x="280" y="488" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">The Fed steers short-term rates directly and everything else indirectly</text>
</svg>
