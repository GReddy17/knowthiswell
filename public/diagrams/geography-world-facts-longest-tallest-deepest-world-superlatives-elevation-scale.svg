<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="elevScaleTitle">
  <title id="elevScaleTitle">Vertical scale diagram with sea level marked as the zero reference line, Mount Everest's summit marked at 8,849 meters above sea level, the Dead Sea shore marked at about 430 meters below sea level, and the Mariana Trench's Challenger Deep marked at about 10,935 meters below sea level, all drawn on the same continuous vertical axis for direct comparison</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="24" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15.5" font-weight="600" fill="#1F1B16">Earth's vertical extremes, one continuous scale</text>

  <!-- background band: land/sky above sea level, ocean below -->
  <rect x="140" y="50" width="320" height="147.6" fill="#EEF3EE"/>
  <rect x="140" y="197.6" width="320" height="182.4" fill="#5B7A99" opacity="0.22"/>
  <rect x="140" y="300" width="320" height="80" fill="#3D6A83" opacity="0.22"/>

  <!-- axis -->
  <line x1="300" y1="50" x2="300" y2="380" stroke="#1F1B16" stroke-width="1.5"/>

  <!-- sea level -->
  <line x1="140" y1="197.6" x2="460" y2="197.6" stroke="#2C4A3E" stroke-width="2"/>
  <text x="470" y="201.5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Sea level</text>
  <text x="470" y="214" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">0 m &#8212; reference line</text>

  <!-- Everest -->
  <circle cx="300" cy="50" r="4.5" fill="#1F1B16"/>
  <path d="M300,50 L312,88 L288,88 Z" fill="#2C4A3E"/>
  <path d="M296,74 L304,74 L300,64 Z" fill="#FBF8F1"/>
  <path d="M304,60 L335,92" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="340" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Mount Everest summit</text>
  <text x="340" y="103" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">+8,849 m above sea level</text>

  <!-- Dead Sea -->
  <circle cx="300" cy="204.8" r="4" fill="#1F1B16"/>
  <path d="M304,206 L335,252" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="340" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Dead Sea shore</text>
  <text x="340" y="265" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">about &#8722;430 m below sea level</text>

  <!-- Mariana Trench -->
  <path d="M280,375 L300,380 L320,375 L300,340 Z" fill="#20362D"/>
  <circle cx="300" cy="380" r="4" fill="#1F1B16"/>
  <path d="M304,372 L335,335" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="340" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Challenger Deep</text>
  <text x="340" y="351" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Mariana Trench, about</text>
  <text x="340" y="364" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">&#8722;10,935 m below sea level</text>

  <text x="320" y="405" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Same vertical axis throughout &#8212; Earth's deepest point is more than 12 times deeper than the Dead Sea's shore.</text>
</svg>
