<svg viewBox="0 0 560 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tableCompTitle">
  <title id="tableCompTitle">Table manners that still matter versus ones that have faded: phones off the table, waiting to start, chewing with your mouth closed and passing food still matter; which fork style you use and many formal rules have faded.</title>
  <rect width="560" height="336" fill="#FBF8F1"/>
  <rect x="20" y="20" width="250" height="56" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="145" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Still matters</text>
  <text x="145" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">(people notice)</text>
  <rect x="20" y="92" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Phone off the table while eating</text>
  <rect x="20" y="136" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Wait until others are served</text>
  <rect x="20" y="180" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Chew with your mouth closed</text>
  <rect x="20" y="224" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Pass dishes, don&#x27;t reach across</text>
  <rect x="290" y="20" width="250" height="56" rx="6" fill="#2C4A3E"/>
  <text x="415" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">Mostly faded</text>
  <text x="415" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">(few people notice)</text>
  <rect x="290" y="92" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">American vs continental fork style</text>
  <rect x="290" y="136" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Which of five forks to use</text>
  <rect x="290" y="180" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Elbows on the table between courses</text>
  <rect x="290" y="224" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Strict seating by rank or gender</text>
  <text x="280" y="314" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">The test for any rule: does it make eating together easier for everyone?</text>
</svg>
