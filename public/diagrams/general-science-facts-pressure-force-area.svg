<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pressureForceAreaTitle">
  <title id="pressureForceAreaTitle">Two diagrams comparing the same downward force applied through a wide flat surface versus a narrow pointed surface, with the narrow surface producing much higher pressure shown by densely concentrated pressure lines</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <line x1="320" y1="70" x2="320" y2="360" stroke="#E3DCC9" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- panel 1: wide surface, low pressure -->
  <text x="170" y="55" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Wide surface</text>

  <g stroke="#1F1B16" stroke-width="2.5" fill="none">
    <path d="M 170,90 L 170,225"/>
    <path d="M 170,225 L 163,213 M 170,225 L 177,213"/>
  </g>
  <text x="180" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">F</text>

  <rect x="80" y="232" width="180" height="14" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>

  <g stroke="#8B6F4E" stroke-width="1.2" opacity="0.75">
    <line x1="95" y1="246" x2="95" y2="280"/>
    <line x1="115" y1="246" x2="115" y2="280"/>
    <line x1="135" y1="246" x2="135" y2="280"/>
    <line x1="155" y1="246" x2="155" y2="280"/>
    <line x1="170" y1="246" x2="170" y2="280"/>
    <line x1="185" y1="246" x2="185" y2="280"/>
    <line x1="205" y1="246" x2="205" y2="280"/>
    <line x1="225" y1="246" x2="225" y2="280"/>
    <line x1="245" y1="246" x2="245" y2="280"/>
  </g>

  <line x1="60" y1="280" x2="280" y2="280" stroke="#1F1B16" stroke-width="1.5"/>
  <g stroke="#4A443C" stroke-width="1">
    <line x1="70" y1="280" x2="62" y2="292"/>
    <line x1="90" y1="280" x2="82" y2="292"/>
    <line x1="110" y1="280" x2="102" y2="292"/>
    <line x1="130" y1="280" x2="122" y2="292"/>
    <line x1="150" y1="280" x2="142" y2="292"/>
    <line x1="170" y1="280" x2="162" y2="292"/>
    <line x1="190" y1="280" x2="182" y2="292"/>
    <line x1="210" y1="280" x2="202" y2="292"/>
    <line x1="230" y1="280" x2="222" y2="292"/>
    <line x1="250" y1="280" x2="242" y2="292"/>
    <line x1="270" y1="280" x2="262" y2="292"/>
  </g>
  <text x="170" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Low pressure</text>
  <text x="170" y="343" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">force spread over a large area</text>

  <!-- panel 2: narrow point, high pressure -->
  <text x="470" y="55" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Narrow point</text>

  <g stroke="#1F1B16" stroke-width="2.5" fill="none">
    <path d="M 470,90 L 470,225"/>
    <path d="M 470,225 L 463,213 M 470,225 L 477,213"/>
  </g>
  <text x="480" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">F</text>

  <path d="M 455,232 L 485,232 L 470,262 Z" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>

  <g stroke="#C9412C" stroke-width="1.4">
    <line x1="461" y1="262" x2="461" y2="280"/>
    <line x1="465" y1="260" x2="465" y2="280"/>
    <line x1="469" y1="262" x2="469" y2="280"/>
    <line x1="473" y1="260" x2="473" y2="280"/>
    <line x1="477" y1="262" x2="477" y2="280"/>
  </g>

  <line x1="380" y1="280" x2="580" y2="280" stroke="#1F1B16" stroke-width="1.5"/>
  <g stroke="#4A443C" stroke-width="1">
    <line x1="390" y1="280" x2="382" y2="292"/>
    <line x1="410" y1="280" x2="402" y2="292"/>
    <line x1="430" y1="280" x2="422" y2="292"/>
    <line x1="450" y1="280" x2="442" y2="292"/>
    <line x1="470" y1="280" x2="462" y2="292"/>
    <line x1="490" y1="280" x2="482" y2="292"/>
    <line x1="510" y1="280" x2="502" y2="292"/>
    <line x1="530" y1="280" x2="522" y2="292"/>
    <line x1="550" y1="280" x2="542" y2="292"/>
    <line x1="570" y1="280" x2="562" y2="292"/>
  </g>
  <text x="470" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C9412C">High pressure</text>
  <text x="470" y="343" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">same force on a tiny area</text>

  <text x="320" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-style="italic" fill="#8B6F4E">P = F ÷ A — identical force, very different area</text>
</svg>
