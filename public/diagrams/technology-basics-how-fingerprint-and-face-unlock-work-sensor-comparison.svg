<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="biometricTitle">
  <title id="biometricTitle">Comparison diagram of a capacitive fingerprint sensor reading ridges and valleys as a grid of tiny capacitors versus a face unlock system projecting thousands of invisible infrared dots to build a 3D depth map, both converted into a mathematical template rather than a stored image</title>
  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <text x="160" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="700" fill="#1F1B16">Fingerprint sensor</text>
  <text x="480" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="700" fill="#1F1B16">Face unlock (3D)</text>

  <!-- fingerprint ridges over capacitor grid -->
  <rect x="70" y="55" width="180" height="140" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <g stroke="#1F1B16" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 85,70 Q 160,90 235,70"/>
    <path d="M 85,90 Q 160,110 235,90"/>
    <path d="M 85,110 Q 160,130 235,110"/>
    <path d="M 85,130 Q 160,150 235,130"/>
    <path d="M 85,150 Q 160,170 235,150"/>
    <path d="M 85,170 Q 160,190 235,170"/>
  </g>
  <!-- capacitor grid dots underneath -->
  <g fill="#2C4A3E" opacity="0.6">
    <circle cx="95" cy="80" r="2"/><circle cx="120" cy="80" r="2"/><circle cx="145" cy="80" r="2"/><circle cx="170" cy="80" r="2"/><circle cx="195" cy="80" r="2"/><circle cx="220" cy="80" r="2"/>
    <circle cx="95" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="145" cy="120" r="2"/><circle cx="170" cy="120" r="2"/><circle cx="195" cy="120" r="2"/><circle cx="220" cy="120" r="2"/>
    <circle cx="95" cy="160" r="2"/><circle cx="120" cy="160" r="2"/><circle cx="145" cy="160" r="2"/><circle cx="170" cy="160" r="2"/><circle cx="195" cy="160" r="2"/><circle cx="220" cy="160" r="2"/>
  </g>
  <text x="160" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Ridges sit closer to the sensor</text>
  <text x="160" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">than valleys — each point reads</text>
  <text x="160" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">a different capacitance</text>

  <!-- face with IR dot projection -->
  <g>
    <ellipse cx="480" cy="130" rx="70" ry="90" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <!-- dot grid across face, denser pattern to imply thousands of points -->
    <g fill="#C9412C" opacity="0.85">
      <circle cx="440" cy="90" r="2"/><circle cx="460" cy="85" r="2"/><circle cx="480" cy="82" r="2"/><circle cx="500" cy="85" r="2"/><circle cx="520" cy="90" r="2"/>
      <circle cx="435" cy="115" r="2"/><circle cx="455" cy="110" r="2"/><circle cx="480" cy="108" r="2"/><circle cx="505" cy="110" r="2"/><circle cx="525" cy="115" r="2"/>
      <circle cx="435" cy="140" r="2"/><circle cx="460" cy="138" r="2"/><circle cx="480" cy="140" r="2"/><circle cx="500" cy="138" r="2"/><circle cx="525" cy="140" r="2"/>
      <circle cx="440" cy="165" r="2"/><circle cx="460" cy="168" r="2"/><circle cx="480" cy="170" r="2"/><circle cx="500" cy="168" r="2"/><circle cx="520" cy="165" r="2"/>
      <circle cx="450" cy="190" r="2"/><circle cx="470" cy="195" r="2"/><circle cx="480" cy="197" r="2"/><circle cx="490" cy="195" r="2"/><circle cx="510" cy="190" r="2"/>
    </g>
  </g>
  <text x="480" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Tens of thousands of invisible IR dots</text>
  <text x="480" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">build a 3D depth map of the face</text>

  <!-- shared bottom: both become a template, not an image -->
  <rect x="130" y="300" width="380" height="70" rx="8" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Neither stores the raw image</text>
  <text x="320" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Both convert the reading into a mathematical template,</text>
  <text x="320" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">then compare new scans against that template for a match score</text>
</svg>
