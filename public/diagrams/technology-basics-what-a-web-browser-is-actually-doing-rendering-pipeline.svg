<svg viewBox="0 0 840 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="browserPipelineTitle">
  <title id="browserPipelineTitle">A layered pipeline diagram showing a browser sending a request and receiving HTML and CSS, then parsing HTML into a DOM tree and CSS into a CSSOM tree in parallel, combining both into a render tree, calculating layout positions, and finally painting the result as pixels on screen.</title>
  <rect width="840" height="320" fill="#FBF8F1"/>

  <rect x="20" y="30" width="110" height="42" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="75" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Server</text>

  <defs>
    <marker id="arrowBrowser" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <path d="M130,51 L178,51" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>
  <text x="155" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">HTML+CSS</text>

  <rect x="180" y="20" width="90" height="30" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="225" y="39" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">HTML</text>
  <rect x="180" y="55" width="90" height="30" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="225" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">CSS</text>

  <path d="M270,35 L318,35" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>
  <path d="M270,70 L318,70" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>

  <rect x="320" y="20" width="110" height="30" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="375" y="39" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">DOM tree</text>
  <rect x="320" y="55" width="110" height="30" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="375" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">CSSOM tree</text>

  <path d="M430,35 L470,52" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>
  <path d="M430,70 L470,53" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>

  <rect x="475" y="35" width="110" height="34" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="530" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Render tree</text>

  <path d="M585,52 L625,52" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>

  <rect x="630" y="35" width="90" height="34" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="675" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Layout</text>

  <path d="M720,52 L760,52" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>

  <rect x="765" y="35" width="60" height="34" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="795" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Paint</text>

  <rect x="30" y="130" width="780" height="150" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2" rx="6"/>
  <text x="420" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Fixed pipeline order — each stage depends on the one before it</text>

  <rect x="55" y="175" width="140" height="60" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="125" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">1. Parse HTML → DOM</text>
  <text x="125" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">   Parse CSS → CSSOM</text>

  <path d="M195,205 L235,205" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>

  <rect x="240" y="175" width="140" height="60" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="310" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">2. Combine into</text>
  <text x="310" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">   render tree</text>

  <path d="M380,205 L420,205" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>

  <rect x="425" y="175" width="140" height="60" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="495" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">3. Calculate layout</text>
  <text x="495" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">   (size, position)</text>

  <path d="M565,205 L605,205" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBrowser)"/>

  <rect x="610" y="175" width="150" height="60" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="685" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">4. Paint pixels</text>
  <text x="685" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">   to screen</text>

  <path d="M685,236 C 685,260 300,260 125,238" fill="none" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBrowser)"/>
  <text x="420" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">Late script changes to DOM/CSSOM re-trigger this whole loop</text>

  <text x="420" y="303" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Nothing is visible until paint — every earlier stage is invisible bookkeeping.</text>
</svg>
