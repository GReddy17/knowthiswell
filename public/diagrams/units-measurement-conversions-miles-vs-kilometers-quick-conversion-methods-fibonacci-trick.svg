<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="milesKmFibTitle">
  <title id="milesKmFibTitle">A table pairing consecutive Fibonacci numbers with their approximate kilometer equivalents when read as miles, showing 3 miles is about 5 km, 5 miles is about 8 km, 8 miles is about 13 km, and 13 miles is about 21 km, because the golden ratio 1.618 is close to the real mile-to-kilometer factor 1.609.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>
  <text x="390" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">The Fibonacci mental-math shortcut (miles → km)</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- header -->
    <text x="160" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#4A443C">Miles (Fibonacci)</text>
    <text x="420" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#4A443C">Next Fibonacci (≈ km)</text>
    <text x="650" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#4A443C">Actual km</text>

    <!-- rows -->
    <rect x="60" y="85" width="660" height="38" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="160" y="109" text-anchor="middle" font-size="13.5" fill="#1F1B16">3</text>
    <text x="420" y="109" text-anchor="middle" font-size="13.5" fill="#1F1B16">5</text>
    <text x="650" y="109" text-anchor="middle" font-size="13.5" fill="#1F1B16">4.83</text>

    <rect x="60" y="128" width="660" height="38" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="160" y="152" text-anchor="middle" font-size="13.5" fill="#1F1B16">5</text>
    <text x="420" y="152" text-anchor="middle" font-size="13.5" fill="#1F1B16">8</text>
    <text x="650" y="152" text-anchor="middle" font-size="13.5" fill="#1F1B16">8.05</text>

    <rect x="60" y="171" width="660" height="38" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="160" y="195" text-anchor="middle" font-size="13.5" fill="#1F1B16">8</text>
    <text x="420" y="195" text-anchor="middle" font-size="13.5" fill="#1F1B16">13</text>
    <text x="650" y="195" text-anchor="middle" font-size="13.5" fill="#1F1B16">12.87</text>

    <rect x="60" y="214" width="660" height="38" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="160" y="238" text-anchor="middle" font-size="13.5" fill="#1F1B16">13</text>
    <text x="420" y="238" text-anchor="middle" font-size="13.5" fill="#1F1B16">21</text>
    <text x="650" y="238" text-anchor="middle" font-size="13.5" fill="#1F1B16">20.92</text>
  </g>
  <text x="390" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Works because φ ≈ 1.618 is close to the real factor 1.60934 — error stays under 1% up to a few hundred miles.</text>
</svg>
