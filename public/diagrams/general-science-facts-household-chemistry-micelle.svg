<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="micelleTitle">
  <title id="micelleTitle">Cross-section of a micelle showing many soap molecules with water-loving round heads pointing outward toward surrounding water and oily tails pointing inward toward a trapped grease droplet at the center</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="34" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="600" fill="#1F1B16">A Micelle: Soap Surrounding a Grease Droplet</text>

  <!-- surrounding water tint -->
  <rect x="40" y="60" width="560" height="300" fill="#EEF3EE" opacity="0.35" rx="8"/>
  <text x="60" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Water</text>

  <!-- central grease droplet -->
  <circle cx="320" cy="215" r="55" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Grease</text>

  <!-- soap molecules arranged radially: head outward (circle), tail inward (line) -->
  <g stroke="#1F1B16">
    <!-- generate 16 molecules around circle radius ~110 for head, ~58 tail end -->
  </g>

  <g id="soapMolecules">
    <!-- 0 deg -->
    <line x1="320" y1="163" x2="320" y2="118" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="320" cy="108" r="10" fill="#2C4A3E"/>
    <!-- 30 -->
    <line x1="347.5" y1="177.5" x2="365.6" y2="145.2" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="370.6" cy="136.2" r="10" fill="#2C4A3E"/>
    <!-- 60 -->
    <line x1="367.6" y1="201.6" x2="404.9" y2="184" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="414.5" cy="179.4" r="10" fill="#2C4A3E"/>
    <!-- 90 -->
    <line x1="375" y1="215" x2="425" y2="215" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="435" cy="215" r="10" fill="#2C4A3E"/>
    <!-- 120 -->
    <line x1="367.6" y1="228.4" x2="404.9" y2="246" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="414.5" cy="250.6" r="10" fill="#2C4A3E"/>
    <!-- 150 -->
    <line x1="347.5" y1="252.5" x2="365.6" y2="284.8" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="370.6" cy="293.8" r="10" fill="#2C4A3E"/>
    <!-- 180 -->
    <line x1="320" y1="267" x2="320" y2="312" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="320" cy="322" r="10" fill="#2C4A3E"/>
    <!-- 210 -->
    <line x1="292.5" y1="252.5" x2="274.4" y2="284.8" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="269.4" cy="293.8" r="10" fill="#2C4A3E"/>
    <!-- 240 -->
    <line x1="272.4" y1="228.4" x2="235.1" y2="246" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="225.5" cy="250.6" r="10" fill="#2C4A3E"/>
    <!-- 270 -->
    <line x1="265" y1="215" x2="215" y2="215" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="205" cy="215" r="10" fill="#2C4A3E"/>
    <!-- 300 -->
    <line x1="272.4" y1="201.6" x2="235.1" y2="184" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="225.5" cy="179.4" r="10" fill="#2C4A3E"/>
    <!-- 330 -->
    <line x1="292.5" y1="177.5" x2="274.4" y2="145.2" stroke="#1F1B16" stroke-width="2"/>
    <circle cx="269.4" cy="136.2" r="10" fill="#2C4A3E"/>
  </g>

  <!-- callouts -->
  <line x1="205" y1="215" x2="120" y2="180" stroke="#4A443C" stroke-width="1"/>
  <text x="118" y="176" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Hydrophilic head</text>
  <text x="118" y="192" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(faces water)</text>

  <line x1="292.5" y1="177.5" x2="180" y2="110" stroke="#4A443C" stroke-width="1"/>
  <text x="178" y="106" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Hydrophobic tail</text>
  <text x="178" y="122" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(buried in grease)</text>

  <text x="320" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Many soap molecules form a sphere — the micelle — that carries grease away in water</text>
</svg>
