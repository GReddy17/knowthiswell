<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="twoMinuteRuleTitle">
  <title id="twoMinuteRuleTitle">A decision flow diagram starting with a task arriving, branching into two paths based on the question 'does it take less than two minutes and stand alone': the yes path leads directly to 'do it now,' while the no path leads to 'capture it on a list or calendar for proper planning,' illustrating the two-minute rule as a quick triage decision applied to each incoming task.</title>
  <rect width="700" height="260" fill="#FBF8F1"/>

  <rect x="270" y="20" width="160" height="50" rx="8" fill="#F2ECE0" stroke="#8B6F4E" stroke-width="2"/>
  <text x="350" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Task arrives</text>

  <path d="M350,70 L350,95" fill="none" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowTMR)"/>
  <defs>
    <marker id="arrowTMR" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#4A443C"/>
    </marker>
  </defs>

  <rect x="220" y="98" width="260" height="55" rx="8" fill="#FBF8F1" stroke="#4A443C" stroke-width="2"/>
  <text x="350" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Under 2 minutes and</text>
  <text x="350" y="139" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">stands alone?</text>

  <path d="M270,140 L110,190" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowTMR2)"/>
  <path d="M430,140 L590,190" fill="none" stroke="#B5493A" stroke-width="2" marker-end="url(#arrowTMR2)"/>
  <defs>
    <marker id="arrowTMR2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
  <text x="180" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2C4A3E">yes</text>
  <text x="510" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#B5493A">no</text>

  <rect x="20" y="195" width="200" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Do it now</text>

  <rect x="480" y="195" width="200" height="55" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="580" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5493A">Capture on a list or</text>
  <text x="580" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5493A">calendar for later</text>
</svg>
