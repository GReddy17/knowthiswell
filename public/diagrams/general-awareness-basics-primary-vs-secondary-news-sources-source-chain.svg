<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sourceChainTitle">
  <title id="sourceChainTitle">A flow diagram showing Primary Source leading to Secondary Source leading to Tertiary Source leading to Social Media Post, with a shrinking bar beneath each step representing decreasing detail and increasing distortion risk</title>
  <rect width="780" height="240" fill="#FBF8F1"/>
  <rect x="20" y="30" width="160" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="100" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Primary Source</text>
  <text x="215" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="240" y="30" width="160" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="320" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Secondary Source</text>
  <text x="435" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="460" y="30" width="150" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="535" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Tertiary Source</text>
  <text x="645" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="670" y="30" width="95" height="55" rx="8" fill="#FBF8F1" stroke="#B5493A" stroke-width="1.6"/>
  <text x="717" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#B5493A">Social</text>
  <text x="717" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#B5493A">Media</text>

  <rect x="20" y="120" width="160" height="20" fill="#2C4A3E"/>
  <rect x="240" y="120" width="120" height="20" fill="#2C4A3E"/>
  <rect x="460" y="120" width="80" height="20" fill="#2C4A3E"/>
  <rect x="670" y="120" width="40" height="20" fill="#B5493A"/>

  <text x="390" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Detail and nuance tend to shrink at each summarization step.</text>
</svg>
