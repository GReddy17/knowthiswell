<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="costSeqTitle">
  <title id="costSeqTitle">A horizontal bar showing a medical cost timeline divided into three segments: the first segment labeled Deductible phase, you pay 100 percent, the second labeled Coinsurance phase, you pay a percentage, plan pays the rest, and the third labeled Out-of-pocket maximum reached, plan pays 100 percent, with an arrow showing spending accumulating left to right across the bar</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">Annual out-of-pocket spending, left to right</text>

  <!-- segmented bar -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="60" y="110" width="200" height="70" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.8"/>
    <rect x="260" y="110" width="300" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <rect x="560" y="110" width="160" height="70" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.8"/>
  </g>

  <!-- divider labels -->
  <text x="160" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">$0</text>
  <text x="260" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">deductible met</text>
  <text x="560" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">out-of-pocket max reached</text>

  <!-- segment text -->
  <text x="160" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Deductible phase</text>
  <text x="160" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">you pay 100%</text>

  <text x="410" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Coinsurance phase</text>
  <text x="410" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">you pay a %, plan pays rest</text>

  <text x="640" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Max reached</text>
  <text x="640" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">plan pays 100%</text>

  <!-- accumulation arrow -->
  <line x1="60" y1="220" x2="710" y2="220" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="390" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">spending accumulates over the plan year</text>

  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2C4A3E"/></marker>
  </defs>
</svg>
