<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="foiTitle">
  <title id="foiTitle">A flow diagram showing a Public Records Request leading to Agency Review, branching into three outcomes: Full Release, Partial Release with redactions under a cited exemption, and Full Denial with exemption cited, with the Partial Release and Full Denial branches both showing an arrow to a possible Appeal step</title>
  <rect width="780" height="300" fill="#FBF8F1"/>
  <rect x="20" y="30" width="160" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="100" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Records Request</text>
  <text x="215" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>
  <rect x="240" y="30" width="150" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="315" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Agency Review</text>

  <line x1="315" y1="85" x2="140" y2="140" stroke="#2C4A3E" stroke-width="1.4"/>
  <line x1="315" y1="85" x2="440" y2="140" stroke="#2C4A3E" stroke-width="1.4"/>
  <line x1="315" y1="85" x2="680" y2="140" stroke="#2C4A3E" stroke-width="1.4"/>

  <rect x="40" y="140" width="200" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="140" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Full Release</text>

  <rect x="340" y="140" width="200" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="440" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Partial Release</text>
  <text x="440" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">(redactions cited)</text>

  <rect x="580" y="140" width="200" height="55" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.8"/>
  <text x="680" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Full Denial</text>
  <text x="680" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">(exemption cited)</text>

  <line x1="440" y1="195" x2="500" y2="245" stroke="#2C4A3E" stroke-width="1.4"/>
  <line x1="680" y1="195" x2="580" y2="245" stroke="#2C4A3E" stroke-width="1.4"/>
  <rect x="440" y="245" width="200" height="45" rx="8" fill="#FBF8F1" stroke="#B5493A" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="540" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#B5493A">Appeal</text>
</svg>
