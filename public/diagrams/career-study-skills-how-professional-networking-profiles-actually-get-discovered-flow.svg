<svg viewBox="0 0 780 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="profileDiscoveryFlowTitle">
  <title id="profileDiscoveryFlowTitle">A flow diagram showing how a professional profile gets discovered: the profile's text is indexed by its keyword and skill fields, a recruiter's search query is matched against that index, and results are ranked by keyword match, profile completeness, and recent activity.</title>
  <rect width="780" height="230" fill="#FBF8F1"/>

  <rect x="30" y="60" width="150" height="90" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="105" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Your profile</text>
  <text x="105" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">headline, skills,</text>
  <text x="105" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">experience text</text>

  <line x1="180" y1="105" x2="218" y2="105" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowPD)"/>

  <rect x="220" y="60" width="150" height="90" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="295" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Indexed</text>
  <text x="295" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">by keyword &amp;</text>
  <text x="295" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">skill fields</text>

  <line x1="370" y1="105" x2="408" y2="105" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowPD)"/>

  <rect x="410" y="45" width="150" height="120" rx="8" fill="#2C4A3E"/>
  <text x="485" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Search query</text>
  <text x="485" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">recruiter's keywords</text>
  <text x="485" y="113" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">+ filters</text>

  <line x1="560" y1="105" x2="598" y2="105" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowPD)"/>

  <rect x="600" y="45" width="150" height="120" rx="8" fill="#8B6F4E"/>
  <text x="675" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Ranked results</text>
  <text x="675" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">match + completeness</text>
  <text x="675" y="113" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">+ recent activity</text>

  <text x="390" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Matching runs on the literal words in your profile, not on what you actually know how to do.</text>

  <defs>
    <marker id="arrowPD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
