<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="unStructureTitle">
  <title id="unStructureTitle">Structural diagram showing the UN Charter branching into six main organs — General Assembly with 193 members each with one vote, Security Council with 15 members including 5 permanent veto-holding members and 10 elected non-permanent members, Economic and Social Council, International Court of Justice, Secretariat, and the inactive Trusteeship Council — with an inset panel showing the Security Council voting rule: 9 of 15 votes needed, and any single permanent member's "no" vote blocks the resolution</title>
  <rect width="640" height="480" fill="#FBF8F1"/>
  <text x="320" y="24" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15.5" font-weight="600" fill="#1F1B16">The UN's six main organs</text>

  <!-- charter -->
  <rect x="255" y="38" width="130" height="34" rx="4" fill="#1F1B16"/>
  <text x="320" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">UN CHARTER</text>

  <!-- branch lines -->
  <line x1="320" y1="72" x2="320" y2="88" stroke="#8B6F4E" stroke-width="1.5"/>
  <line x1="60" y1="88" x2="580" y2="88" stroke="#8B6F4E" stroke-width="1.5"/>
  <g stroke="#8B6F4E" stroke-width="1.5">
    <line x1="60" y1="88" x2="60" y2="100"/>
    <line x1="164" y1="88" x2="164" y2="100"/>
    <line x1="268" y1="88" x2="268" y2="100"/>
    <line x1="372" y1="88" x2="372" y2="100"/>
    <line x1="476" y1="88" x2="476" y2="100"/>
    <line x1="580" y1="88" x2="580" y2="100"/>
  </g>

  <!-- six organ boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- General Assembly -->
    <rect x="16" y="100" width="88" height="80" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.2"/>
    <text x="60" y="118" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F1B16">General</text>
    <text x="60" y="129" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F1B16">Assembly</text>
    <text x="60" y="146" text-anchor="middle" font-size="7.5" fill="#4A443C">193 members</text>
    <text x="60" y="158" text-anchor="middle" font-size="7.5" fill="#4A443C">one vote</text>
    <text x="60" y="169" text-anchor="middle" font-size="7.5" fill="#4A443C">each</text>

    <!-- Security Council -->
    <rect x="120" y="100" width="88" height="80" rx="4" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.2"/>
    <text x="164" y="118" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F1B16">Security</text>
    <text x="164" y="129" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F1B16">Council</text>
    <text x="164" y="146" text-anchor="middle" font-size="7.5" fill="#4A443C">15 members:</text>
    <text x="164" y="158" text-anchor="middle" font-size="7.5" fill="#4A443C">5 permanent</text>
    <text x="164" y="169" text-anchor="middle" font-size="7.5" fill="#4A443C">+10 elected</text>

    <!-- ECOSOC -->
    <rect x="224" y="100" width="88" height="80" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.2"/>
    <text x="268" y="122" text-anchor="middle" font-size="8" font-weight="700" fill="#1F1B16">Economic &amp;</text>
    <text x="268" y="133" text-anchor="middle" font-size="8" font-weight="700" fill="#1F1B16">Social Council</text>
    <text x="268" y="152" text-anchor="middle" font-size="7.5" fill="#4A443C">(ECOSOC)</text>

    <!-- ICJ -->
    <rect x="328" y="100" width="88" height="80" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.2"/>
    <text x="372" y="122" text-anchor="middle" font-size="8" font-weight="700" fill="#1F1B16">International</text>
    <text x="372" y="133" text-anchor="middle" font-size="8" font-weight="700" fill="#1F1B16">Court of</text>
    <text x="372" y="144" text-anchor="middle" font-size="8" font-weight="700" fill="#1F1B16">Justice</text>
    <text x="372" y="160" text-anchor="middle" font-size="7.5" fill="#4A443C">(ICJ, The Hague)</text>

    <!-- Secretariat -->
    <rect x="432" y="100" width="88" height="80" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.2"/>
    <text x="476" y="126" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1F1B16">Secretariat</text>
    <text x="476" y="146" text-anchor="middle" font-size="7.5" fill="#4A443C">Secretary-</text>
    <text x="476" y="157" text-anchor="middle" font-size="7.5" fill="#4A443C">General &amp; staff</text>

    <!-- Trusteeship Council (inactive) -->
    <rect x="536" y="100" width="88" height="80" rx="4" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="580" y="122" text-anchor="middle" font-size="8" font-weight="700" fill="#4A443C">Trusteeship</text>
    <text x="580" y="133" text-anchor="middle" font-size="8" font-weight="700" fill="#4A443C">Council</text>
    <text x="580" y="152" text-anchor="middle" font-size="7.5" fill="#8B6F4E">(inactive</text>
    <text x="580" y="163" text-anchor="middle" font-size="7.5" fill="#8B6F4E">since 1994)</text>
  </g>

  <line x1="30" y1="205" x2="610" y2="205" stroke="#E3DCC9" stroke-width="1"/>

  <!-- inset: Security Council veto mechanics -->
  <rect x="60" y="222" width="520" height="230" rx="6" fill="#FBEDEA" opacity="0.4" stroke="#C9412C" stroke-width="1"/>
  <text x="320" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">How the Security Council veto works</text>

  <!-- 15 seats: 5 permanent + 10 non-permanent -->
  <g>
    <text x="90" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#8A3626">5 permanent members (veto power)</text>
    <g>
      <circle cx="100" cy="290" r="11" fill="#C9412C"/><text x="100" y="294" text-anchor="middle" font-size="8" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, sans-serif">US</text>
      <circle cx="130" cy="290" r="11" fill="#C9412C"/><text x="130" y="294" text-anchor="middle" font-size="8" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, sans-serif">UK</text>
      <circle cx="160" cy="290" r="11" fill="#C9412C"/><text x="160" y="294" text-anchor="middle" font-size="7" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, sans-serif">FR</text>
      <circle cx="190" cy="290" r="11" fill="#C9412C"/><text x="190" y="294" text-anchor="middle" font-size="7" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, sans-serif">RU</text>
      <circle cx="220" cy="290" r="11" fill="#C9412C"/><text x="220" y="294" text-anchor="middle" font-size="7" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, sans-serif">CN</text>
    </g>

    <text x="90" y="326" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#4A443C">10 elected non-permanent members (no veto)</text>
    <g fill="#8B6F4E">
      <circle cx="100" cy="345" r="8"/><circle cx="122" cy="345" r="8"/><circle cx="144" cy="345" r="8"/><circle cx="166" cy="345" r="8"/><circle cx="188" cy="345" r="8"/>
      <circle cx="100" cy="365" r="8"/><circle cx="122" cy="365" r="8"/><circle cx="144" cy="365" r="8"/><circle cx="166" cy="365" r="8"/><circle cx="188" cy="365" r="8"/>
    </g>
  </g>

  <!-- vote rule -->
  <g>
    <rect x="360" y="264" width="190" height="150" rx="5" fill="#FBF8F1" stroke="#D8CFBB"/>
    <text x="455" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Passing a resolution</text>
    <text x="455" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Needs 9 of 15 votes</text>
    <text x="455" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">in favor</text>

    <line x1="378" y1="330" x2="532" y2="330" stroke="#E3DCC9" stroke-width="1"/>

    <circle cx="400" cy="352" r="10" fill="#C9412C"/>
    <text x="400" y="356" text-anchor="middle" font-size="9" fill="#FBF8F1" font-family="ui-sans-serif, system-ui, sans-serif">P5</text>
    <text x="440" y="349" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">votes</text>
    <text x="440" y="361" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#8A3626">"no" (veto)</text>

    <text x="455" y="385" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#8A3626">= resolution blocked</text>
    <text x="455" y="399" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">even with 14 other votes in favor</text>
  </g>
</svg>
