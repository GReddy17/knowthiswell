<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dfTitle">
  <title id="dfTitle">How a digital footprint is assembled: scattered pieces (posts and photos, phone location, purchases, public records) are combined by data brokers and people-search sites into one profile, which reveals home and routine, security-question answers and inferred traits, and is used by advertisers, scammers and stalkers. Deleting one source does not erase copies.</title>
  <defs>
    <marker id="dfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A443C"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1F1B16">Harmless pieces, revealing picture</text>

    <text x="100" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#8B6F4E">1. SCATTERED PIECES</text>
    <rect x="20" y="68" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#8B6F4E"/>
    <text x="100" y="92" text-anchor="middle" font-size="11" fill="#1F1B16">Posts, photos, birthdays</text>
    <rect x="20" y="116" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#8B6F4E"/>
    <text x="100" y="140" text-anchor="middle" font-size="11" fill="#1F1B16">Phone and app location</text>
    <rect x="20" y="164" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#8B6F4E"/>
    <text x="100" y="188" text-anchor="middle" font-size="11" fill="#1F1B16">Purchases, loyalty cards</text>
    <rect x="20" y="212" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#8B6F4E"/>
    <text x="100" y="236" text-anchor="middle" font-size="11" fill="#1F1B16">Public records (property, voter)</text>

    <line x1="184" y1="160" x2="236" y2="160" stroke="#4A443C" stroke-width="2" marker-end="url(#dfArrow)"/>

    <text x="320" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4A3E">2. COMBINED</text>
    <rect x="242" y="96" width="156" height="128" rx="10" fill="#2C4A3E"/>
    <text x="320" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Data brokers and</text>
    <text x="320" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">people-search sites</text>
    <text x="320" y="166" text-anchor="middle" font-size="11" fill="#FFFFFF">match pieces into</text>
    <text x="320" y="181" text-anchor="middle" font-size="11" fill="#FFFFFF">one profile</text>
    <text x="320" y="206" text-anchor="middle" font-size="10" fill="#FFFFFF">ZIP + birth date + gender</text>
    <text x="320" y="219" text-anchor="middle" font-size="10" fill="#FFFFFF">singles out ~87% (Sweeney)</text>

    <line x1="402" y1="160" x2="452" y2="160" stroke="#4A443C" stroke-width="2" marker-end="url(#dfArrow)"/>

    <text x="560" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#B5552B">3. WHAT IT REVEALS</text>
    <rect x="458" y="68" width="204" height="48" rx="6" fill="#B5552B" opacity="0.15" stroke="#B5552B"/>
    <text x="560" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Home address, routine</text>
    <text x="560" y="104" text-anchor="middle" font-size="10" fill="#4A443C">4 location points: 95% unique</text>
    <rect x="458" y="124" width="204" height="48" rx="6" fill="#B5552B" opacity="0.15" stroke="#B5552B"/>
    <text x="560" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Security-question answers</text>
    <text x="560" y="160" text-anchor="middle" font-size="10" fill="#4A443C">pet, hometown, maiden name</text>
    <rect x="458" y="180" width="204" height="48" rx="6" fill="#B5552B" opacity="0.15" stroke="#B5552B"/>
    <text x="560" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Inferred traits</text>
    <text x="560" y="216" text-anchor="middle" font-size="10" fill="#4A443C">politics, interests (from likes)</text>

    <line x1="560" y1="232" x2="560" y2="262" stroke="#4A443C" stroke-width="2" marker-end="url(#dfArrow)"/>
    <text x="420" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Who uses it</text>
    <rect x="250" y="296" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#4A443C"/>
    <text x="315" y="317" text-anchor="middle" font-size="11" fill="#1F1B16">Advertisers</text>
    <rect x="390" y="296" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#4A443C"/>
    <text x="455" y="317" text-anchor="middle" font-size="11" fill="#1F1B16">Scammers</text>
    <rect x="530" y="296" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#4A443C"/>
    <text x="595" y="317" text-anchor="middle" font-size="11" fill="#1F1B16">Stalkers, doxxers</text>

    <text x="20" y="290" font-size="11" font-weight="700" fill="#4A443C">Note:</text>
    <text x="20" y="306" font-size="10" fill="#4A443C">deleting one source doesn't</text>
    <text x="20" y="320" font-size="10" fill="#4A443C">erase copies already made.</text>
    <text x="340" y="362" text-anchor="middle" font-size="10" fill="#4A443C">Figures: Sweeney (2000); de Montjoye et al. (2013); Kosinski et al. (2013).</text>
  </g>
</svg>
