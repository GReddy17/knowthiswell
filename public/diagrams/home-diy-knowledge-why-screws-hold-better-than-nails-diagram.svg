<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screwsNailsTitle">
  <title id="screwsNailsTitle">A nail driven into wood holds only through friction from compressed wood fibers pressing on its smooth, straight shank, so it resists a straight pull-out with a single continuous grip. A screw's helical thread is a wedge wrapped around a cylinder, so as it turns, each wrap of the thread cuts a matching groove into the wood and mechanically interlocks with it along the entire shank, resisting pull-out far more strongly than friction alone.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Friction grip vs. mechanical interlock</text>

  <!-- Panel A: Nail -->
  <text x="195" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">Nail — friction only</text>
  <rect x="70" y="65" width="250" height="150" fill="none" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="80" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">wood cross-section</text>
  <rect x="188" y="65" width="14" height="150" fill="#4A443C"/>
  <!-- compressed fiber marks -->
  <line x1="150" y1="90" x2="185" y2="90" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="150" y1="120" x2="185" y2="120" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="150" y1="150" x2="185" y2="150" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="150" y1="180" x2="185" y2="180" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="140" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Wood fibers compress</text>
  <text x="140" y="243" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">and spring back against a</text>
  <text x="140" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">smooth shank — friction only.</text>
  <line x1="195" y1="60" x2="195" y2="30" stroke="#4A443C" stroke-width="3" marker-end="url(#arrowSN1)"/>
  <text x="240" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">pull-out resisted by</text>
  <text x="240" y="57" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">surface friction alone</text>

  <!-- Panel B: Screw -->
  <text x="590" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">Screw — mechanical interlock</text>
  <rect x="465" y="65" width="250" height="150" fill="none" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="475" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">wood cross-section</text>
  <!-- screw shank with helical thread teeth -->
  <rect x="583" y="65" width="10" height="150" fill="#4A443C"/>
  <path d="M593,70 L610,78 L593,86 L610,94 L593,102 L610,110 L593,118 L610,126 L593,134 L610,142 L593,150 L610,158 L593,166 L610,174 L593,182 L610,190 L593,198 L610,206 L593,210" fill="none" stroke="#2C4A3E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M583,70 L566,78 L583,86 L566,94 L583,102 L566,110 L583,118 L566,126 L583,134 L566,142 L583,150 L566,158 L583,166 L566,174 L583,182 L566,190 L583,198 L566,206 L583,210" fill="none" stroke="#2C4A3E" stroke-width="2" stroke-linejoin="round"/>
  <text x="535" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Each thread wrap cuts a groove</text>
  <text x="535" y="243" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">into the wood and locks into it —</text>
  <text x="535" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">friction plus physical interlock.</text>
  <line x1="597" y1="60" x2="597" y2="30" stroke="#4A443C" stroke-width="3" marker-end="url(#arrowSN1)"/>
  <text x="605" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">pull-out resisted by threads</text>
  <text x="605" y="57" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">along the entire shank</text>

  <defs>
    <marker id="arrowSN1" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#4A443C"/>
    </marker>
  </defs>

  <text x="390" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">A thread is a wedge wrapped helically around a cylinder — that geometry is what a smooth nail shank never has.</text>
</svg>
