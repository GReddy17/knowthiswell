<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screwCompareTitle">
  <title id="screwCompareTitle">A top-down comparison of a flathead screw slot with a straight blade that can slip sideways under off-center torque, versus a Phillips cross-shaped recess whose tapered walls self-center the bit and let it cam straight upward out of the recess at high torque instead of slipping sideways.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="390" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Two head shapes, two failure behaviors under torque</text>

  <!-- LEFT: flathead -->
  <circle cx="200" cy="150" r="78" fill="#E8DEC8" stroke="#4A443C" stroke-width="2"/>
  <rect x="130" y="140" width="140" height="18" rx="3" fill="#1F1B16"/>
  <!-- blade offset toward one end, angled to show slip -->
  <rect x="205" y="132" width="80" height="12" rx="2" fill="#8B6F4E" transform="rotate(-8 205 138)"/>
  <path d="M280,120 Q 320,100 330,70" fill="none" stroke="#8B6F4E" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrowSlip)"/>
  <text x="200" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Flathead</text>
  <text x="200" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Single straight slot — an</text>
  <text x="200" y="283" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">off-center push slides the</text>
  <text x="200" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">blade sideways and out.</text>

  <!-- RIGHT: phillips -->
  <circle cx="580" cy="150" r="78" fill="#E8DEC8" stroke="#4A443C" stroke-width="2"/>
  <rect x="565" y="80" width="30" height="140" fill="#1F1B16"/>
  <rect x="510" y="135" width="140" height="30" fill="#1F1B16"/>
  <!-- phillips bit centered -->
  <rect x="571" y="105" width="18" height="90" fill="#8B6F4E"/>
  <rect x="535" y="141" width="90" height="18" fill="#8B6F4E"/>
  <line x1="580" y1="95" x2="580" y2="60" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowUp)"/>
  <text x="580" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Phillips</text>
  <text x="580" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Cross-shaped recess self-</text>
  <text x="580" y="283" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">centers the bit and cams</text>
  <text x="580" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">straight out at high torque.</text>

  <defs>
    <marker id="arrowSlip" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/>
    </marker>
    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="390" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Same applied torque, different geometry — one slips sideways, the other pops straight up.</text>
</svg>
