<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emergFlowTitle">
  <title id="emergFlowTitle">A simple flow diagram showing a bystander observing a general warning-sign category such as sudden severe pain, trouble breathing, or sudden confusion, leading directly to a single action box reading call emergency services, which then leads to a triage and treatment box handled by trained responders — illustrating that no diagnosis step happens before the call.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <rect x="20" y="80" width="200" height="100" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Warning-sign category</text>
  <text x="120" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">severe pain, trouble</text>
  <text x="120" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">breathing, confusion...</text>

  <path d="M 220 130 L 280 130" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="250" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A" font-style="italic">no diagnosis step</text>

  <rect x="290" y="80" width="200" height="100" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Call emergency</text>
  <text x="390" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">services</text>

  <path d="M 490 130 L 550 130" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="560" y="80" width="200" height="100" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="660" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Triage &amp; treatment</text>
  <text x="660" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">by trained responders</text>
  <text x="660" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">(diagnosis happens here)</text>

  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="390" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The bystander's job is recognizing the category and calling — not determining the cause.</text>
</svg>
