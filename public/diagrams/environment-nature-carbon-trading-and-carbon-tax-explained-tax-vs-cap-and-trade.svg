<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carbonTaxVsCapTitle">
  <title id="carbonTaxVsCapTitle">A two-column comparison diagram. The left column, labeled Carbon Tax, shows a fixed price per ton icon leading to a variable, uncertain total emissions outcome. The right column, labeled Cap-and-Trade, shows a fixed total emissions cap icon leading to a variable, market-determined price per ton, with small arrows between company icons representing permit trading.</title>
  <rect width="800" height="320" fill="#FBF8F1"/>

  <text x="200" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1F1B16">Carbon Tax</text>
  <line x1="400" y1="20" x2="400" y2="290" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="600" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1F1B16">Cap-and-Trade</text>

  <rect x="80" y="65" width="240" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">FIXED: Price per ton</text>
  <text x="200" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">set directly by law</text>

  <text x="200" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8595;</text>

  <rect x="80" y="175" width="240" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#B5493A">FLOATS: Total emissions</text>
  <text x="200" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">depends on market response</text>

  <rect x="480" y="65" width="240" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">FIXED: Total emissions cap</text>
  <text x="600" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">set directly by law</text>

  <text x="600" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8595;</text>

  <rect x="480" y="175" width="240" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#B5493A">FLOATS: Price per ton</text>
  <text x="600" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">set by permit trading</text>
  <text x="600" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">between companies</text>

  <!-- small trading arrows for cap-and-trade -->
  <circle cx="520" cy="270" r="14" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="520" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">Co. A</text>
  <circle cx="680" cy="270" r="14" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="680" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">Co. B</text>
  <line x1="536" y1="266" x2="664" y2="266" stroke="#B5493A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#B5493A"/>
    </marker>
  </defs>
  <text x="600" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">permits bought/sold between emitters</text>
</svg>
