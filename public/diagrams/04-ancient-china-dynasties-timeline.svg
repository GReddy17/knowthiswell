<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of major Chinese dynasties from the Xia around 2070 BCE through the Han Dynasty ending 220 CE</title>
  <rect width="680" height="220" fill="#FBF8F1"/>
  <line x1="40" y1="140" x2="640" y2="140" stroke="#1F1B16" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- Xia -->
    <rect x="40" y="120" width="70" height="40" fill="#EDE7D8"/>
    <text x="75" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Xia</text>
    <text x="75" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">c. 2070 BCE</text>

    <!-- Shang -->
    <rect x="110" y="120" width="110" height="40" fill="#EEF3EE"/>
    <text x="165" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Shang</text>
    <text x="165" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">c. 1600 BCE</text>
    <text x="165" y="150" text-anchor="middle" font-size="9.5" fill="#4A443C">oracle bones</text>

    <!-- Zhou -->
    <rect x="220" y="120" width="240" height="40" fill="#FBEDEA"/>
    <text x="340" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Zhou</text>
    <text x="340" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">1046 BCE</text>
    <text x="340" y="150" text-anchor="middle" font-size="9.5" fill="#4A443C">Mandate of Heaven introduced</text>

    <!-- Qin -->
    <rect x="460" y="120" width="35" height="40" fill="#E3DCC9"/>
    <text x="477" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Qin</text>
    <text x="477" y="180" text-anchor="middle" font-size="10" fill="#8B6F4E">221 BCE</text>

    <!-- Han -->
    <rect x="495" y="120" width="145" height="40" fill="#EEF3EE"/>
    <text x="567" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Han</text>
    <text x="567" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">206 BCE – 220 CE</text>
  </g>
  <rect x="40" y="120" width="600" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="110" y1="120" x2="110" y2="160" stroke="#1F1B16" stroke-width="1"/>
  <line x1="220" y1="120" x2="220" y2="160" stroke="#1F1B16" stroke-width="1"/>
  <line x1="460" y1="120" x2="460" y2="160" stroke="#1F1B16" stroke-width="1"/>
  <line x1="495" y1="120" x2="495" y2="160" stroke="#1F1B16" stroke-width="1"/>
</svg>
