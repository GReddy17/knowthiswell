<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pixelsResolutionTitle">
  <title id="pixelsResolutionTitle">Diagram comparing a coarse pixel grid representing 1080p to a much finer pixel grid of the same physical area representing 4K, showing 4K packs four times as many pixels into the same space, and a close-up of one pixel split into red, green, and blue subpixels</title>
  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <text x="160" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="700" fill="#1F1B16">1080p (1920x1080)</text>
  <text x="480" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="700" fill="#1F1B16">4K UHD (3840x2160)</text>

  <!-- 1080p grid: 8x8 coarse -->
  <g transform="translate(70,55)">
    <rect x="0" y="0" width="180" height="180" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <g stroke="#2C4A3E" stroke-width="1" opacity="0.5">
      <line x1="45" y1="0" x2="45" y2="180"/><line x1="90" y1="0" x2="90" y2="180"/><line x1="135" y1="0" x2="135" y2="180"/>
      <line x1="0" y1="45" x2="180" y2="45"/><line x1="0" y1="90" x2="180" y2="90"/><line x1="0" y1="135" x2="180" y2="135"/>
    </g>
  </g>
  <text x="160" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">~2.07 million pixels total</text>

  <!-- 4K grid: 16x16 fine, same physical box size -->
  <g transform="translate(390,55)">
    <rect x="0" y="0" width="180" height="180" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <g stroke="#2C4A3E" stroke-width="0.5" opacity="0.5">
      <line x1="22.5" y1="0" x2="22.5" y2="180"/><line x1="45" y1="0" x2="45" y2="180"/><line x1="67.5" y1="0" x2="67.5" y2="180"/><line x1="90" y1="0" x2="90" y2="180"/>
      <line x1="112.5" y1="0" x2="112.5" y2="180"/><line x1="135" y1="0" x2="135" y2="180"/><line x1="157.5" y1="0" x2="157.5" y2="180"/>
      <line x1="0" y1="22.5" x2="180" y2="22.5"/><line x1="0" y1="45" x2="180" y2="45"/><line x1="0" y1="67.5" x2="180" y2="67.5"/><line x1="0" y1="90" x2="180" y2="90"/>
      <line x1="0" y1="112.5" x2="180" y2="112.5"/><line x1="0" y1="135" x2="180" y2="135"/><line x1="0" y1="157.5" x2="180" y2="157.5"/>
    </g>
  </g>
  <text x="480" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">~8.3 million pixels total</text>
  <text x="480" y="271" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#C9412C">4x the pixels, same area</text>

  <!-- subpixel closeup -->
  <text x="320" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">One pixel, magnified: three subpixels</text>
  <g transform="translate(260,315)">
    <rect x="0" y="0" width="160" height="60" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="1.5"/>
    <rect x="4" y="4" width="48" height="52" fill="#C9412C"/>
    <rect x="56" y="4" width="48" height="52" fill="#2C4A3E"/>
    <rect x="108" y="4" width="48" height="52" fill="#3B5BA5"/>
    <text x="28" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">R</text>
    <text x="80" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">G</text>
    <text x="132" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">B</text>
  </g>
  <text x="320" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Mixing each subpixel's brightness produces every color the pixel displays.</text>
</svg>
