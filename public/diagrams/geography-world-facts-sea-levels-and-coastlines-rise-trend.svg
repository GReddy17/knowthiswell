<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seaLevelTitle">
  <title id="seaLevelTitle">A line graph showing global mean sea level rising gradually from 1880 to about 1990, then rising more steeply through the satellite altimetry era to the present, with a side panel breaking down the total rise into two stacked contributing components: thermal expansion of ocean water and melted land ice from glaciers and ice sheets</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="22" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Global mean sea level rise since 1880</text>

  <!-- axes -->
  <line x1="60" y1="340" x2="400" y2="340" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="60" y2="55" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="230" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Year</text>
  <text x="30" y="55" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C" transform="rotate(-90 30 55)">Rise (mm) &#8594;</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">
    <text x="80" y="355" text-anchor="middle">1880</text>
    <text x="183.5" y="355" text-anchor="middle">1930</text>
    <text x="307.6" y="355" text-anchor="middle">1990</text>
    <text x="380" y="355" text-anchor="middle">2025</text>
  </g>

  <!-- 1990 marker: start of satellite altimetry era -->
  <line x1="307.6" y1="340" x2="307.6" y2="60" stroke="#E3DCC9" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="311" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">satellite altimetry era begins</text>

  <!-- gradual pre-1990 segment -->
  <polyline points="80,340 121.4,323.2 183.5,284 245.5,239.2 307.6,183.2"
    fill="none" stroke="#4A443C" stroke-width="2.4"/>
  <!-- steeper post-1990 segment -->
  <polyline points="307.6,183.2 328.3,155.2 349,121.6 380,71.2"
    fill="none" stroke="#2C4A3E" stroke-width="3"/>
  <circle cx="380" cy="71.2" r="4.5" fill="#2C4A3E"/>
  <text x="368" y="60" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2C4A3E">today</text>

  <text x="120" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">gradual rise</text>
  <text x="330" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#2C4A3E">steeper rise</text>

  <!-- divider -->
  <line x1="425" y1="55" x2="425" y2="360" stroke="#E3DCC9" stroke-width="1"/>

  <!-- side panel: stacked contributions to total rise -->
  <text x="530" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">What's driving the rise</text>

  <rect x="490" y="100" width="80" height="108" fill="#C97C3D"/>
  <rect x="490" y="208" width="80" height="132" fill="#5B7A99"/>
  <line x1="490" y1="100" x2="570" y2="100" stroke="#1F1B16" stroke-width="1"/>
  <line x1="490" y1="340" x2="570" y2="340" stroke="#1F1B16" stroke-width="1"/>

  <text x="530" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBF8F1">Thermal</text>
  <text x="530" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBF8F1">expansion</text>
  <text x="530" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBF8F1">Melted land</text>
  <text x="530" y="283" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBF8F1">ice: glaciers</text>
  <text x="530" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBF8F1">&amp; ice sheets</text>

  <text x="530" y="355" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">Total rise = both combined</text>

  <text x="320" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Ocean water expands as it warms; melting glaciers and ice sheets add new water to the ocean.</text>
</svg>
