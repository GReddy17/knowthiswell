<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="latLongTitle">
  <title id="latLongTitle">Two globes side by side: one shows latitude lines, or parallels, as evenly spaced horizontal circles that never converge from equator to poles; the other shows longitude lines, or meridians, as vertical lines that start evenly spaced at the equator and converge to single points at the North and South Poles</title>
  <rect width="640" height="380" fill="#FBF8F1"/>

  <text x="160" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Latitude (parallels)</text>
  <text x="480" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Longitude (meridians)</text>

  <line x1="320" y1="20" x2="320" y2="330" stroke="#E3DCC9" stroke-width="1"/>

  <!-- LEFT GLOBE: parallels, evenly spaced, never converge -->
  <g transform="translate(160,190)">
    <circle r="140" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="140" ry="140" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="138" ry="46" fill="none" stroke="#4A7A9E" stroke-width="2"/>
    <ellipse cx="0" cy="-70" rx="120" ry="34" fill="none" stroke="#4A7A9E" stroke-width="1.5"/>
    <ellipse cx="0" cy="70" rx="120" ry="34" fill="none" stroke="#4A7A9E" stroke-width="1.5"/>
    <ellipse cx="0" cy="-118" rx="70" ry="18" fill="none" stroke="#4A7A9E" stroke-width="1.5"/>
    <ellipse cx="0" cy="118" rx="70" ry="18" fill="none" stroke="#4A7A9E" stroke-width="1.5"/>
    <text x="0" y="-6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#3D6A83">equator</text>
    <text x="150" y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">stay parallel &#8212;</text>
    <text x="150" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">never meet</text>
  </g>

  <!-- RIGHT GLOBE: meridians, converge at poles -->
  <g transform="translate(480,190)">
    <circle r="140" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="140" ry="140" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="138" ry="46" fill="none" stroke="#C97C3D" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 0,-140 C 55,-100 55,100 0,140" fill="none" stroke="#C97C3D" stroke-width="2"/>
    <path d="M 0,-140 C -55,-100 -55,100 0,140" fill="none" stroke="#C97C3D" stroke-width="2"/>
    <path d="M 0,-140 C 100,-90 100,90 0,140" fill="none" stroke="#C97C3D" stroke-width="1.5"/>
    <path d="M 0,-140 C -100,-90 -100,90 0,140" fill="none" stroke="#C97C3D" stroke-width="1.5"/>
    <path d="M 0,-140 L 0,140" stroke="#C97C3D" stroke-width="1.5"/>
    <circle cx="0" cy="-140" r="4" fill="#1F1B16"/>
    <circle cx="0" cy="140" r="4" fill="#1F1B16"/>
    <text x="0" y="-150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">N pole</text>
    <text x="0" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">S pole</text>
    <text x="150" y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">converge at</text>
    <text x="150" y="14" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">each pole</text>
  </g>

  <text x="320" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">This is why 1&#176; of longitude covers less real distance near the poles than at the equator.</text>
</svg>
