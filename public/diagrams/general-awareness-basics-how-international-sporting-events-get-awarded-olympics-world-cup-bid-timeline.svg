<svg viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bidTimelineTitle">
  <title id="bidTimelineTitle">A horizontal timeline with five stages connected by arrows: Candidate cities declare bids, evaluation commission visits and assesses each bid, technical assessment report published, governing body members vote at a general session, winning host signs a binding host contract</title>
  <rect width="820" height="240" fill="#FBF8F1"/>

  <line x1="40" y1="120" x2="780" y2="120" stroke="#2C4A3E" stroke-width="2"/>

  <g>
    <circle cx="80" cy="120" r="9" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="80" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Candidate</text>
    <text x="80" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">cities declare</text>
  </g>

  <g>
    <circle cx="255" cy="120" r="9" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="255" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Evaluation commission</text>
    <text x="255" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">visits and assesses</text>
  </g>

  <g>
    <circle cx="430" cy="120" r="9" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="430" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Technical report</text>
    <text x="430" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">published</text>
  </g>

  <g>
    <circle cx="605" cy="120" r="9" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="605" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Members vote</text>
    <text x="605" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">at general session</text>
  </g>

  <g>
    <circle cx="760" cy="120" r="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
    <text x="760" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Host contract</text>
    <text x="760" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">signed</text>
  </g>

  <text x="410" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Each stage adds formal documentation — the process spans years, not a single vote.</text>
</svg>
