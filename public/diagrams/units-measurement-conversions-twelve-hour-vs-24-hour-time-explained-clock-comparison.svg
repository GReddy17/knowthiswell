<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clockCompareTitle">
  <title id="clockCompareTitle">A comparison diagram showing a 12-hour analog clock face on the left reading 3:15 with AM and PM labels both pointing to the same position, next to a 24-hour horizontal number line on the right running from 0 to 23 with a marker at 15 labeled 15:15, and an arrow between them showing 3:15 PM converts to 15:15</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <!-- 12-hour clock face -->
  <circle cx="150" cy="150" r="95" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="150" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">12</text>
  <text x="150" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">6</text>
  <text x="26" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">9</text>
  <text x="274" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">3</text>
  <line x1="150" y1="150" x2="200" y2="150" stroke="#2C4A3E" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="150" x2="150" y2="90" stroke="#B5493A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="150" cy="150" r="4" fill="#1F1B16"/>
  <text x="150" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#4A443C">3:15 — could be AM or PM</text>

  <text x="330" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">→</text>

  <!-- 24-hour number line -->
  <line x1="410" y1="150" x2="760" y2="150" stroke="#2C4A3E" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">
    <text x="410" y="175" text-anchor="middle">0</text>
    <text x="470" y="175" text-anchor="middle">4</text>
    <text x="530" y="175" text-anchor="middle">8</text>
    <text x="590" y="175" text-anchor="middle">12</text>
    <text x="650" y="175" text-anchor="middle">16</text>
    <text x="710" y="175" text-anchor="middle">20</text>
    <text x="760" y="175" text-anchor="middle">23</text>
  </g>
  <line x1="620" y1="140" x2="620" y2="160" stroke="#B5493A" stroke-width="3"/>
  <rect x="580" y="90" width="90" height="40" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="625" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">15:15</text>

  <text x="585" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">One number per hour, 0–23 — no AM/PM label needed</text>
</svg>
