<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wastedFoodScaleTitle">
  <title id="wastedFoodScaleTitle">A vertical ranked list of six tiers from top (most preferred) to bottom (least preferred): Prevent surplus food, Feed hungry people, Feed animals, Industrial uses, Composting, and Landfill or combustion at the bottom, with a downward arrow indicating decreasing environmental preference.</title>
  <rect width="640" height="340" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">
    <rect x="140" y="20" width="360" height="38" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
    <text x="320" y="44" text-anchor="middle">1. Prevent surplus food</text>

    <rect x="150" y="66" width="340" height="38" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="320" y="90" text-anchor="middle">2. Feed hungry people</text>

    <rect x="160" y="112" width="320" height="38" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="320" y="136" text-anchor="middle">3. Feed animals</text>

    <rect x="170" y="158" width="300" height="38" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="320" y="182" text-anchor="middle">4. Industrial uses</text>

    <rect x="180" y="204" width="280" height="38" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="320" y="228" text-anchor="middle">5. Composting</text>

    <rect x="190" y="250" width="260" height="40" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
    <text x="320" y="275" text-anchor="middle" fill="#B5493A">6. Landfill / combustion</text>
  </g>

  <line x1="60" y1="30" x2="60" y2="285" stroke="#4A443C" stroke-width="1.6"/>
  <polygon points="54,285 66,285 60,297" fill="#4A443C"/>
  <text x="60" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">decreasing preference</text>
</svg>
