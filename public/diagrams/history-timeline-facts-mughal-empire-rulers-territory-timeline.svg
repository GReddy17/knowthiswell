<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline and map of the Mughal Empire's major rulers and territorial extent: founded by Babur in 1526, Akbar's administrative consolidation from 1556 to 1605, Shah Jahan's construction of the Taj Mahal between 1632 and 1653, Aurangzeb's reign from 1658 to 1707 when the empire reached its largest territorial extent across most of the Indian subcontinent, its decline through the 18th century, and its formal end in 1857 following the Indian Rebellion</title>
  <rect width="780" height="400" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="390" y="24" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">The Mughal Empire: rulers and territorial extent</text>
    <text x="390" y="41" text-anchor="middle" font-size="10.5" fill="#8B6F4E">1526-1857</text>

    <rect x="40" y="140" width="60" height="40" fill="#EDE7D8"/>
    <text x="70" y="127" text-anchor="middle" font-size="10" font-weight="600" fill="#1F1B16">Babur</text>
    <text x="70" y="196" text-anchor="middle" font-size="9" fill="#8B6F4E">founds 1526</text>

    <rect x="100" y="140" width="140" height="40" fill="#EEF3EE"/>
    <text x="170" y="127" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Akbar</text>
    <text x="170" y="163" text-anchor="middle" font-size="8.5" fill="#4A443C">administrative consolidation</text>
    <text x="170" y="196" text-anchor="middle" font-size="9" fill="#8B6F4E">1556-1605</text>

    <rect x="240" y="140" width="130" height="40" fill="#FBEDEA"/>
    <text x="305" y="127" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Shah Jahan</text>
    <text x="305" y="163" text-anchor="middle" font-size="8.5" fill="#4A443C">Taj Mahal built 1632-53</text>
    <text x="305" y="196" text-anchor="middle" font-size="9" fill="#8B6F4E">1628-1658</text>

    <rect x="370" y="140" width="140" height="40" fill="#EEF3EE"/>
    <text x="440" y="127" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Aurangzeb</text>
    <text x="440" y="163" text-anchor="middle" font-size="8.5" fill="#4A443C">largest territorial extent</text>
    <text x="440" y="196" text-anchor="middle" font-size="9" fill="#8B6F4E">1658-1707</text>

    <rect x="510" y="140" width="140" height="40" fill="#EDE7D8"/>
    <text x="580" y="127" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Decline</text>
    <text x="580" y="163" text-anchor="middle" font-size="8.5" fill="#4A443C">fragmenting authority</text>
    <text x="580" y="196" text-anchor="middle" font-size="9" fill="#8B6F4E">18th century</text>

    <rect x="650" y="140" width="90" height="40" fill="#FBEDEA"/>
    <text x="695" y="127" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Formal end</text>
    <text x="695" y="196" text-anchor="middle" font-size="9" fill="#8B6F4E">1857</text>

    <rect x="40" y="140" width="700" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
    <line x1="100" y1="140" x2="100" y2="180" stroke="#1F1B16"/>
    <line x1="240" y1="140" x2="240" y2="180" stroke="#1F1B16"/>
    <line x1="370" y1="140" x2="370" y2="180" stroke="#1F1B16"/>
    <line x1="510" y1="140" x2="510" y2="180" stroke="#1F1B16"/>
    <line x1="650" y1="140" x2="650" y2="180" stroke="#1F1B16"/>

    <!-- territory inset -->
    <text x="390" y="232" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Territory at its height, under Aurangzeb, c. 1700</text>
    <path d="M370,250 Q420,244 445,265 Q462,290 458,325 Q452,365 430,388 Q405,400 383,392 Q362,378 355,348 Q348,310 355,280 Q360,262 370,250 Z"
          fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <circle cx="405" cy="272" r="4" fill="#C9412C"/>
    <text x="414" y="270" font-size="9.5" fill="#1F1B16">Delhi &amp; Agra</text>
    <text x="405" y="345" text-anchor="middle" font-size="9.5" fill="#4A443C">covered nearly all of the</text>
    <text x="405" y="358" text-anchor="middle" font-size="9.5" fill="#4A443C">Indian subcontinent</text>
    <text x="390" y="395" text-anchor="middle" font-size="9.5" fill="#8B6F4E">Shape is schematic, not a precise boundary</text>
  </g>
</svg>
