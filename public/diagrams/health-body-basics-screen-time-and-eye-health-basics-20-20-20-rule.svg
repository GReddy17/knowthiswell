<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rule202020Title">
  <title id="rule202020Title">A simple flow diagram illustrating the 20-20-20 rule: every 20 minutes of screen time, look at an object at least 20 feet away for 20 seconds, shown as a repeating cycle with a clock icon, a distance arrow, and a stopwatch icon.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="390" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">The 20-20-20 rule</text>

  <rect x="40" y="70" width="200" height="120" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="140" cy="115" r="24" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <line x1="140" y1="115" x2="140" y2="100" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="140" y1="115" x2="150" y2="120" stroke="#2C4A3E" stroke-width="2"/>
  <text x="140" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Every 20 minutes</text>
  <text x="140" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">of screen time</text>

  <text x="290" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">&#8594;</text>

  <rect x="330" y="70" width="200" height="120" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="360" y1="130" x2="500" y2="130" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M 490 122 L 500 130 L 490 138" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <text x="430" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Look 20+ feet away</text>
  <text x="430" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">relaxes focusing muscles</text>

  <text x="580" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">&#8594;</text>

  <rect x="620" y="70" width="120" height="120" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="680" cy="115" r="22" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="680" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">20s</text>
  <text x="680" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Hold it</text>
  <text x="680" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">20 seconds</text>

  <text x="390" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Repeats throughout any extended screen session</text>
</svg>
