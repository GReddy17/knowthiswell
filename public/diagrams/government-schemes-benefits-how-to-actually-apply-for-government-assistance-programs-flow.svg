<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="applyFlowTitle">
  <title id="applyFlowTitle">The general government assistance application flow: check eligibility, gather documentation, apply through the official channel, verification, and determination with appeal rights.</title>
  <rect width="760" height="300" fill="#FBF8F1"/>

  <rect x="20" y="90" width="130" height="110" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="85" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">1. Check</text>
  <text x="85" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">eligibility</text>
  <text x="85" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Income, household</text>
  <text x="85" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">size, or category</text>
  <text x="85" y="183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">(age, disability, etc.)</text>

  <text x="163" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#8B6F4E">→</text>

  <rect x="180" y="90" width="130" height="110" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="245" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">2. Gather</text>
  <text x="245" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">documentation</text>
  <text x="245" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">ID, proof of income,</text>
  <text x="245" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">household &amp; residency</text>
  <text x="245" y="183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">records</text>

  <text x="323" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#8B6F4E">→</text>

  <rect x="340" y="70" width="140" height="150" rx="6" fill="#2C4A3E"/>
  <text x="410" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">3. Apply through</text>
  <text x="410" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">the official channel</text>
  <text x="410" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">Benefit Finder,</text>
  <text x="410" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">the specific agency's</text>
  <text x="410" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">site, or local office</text>
  <text x="410" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">(never a paid middleman)</text>

  <text x="503" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#8B6F4E">→</text>

  <rect x="520" y="90" width="110" height="110" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="575" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">4. Verification</text>
  <text x="575" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Agency reviews,</text>
  <text x="575" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">may request more</text>
  <text x="575" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">documents</text>

  <text x="648" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#8B6F4E">→</text>

  <rect x="660" y="80" width="90" height="130" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="705" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">5. Determi-</text>
  <text x="705" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">nation</text>
  <text x="705" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">Written notice;</text>
  <text x="705" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">denial can</text>
  <text x="705" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">usually be</text>
  <text x="705" y="181" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">appealed</text>

  <text x="380" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Exact rules, forms, and required documents vary by program and by state — always confirm on the program's own official page.</text>
</svg>
