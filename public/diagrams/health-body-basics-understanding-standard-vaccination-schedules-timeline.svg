<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scheduleTimelineTitle">
  <title id="scheduleTimelineTitle">A horizontal timeline from birth onward showing a shaded band representing fading maternal antibody protection over the first several months, and a separate marker showing the minimum interval needed between two doses of the same vaccine for the strongest immune memory response, illustrating that schedule timing is set around both factors</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <line x1="60" y1="140" x2="720" y2="140" stroke="#2C4A3E" stroke-width="2"/>
  <text x="60" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Birth</text>
  <text x="720" y="165" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Later childhood →</text>

  <!-- maternal antibody fade band -->
  <rect x="60" y="60" width="260" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="190" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Maternal antibodies fading</text>

  <!-- dose markers -->
  <circle cx="330" cy="140" r="7" fill="#B5493A"/>
  <text x="330" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Dose 1</text>

  <circle cx="480" cy="140" r="7" fill="#B5493A"/>
  <text x="480" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Dose 2</text>

  <line x1="330" y1="140" x2="480" y2="140" stroke="#B5493A" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="355" y="175" width="100" height="24" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="405" y="191" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Min. interval</text>

  <text x="405" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">A real schedule waits out maternal antibody fade AND spaces same-vaccine doses for full immune memory.</text>
</svg>
