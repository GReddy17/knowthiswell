<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zombieAntTitle">
  <title id="zombieAntTitle">Diagram of the zombie-ant fungus life cycle: spores infect a foraging ant, the fungus compels the ant to climb and bite a leaf vein, the fungus kills the ant and grows a fruiting body from its head, and spores fall to infect new ants</title>
  <defs>
    <marker id="arrowGreenZ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#FBF8F1"/>

  <text x="320" y="32" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="700" fill="#1F1B16">The zombie-ant fungus life cycle</text>

  <text x="100" y="130" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="30">🐜</text>
  <text x="100" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">1. Ant picks up spores</text>
  <text x="100" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">while foraging</text>

  <path d="M150,140 C 220,110 280,110 340,130" fill="none" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowGreenZ)"/>

  <text x="400" y="120" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="30">🌿</text>
  <text x="400" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">2. Ant climbs, bites</text>
  <text x="400" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">into leaf vein</text>

  <path d="M420,145 C 440,190 440,220 420,250" fill="none" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowGreenZ)"/>

  <text x="400" y="280" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="30">☠️</text>
  <text x="400" y="305" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">3. Fungus kills ant,</text>
  <text x="400" y="319" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">grows fruiting body</text>

  <path d="M350,290 C 260,320 180,300 130,220" fill="none" stroke="#2C4A3E" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowGreenZ)"/>
  <text x="200" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">4. Spores rain down on ant trail below</text>

  <text x="320" y="355" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13" font-weight="600" fill="#1F1B16" opacity="0"></text>
</svg>
