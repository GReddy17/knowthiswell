<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cuisineTimelineTitle">
  <title id="cuisineTimelineTitle">A layered timeline showing how climate set staple crops in ancient times, how the centuries-long spice trade moved pepper, cinnamon, and nutmeg outward from South and Southeast Asia, and how the Columbian Exchange after 1492 swapped tomatoes, chili peppers, potatoes, and corn from the Americas for wheat, rice, and livestock from the Old World</title>
  <rect width="640" height="460" fill="#FBF8F1"/>

  <text x="320" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Three layers that built regional cuisine</text>

  <!-- timeline arrow, oldest at bottom to newest at top -->
  <line x1="34" y1="430" x2="34" y2="82" stroke="#8B6F4E" stroke-width="1.5"/>
  <path d="M 34,74 L 28,86 L 40,86 Z" fill="#8B6F4E"/>
  <text x="34" y="450" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">ancient</text>
  <text x="34" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">1492+</text>

  <!-- Panel 1: ancient base layer -->
  <rect x="60" y="345" width="555" height="85" rx="8" fill="#EEF3EE" stroke="#E3DCC9"/>
  <text x="75" y="365" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Ancient base — climate determines the staple crop</text>

  <rect x="75" y="378" width="150" height="42" rx="6" fill="#FBF8F1" stroke="#D8CFBB"/>
  <text x="88" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Monsoon Asia</text>
  <text x="88" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2C4A3E">Rice</text>

  <rect x="245" y="378" width="200" height="42" rx="6" fill="#FBF8F1" stroke="#D8CFBB"/>
  <text x="258" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Europe &amp; the Middle East</text>
  <text x="258" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2C4A3E">Wheat</text>

  <rect x="465" y="378" width="135" height="42" rx="6" fill="#FBF8F1" stroke="#D8CFBB"/>
  <text x="478" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Mesoamerica</text>
  <text x="478" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2C4A3E">Corn</text>

  <!-- connecting arrow 1 -> 2 -->
  <path d="M 320,345 L 320,320 M 314,328 L 320,318 L 326,328" fill="none" stroke="#8B6F4E" stroke-width="1.5"/>

  <!-- Panel 2: spice trade -->
  <rect x="60" y="225" width="555" height="90" rx="8" fill="#FBEDEA" stroke="#E3DCC9"/>
  <text x="75" y="245" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Centuries-long spice trade</text>

  <circle cx="320" cy="270" r="5" fill="#2C4A3E"/>
  <text x="320" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">South &amp; Southeast Asia</text>

  <path d="M 300,272 C 220,282 150,286 100,290" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
  <path d="M 96,290 L 108,285 L 106,295 Z" fill="#2C4A3E"/>
  <text x="90" y="305" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Pepper, cinnamon →</text>
  <text x="90" y="317" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Europe &amp; the Middle East</text>

  <path d="M 340,272 C 420,282 480,286 530,290" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
  <path d="M 534,290 L 522,285 L 524,295 Z" fill="#2C4A3E"/>
  <text x="530" y="305" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">← Nutmeg, cinnamon</text>
  <text x="530" y="317" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">to China &amp; East Asia</text>

  <!-- connecting arrow 2 -> 3 -->
  <path d="M 320,225 L 320,200 M 314,208 L 320,198 L 326,208" fill="none" stroke="#8B6F4E" stroke-width="1.5"/>

  <!-- Panel 3: Columbian Exchange -->
  <rect x="60" y="80" width="555" height="105" rx="8" fill="#EEF3EE" stroke="#C9412C" stroke-width="1.3"/>
  <text x="75" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">After 1492 — the Columbian Exchange</text>

  <rect x="75" y="110" width="205" height="65" rx="6" fill="#FBF8F1" stroke="#D8CFBB"/>
  <text x="88" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Americas give:</text>
  <text x="88" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Tomatoes, chili peppers,</text>
  <text x="88" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">potatoes, corn</text>

  <rect x="395" y="110" width="205" height="65" rx="6" fill="#FBF8F1" stroke="#D8CFBB"/>
  <text x="408" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Old World gives:</text>
  <text x="408" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Wheat, rice,</text>
  <text x="408" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">and livestock</text>

  <path d="M 285,124 L 388,124" fill="none" stroke="#C9412C" stroke-width="1.5"/>
  <path d="M 393,124 L 383,119 L 383,129 Z" fill="#C9412C"/>
  <path d="M 388,160 L 285,160" fill="none" stroke="#C9412C" stroke-width="1.5"/>
  <path d="M 280,160 L 290,155 L 290,165 Z" fill="#C9412C"/>

  <text x="320" y="440" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">Old World = Europe, Africa, and Asia</text>
</svg>
