<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="terms-clauses-title">
  <title id="terms-clauses-title">Diagram of a terms-and-conditions document with four highlighted sections: Arbitration, Auto-Renewal, Liability Limits, and Data Use.</title>
  <rect width="640" height="340" fill="#FBF8F1"/>
  <style>
    .doc { fill: #FFFFFF; stroke: #2C4A3E; stroke-width: 2; }
    .hl { fill: #FBEDEA; stroke: #B5493A; stroke-width: 1.5; }
    .line { stroke: #EDE7D8; stroke-width: 4; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #1F1B16; font-weight: 600; }
    .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #4A443C; }
  </style>

  <rect x="60" y="20" width="300" height="300" rx="6" class="doc"/>
  <line x1="80" y1="45" x2="340" y2="45" class="line"/>
  <line x1="80" y1="65" x2="340" y2="65" class="line"/>

  <rect x="75" y="85" width="270" height="40" rx="4" class="hl"/>
  <text x="90" y="109" class="label">Arbitration</text>

  <line x1="80" y1="140" x2="340" y2="140" class="line"/>

  <rect x="75" y="155" width="270" height="40" rx="4" class="hl"/>
  <text x="90" y="179" class="label">Auto-Renewal</text>

  <line x1="80" y1="210" x2="340" y2="210" class="line"/>

  <rect x="75" y="225" width="270" height="40" rx="4" class="hl"/>
  <text x="90" y="249" class="label">Liability Limits</text>

  <line x1="80" y1="280" x2="340" y2="280" class="line"/>

  <rect x="75" y="295" width="270" height="40" rx="4" class="hl" style="display:none"/>

  <rect x="400" y="130" width="180" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="490" y="160" text-anchor="middle" class="label">Data Use</text>
  <text x="490" y="180" text-anchor="middle" class="sub">Search for these four</text>
  <text x="490" y="195" text-anchor="middle" class="sub">terms before accepting</text>
</svg>
