<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Grid of the twelve English tenses: three time periods (past, present, future) by four aspects (simple, continuous, perfect, perfect continuous), each with a worked example using "work"</title>
  <rect width="680" height="300" fill="#FBF8F1"/>

  <!-- column headers -->
  <g font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">
    <text x="205" y="30" text-anchor="middle">Past</text>
    <text x="365" y="30" text-anchor="middle">Present</text>
    <text x="525" y="30" text-anchor="middle">Future</text>
  </g>
  <!-- row headers -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8B6F4E">
    <text x="45" y="70">Simple</text>
    <text x="45" y="130">Continuous</text>
    <text x="45" y="190">Perfect</text>
    <text x="45" y="250">Perfect</text>
    <text x="45" y="262">continuous</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">
    <!-- row 1: simple -->
    <rect x="120" y="45" width="170" height="40" fill="#EEF3EE" stroke="#E3DCC9"/>
    <text x="205" y="69" text-anchor="middle">worked</text>
    <rect x="290" y="45" width="150" height="40" fill="#FBEDEA" stroke="#E3DCC9"/>
    <text x="365" y="69" text-anchor="middle">works</text>
    <rect x="440" y="45" width="170" height="40" fill="#EEF3EE" stroke="#E3DCC9"/>
    <text x="525" y="69" text-anchor="middle">will work</text>

    <!-- row 2: continuous -->
    <rect x="120" y="105" width="170" height="40" fill="#FBEDEA" stroke="#E3DCC9"/>
    <text x="205" y="129" text-anchor="middle">was working</text>
    <rect x="290" y="105" width="150" height="40" fill="#EEF3EE" stroke="#E3DCC9"/>
    <text x="365" y="129" text-anchor="middle">is working</text>
    <rect x="440" y="105" width="170" height="40" fill="#FBEDEA" stroke="#E3DCC9"/>
    <text x="525" y="129" text-anchor="middle">will be working</text>

    <!-- row 3: perfect -->
    <rect x="120" y="165" width="170" height="40" fill="#EEF3EE" stroke="#E3DCC9"/>
    <text x="205" y="189" text-anchor="middle">had worked</text>
    <rect x="290" y="165" width="150" height="40" fill="#FBEDEA" stroke="#E3DCC9"/>
    <text x="365" y="189" text-anchor="middle">has worked</text>
    <rect x="440" y="165" width="170" height="40" fill="#EEF3EE" stroke="#E3DCC9"/>
    <text x="525" y="189" text-anchor="middle">will have worked</text>

    <!-- row 4: perfect continuous -->
    <rect x="120" y="225" width="170" height="45" fill="#FBEDEA" stroke="#E3DCC9"/>
    <text x="205" y="251" text-anchor="middle">had been working</text>
    <rect x="290" y="225" width="150" height="45" fill="#EEF3EE" stroke="#E3DCC9"/>
    <text x="365" y="251" text-anchor="middle">has been working</text>
    <rect x="440" y="225" width="170" height="45" fill="#FBEDEA" stroke="#E3DCC9"/>
    <text x="525" y="243" text-anchor="middle">will have been</text>
    <text x="525" y="257" text-anchor="middle">working</text>
  </g>
</svg>
