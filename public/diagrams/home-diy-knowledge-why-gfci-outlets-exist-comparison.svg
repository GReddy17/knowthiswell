<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gfciTitle">
  <title id="gfciTitle">A comparison diagram of a GFCI outlet's internal sensing coil under normal conditions, where outgoing hot current and returning neutral current are equal and no trip occurs, versus a ground fault condition, where some current leaks to ground through an unintended path such as a person, creating an imbalance the coil detects, tripping the outlet within milliseconds.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">How a GFCI senses a ground fault</text>

  <text x="195" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">Normal condition</text>
  <rect x="60" y="70" width="270" height="180" rx="8" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
  <ellipse cx="195" cy="160" rx="55" ry="55" fill="none" stroke="#4A443C" stroke-width="6"/>
  <line x1="90" y1="120" x2="150" y2="140" stroke="#2C4A3E" stroke-width="2.5" marker-end="url(#arrowGF1)"/>
  <text x="80" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C4A3E">hot: 12A out</text>
  <line x1="150" y1="182" x2="90" y2="205" stroke="#2C4A3E" stroke-width="2.5" marker-end="url(#arrowGF1)"/>
  <text x="80" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C4A3E">neutral: 12A back</text>
  <text x="195" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">sensing coil</text>
  <text x="195" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2C4A3E">equal &amp; opposite — no trip</text>

  <text x="585" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#8B6F4E">Ground fault condition</text>
  <rect x="450" y="70" width="270" height="180" rx="8" fill="none" stroke="#8B6F4E" stroke-width="1.5"/>
  <ellipse cx="585" cy="160" rx="55" ry="55" fill="none" stroke="#4A443C" stroke-width="6"/>
  <line x1="480" y1="120" x2="540" y2="140" stroke="#8B6F4E" stroke-width="2.5" marker-end="url(#arrowGF1)"/>
  <text x="470" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">hot: 12A out</text>
  <line x1="540" y1="182" x2="480" y2="205" stroke="#8B6F4E" stroke-width="2.5" marker-end="url(#arrowGF1)"/>
  <text x="470" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">neutral: only 9A back</text>
  <line x1="620" y1="150" x2="670" y2="120" stroke="#1F1B16" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGF1)"/>
  <text x="695" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">3A leaks to</text>
  <text x="695" y="127" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">ground</text>
  <text x="585" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#8B6F4E">imbalance sensed — trips fast</text>

  <text x="390" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">A GFCI watches for a mismatch between outgoing and returning current, not for overcurrent.</text>

  <defs>
    <marker id="arrowGF1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
