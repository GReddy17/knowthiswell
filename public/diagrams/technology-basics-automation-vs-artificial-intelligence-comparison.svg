<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autoVsAiTitle">
  <title id="autoVsAiTitle">Side-by-side comparison. Left column, Automation: a fixed rule box (if temperature drops below 65 degrees, turn on heat) that always produces the same output for the same input, with no learning step. Right column, Artificial intelligence: a trained model box that was built from many past examples, and produces a probability-based judgment that can change as it sees new data, with a feedback loop arrow looping back into the model.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="205" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">Automation</text>
  <text x="575" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">Artificial intelligence</text>

  <line x1="390" y1="20" x2="390" y2="300" stroke="#D8D2C4" stroke-width="1.5" stroke-dasharray="5 5"/>

  <rect x="50" y="60" width="310" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="205" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Fixed rule, written by a person</text>
  <text x="205" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">"if temp &lt; 65°F, turn on heat"</text>

  <path d="M205,120 L205,150" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowAvi)"/>

  <rect x="50" y="150" width="310" height="60" rx="8" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="205" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Same input → same output, always</text>
  <text x="205" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">no adjustment over time</text>

  <rect x="420" y="60" width="310" height="60" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="575" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Model trained on many past examples</text>
  <text x="575" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">learns a pattern, not a fixed rule</text>

  <path d="M575,120 L575,150" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowAvi)"/>

  <rect x="420" y="150" width="310" height="60" rx="8" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="575" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Probability-based judgment</text>
  <text x="575" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">can shift as new data arrives</text>

  <path d="M730,210 C 780,240 780,60 730,90" fill="none" stroke="#B5493A" stroke-width="1.5" marker-end="url(#arrowAviRed)"/>
  <text x="742" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#B5493A" transform="rotate(90 742 150)">feedback loop</text>

  <defs>
    <marker id="arrowAvi" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowAviRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/>
    </marker>
  </defs>

  <text x="205" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Predictable, auditable,</text>
  <text x="205" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">breaks only if the rule is wrong</text>

  <text x="575" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Flexible with messy inputs,</text>
  <text x="575" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">can be confidently wrong</text>

  <text x="390" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2C4A3E">Many real systems combine both: AI makes a judgment, automation acts on it</text>
</svg>
