<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="driverTitle">
  <title id="driverTitle">Flow diagram showing an application sending a generic request to the operating system, which passes it to a device driver, which translates it into the exact commands a specific piece of hardware understands, and the hardware's response flowing back the same path in reverse</title>
  <rect width="640" height="320" fill="#FBF8F1"/>
  <text x="320" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">A driver translates generic requests into hardware-specific commands</text>

  <rect x="20" y="120" width="130" height="70" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="85" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">App</text>
  <text x="85" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">"print this"</text>

  <rect x="185" y="120" width="130" height="70" rx="8" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="250" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Operating system</text>
  <text x="250" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">generic print request</text>

  <rect x="350" y="120" width="130" height="70" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="415" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Driver</text>
  <text x="415" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">translates to this printer's language</text>

  <rect x="515" y="120" width="105" height="70" rx="8" fill="#E3DCC9" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="567" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Printer</text>
  <text x="567" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">exact model</text>

  <line x1="150" y1="150" x2="183" y2="150" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="315" y1="150" x2="348" y2="150" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="480" y1="150" x2="513" y2="150" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow2)"/>

  <line x1="567" y1="190" x2="567" y2="240" stroke="#4A443C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="567" y1="240" x2="85" y2="240" stroke="#4A443C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow3)"/>
  <line x1="85" y1="240" x2="85" y2="192" stroke="#4A443C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">status/result flows back through the same chain, in reverse</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
