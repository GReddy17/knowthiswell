<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="relMapTitle">
  <title id="relMapTitle">A simplified world map shaded by the most commonly reported majority religion per region, based on Pew Research Center data: Christianity across the Americas, Europe, and much of sub-Saharan Africa; Islam across the Middle East, North Africa, and large parts of South and Southeast Asia, with Indonesia marked as home to the world's largest national Muslim population; Hinduism concentrated in South Asia; Buddhism across East and Southeast Asia; and a marker noting China's unusually large religiously unaffiliated population</title>
  <rect width="640" height="470" fill="#FBF8F1"/>

  <text x="320" y="28" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Approximate global distribution of major religions</text>

  <!-- base landmasses -->
  <g fill="#EDE7D8" stroke="#D8CFBB" stroke-width="1">
    <path d="M63,114 L102,110 L172,100 L196,104 L219,130 L234,150 L211,166 L196,200 L169,198 L177,222 L191,232 L157,210 L138,184 L127,154 L118,140 L87,130 L63,130 Z"/>
    <path d="M200,226 L227,230 L242,250 L266,266 L258,296 L230,320 L214,360 L211,330 L209,286 L194,258 L200,240 Z"/>
    <path d="M306,164 L306,178 L343,176 L364,178 L374,160 L382,140 L367,130 L351,110 L328,126 L312,150 Z"/>
    <path d="M294,208 L336,176 L370,188 L387,226 L399,226 L382,280 L374,300 L351,318 L339,286 L334,246 L304,238 L294,220 Z"/>
    <path d="M382,160 L390,220 L413,200 L429,180 L426,234 L444,210 L460,206 L468,210 L483,230 L507,200 L510,170 L530,150 L546,130 L476,96 L413,110 L390,140 Z"/>
    <path d="M496,294 L521,274 L541,272 L558,304 L553,324 L533,320 L499,318 Z"/>
    <path d="M120,388 L560,388 L545,405 L400,411 L280,411 L135,403 Z"/>
  </g>

  <!-- religion tint overlays -->
  <g opacity="0.55">
    <!-- Christianity: Americas + Europe + sub-Saharan Africa -->
    <ellipse cx="150" cy="170" rx="80" ry="55" fill="#2C4A3E"/>
    <ellipse cx="225" cy="290" rx="45" ry="65" fill="#2C4A3E"/>
    <ellipse cx="344" cy="150" rx="46" ry="32" fill="#2C4A3E"/>
    <ellipse cx="350" cy="268" rx="52" ry="52" fill="#2C4A3E"/>
    <!-- Islam: Middle East, North Africa, South/Southeast Asia belt -->
    <ellipse cx="352" cy="205" rx="58" ry="26" fill="#C9412C"/>
    <ellipse cx="470" cy="220" rx="55" ry="26" fill="#C9412C"/>
    <!-- Hinduism: South Asia -->
    <ellipse cx="432" cy="205" rx="20" ry="22" fill="#B08D3E"/>
    <!-- Buddhism: East + Southeast Asia -->
    <ellipse cx="495" cy="170" rx="42" ry="38" fill="#5B7A99"/>
  </g>

  <!-- Indonesia marker -->
  <circle cx="500" cy="245" r="5" fill="#1F1B16"/>
  <path d="M 500,250 L 500,272" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="500" y="286" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Indonesia</text>
  <text x="500" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">World's largest national</text>
  <text x="500" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Muslim population</text>

  <!-- China unaffiliated marker -->
  <circle cx="500" cy="165" r="5" fill="#1F1B16"/>
  <path d="M 505,163 L 560,150" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="563" y="147" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">China:</text>
  <text x="563" y="159" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">large religiously</text>
  <text x="563" y="170" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">unaffiliated share</text>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">
    <rect x="60" y="405" width="13" height="13" fill="#2C4A3E" opacity="0.65"/>
    <text x="78" y="415">Christianity</text>

    <rect x="180" y="405" width="13" height="13" fill="#C9412C" opacity="0.65"/>
    <text x="198" y="415">Islam</text>

    <rect x="280" y="405" width="13" height="13" fill="#B08D3E" opacity="0.65"/>
    <text x="298" y="415">Hinduism</text>

    <rect x="400" y="405" width="13" height="13" fill="#5B7A99" opacity="0.65"/>
    <text x="418" y="415">Buddhism</text>
  </g>

  <text x="320" y="435" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Source: Pew Research Center regional religious affiliation estimates. Shading shows the most commonly reported majority religion by region, not exact borders.</text>
</svg>
