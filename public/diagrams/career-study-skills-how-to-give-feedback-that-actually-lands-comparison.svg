<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="feedbackComparisonTitle">
  <title id="feedbackComparisonTitle">A comparison diagram showing vague, trait-based feedback as a single unsupported judgment with no specific behavior named, next to specific feedback structured around situation, behavior, and impact, illustrating how the second version names a fixable action instead of labeling character.</title>
  <rect width="780" height="220" fill="#FBF8F1"/>

  <text x="200" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Vague / trait-based</text>
  <rect x="60" y="55" width="280" height="75" rx="10" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="200" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-style="italic" fill="#1F1B16">&#8220;You're not detail-oriented.&#8221;</text>
  <text x="200" y="107" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">a label, not a behavior</text>
  <text x="200" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">no specific action for the person to change</text>

  <text x="585" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Specific (SBI)</text>
  <rect x="430" y="50" width="310" height="100" rx="8" fill="#2C4A3E"/>
  <text x="445" y="75" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1"><tspan font-weight="700">Situation: </tspan>yesterday's client review</text>
  <text x="445" y="98" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1"><tspan font-weight="700">Behavior: </tspan>Q3 figures were missing</text>
  <text x="445" y="121" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1"><tspan font-weight="700">Impact: </tspan>delayed the client's decision a day</text>
  <text x="585" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">names the behavior and its effect — actionable</text>

  <text x="390" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Same underlying observation — one version blames character, the other points at a fixable action.</text>
</svg>
