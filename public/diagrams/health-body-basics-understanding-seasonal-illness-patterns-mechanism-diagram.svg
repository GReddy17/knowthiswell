<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seasonalMechTitle">
  <title id="seasonalMechTitle">A diagram with cold weather in the center branching into two separate effect boxes: indoor crowding, more shared enclosed time increasing transmission opportunities, and lower indoor humidity which may help some viruses survive longer in the air, both converging on a box reading increased respiratory illness spread, explicitly not a direct arrow from cold weather to illness</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <rect x="310" y="20" width="160" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Cold weather</text>

  <line x1="350" y1="75" x2="200" y2="115" stroke="#2C4A3E" stroke-width="1.4"/>
  <line x1="430" y1="75" x2="580" y2="115" stroke="#2C4A3E" stroke-width="1.4"/>

  <rect x="80" y="115" width="240" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Indoor crowding</text>
  <text x="200" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">more shared enclosed contact</text>

  <rect x="460" y="115" width="240" height="60" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">Lower indoor humidity</text>
  <text x="580" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">may aid virus survival in air</text>

  <line x1="200" y1="175" x2="330" y2="205" stroke="#2C4A3E" stroke-width="1.4"/>
  <line x1="580" y1="175" x2="450" y2="205" stroke="#2C4A3E" stroke-width="1.4"/>

  <rect x="255" y="205" width="270" height="45" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#B5493A">Increased illness spread</text>
</svg>
