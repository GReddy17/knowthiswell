<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="unescoFlowTitle">
  <title id="unescoFlowTitle">Flowchart showing the UNESCO World Heritage nomination process in sequential steps: country adds site to its Tentative List, country prepares and submits a nomination dossier, ICOMOS or IUCN conducts an independent technical evaluation depending on whether the site is cultural or natural, and the intergovernmental World Heritage Committee votes at its annual session to inscribe, refer back, or reject the nomination</title>
  <rect width="640" height="480" fill="#FBF8F1"/>

  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">How a site becomes a World Heritage Site</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- Step 1 -->
    <rect x="30" y="50" width="170" height="66" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="115" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">1. Tentative List</text>
    <text x="115" y="93" text-anchor="middle" font-size="10" fill="#4A443C">Country adds the site</text>
    <text x="115" y="106" text-anchor="middle" font-size="10" fill="#4A443C">to its national list</text>

    <!-- Step 2 -->
    <rect x="240" y="50" width="190" height="66" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="335" y="76" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">2. Nomination dossier</text>
    <text x="335" y="93" text-anchor="middle" font-size="10" fill="#4A443C">Country prepares and</text>
    <text x="335" y="106" text-anchor="middle" font-size="10" fill="#4A443C">submits the full nomination</text>

    <!-- Step 3: evaluation branch -->
    <rect x="90" y="192" width="190" height="66" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
    <text x="185" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">3a. ICOMOS evaluation</text>
    <text x="185" y="231" text-anchor="middle" font-size="10" fill="#4A443C">Independent review for</text>
    <text x="185" y="244" text-anchor="middle" font-size="10" fill="#4A443C">cultural sites</text>

    <rect x="360" y="192" width="190" height="66" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
    <text x="455" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">3b. IUCN evaluation</text>
    <text x="455" y="231" text-anchor="middle" font-size="10" fill="#4A443C">Independent review for</text>
    <text x="455" y="244" text-anchor="middle" font-size="10" fill="#4A443C">natural sites</text>

    <!-- Step 4: committee -->
    <rect x="170" y="330" width="300" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="320" y="354" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">4. World Heritage Committee</text>
    <text x="320" y="371" text-anchor="middle" font-size="10" fill="#4A443C">Intergovernmental committee votes</text>
    <text x="320" y="384" text-anchor="middle" font-size="10" fill="#4A443C">at its annual session</text>

    <!-- Outcomes -->
    <rect x="55" y="432" width="140" height="38" rx="19" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="125" y="456" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">Inscribe</text>

    <rect x="250" y="432" width="140" height="38" rx="19" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="320" y="456" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">Refer back</text>

    <rect x="445" y="432" width="140" height="38" rx="19" fill="#F4E2DE" stroke="#B24A38" stroke-width="1.5"/>
    <text x="515" y="456" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">Reject</text>
  </g>

  <g stroke="#8B6F4E" stroke-width="2" fill="none">
    <path d="M 200,83 L 238,83" marker-end="url(#uArrow)"/>
    <path d="M 300,116 C 280,150 230,160 195,190" marker-end="url(#uArrow)"/>
    <path d="M 370,116 C 400,150 440,160 460,190" marker-end="url(#uArrow)"/>
    <path d="M 210,258 C 235,285 270,305 290,328" marker-end="url(#uArrow)"/>
    <path d="M 430,258 C 405,285 370,305 350,328" marker-end="url(#uArrow)"/>
    <path d="M 260,400 C 220,412 170,418 130,430" marker-end="url(#uArrow)"/>
    <path d="M 320,400 L 320,430" marker-end="url(#uArrow)"/>
    <path d="M 380,400 C 420,412 470,418 510,430" marker-end="url(#uArrow)"/>
  </g>

  <text x="185" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">if cultural</text>
  <text x="455" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">if natural</text>

  <defs>
    <marker id="uArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8B6F4E"/>
    </marker>
  </defs>
</svg>
