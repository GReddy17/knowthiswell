<svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="civilLawsuitTitle">
  <title id="civilLawsuitTitle">A flow diagram of the general stages of a civil lawsuit: filing a complaint, the defendant's response, a discovery phase where both sides exchange evidence, pretrial motions, and then either a settlement or a trial ending in judgment, with a possible appeal after that.</title>
  <rect width="620" height="420" fill="#FBF8F1"/>

  <rect x="210" y="20" width="200" height="46" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1. Complaint filed</text>

  <path d="M310 66 L310 90" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="210" y="90" width="200" height="46" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">2. Defendant responds</text>

  <path d="M310 136 L310 160" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="210" y="160" width="200" height="46" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">3. Discovery</text>

  <path d="M310 206 L310 230" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="210" y="230" width="200" height="46" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">4. Pretrial motions</text>

  <path d="M310 276 L200 305" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M310 276 L420 305" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="90" y="305" width="180" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="180" y="326" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">5a. Settlement</text>
  <text x="180" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(most cases end here)</text>

  <rect x="350" y="305" width="180" height="50" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="440" y="326" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">5b. Trial</text>
  <text x="440" y="344" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">ends in judgment</text>

  <path d="M440 355 L440 380" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="350" y="380" width="180" height="34" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="440" y="401" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Possible appeal</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
