<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="envelopeCrossTitle">
  <title id="envelopeCrossTitle">A simplified cross-section of a house showing the attic, walls, and foundation as the building envelope, with a wavy insulation layer highlighted inside the attic and walls, and small arrows at gaps around a window frame, an attic hatch, and a pipe penetration labeled air leaks, showing where uncontrolled air can escape despite insulation being present elsewhere.</title>
  <rect width="700" height="380" fill="#FBF8F1"/>

  <!-- roof / attic -->
  <polygon points="350,40 150,150 550,150" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M180,145 Q 350,110 520,145" fill="none" stroke="#EDE7D8" stroke-width="14" stroke-linecap="round"/>
  <path d="M180,145 Q 350,110 520,145" fill="none" stroke="#2C4A3E" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="350" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">attic insulation</text>

  <!-- attic hatch leak -->
  <rect x="330" y="150" width="40" height="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
  <line x1="350" y1="158" x2="350" y2="175" stroke="#B5493A" stroke-width="1.5"/>
  <polygon points="345,172 355,172 350,182" fill="#B5493A"/>
  <text x="410" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">attic hatch leak</text>

  <!-- walls -->
  <rect x="180" y="150" width="340" height="180" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="192" y="162" width="14" height="156" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="2,3"/>
  <rect x="494" y="162" width="14" height="156" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="199" y="245" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C" transform="rotate(-90 199 245)">wall insulation</text>

  <!-- window with leak -->
  <rect x="260" y="190" width="70" height="60" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
  <line x1="295" y1="190" x2="295" y2="250" stroke="#2C4A3E" stroke-width="1.2"/>
  <line x1="260" y1="220" x2="330" y2="220" stroke="#2C4A3E" stroke-width="1.2"/>
  <line x1="330" y1="205" x2="350" y2="190" stroke="#B5493A" stroke-width="1.5"/>
  <polygon points="345,187 353,190 348,197" fill="#B5493A"/>
  <text x="400" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">window frame leak</text>

  <!-- pipe penetration -->
  <rect x="410" y="280" width="14" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="424" y1="300" x2="445" y2="290" stroke="#B5493A" stroke-width="1.5"/>
  <polygon points="440,287 448,290 442,297" fill="#B5493A"/>
  <text x="510" y="295" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">pipe penetration leak</text>

  <!-- foundation -->
  <rect x="170" y="330" width="360" height="20" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>

  <text x="350" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Insulation slows heat transfer; unsealed gaps let conditioned air escape regardless.</text>
</svg>
