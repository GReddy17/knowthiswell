<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="betaTitle">
  <title id="betaTitle">Pipeline diagram showing software moving through four stages — internal/dev build, alpha, beta, and stable release — with bug count decreasing and audience size increasing at each stage</title>
  <rect width="640" height="300" fill="#FBF8F1"/>
  <text x="320" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">The release pipeline: each stage widens the audience, narrows the bug count</text>

  <rect x="30" y="70" width="130" height="150" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="95" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Internal</text>
  <text x="95" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">built daily,</text>
  <text x="95" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">expect bugs,</text>
  <text x="95" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">employees only</text>

  <rect x="185" y="70" width="130" height="150" rx="8" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="250" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Alpha</text>
  <text x="250" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">core features work,</text>
  <text x="250" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">rough edges expected,</text>
  <text x="250" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">small invited group</text>

  <rect x="340" y="70" width="130" height="150" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="405" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Beta</text>
  <text x="405" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">feature-complete,</text>
  <text x="405" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">testing for bugs at scale,</text>
  <text x="405" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">opt-in public group</text>

  <rect x="495" y="70" width="115" height="150" rx="8" fill="#E3DCC9" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="552" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Stable</text>
  <text x="552" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">general release,</text>
  <text x="552" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">everyone,</text>
  <text x="552" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">fully supported</text>

  <line x1="160" y1="145" x2="183" y2="145" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="315" y1="145" x2="338" y2="145" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="470" y1="145" x2="493" y2="145" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow5)"/>

  <text x="320" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#2C4A3E">Bug count falls and audience size grows at every stage moving right</text>
  <defs>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/>
    </marker>
  </defs>
</svg>
