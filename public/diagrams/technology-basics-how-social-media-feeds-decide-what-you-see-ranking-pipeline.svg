<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="feedRankTitle">
  <title id="feedRankTitle">A pipeline diagram showing a large pool of candidate posts narrowed down by a candidate-selection step, each remaining candidate scored by a ranking model using signals like past behavior and how similar users reacted, the scored posts sorted, and the top results assembled into the feed shown to a user, with a feedback loop arrow showing that the user's reactions to that feed feed back into the model.</title>
  <rect width="820" height="300" fill="#FBF8F1"/>

  <rect x="20" y="40" width="140" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="90" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">All eligible posts</text>
  <text x="90" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(thousands+)</text>

  <rect x="210" y="40" width="140" height="50" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="280" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Candidate</text>
  <text x="280" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">selection</text>

  <rect x="400" y="40" width="140" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="470" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Ranking model</text>
  <text x="470" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">scores each candidate</text>

  <rect x="590" y="40" width="120" height="50" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="650" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Sort &amp;</text>
  <text x="650" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">assemble</text>

  <rect x="740" y="40" width="60" height="50" fill="#F7F1E5" stroke="#B5493A" stroke-width="2"/>
  <text x="770" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Feed</text>

  <defs>
    <marker id="arrowFeed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowFeedback" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/>
    </marker>
  </defs>

  <path d="M160,65 L208,65" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowFeed)"/>
  <path d="M350,65 L398,65" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowFeed)"/>
  <path d="M540,65 L588,65" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowFeed)"/>
  <path d="M710,65 L738,65" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowFeed)"/>

  <path d="M770,90 C 770,180 470,190 470,92" fill="none" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowFeedback)"/>
  <text x="620" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">feedback loop: what you tap, linger on, or skip retrains future scores</text>

  <rect x="60" y="235" width="700" height="45" fill="#FBF8F1" stroke="#D8D2C4" stroke-width="1"/>
  <text x="90" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">The model doesn't know what's "true" or "important" — it predicts which posts you're statistically likely to engage with, based on your past behavior and similar users' behavior.</text>
</svg>
