<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eyeCrossSectionTitle">
  <title id="eyeCrossSectionTitle">Side cross-section of the human eye showing light entering through the cornea, bending through the lens, and converging to an inverted focal point on the retina, with the optic nerve and blind spot at its exit point</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- eyeball outline -->
  <path d="M 120,210 C 120,120 220,70 350,70 C 470,70 560,130 560,210 C 560,290 470,350 350,350 C 220,350 120,300 120,210 Z" fill="none" stroke="#1F1B16" stroke-width="2"/>
  <!-- vitreous chamber tint -->
  <path d="M 220,210 C 220,150 280,110 360,110 C 450,110 530,150 530,210 C 530,270 450,310 360,310 C 280,310 220,270 220,210 Z" fill="#EEF3EE" opacity="0.6"/>

  <!-- cornea (bulge at front) -->
  <path d="M 120,210 C 120,150 150,105 200,88 C 175,130 168,290 200,332 C 150,315 120,270 120,210 Z" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="140" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Cornea</text>
  <line x1="150" y1="76" x2="172" y2="105" stroke="#4A443C" stroke-width="1"/>

  <!-- iris / pupil -->
  <rect x="196" y="170" width="14" height="80" rx="6" fill="#1F1B16"/>
  <text x="203" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Pupil</text>

  <!-- lens -->
  <ellipse cx="235" cy="210" rx="18" ry="62" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="235" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Lens</text>
  <line x1="235" y1="140" x2="235" y2="150" stroke="#4A443C" stroke-width="1"/>

  <!-- retina (back inner curve) -->
  <path d="M 520,120 C 555,150 560,270 520,300" fill="none" stroke="#2C4A3E" stroke-width="6" stroke-linecap="round"/>
  <text x="560" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Retina</text>

  <!-- incoming light rays converging through pupil/lens to inverted focal point -->
  <path d="M 40,150 L 203,190 L 500,270" fill="none" stroke="#8B6F4E" stroke-width="1.5"/>
  <path d="M 40,270 L 203,225 L 500,150" fill="none" stroke="#8B6F4E" stroke-width="1.5"/>
  <path d="M 40,210 L 203,210 L 500,210" fill="none" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 30,150 L 42,146 L 40,158 Z" fill="#8B6F4E"/>
  <path d="M 30,270 L 42,266 L 40,278 Z" fill="#8B6F4E"/>

  <!-- focal point on retina, inverted -->
  <circle cx="500" cy="150" r="4" fill="#C9412C"/>
  <circle cx="500" cy="270" r="4" fill="#C9412C"/>
  <text x="600" y="145" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Image inverted</text>
  <text x="600" y="280" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">on retina</text>

  <!-- optic nerve exit + blind spot -->
  <path d="M 545,205 L 610,205 L 610,215 L 545,215 Z" fill="#4A443C"/>
  <text x="612" y="213" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Optic nerve → brain</text>
  <circle cx="540" cy="210" r="6" fill="none" stroke="#C9412C" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="540" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#C9412C">Blind spot</text>
  <line x1="540" y1="335" x2="540" y2="216" stroke="#C9412C" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="320" y="395" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Light bends at the cornea, again at the lens, and crosses over to form an inverted image on the retina</text>
</svg>
