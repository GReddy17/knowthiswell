<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">From separate indicators to one composite rank: legal protections, political pressure, media economic viability and journalist safety feed a weighting formula, which produces a single composite score and country rank.</title>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F1B16"/></marker></defs>
  <rect width="680" height="300" fill="#FBF8F1"/>
  <rect x="20" y="25" width="190" height="45" rx="6" fill="#EEF3EE" stroke="#8B6F4E" stroke-width="2"/>
  <text x="115" y="53" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Legal protections</text>
  <rect x="20" y="85" width="190" height="45" rx="6" fill="#EEF3EE" stroke="#8B6F4E" stroke-width="2"/>
  <text x="115" y="113" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Political pressure</text>
  <rect x="20" y="145" width="190" height="45" rx="6" fill="#EEF3EE" stroke="#8B6F4E" stroke-width="2"/>
  <text x="115" y="173" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Media economic viability</text>
  <rect x="20" y="205" width="190" height="45" rx="6" fill="#EEF3EE" stroke="#8B6F4E" stroke-width="2"/>
  <text x="115" y="233" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Journalist safety</text>
  <path d="M210 48 L270 120" stroke="#1F1B16" stroke-width="2" fill="none"/>
  <path d="M210 108 L270 128" stroke="#1F1B16" stroke-width="2" fill="none"/>
  <path d="M210 168 L270 148" stroke="#1F1B16" stroke-width="2" fill="none"/>
  <path d="M210 228 L270 156" stroke="#1F1B16" stroke-width="2" fill="none"/>
  <path d="M270 138 L300 138" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="305" y="93" width="150" height="90" rx="6" fill="#2C4A3E"/>
  <text x="380" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">Weighting formula</text>
  <text x="380" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Indicators combined</text>
  <text x="380" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">into one number</text>
  <path d="M455 138 L493 138" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="500" y="93" width="160" height="90" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="580" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Composite score</text>
  <text x="580" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">+ country rank</text>
  <text x="580" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6B5C48">The single output</text>
  <text x="340" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6B5C48">Four separate measures, one headline number</text>
</svg>
