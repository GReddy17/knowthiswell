<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="protegeEffectTitle">
  <title id="protegeEffectTitle">A cyclical flow diagram showing the protégé effect: studying material, then preparing to explain it by organizing it and anticipating an audience's questions, then teaching or explaining it to someone, then a real question exposes a gap in understanding, which sends the learner back to fill that gap, producing stronger retention on the next pass than studying alone would.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>

  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">The protégé effect: why preparing to teach closes gaps studying alone misses</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="30" y="80" width="140" height="56" rx="7" fill="#2C4A3E"/>
    <text x="100" y="103" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FBF8F1">Study the</text>
    <text x="100" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FBF8F1">material</text>

    <rect x="210" y="80" width="150" height="56" rx="7" fill="#8B6F4E"/>
    <text x="285" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#FBF8F1">Prepare to explain it</text>
    <text x="285" y="113" text-anchor="middle" font-size="9" fill="#FBF8F1">(organize, anticipate</text>
    <text x="285" y="126" text-anchor="middle" font-size="9" fill="#FBF8F1">questions)</text>

    <rect x="400" y="80" width="140" height="56" rx="7" fill="#8B6F4E"/>
    <text x="470" y="103" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FBF8F1">Explain it to</text>
    <text x="470" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FBF8F1">someone</text>

    <rect x="580" y="80" width="160" height="56" rx="7" fill="#2C4A3E"/>
    <text x="660" y="99" text-anchor="middle" font-size="10" font-weight="700" fill="#FBF8F1">A real question</text>
    <text x="660" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="#FBF8F1">exposes a gap</text>
  </g>

  <line x1="170" y1="108" x2="208" y2="108" stroke="#4A443C" stroke-width="1.6" marker-end="url(#arrowPE)"/>
  <line x1="360" y1="108" x2="398" y2="108" stroke="#4A443C" stroke-width="1.6" marker-end="url(#arrowPE)"/>
  <line x1="540" y1="108" x2="578" y2="108" stroke="#4A443C" stroke-width="1.6" marker-end="url(#arrowPE)"/>

  <path d="M660,138 Q 660,220 100,220 Q 60,220 60,180 Q 60,150 90,138" fill="none" stroke="#4A443C" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrowPE)"/>
  <text x="380" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Go back and fill the gap — retention on the next round beats studying alone</text>

  <defs>
    <marker id="arrowPE" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
