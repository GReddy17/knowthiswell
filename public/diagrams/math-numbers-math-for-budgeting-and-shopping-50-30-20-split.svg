<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="budgetSplitTitle">
  <title id="budgetSplitTitle">Horizontal bar split by the 50/30/20 rule on a $4,200 paycheck: a large left segment for Needs at 50% ($2,100), a medium middle segment for Wants at 30% ($1,260), and a smaller right segment for Savings at 20% ($840), together spanning the full $4,200</title>
  <rect width="640" height="260" fill="#FBF8F1"/>

  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">$4,200 monthly take-home pay</text>

  <!-- bar: total width 520px from x=60 to x=580 -->
  <!-- Needs 50% = 260px (60-320), Wants 30% = 156px (320-476), Savings 20% = 104px (476-580) -->
  <rect x="60" y="90" width="260" height="80" fill="#2C4A3E"/>
  <rect x="320" y="90" width="156" height="80" fill="#6E8F81"/>
  <rect x="476" y="90" width="104" height="80" fill="#C9412C"/>
  <rect x="60" y="90" width="520" height="80" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="320" y1="90" x2="320" y2="170" stroke="#FBF8F1" stroke-width="2"/>
  <line x1="476" y1="90" x2="476" y2="170" stroke="#FBF8F1" stroke-width="2"/>

  <text x="190" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF8F1">Needs 50%</text>
  <text x="190" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">$2,100</text>

  <text x="398" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Wants 30%</text>
  <text x="398" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">$1,260</text>

  <text x="528" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">Savings</text>
  <text x="528" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">20%</text>
  <text x="528" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#FBF8F1">$840</text>

  <!-- brace under full bar -->
  <path d="M 60,190 L 60,200 L 320,200 L 320,206 L 320,200 L 580,200 L 580,190" fill="none" stroke="#4A443C" stroke-width="1.5"/>
  <text x="320" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4A443C">$2,100 + $1,260 + $840 = $4,200 — every dollar of take-home pay accounted for</text>
</svg>
