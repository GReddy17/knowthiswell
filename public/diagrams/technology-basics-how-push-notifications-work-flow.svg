<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pushFlowTitle">
  <title id="pushFlowTitle">A flow diagram showing an app's server sending a notification request to the phone operating system's push notification service, which relays it down a single always-on connection already held open between the device and the operating system maker's servers, waking the specific app briefly to display the alert, contrasted with a note that this is one shared connection per device, not one open connection per app.</title>
  <rect width="820" height="280" fill="#FBF8F1"/>

  <rect x="20" y="40" width="140" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="90" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">App's own</text>
  <text x="90" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">server</text>

  <rect x="240" y="40" width="180" height="50" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="330" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">OS push notification</text>
  <text x="330" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">service (platform-run)</text>

  <rect x="500" y="40" width="150" height="50" fill="#EDE7D8" stroke="#B5493A" stroke-width="2"/>
  <text x="575" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">One persistent</text>
  <text x="575" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">connection</text>

  <rect x="720" y="40" width="80" height="50" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="760" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Device</text>
  <text x="760" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(OS-level)</text>

  <defs>
    <marker id="arrowPush" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M160,65 L238,65" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowPush)"/>
  <text x="199" y="57" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">1. "notify device X"</text>

  <path d="M420,65 L498,65" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowPush)"/>
  <text x="459" y="57" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">2. queued</text>

  <path d="M650,65 L718,65" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowPush)"/>
  <text x="684" y="57" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">3. delivered</text>

  <rect x="440" y="130" width="270" height="46" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="575" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2C4A3E">shared by every app on the device —</text>
  <text x="575" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2C4A3E">not one open socket per app</text>
  <path d="M575,130 L575,90" fill="none" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="60" y="210" width="700" height="45" fill="#FBF8F1" stroke="#D8D2C4" stroke-width="1"/>
  <text x="90" y="237" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">4. Device wakes just the target app briefly to render the alert, then the app can go back to sleep — the OS holds the one open channel, not each individual app.</text>
</svg>
