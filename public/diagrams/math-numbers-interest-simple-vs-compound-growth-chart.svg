<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="interestGrowthTitle">
  <title id="interestGrowthTitle">Line chart of $2,000 at 4% over 30 years: a straight line for simple interest reaching $4,400 at year 30, and a curve for compound interest tracking close to the straight line at first before bending upward increasingly steeply to reach about $6,487 at year 30, with the growing gap between the two lines highlighted in the final third of the chart</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- highlight zone: final third, years 20-30 -->
  <rect x="426.7" y="40" width="173.3" height="300" fill="#FBEDEA" opacity="0.6"/>

  <!-- gridlines -->
  <g stroke="#EDE7D8" stroke-width="1">
    <line x1="166.7" y1="40" x2="166.7" y2="340"/>
    <line x1="253.3" y1="40" x2="253.3" y2="340"/>
    <line x1="340" y1="40" x2="340" y2="340"/>
    <line x1="426.7" y1="40" x2="426.7" y2="340"/>
    <line x1="513.3" y1="40" x2="513.3" y2="340"/>
    <line x1="80" y1="297.1" x2="600" y2="297.1"/>
    <line x1="80" y1="254.3" x2="600" y2="254.3"/>
    <line x1="80" y1="211.4" x2="600" y2="211.4"/>
    <line x1="80" y1="168.6" x2="600" y2="168.6"/>
    <line x1="80" y1="125.7" x2="600" y2="125.7"/>
    <line x1="80" y1="82.9" x2="600" y2="82.9"/>
  </g>

  <!-- axes -->
  <line x1="80" y1="340" x2="600" y2="340" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="80" y2="40" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M 600,340 L 590,335 L 590,345 Z" fill="#1F1B16"/>
  <path d="M 80,40 L 75,50 L 85,50 Z" fill="#1F1B16"/>
  <text x="590" y="362" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Years</text>
  <text x="60" y="40" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C" transform="rotate(-90 60 40)">Balance</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C" text-anchor="middle">
    <text x="80" y="356">0</text>
    <text x="166.7" y="356">5</text>
    <text x="253.3" y="356">10</text>
    <text x="340" y="356">15</text>
    <text x="426.7" y="356">20</text>
    <text x="513.3" y="356">25</text>
    <text x="600" y="356">30</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C" text-anchor="end">
    <text x="72" y="343">$2,000</text>
    <text x="72" y="212">$4,500</text>
    <text x="72" y="86">$7,000</text>
  </g>

  <!-- compound curve -->
  <path d="M 80,254.3 L 166.7,235.7 L 253.3,213.1 L 340,185.6 L 426.7,152.2 L 513.3,111.5 L 600,62" fill="none" stroke="#C9412C" stroke-width="2.5"/>
  <!-- simple interest straight line -->
  <path d="M 80,254.3 L 600,151.4" fill="none" stroke="#2C4A3E" stroke-width="3"/>

  <circle cx="80" cy="254.3" r="4" fill="#1F1B16"/>
  <circle cx="600" cy="151.4" r="4" fill="#2C4A3E"/>
  <circle cx="600" cy="62" r="4" fill="#C9412C"/>

  <text x="605" y="147" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2C4A3E">$4,400</text>
  <text x="524" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#C9412C">$6,487</text>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">
    <line x1="110" y1="60" x2="140" y2="60" stroke="#2C4A3E" stroke-width="3"/>
    <text x="148" y="64" fill="#1F1B16">Simple interest (linear)</text>
    <line x1="110" y1="80" x2="140" y2="80" stroke="#C9412C" stroke-width="2.5"/>
    <text x="148" y="84" fill="#1F1B16">Compound interest (exponential)</text>
  </g>
  <text x="513" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8B6F4E">gap widens sharply in later years</text>
</svg>
