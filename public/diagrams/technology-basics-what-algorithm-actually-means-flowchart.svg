<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="algoFlowTitle">
  <title id="algoFlowTitle">Flowchart of a simple everyday algorithm for finding the largest number in a list: start, set the first number as the current largest, check if there is a next number, if yes compare it to the current largest and update if bigger then loop back to the check, if no more numbers then output the current largest and stop.</title>
  <rect width="640" height="460" fill="#FBF8F1"/>

  <rect x="220" y="20" width="200" height="46" rx="23" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="320" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Start: list of numbers</text>

  <rect x="190" y="90" width="260" height="50" rx="8" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="320" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Set "largest" = first number</text>

  <polygon points="320,160 420,205 320,250 220,205" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="320" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Any numbers</text>
  <text x="320" y="214" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">left to check?</text>

  <rect x="450" y="180" width="150" height="50" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="525" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">Is it bigger than</text>
  <text x="525" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">current largest?</text>

  <rect x="450" y="270" width="150" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="525" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Update "largest"</text>

  <rect x="190" y="320" width="260" height="50" rx="23" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="320" y="350" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">No numbers left</text>

  <rect x="220" y="390" width="200" height="50" rx="25" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="320" y="420" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Output "largest": done</text>

  <defs>
    <marker id="arrowAlgo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M320,66 L320,90" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowAlgo)"/>
  <path d="M320,140 L320,160" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowAlgo)"/>
  <path d="M420,205 L450,205" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowAlgo)"/>
  <text x="435" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">yes</text>
  <path d="M525,230 L525,270" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowAlgo)"/>
  <path d="M525,320 C 525,380 460,205 420,205" fill="none" stroke="#8B6F4E" stroke-width="1.5" marker-end="url(#arrowAlgo)"/>
  <text x="560" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">check next number</text>

  <path d="M320,250 L320,320" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowAlgo)"/>
  <text x="345" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">no</text>
  <path d="M320,370 L320,390" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowAlgo)"/>
</svg>
