<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="priceFlowTitle">
  <title id="priceFlowTitle">Flow diagram of a price moving through a discount, sales tax, and tip in sequence: original price times one minus the discount rate gives the discounted price, times one plus the tax rate gives the post-tax price; the tip is the tip rate times the pre-tax discounted subtotal; post-tax price plus tip equals the total amount paid</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="24" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8B6F4E">Example: $50 item &#183; 30% discount &#183; 8% sales tax &#183; 18% tip</text>

  <!-- arrows -->
  <g stroke="#2C4A3E" stroke-width="1.75" fill="none">
    <line x1="160" y1="99" x2="220" y2="99"/>
    <line x1="385" y1="99" x2="445" y2="99"/>
    <line x1="305" y1="132" x2="305" y2="225"/>
    <line x1="530" y1="132" x2="530" y2="325"/>
    <line x1="305" y1="296" x2="305" y2="325"/>
  </g>
  <g fill="#2C4A3E">
    <path d="M 225,99 L 216,94 L 216,104 Z"/>
    <path d="M 450,99 L 441,94 L 441,104 Z"/>
    <path d="M 305,230 L 300,221 L 310,221 Z"/>
    <path d="M 530,330 L 525,321 L 535,321 Z"/>
    <path d="M 305,330 L 300,321 L 310,321 Z"/>
  </g>

  <!-- arrow labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="192" y="87" font-size="12" font-weight="600" fill="#1F1B16">&#215; (1 &#8722; 0.30)</text>
    <text x="192" y="117" font-size="10.5" fill="#4A443C">30% discount</text>
    <text x="417" y="87" font-size="12" font-weight="600" fill="#1F1B16">&#215; (1 + 0.08)</text>
    <text x="417" y="117" font-size="10.5" fill="#4A443C">8% sales tax</text>
    <text x="352" y="174" font-size="12" font-weight="600" fill="#1F1B16" text-anchor="start">&#215; 0.18</text>
    <text x="352" y="190" font-size="10.5" fill="#4A443C" text-anchor="start">tip rate, on the</text>
    <text x="352" y="203" font-size="10.5" fill="#4A443C" text-anchor="start">pre-tax subtotal</text>
  </g>

  <!-- Original price -->
  <rect x="20" y="66" width="140" height="66" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="90" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Original price</text>
  <text x="90" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F1B16">$50.00</text>

  <!-- Discounted price -->
  <rect x="225" y="66" width="160" height="66" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="305" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Discounted price</text>
  <text x="305" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F1B16">$35.00</text>
  <text x="305" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">(pre-tax subtotal)</text>

  <!-- Post-tax price -->
  <rect x="450" y="66" width="160" height="66" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="530" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Post-tax price</text>
  <text x="530" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F1B16">$37.80</text>

  <!-- Tip amount -->
  <rect x="225" y="230" width="160" height="66" rx="10" fill="#EAF0F6" stroke="#3B5B7A" stroke-width="1.5"/>
  <text x="305" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Tip amount</text>
  <text x="305" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F1B16">$6.30</text>
  <text x="305" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">(18% &#215; $35.00)</text>

  <!-- Total amount paid -->
  <rect x="300" y="330" width="260" height="70" rx="12" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.75"/>
  <text x="430" y="354" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Total amount paid</text>
  <text x="430" y="379" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#1F1B16">$44.10</text>
  <text x="430" y="394" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">$37.80 post-tax price + $6.30 tip</text>

  <!-- plus indicators where lines meet the total box -->
  <circle cx="530" cy="316" r="8" fill="#FBF8F1" stroke="#C9412C" stroke-width="1.25"/>
  <text x="530" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#C9412C">+</text>
  <circle cx="305" cy="313" r="8" fill="#FBF8F1" stroke="#C9412C" stroke-width="1.25"/>
  <text x="305" y="317" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#C9412C">+</text>
</svg>
