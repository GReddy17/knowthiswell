<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="checkupTrendTitle">
  <title id="checkupTrendTitle">Two panels. Left panel: a single data point labeled "Year 3 reading: borderline normal," shown in isolation with no context. Right panel: the same value shown as one point on a five-year upward-trending line labeled Year 1 through Year 5, with an arrow showing the values climbing steadily even though each one individually would be read as normal.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <!-- Left panel -->
  <rect x="20" y="20" width="340" height="260" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="190" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">A single visit, in isolation</text>
  <circle cx="190" cy="170" r="8" fill="#B5493A"/>
  <text x="190" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Year 3 reading:</text>
  <text x="190" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">"borderline normal"</text>
  <text x="190" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">No visible warning sign</text>

  <!-- Right panel -->
  <rect x="400" y="20" width="360" height="260" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Same value, in a 5-year trend</text>
  <line x1="430" y1="230" x2="740" y2="230" stroke="#2C4A3E" stroke-width="1.4"/>
  <polyline points="440,220 495,200 550,180 605,160 660,120" fill="none" stroke="#B5493A" stroke-width="2.4"/>
  <circle cx="440" cy="220" r="5" fill="#2C4A3E"/>
  <circle cx="495" cy="200" r="5" fill="#2C4A3E"/>
  <circle cx="550" cy="180" r="5" fill="#B5493A"/>
  <circle cx="605" cy="160" r="5" fill="#2C4A3E"/>
  <circle cx="660" cy="120" r="5" fill="#2C4A3E"/>
  <text x="440" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Yr 1</text>
  <text x="495" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Yr 2</text>
  <text x="550" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Yr 3</text>
  <text x="605" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Yr 4</text>
  <text x="660" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Yr 5</text>
  <text x="580" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Steady upward trend, now visible</text>
</svg>
