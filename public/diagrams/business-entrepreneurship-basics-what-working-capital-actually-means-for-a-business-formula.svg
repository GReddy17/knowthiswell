<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workingCapitalTitle">
  <title id="workingCapitalTitle">Working capital equals current assets minus current liabilities. Example: $80,000 in cash and inventory minus $50,000 in bills due within a year leaves $30,000 in working capital.</title>
  <rect width="560" height="320" fill="#FBF8F1"/>
  <rect x="40" y="40" width="200" height="80" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="140" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Current assets</text>
  <text x="140" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">cash, inventory,</text>
  <text x="140" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">receivables</text>
  <text x="255" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#C9412C">−</text>
  <rect x="280" y="40" width="200" height="80" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="380" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Current liabilities</text>
  <text x="380" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">bills due within</text>
  <text x="380" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">12 months</text>
  <line x1="120" y1="150" x2="460" y2="150" stroke="#1F1B16" stroke-width="2"/>
  <rect x="160" y="170" width="240" height="60" rx="6" fill="#2C4A3E"/>
  <text x="280" y="197" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">= Working capital</text>
  <text x="280" y="217" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#FBF8F1">cash to run day-to-day</text>
  <text x="280" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Example: $80,000 assets − $50,000 liabilities = $30,000</text>
</svg>
