<svg viewBox="0 0 560 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nnFlowTitle">
  <title id="nnFlowTitle">How a neural network learns: inputs are multiplied by weights and summed in each layer, an activation function shapes the result, the network's output is compared to the correct answer to measure the error, and backpropagation nudges every weight to shrink that error, repeated over many examples.</title>
  <rect width="560" height="490" fill="#FBF8F1"/>
  <rect x="150" y="20" width="260" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">1. Input numbers go in</text>
  <text x="280" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">(pixels, words turned into numbers)</text>
  <text x="280" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="106" width="260" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">2. Each layer multiplies by weights,</text>
  <text x="280" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">adds them up, applies an activation</text>
  <text x="280" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="192" width="260" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">3. Output layer makes a guess</text>
  <text x="280" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">(e.g. 80% cat, 20% dog)</text>
  <text x="280" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="278" width="260" height="60" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">4. Guess is compared to the right</text>
  <text x="280" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">answer: the size of the miss = loss</text>
  <text x="280" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="364" width="260" height="60" rx="6" fill="#2C4A3E"/>
  <text x="280" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">5. Backpropagation nudges every</text>
  <text x="280" y="406" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">weight to shrink the loss</text>
  <text x="280" y="476" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Repeat steps 1-5 over millions of examples: the learning lives in the weights</text>
</svg>
