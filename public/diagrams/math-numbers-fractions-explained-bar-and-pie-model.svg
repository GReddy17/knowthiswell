<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fracTitle">
  <title id="fracTitle">A rectangle divided into 4 equal parts with 3 shaded, and a circle divided into 4 equal slices with 3 shaded, both representing the fraction three fourths</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#20362D">3/4 — two ways to see the same value</text>

  <!-- bar model -->
  <text x="160" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Bar model</text>
  <g stroke="#2C4A3E" stroke-width="2">
    <rect x="40" y="110" width="80" height="80" fill="#2C4A3E"/>
    <rect x="120" y="110" width="80" height="80" fill="#2C4A3E"/>
    <rect x="200" y="110" width="80" height="80" fill="#2C4A3E"/>
    <rect x="280" y="110" width="0" height="0" fill="none"/>
  </g>
  <rect x="40" y="110" width="240" height="80" fill="none" stroke="#1F1B16" stroke-width="2.5"/>
  <line x1="120" y1="110" x2="120" y2="190" stroke="#FBF8F1" stroke-width="2"/>
  <line x1="200" y1="110" x2="200" y2="190" stroke="#FBF8F1" stroke-width="2"/>
  <rect x="280" y="110" width="80" height="80" fill="#FBF8F1" stroke="#1F1B16" stroke-width="2.5"/>
  <line x1="280" y1="110" x2="280" y2="190" stroke="#1F1B16" stroke-width="2"/>

  <text x="200" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">3 shaded parts out of 4 equal parts</text>

  <!-- pie model -->
  <text x="480" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Pie model</text>
  <g transform="translate(480,190)">
    <circle r="80" fill="#FBF8F1" stroke="#1F1B16" stroke-width="2.5"/>
    <path d="M 0 0 L 0 -80 A 80 80 0 0 1 80 0 Z" fill="#2C4A3E"/>
    <path d="M 0 0 L 80 0 A 80 80 0 0 1 0 80 Z" fill="#2C4A3E"/>
    <path d="M 0 0 L 0 80 A 80 80 0 0 1 -80 0 Z" fill="#2C4A3E"/>
    <path d="M 0 0 L -80 0 A 80 80 0 0 1 0 -80 Z" fill="#FBF8F1"/>
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#1F1B16" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="80" y2="0" stroke="#1F1B16" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="80" stroke="#1F1B16" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-80" y2="0" stroke="#1F1B16" stroke-width="1.5"/>
    <circle r="80" fill="none" stroke="#1F1B16" stroke-width="2.5"/>
  </g>
  <text x="480" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">3 of 4 equal slices</text>

  <text x="320" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">Same value, different shapes: 3/4 = 0.75 = 75%</text>
</svg>
