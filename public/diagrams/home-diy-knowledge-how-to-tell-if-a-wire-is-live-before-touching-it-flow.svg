<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="testTestTestTitle">
  <title id="testTestTestTitle">A flow diagram of the test-test-test verification method electricians use with a non-contact voltage tester: first confirming the tester works on a known live source, then testing the wire in question, then re-confirming the tester still works on the known live source, so a wire is only treated as de-energized once all three checks agree.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="390" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Verifying a wire is de-energized: the &#8220;test-test-test&#8221; method</text>

  <rect x="20" y="70" width="200" height="60" rx="7" fill="#2C4A3E"/>
  <text x="120" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">1. Test tester on a</text>
  <text x="120" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">known live source</text>
  <text x="120" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">confirms the tester works</text>

  <line x1="220" y1="100" x2="278" y2="100" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowTLT)"/>

  <rect x="280" y="70" width="200" height="60" rx="7" fill="#8B6F4E"/>
  <text x="380" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">2. Test the wire</text>
  <text x="380" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">in question</text>
  <text x="380" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">not the breaker label alone</text>

  <line x1="480" y1="100" x2="538" y2="100" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowTLT)"/>

  <rect x="540" y="70" width="220" height="60" rx="7" fill="#2C4A3E"/>
  <text x="650" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">3. Re-test tester on the</text>
  <text x="650" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">same known live source</text>
  <text x="650" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">rules out a dead battery</text>

  <line x1="390" y1="130" x2="390" y2="168" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowTLT)"/>

  <rect x="200" y="170" width="380" height="52" rx="7" fill="#1F1B16"/>
  <text x="390" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">Only if all three steps agree is the wire</text>
  <text x="390" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">treated as verified de-energized</text>

  <text x="390" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">A breaker label or a wire&#8217;s appearance alone skips every one of these checks.</text>

  <defs>
    <marker id="arrowTLT" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
