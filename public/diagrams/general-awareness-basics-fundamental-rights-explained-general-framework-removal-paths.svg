<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rightsPathTitle">
  <title id="rightsPathTitle">Two side-by-side vertical paths. The left path, labeled Ordinary Law, shows a single step: a majority vote in the legislature, leading to Changed or Repealed. The right path, labeled Fundamental Right, shows a taller staircase of steps: supermajority vote, constitutional amendment process, and ratification, leading to Changed only after all steps are completed.</title>
  <rect width="780" height="340" fill="#FBF8F1"/>

  <text x="180" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Ordinary Law</text>
  <rect x="90" y="60" width="180" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="180" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Majority vote in</text>
  <text x="180" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">the legislature</text>
  <line x1="180" y1="120" x2="180" y2="155" stroke="#2C4A3E" stroke-width="2"/>
  <polygon points="180,165 172,150 188,150" fill="#2C4A3E"/>
  <rect x="90" y="170" width="180" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="180" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Changed or Repealed</text>

  <line x1="400" y1="20" x2="400" y2="320" stroke="#D8D2C0" stroke-width="1"/>

  <text x="600" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Fundamental Right</text>
  <rect x="510" y="55" width="180" height="42" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Supermajority vote</text>
  <line x1="600" y1="97" x2="600" y2="120" stroke="#2C4A3E" stroke-width="1.6"/>

  <rect x="510" y="120" width="180" height="42" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Amendment process</text>
  <line x1="600" y1="162" x2="600" y2="185" stroke="#2C4A3E" stroke-width="1.6"/>

  <rect x="510" y="185" width="180" height="42" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Ratification</text>
  <line x1="600" y1="227" x2="600" y2="255" stroke="#2C4A3E" stroke-width="2"/>
  <polygon points="600,265 592,250 608,250" fill="#2C4A3E"/>

  <rect x="510" y="270" width="180" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="600" y="303" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Changed (rare)</text>
</svg>
