<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lightningFlowTitle">
  <title id="lightningFlowTitle">A stepped leader descends from a storm cloud in jagged steps while an upward streamer rises from a tall, isolated building to meet it; the connection point is marked, and a second panel shows the same building struck again in a later storm through the identical process.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="390" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Same building, two separate storms — same physical contest each time</text>

  <!-- LEFT PANEL: Storm 1 -->
  <text x="185" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#4A443C">Storm 1</text>

  <!-- cloud -->
  <ellipse cx="185" cy="75" rx="90" ry="26" fill="#8B8378"/>
  <ellipse cx="140" cy="80" rx="45" ry="20" fill="#8B8378"/>
  <ellipse cx="230" cy="80" rx="45" ry="20" fill="#8B8378"/>

  <!-- stepped leader (jagged descent) -->
  <path d="M185,98 L178,120 L192,138 L172,158 L186,178 L178,196"
        fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="130" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2C4A3E">stepped leader</text>

  <!-- ground -->
  <rect x="40" y="255" width="290" height="8" fill="#4A443C"/>

  <!-- tall building -->
  <rect x="165" y="196" width="26" height="59" fill="#E8DEC8" stroke="#1F1B16" stroke-width="2"/>
  <line x1="178" y1="196" x2="178" y2="182" stroke="#1F1B16" stroke-width="2"/>

  <!-- upward streamer -->
  <path d="M178,196 L182,188 L178,182" fill="none" stroke="#C9412C" stroke-width="2.5"/>
  <circle cx="178" cy="196" r="4" fill="#C9412C"/>
  <text x="225" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#C9412C">upward streamer</text>
  <text x="150" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">tall, isolated building</text>

  <!-- small tree for contrast -->
  <line x1="70" y1="255" x2="70" y2="235" stroke="#4A443C" stroke-width="3"/>
  <ellipse cx="70" cy="228" rx="14" ry="12" fill="#8B6F4E"/>

  <!-- divider -->
  <line x1="390" y1="45" x2="390" y2="290" stroke="#4A443C" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT PANEL: Storm 2, months later -->
  <text x="595" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#4A443C">Storm 2 (months later)</text>

  <ellipse cx="595" cy="75" rx="90" ry="26" fill="#8B8378"/>
  <ellipse cx="550" cy="80" rx="45" ry="20" fill="#8B8378"/>
  <ellipse cx="640" cy="80" rx="45" ry="20" fill="#8B8378"/>

  <path d="M595,98 L602,120 L588,138 L608,158 L594,178 L602,196"
        fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="618" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2C4A3E">stepped leader</text>

  <rect x="450" y="255" width="290" height="8" fill="#4A443C"/>

  <rect x="575" y="196" width="26" height="59" fill="#E8DEC8" stroke="#1F1B16" stroke-width="2"/>
  <line x1="588" y1="196" x2="588" y2="182" stroke="#1F1B16" stroke-width="2"/>

  <path d="M588,196 L592,188 L588,182" fill="none" stroke="#C9412C" stroke-width="2.5"/>
  <circle cx="588" cy="196" r="4" fill="#C9412C"/>
  <text x="640" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#C9412C">upward streamer</text>
  <text x="560" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">same building, struck again</text>

  <line x1="480" y1="255" x2="480" y2="235" stroke="#4A443C" stroke-width="3"/>
  <ellipse cx="480" cy="228" rx="14" ry="12" fill="#8B6F4E"/>

  <text x="390" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Height + isolation + conductivity win the connection — every storm, independent of past strikes</text>
</svg>
