<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="640" height="240" fill="#FBF8F1"/>

  <rect x="20" y="90" width="130" height="60" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
  <text x="85" y="116" text-anchor="middle" font-size="13" fill="#1F1B16" font-weight="700">Lost</text>
  <text x="85" y="134" text-anchor="middle" font-size="13" fill="#1F1B16" font-weight="700">document</text>

  <path d="M150 105 H190" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#a5)"/>
  <path d="M150 135 H190" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#a5)"/>

  <text x="220" y="55" font-size="12" fill="#4A443C" font-weight="600">Replace</text>
  <rect x="190" y="65" width="200" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="290" y="88" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">Contact issuing</text>
  <text x="290" y="105" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">agency directly</text>

  <text x="220" y="150" font-size="12" fill="#4A443C" font-weight="600">Protect</text>
  <rect x="190" y="160" width="200" height="55" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="290" y="183" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">Fraud alert or</text>
  <text x="290" y="200" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">credit freeze</text>

  <path d="M390 92 H430" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#a5)"/>
  <path d="M390 187 H430" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="430" y="115" width="180" height="55" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="520" y="138" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="700">Risk window</text>
  <text x="520" y="155" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="700">closed quickly</text>

  <path d="M390 92 Q410 92 410 115" fill="none" stroke="#2C4A3E" stroke-width="1"/>
  <path d="M390 187 Q410 187 410 170" fill="none" stroke="#2C4A3E" stroke-width="1"/>

  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#4A443C">Both tracks run at the same time, not one after the other</text>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
