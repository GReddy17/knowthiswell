<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="norovirusTitle">
  <title id="norovirusTitle">Diagram showing norovirus transmission looping between an infected person, shared surfaces such as buffet utensils and railings, and new people, on a cruise ship</title>
  <defs>
    <marker id="arrowGreenCr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <rect width="640" height="340" fill="#FBF8F1"/>

  <text x="320" y="32" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="700" fill="#1F1B16">The norovirus transmission loop</text>

  <text x="130" y="140" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="34">🤒</text>
  <text x="130" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Infected passenger</text>

  <rect x="270" y="115" width="100" height="55" fill="none" stroke="#C9412C" stroke-width="2.5"/>
  <text x="320" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#C9412C">Shared surface</text>
  <text x="320" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#C9412C">(buffet tongs, rail)</text>

  <text x="510" y="140" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="34">🙂</text>
  <text x="510" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">New passenger</text>

  <path d="M165,150 C 210,150 240,145 270,145" fill="none" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowGreenCr)"/>
  <path d="M370,145 C 410,145 450,150 480,150" fill="none" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowGreenCr)"/>

  <path d="M510,180 C 400,260 240,260 130,180" fill="none" stroke="#2C4A3E" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowGreenCr)"/>
  <text x="320" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">New passenger becomes contagious, cycle repeats</text>

  <text x="320" y="305" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">As few as 18 viral particles are enough — soap and water beats sanitizer here</text>
</svg>
