<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pooledRiskTitle">
  <title id="pooledRiskTitle">A diagram showing many small arrows labeled premium flowing from a grid of house icons into a central pool labeled shared risk pool, with a few arrows flowing back out from the pool to a small number of house icons marked with a red claim icon, illustrating that many small contributions fund the few large payouts</title>
  <rect width="780" height="340" fill="#FBF8F1"/>

  <!-- Grid of houses (policyholders) -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- row 1 -->
    <g transform="translate(40,30)"><rect width="34" height="26" y="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/><polygon points="17,-4 -2,10 36,10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/></g>
    <g transform="translate(110,30)"><rect width="34" height="26" y="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/><polygon points="17,-4 -2,10 36,10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/></g>
    <g transform="translate(180,30)"><rect width="34" height="26" y="10" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.8"/><polygon points="17,-4 -2,10 36,10" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.8"/><circle cx="17" cy="20" r="6" fill="#B5493A"/><text x="17" y="24" text-anchor="middle" font-size="9" fill="#FBF8F1" font-weight="700">!</text></g>
    <g transform="translate(250,30)"><rect width="34" height="26" y="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/><polygon points="17,-4 -2,10 36,10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/></g>
    <!-- row 2 -->
    <g transform="translate(40,90)"><rect width="34" height="26" y="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/><polygon points="17,-4 -2,10 36,10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/></g>
    <g transform="translate(110,90)"><rect width="34" height="26" y="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/><polygon points="17,-4 -2,10 36,10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/></g>
    <g transform="translate(180,90)"><rect width="34" height="26" y="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/><polygon points="17,-4 -2,10 36,10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/></g>
    <g transform="translate(250,90)"><rect width="34" height="26" y="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/><polygon points="17,-4 -2,10 36,10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/></g>
    <text x="150" y="150" text-anchor="middle" font-size="12" fill="#4A443C">10,000 policyholders (a few shown)</text>
  </g>

  <!-- Arrows into pool -->
  <line x1="70" y1="70" x2="380" y2="170" stroke="#2C4A3E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="140" y1="70" x2="390" y2="175" stroke="#2C4A3E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="210" y1="70" x2="400" y2="180" stroke="#B5493A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="280" y1="70" x2="410" y2="175" stroke="#2C4A3E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="70" y1="130" x2="380" y2="200" stroke="#2C4A3E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="140" y1="130" x2="390" y2="205" stroke="#2C4A3E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="210" y1="130" x2="400" y2="210" stroke="#2C4A3E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="280" y1="130" x2="410" y2="205" stroke="#2C4A3E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#4A443C" font-family="ui-sans-serif, system-ui, sans-serif">premium</text>

  <!-- Pool -->
  <ellipse cx="480" cy="190" rx="90" ry="70" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="480" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Shared</text>
  <text x="480" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Risk Pool</text>

  <!-- Payout arrow back to the claim house -->
  <line x1="560" y1="180" x2="700" y2="80" stroke="#B5493A" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="660" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A" font-weight="700">payout</text>

  <g transform="translate(680,90)">
    <rect width="34" height="26" y="10" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.8"/>
    <polygon points="17,-4 -2,10 36,10" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.8"/>
    <circle cx="17" cy="20" r="6" fill="#B5493A"/>
    <text x="17" y="24" text-anchor="middle" font-size="9" fill="#FBF8F1" font-weight="700">!</text>
  </g>
  <text x="697" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">the rare claim</text>

  <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Many small premiums fund the pool; the pool pays the full cost of the few large claims.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/></marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B5493A"/></marker>
  </defs>
</svg>
