<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polymerChainTitle">
  <title id="polymerChainTitle">Three panels: individual monomer molecules; the same monomers linked end to end into a long polymer chain; thermoplastic chains lying loosely alongside each other able to slide, compared to thermoset chains connected by extra cross-link bonds forming a rigid network</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="19" font-weight="600" fill="#1F1B16">Monomer → Polymer Chain → Plastic</text>

  <line x1="213" y1="55" x2="213" y2="390" stroke="#E3DCC9" stroke-width="1"/>
  <line x1="426" y1="55" x2="426" y2="390" stroke="#E3DCC9" stroke-width="1"/>

  <!-- Panel 1: individual monomers -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="106" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">1. Monomers</text>
    <circle cx="60" cy="130" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <circle cx="106" cy="160" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <circle cx="150" cy="120" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <circle cx="70" cy="210" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <circle cx="140" cy="220" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <circle cx="110" cy="270" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="106" y="330" text-anchor="middle" font-size="11" fill="#4A443C">Small, separate</text>
    <text x="106" y="345" text-anchor="middle" font-size="11" fill="#4A443C">repeating units</text>
  </g>

  <!-- Panel 2: linked chain -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">2. Polymer chain</text>
    <g stroke="#1F1B16" stroke-width="2">
      <line x1="242" y1="190" x2="266" y2="170"/>
      <line x1="266" y1="170" x2="290" y2="190"/>
      <line x1="290" y1="190" x2="314" y2="170"/>
      <line x1="314" y1="170" x2="338" y2="190"/>
      <line x1="338" y1="190" x2="362" y2="170"/>
      <line x1="362" y1="170" x2="386" y2="190"/>
      <line x1="386" y1="190" x2="398" y2="180"/>
    </g>
    <g fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5">
      <circle cx="242" cy="190" r="10"/>
      <circle cx="266" cy="170" r="10"/>
      <circle cx="290" cy="190" r="10"/>
      <circle cx="314" cy="170" r="10"/>
      <circle cx="338" cy="190" r="10"/>
      <circle cx="362" cy="170" r="10"/>
      <circle cx="386" cy="190" r="10"/>
    </g>
    <text x="320" y="330" text-anchor="middle" font-size="11" fill="#4A443C">Monomers linked end to</text>
    <text x="320" y="345" text-anchor="middle" font-size="11" fill="#4A443C">end into one long chain</text>
  </g>

  <!-- Panel 3: thermoplastic vs thermoset -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="533" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">3. Heated behavior</text>

    <!-- thermoplastic: loose parallel chains -->
    <text x="533" y="95" text-anchor="middle" font-size="10.5" fill="#2C4A3E" font-weight="600">Thermoplastic</text>
    <path d="M 448,110 Q 470,100 490,110 Q 510,120 533,110" fill="none" stroke="#2C4A3E" stroke-width="2"/>
    <path d="M 448,125 Q 470,115 490,125 Q 510,135 533,125" fill="none" stroke="#2C4A3E" stroke-width="2"/>
    <path d="M 448,140 Q 470,130 490,140 Q 510,150 533,140" fill="none" stroke="#2C4A3E" stroke-width="2"/>
    <text x="533" y="165" text-anchor="middle" font-size="9.5" fill="#4A443C">Chains slide when</text>
    <text x="533" y="178" text-anchor="middle" font-size="9.5" fill="#4A443C">heated — re-meltable</text>

    <!-- thermoset: cross-linked chains -->
    <text x="533" y="215" text-anchor="middle" font-size="10.5" fill="#C9412C" font-weight="600">Thermoset</text>
    <path d="M 448,235 Q 470,225 490,235 Q 510,245 533,235" fill="none" stroke="#1F1B16" stroke-width="2"/>
    <path d="M 448,255 Q 470,245 490,255 Q 510,265 533,255" fill="none" stroke="#1F1B16" stroke-width="2"/>
    <path d="M 448,275 Q 470,265 490,275 Q 510,285 533,275" fill="none" stroke="#1F1B16" stroke-width="2"/>
    <!-- cross-links -->
    <line x1="470" y1="228" x2="470" y2="248" stroke="#C9412C" stroke-width="2"/>
    <line x1="500" y1="238" x2="500" y2="258" stroke="#C9412C" stroke-width="2"/>
    <line x1="470" y1="252" x2="470" y2="272" stroke="#C9412C" stroke-width="2"/>
    <line x1="510" y1="248" x2="510" y2="268" stroke="#C9412C" stroke-width="2"/>
    <text x="533" y="300" text-anchor="middle" font-size="9.5" fill="#4A443C">Cross-links lock chains —</text>
    <text x="533" y="313" text-anchor="middle" font-size="9.5" fill="#4A443C">never re-meltable</text>
  </g>

  <text x="320" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Whether chains are cross-linked determines if a plastic can be re-melted</text>
</svg>
