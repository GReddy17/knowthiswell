<svg viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lobbyFlowTitle">
  <title id="lobbyFlowTitle">A horizontal flow diagram with four boxes connected by arrows: Interest group hires a registered lobbyist, arrow to Lobbyist meets with legislators and staff to advocate a position, arrow to Lobbyist files a quarterly disclosure report naming client issue and spending, arrow to Disclosure becomes searchable public record</title>
  <rect width="820" height="220" fill="#FBF8F1"/>

  <rect x="15" y="70" width="175" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="102" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Interest group hires</text>
  <text x="102" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">a registered lobbyist</text>

  <text x="212" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">&#8594;</text>

  <rect x="228" y="70" width="175" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="315" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Lobbyist meets with</text>
  <text x="315" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">legislators and staff to</text>
  <text x="315" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">advocate a position</text>

  <text x="425" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">&#8594;</text>

  <rect x="441" y="70" width="185" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="533" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Lobbyist files a quarterly</text>
  <text x="533" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">disclosure report naming</text>
  <text x="533" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">client, issue, and spending</text>

  <text x="648" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">&#8594;</text>

  <rect x="664" y="70" width="140" height="90" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="734" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Searchable</text>
  <text x="734" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">public record</text>

  <text x="410" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">The disclosure step is what makes regulated lobbying auditable rather than hidden.</text>
</svg>
