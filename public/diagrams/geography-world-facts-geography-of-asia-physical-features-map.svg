<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="asiaFeaturesTitle">
  <title id="asiaFeaturesTitle">A simplified physical map of Asia showing the Ural Mountains marking the western boundary with Europe, the Tibetan Plateau and Himalayan mountain arc across the south-central region, major rivers (Ganges, Indus, Yangtze, Mekong, Yellow River) radiating outward from the plateau, the Gobi and Arabian deserts, and the Siberian lowlands stretching across the north</title>
  <rect width="640" height="480" fill="#FBF8F1"/>

  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Asia's major physical features</text>

  <!-- asia base outline -->
  <path d="M145,55 L300,45 L420,55 L500,75 L560,110 L590,170 L575,230 L540,280 L505,265 L480,300 L450,335 L420,300 L400,265 L410,235 L370,255 L340,375 L300,270 L290,235 L305,205 L260,225 L230,300 L200,265 L225,215 L210,180 L175,150 L150,120 Z"
        fill="#EDE7D8" stroke="#20362D" stroke-width="1.5"/>

  <!-- Ural Mountains: western boundary with Europe -->
  <line x1="150" y1="60" x2="150" y2="210" stroke="#1F1B16" stroke-width="2" stroke-dasharray="6 3"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">
    <text x="60" y="70">Ural Mts.</text>
    <text x="60" y="82">(boundary with Europe)</text>
  </g>

  <!-- Siberian lowlands -->
  <rect x="250" y="60" width="220" height="60" fill="#8FAE7A" opacity="0.35"/>
  <text x="360" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#3F6B4F">Siberian Lowlands</text>

  <!-- Gobi desert -->
  <ellipse cx="415" cy="195" rx="42" ry="20" fill="#C9A66B" opacity="0.5"/>
  <text x="415" y="199" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6B5636">Gobi Desert</text>

  <!-- Arabian desert -->
  <ellipse cx="235" cy="290" rx="34" ry="26" fill="#C9A66B" opacity="0.5"/>
  <text x="235" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6B5636">Arabian Desert</text>

  <!-- Tibetan Plateau + Himalaya arc -->
  <ellipse cx="330" cy="235" rx="55" ry="28" fill="#8B6F4E" opacity="0.4"/>
  <path d="M 275,258 C 305,278 355,278 385,255" fill="none" stroke="#20362D" stroke-width="3" stroke-linecap="round"/>
  <text x="330" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#20362D">Tibetan Plateau</text>
  <text x="330" y="291" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#20362D">Himalayan arc</text>

  <!-- rivers radiating from the plateau -->
  <g fill="none" stroke="#4A7A9E" stroke-width="1.6">
    <path d="M 295,255 C 275,285 250,300 232,300"/>
    <path d="M 305,262 C 295,300 285,330 280,352"/>
    <path d="M 345,255 C 370,280 395,285 410,265"/>
    <path d="M 355,260 C 385,295 400,315 405,330"/>
    <path d="M 335,210 C 365,190 390,190 405,205"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#3F5E78">
    <text x="200" y="304">Indus</text>
    <text x="255" y="365">Ganges</text>
    <text x="415" y="262">Yellow River</text>
    <text x="395" y="342">Mekong</text>
    <text x="405" y="200">Yangtze</text>
  </g>

  <text x="320" y="418" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Nearly every major river in South and East Asia begins as glacial meltwater on the Tibetan Plateau.</text>
</svg>
