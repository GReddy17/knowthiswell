<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="newsHabitTitle">
  <title id="newsHabitTitle">Two horizontal timelines stacked vertically. The top timeline, labeled Default habit, shows scattered small notification icons spread irregularly across the full 24-hour span, representing continuous unscheduled checking. The bottom timeline, labeled Deliberate habit, shows just two fixed check-in blocks, one in the morning and one in the evening, with the rest of the day clear</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="40" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#B5493A">Default habit (algorithm-driven, open-ended)</text>
  <line x1="40" y1="65" x2="740" y2="65" stroke="#2C4A3E" stroke-width="2"/>
  <text x="40" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">12am</text>
  <text x="720" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">12am</text>
  <g fill="#B5493A">
    <circle cx="95" cy="65" r="6"/>
    <circle cx="160" cy="65" r="6"/>
    <circle cx="205" cy="65" r="6"/>
    <circle cx="280" cy="65" r="6"/>
    <circle cx="340" cy="65" r="6"/>
    <circle cx="410" cy="65" r="6"/>
    <circle cx="470" cy="65" r="6"/>
    <circle cx="520" cy="65" r="6"/>
    <circle cx="590" cy="65" r="6"/>
    <circle cx="650" cy="65" r="6"/>
    <circle cx="700" cy="65" r="6"/>
  </g>
  <text x="390" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Notifications scattered unpredictably across the whole day</text>

  <text x="40" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2C4A3E">Deliberate habit (fixed sources, scheduled)</text>
  <line x1="40" y1="185" x2="740" y2="185" stroke="#2C4A3E" stroke-width="2"/>
  <text x="40" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">12am</text>
  <text x="720" y="202" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">12am</text>
  <rect x="140" y="171" width="60" height="28" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <rect x="540" y="171" width="60" height="28" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="390" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Two fixed, bounded check-ins — morning and evening — rest of day clear</text>
</svg>
