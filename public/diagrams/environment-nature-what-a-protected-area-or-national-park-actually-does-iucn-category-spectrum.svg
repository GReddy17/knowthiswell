<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iucnSpectrumTitle">
  <title id="iucnSpectrumTitle">A horizontal spectrum bar with seven segments labeled Ia, Ib, II, III, IV, V, and VI, shaded from dark green on the left (strict nature reserve, almost no human access) to light tan on the right (managed resource protected area, regulated extraction allowed), with icons showing decreasing restriction from left to right</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="390" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Strictest access</text>
  <text x="390" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#4A443C"> </text>

  <!-- 7 segments -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="30" y="60" width="100" height="60" fill="#1F3B2C" stroke="#2C4A3E" stroke-width="2"/>
    <text x="80" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#FBF8F1">Ia</text>

    <rect x="130" y="60" width="100" height="60" fill="#2C4A3E" stroke="#2C4A3E" stroke-width="2"/>
    <text x="180" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#FBF8F1">Ib</text>

    <rect x="230" y="60" width="100" height="60" fill="#3F6152" stroke="#2C4A3E" stroke-width="2"/>
    <text x="280" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#FBF8F1">II</text>

    <rect x="330" y="60" width="90" height="60" fill="#6E8B7C" stroke="#2C4A3E" stroke-width="2"/>
    <text x="375" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">III</text>

    <rect x="420" y="60" width="90" height="60" fill="#9CAE95" stroke="#2C4A3E" stroke-width="2"/>
    <text x="465" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">IV</text>

    <rect x="510" y="60" width="100" height="60" fill="#C9BE9A" stroke="#2C4A3E" stroke-width="2"/>
    <text x="560" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">V</text>

    <rect x="610" y="60" width="140" height="60" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="680" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">VI</text>
  </g>

  <text x="80" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Strict nature reserve</text>
  <text x="180" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Wilderness area</text>
  <text x="280" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">National park</text>
  <text x="375" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Natural</text>
  <text x="375" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">monument</text>
  <text x="465" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Habitat/species</text>
  <text x="465" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">management</text>
  <text x="560" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Protected</text>
  <text x="560" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">landscape</text>
  <text x="680" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Managed resource</text>
  <text x="680" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">protected area</text>

  <line x1="30" y1="180" x2="750" y2="180" stroke="#B5493A" stroke-width="2"/>
  <polygon points="750,175 762,180 750,185" fill="#B5493A"/>
  <text x="30" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Almost no human access</text>
  <text x="750" y="200" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Regulated extraction allowed</text>

  <text x="390" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">All seven categories are legally binding — the difference is how much human activity each one permits.</text>
</svg>
