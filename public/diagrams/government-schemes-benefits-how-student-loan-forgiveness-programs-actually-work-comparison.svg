<svg viewBox="0 0 560 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slfTitle">
  <title id="slfTitle">Four routes to U.S. federal student loan forgiveness as of September 2026: PSLF, income-driven repayment, Teacher Loan Forgiveness, and discharges, compared by trigger, cap and federal tax treatment.</title>
  <rect width="560" height="470" fill="#FBF8F1"/>
  <text x="280" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Four routes to federal student loan forgiveness</text>
  <text x="280" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">U.S. federal loans only, as of September 2026</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="20" y="64" width="254" height="176" rx="6" fill="#2C4A3E"/>
    <text x="34" y="88" font-size="13" font-weight="700" fill="#FBF8F1">1. Public Service (PSLF)</text>
    <text x="34" y="112" font-size="11" fill="#FBF8F1">Trigger: 120 qualifying payments</text>
    <text x="34" y="128" font-size="11" fill="#FBF8F1">while full-time in government or</text>
    <text x="34" y="144" font-size="11" fill="#FBF8F1">a qualifying nonprofit</text>
    <text x="34" y="168" font-size="11" fill="#FBF8F1">Loans: Direct Loans</text>
    <text x="34" y="192" font-size="11" fill="#FBF8F1">Cap: none (remaining balance)</text>
    <text x="34" y="216" font-size="11" font-weight="700" fill="#FBF8F1">Federal tax: not taxable</text>

    <rect x="286" y="64" width="254" height="176" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="300" y="88" font-size="13" font-weight="700" fill="#1F1B16">2. Income-driven repayment</text>
    <text x="300" y="112" font-size="11" fill="#1F1B16">Trigger: time on the plan</text>
    <text x="300" y="128" font-size="11" fill="#1F1B16">20 or 25 years (IBR, PAYE, ICR)</text>
    <text x="300" y="144" font-size="11" fill="#1F1B16">30 years (RAP, from July 2026)</text>
    <text x="300" y="168" font-size="11" fill="#1F1B16">Payment: a share of income</text>
    <text x="300" y="192" font-size="11" fill="#1F1B16">Cap: none (remaining balance)</text>
    <text x="300" y="216" font-size="11" font-weight="700" fill="#8B6F4E">Federal tax: generally taxable after 2025</text>

    <rect x="20" y="252" width="254" height="160" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="34" y="276" font-size="13" font-weight="700" fill="#1F1B16">3. Teacher Loan Forgiveness</text>
    <text x="34" y="300" font-size="11" fill="#1F1B16">Trigger: 5 complete, consecutive</text>
    <text x="34" y="316" font-size="11" fill="#1F1B16">years full-time at a qualifying</text>
    <text x="34" y="332" font-size="11" fill="#1F1B16">low-income school</text>
    <text x="34" y="356" font-size="11" fill="#1F1B16">Cap: up to $17,500 (math, science,</text>
    <text x="34" y="372" font-size="11" fill="#1F1B16">special ed) or up to $5,000</text>
    <text x="34" y="396" font-size="11" font-weight="700" fill="#1F1B16">Same years can&#x27;t also count for PSLF</text>

    <rect x="286" y="252" width="254" height="160" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="300" y="276" font-size="13" font-weight="700" fill="#1F1B16">4. Discharges (event-based)</text>
    <text x="300" y="300" font-size="11" fill="#1F1B16">Total and permanent disability</text>
    <text x="300" y="316" font-size="11" fill="#1F1B16">Death of the borrower</text>
    <text x="300" y="332" font-size="11" fill="#1F1B16">School closed, or misled you</text>
    <text x="300" y="348" font-size="11" fill="#1F1B16">(closed school, borrower defense)</text>
    <text x="300" y="372" font-size="11" fill="#1F1B16">Cap: none</text>
    <text x="300" y="396" font-size="11" font-weight="700" fill="#1F1B16">Death/disability: not taxable</text>
  </g>
  <text x="280" y="442" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Private loans don&#x27;t qualify. Rules change; confirm on StudentAid.gov or with your servicer.</text>
</svg>
