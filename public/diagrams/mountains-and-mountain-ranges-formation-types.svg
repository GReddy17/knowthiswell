<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mtnFormationTitle">
  <title id="mtnFormationTitle">Three cross-section diagrams showing fold, fault-block, and volcanic mountain formation</title>
  <rect width="640" height="320" fill="#FBF8F1"/>

  <!-- Fold mountains -->
  <g>
    <text x="105" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Fold</text>
    <rect x="20" y="200" width="170" height="60" fill="#EDE7D8"/>
    <path d="M 20,200 Q 55,150 80,190 Q 105,140 130,190 Q 155,150 190,200 Z" fill="#2C4A3E" opacity="0.85"/>
    <path d="M 0,205 L 60,205" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 210,205 L 150,205" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Fault-block mountains -->
  <g>
    <text x="320" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Fault-block</text>
    <rect x="235" y="220" width="80" height="40" fill="#EDE7D8"/>
    <rect x="315" y="150" width="80" height="110" fill="#2C4A3E" opacity="0.85"/>
    <line x1="315" y1="150" x2="315" y2="260" stroke="#C9412C" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M 355,140 L 355,120" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Volcanic mountain -->
  <g>
    <text x="530" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Volcanic</text>
    <rect x="440" y="230" width="180" height="30" fill="#EDE7D8"/>
    <path d="M 460,230 L 530,110 L 600,230 Z" fill="#2C4A3E" opacity="0.85"/>
    <path d="M 520,150 L 540,150 L 530,110 Z" fill="#C9412C"/>
    <circle cx="530" cy="245" r="12" fill="#C9412C" opacity="0.6"/>
    <text x="530" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">magma chamber</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/>
    </marker>
  </defs>

  <text x="105" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">crust compressed and folded</text>
  <text x="320" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">block lifted along a fault</text>
  <text x="530" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">built from erupted material</text>
</svg>
