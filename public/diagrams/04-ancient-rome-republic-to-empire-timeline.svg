<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of Rome from its founding in 753 BCE through the Republic, Julius Caesar, the start of the Empire under Augustus, the Pax Romana, and the fall of the Western Empire in 476 CE</title>
  <rect width="680" height="240" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="120" width="90" height="40" fill="#EDE7D8"/>
    <text x="85" y="105" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Kingdom</text>
    <text x="85" y="180" text-anchor="middle" font-size="10.5" fill="#8B6F4E">founded 753 BCE</text>

    <rect x="130" y="120" width="230" height="40" fill="#EEF3EE"/>
    <text x="245" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Roman Republic</text>
    <text x="245" y="180" text-anchor="middle" font-size="10.5" fill="#8B6F4E">509 BCE →</text>
    <text x="245" y="150" text-anchor="middle" font-size="9.5" fill="#4A443C">Caesar: Rubicon 49 BCE, assassinated 44 BCE</text>

    <rect x="360" y="120" width="280" height="40" fill="#FBEDEA"/>
    <text x="500" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Roman Empire</text>
    <text x="500" y="180" text-anchor="middle" font-size="10.5" fill="#8B6F4E">Augustus, 27 BCE →</text>
    <text x="500" y="150" text-anchor="middle" font-size="9.5" fill="#4A443C">Pax Romana 27 BCE–180 CE · West falls 476 CE</text>
  </g>
  <rect x="40" y="120" width="600" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="130" y1="120" x2="130" y2="160" stroke="#1F1B16"/>
  <line x1="360" y1="120" x2="360" y2="160" stroke="#1F1B16"/>
  <text x="340" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" fill="#8B6F4E">The Eastern (Byzantine) half outlived the Western Empire's fall by another thousand years</text>
  <text x="340" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Western Empire falls 476 CE — Eastern Empire continues to 1453 CE</text>
</svg>
