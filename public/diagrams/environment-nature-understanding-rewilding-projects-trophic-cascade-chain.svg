<svg viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cascadeTitle">
  <title id="cascadeTitle">A horizontal chain of five boxes connected by arrows: wolves reintroduced, then elk behavior changes (avoid open streambanks), then streamside vegetation recovers, then riverbanks stabilize, then beaver and songbird populations increase</title>
  <rect width="820" height="220" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- boxes -->
    <rect x="15" y="70" width="140" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="85" y="105" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">Wolves</text>
    <text x="85" y="123" text-anchor="middle" font-size="11.5" fill="#4A443C">reintroduced</text>

    <rect x="175" y="70" width="140" height="80" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="245" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">Elk avoid</text>
    <text x="245" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">open streambanks</text>

    <rect x="335" y="70" width="140" height="80" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="405" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">Streamside</text>
    <text x="405" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">vegetation recovers</text>

    <rect x="495" y="70" width="140" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="565" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">Riverbanks</text>
    <text x="565" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F1B16">stabilize</text>

    <rect x="655" y="70" width="150" height="80" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2.5"/>
    <text x="730" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Beaver &amp; songbird</text>
    <text x="730" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">populations increase</text>

    <!-- arrows -->
    <path d="M158 110 L172 110" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M318 110 L332 110" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M478 110 L492 110" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M638 110 L652 110" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <text x="410" y="190" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each step is an indirect effect — wolves never touch the riverbank directly.</text>
</svg>
