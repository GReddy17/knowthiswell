<svg viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shTitle">
  <title id="shTitle">Side hustle versus business across five questions. Income engine: your hours times your rate versus a system that earns beyond your hours. Customers: friends and platforms versus a repeatable channel with known cost. Numbers: revenue only versus unit economics and true hourly profit. Money: mixed with personal versus separate account and books. Without you for a week: income stops versus work continues. To the IRS both are businesses if run for profit.</title>
  <rect width="680" height="370" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1F1B16">Side hustle or business? Five questions</text>

    <rect x="200" y="44" width="230" height="32" rx="6" fill="#8B6F4E"/>
    <text x="315" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Side hustle</text>
    <rect x="440" y="44" width="230" height="32" rx="6" fill="#2C4A3E"/>
    <text x="555" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Business</text>

    <text x="14" y="104" font-size="12" font-weight="700" fill="#1F1B16">Income engine</text>
    <text x="315" y="104" text-anchor="middle" font-size="11" fill="#1F1B16">your hours × your rate</text>
    <text x="555" y="104" text-anchor="middle" font-size="11" fill="#1F1B16">a system that earns beyond your hours</text>
    <line x1="14" y1="120" x2="670" y2="120" stroke="#D9D2C3"/>

    <text x="14" y="146" font-size="12" font-weight="700" fill="#1F1B16">Customers</text>
    <text x="315" y="146" text-anchor="middle" font-size="11" fill="#1F1B16">friends, referrals, one platform</text>
    <text x="555" y="146" text-anchor="middle" font-size="11" fill="#1F1B16">a repeatable channel with a known cost</text>
    <line x1="14" y1="162" x2="670" y2="162" stroke="#D9D2C3"/>

    <text x="14" y="188" font-size="12" font-weight="700" fill="#1F1B16">Numbers you know</text>
    <text x="315" y="188" text-anchor="middle" font-size="11" fill="#1F1B16">revenue</text>
    <text x="555" y="188" text-anchor="middle" font-size="11" fill="#1F1B16">profit per sale and per hour</text>
    <line x1="14" y1="204" x2="670" y2="204" stroke="#D9D2C3"/>

    <text x="14" y="230" font-size="12" font-weight="700" fill="#1F1B16">Money and records</text>
    <text x="315" y="230" text-anchor="middle" font-size="11" fill="#1F1B16">mixed with personal</text>
    <text x="555" y="230" text-anchor="middle" font-size="11" fill="#1F1B16">separate account, monthly books</text>
    <line x1="14" y1="246" x2="670" y2="246" stroke="#D9D2C3"/>

    <text x="14" y="272" font-size="12" font-weight="700" fill="#1F1B16">You're away a week</text>
    <text x="315" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#B5552B">income stops</text>
    <text x="555" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4A3E">work continues</text>

    <rect x="14" y="296" width="656" height="58" rx="8" fill="#FFFFFF" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="342" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">To the IRS, both columns are businesses if run for profit</text>
    <text x="342" y="338" text-anchor="middle" font-size="11" fill="#4A443C">Sole proprietorship by default · self-employment tax on net earnings of $400+ · all income taxable, form or not</text>
  </g>
</svg>
