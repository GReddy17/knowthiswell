<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="respCurveTitle">
  <title id="respCurveTitle">A line graph with time on the horizontal axis and antibody level on the vertical axis, showing a first antigen exposure producing a slow-rising, modest primary response peaking around one to two weeks, followed by a second exposure to the same antigen producing a much faster-rising and higher secondary response, illustrating the effect of immune memory</title>
  <rect width="780" height="340" fill="#FBF8F1"/>

  <!-- axes -->
  <line x1="70" y1="280" x2="740" y2="280" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="70" y1="280" x2="70" y2="30" stroke="#2C4A3E" stroke-width="2"/>
  <text x="405" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Time</text>
  <text x="30" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C" transform="rotate(-90 30 155)">Antibody level</text>

  <!-- primary response curve -->
  <path d="M 90 275 C 160 275, 190 230, 230 210 C 260 195, 290 190, 320 200 C 350 210, 370 240, 390 260" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <rect x="200" y="245" width="120" height="24" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="260" y="261" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Primary response</text>

  <!-- exposure markers -->
  <line x1="90" y1="280" x2="90" y2="60" stroke="#B5493A" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="90" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">1st exposure</text>

  <line x1="420" y1="280" x2="420" y2="60" stroke="#B5493A" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="420" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">2nd exposure</text>

  <!-- secondary response curve -->
  <path d="M 420 260 C 460 230, 480 90, 520 60 C 560 45, 620 45, 690 55" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <rect x="500" y="70" width="150" height="24" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="575" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Secondary response</text>

  <text x="405" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Second exposure produces a faster, higher response than the first — the effect of immune memory.</text>
</svg>
