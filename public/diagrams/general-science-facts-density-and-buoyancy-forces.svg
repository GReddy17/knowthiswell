<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="buoyancyTitle">
  <title id="buoyancyTitle">Three diagrams comparing buoyant force and weight: a floating object where the two forces balance at partial submersion, a sinking object where weight exceeds buoyant force even fully submerged, and a neutrally buoyant submarine where the forces are equal while fully submerged</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- water bodies -->
  <g>
    <rect x="15" y="140" width="190" height="240" fill="#EAF1F5" stroke="#B9CDD8" stroke-width="1"/>
    <rect x="225" y="140" width="190" height="240" fill="#EAF1F5" stroke="#B9CDD8" stroke-width="1"/>
    <rect x="435" y="140" width="190" height="240" fill="#EAF1F5" stroke="#B9CDD8" stroke-width="1"/>
  </g>
  <path d="M 15,140 q 8,-6 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0"
        fill="none" stroke="#7FA5BD" stroke-width="1.5"/>
  <path d="M 225,140 q 8,-6 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0"
        fill="none" stroke="#7FA5BD" stroke-width="1.5"/>
  <path d="M 435,140 q 8,-6 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0 t 16,0"
        fill="none" stroke="#7FA5BD" stroke-width="1.5"/>

  <!-- panel titles -->
  <text x="110" y="122" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Floating</text>
  <text x="320" y="122" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Sinking</text>
  <text x="530" y="122" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Neutral buoyancy</text>

  <!-- panel 1: floating block, half submerged, forces equal -->
  <rect x="75" y="115" width="70" height="70" fill="#EDE0C8" stroke="#8B6F4E" stroke-width="1.5"/>
  <g stroke="#2C4A3E" stroke-width="2.5" fill="none">
    <path d="M 130,150 L 130,90"/>
    <path d="M 130,90 L 124,100 M 130,90 L 136,100"/>
  </g>
  <g stroke="#C9412C" stroke-width="2.5" fill="none">
    <path d="M 90,150 L 90,210"/>
    <path d="M 90,210 L 84,200 M 90,210 L 96,200"/>
  </g>
  <text x="130" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#2C4A3E">Fb</text>
  <text x="90" y="224" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#C9412C">W</text>
  <text x="110" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Fb = W</text>

  <!-- panel 2: sinking rock, fully submerged near bottom, weight wins -->
  <circle cx="320" cy="300" r="30" fill="#8B6F4E" stroke="#4A443C" stroke-width="1.5"/>
  <g stroke="#2C4A3E" stroke-width="2.5" fill="none">
    <path d="M 360,300 L 360,258"/>
    <path d="M 360,258 L 354,268 M 360,258 L 366,268"/>
  </g>
  <g stroke="#C9412C" stroke-width="2.5" fill="none">
    <path d="M 280,300 L 280,373"/>
    <path d="M 280,373 L 274,363 M 280,373 L 286,363"/>
  </g>
  <text x="360" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#2C4A3E">Fb</text>
  <text x="280" y="387" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#C9412C">W</text>
  <text x="320" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Fb &lt; W</text>

  <!-- panel 3: neutrally buoyant submarine, fully submerged, forces equal -->
  <ellipse cx="530" cy="260" rx="48" ry="22" fill="#DCE6EA" stroke="#5B7C99" stroke-width="1.5"/>
  <rect x="519" y="234" width="18" height="20" fill="#DCE6EA" stroke="#5B7C99" stroke-width="1.5"/>
  <g stroke="#2C4A3E" stroke-width="2.5" fill="none">
    <path d="M 570,260 L 570,200"/>
    <path d="M 570,200 L 564,210 M 570,200 L 576,210"/>
  </g>
  <g stroke="#C9412C" stroke-width="2.5" fill="none">
    <path d="M 490,260 L 490,320"/>
    <path d="M 490,320 L 484,310 M 490,320 L 496,310"/>
  </g>
  <text x="570" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#2C4A3E">Fb</text>
  <text x="490" y="334" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#C9412C">W</text>
  <text x="530" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Fb = W (submerged)</text>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">
    <line x1="15" y1="30" x2="35" y2="30" stroke="#2C4A3E" stroke-width="2.5"/>
    <text x="40" y="34">Fb = buoyant force (up)</text>
    <line x1="220" y1="30" x2="240" y2="30" stroke="#C9412C" stroke-width="2.5"/>
    <text x="245" y="34">W = weight (down)</text>
  </g>
</svg>
