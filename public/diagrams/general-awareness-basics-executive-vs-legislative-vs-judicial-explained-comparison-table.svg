<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="branchTableTitle">
  <title id="branchTableTitle">A three-column comparison table. Column headers: Legislative, Executive, Judicial. Rows: Function (writes laws / enforces laws / interprets laws), Selection (directly elected / elected head, appointed staff / nominated and confirmed), Typical term (2-6 years / 4-5 years, renewable / long fixed term or life).</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="20" y="20" width="220" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <rect x="240" y="20" width="180" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <rect x="420" y="20" width="180" height="50" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <rect x="600" y="20" width="160" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="330" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Legislative</text>
  <text x="510" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Executive</text>
  <text x="680" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Judicial</text>

  <rect x="20" y="70" width="220" height="80" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="30" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Function</text>
  <rect x="240" y="70" width="180" height="80" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="250" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Writes laws</text>
  <rect x="420" y="70" width="180" height="80" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="430" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Enforces laws</text>
  <rect x="600" y="70" width="160" height="80" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="610" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Interprets laws</text>

  <rect x="20" y="150" width="220" height="80" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="30" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Selection</text>
  <rect x="240" y="150" width="180" height="80" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="250" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Directly elected</text>
  <rect x="420" y="150" width="180" height="80" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="430" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Head elected,</text>
  <text x="430" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">staff appointed</text>
  <rect x="600" y="150" width="160" height="80" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="610" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Nominated</text>
  <text x="610" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">and confirmed</text>

  <rect x="20" y="230" width="220" height="70" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="30" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Typical term</text>
  <rect x="240" y="230" width="180" height="70" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="250" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">2-6 years</text>
  <rect x="420" y="230" width="180" height="70" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="430" y="260" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">4-5 yrs, renewable</text>
  <rect x="600" y="230" width="160" height="70" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.2"/>
  <text x="610" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Long fixed term</text>
  <text x="610" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">or life</text>
</svg>
