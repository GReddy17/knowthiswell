<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cognitiveLoadTitle">
  <title id="cognitiveLoadTitle">Working memory has a limited number of slots. As task demands fill those slots, added load pushes capacity past its limit, and decision quality drops as the brain shifts to quick mental shortcuts.</title>
  <rect width="560" height="320" fill="#FBF8F1"/>
  <text x="280" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Working memory — limited slots</text>
  <rect x="60" y="50" width="55" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="125" y="50" width="55" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="190" y="50" width="55" height="55" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <rect x="255" y="50" width="55" height="55" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <rect x="320" y="50" width="55" height="55" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <rect x="385" y="50" width="55" height="55" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="250" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">slots filling with task demands →</text>
  <text x="280" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#C9412C">↓ capacity exceeded</text>
  <rect x="130" y="165" width="300" height="60" rx="6" fill="#C9412C"/>
  <text x="280" y="190" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Overload</text>
  <text x="280" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#FBF8F1">brain shifts to fast mental shortcuts</text>
  <text x="280" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1F1B16">↓</text>
  <rect x="130" y="265" width="300" height="46" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="293" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Decision quality drops</text>
</svg>
