<svg viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phiCmpTitle">
  <title id="phiCmpTitle">Medicare versus Medicaid and CHIP. Medicare is based on age 65 and older or disability, is one federal program with the same rules nationwide, and has set enrollment windows with late penalties. Medicaid and CHIP are based on income, run by each state so rules vary, and accept applications any time of year. Some people qualify for both.</title>
  <rect width="560" height="290" fill="#FBF8F1"/>
  <text x="150" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Medicare</text>
  <rect x="40" y="46" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="67" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Based on age 65+</text>
  <text x="150" y="83" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">or disability</text>
  <rect x="40" y="104" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">One federal program,</text>
  <text x="150" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">same rules nationwide</text>
  <rect x="40" y="162" width="220" height="50" rx="6" fill="#2C4A3E"/>
  <text x="150" y="183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Set sign-up windows;</text>
  <text x="150" y="199" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">late penalties</text>
  <text x="410" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8B6F4E">Medicaid and CHIP</text>
  <rect x="300" y="46" width="220" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="410" y="67" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Based on income</text>
  <text x="410" y="83" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(CHIP: children)</text>
  <rect x="300" y="104" width="220" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="410" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Run by each state,</text>
  <text x="410" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">so rules vary</text>
  <rect x="300" y="162" width="220" height="50" rx="6" fill="#8B6F4E"/>
  <text x="410" y="183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Apply any time</text>
  <text x="410" y="199" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">of year</text>
  <line x1="280" y1="46" x2="280" y2="212" stroke="#E3DCC9" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="280" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Medicare is about age; Medicaid is about income.</text>
  <text x="280" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Dual eligibles qualify for both.</text>
</svg>
