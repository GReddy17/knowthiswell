<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="latReadTitle">
  <title id="latReadTitle">A flow diagram showing a suspicious article on the left with a question mark, an arrow pointing away from it labeled "open new tabs" leading to three small boxes representing independent searches — the publisher's reputation, the claim itself, and a reverse image search — which converge into a final decision box on the right reading trust, verify further, or discard.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>

  <rect x="20" y="100" width="130" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Suspicious</text>
  <text x="85" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">article</text>
  <text x="85" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#B5493A">?</text>

  <text x="205" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">open new tabs</text>
  <line x1="152" y1="145" x2="255" y2="145" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="262" y="40" width="140" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="332" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Publisher</text>
  <text x="332" y="79" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">reputation</text>

  <rect x="262" y="118" width="140" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="332" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Claim</text>
  <text x="332" y="157" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">confirmed elsewhere</text>

  <rect x="262" y="196" width="140" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="332" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Reverse</text>
  <text x="332" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">image search</text>

  <line x1="402" y1="67" x2="470" y2="140" stroke="#2C4A3E" stroke-width="1.4"/>
  <line x1="402" y1="145" x2="470" y2="140" stroke="#2C4A3E" stroke-width="1.4"/>
  <line x1="402" y1="223" x2="470" y2="140" stroke="#2C4A3E" stroke-width="1.4"/>

  <text x="440" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">=</text>

  <rect x="500" y="90" width="260" height="100" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="630" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Trust / Verify further /</text>
  <text x="630" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Discard</text>
  <text x="630" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">decided off the original page</text>
</svg>
