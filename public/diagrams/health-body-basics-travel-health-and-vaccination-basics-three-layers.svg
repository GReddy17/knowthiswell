<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="travelLayersTitle">
  <title id="travelLayersTitle">Three stacked layers: the base layer labeled routine vaccines already current for everyone, a middle layer labeled destination-specific recommended vaccines and precautions based on real local disease risk, and a top layer labeled entry-required vaccines such as yellow fever for specific countries, illustrating how travel health planning builds on top of a person's existing routine vaccination status</title>
  <rect width="640" height="320" fill="#FBF8F1"/>

  <!-- base layer -->
  <rect x="70" y="220" width="500" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Routine vaccines</text>
  <text x="320" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">already current for everyone (MMR, tetanus, etc.)</text>

  <!-- middle layer -->
  <rect x="110" y="130" width="420" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Destination-specific vaccines</text>
  <text x="320" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">recommended based on real local disease risk</text>

  <!-- top layer -->
  <rect x="160" y="40" width="320" height="70" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="320" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Entry-required vaccines</text>
  <text x="320" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">e.g. yellow fever, for specific countries</text>

  <text x="320" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each layer builds on the one below it — confirm the base before adding destination-specific layers.</text>
</svg>
