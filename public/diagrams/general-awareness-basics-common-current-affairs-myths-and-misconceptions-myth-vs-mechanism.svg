<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mythMechTitle">
  <title id="mythMechTitle">A two-column comparison chart. The left column, labeled Common Myth, lists three short claims: UN has its own army, my vote decides each law, sanctions punish leaders. The right column, labeled Actual Mechanism, lists the corresponding accurate descriptions: member states voluntarily contribute peacekeeping troops under a UN mandate, citizens elect representatives who vote on individual bills, broad sanctions affect the general economy more than insulated leadership</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="200" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#B5493A">Common Myth</text>
  <text x="580" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">Actual Mechanism</text>
  <line x1="390" y1="15" x2="390" y2="305" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Row 1 -->
  <rect x="20" y="55" width="360" height="66" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="93" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">&quot;The UN has its own army&quot;</text>
  <rect x="400" y="55" width="360" height="66" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="83" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Member states voluntarily contribute</text>
  <text x="580" y="101" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">troops under a UN mandate</text>

  <!-- Row 2 -->
  <rect x="20" y="131" width="360" height="66" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">&quot;My vote decides each law&quot;</text>
  <rect x="400" y="131" width="360" height="66" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="159" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Citizens elect representatives who</text>
  <text x="580" y="177" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">vote on individual bills</text>

  <!-- Row 3 -->
  <rect x="20" y="207" width="360" height="66" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">&quot;Sanctions punish leaders&quot;</text>
  <rect x="400" y="207" width="360" height="66" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Broad sanctions hit the general economy</text>
  <text x="580" y="253" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">more than insulated leadership</text>

  <text x="390" y="305" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Each myth compresses a multi-step institutional process into a single simple actor.</text>
</svg>
