<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reforestTitle">
  <title id="reforestTitle">A timeline graph with two lines rising from year zero to year eighty: a steeper line labeled tree canopy cover reaches near-maximum by year fifteen, while a slower, more gradual line labeled forest ecosystem function (biodiversity, soil carbon, structure) is still well below the original old-growth baseline even at year eighty</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <!-- axes -->
  <line x1="70" y1="260" x2="740" y2="260" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="70" y1="30" x2="70" y2="260" stroke="#2C4A3E" stroke-width="2"/>
  <text x="405" y="295" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Years since replanting</text>
  <text x="30" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C" transform="rotate(-90 30 150)">Recovery (% of old-growth baseline)</text>

  <!-- old-growth baseline -->
  <line x1="70" y1="45" x2="740" y2="45" stroke="#B5B0A3" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="650" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Old-growth baseline</text>

  <!-- canopy cover curve (fast) -->
  <path d="M70 260 C 150 150, 220 60, 330 50 C 450 46, 600 45, 740 45" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="360" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Tree canopy cover</text>

  <!-- ecosystem function curve (slow) -->
  <path d="M70 260 C 250 250, 400 210, 550 160 C 640 130, 700 110, 740 100" fill="none" stroke="#B5493A" stroke-width="2.5"/>
  <text x="500" y="190" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5493A">Forest ecosystem function</text>
  <text x="500" y="205" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">(biodiversity, soil carbon, structure)</text>

  <!-- year labels -->
  <text x="70" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">0</text>
  <text x="330" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">15</text>
  <text x="740" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">80</text>
</svg>
