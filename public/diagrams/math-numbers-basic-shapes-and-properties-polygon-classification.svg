<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="polyClassTitle">
  <title id="polyClassTitle">A grid comparing polygons by side count (triangle, quadrilateral, pentagon, hexagon) across two rows: regular versions with equal sides and angles marked, and irregular versions of the same side count with unequal sides and angles marked, plus one concave example with a reflex angle highlighted</title>
  <rect width="640" height="460" fill="#FBF8F1"/>

  <text x="110" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4A443C">Triangle</text>
  <text x="260" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4A443C">Quadrilateral</text>
  <text x="410" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4A443C">Pentagon</text>
  <text x="560" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4A443C">Hexagon</text>

  <text x="15" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Regular</text>
  <text x="15" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">equal sides</text>
  <text x="15" y="131" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">&amp; angles</text>

  <!-- Row 1: regular polygons -->
  <polygon points="110,65 149,132.5 71,132.5" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <polygon points="228,78 292,78 292,142 228,142" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <polygon points="410,68 449.9,97 434.7,144 385.3,144 370.1,97" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <polygon points="560,68 596.4,89 596.4,131 560,152 523.6,131 523.6,89" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>

  <text x="15" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C9412C">Irregular</text>
  <text x="15" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">unequal sides</text>
  <text x="15" y="279" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">&amp; angles</text>

  <!-- Row 2: irregular polygons -->
  <polygon points="95,208 155,235 120,292" fill="#F6F0E8" stroke="#C9412C" stroke-width="2"/>
  <polygon points="225,215 300,205 295,270 230,290" fill="#F6F0E8" stroke="#C9412C" stroke-width="2"/>
  <polygon points="400,205 445,220 440,270 395,290 370,240" fill="#F6F0E8" stroke="#C9412C" stroke-width="2"/>
  <polygon points="545,205 590,210 605,245 585,285 545,290 520,250" fill="#F6F0E8" stroke="#C9412C" stroke-width="2"/>

  <line x1="10" y1="325" x2="630" y2="325" stroke="#E3DCC9" stroke-width="1.5"/>

  <text x="15" y="358" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4A443C">Concave</text>
  <text x="15" y="371" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">one interior</text>
  <text x="15" y="382" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">angle &gt; 180&#176;</text>

  <!-- concave dart quadrilateral -->
  <polygon points="320,355 360,395 320,382 280,395" fill="#EDE7D8" stroke="#1F1B16" stroke-width="2"/>
  <path d="M 335,388 Q 320,398 305,388" fill="none" stroke="#C9412C" stroke-width="2"/>
  <circle cx="320" cy="382" r="3" fill="#C9412C"/>
  <text x="320" y="418" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#C9412C">reflex angle (&gt; 180&#176;) at the notch</text>
  <text x="320" y="435" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">still a simple 4-sided polygon &#8212; just not convex</text>
</svg>
