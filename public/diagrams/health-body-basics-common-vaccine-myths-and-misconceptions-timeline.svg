<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vaccineMythTimelineTitle">
  <title id="vaccineMythTimelineTitle">A horizontal timeline showing 1998: Wakefield publishes a 12-child study suggesting a vaccine-autism link, followed by 2004 to 2010: investigative journalism and regulatory review uncover data manipulation and undisclosed financial conflicts, 2010: The Lancet formally retracts the paper and Wakefield loses his medical license, and 2013 to 2019: multiple large cohort studies, including one following over 650,000 children, specifically re-test the claim and find no link</title>
  <rect width="800" height="220" fill="#FBF8F1"/>

  <line x1="50" y1="110" x2="750" y2="110" stroke="#2C4A3E" stroke-width="2"/>

  <circle cx="100" cy="110" r="7" fill="#B5493A"/>
  <text x="100" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1998</text>
  <text x="100" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C" width="140">Wakefield publishes</text>
  <text x="100" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">12-child study</text>

  <circle cx="300" cy="110" r="7" fill="#4A443C"/>
  <text x="300" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">2004-2010</text>
  <text x="300" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Investigation finds</text>
  <text x="300" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">manipulated data</text>

  <circle cx="500" cy="110" r="7" fill="#2C4A3E"/>
  <text x="500" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">2010</text>
  <text x="500" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Lancet retracts paper,</text>
  <text x="500" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">license revoked</text>

  <circle cx="700" cy="110" r="7" fill="#2C4A3E"/>
  <text x="700" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">2013-2019</text>
  <text x="700" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">650,000+ child studies</text>
  <text x="700" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">find no link</text>

  <text x="400" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each stage above is a documented, publicly verifiable event.</text>
</svg>
