<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hubTopologyTitle">
  <title id="hubTopologyTitle">A topology diagram showing several smart devices on the left speaking different low-power wireless protocols (Zigbee, Z-Wave, Thread), each with an arrow into a central box labeled Smart Home Hub, which is shown translating them into one common language, then connecting out to a Wi-Fi router and, from there, to a phone app and the internet, illustrating that a hub's job is protocol translation, not just Wi-Fi relay.</title>
  <rect width="800" height="340" fill="#FBF8F1"/>

  <defs>
    <marker id="arrowHub" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="120" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5" rx="4"/>
  <text x="80" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Bulb</text>
  <text x="80" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">(Zigbee)</text>

  <rect x="20" y="145" width="120" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5" rx="4"/>
  <text x="80" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Door lock</text>
  <text x="80" y="179" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">(Z-Wave)</text>

  <rect x="20" y="250" width="120" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5" rx="4"/>
  <text x="80" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Sensor</text>
  <text x="80" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">(Thread)</text>

  <path d="M140,65 L285,150" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHub)"/>
  <path d="M140,170 L285,170" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHub)"/>
  <path d="M140,275 L285,190" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHub)"/>

  <rect x="290" y="115" width="150" height="110" fill="#F2ECE0" stroke="#B5493A" stroke-width="2" rx="4"/>
  <text x="365" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Smart Home Hub</text>
  <text x="365" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">translates each protocol</text>
  <text x="365" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">into one common</text>
  <text x="365" y="191" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">language, then routes</text>
  <text x="365" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">commands both ways</text>

  <path d="M440,170 L525,170" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowHub)"/>

  <rect x="530" y="145" width="110" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5" rx="4"/>
  <text x="585" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Wi-Fi router</text>
  <text x="585" y="179" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">(home network)</text>

  <path d="M640,170 L715,170" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowHub)"/>

  <rect x="670" y="60" width="100" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5" rx="4"/>
  <text x="720" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Phone app</text>
  <text x="720" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">(anywhere)</text>
  <path d="M720,145 L720,113" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHub)"/>

  <ellipse cx="720" cy="240" rx="50" ry="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="720" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">internet</text>
  <path d="M660,205 L695,215" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHub)"/>

  <text x="400" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">A hub's core job is translating between protocols a router can't speak — not just Wi-Fi.</text>
</svg>
