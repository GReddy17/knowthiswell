<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="680" height="240" fill="#FBF8F1"/>
  <rect x="20" y="30" width="150" height="70" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="95" y="58" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">Triggering event:</text>
  <text x="95" y="73" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">parent death/incapacity,</text>
  <text x="95" y="88" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">or adult found incapacitated</text>

  <path d="M170 65 H200" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="200" y="30" width="150" height="70" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="275" y="58" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">Documented preference</text>
  <text x="275" y="73" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">(nomination or POA),</text>
  <text x="275" y="88" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">or none on file</text>

  <path d="M350 65 H380" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="380" y="30" width="150" height="70" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="455" y="58" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">Court hearing &amp;</text>
  <text x="455" y="73" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">evaluation</text>

  <path d="M530 65 H560" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="560" y="30" width="105" height="70" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="612" y="58" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">Court-appointed</text>
  <text x="612" y="73" text-anchor="middle" font-size="10" fill="#1F1B16" font-weight="600">guardian</text>

  <rect x="20" y="140" width="640" height="60" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="340" y="165" text-anchor="middle" font-size="11" fill="#4A443C">A documented preference influences the court's decision and can speed up the</text>
  <text x="340" y="183" text-anchor="middle" font-size="11" fill="#4A443C">process — but the court hearing step is required in every path, with or without one.</text>

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
