<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="signalNoiseTitle">
  <title id="signalNoiseTitle">A diagram showing job satisfaction sampled over time as a line with a brief temporary dip that reverts back to a stable trend, labeled as noise, next to a persistent downward gap that does not revert across multiple review cycles despite an attempted fix while staying, labeled as a real signal to change jobs.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="390" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Reading job satisfaction over time</text>

  <line x1="50" y1="220" x2="740" y2="220" stroke="#4A443C" stroke-width="1.5"/>

  <path d="M50,110 L200,110 L235,175 L270,110 L420,110" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <circle cx="235" cy="175" r="5" fill="#2C4A3E"/>
  <text x="235" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2C4A3E">rough week</text>
  <text x="235" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">Noise — reverts</text>

  <path d="M440,110 L470,110 L560,150 L650,182 L730,182" fill="none" stroke="#8B6F4E" stroke-width="2.5"/>
  <circle cx="560" cy="150" r="5" fill="#8B6F4E"/>
  <text x="560" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">tried to fix, staying</text>
  <line x1="560" y1="155" x2="560" y2="220" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="650" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#8B6F4E">Signal — persists</text>

  <text x="390" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">A dip that reverts is noise; a gap that survives a real attempt to fix it is a signal.</text>
</svg>
