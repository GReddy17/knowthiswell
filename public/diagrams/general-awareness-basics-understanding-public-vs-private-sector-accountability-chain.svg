<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pubPrivTitle">
  <title id="pubPrivTitle">Two parallel flow diagrams. The top flow, labeled Public Sector, shows Taxes to Government Budget to Public Service, with an accountability arrow looping back through Elections. The bottom flow, labeled Private Sector, shows Customer Payment to Company Revenue to Private Service, with an accountability arrow looping back through Competition/Profit.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>

  <text x="40" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Public Sector</text>
  <rect x="40" y="58" width="140" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Taxes</text>
  <text x="195" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">→</text>
  <rect x="215" y="58" width="160" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="295" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Government Budget</text>
  <text x="390" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">→</text>
  <rect x="410" y="58" width="160" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="490" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Public Service</text>
  <path d="M 490 113 Q 490 150 300 150 Q 110 150 110 113" fill="none" stroke="#B5493A" stroke-width="1.8" marker-end="url(#arrow1)"/>
  <text x="300" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#B5493A">accountable through: Elections</text>

  <text x="40" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Private Sector</text>
  <rect x="40" y="198" width="140" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Customer Payment</text>
  <text x="195" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">→</text>
  <rect x="215" y="198" width="160" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="295" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Company Revenue</text>
  <text x="390" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">→</text>
  <rect x="410" y="198" width="160" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="490" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Private Service</text>
  <path d="M 490 253 Q 490 270 300 270 Q 110 270 110 253" fill="none" stroke="#B5493A" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="300" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#B5493A">accountable through: Competition / Profit</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B5493A"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#B5493A"/></marker>
  </defs>
</svg>
