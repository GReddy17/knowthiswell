<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="accelAxisTitle">
  <title id="accelAxisTitle">A diagram of a phone with three labeled accelerometer axes, X across the screen, Y up the screen, and Z out of the screen face, with a downward-pointing gravity vector arrow, showing how the phone splits the constant pull of gravity across the X, Y, and Z axes differently depending on how it is tilted, which is how it determines orientation.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Three axes, one constant signal: gravity</text>

  <!-- Phone tilted -->
  <g transform="translate(220,160) rotate(-20)">
    <rect x="-70" y="-130" width="140" height="260" rx="16" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2.5"/>
    <rect x="-58" y="-112" width="116" height="200" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1"/>
    <!-- axes -->
    <line x1="0" y1="0" x2="90" y2="0" stroke="#B5493A" stroke-width="2.5" marker-end="url(#arrowAxRed)"/>
    <text x="100" y="5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A">X</text>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#2C4A3E" stroke-width="2.5" marker-end="url(#arrowAxGreen)"/>
    <text x="-8" y="-108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Y</text>
    <line x1="0" y1="0" x2="-55" y2="55" stroke="#8A6D3B" stroke-width="2.5" marker-end="url(#arrowAxTan)"/>
    <text x="-72" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A6D3B">Z</text>
  </g>
  <defs>
    <marker id="arrowAxRed" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B5493A"/>
    </marker>
    <marker id="arrowAxGreen" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowAxTan" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8A6D3B"/>
    </marker>
  </defs>

  <!-- gravity vector -->
  <line x1="220" y1="60" x2="220" y2="280" stroke="#1F1B16" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGrav)"/>
  <defs>
    <marker id="arrowGrav" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F1B16"/>
    </marker>
  </defs>
  <text x="255" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">gravity (constant, 1g, straight down)</text>

  <!-- readout box -->
  <rect x="470" y="90" width="270" height="150" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="605" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Sensor reads gravity split across axes</text>
  <text x="490" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">X: 0.34g</text>
  <text x="490" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">Y: 0.87g</text>
  <text x="490" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">Z: 0.36g</text>
  <text x="490" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">-&gt; tilt angle calculated from the ratio</text>

  <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Tilt the phone and gravity's share shifts between axes — that shifting ratio is the "which way is up" signal.</text>
</svg>
