<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of dominant Mesopotamian powers from Sumerian city-states around 3500 BCE through the Neo-Babylonian Empire ending with Persian conquest in 539 BCE</title>
  <rect width="680" height="220" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="120" width="150" height="40" fill="#EEF3EE"/>
    <text x="115" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F1B16">Sumerian city-states</text>
    <text x="115" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">c. 3500 BCE</text>

    <rect x="190" y="120" width="130" height="40" fill="#FBEDEA"/>
    <text x="255" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F1B16">Akkadian Empire</text>
    <text x="255" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">c. 2334 BCE (Sargon)</text>

    <rect x="320" y="120" width="120" height="40" fill="#EDE7D8"/>
    <text x="380" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F1B16">Babylonian Empire</text>
    <text x="380" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">c. 1754 BCE (Hammurabi)</text>

    <rect x="440" y="120" width="110" height="40" fill="#EEF3EE"/>
    <text x="495" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F1B16">Assyrian Empire</text>
    <text x="495" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">height c. 700 BCE</text>

    <rect x="550" y="120" width="90" height="40" fill="#FBEDEA"/>
    <text x="595" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Neo-Babylonian</text>
    <text x="595" y="180" text-anchor="middle" font-size="10" fill="#8B6F4E">ends 539 BCE</text>
  </g>
  <rect x="40" y="120" width="600" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="190" y1="120" x2="190" y2="160" stroke="#1F1B16"/>
  <line x1="320" y1="120" x2="320" y2="160" stroke="#1F1B16"/>
  <line x1="440" y1="120" x2="440" y2="160" stroke="#1F1B16"/>
  <line x1="550" y1="120" x2="550" y2="160" stroke="#1F1B16"/>
  <text x="340" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" fill="#8B6F4E">Power shifted between rival Mesopotamian states over 3,000 years</text>
</svg>
