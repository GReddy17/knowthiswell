<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="breachFlowTitle">
  <title id="breachFlowTitle">A flow diagram showing a company's customer database being copied without authorization during a data breach. That copied data, which may include emails, passwords, or personal details, can then be used in two downstream ways: directly, if a password was reused elsewhere, in credential-stuffing attempts against other unrelated sites, and indirectly, using leaked personal details in more convincing targeted phishing messages, even for people whose exposed password was never reused anywhere.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <rect x="30" y="45" width="170" height="60" rx="6" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
  <text x="115" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Company's customer</text>
  <text x="115" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">database</text>

  <defs>
    <marker id="arrowBr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C9412C"/>
    </marker>
    <marker id="arrowBrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M200,75 L290,75" fill="none" stroke="#C9412C" stroke-width="2" marker-end="url(#arrowBr)"/>
  <text x="245" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#C9412C">unauthorized copy</text>

  <rect x="295" y="45" width="180" height="60" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="385" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Exposed data:</text>
  <text x="385" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">email, password hash,</text>
  <text x="385" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">personal details</text>

  <path d="M475,60 L580,60" fill="none" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrowBrG)"/>
  <path d="M475,90 L580,140" fill="none" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrowBrG)"/>

  <rect x="585" y="35" width="185" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="677" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Credential stuffing on</text>
  <text x="677" y="73" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">other sites</text>
  <text x="677" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(only if password reused)</text>

  <rect x="585" y="115" width="185" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="677" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">More convincing</text>
  <text x="677" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">targeted phishing</text>
  <text x="677" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(happens regardless of reuse)</text>

  <text x="400" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Exposure has two separate downstream paths — only one of them depends on password reuse.</text>
</svg>
