<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="refugeeMatrixTitle">
  <title id="refugeeMatrixTitle">A two-by-two style matrix. One axis distinguishes whether an international border was crossed. The other axis distinguishes whether legal refugee status has been formally recognized, pending or granted. The quadrants: crossed a border and pending decision equals asylum seeker; crossed a border and status granted equals refugee; did not cross a border equals internally displaced person regardless of decision status; moved for reasons other than persecution equals migrant, a broader umbrella term sitting outside the matrix</title>
  <rect width="780" height="340" fill="#FBF8F1"/>

  <text x="400" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Crossed an international border?</text>
  <text x="60" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E" transform="rotate(-90 60 180)">Status recognition</text>

  <rect x="160" y="60" width="240" height="110" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="280" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Asylum Seeker</text>
  <text x="280" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">crossed a border,</text>
  <text x="280" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">decision pending</text>

  <rect x="410" y="60" width="240" height="110" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="530" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Refugee</text>
  <text x="530" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">crossed a border,</text>
  <text x="530" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">status granted</text>

  <rect x="160" y="185" width="490" height="90" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="405" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Internally Displaced Person (IDP)</text>
  <text x="405" y="242" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">did not cross a border, regardless of decision status</text>

  <rect x="160" y="290" width="490" height="45" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="405" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Migrant — broader umbrella term for movement not specifically tied to persecution</text>
</svg>
