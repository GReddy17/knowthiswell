<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="starMethodTitle">
  <title id="starMethodTitle">A flow diagram showing the four sequential parts of a STAR interview answer: Situation, Task, Action, and Result, with a note that Action and Result should together take up most of the answer's length.</title>
  <rect width="780" height="220" fill="#FBF8F1"/>

  <rect x="30" y="60" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="105" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">S</text>
  <text x="105" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Situation</text>
  <text x="105" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">brief context</text>

  <line x1="180" y1="100" x2="218" y2="100" stroke="#4A443C" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="220" y="60" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="295" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">T</text>
  <text x="295" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Task</text>
  <text x="295" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">your responsibility</text>

  <line x1="370" y1="100" x2="408" y2="100" stroke="#4A443C" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="410" y="50" width="150" height="100" rx="8" fill="#2C4A3E"/>
  <text x="485" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FBF8F1">A</text>
  <text x="485" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">Action</text>
  <text x="485" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">what YOU did</text>
  <text x="485" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">(most weight)</text>

  <line x1="560" y1="100" x2="598" y2="100" stroke="#4A443C" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="600" y="50" width="150" height="100" rx="8" fill="#8B6F4E"/>
  <text x="675" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FBF8F1">R</text>
  <text x="675" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">Result</text>
  <text x="675" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">concrete outcome</text>
  <text x="675" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">(most weight)</text>

  <text x="390" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Roughly 20% of the answer on S+T, roughly 80% on A+R.</text>

  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
