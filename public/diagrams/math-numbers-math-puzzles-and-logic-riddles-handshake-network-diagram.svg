<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="handshakeTitle">
  <title id="handshakeTitle">Six points arranged in a circle, each labeled as a person, with a straight line connecting every pair of points to every other point, forming a complete network of 15 lines — each of the 6 points connects to the other 5, and each line is shared between exactly two points</title>
  <rect width="640" height="440" fill="#FBF8F1"/>

  <text x="320" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">6 people, every pair shakes hands once</text>

  <g stroke="#2C4A3E" stroke-width="1" opacity="0.55">
    <line x1="320.0" y1="70.0" x2="449.9" y2="145.0"/>
    <line x1="320.0" y1="70.0" x2="449.9" y2="295.0"/>
    <line x1="320.0" y1="70.0" x2="320.0" y2="370.0"/>
    <line x1="320.0" y1="70.0" x2="190.1" y2="295.0"/>
    <line x1="320.0" y1="70.0" x2="190.1" y2="145.0"/>
    <line x1="449.9" y1="145.0" x2="449.9" y2="295.0"/>
    <line x1="449.9" y1="145.0" x2="320.0" y2="370.0"/>
    <line x1="449.9" y1="145.0" x2="190.1" y2="295.0"/>
    <line x1="449.9" y1="145.0" x2="190.1" y2="145.0"/>
    <line x1="449.9" y1="295.0" x2="320.0" y2="370.0"/>
    <line x1="449.9" y1="295.0" x2="190.1" y2="295.0"/>
    <line x1="449.9" y1="295.0" x2="190.1" y2="145.0"/>
    <line x1="320.0" y1="370.0" x2="190.1" y2="295.0"/>
    <line x1="320.0" y1="370.0" x2="190.1" y2="145.0"/>
    <line x1="190.1" y1="295.0" x2="190.1" y2="145.0"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <circle cx="320.0" cy="70.0" r="9" fill="#2C4A3E"/>
    <circle cx="449.9" cy="145.0" r="9" fill="#2C4A3E"/>
    <circle cx="449.9" cy="295.0" r="9" fill="#2C4A3E"/>
    <circle cx="320.0" cy="370.0" r="9" fill="#2C4A3E"/>
    <circle cx="190.1" cy="295.0" r="9" fill="#2C4A3E"/>
    <circle cx="190.1" cy="145.0" r="9" fill="#2C4A3E"/>

    <text x="320.0" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">A</text>
    <text x="482" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">B</text>
    <text x="482" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">C</text>
    <text x="320.0" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">D</text>
    <text x="158" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">E</text>
    <text x="158" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">F</text>
  </g>

  <text x="320" y="428" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8B6F4E">15 lines total — 6 × 5 ÷ 2 = 15 unique handshakes</text>
</svg>
