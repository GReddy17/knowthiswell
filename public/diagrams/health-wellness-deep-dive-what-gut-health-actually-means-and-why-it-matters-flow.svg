<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ghTitle">
  <title id="ghTitle">From fiber to a healthier gut. Step 1: you eat fiber from plants such as beans, whole grains, fruit, vegetables and nuts. Step 2: the small intestine absorbs most nutrients, but fiber passes through undigested. Step 3: bacteria in the colon ferment the fiber. Step 4: they make short-chain fatty acids: butyrate, acetate and propionate. Outcomes: fuel for colon cells, support for the gut barrier, and signals to immune cells and the brain, which is still being researched. Unnecessary antibiotics disrupt this community; probiotic evidence is mixed and strain-specific.</title>
  <defs>
    <marker id="ghArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B6F4E"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1F1B16">From fiber to a healthier gut</text>

    <rect x="14" y="50" width="146" height="104" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="87" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4A3E">1. You eat fiber</text>
    <text x="87" y="94" text-anchor="middle" font-size="11" fill="#1F1B16">beans, whole grains,</text>
    <text x="87" y="110" text-anchor="middle" font-size="11" fill="#1F1B16">fruit, vegetables,</text>
    <text x="87" y="126" text-anchor="middle" font-size="11" fill="#1F1B16">nuts, seeds</text>

    <line x1="162" y1="102" x2="182" y2="102" stroke="#8B6F4E" stroke-width="2" marker-end="url(#ghArrow)"/>

    <rect x="186" y="50" width="146" height="104" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="259" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4A3E">2. Small intestine</text>
    <text x="259" y="94" text-anchor="middle" font-size="11" fill="#1F1B16">absorbs most</text>
    <text x="259" y="110" text-anchor="middle" font-size="11" fill="#1F1B16">nutrients; fiber</text>
    <text x="259" y="126" text-anchor="middle" font-size="11" fill="#1F1B16">passes through</text>

    <line x1="334" y1="102" x2="354" y2="102" stroke="#8B6F4E" stroke-width="2" marker-end="url(#ghArrow)"/>

    <rect x="358" y="50" width="146" height="104" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="431" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#2C4A3E">3. Colon bacteria</text>
    <text x="431" y="94" text-anchor="middle" font-size="11" fill="#1F1B16">tens of trillions</text>
    <text x="431" y="110" text-anchor="middle" font-size="11" fill="#1F1B16">of microbes</text>
    <text x="431" y="126" text-anchor="middle" font-size="11" fill="#1F1B16">ferment the fiber</text>

    <line x1="506" y1="102" x2="526" y2="102" stroke="#8B6F4E" stroke-width="2" marker-end="url(#ghArrow)"/>

    <rect x="530" y="50" width="136" height="104" rx="8" fill="#2C4A3E"/>
    <text x="598" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4. Short-chain</text>
    <text x="598" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">fatty acids</text>
    <text x="598" y="110" text-anchor="middle" font-size="11" fill="#FFFFFF">butyrate, acetate,</text>
    <text x="598" y="126" text-anchor="middle" font-size="11" fill="#FFFFFF">propionate</text>

    <path d="M598,156 L598,176 L120,176 L120,196" fill="none" stroke="#8B6F4E" stroke-width="2" marker-end="url(#ghArrow)"/>
    <line x1="340" y1="176" x2="340" y2="196" stroke="#8B6F4E" stroke-width="2" marker-end="url(#ghArrow)"/>
    <line x1="560" y1="176" x2="560" y2="196" stroke="#8B6F4E" stroke-width="2" marker-end="url(#ghArrow)"/>

    <rect x="14" y="200" width="212" height="80" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="120" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Fuel for colon cells</text>
    <text x="120" y="248" text-anchor="middle" font-size="11" fill="#4A443C">butyrate is a main energy</text>
    <text x="120" y="264" text-anchor="middle" font-size="11" fill="#4A443C">source for the lining</text>

    <rect x="234" y="200" width="212" height="80" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="340" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Supports the gut barrier</text>
    <text x="340" y="248" text-anchor="middle" font-size="11" fill="#4A443C">nutrients in, microbes</text>
    <text x="340" y="264" text-anchor="middle" font-size="11" fill="#4A443C">kept on the gut side</text>

    <rect x="454" y="200" width="212" height="80" rx="8" fill="#FFFFFF" stroke="#B5552B" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="560" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Signals to immune + brain</text>
    <text x="560" y="248" text-anchor="middle" font-size="11" fill="#B5552B">still being researched:</text>
    <text x="560" y="264" text-anchor="middle" font-size="11" fill="#B5552B">much evidence is in animals</text>

    <rect x="14" y="304" width="652" height="80" rx="8" fill="#FFFFFF" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="340" y="328" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Best-supported habits: enough fiber (about 14 g per 1,000 calories) from many plants</text>
    <text x="340" y="350" text-anchor="middle" font-size="11" fill="#4A443C">Unneeded antibiotics disrupt this community · probiotic evidence is mixed and strain-specific</text>
    <text x="340" y="370" text-anchor="middle" font-size="11" fill="#4A443C">Blood in stool, weight loss or lasting changes: see a doctor</text>
  </g>
</svg>
