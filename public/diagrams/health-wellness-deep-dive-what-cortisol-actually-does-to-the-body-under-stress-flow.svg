<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cortisolFlowTitle">
  <title id="cortisolFlowTitle">A perceived stressor triggers the hypothalamus, which signals the pituitary gland, which signals the adrenal glands to release cortisol; rising cortisol then feeds back to the brain to reduce further release once the stressor passes.</title>
  <rect width="560" height="320" fill="#FBF8F1"/>
  <rect x="200" y="20" width="160" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Perceived stressor</text>
  <text x="280" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="200" y="95" width="160" height="45" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="280" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Hypothalamus → Pituitary</text>
  <text x="280" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="200" y="165" width="160" height="45" rx="6" fill="#2C4A3E"/>
  <text x="280" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Adrenal glands release cortisol</text>
  <text x="280" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="150" y="235" width="260" height="50" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Alertness + energy for the demand</text>
  <text x="280" y="273" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">then feedback signals brain to reduce release</text>
  <path d="M 150 260 C 60 260, 60 60, 195 40" fill="none" stroke="#8B6F4E" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="60" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">negative feedback</text>
</svg>
