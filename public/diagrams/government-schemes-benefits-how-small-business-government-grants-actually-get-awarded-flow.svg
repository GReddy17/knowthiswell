<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grTitle">
  <title id="grTitle">How a federal grant gets awarded: 1 the agency publishes a Notice of Funding Opportunity; 2 the applicant registers in SAM.gov for a Unique Entity ID; 3 the applicant submits a narrative and budget, usually via Grants.gov; 4 reviewers score applications against published criteria; 5 the agency reviews applicant risk; 6 the award is signed with spending and reporting rules. No legitimate grant asks for a fee to receive it.</title>
  <rect width="560" height="520" fill="#FBF8F1"/>
  <text x="280" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">How a federal grant gets awarded</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="130" y="46" width="300" height="46" rx="6" fill="#2C4A3E"/>
    <text x="280" y="66" font-size="12" font-weight="700" fill="#FBF8F1">1. Agency publishes the NOFO</text>
    <text x="280" y="82" font-size="11" fill="#FBF8F1">purpose, eligibility, deadline, scoring</text>
    <text x="280" y="108" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="130" y="114" width="300" height="46" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="280" y="134" font-size="12" font-weight="700" fill="#1F1B16">2. Register in SAM.gov</text>
    <text x="280" y="150" font-size="11" fill="#4A443C">free Unique Entity ID; allow weeks</text>
    <text x="280" y="176" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="130" y="182" width="300" height="46" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="280" y="202" font-size="12" font-weight="700" fill="#1F1B16">3. Apply (usually Grants.gov)</text>
    <text x="280" y="218" font-size="11" fill="#4A443C">project narrative + budget</text>
    <text x="280" y="244" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="130" y="250" width="300" height="46" rx="6" fill="#8B6F4E"/>
    <text x="280" y="270" font-size="12" font-weight="700" fill="#FBF8F1">4. Merit review</text>
    <text x="280" y="286" font-size="11" fill="#FBF8F1">scored against the NOFO criteria</text>
    <text x="280" y="312" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="130" y="318" width="300" height="46" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="280" y="338" font-size="12" font-weight="700" fill="#1F1B16">5. Risk review</text>
    <text x="280" y="354" font-size="11" fill="#4A443C">finances, past performance, exclusions</text>
    <text x="280" y="380" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="130" y="386" width="300" height="46" rx="6" fill="#2C4A3E"/>
    <text x="280" y="406" font-size="12" font-weight="700" fill="#FBF8F1">6. Award signed</text>
    <text x="280" y="422" font-size="11" fill="#FBF8F1">allowable costs, records, reports</text>
    <text x="470" y="276" font-size="10" fill="#8B6F4E" text-anchor="start">most</text>
    <text x="470" y="290" font-size="10" fill="#8B6F4E" text-anchor="start">applicants</text>
    <text x="470" y="304" font-size="10" fill="#8B6F4E" text-anchor="start">stop here</text>
    <path d="M434 273 H464" fill="none" stroke="#8B6F4E" stroke-width="2"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">
    <rect x="40" y="448" width="480" height="56" rx="6" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="280" y="470" text-anchor="middle" font-weight="700">Scam check</text>
    <text x="280" y="488" text-anchor="middle" fill="#4A443C">No real grant is won without applying, or needs a fee to receive (FTC).</text>
  </g>
</svg>
