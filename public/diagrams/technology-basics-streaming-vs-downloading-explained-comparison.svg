<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="streamDownloadTitle">
  <title id="streamDownloadTitle">A comparison diagram. On top, downloading is shown as a single progress bar that must fill completely to 100 percent and save the whole file to local storage before playback can begin. On the bottom, streaming is shown as a small buffer that fills partway, playback begins immediately, and data keeps arriving continuously while older buffered data is discarded rather than saved.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <text x="60" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Downloading</text>
  <rect x="60" y="70" width="500" height="26" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="62" y="72" width="496" height="22" fill="#FBEDEA"/>
  <text x="310" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Entire file downloads to local storage — 100%</text>

  <defs>
    <marker id="arrowSd" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <path d="M600,83 L660,83" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowSd)"/>
  <rect x="665" y="65" width="100" height="36" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="715" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Then plays</text>

  <text x="60" y="165" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Streaming</text>
  <rect x="60" y="180" width="500" height="26" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="62" y="182" width="60" height="22" fill="#EEF3EE"/>
  <text x="92" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#1F1B16">buffer</text>
  <path d="M125,193 L555,193" fill="none" stroke="#2C4A3E" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrowSd)"/>
  <text x="340" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">small buffer fills, then data keeps flowing continuously</text>

  <path d="M95,206 L95,240" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowSd)"/>
  <rect x="45" y="245" width="100" height="36" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="95" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Plays right away</text>

  <text x="600" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">older played-back data is</text>
  <text x="600" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">discarded, not saved as a file</text>

  <text x="400" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Streaming trades a full local copy for a much smaller head start.</text>
</svg>
