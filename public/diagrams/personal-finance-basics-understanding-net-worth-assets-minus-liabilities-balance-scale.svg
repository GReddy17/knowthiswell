<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="800" height="380" fill="#FBF8F1"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F1B16">Net Worth: The Balance Between Assets and Liabilities</text>

  <line x1="400" y1="70" x2="400" y2="220" stroke="#2C4A3E" stroke-width="4"/>
  <polygon points="400,60 385,80 415,80" fill="#2C4A3E"/>
  <line x1="150" y1="120" x2="650" y2="120" stroke="#2C4A3E" stroke-width="4"/>

  <line x1="150" y1="120" x2="150" y2="170" stroke="#2C4A3E" stroke-width="2"/>
  <ellipse cx="150" cy="185" rx="120" ry="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Assets</text>

  <line x1="650" y1="120" x2="650" y2="170" stroke="#2C4A3E" stroke-width="2"/>
  <ellipse cx="650" cy="185" rx="120" ry="18" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="650" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Liabilities</text>

  <rect x="60" y="215" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="150" y="235" text-anchor="middle" font-size="11" fill="#4A443C">Cash &amp; savings</text>
  <text x="150" y="253" text-anchor="middle" font-size="11" fill="#4A443C">Investments</text>
  <text x="150" y="271" text-anchor="middle" font-size="11" fill="#4A443C">Property &amp; vehicles</text>
  <text x="150" y="289" text-anchor="middle" font-size="11" fill="#4A443C">Retirement accounts</text>

  <rect x="560" y="215" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="650" y="235" text-anchor="middle" font-size="11" fill="#4A443C">Mortgage balance</text>
  <text x="650" y="253" text-anchor="middle" font-size="11" fill="#4A443C">Student loans</text>
  <text x="650" y="271" text-anchor="middle" font-size="11" fill="#4A443C">Credit card balances</text>
  <text x="650" y="289" text-anchor="middle" font-size="11" fill="#4A443C">Car loans</text>

  <rect x="290" y="330" width="220" height="36" rx="18" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="400" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#1F1B16">Net Worth = Assets − Liabilities</text>
</svg>
