<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rwTitle">
  <title id="rwTitle">The ransomware chain in five stages, with the defense that breaks each one. 1 Get in: phishing, stolen or weak remote-access passwords, unpatched software, fake downloads; defense: patching and multi-factor authentication. 2 Run and persist; defense: endpoint protection. 3 Spread and gain admin rights; defense: limited admin rights. 4 Kill backups and copy data out; defense: offline backups. 5 Encrypt and leave a ransom note; defense: an incident plan and reporting.</title>
  <defs>
    <marker id="rwArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A443C"/></marker>
  </defs>
  <rect width="660" height="340" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">Encryption is the last step, not the first</text>
    <text x="22" y="96" font-size="11" font-weight="700" fill="#8B6F4E" transform="rotate(-90 22 96)">ATTACK</text>
    <text x="22" y="236" font-size="11" font-weight="700" fill="#2C4A3E" transform="rotate(-90 22 236)">DEFENSE</text>

    <rect x="36" y="56" width="110" height="96" rx="8" fill="#F6EBD9" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="91" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">1. Get in</text>
    <text x="91" y="94" text-anchor="middle" font-size="10" fill="#4A443C">phishing</text>
    <text x="91" y="108" text-anchor="middle" font-size="10" fill="#4A443C">stolen RDP/VPN login</text>
    <text x="91" y="122" text-anchor="middle" font-size="10" fill="#4A443C">unpatched software</text>
    <text x="91" y="136" text-anchor="middle" font-size="10" fill="#4A443C">fake downloads</text>
    <line x1="146" y1="104" x2="158" y2="104" stroke="#4A443C" stroke-width="1.5" marker-end="url(#rwArr)"/>

    <rect x="160" y="56" width="110" height="96" rx="8" fill="#F6EBD9" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="215" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">2. Run</text>
    <text x="215" y="100" text-anchor="middle" font-size="10" fill="#4A443C">loader runs,</text>
    <text x="215" y="114" text-anchor="middle" font-size="10" fill="#4A443C">survives reboots</text>
    <line x1="270" y1="104" x2="282" y2="104" stroke="#4A443C" stroke-width="1.5" marker-end="url(#rwArr)"/>

    <rect x="284" y="56" width="110" height="96" rx="8" fill="#F6EBD9" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="339" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">3. Spread</text>
    <text x="339" y="100" text-anchor="middle" font-size="10" fill="#4A443C">steal admin rights,</text>
    <text x="339" y="114" text-anchor="middle" font-size="10" fill="#4A443C">reach other machines</text>
    <line x1="394" y1="104" x2="406" y2="104" stroke="#4A443C" stroke-width="1.5" marker-end="url(#rwArr)"/>

    <rect x="408" y="56" width="110" height="96" rx="8" fill="#F6EBD9" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="463" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">4. Prepare</text>
    <text x="463" y="100" text-anchor="middle" font-size="10" fill="#4A443C">delete backups,</text>
    <text x="463" y="114" text-anchor="middle" font-size="10" fill="#4A443C">copy data out</text>
    <line x1="518" y1="104" x2="530" y2="104" stroke="#4A443C" stroke-width="1.5" marker-end="url(#rwArr)"/>

    <rect x="532" y="56" width="110" height="96" rx="8" fill="#FBEFE6" stroke="#B5552B" stroke-width="2"/>
    <text x="587" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#B5552B">5. Encrypt</text>
    <text x="587" y="100" text-anchor="middle" font-size="10" fill="#4A443C">lock files,</text>
    <text x="587" y="114" text-anchor="middle" font-size="10" fill="#4A443C">ransom note,</text>
    <text x="587" y="128" text-anchor="middle" font-size="10" fill="#4A443C">leak threat</text>

    <g stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="91" y1="152" x2="91" y2="186"/><line x1="215" y1="152" x2="215" y2="186"/><line x1="339" y1="152" x2="339" y2="186"/><line x1="463" y1="152" x2="463" y2="186"/><line x1="587" y1="152" x2="587" y2="186"/>
    </g>
    <g fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5">
      <rect x="36" y="188" width="110" height="78" rx="8"/><rect x="160" y="188" width="110" height="78" rx="8"/><rect x="284" y="188" width="110" height="78" rx="8"/><rect x="408" y="188" width="110" height="78" rx="8"/><rect x="532" y="188" width="110" height="78" rx="8"/>
    </g>
    <g font-size="10" fill="#1F1B16" text-anchor="middle">
      <text x="91" y="212" font-weight="700">Patch + MFA</text><text x="91" y="228">no exposed RDP</text><text x="91" y="242">official downloads</text>
      <text x="215" y="212" font-weight="700">Endpoint</text><text x="215" y="228">protection,</text><text x="215" y="242">macro blocking</text>
      <text x="339" y="212" font-weight="700">Least privilege</text><text x="339" y="228">no daily admin</text><text x="339" y="242">accounts</text>
      <text x="463" y="212" font-weight="700">Offline or</text><text x="463" y="228">immutable</text><text x="463" y="242">backups</text>
      <text x="587" y="212" font-weight="700">Incident plan</text><text x="587" y="228">isolate, restore,</text><text x="587" y="242">report</text>
    </g>
  </g>
  <text x="330" y="302" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Stages per CISA&apos;s #StopRansomware Guide and NIST IR 8374. Home attacks compress the</text>
  <text x="330" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">middle stages, but the entry doors and the backup lesson are the same.</text>
</svg>
