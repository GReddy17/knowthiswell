<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expVsLinearTitle">
  <title id="expVsLinearTitle">Line chart comparing two growth curves over 10 steps: a straight, gently sloped line representing linear growth (adding a fixed amount each step) and a curve that stays low for the first several steps then sharply bends upward representing exponential growth (doubling each step, 2 to the power of the step number), with the exponential curve visibly overtaking the linear one partway through</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- axes -->
  <line x1="70" y1="340" x2="600" y2="340" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="70" y1="340" x2="70" y2="50" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M600,340 L590,335 L590,345 Z" fill="#1F1B16"/>
  <path d="M70,50 L65,60 L75,60 Z" fill="#1F1B16"/>
  <text x="600" y="365" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Step →</text>
  <text x="40" y="50" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C" transform="rotate(-90 40 50)">Value →</text>

  <!-- x tick labels -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#4A443C">
    <text x="70"  y="356" text-anchor="middle">0</text>
    <text x="174" y="356" text-anchor="middle">2</text>
    <text x="278" y="356" text-anchor="middle">4</text>
    <text x="382" y="356" text-anchor="middle">6</text>
    <text x="486" y="356" text-anchor="middle">8</text>
    <text x="590" y="356" text-anchor="middle">10</text>
  </g>

  <!-- linear growth line: value = 16 * step -->
  <polyline points="70,340 122,335.6 174,331.3 226,326.9 278,322.5 330,318.1 382,313.8 434,309.4 486,305.0 538,300.6 590,296.3"
    fill="none" stroke="#4A443C" stroke-width="2.4"/>

  <!-- exponential growth line: value = 2^step -->
  <polyline points="70,339.7 122,339.5 174,338.9 226,337.8 278,335.6 330,331.3 382,322.5 434,305.0 486,270.0 538,200.0 590,60.0"
    fill="none" stroke="#2C4A3E" stroke-width="2.6"/>
  <circle cx="590" cy="60" r="4" fill="#2C4A3E"/>
  <circle cx="590" cy="296.3" r="4" fill="#4A443C"/>

  <!-- labels -->
  <text x="440" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#4A443C">Linear (+16 each step)</text>
  <text x="290" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2C4A3E">Exponential: 2^step (doubling)</text>
  <text x="500" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#2C4A3E">step 10 = 1024</text>

  <!-- crossover marker -->
  <line x1="405" y1="60" x2="405" y2="340" stroke="#E3DCC9" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="405" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">curve overtakes the line</text>
</svg>
