<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="divTitle">
  <title id="divTitle">Illustrative portfolio volatility by number of holdings, for stocks that each swing 20% a year with an average correlation of 0.3. One stock: 20%. Two: about 16%. Five: about 13%. Ten: about 12%. Twenty: about 11.6%. Thirty: about 11.4%. Fifty: about 11.2%. The curve flattens near 11%, the floor of market-wide risk that diversification cannot remove. The gap above the floor is company-specific risk, which diversification removes.</title>
  <rect width="600" height="340" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">
    <line x1="70" y1="260" x2="560" y2="260" stroke="#4A443C" stroke-width="1.5"/>
    <line x1="70" y1="50" x2="70" y2="260" stroke="#4A443C" stroke-width="1.5"/>
    <text x="62" y="264" text-anchor="end">0%</text>
    <text x="62" y="164" text-anchor="end">10%</text>
    <text x="62" y="64" text-anchor="end">20%</text>
    <line x1="70" y1="160" x2="560" y2="160" stroke="#E3DCC9" stroke-width="1"/>
    <line x1="70" y1="60" x2="560" y2="60" stroke="#E3DCC9" stroke-width="1"/>
    <text x="90" y="278" text-anchor="middle">1</text>
    <text x="165" y="278" text-anchor="middle">2</text>
    <text x="240" y="278" text-anchor="middle">5</text>
    <text x="315" y="278" text-anchor="middle">10</text>
    <text x="390" y="278" text-anchor="middle">20</text>
    <text x="465" y="278" text-anchor="middle">30</text>
    <text x="540" y="278" text-anchor="middle">50</text>
    <text x="315" y="298" text-anchor="middle">Number of holdings (equal weights)</text>
    <text x="22" y="160" text-anchor="middle" transform="rotate(-90 22 160)">Portfolio volatility</text>
  </g>
  <rect x="70" y="150" width="490" height="110" fill="#EEF3EE"/>
  <line x1="70" y1="150" x2="560" y2="150" stroke="#2C4A3E" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="315" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Market-wide risk: stays (about 11%)</text>
  <text x="315" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2C4A3E">Not diversifiable</text>
  <polyline points="90,60 165,99 240,127 315,138 390,144 465,146 540,148" fill="none" stroke="#8B6F4E" stroke-width="3"/>
  <g fill="#8B6F4E">
    <circle cx="90" cy="60" r="4"/><circle cx="165" cy="99" r="4"/><circle cx="240" cy="127" r="4"/><circle cx="315" cy="138" r="4"/><circle cx="390" cy="144" r="4"/><circle cx="465" cy="146" r="4"/><circle cx="540" cy="148" r="4"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">
    <text x="100" y="55">20%</text>
    <text x="175" y="94">16%</text>
    <text x="250" y="122">13%</text>
    <text x="315" y="128" text-anchor="middle">12%</text>
  </g>
  <text x="420" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8B6F4E">Company-specific risk</text>
  <text x="420" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">shrinks as you add holdings</text>
  <text x="300" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Illustration: each stock swings 20% a year, average correlation 0.3. Not a forecast.</text>
</svg>
