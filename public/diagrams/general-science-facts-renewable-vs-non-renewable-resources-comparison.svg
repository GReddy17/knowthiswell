<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="renewCompareTitle">
  <title id="renewCompareTitle">Comparison chart with two columns, renewable and non-renewable energy sources, listing solar, wind, hydroelectric, and geothermal as continuously replenished, and coal, oil, natural gas, and uranium as taking millions of years to form with finite reserves, plus a scale bar showing human energy consumption timescale in years dwarfed by fossil fuel formation timescale in millions of years</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- Renewable column -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="20" y="20" width="280" height="36" rx="4" fill="#2C4A3E"/>
    <text x="160" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#FBF8F1">Renewable</text>

    <!-- Solar -->
    <circle cx="44" cy="86" r="7" fill="none" stroke="#8B6F4E" stroke-width="2"/>
    <g stroke="#8B6F4E" stroke-width="1.6">
      <line x1="44" y1="72" x2="44" y2="76"/><line x1="44" y1="96" x2="44" y2="100"/>
      <line x1="30" y1="86" x2="34" y2="86"/><line x1="54" y1="86" x2="58" y2="86"/>
      <line x1="34.5" y1="76.5" x2="37" y2="79"/><line x1="51" y1="93" x2="53.5" y2="95.5"/>
      <line x1="34.5" y1="95.5" x2="37" y2="93"/><line x1="51" y1="79" x2="53.5" y2="76.5"/>
    </g>
    <text x="70" y="91" font-size="13" fill="#1F1B16">Solar</text>

    <!-- Wind -->
    <circle cx="44" cy="126" r="2" fill="#8B6F4E"/>
    <path d="M 44 126 Q 56 118 52 108" fill="none" stroke="#8B6F4E" stroke-width="2" stroke-linecap="round"/>
    <path d="M 44 126 Q 34 136 40 146" fill="none" stroke="#8B6F4E" stroke-width="2" stroke-linecap="round"/>
    <path d="M 44 126 Q 56 132 58 142" fill="none" stroke="#8B6F4E" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="131" font-size="13" fill="#1F1B16">Wind</text>

    <!-- Hydroelectric -->
    <path d="M 44 158 C 38 168, 38 176, 44 176 C 50 176, 50 168, 44 158 Z" fill="#5B7C99"/>
    <text x="70" y="171" font-size="13" fill="#1F1B16">Hydroelectric</text>

    <!-- Geothermal -->
    <path d="M 36 216 Q 40 206 36 198 M 44 216 Q 48 204 44 194 M 52 216 Q 56 208 52 200" fill="none" stroke="#C9412C" stroke-width="2" stroke-linecap="round"/>
    <rect x="30" y="216" width="28" height="4" fill="#8B6F4E"/>
    <text x="70" y="211" font-size="13" fill="#1F1B16">Geothermal</text>

    <rect x="20" y="240" width="280" height="28" rx="14" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
    <text x="160" y="258" text-anchor="middle" font-size="11.5" fill="#2C4A3E" font-weight="600">Continuously replenished</text>
  </g>

  <!-- Non-renewable column -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="340" y="20" width="280" height="36" rx="4" fill="#8B6F4E"/>
    <text x="480" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#FBF8F1">Non-renewable</text>

    <!-- Coal -->
    <rect x="356" y="80" width="12" height="12" fill="#1F1B16"/>
    <rect x="370" y="84" width="10" height="10" fill="#1F1B16"/>
    <text x="390" y="91" font-size="13" fill="#1F1B16">Coal</text>

    <!-- Oil -->
    <path d="M 364 108 C 358 118, 358 126, 364 126 C 370 126, 370 118, 364 108 Z" fill="#1F1B16"/>
    <text x="390" y="121" font-size="13" fill="#1F1B16">Oil</text>

    <!-- Natural gas -->
    <path d="M 364 138 C 358 146, 360 154, 366 156 C 362 150, 366 148, 368 144 C 370 149, 372 151, 370 156 C 376 154, 376 144, 370 140 C 370 143, 368 143, 368 140 C 367 137, 365 137, 364 138 Z" fill="#C9412C"/>
    <text x="390" y="151" font-size="13" fill="#1F1B16">Natural gas</text>

    <!-- Uranium (atom) -->
    <g transform="translate(364,196)">
      <circle cx="0" cy="0" r="2.2" fill="#C9412C"/>
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="none" stroke="#8B6F4E" stroke-width="1.4"/>
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="none" stroke="#8B6F4E" stroke-width="1.4" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="none" stroke="#8B6F4E" stroke-width="1.4" transform="rotate(120)"/>
    </g>
    <text x="390" y="201" font-size="13" fill="#1F1B16">Uranium</text>

    <rect x="340" y="240" width="280" height="28" rx="14" fill="#FBEDEA" stroke="#C9412C" stroke-width="1"/>
    <text x="480" y="258" text-anchor="middle" font-size="11.5" fill="#C9412C" font-weight="600">Millions of years to form — finite reserve</text>
  </g>

  <!-- Timescale comparison -->
  <text x="320" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Replenishment timescale, roughly to scale</text>

  <rect x="40" y="312" width="560" height="24" fill="#8B6F4E" opacity="0.55"/>
  <text x="320" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16" font-weight="600">Fossil fuel formation: millions of years</text>

  <rect x="40" y="350" width="5" height="24" fill="#2C4A3E"/>
  <line x1="45" y1="362" x2="80" y2="362" stroke="#4A443C" stroke-width="1"/>
  <text x="86" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Human energy consumption: roughly a century or two</text>
</svg>
