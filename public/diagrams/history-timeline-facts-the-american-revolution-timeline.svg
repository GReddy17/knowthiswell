<svg viewBox="0 0 1630 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of the American Revolution from the 1765 Stamp Act, through the 1770 Boston Massacre, the 1773 Boston Tea Party, the April 1775 Battles of Lexington and Concord, the July 1776 Declaration of Independence, the 1777-1778 Battle of Saratoga and French alliance, the October 1781 British surrender at Yorktown, and the 1783 Treaty of Paris formally recognizing American independence</title>
  <rect width="1630" height="230" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="815" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">Eighteen years from a tax on paper to a nation formally recognized</text>

    <rect x="40" y="115" width="210" height="40" fill="#EEF3EE"/>
    <text x="145" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Stamp Act imposed</text>
    <text x="145" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Direct tax on colonial paper goods</text>
    <text x="145" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1765</text>

    <rect x="250" y="115" width="150" height="40" fill="#FBEDEA"/>
    <text x="325" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Boston Massacre</text>
    <text x="325" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1770</text>

    <rect x="400" y="115" width="155" height="40" fill="#EDE7D8"/>
    <text x="477" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Boston Tea Party</text>
    <text x="477" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1773</text>

    <rect x="555" y="115" width="195" height="40" fill="#EEF3EE"/>
    <text x="652" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Lexington and Concord</text>
    <text x="652" y="138" text-anchor="middle" font-size="9" fill="#4A443C">First shots of the war</text>
    <text x="652" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Apr 1775</text>

    <rect x="750" y="115" width="205" height="40" fill="#FBEDEA"/>
    <text x="852" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Declaration of Independence</text>
    <text x="852" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Jul 1776</text>

    <rect x="955" y="115" width="215" height="40" fill="#EDE7D8"/>
    <text x="1062" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Battle of Saratoga</text>
    <text x="1062" y="138" text-anchor="middle" font-size="9" fill="#4A443C">France allies with the colonies</text>
    <text x="1062" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1777–1778</text>

    <rect x="1170" y="115" width="210" height="40" fill="#EEF3EE"/>
    <text x="1275" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">British surrender at Yorktown</text>
    <text x="1275" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Oct 1781</text>

    <rect x="1380" y="115" width="210" height="40" fill="#FBEDEA"/>
    <text x="1485" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Treaty of Paris</text>
    <text x="1485" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Independence formally recognized</text>
    <text x="1485" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1783</text>
  </g>
  <rect x="40" y="115" width="1550" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="250" y1="115" x2="250" y2="155" stroke="#1F1B16"/>
  <line x1="400" y1="115" x2="400" y2="155" stroke="#1F1B16"/>
  <line x1="555" y1="115" x2="555" y2="155" stroke="#1F1B16"/>
  <line x1="750" y1="115" x2="750" y2="155" stroke="#1F1B16"/>
  <line x1="955" y1="115" x2="955" y2="155" stroke="#1F1B16"/>
  <line x1="1170" y1="115" x2="1170" y2="155" stroke="#1F1B16"/>
  <line x1="1380" y1="115" x2="1380" y2="155" stroke="#1F1B16"/>
</svg>
