<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ngoModelsTitle">
  <title id="ngoModelsTitle">A grid of four boxes representing environmental NGO operating models: Advocacy and Campaigning (lobbying and public pressure), Direct Land Conservation (land trusts buying land or easements), Scientific Research (data and monitoring supporting other work), and Legal Action (lawsuits enforcing existing environmental law), each with a small icon and one-line description.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="30" y="30" width="340" height="120" rx="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Advocacy &amp; Campaigning</text>
  <text x="200" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Lobbying, public pressure,</text>
  <text x="200" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">media campaigns to change policy</text>
  <text x="200" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#2C4A3E">&#128226;</text>

  <rect x="410" y="30" width="340" height="120" rx="12" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Direct Land Conservation</text>
  <text x="580" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Land trusts buying land or</text>
  <text x="580" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">negotiating conservation easements</text>
  <text x="580" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#2C4A3E">&#127795;</text>

  <rect x="30" y="175" width="340" height="120" rx="12" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Scientific Research</text>
  <text x="200" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Data collection and monitoring</text>
  <text x="200" y="251" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">that supports other NGO work</text>
  <text x="200" y="275" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#2C4A3E">&#128300;</text>

  <rect x="410" y="175" width="340" height="120" rx="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Legal Action</text>
  <text x="580" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Lawsuits enforcing existing</text>
  <text x="580" y="251" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">environmental law and permits</text>
  <text x="580" y="275" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#2C4A3E">&#9878;</text>
</svg>
