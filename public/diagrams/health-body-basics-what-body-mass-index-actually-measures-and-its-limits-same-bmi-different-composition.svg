<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bmiCompositionTitle">
  <title id="bmiCompositionTitle">Two figures of identical height and weight, both labeled BMI 27.8. The left figure is labeled mostly muscle mass, low body fat. The right figure is labeled higher body fat proportion, less muscle mass. Both feed into the same BMI formula box showing weight divided by height squared, illustrating that the formula cannot distinguish between them</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <rect x="70" y="30" width="140" height="150" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="140" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">85 kg / 175 cm</text>
  <text x="140" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">mostly muscle,</text>
  <text x="140" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">low body fat</text>

  <rect x="570" y="30" width="140" height="150" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="640" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">85 kg / 175 cm</text>
  <text x="640" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">higher body fat,</text>
  <text x="640" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">less muscle</text>

  <line x1="210" y1="105" x2="330" y2="220" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="570" y1="105" x2="450" y2="220" stroke="#2C4A3E" stroke-width="1.6"/>

  <rect x="300" y="220" width="180" height="60" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">weight ÷ height²</text>
  <text x="390" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#B5493A">BMI = 27.8 (both)</text>
</svg>
