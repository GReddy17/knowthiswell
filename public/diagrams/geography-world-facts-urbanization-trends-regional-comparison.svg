<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="urbanTrendsTitle">
  <title id="urbanTrendsTitle">A line chart with separate lines for North America, Latin America and the Caribbean, Europe, Asia, and Africa, each tracking the percentage of that region's population living in urban areas from 1950 through 2050, showing North America and Latin America already high and flattening near 80-85%, Europe following a similar but slightly lower path, and Asia and Africa starting much lower in 1950 but climbing steeply, with Africa remaining the lowest of the five by 2050</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Share of population living in urban areas, 1950-2050</text>

  <!-- gridlines -->
  <g stroke="#E3DCC9" stroke-width="1">
    <line x1="80" y1="340" x2="600" y2="340"/>
    <line x1="80" y1="280" x2="600" y2="280"/>
    <line x1="80" y1="220" x2="600" y2="220"/>
    <line x1="80" y1="160" x2="600" y2="160"/>
    <line x1="80" y1="100" x2="600" y2="100"/>
    <line x1="80" y1="60" x2="600" y2="60"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B7E5E" text-anchor="end">
    <text x="72" y="344">0%</text>
    <text x="72" y="284">20%</text>
    <text x="72" y="224">40%</text>
    <text x="72" y="164">60%</text>
    <text x="72" y="104">80%</text>
    <text x="72" y="64">100%</text>
  </g>

  <!-- axes -->
  <line x1="80" y1="340" x2="600" y2="340" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="340" stroke="#1F1B16" stroke-width="1.5"/>

  <!-- x labels: 1950 .. 2050, projection begins ~2020 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C" text-anchor="middle">
    <text x="80" y="358">1950</text>
    <text x="184" y="358">1970</text>
    <text x="288" y="358">1990</text>
    <text x="392" y="358">2010</text>
    <text x="496" y="358">2030</text>
    <text x="600" y="358">2050</text>
  </g>
  <line x1="392" y1="60" x2="392" y2="340" stroke="#C9412C" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="392" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#B24A38">projected &#8594;</text>

  <!-- x: 1950=80, 2050=600 -> 5.2px/yr -->
  <!-- North America: 1950 ~64% -> 2020 ~82% -> 2050 ~85% -->
  <path d="M 80,229 C 160,197 260,166 392,131 C 460,120 540,113 600,109" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <!-- Latin America & Caribbean: 1950 ~41% -> 2020 ~81% -> 2050 ~84% -->
  <path d="M 80,271 C 170,213 270,164 392,133 C 460,123 540,115 600,111" fill="none" stroke="#5B7A99" stroke-width="2.5"/>
  <!-- Europe: 1950 ~52% -> 2020 ~74% -> 2050 ~78% -->
  <path d="M 80,250 C 170,220 270,190 392,153 C 460,143 540,132 600,126" fill="none" stroke="#8B6F4E" stroke-width="2.5"/>
  <!-- Asia: 1950 ~17% -> 2020 ~51% -> 2050 ~66% -->
  <path d="M 80,306 C 170,296 270,265 392,217 C 460,192 540,167 600,152" fill="none" stroke="#B24A38" stroke-width="2.5"/>
  <!-- Africa: 1950 ~14% -> 2020 ~44% -> 2050 ~59% -->
  <path d="M 80,312 C 170,304 270,278 392,238 C 460,217 540,190 600,175" fill="none" stroke="#4A443C" stroke-width="2.5" stroke-dasharray="1 0"/>

  <!-- end labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600">
    <text x="608" y="112" fill="#2C4A3E">N. America</text>
    <text x="608" y="126" fill="#5B7A99">Latin America</text>
    <text x="608" y="140" fill="#8B6F4E">Europe</text>
    <text x="500" y="185" fill="#B24A38">Asia</text>
    <text x="470" y="235" fill="#4A443C">Africa</text>
  </g>

  <text x="320" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">1950-2020 from UN estimates; 2020-2050 are UN World Urbanization Prospects projections.</text>
</svg>
