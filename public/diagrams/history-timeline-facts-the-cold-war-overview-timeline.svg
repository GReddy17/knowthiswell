<svg viewBox="0 0 2350 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Horizontal timeline of the Cold War from 1947 the articulation of U.S. containment policy, 1948-1949 the Berlin Blockade and Airlift, 1949 the founding of NATO, 1950-1953 the Korean War, 1955 the founding of the Warsaw Pact, 1961 the construction of the Berlin Wall, October 1962 the Cuban Missile Crisis, the 1970s period of detente, 1979-1989 the Soviet-Afghan War, November 1989 the fall of the Berlin Wall, and December 1991 the dissolution of the Soviet Union</title>
  <rect width="2350" height="230" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="1175" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">Four and a half decades of rivalry between the United States and the Soviet Union, ending without direct war</text>

    <rect x="40" y="115" width="165" height="40" fill="#EEF3EE"/>
    <text x="122" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Containment policy</text>
    <text x="122" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1947</text>

    <rect x="205" y="115" width="195" height="40" fill="#FBEDEA"/>
    <text x="302" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Berlin Blockade &amp; Airlift</text>
    <text x="302" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1948&#8211;1949</text>

    <rect x="400" y="115" width="170" height="40" fill="#EDE7D8"/>
    <text x="485" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">NATO founded</text>
    <text x="485" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1949</text>

    <rect x="570" y="115" width="190" height="40" fill="#EEF3EE"/>
    <text x="665" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Korean War</text>
    <text x="665" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1950&#8211;1953</text>

    <rect x="760" y="115" width="200" height="40" fill="#FBEDEA"/>
    <text x="860" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Warsaw Pact founded</text>
    <text x="860" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1955</text>

    <rect x="960" y="115" width="215" height="40" fill="#EDE7D8"/>
    <text x="1067" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Berlin Wall built</text>
    <text x="1067" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1961</text>

    <rect x="1175" y="115" width="215" height="40" fill="#EEF3EE"/>
    <text x="1282" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Cuban Missile Crisis</text>
    <text x="1282" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Oct 1962</text>

    <rect x="1390" y="115" width="185" height="40" fill="#FBEDEA"/>
    <text x="1482" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">D&#233;tente</text>
    <text x="1482" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1970s</text>

    <rect x="1575" y="115" width="230" height="40" fill="#EDE7D8"/>
    <text x="1690" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Soviet-Afghan War</text>
    <text x="1690" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1979&#8211;1989</text>

    <rect x="1805" y="115" width="255" height="40" fill="#EEF3EE"/>
    <text x="1932" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Berlin Wall falls</text>
    <text x="1932" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Nov 1989</text>

    <rect x="2060" y="115" width="250" height="40" fill="#FBEDEA"/>
    <text x="2185" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">USSR dissolves</text>
    <text x="2185" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Dec 1991</text>
  </g>
  <rect x="40" y="115" width="2270" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="205" y1="115" x2="205" y2="155" stroke="#1F1B16"/>
  <line x1="400" y1="115" x2="400" y2="155" stroke="#1F1B16"/>
  <line x1="570" y1="115" x2="570" y2="155" stroke="#1F1B16"/>
  <line x1="760" y1="115" x2="760" y2="155" stroke="#1F1B16"/>
  <line x1="960" y1="115" x2="960" y2="155" stroke="#1F1B16"/>
  <line x1="1175" y1="115" x2="1175" y2="155" stroke="#1F1B16"/>
  <line x1="1390" y1="115" x2="1390" y2="155" stroke="#1F1B16"/>
  <line x1="1575" y1="115" x2="1575" y2="155" stroke="#1F1B16"/>
  <line x1="1805" y1="115" x2="1805" y2="155" stroke="#1F1B16"/>
  <line x1="2060" y1="115" x2="2060" y2="155" stroke="#1F1B16"/>
</svg>
