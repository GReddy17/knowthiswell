<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sourceLayersTitle">
  <title id="sourceLayersTitle">A three-tier diagram with the original event at the center, an inner ring labeled primary sources such as raw footage and official documents directly touching the event, a middle ring labeled secondary sources such as news articles and analysis one step removed, and an outer ring labeled tertiary sources such as encyclopedias compiling the inner two rings</title>
  <rect width="600" height="600" fill="#FBF8F1"/>

  <circle cx="300" cy="300" r="260" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="300" cy="300" r="175" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="300" cy="300" r="90" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5"/>

  <text x="300" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">The event</text>
  <text x="300" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">(what actually</text>
  <text x="300" y="328" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">happened)</text>

  <text x="300" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1F1B16">Secondary sources</text>
  <text x="300" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">news articles, analysis, documentaries</text>

  <text x="300" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1F1B16">Tertiary sources</text>
  <text x="300" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">encyclopedias, databases, textbooks</text>

  <text x="300" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16" font-weight="600">Primary: raw footage,</text>
  <text x="300" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16" font-weight="600">official documents,</text>
  <text x="300" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16" font-weight="600">firsthand testimony</text>

  <text x="300" y="580" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each outer ring adds interpretation and distance from the original event.</text>
</svg>
