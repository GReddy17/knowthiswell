<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scaleTitle">
  <title id="scaleTitle">A zoom sequence from a whole human cell to its nucleus containing 23 pairs of chromosomes, to one chromosome unwound into a coiled DNA double helix, to a labeled segment of that DNA strand marked as a single gene</title>

  <rect x="0" y="0" width="720" height="400" fill="#FBF8F1"/>

  <!-- stage 1: cell -->
  <circle cx="90" cy="170" r="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="90" cy="170" r="20" fill="#FBF8F1" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="90" y="360" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Cell</text>
  <text x="90" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">nucleus</text>

  <!-- zoom connector 1 -->
  <path d="M 108,155 L 195,105" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 108,187 L 195,235" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- stage 2: nucleus with 23 pairs of chromosomes -->
  <circle cx="270" cy="170" r="85" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="2"/>
  <g fill="none" stroke="#4A443C" stroke-width="2.5" stroke-linecap="round">
    <path d="M 230,120 L 244,134 M 230,134 L 244,120"/>
    <path d="M 265,105 L 279,119 M 265,119 L 279,105"/>
    <path d="M 300,115 L 314,129 M 300,129 L 314,115"/>
    <path d="M 315,150 L 329,164 M 315,164 L 329,150"/>
    <path d="M 305,190 L 319,204 M 305,204 L 319,190"/>
    <path d="M 275,215 L 289,229 M 275,229 L 289,215"/>
    <path d="M 235,210 L 249,224 M 235,224 L 249,210"/>
    <path d="M 220,170 L 234,184 M 220,184 L 234,170"/>
    <path d="M 245,155 L 259,169 M 245,169 L 259,155"/>
  </g>
  <text x="270" y="360" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">Nucleus</text>
  <text x="270" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">23 pairs of chromosomes</text>

  <!-- zoom connector 2 -->
  <path d="M 350,125 L 405,95" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 350,215 L 405,245" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- stage 3: one chromosome unwound to helix -->
  <path d="M 415,95 L 435,115 M 415,115 L 435,95" stroke="#2C4A3E" stroke-width="6" stroke-linecap="round"/>
  <path d="M 425,120 L 425,140" stroke="#4A443C" stroke-width="2"/>
  <path d="M 425,140 L 419,133 L 419,147" fill="#4A443C" stroke="none"/>
  <g fill="none" stroke="#1F1B16" stroke-width="2">
    <path d="M 400,150 Q 425,165 450,150 Q 475,135 450,120"/>
    <path d="M 400,150 Q 425,135 450,150 Q 475,165 450,180"/>
    <path d="M 450,150 Q 425,165 400,150 Q 375,135 400,120" transform="translate(0,50)"/>
    <path d="M 450,150 Q 425,135 400,150 Q 375,165 400,180" transform="translate(0,50)"/>
  </g>
  <g stroke="#8B6F4E" stroke-width="2">
    <line x1="404" y1="160" x2="446" y2="160"/>
    <line x1="404" y1="180" x2="446" y2="180"/>
    <line x1="404" y1="200" x2="446" y2="200"/>
    <line x1="404" y1="220" x2="446" y2="220"/>
    <line x1="404" y1="240" x2="446" y2="240"/>
  </g>
  <text x="425" y="360" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">DNA double helix</text>
  <text x="425" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">one coiled molecule</text>

  <!-- zoom connector 3 -->
  <path d="M 450,175 L 545,150" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 450,225 L 545,260" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- stage 4: gene segment highlighted -->
  <g fill="none" stroke="#1F1B16" stroke-width="2.5">
    <line x1="560" y1="140" x2="660" y2="140"/>
    <line x1="560" y1="240" x2="660" y2="240"/>
  </g>
  <g stroke="#8B6F4E" stroke-width="2.5">
    <line x1="575" y1="140" x2="575" y2="240"/>
    <line x1="605" y1="140" x2="605" y2="240"/>
    <line x1="635" y1="140" x2="635" y2="240"/>
  </g>
  <rect x="592" y="132" width="26" height="116" fill="#FBEDEA" stroke="#C9412C" stroke-width="2" rx="3"/>
  <text x="605" y="360" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#C9412C">Gene</text>
  <text x="605" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">~20,000 genes total</text>
</svg>
