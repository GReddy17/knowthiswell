<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="circuitTitle">
  <title id="circuitTitle">Simple electric circuit loop with a battery, a resistor, and current flow direction marked</title>
  <defs>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <rect width="640" height="320" fill="#FBF8F1"/>

  <!-- circuit loop -->
  <rect x="120" y="80" width="400" height="160" fill="none" stroke="#1F1B16" stroke-width="3"/>

  <!-- battery symbol on left side -->
  <line x1="120" y1="150" x2="120" y2="170" stroke="#1F1B16" stroke-width="3"/>
  <line x1="100" y1="150" x2="140" y2="150" stroke="#1F1B16" stroke-width="5"/>
  <line x1="108" y1="170" x2="132" y2="170" stroke="#1F1B16" stroke-width="2"/>
  <text x="70" y="164" font-family="ui-serif, Georgia, serif" font-size="16" fill="#2C4A3E">Battery</text>
  <text x="70" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Voltage (V)</text>

  <!-- resistor symbol on right side (zigzag) -->
  <polyline points="520,140 512,145 528,150 512,155 528,160 512,165 520,170"
            fill="none" stroke="#C9412C" stroke-width="3"/>
  <text x="545" y="150" font-family="ui-serif, Georgia, serif" font-size="16" fill="#C9412C">Resistor</text>
  <text x="545" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Resistance (Ω)</text>

  <!-- current flow arrows around the loop -->
  <line x1="220" y1="80" x2="380" y2="80" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowFlow)"/>
  <line x1="520" y1="200" x2="520" y2="80" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowFlow)" opacity="0"/>
  <line x1="380" y1="240" x2="220" y2="240" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <text x="320" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2C4A3E">Current (I) flows in one continuous loop</text>

  <text x="320" y="285" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">I = V / R</text>
</svg>
