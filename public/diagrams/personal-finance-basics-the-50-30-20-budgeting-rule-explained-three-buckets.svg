<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fiftyThirtyTwentyTitle">
  <title id="fiftyThirtyTwentyTitle">A horizontal bar divided into three proportional segments representing after-tax income: a 50 percent segment labeled Needs, a 30 percent segment labeled Wants, and a 20 percent segment labeled Savings and Debt Repayment, with a caption noting these are target proportions, not fixed requirements</title>
  <rect width="780" height="220" fill="#FBF8F1"/>

  <rect x="40" y="60" width="350" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="215" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">Needs — 50%</text>

  <rect x="390" y="60" width="210" height="70" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="495" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">Wants — 30%</text>

  <rect x="600" y="60" width="140" height="70" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="670" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Savings /</text>
  <text x="670" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Debt — 20%</text>

  <text x="390" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Target proportions of after-tax income — a starting reference point, not a fixed requirement.</text>
</svg>
