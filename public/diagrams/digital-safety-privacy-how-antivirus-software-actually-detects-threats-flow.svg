<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="avDetectionTitle">
  <title id="avDetectionTitle">A file is scanned three ways in parallel: signature matching against known malware, heuristic analysis of suspicious behavior, and a cloud reputation check — any one flag quarantines the file.</title>
  <rect width="560" height="320" fill="#FBF8F1"/>
  <rect x="220" y="20" width="120" height="42" rx="6" fill="#2C4A3E"/>
  <text x="280" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#FBF8F1">New file scanned</text>
  <rect x="40" y="110" width="150" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="115" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Signature match</text>
  <text x="115" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">vs. known malware</text>
  <rect x="205" y="110" width="150" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Heuristic analysis</text>
  <text x="280" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">suspicious behavior</text>
  <rect x="370" y="110" width="150" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="445" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Cloud reputation</text>
  <text x="445" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">seen elsewhere?</text>
  <line x1="280" y1="62" x2="115" y2="110" stroke="#8B6F4E" stroke-width="2"/>
  <line x1="280" y1="62" x2="280" y2="110" stroke="#8B6F4E" stroke-width="2"/>
  <line x1="280" y1="62" x2="445" y2="110" stroke="#8B6F4E" stroke-width="2"/>
  <line x1="115" y1="170" x2="280" y2="230" stroke="#C9412C" stroke-width="2"/>
  <line x1="280" y1="170" x2="280" y2="230" stroke="#C9412C" stroke-width="2"/>
  <line x1="445" y1="170" x2="280" y2="230" stroke="#C9412C" stroke-width="2"/>
  <rect x="200" y="235" width="160" height="46" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="263" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Any flag → quarantine</text>
  <text x="280" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">All three checks run in parallel, not in sequence</text>
</svg>
