<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dryLiquidTitle">
  <title id="dryLiquidTitle">Two parallel columns compared: the left column shows the US liquid measure chain (liquid pint 0.473 liters, liquid quart 0.946 liters, gallon 3.785 liters) and the right column shows the US dry measure chain (dry pint 0.551 liters, dry quart 1.101 liters, peck 8.81 liters, bushel 35.24 liters), with a bracket showing the dry quart is about 16 percent larger than the liquid quart despite sharing the name quart</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="200" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Liquid measure</text>
  <rect x="110" y="55" width="180" height="42" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">liquid pint = 0.473 L</text>
  <rect x="110" y="115" width="180" height="42" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">liquid quart = 0.946 L</text>
  <rect x="110" y="175" width="180" height="42" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">gallon = 3.785 L</text>

  <text x="580" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Dry measure</text>
  <rect x="490" y="55" width="180" height="42" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">dry pint = 0.551 L</text>
  <rect x="490" y="115" width="180" height="42" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
  <text x="580" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">dry quart = 1.101 L</text>
  <rect x="490" y="175" width="180" height="42" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">peck = 8.81 L</text>

  <line x1="290" y1="136" x2="490" y2="136" stroke="#B5493A" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="390" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Both called "quart" — the dry quart (1.101 L) is about 16% larger than the liquid quart (0.946 L).</text>
  <text x="390" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">A dry bushel (35.24 L) has no liquid-measure equivalent at all.</text>
</svg>
