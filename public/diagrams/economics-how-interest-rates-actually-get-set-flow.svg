<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fedRateFlowTitle">
  <title id="fedRateFlowTitle">How a Fed rate target ripples to consumer rates: the FOMC sets a target range for the federal funds rate, which changes banks' cost of overnight borrowing, which then influences the rates banks offer on mortgages, credit cards, and savings accounts.</title>
  <rect width="620" height="260" fill="#FBF8F1"/>
  <rect x="20" y="85" width="150" height="90" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="95" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">FOMC sets</text>
  <text x="95" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">target range for the</text>
  <text x="95" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">federal funds rate</text>
  <text x="95" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#6B5C48">(bank-to-bank overnight)</text>

  <path d="M170 130 L228 130" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>

  <rect x="235" y="85" width="160" height="90" rx="6" fill="#2C4A3E"/>
  <text x="315" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Banks' own cost</text>
  <text x="315" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">of overnight</text>
  <text x="315" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">borrowing shifts</text>

  <path d="M395 130 L453 130" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>

  <rect x="460" y="55" width="145" height="150" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="532" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Consumer rates</text>
  <text x="532" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">adjust (influenced,</text>
  <text x="532" y="111" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">not dictated)</text>
  <text x="532" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#6B5C48">Mortgages</text>
  <text x="532" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#6B5C48">Credit cards</text>
  <text x="532" y="167" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#6B5C48">Savings accounts</text>
  <text x="532" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#6B5C48">Auto loans</text>

  <text x="310" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">The Fed sets the first box directly — everything after it is a ripple, not a direct order</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1F1B16"/>
    </marker>
  </defs>
</svg>
