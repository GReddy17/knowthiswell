<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflationDecayTitle">
  <title id="inflationDecayTitle">A diagram showing a $10,000 bar at year zero, with three shrinking bars beside it representing its inflation-adjusted real value at year 5, year 10, and year 20 at a steady 3% annual inflation rate, each labeled with its approximate real-dollar value.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Real purchasing power of the same $10,000 at 3% annual inflation</text>

  <line x1="70" y1="250" x2="730" y2="250" stroke="#2C4A3E" stroke-width="2"/>

  <rect x="110" y="70" width="110" height="180" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="165" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">$10,000</text>
  <text x="165" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Year 0</text>

  <rect x="280" y="107" width="110" height="143" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="335" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">≈$8,626</text>
  <text x="335" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Year 5</text>

  <rect x="450" y="134" width="110" height="116" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="505" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">≈$7,441</text>
  <text x="505" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Year 10</text>

  <rect x="620" y="168" width="110" height="82" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="675" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5493A">≈$5,537</text>
  <text x="675" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Year 20</text>

  <text x="390" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Every bar is the same $10,000 — none of it was spent. Shrinkage is inflation alone.</text>
</svg>
