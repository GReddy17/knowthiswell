<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="warranty-compare-title">
  <title id="warranty-compare-title">Comparison diagram: an express warranty explicitly stated by the seller, versus an implied warranty that arises automatically by law regardless of what the seller says.</title>
  <rect width="640" height="280" fill="#FBF8F1"/>
  <style>
    .boxa { fill: #EEF3EE; stroke: #2C4A3E; stroke-width: 2; }
    .boxb { fill: #FBEDEA; stroke: #2C4A3E; stroke-width: 2; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #1F1B16; font-weight: 600; }
    .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #4A443C; }
    .heading { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #4A443C; font-weight: 600; }
  </style>

  <text x="160" y="30" text-anchor="middle" class="heading">Express warranty</text>
  <rect x="40" y="50" width="240" height="90" rx="8" class="boxa"/>
  <text x="160" y="82" text-anchor="middle" class="label">Explicitly stated</text>
  <text x="160" y="102" text-anchor="middle" class="sub">Written card, ad claim,</text>
  <text x="160" y="118" text-anchor="middle" class="sub">or verbal promise</text>
  <text x="160" y="133" text-anchor="middle" class="sub">by the seller</text>

  <text x="480" y="30" text-anchor="middle" class="heading">Implied warranty</text>
  <rect x="360" y="50" width="240" height="90" rx="8" class="boxb"/>
  <text x="480" y="82" text-anchor="middle" class="label">Arises automatically</text>
  <text x="480" y="102" text-anchor="middle" class="sub">Basic expectation the product</text>
  <text x="480" y="118" text-anchor="middle" class="sub">works for its ordinary purpose,</text>
  <text x="480" y="133" text-anchor="middle" class="sub">by operation of law</text>

  <rect x="60" y="170" width="500" height="80" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="200" text-anchor="middle" class="label">Both can apply to the same product</text>
  <text x="310" y="220" text-anchor="middle" class="label">at the same time</text>
  <text x="310" y="238" text-anchor="middle" class="sub">each with its own separate terms and limits</text>
</svg>
