<svg viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recCmpTitle">
  <title id="recCmpTitle">The official NBER approach versus the two-quarter rule of thumb. The NBER looks for a significant, widespread decline lasting more than a few months, judged mainly on jobs and income plus GDP, dated after the fact by a committee. The rule of thumb uses two quarters of falling real GDP, one number only, and flagged 2022 when there was no recession.</title>
  <rect width="560" height="290" fill="#FBF8F1"/>
  <text x="150" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Official (NBER)</text>
  <rect x="40" y="46" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="67" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Significant, widespread,</text>
  <text x="150" y="83" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">lasts more than a few months</text>
  <rect x="40" y="104" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Jobs and income first,</text>
  <text x="150" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">plus GDP and more</text>
  <rect x="40" y="162" width="220" height="50" rx="6" fill="#2C4A3E"/>
  <text x="150" y="183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Dated after the fact</text>
  <text x="150" y="199" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">by a committee</text>
  <text x="410" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8B6F4E">Rule of thumb</text>
  <rect x="300" y="46" width="220" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="410" y="67" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Two quarters of</text>
  <text x="410" y="83" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">falling real GDP</text>
  <rect x="300" y="104" width="220" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="410" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">One number</text>
  <text x="410" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">only</text>
  <rect x="300" y="162" width="220" height="50" rx="6" fill="#8B6F4E"/>
  <text x="410" y="183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Flagged 2022 with</text>
  <text x="410" y="199" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">no recession declared</text>
  <line x1="280" y1="46" x2="280" y2="212" stroke="#E3DCC9" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="280" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Depth, diffusion and duration together decide it,</text>
  <text x="280" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">not a single GDP reading.</text>
</svg>
