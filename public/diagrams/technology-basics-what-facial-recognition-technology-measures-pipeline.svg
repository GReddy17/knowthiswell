<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="faceRecPipelineTitle">
  <title id="faceRecPipelineTitle">Four-step pipeline: a camera captures a photo of a face, the system detects the face and marks landmark points such as eye spacing and jaw width, those measurements are converted into a numeric template called a faceprint, and that faceprint is compared against a stored database of templates to look for a matching score above a threshold.</title>
  <rect width="820" height="300" fill="#FBF8F1"/>

  <rect x="30" y="60" width="160" height="90" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="110" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">1. Capture</text>
  <text x="110" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">camera takes a</text>
  <text x="110" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">photo of a face</text>

  <rect x="230" y="60" width="160" height="90" rx="8" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="310" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">2. Landmarks</text>
  <text x="310" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">eye spacing, jaw</text>
  <text x="310" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">width, nose ridge...</text>

  <rect x="430" y="60" width="160" height="90" rx="8" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="510" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">3. Faceprint</text>
  <text x="510" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">measurements become</text>
  <text x="510" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">a string of numbers</text>

  <rect x="630" y="60" width="160" height="90" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="710" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">4. Match check</text>
  <text x="710" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">compare number set to</text>
  <text x="710" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">a stored database</text>

  <defs>
    <marker id="arrowFace" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M190,105 L230,105" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowFace)"/>
  <path d="M390,105 L430,105" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowFace)"/>
  <path d="M590,105 L630,105" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowFace)"/>

  <rect x="230" y="190" width="360" height="70" rx="8" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1"/>
  <text x="410" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">The system never stores or compares a "picture"</text>
  <text x="410" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">at the matching step — only the numeric faceprint,</text>
  <text x="410" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">scored for similarity against a threshold, not exact equality</text>
</svg>
