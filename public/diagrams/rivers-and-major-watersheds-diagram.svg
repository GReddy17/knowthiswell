<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="watershedTitle">
  <title id="watershedTitle">Cross-section of two mountain slopes meeting at a drainage divide, with tributaries feeding two separate river systems</title>
  <rect width="640" height="360" fill="#FBF8F1"/>

  <path d="M 20,300 L 320,60 L 620,300 Z" fill="#EEF3EE" stroke="#E3DCC9"/>
  <text x="320" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8B6F4E">drainage divide (ridge)</text>

  <!-- left slope tributaries -->
  <path d="M 250,120 L 200,300" stroke="#2C4A3E" stroke-width="3" fill="none"/>
  <path d="M 180,180 L 220,220" stroke="#2C4A3E" stroke-width="2" fill="none"/>
  <path d="M 130,240 L 205,265" stroke="#2C4A3E" stroke-width="2" fill="none"/>

  <!-- right slope tributaries -->
  <path d="M 390,120 L 440,300" stroke="#2C4A3E" stroke-width="3" fill="none"/>
  <path d="M 460,180 L 420,220" stroke="#2C4A3E" stroke-width="2" fill="none"/>
  <path d="M 510,240 L 435,265" stroke="#2C4A3E" stroke-width="2" fill="none"/>

  <path d="M 20,300 L 130,300" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrowW)"/>
  <path d="M 620,300 L 510,300" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrowE)"/>

  <text x="120" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">River system A</text>
  <text x="520" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">River system B</text>

  <defs>
    <marker id="arrowW" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#8B6F4E"/></marker>
    <marker id="arrowE" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/></marker>
  </defs>

  <text x="320" y="340" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Rain on each side of the ridge flows toward a different river system entirely.</text>
</svg>
