<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="numberSetsTitle">
  <title id="numberSetsTitle">Nested set diagram of natural numbers inside whole numbers inside integers inside rational numbers, with irrational numbers alongside, both inside real numbers</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <rect x="20" y="20" width="600" height="380" rx="16" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="40" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">Real numbers</text>

  <rect x="50" y="70" width="260" height="310" rx="14" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="65" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Rational numbers</text>

  <rect x="75" y="115" width="210" height="245" rx="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="90" y="138" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Integers</text>

  <rect x="100" y="158" width="160" height="185" rx="10" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="115" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Whole numbers</text>

  <rect x="120" y="198" width="120" height="120" rx="8" fill="#E3DCC9" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="132" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Natural</text>
  <text x="132" y="236" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">numbers</text>
  <text x="132" y="258" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">1, 2, 3, 4...</text>

  <text x="115" y="300" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">0, 1, 2, 3...</text>
  <text x="90" y="330" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">...-2, -1, 0, 1, 2...</text>
  <text x="65" y="350" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">1/2, 0.75, -3/4...</text>

  <rect x="340" y="70" width="260" height="310" rx="14" fill="#F6F0E8" stroke="#C9412C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="355" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Irrational numbers</text>
  <text x="355" y="200" font-family="ui-monospace, monospace" font-size="13" fill="#4A443C">π = 3.14159...</text>
  <text x="355" y="222" font-family="ui-monospace, monospace" font-size="13" fill="#4A443C">√2 = 1.41421...</text>
  <text x="355" y="244" font-family="ui-monospace, monospace" font-size="13" fill="#4A443C">e = 2.71828...</text>
  <text x="355" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8B6F4E">Never a fraction of</text>
  <text x="355" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8B6F4E">two integers — decimal</text>
  <text x="355" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8B6F4E">never ends or repeats.</text>
</svg>
