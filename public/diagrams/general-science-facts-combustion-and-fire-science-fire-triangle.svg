<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fireTriangleTitle">
  <title id="fireTriangleTitle">A triangle with sides labeled fuel, oxygen, and heat converging on a central flame, extended with a fourth face labeled uninhibited chemical chain reaction folding the triangle into a tetrahedron around the same flame</title>

  <rect x="0" y="0" width="640" height="440" fill="#FBF8F1"/>
  <text x="320" y="34" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="600" fill="#1F1B16">The Fire Triangle → Fire Tetrahedron</text>

  <!-- left: classic triangle -->
  <g>
    <text x="150" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Fire triangle</text>
    <path d="M 150,90 L 60,240 L 240,240 Z" fill="#EEF3EE" opacity="0.5" stroke="#2C4A3E" stroke-width="2"/>
    <text x="150" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Heat</text>
    <text x="50" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Fuel</text>
    <text x="245" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Oxygen</text>
    <!-- central flame icon -->
    <path d="M 150,150 C 140,170 130,185 145,205 C 135,200 130,190 133,178 C 138,195 155,198 155,180 C 165,190 162,205 150,212 C 170,205 178,185 165,165 C 168,175 160,180 158,172 C 162,158 155,145 150,150 Z" fill="#C9412C"/>
  </g>

  <!-- arrow -->
  <line x1="270" y1="170" x2="330" y2="170" stroke="#4A443C" stroke-width="2"/>
  <path d="M 330,170 L 320,164 L 320,176 Z" fill="#4A443C"/>

  <!-- right: tetrahedron -->
  <g>
    <text x="480" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Fire tetrahedron</text>
    <!-- back face (fourth face, chain reaction) -->
    <path d="M 480,90 L 380,260 L 580,260 Z" fill="#FBEDEA" opacity="0.55" stroke="#C9412C" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- front two visible faces implied by lines from apex -->
    <path d="M 480,90 L 440,270" stroke="#2C4A3E" stroke-width="1.5"/>
    <path d="M 480,90 L 520,270" stroke="#2C4A3E" stroke-width="1.5"/>
    <line x1="440" y1="270" x2="520" y2="270" stroke="#2C4A3E" stroke-width="1.5"/>

    <text x="480" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Heat</text>
    <text x="415" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Fuel</text>
    <text x="548" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Oxygen</text>
    <text x="480" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#C9412C" font-weight="600">Uninhibited chemical</text>
    <text x="480" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#C9412C" font-weight="600">chain reaction</text>

    <!-- central flame -->
    <path d="M 480,150 C 470,170 460,185 475,205 C 465,200 460,190 463,178 C 468,195 485,198 485,180 C 495,190 492,205 480,212 C 500,205 508,185 495,165 C 498,175 490,180 488,172 C 492,158 485,145 480,150 Z" fill="#C9412C"/>
  </g>

  <line x1="60" y1="330" x2="580" y2="330" stroke="#E3DCC9" stroke-width="1"/>
  <text x="320" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Remove fuel, oxygen, or heat and a fire can't start or continue.</text>
  <text x="320" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Once burning, some extinguishers instead interrupt the fourth face —</text>
  <text x="320" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">the chain reaction itself.</text>
</svg>
