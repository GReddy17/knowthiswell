<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="esgPillarsTitle">
  <title id="esgPillarsTitle">Three vertical pillar boxes labeled Environmental, Social, and Governance, each listing example metrics: Environmental lists carbon emissions and water usage, Social lists labor practices and community impact, Governance lists board independence and executive accountability, with a connecting base labeled Standardized Reporting Frameworks (GRI, TCFD, ISSB).</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <rect x="50" y="30" width="200" height="150" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Environmental</text>
  <text x="150" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Carbon emissions</text>
  <text x="150" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Water usage</text>
  <text x="150" y="121" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Waste &amp; recycling</text>

  <rect x="290" y="30" width="200" height="150" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Social</text>
  <text x="390" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Labor practices</text>
  <text x="390" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Community impact</text>
  <text x="390" y="121" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Supply chain audits</text>

  <rect x="530" y="30" width="200" height="150" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="630" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Governance</text>
  <text x="630" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Board independence</text>
  <text x="630" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Executive accountability</text>
  <text x="630" y="121" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Pay structure</text>

  <rect x="50" y="220" width="680" height="50" rx="8" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="390" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Standardized Reporting Frameworks (GRI, TCFD, ISSB)</text>

  <line x1="150" y1="180" x2="150" y2="220" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="390" y1="180" x2="390" y2="220" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="630" y1="180" x2="630" y2="220" stroke="#2C4A3E" stroke-width="1.5"/>
</svg>
