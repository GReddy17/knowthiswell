<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="forgettingCurveTitle">
  <title id="forgettingCurveTitle">A line graph showing memory retention on the vertical axis and time on the horizontal axis, with a first curve dropping steeply from near 100 percent and leveling off around 20 percent, then a review point that resets the curve higher and flatter, and a second, even flatter curve after a second review, illustrating that each relearning event reduces the future decay rate.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <line x1="60" y1="30" x2="60" y2="260" stroke="#4A443C" stroke-width="1.5"/>
  <line x1="60" y1="260" x2="740" y2="260" stroke="#4A443C" stroke-width="1.5"/>
  <text x="30" y="35" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">100%</text>
  <text x="30" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">50%</text>
  <text x="30" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">0%</text>
  <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Time since learning</text>

  <path d="M60,35 C120,80 160,150 260,190" fill="none" stroke="#B5493A" stroke-width="2.5"/>
  <text x="150" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">first curve — steep drop</text>

  <circle cx="260" cy="190" r="6" fill="#2C4A3E"/>
  <line x1="260" y1="190" x2="260" y2="260" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="260" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#2C4A3E">review 1</text>

  <path d="M260,190 L270,75 C340,110 400,150 470,175" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="360" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2C4A3E">flatter curve after review 1</text>

  <circle cx="470" cy="175" r="6" fill="#2C4A3E"/>
  <line x1="470" y1="175" x2="470" y2="260" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="470" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#2C4A3E">review 2</text>

  <path d="M470,175 L478,60 C560,80 650,105 730,120" fill="none" stroke="#8B6F4E" stroke-width="2.5"/>
  <text x="600" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">even flatter curve after review 2</text>

  <text x="390" y="305" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Each relearning event resets retention higher and slows the decay that follows it.</text>
</svg>
