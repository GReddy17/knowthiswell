<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="voteTitle">
  <title id="voteTitle">Three side-by-side panels showing the same set of votes (Candidate A 40%, B 35%, C 25%) processed under three systems. First-past-the-post panel shows A winning outright. Ranked-choice panel shows C eliminated and votes redistributed, with B potentially winning the final round. Proportional representation panel shows seats split roughly 40/35/25 among the three, with no outright majority.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="20" y="20" width="230" height="280" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="135" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">First-Past-The-Post</text>
  <text x="135" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">A: 40%  B: 35%  C: 25%</text>
  <rect x="45" y="130" width="180" height="36" fill="#EDE7D8" stroke="#B5493A" stroke-width="2"/>
  <text x="135" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">A wins outright</text>
  <text x="135" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Winner needs only</text>
  <text x="135" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">the most votes</text>

  <rect x="275" y="20" width="230" height="280" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Ranked-Choice</text>
  <text x="390" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">C eliminated (last place)</text>
  <text x="390" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">votes redistributed</text>
  <rect x="315" y="130" width="150" height="36" fill="#EDE7D8" stroke="#B5493A" stroke-width="2"/>
  <text x="390" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">B may now win</text>
  <text x="390" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Winner guaranteed</text>
  <text x="390" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">true majority</text>

  <rect x="530" y="20" width="230" height="280" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="645" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Proportional Rep.</text>
  <rect x="555" y="70" width="180" height="24" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
  <text x="645" y="87" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">A: ~40 seats</text>
  <rect x="555" y="98" width="180" height="24" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1"/>
  <text x="645" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">B: ~35 seats</text>
  <rect x="555" y="126" width="180" height="24" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1"/>
  <text x="645" y="143" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">C: ~25 seats</text>
  <text x="645" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">No outright majority —</text>
  <text x="645" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">coalition likely needed</text>
</svg>
