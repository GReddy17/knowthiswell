<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mbpsTitle">
  <title id="mbpsTitle">A diagram showing a 100 megabit-per-second internet plan represented as eight small bit blocks per byte, divided by 8 to yield 12.5 megabytes per second, the actual download speed a file-transfer progress bar will show.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="30" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">"100 Mbps" plan, converted to what your download bar shows</text>

  <rect x="30" y="60" width="300" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="180" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">100 Mbps</text>
  <text x="180" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">100 megabits per second (ISP-advertised)</text>

  <text x="360" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">÷ 8</text>

  <rect x="400" y="60" width="300" height="70" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="550" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">12.5 MB/s</text>
  <text x="550" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">megabytes per second (download bar)</text>

  <!-- 8 bit blocks = 1 byte illustration -->
  <text x="30" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">1 byte = 8 bits:</text>
  <g>
    <rect x="150" y="152" width="22" height="22" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4"/>
    <rect x="176" y="152" width="22" height="22" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4"/>
    <rect x="202" y="152" width="22" height="22" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4"/>
    <rect x="228" y="152" width="22" height="22" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4"/>
    <rect x="254" y="152" width="22" height="22" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4"/>
    <rect x="280" y="152" width="22" height="22" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4"/>
    <rect x="306" y="152" width="22" height="22" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4"/>
    <rect x="332" y="152" width="22" height="22" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4"/>
  </g>
  <text x="30" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">ISPs and network hardware measure in bits (lowercase b); file sizes and download bars are measured in bytes (capital B) — an 8x gap.</text>
</svg>
