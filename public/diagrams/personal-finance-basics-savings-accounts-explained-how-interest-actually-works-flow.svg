<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="savAcctFlowTitle">
  <title id="savAcctFlowTitle">A flow diagram showing a depositor placing money into a bank, the bank lending most of that money out as mortgages and other loans to borrowers who pay the bank interest, and the bank returning a smaller share of that interest back to the original depositor as savings account interest, with FDIC insurance shown as a shield protecting the depositor's covered balance.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <rect x="20" y="90" width="130" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Depositor</text>
  <text x="85" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">deposits funds</text>

  <line x1="150" y1="120" x2="270" y2="120" stroke="#2C4A3E" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="270" y="90" width="130" height="60" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="335" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Bank</text>

  <line x1="400" y1="105" x2="520" y2="60" stroke="#2C4A3E" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="520" y="30" width="150" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="595" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Borrowers</text>
  <text x="595" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">(mortgages, loans)</text>

  <line x1="520" y1="75" x2="400" y2="115" stroke="#B5493A" stroke-width="2" marker-end="url(#a3)"/>
  <text x="465" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5493A">loan interest</text>

  <line x1="335" y1="150" x2="335" y2="200" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="335" y1="200" x2="150" y2="200" stroke="#2C4A3E" stroke-width="2" marker-end="url(#a2)"/>
  <text x="240" y="190" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">share of interest paid back</text>

  <circle cx="85" cy="200" r="26" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">FDIC</text>
  <text x="85" y="209" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">insured</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/></marker>
  </defs>
</svg>
