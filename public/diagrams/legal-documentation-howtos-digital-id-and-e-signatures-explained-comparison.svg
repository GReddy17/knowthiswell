<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="640" height="230" fill="#FBF8F1"/>

  <rect x="40" y="30" width="240" height="150" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="160" y="58" text-anchor="middle" font-size="14" fill="#1F1B16" font-weight="700">E-signature</text>
  <text x="160" y="90" text-anchor="middle" font-size="12" fill="#1F1B16">Did this person</text>
  <text x="160" y="107" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">intend to sign</text>
  <text x="160" y="124" text-anchor="middle" font-size="12" fill="#1F1B16">this document?</text>

  <rect x="360" y="30" width="240" height="150" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#1F1B16" font-weight="700">Digital ID</text>
  <text x="480" y="90" text-anchor="middle" font-size="12" fill="#1F1B16">Is this person</text>
  <text x="480" y="107" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="600">who they claim</text>
  <text x="480" y="124" text-anchor="middle" font-size="12" fill="#1F1B16">to be?</text>

  <path d="M280 105 H360" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="210" text-anchor="middle" font-size="11" fill="#4A443C">Often combined — but legally distinct questions</text>
</svg>
