<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hazardBarTitle">
  <title id="hazardBarTitle">A horizontal bar chart comparing four home injury categories by relative frequency: falls shown as the longest bar, followed by cuts, then burns, then poisoning shown as the shortest bar, illustrating that falls disproportionately outrank the other categories</title>
  <rect width="700" height="300" fill="#FBF8F1"/>

  <text x="120" y="55" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Falls</text>
  <rect x="130" y="35" width="500" height="35" fill="#B5493A"/>

  <text x="120" y="110" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Cuts</text>
  <rect x="130" y="90" width="300" height="35" fill="#2C4A3E"/>

  <text x="120" y="165" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Burns</text>
  <rect x="130" y="145" width="200" height="35" fill="#2C4A3E"/>

  <text x="120" y="220" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Poisoning</text>
  <rect x="130" y="200" width="120" height="35" fill="#2C4A3E"/>

  <text x="350" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Relative frequency (illustrative, not to precise scale)</text>
</svg>
