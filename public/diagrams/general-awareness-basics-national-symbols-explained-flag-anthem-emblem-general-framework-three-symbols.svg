<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="threeSymbolsTitle">
  <title id="threeSymbolsTitle">Three side-by-side boxes labeled Flag, Anthem, and State Emblem, each with its own arrow pointing down to a separate box reading 'own adopting law', illustrating that each national symbol is independently codified rather than bundled together</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <!-- Flag column -->
  <rect x="40" y="40" width="200" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="140" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1F1B16">Flag</text>
  <line x1="140" y1="110" x2="140" y2="150" stroke="#4A443C" stroke-width="2"/>
  <polygon points="140,158 134,146 146,146" fill="#4A443C"/>
  <rect x="40" y="160" width="200" height="60" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="140" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Own flag law</text>
  <text x="140" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">colors, proportions, blazon</text>

  <!-- Anthem column -->
  <rect x="290" y="40" width="200" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1F1B16">Anthem</text>
  <line x1="390" y1="110" x2="390" y2="150" stroke="#4A443C" stroke-width="2"/>
  <polygon points="390,158 384,146 396,146" fill="#4A443C"/>
  <rect x="290" y="160" width="200" height="60" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Own anthem law</text>
  <text x="390" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">lyrics, designated verse</text>

  <!-- Emblem column -->
  <rect x="540" y="40" width="200" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="640" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F1B16">State</text>
  <text x="640" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F1B16">Emblem</text>
  <line x1="640" y1="110" x2="640" y2="150" stroke="#4A443C" stroke-width="2"/>
  <polygon points="640,158 634,146 646,146" fill="#4A443C"/>
  <rect x="540" y="160" width="200" height="60" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="640" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Own emblem law</text>
  <text x="640" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">seal, coat of arms design</text>

  <text x="390" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4A443C">Each symbol can be introduced, amended, or replaced independently — on its own legislative timeline.</text>
</svg>
