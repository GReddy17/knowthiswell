<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oppCostTitle">
  <title id="oppCostTitle">Two vertical bars side by side. The left bar, labeled 30 years, rises to approximately 3806 dollars. The right bar, labeled 15 years, rises to approximately 1379 dollars. Both bars start from the same 500 dollar baseline marked with a dashed line, illustrating that the same initial purchase amount has a much larger opportunity cost the longer it would have otherwise compounded.</title>
  <rect width="620" height="340" fill="#FBF8F1"/>

  <!-- baseline -->
  <line x1="60" y1="270" x2="560" y2="270" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="60" y1="235" x2="560" y2="235" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="565" y="239" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">$500 baseline</text>

  <!-- Bar 1: 30 years -->
  <rect x="150" y="60" width="110" height="210" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="205" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">$3,806</text>
  <text x="205" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">30 years</text>

  <!-- Bar 2: 15 years -->
  <rect x="360" y="196" width="110" height="74" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="415" y="181" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">$1,379</text>
  <text x="415" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">15 years</text>

  <text x="310" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Same $500 purchase — the only difference is how many years it would have compounded at 7%.</text>
</svg>
