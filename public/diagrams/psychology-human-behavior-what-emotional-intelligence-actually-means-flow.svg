<svg viewBox="0 0 560 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eiTitle">
  <title id="eiTitle">The four branches of emotional intelligence in the Mayer-Salovey ability model: 1 perceive emotions, 2 use emotions to help thinking, 3 understand how emotions blend and change, 4 manage emotions in yourself and others. A side panel contrasts ability tests, which have better and worse answers, with self-report questionnaires, which capture how you rate yourself and overlap with personality.</title>
  <rect width="560" height="470" fill="#FBF8F1"/>
  <text x="280" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">The four branches of emotional intelligence</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="30" y="50" width="300" height="56" rx="6" fill="#2C4A3E"/>
    <text x="180" y="73" font-size="12" font-weight="700" fill="#FBF8F1">1. Perceive</text>
    <text x="180" y="91" font-size="11" fill="#FBF8F1">read emotion in faces, voices and yourself</text>
    <text x="180" y="124" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="30" y="132" width="300" height="56" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="180" y="155" font-size="12" font-weight="700" fill="#1F1B16">2. Use</text>
    <text x="180" y="173" font-size="11" fill="#4A443C">match mood to the task (calm for checking)</text>
    <text x="180" y="206" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="30" y="214" width="300" height="56" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="180" y="237" font-size="12" font-weight="700" fill="#1F1B16">3. Understand</text>
    <text x="180" y="255" font-size="11" fill="#4A443C">how emotions blend, grow and change</text>
    <text x="180" y="288" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="30" y="296" width="300" height="56" rx="6" fill="#8B6F4E"/>
    <text x="180" y="319" font-size="12" font-weight="700" fill="#FBF8F1">4. Manage</text>
    <text x="180" y="337" font-size="11" fill="#FBF8F1">regulate your own, influence others&apos;</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="350" y="50" width="185" height="140" rx="6" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="442" y="72" font-size="12" font-weight="700" fill="#2C4A3E">Ability test</text>
    <text x="442" y="92" font-size="10" fill="#4A443C">e.g. MSCEIT, 141 items</text>
    <text x="442" y="108" font-size="10" fill="#4A443C">better and worse answers</text>
    <text x="442" y="124" font-size="10" fill="#4A443C">measures actual skill</text>
    <text x="442" y="148" font-size="10" fill="#4A443C">link to job performance:</text>
    <text x="442" y="164" font-size="10" font-weight="700" fill="#2C4A3E">modest, stronger in</text>
    <text x="442" y="178" font-size="10" font-weight="700" fill="#2C4A3E">emotion-heavy jobs</text>
    <rect x="350" y="212" width="185" height="140" rx="6" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="442" y="234" font-size="12" font-weight="700" fill="#8B6F4E">Self-report survey</text>
    <text x="442" y="254" font-size="10" fill="#4A443C">&quot;How good am I at...?&quot;</text>
    <text x="442" y="270" font-size="10" fill="#4A443C">captures confidence and</text>
    <text x="442" y="286" font-size="10" fill="#4A443C">self-image</text>
    <text x="442" y="310" font-size="10" fill="#4A443C">overlaps heavily with</text>
    <text x="442" y="326" font-size="10" font-weight="700" fill="#8B6F4E">personality traits</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">
    <rect x="20" y="378" width="520" height="70" rx="6" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="280" y="402" fill="#4A443C">Each branch builds on the one above: you can&apos;t manage what you haven&apos;t noticed.</text>
    <text x="280" y="424" fill="#4A443C">Given an &quot;EQ score&quot;, ask which kind of test produced it.</text>
    <text x="280" y="440" font-size="10" fill="#8B6F4E">Sources: Salovey &amp; Mayer 1990; Joseph &amp; Newman 2010</text>
  </g>
</svg>
