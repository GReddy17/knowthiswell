<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pmTitle">
  <title id="pmTitle">Profit margin waterfall for a hypothetical bakery: $20,000 revenue; minus $7,000 cost of goods sold leaves $13,000 gross profit, a 65% gross margin; minus $11,000 operating expenses leaves $2,000 operating income, a 10% operating margin; minus $600 interest and tax leaves $1,400 net income, a 7% net margin. Side note: cost $10, price $15 is a 50% markup but a 33% margin.</title>
  <rect width="660" height="340" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="250" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">Following $20,000 of revenue down the page</text>
    <line x1="40" y1="270" x2="470" y2="270" stroke="#4A443C" stroke-width="1.5"/>
    <!-- scale: 200px = $20,000 => 0.01 px per $ ; baseline y=270 -->
    <rect x="50" y="70" width="70" height="200" fill="#4A443C"/>
    <text x="85" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">$20,000</text>
    <text x="85" y="288" text-anchor="middle" font-size="11" fill="#1F1B16">Revenue</text>

    <rect x="135" y="70" width="70" height="70" fill="#B5552B" opacity="0.85"/>
    <text x="170" y="62" text-anchor="middle" font-size="11" fill="#B5552B">−$7,000</text>
    <text x="170" y="288" text-anchor="middle" font-size="11" fill="#1F1B16">Ingredients</text>
    <text x="170" y="301" text-anchor="middle" font-size="10" fill="#4A443C">(COGS)</text>

    <rect x="220" y="140" width="70" height="130" fill="#8B6F4E"/>
    <text x="255" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">$13,000</text>
    <text x="255" y="288" text-anchor="middle" font-size="11" fill="#1F1B16">Gross profit</text>
    <text x="255" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">65%</text>

    <rect x="305" y="140" width="70" height="110" fill="#B5552B" opacity="0.85"/>
    <text x="340" y="132" text-anchor="middle" font-size="11" fill="#B5552B">−$11,000</text>
    <text x="340" y="288" text-anchor="middle" font-size="11" fill="#1F1B16">Rent, wages,</text>
    <text x="340" y="301" text-anchor="middle" font-size="10" fill="#4A443C">running costs</text>

    <rect x="390" y="250" width="35" height="20" fill="#2C4A3E"/>
    <text x="407" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">$2,000</text>
    <text x="407" y="288" text-anchor="middle" font-size="11" fill="#1F1B16">Operating</text>
    <text x="407" y="301" text-anchor="middle" font-size="10" fill="#2C4A3E">10%</text>

    <rect x="432" y="256" width="35" height="14" fill="#2C4A3E" opacity="0.7"/>
    <text x="450" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">$1,400</text>
    <text x="450" y="239" text-anchor="middle" font-size="9" fill="#4A443C">after $600</text>
    <text x="450" y="314" text-anchor="middle" font-size="11" fill="#1F1B16">Net</text>
    <text x="450" y="327" text-anchor="middle" font-size="10" fill="#2C4A3E">7%</text>

    <rect x="492" y="60" width="152" height="196" rx="8" fill="#FFFFFF" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="568" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Margin vs markup</text>
    <text x="568" y="104" text-anchor="middle" font-size="11" fill="#4A443C">cost $10, price $15,</text>
    <text x="568" y="119" text-anchor="middle" font-size="11" fill="#4A443C">profit $5</text>
    <text x="568" y="146" text-anchor="middle" font-size="11" fill="#1F1B16">markup = 5 ÷ 10</text>
    <text x="568" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#8B6F4E">50%</text>
    <text x="568" y="190" text-anchor="middle" font-size="11" fill="#1F1B16">margin = 5 ÷ 15</text>
    <text x="568" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4A3E">33%</text>
    <text x="568" y="236" text-anchor="middle" font-size="10" fill="#4A443C">price = cost ÷ (1 − margin)</text>
  </g>
  <text x="568" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Hypothetical bakery,</text>
  <text x="568" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">one month. Every margin</text>
  <text x="568" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">= profit ÷ revenue.</text>
</svg>
