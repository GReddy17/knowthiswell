<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="growthCurveTitle">
  <title id="growthCurveTitle">Line graph of bacterial population on a log scale against time, showing four phases in sequence: a flat Lag Phase, a steeply rising Exponential Phase where doubling time applies, a flattening Stationary Phase, and a declining Death Phase</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- phase background bands -->
  <g opacity="0.5">
    <rect x="80" y="40" width="80" height="300" fill="#EDE7D8"/>
    <rect x="160" y="40" width="220" height="300" fill="#EEF3EE"/>
    <rect x="380" y="40" width="100" height="300" fill="#DCE7DE"/>
    <rect x="480" y="40" width="120" height="300" fill="#FBEDEA"/>
  </g>

  <!-- axes -->
  <line x1="80" y1="340" x2="600" y2="340" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="80" y2="40" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M 600,340 L 590,335 L 590,345 Z" fill="#1F1B16"/>
  <path d="M 80,40 L 75,50 L 85,50 Z" fill="#1F1B16"/>
  <text x="600" y="365" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4A443C">Time →</text>
  <text x="60" y="40" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4A443C" transform="rotate(-90 60 40)">Population (log scale) →</text>

  <!-- growth curve -->
  <path d="M 80,300 C 120,300 140,300 160,296 C 220,270 300,110 380,85 C 420,78 460,80 480,90 C 520,112 560,190 600,230"
        fill="none" stroke="#2C4A3E" stroke-width="2.5"/>

  <!-- phase boundary markers -->
  <g stroke="#8B6F4E" stroke-width="1" stroke-dasharray="3 3">
    <line x1="160" y1="340" x2="160" y2="40"/>
    <line x1="380" y1="340" x2="380" y2="40"/>
    <line x1="480" y1="340" x2="480" y2="40"/>
  </g>

  <!-- phase labels -->
  <text x="120" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Lag Phase</text>
  <text x="270" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Exponential Phase</text>
  <text x="430" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Stationary Phase</text>
  <text x="540" y="358" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Death Phase</text>

  <!-- annotation for doubling time -->
  <circle cx="255" cy="185" r="4" fill="#C9412C"/>
  <path d="M 260,182 L 300,155" stroke="#C9412C" stroke-width="1" fill="none"/>
  <text x="304" y="152" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8B4A3A">Doubling time applies here</text>
</svg>
