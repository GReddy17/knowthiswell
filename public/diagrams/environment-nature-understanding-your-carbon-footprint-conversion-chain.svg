<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carbonFootprintTitle">
  <title id="carbonFootprintTitle">A horizontal flow diagram showing a box labeled 150 miles driven, multiplied by a box labeled emission factor 0.39 kilograms CO2 per mile, equaling a result box labeled approximately 58.5 kilograms CO2 equivalent, illustrating that a carbon footprint calculation is the same multiply-by-a-fixed-factor operation used in any unit conversion.</title>
  <rect width="720" height="220" fill="#FBF8F1"/>

  <rect x="20" y="70" width="180" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">150 miles</text>
  <text x="110" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">driven this week</text>

  <text x="222" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">×</text>

  <rect x="244" y="60" width="220" height="110" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="354" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Emission factor</text>
  <text x="354" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#B5493A">0.39 kg CO2</text>
  <text x="354" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">per mile (EPA avg.)</text>

  <text x="490" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">=</text>

  <rect x="512" y="65" width="190" height="100" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="607" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">≈ 58.5 kg</text>
  <text x="607" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">CO2 equivalent</text>
  <text x="607" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">for the week</text>

  <text x="360" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Same mechanic as any unit conversion — activity amount × published emission factor.</text>
</svg>
