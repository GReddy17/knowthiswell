<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of defining global events of the 2010s: the Arab Spring beginning in Tunisia in December 2010 and spreading across the Middle East and North Africa through 2011-2012, the Japan earthquake, tsunami, and Fukushima nuclear disaster in March 2011, the Paris Agreement on climate change adopted in December 2015, and the United Kingdom's Brexit referendum in June 2016</title>
  <rect width="780" height="220" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="390" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">Uprisings, disaster, and two watershed votes</text>

    <rect x="40" y="110" width="160" height="40" fill="#EEF3EE"/>
    <text x="120" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Arab Spring begins</text>
    <text x="120" y="133" text-anchor="middle" font-size="9" fill="#4A443C">spreads across MENA 2011–12</text>
    <text x="120" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">Dec 2010</text>

    <rect x="200" y="110" width="205" height="40" fill="#FBEDEA"/>
    <text x="302" y="93" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Japan earthquake &amp; tsunami</text>
    <text x="302" y="107" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Fukushima nuclear disaster</text>
    <text x="302" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">Mar 2011</text>

    <rect x="405" y="110" width="175" height="40" fill="#EDE7D8"/>
    <text x="492" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Paris Agreement adopted</text>
    <text x="492" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">Dec 2015</text>

    <rect x="580" y="110" width="160" height="40" fill="#EEF3EE"/>
    <text x="660" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Brexit referendum</text>
    <text x="660" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">Jun 2016</text>
  </g>
  <rect x="40" y="110" width="700" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="200" y1="110" x2="200" y2="150" stroke="#1F1B16"/>
  <line x1="405" y1="110" x2="405" y2="150" stroke="#1F1B16"/>
  <line x1="580" y1="110" x2="580" y2="150" stroke="#1F1B16"/>
</svg>
