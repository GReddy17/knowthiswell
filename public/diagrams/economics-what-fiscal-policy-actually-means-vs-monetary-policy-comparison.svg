<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fiscalVsMonetaryTitle">
  <title id="fiscalVsMonetaryTitle">Fiscal policy is government taxing and spending, decided by the legislature. Monetary policy is interest rates and money supply, decided by the central bank.</title>
  <rect width="560" height="320" fill="#FBF8F1"/>
  <text x="150" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Fiscal policy</text>
  <rect x="40" y="50" width="220" height="160" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="60" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Tools: taxing &amp; spending</text>
  <text x="60" y="105" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Set by: the legislature</text>
  <text x="60" y="123" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">(elected, e.g. Congress)</text>
  <text x="60" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Speed: slow — needs a</text>
  <text x="60" y="168" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">passed law</text>
  <text x="60" y="193" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Example: a stimulus bill</text>
  <text x="410" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8B6F4E">Monetary policy</text>
  <rect x="300" y="50" width="220" height="160" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="320" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Tools: interest rates &amp;</text>
  <text x="320" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">money supply</text>
  <text x="320" y="123" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Set by: the central bank</text>
  <text x="320" y="141" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">(e.g. the Federal Reserve)</text>
  <text x="320" y="166" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Speed: faster — set at</text>
  <text x="320" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">scheduled meetings</text>
  <text x="320" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Example: a rate change</text>
  <text x="280" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Both aim to manage inflation, growth, and employment — differently</text>
</svg>
