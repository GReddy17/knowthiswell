<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recipeScaleFlowTitle">
  <title id="recipeScaleFlowTitle">A flowchart starting from a box labeled Original recipe (servings, ingredients, time) branching into two paths: one path labeled Bulk ingredients (flour, sugar, liquid) leading to a box that says multiply directly by scale factor, and another path labeled Spices, salt, leavening, and cooking time leading to a box that says adjust by less than the scale factor and verify by taste or doneness test, with both paths converging into a final box labeled Scaled recipe</title>
  <rect width="640" height="440" fill="#FBF8F1"/>

  <defs>
    <marker id="rsArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <!-- top box -->
  <rect x="170" y="20" width="300" height="58" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F1B16">Original recipe</text>
  <text x="320" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">(servings, ingredients, time)</text>

  <!-- branch arrows from top box -->
  <path d="M280,78 L165,128" fill="none" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#rsArrow)"/>
  <path d="M360,78 L475,128" fill="none" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#rsArrow)"/>

  <!-- left branch header -->
  <rect x="30" y="130" width="260" height="54" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="160" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Bulk ingredients</text>
  <text x="160" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">(flour, sugar, liquid)</text>

  <!-- right branch header -->
  <rect x="350" y="130" width="260" height="54" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="480" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Spices, salt, leavening,</text>
  <text x="480" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">and cooking time</text>

  <!-- arrows down to action boxes -->
  <line x1="160" y1="184" x2="160" y2="222" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#rsArrow)"/>
  <line x1="480" y1="184" x2="480" y2="222" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#rsArrow)"/>

  <!-- left action box -->
  <rect x="30" y="226" width="260" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="160" y="254" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Multiply directly</text>
  <text x="160" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">by scale factor</text>

  <!-- right action box -->
  <rect x="350" y="226" width="260" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="480" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Adjust by less than</text>
  <text x="480" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">scale factor; verify by</text>
  <text x="480" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">taste or doneness test</text>

  <!-- converging arrows -->
  <path d="M200,296 L280,346" fill="none" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#rsArrow)"/>
  <path d="M440,296 L360,346" fill="none" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#rsArrow)"/>

  <!-- final box -->
  <rect x="170" y="350" width="300" height="58" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="320" y="384" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Scaled recipe</text>
</svg>
