<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pressFreedomTitle">
  <title id="pressFreedomTitle">A flow diagram showing five separate input boxes labeled political context, legal framework, economic context, sociocultural context, and journalist safety, each feeding into a central combining box, which outputs a single composite score and world rank on the right</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">
    <rect x="20" y="15" width="160" height="46" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="100" y="43" text-anchor="middle" font-weight="600">Political context</text>

    <rect x="20" y="70" width="160" height="46" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="100" y="98" text-anchor="middle" font-weight="600">Legal framework</text>

    <rect x="20" y="125" width="160" height="46" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="100" y="153" text-anchor="middle" font-weight="600">Economic context</text>

    <rect x="20" y="180" width="160" height="46" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="100" y="208" text-anchor="middle" font-weight="600">Sociocultural context</text>

    <rect x="20" y="235" width="160" height="46" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="100" y="263" text-anchor="middle" font-weight="600">Journalist safety</text>
  </g>

  <line x1="180" y1="38" x2="330" y2="150" stroke="#4A443C" stroke-width="1.3"/>
  <line x1="180" y1="93" x2="330" y2="155" stroke="#4A443C" stroke-width="1.3"/>
  <line x1="180" y1="148" x2="330" y2="160" stroke="#4A443C" stroke-width="1.3"/>
  <line x1="180" y1="203" x2="330" y2="165" stroke="#4A443C" stroke-width="1.3"/>
  <line x1="180" y1="258" x2="330" y2="170" stroke="#4A443C" stroke-width="1.3"/>

  <rect x="330" y="120" width="150" height="80" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="405" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Combined</text>
  <text x="405" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">assessment</text>

  <line x1="480" y1="160" x2="560" y2="160" stroke="#4A443C" stroke-width="1.6"/>
  <polygon points="560,154 572,160 560,166" fill="#4A443C"/>

  <rect x="590" y="125" width="170" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="675" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Composite score</text>
  <text x="675" y="175" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">and world rank</text>

  <text x="390" y="295" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The single published rank is built from five separately assessed categories, not one raw measurement.</text>
</svg>
