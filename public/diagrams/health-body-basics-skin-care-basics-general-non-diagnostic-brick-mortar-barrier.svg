<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skinBarrierTitle">
  <title id="skinBarrierTitle">A cross-section diagram showing the stratum corneum as rows of flattened brick-shaped cells held together by a lipid mortar layer between them, with an arrow showing water evaporating upward through the barrier labeled transepidermal water loss, and a moisturizer layer shown sitting on top helping slow that evaporation</title>
  <rect width="780" height="280" fill="#FBF8F1"/>

  <rect x="60" y="200" width="660" height="18" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1"/>
  <text x="390" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Living skin layers below</text>

  <g fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.4">
    <rect x="60" y="150" width="150" height="45"/>
    <rect x="215" y="150" width="150" height="45"/>
    <rect x="370" y="150" width="150" height="45"/>
    <rect x="525" y="150" width="150" height="45"/>
    <rect x="135" y="100" width="150" height="45"/>
    <rect x="290" y="100" width="150" height="45"/>
    <rect x="445" y="100" width="150" height="45"/>
    <rect x="60" y="100" width="70" height="45"/>
    <rect x="600" y="100" width="120" height="45"/>
  </g>
  <text x="390" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">cells (bricks), lipid mortar between rows</text>

  <rect x="60" y="70" width="660" height="12" fill="#B5493A" opacity="0.35"/>
  <text x="390" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">Moisturizer layer (slows evaporation)</text>

  <line x1="390" y1="70" x2="390" y2="25" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <text x="500" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">transepidermal water loss</text>
</svg>
