<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="balanceScaleTitle">
  <title id="balanceScaleTitle">Two-pan balance scale shown in three stages solving 3x + 4 = 19: first balanced with three x-blocks plus a 4-weight against a 19-weight, second with 4 removed from both pans leaving three x-blocks against a 15-weight, third with both pans split into three equal groups leaving one x-block against a 5-weight, giving x equals 5</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- Stage 1 -->
  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#20362D">3x + 4 = 19</text>
  <line x1="190" y1="70" x2="450" y2="70" stroke="#1F1B16" stroke-width="3"/>
  <path d="M 320,70 L 305,95 L 335,95 Z" fill="#2C4A3E"/>
  <rect x="311" y="95" width="18" height="9" fill="#2C4A3E"/>
  <line x1="190" y1="70" x2="190" y2="106" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="450" y1="70" x2="450" y2="106" stroke="#1F1B16" stroke-width="1.5"/>
  <ellipse cx="190" cy="118" rx="52" ry="13" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
  <ellipse cx="450" cy="118" rx="52" ry="13" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
  <g>
    <rect x="141" y="86" width="18" height="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="150" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">x</text>
    <rect x="171" y="86" width="18" height="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="180" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">x</text>
    <rect x="201" y="86" width="18" height="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="210" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">x</text>
    <circle cx="234" cy="95" r="14" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
    <text x="234" y="99" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C9412C">4</text>
  </g>
  <circle cx="450" cy="97" r="16" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="450" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#C9412C">19</text>

  <text x="70" y="165" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Remove 4 from</text>
  <text x="70" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">both pans →</text>

  <!-- Stage 2 -->
  <text x="320" y="167" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#20362D">3x = 15</text>
  <line x1="190" y1="195" x2="450" y2="195" stroke="#1F1B16" stroke-width="3"/>
  <path d="M 320,195 L 305,220 L 335,220 Z" fill="#2C4A3E"/>
  <rect x="311" y="220" width="18" height="9" fill="#2C4A3E"/>
  <line x1="190" y1="195" x2="190" y2="231" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="450" y1="195" x2="450" y2="231" stroke="#1F1B16" stroke-width="1.5"/>
  <ellipse cx="190" cy="243" rx="52" ry="13" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
  <ellipse cx="450" cy="243" rx="52" ry="13" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
  <g>
    <rect x="161" y="211" width="18" height="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="170" y="224" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">x</text>
    <rect x="191" y="211" width="18" height="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="200" y="224" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">x</text>
    <rect x="221" y="211" width="18" height="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="230" y="224" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">x</text>
  </g>
  <circle cx="450" cy="222" r="16" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="450" y="227" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#C9412C">15</text>

  <text x="55" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Split both pans into</text>
  <text x="55" y="305" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">3 equal groups →</text>

  <!-- Stage 3 -->
  <text x="320" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#20362D">x = 5</text>
  <line x1="190" y1="320" x2="450" y2="320" stroke="#1F1B16" stroke-width="3"/>
  <path d="M 320,320 L 305,345 L 335,345 Z" fill="#2C4A3E"/>
  <rect x="311" y="345" width="18" height="9" fill="#2C4A3E"/>
  <line x1="190" y1="320" x2="190" y2="356" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="450" y1="320" x2="450" y2="356" stroke="#1F1B16" stroke-width="1.5"/>
  <ellipse cx="190" cy="368" rx="52" ry="13" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
  <ellipse cx="450" cy="368" rx="52" ry="13" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
  <rect x="181" y="336" width="18" height="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="190" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">x</text>
  <circle cx="450" cy="347" r="16" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="450" y="352" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#C9412C">5</text>
</svg>
