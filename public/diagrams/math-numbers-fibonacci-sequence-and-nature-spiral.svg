  <line x1="328" y1="50" x2="328" y2="420" stroke="#E3DCC9" stroke-width="1.5"/>

  <text x="170" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">Fibonacci squares: 1, 1, 2, 3, 5, 8, 13</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
