    <rect x="130" y="142" width="16" height="16" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1"/>
    <rect x="66" y="190" width="208" height="208" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>

    <text x="106" y="106" text-anchor="middle" font-size="15" fill="#4A443C">5</text>
    <text x="210" y="130" text-anchor="middle" font-size="17" fill="#4A443C">8</text>
    <text x="90" y="170" text-anchor="middle" font-size="13" fill="#4A443C">3</text>
    <text x="130" y="178" text-anchor="middle" font-size="11" fill="#4A443C">2</text>
    <text x="122" y="153" text-anchor="middle" font-size="8" fill="#4A443C">1</text>
    <text x="138" y="153" text-anchor="middle" font-size="8" fill="#4A443C">1</text>
    <text x="170" y="298" text-anchor="middle" font-size="20" fill="#4A443C">13</text>
  </g>

  <path d="M 114,158 A16,16 0 0,1 130,142 A16,16 0 0,1 146,158 A32,32 0 0,1 114,190 A48,48 0 0,1 66,142 A80,80 0 0,1 146,62 A128,128 0 0,1 274,190 A208,208 0 0,1 66,398"
        fill="none" stroke="#C9412C" stroke-width="2"/>

  <text x="170" y="416" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">Each square's side = sum of the two before it</text>

  <text x="460" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">Sunflower seed head (Vogel model)</text>

  <g>
    <line x1="460" y1="230" x2="395.1" y2="209.6" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="460" y1="230" x2="522.8" y2="200.7" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="2 2"/>
