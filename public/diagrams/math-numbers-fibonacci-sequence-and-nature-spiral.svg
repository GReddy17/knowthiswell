  <text x="460" y="424" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">Each new seed rotates 137.5° from the last — the two colored arms show the opposite-turning spiral families this produces</text>
