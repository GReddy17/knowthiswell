<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fibSpiralTitle">
  <title id="fibSpiralTitle">A Fibonacci spiral built from squares with side lengths 1, 1, 2, 3, 5, 8, and 13, with a smooth spiral curve through the squares' corners, alongside a sunflower seed head where new seeds emerge at a repeating 137.5-degree golden angle, producing two families of spirals winding in opposite directions</title>
