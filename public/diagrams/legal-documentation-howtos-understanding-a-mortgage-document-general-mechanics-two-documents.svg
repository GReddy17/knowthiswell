<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="640" height="300" fill="#FBF8F1"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1B16">A mortgage = two linked documents</text>

  <g>
    <rect x="50" y="60" width="230" height="180" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="165" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1B16">Promissory Note</text>
    <text x="165" y="118" text-anchor="middle" font-size="10" fill="#4A443C">Loan amount</text>
    <text x="165" y="136" text-anchor="middle" font-size="10" fill="#4A443C">Interest rate</text>
    <text x="165" y="154" text-anchor="middle" font-size="10" fill="#4A443C">Payment schedule</text>
    <text x="165" y="172" text-anchor="middle" font-size="10" fill="#4A443C">Loan term</text>
    <text x="165" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C4A3E">= the debt</text>
  </g>

  <text x="320" y="155" text-anchor="middle" font-size="20" fill="#B5493A">+</text>

  <g>
    <rect x="360" y="60" width="230" height="180" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
    <text x="475" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1B16">Mortgage / Deed of Trust</text>
    <text x="475" y="118" text-anchor="middle" font-size="10" fill="#4A443C">Property pledged</text>
    <text x="475" y="136" text-anchor="middle" font-size="10" fill="#4A443C">as collateral</text>
    <text x="475" y="164" text-anchor="middle" font-size="10" fill="#4A443C">Right to foreclose</text>
    <text x="475" y="182" text-anchor="middle" font-size="10" fill="#4A443C">on default</text>
    <text x="475" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#B5493A">= the security</text>
  </g>

  <text x="320" y="275" text-anchor="middle" font-size="11" fill="#4A443C">Signed together, but legally distinct — one creates the debt, the other secures it</text>
</svg>
