<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="footprintTitle">
  <title id="footprintTitle">A diagram showing four separate sources of data — browsing history, purchases, social media activity, and location pings from apps — each sending a small trail into a shared central profile. The profile is not created by any one site; it is assembled by matching those separate trails to the same person over time.</title>
  <rect width="800" height="320" fill="#FBF8F1"/>

  <defs>
    <marker id="arrowFp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="30" y="20" width="150" height="46" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="105" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Browsing history</text>
  <text x="105" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">pages visited, searches</text>

  <rect x="30" y="90" width="150" height="46" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="105" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Purchases</text>
  <text x="105" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">orders, receipts, returns</text>

  <rect x="30" y="160" width="150" height="46" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="105" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Social activity</text>
  <text x="105" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">posts, likes, follows</text>

  <rect x="30" y="230" width="150" height="46" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="105" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">App location pings</text>
  <text x="105" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">GPS, wifi network IDs</text>

  <path d="M180,43 L330,120" fill="none" stroke="#2C4A3E" stroke-width="1.3" marker-end="url(#arrowFp)"/>
  <path d="M180,113 L330,140" fill="none" stroke="#2C4A3E" stroke-width="1.3" marker-end="url(#arrowFp)"/>
  <path d="M180,183 L330,160" fill="none" stroke="#2C4A3E" stroke-width="1.3" marker-end="url(#arrowFp)"/>
  <path d="M180,253 L330,180" fill="none" stroke="#2C4A3E" stroke-width="1.3" marker-end="url(#arrowFp)"/>

  <rect x="335" y="90" width="200" height="110" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="435" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Matched, aggregated</text>
  <text x="435" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">profile</text>
  <text x="435" y="166" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">linked by device ID,</text>
  <text x="435" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">account, or ad identifier</text>

  <path d="M535,145 L618,145" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowFp)"/>

  <rect x="620" y="110" width="150" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="695" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Advertiser or</text>
  <text x="695" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">data broker</text>
  <text x="695" y="167" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">buys/sells the profile</text>

  <text x="400" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">No single site sees the whole footprint — it is stitched together after the fact.</text>
</svg>
