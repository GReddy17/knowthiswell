<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medArbTitle">
  <title id="medArbTitle">A comparison diagram of mediation and arbitration. Mediation: a neutral mediator helps both sides negotiate, the outcome is a voluntary agreement, and either side can walk away without a binding result. Arbitration: a neutral arbitrator hears both sides and issues a decision, the outcome is typically binding, and it resembles a private, simplified trial.</title>
  <rect width="620" height="320" fill="#FBF8F1"/>

  <rect x="40" y="30" width="250" height="260" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="165" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Mediation</text>
  <text x="165" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Neutral mediator helps</text>
  <text x="165" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">both sides negotiate</text>
  <text x="165" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Outcome:</text>
  <text x="165" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Voluntary agreement</text>
  <text x="165" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Binding?</text>
  <text x="165" y="223" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Usually not, unless</text>
  <text x="165" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">both sides sign a deal</text>
  <text x="165" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Either side can walk away</text>

  <rect x="330" y="30" width="250" height="260" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="455" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Arbitration</text>
  <text x="455" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Neutral arbitrator hears</text>
  <text x="455" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">both sides, then decides</text>
  <text x="455" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Outcome:</text>
  <text x="455" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Arbitrator's ruling</text>
  <text x="455" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Binding?</text>
  <text x="455" y="223" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Typically yes, with</text>
  <text x="455" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">very limited appeal</text>
  <text x="455" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Resembles a private trial</text>

  <text x="310" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Both are alternatives to filing a lawsuit — the key difference is who controls the outcome.</text>
</svg>
