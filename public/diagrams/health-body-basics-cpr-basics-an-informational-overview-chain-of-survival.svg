<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chainTitle">
  <title id="chainTitle">Five connected links labeled in sequence: early recognition and calling emergency services, early CPR, early defibrillation with an AED, effective advanced life support, and integrated post-arrest care, illustrating that each link depends on the one before it</title>
  <rect width="800" height="220" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="20" y="80" width="130" height="80" rx="40" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="85" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Recognize &amp;</text>
    <text x="85" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Call</text>
    <text x="85" y="142" text-anchor="middle" font-size="10" fill="#4A443C">emergency services</text>

    <text x="163" y="125" text-anchor="middle" font-size="18" fill="#4A443C">→</text>

    <rect x="176" y="80" width="120" height="80" rx="40" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="236" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Early</text>
    <text x="236" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">CPR</text>

    <text x="309" y="125" text-anchor="middle" font-size="18" fill="#4A443C">→</text>

    <rect x="322" y="80" width="130" height="80" rx="40" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="387" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Early</text>
    <text x="387" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Defibrillation</text>
    <text x="387" y="142" text-anchor="middle" font-size="10" fill="#4A443C">(AED)</text>

    <text x="465" y="125" text-anchor="middle" font-size="18" fill="#4A443C">→</text>

    <rect x="478" y="80" width="140" height="80" rx="40" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="548" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Advanced Life</text>
    <text x="548" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Support</text>

    <text x="631" y="125" text-anchor="middle" font-size="18" fill="#4A443C">→</text>

    <rect x="644" y="80" width="135" height="80" rx="40" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="711" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Post-Arrest</text>
    <text x="711" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Care</text>
  </g>
  <text x="400" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each link depends on the one before it — CPR alone is a bridge, not a substitute for the links that follow.</text>
</svg>
