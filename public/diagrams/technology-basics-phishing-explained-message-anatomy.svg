<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phishAnatomyTitle">
  <title id="phishAnatomyTitle">An annotated diagram of a fake email showing four common warning signs: a sender address that looks close to a real company's domain but is not an exact match, an urgent subject line designed to prevent careful thought, a generic greeting instead of the recipient's real name, and a link whose visible text does not match its actual underlying web address.</title>
  <rect width="800" height="340" fill="#FBF8F1"/>

  <rect x="230" y="20" width="360" height="230" rx="6" fill="#FFFFFF" stroke="#E3DCC9" stroke-width="2"/>

  <rect x="230" y="20" width="360" height="34" rx="6" fill="#F7F1E5"/>
  <text x="245" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">From: security@bank-example-secure.com</text>

  <text x="245" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Subject: Urgent — verify your account in 24 hours</text>

  <text x="245" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Dear Customer,</text>
  <text x="245" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">We detected unusual activity. Click below</text>
  <text x="245" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">now to confirm your identity or your</text>
  <text x="245" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">account will be suspended.</text>

  <text x="245" y="190" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2C4A3E" text-decoration="underline">Verify My Account</text>

  <text x="245" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">(actual link target, hidden by the display text above:</text>
  <text x="245" y="236" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">http://secure-login-verify.example.net/auth)</text>

  <!-- Callouts -->
  <line x1="230" y1="37" x2="60" y2="37" stroke="#C9412C" stroke-width="1.5"/>
  <text x="55" y="32" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C9412C">Sender domain looks close</text>
  <text x="55" y="46" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C9412C">but doesn&#8217;t match exactly</text>

  <line x1="590" y1="68" x2="740" y2="68" stroke="#C9412C" stroke-width="1.5"/>
  <text x="745" y="63" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C9412C">Manufactured urgency</text>
  <text x="745" y="77" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C9412C">to stop careful thought</text>

  <line x1="230" y1="103" x2="60" y2="103" stroke="#C9412C" stroke-width="1.5"/>
  <text x="55" y="98" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C9412C">Generic greeting, not</text>
  <text x="55" y="112" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C9412C">your real name</text>

  <line x1="590" y1="228" x2="740" y2="228" stroke="#C9412C" stroke-width="1.5"/>
  <text x="745" y="210" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C9412C">Visible link text hides a</text>
  <text x="745" y="224" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#C9412C">different real destination</text>

  <text x="400" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Phishing exploits trust in a familiar sender, not a technical flaw in your device.</text>
</svg>
