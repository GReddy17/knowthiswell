<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flagShapesTitle">
  <title id="flagShapesTitle">Three flag outlines side by side for comparison: a standard 2:3 rectangular flag outline labeled most countries, a 1:1 square flag outline labeled Switzerland and Vatican City, and Nepal's distinctive two-triangle stacked pennant outline labeled Nepal, the only non-rectangular national flag</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Flag shapes and proportions compared</text>

  <!-- Flag 1: standard 2:3 rectangle -->
  <g>
    <rect x="45" y="120" width="180" height="120" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <line x1="45" y1="270" x2="45" y2="286" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="225" y1="270" x2="225" y2="286" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="45" y1="278" x2="225" y2="278" stroke="#8B6F4E" stroke-width="1"/>
    <text x="135" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">width 3</text>

    <line x1="30" y1="120" x2="14" y2="120" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="30" y1="240" x2="14" y2="240" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="22" y1="120" x2="22" y2="240" stroke="#8B6F4E" stroke-width="1"/>
    <text x="12" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E" transform="rotate(-90 12 184)">height 2</text>
  </g>
  <text x="135" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">2:3 rectangle</text>
  <text x="135" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">most countries</text>

  <!-- Flag 2: square 1:1 -->
  <g>
    <rect x="270" y="120" width="120" height="120" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <line x1="270" y1="270" x2="270" y2="286" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="390" y1="270" x2="390" y2="286" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="270" y1="278" x2="390" y2="278" stroke="#8B6F4E" stroke-width="1"/>
    <text x="330" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">width 1</text>

    <line x1="255" y1="120" x2="239" y2="120" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="255" y1="240" x2="239" y2="240" stroke="#8B6F4E" stroke-width="1"/>
    <line x1="247" y1="120" x2="247" y2="240" stroke="#8B6F4E" stroke-width="1"/>
    <text x="237" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E" transform="rotate(-90 237 184)">height 1</text>
  </g>
  <text x="330" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1:1 square</text>
  <text x="330" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Switzerland &amp; Vatican City</text>

  <!-- Flag 3: Nepal double pennant -->
  <g>
    <path d="M 462,90 L 585,144 L 528,172 L 585,224 L 462,290 Z" fill="#C9412C" opacity="0.85" stroke="#2C4A3E" stroke-width="2" stroke-linejoin="round"/>
    <line x1="462" y1="90" x2="462" y2="290" stroke="#8B6F4E" stroke-width="2.5"/>
  </g>
  <text x="522" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Two-triangle pennant</text>
  <text x="522" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Nepal, the only</text>
  <text x="522" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">non-rectangular flag</text>

  <line x1="40" y1="368" x2="600" y2="368" stroke="#E3DCC9" stroke-width="1"/>
  <text x="320" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">Every sovereign flag but one is a rectangle or a square — Nepal alone breaks from four-sided geometry.</text>
</svg>
