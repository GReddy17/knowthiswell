<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">The eight parts of speech grouped into content words, which carry meaning, and function words, which do grammatical connecting work, with one example each</title>
  <rect width="640" height="260" fill="#FBF8F1"/>

  <text x="180" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#2C4A3E">Content words</text>
  <text x="180" y="52" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B6F4E">carry the core meaning</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">
    <rect x="40" y="65" width="280" height="34" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
    <text x="55" y="87" fill="#1F1B16">Noun — <tspan fill="#4A443C">"river"</tspan></text>
    <rect x="40" y="105" width="280" height="34" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
    <text x="55" y="127" fill="#1F1B16">Verb — <tspan fill="#4A443C">"flow"</tspan></text>
    <rect x="40" y="145" width="280" height="34" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
    <text x="55" y="167" fill="#1F1B16">Adjective — <tspan fill="#4A443C">"wide"</tspan></text>
    <rect x="40" y="185" width="280" height="34" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
    <text x="55" y="207" fill="#1F1B16">Adverb — <tspan fill="#4A443C">"quickly"</tspan></text>
  </g>

  <text x="460" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#8B6F4E">Function words</text>
  <text x="460" y="52" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#8B6F4E">do grammatical connecting work</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">
    <rect x="320" y="65" width="280" height="34" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1"/>
    <text x="335" y="87" fill="#1F1B16">Pronoun — <tspan fill="#4A443C">"it"</tspan></text>
    <rect x="320" y="105" width="280" height="34" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1"/>
    <text x="335" y="127" fill="#1F1B16">Preposition — <tspan fill="#4A443C">"along"</tspan></text>
    <rect x="320" y="145" width="280" height="34" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1"/>
    <text x="335" y="167" fill="#1F1B16">Conjunction — <tspan fill="#4A443C">"and"</tspan></text>
    <rect x="320" y="185" width="280" height="34" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1"/>
    <text x="335" y="207" fill="#1F1B16">Interjection — <tspan fill="#4A443C">"wow"</tspan></text>
  </g>
</svg>
