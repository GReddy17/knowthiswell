<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tzTitle">
  <title id="tzTitle">A diagram showing Earth as a horizontal strip divided into 24 vertical slices of 15 degrees longitude each, with the Prime Meridian at the center labeled UTC+0, slices to the right labeled UTC+1 through UTC+5 with a jagged political border replacing one straight slice edge, and the International Date Line at the far right and left edges labeled where the calendar date changes</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Theoretical time zones: 15° of longitude = 1 hour</text>

  <!-- 24 slices, showing a representative 9 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">
    <rect x="40" y="60" width="60" height="140" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="70" y="215" text-anchor="middle">UTC-2</text>
    <rect x="100" y="60" width="60" height="140" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="130" y="215" text-anchor="middle">UTC-1</text>
    <rect x="160" y="60" width="60" height="140" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
    <text x="190" y="215" text-anchor="middle" font-weight="700">UTC+0</text>
    <text x="190" y="50" text-anchor="middle" font-size="10" fill="#B5493A">Prime Meridian</text>
    <rect x="220" y="60" width="60" height="140" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="250" y="215" text-anchor="middle">UTC+1</text>
    <rect x="280" y="60" width="60" height="140" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="310" y="215" text-anchor="middle">UTC+2</text>

    <!-- jagged political border overlay -->
    <path d="M 400 60 L 400 100 L 430 100 L 430 140 L 460 140 L 460 200" fill="none" stroke="#B5493A" stroke-width="2.5" stroke-dasharray="4,3"/>
    <rect x="400" y="60" width="120" height="140" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5" opacity="0.5"/>
    <text x="460" y="230" text-anchor="middle" fill="#B5493A" font-weight="600">Real border bends around country lines,</text>
    <text x="460" y="244" text-anchor="middle" fill="#B5493A" font-weight="600">not a straight 15° slice edge</text>

    <rect x="600" y="60" width="60" height="140" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="630" y="215" text-anchor="middle">UTC+8</text>
    <rect x="660" y="60" width="60" height="140" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5" stroke-dasharray="3,2"/>
    <text x="690" y="215" text-anchor="middle" font-weight="700">IDL</text>
    <rect x="720" y="60" width="50" height="140" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="745" y="215" text-anchor="middle">UTC-11</text>
  </g>
  <text x="690" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Crossing the International Date Line westward skips a calendar day forward;</text>
  <text x="690" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">crossing eastward repeats a day.</text>
</svg>
