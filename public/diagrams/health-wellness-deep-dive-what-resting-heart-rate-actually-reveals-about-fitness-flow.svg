<svg viewBox="0 0 560 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rhrFlowTitle">
  <title id="rhrFlowTitle">Why aerobic training tends to lower resting heart rate: regular aerobic exercise enlarges and strengthens the heart muscle, each beat pumps more blood (higher stroke volume), the body's resting need for blood flow stays about the same, so fewer beats per minute are needed, and parasympathetic tone rises.</title>
  <rect width="560" height="490" fill="#FBF8F1"/>
  <rect x="150" y="20" width="260" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">1. Regular aerobic training</text>
  <text x="280" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="106" width="260" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">2. Heart muscle adapts: left</text>
  <text x="280" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">ventricle fills and pumps more</text>
  <text x="280" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="192" width="260" height="60" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">3. More blood per beat</text>
  <text x="280" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">(higher stroke volume)</text>
  <text x="280" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="278" width="260" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">4. Resting blood-flow need</text>
  <text x="280" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">stays about the same</text>
  <text x="280" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="364" width="260" height="60" rx="6" fill="#2C4A3E"/>
  <text x="280" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">5. Fewer beats per minute needed</text>
  <text x="280" y="406" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">at rest: resting HR drops</text>
  <text x="280" y="476" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Normal adult range is 60-100 bpm; low is only good if you feel well</text>
</svg>
