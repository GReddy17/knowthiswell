<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mpaTitle">
  <title id="mpaTitle">A horizontal spectrum bar shaded from light green on the left labeled minimally protected, some activities restricted, through medium green in the middle labeled partially protected, some fishing allowed, to dark green on the right labeled no-take zone, no extraction allowed, with a callout noting only the darkest end shows strong documented fish biomass recovery</title>
  <rect width="780" height="220" fill="#FBF8F1"/>

  <rect x="40" y="70" width="700" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="40" y="70" width="233" height="50" fill="#D9E5DC"/>
  <rect x="273" y="70" width="234" height="50" fill="#9EC0A8"/>
  <rect x="507" y="70" width="233" height="50" rx="6" fill="#4A7A5B"/>
  <rect x="40" y="70" width="700" height="50" rx="6" fill="none" stroke="#2C4A3E" stroke-width="2"/>

  <text x="156" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Minimally protected</text>
  <text x="156" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">some activities restricted</text>

  <text x="390" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Partially protected</text>
  <text x="390" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">some fishing allowed</text>

  <text x="623" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#FBF8F1">No-take zone</text>
  <text x="623" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FBF8F1">no extraction allowed</text>

  <path d="M623 60 L623 42" stroke="#B5493A" stroke-width="2"/>
  <text x="623" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#B5493A">Strong documented fish-biomass recovery here</text>

  <text x="390" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">All three can be legally labeled &quot;marine protected area.&quot;</text>
</svg>
