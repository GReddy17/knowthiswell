<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="caratTitle">
  <title id="caratTitle">Two separate boxes both labeled carat: the diamond-carat box reads 1 metric carat equals 0.2 grams, a unit of physical weight; the gold-karat box reads 24 karat equals pure gold and 18 karat equals 75 percent gold, a scale of purity rather than weight.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>

  <rect x="50" y="50" width="320" height="160" rx="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="210" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Diamond "carat" — WEIGHT</text>
  <text x="210" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4A443C">1 metric carat = 0.2 grams</text>
  <text x="210" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4A443C">2 carat diamond = 0.4 g</text>
  <text x="210" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">a physical mass measurement</text>

  <rect x="410" y="50" width="320" height="160" rx="12" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="570" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Gold "karat" — PURITY</text>
  <text x="570" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4A443C">24K = 100% pure gold</text>
  <text x="570" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#4A443C">18K = 18/24 = 75% gold</text>
  <text x="570" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">a ratio, not a weight at all</text>

  <text x="390" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Same-sounding word, two unrelated meanings — carat weighs a gem, karat grades gold's purity out of 24 parts.</text>
</svg>
