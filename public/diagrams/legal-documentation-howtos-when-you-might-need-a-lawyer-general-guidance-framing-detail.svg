<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="needLawyerTitle">
  <title id="needLawyerTitle">A diagram comparing situations often manageable without a lawyer, such as simple small claims or reading a standard lease, against situations that generally call for a lawyer, such as facing criminal charges, a significant contract, a serious injury claim, or a court summons with real stakes.</title>
  <rect width="620" height="340" fill="#FBF8F1"/>

  <rect x="40" y="30" width="250" height="280" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="165" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Often manageable</text>
  <text x="165" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">without a lawyer</text>
  <text x="60" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Small claims court cases</text>
  <text x="60" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Reading a standard lease</text>
  <text x="60" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Simple consumer disputes</text>
  <text x="60" y="205" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Basic notarization needs</text>
  <text x="60" y="235" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Low-stakes, low-complexity</text>
  <text x="60" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">  disagreements</text>

  <rect x="330" y="30" width="250" height="280" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="455" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Generally calls for</text>
  <text x="455" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">a licensed attorney</text>
  <text x="350" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Criminal charges</text>
  <text x="350" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Significant contracts</text>
  <text x="350" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Serious injury claims</text>
  <text x="350" y="205" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• A court summons with</text>
  <text x="350" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">  real financial stakes</text>
  <text x="350" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">• Family law matters like</text>
  <text x="350" y="275" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">  custody or divorce</text>

  <text x="310" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Stakes, complexity, and irreversibility — not just cost — are the questions that matter most.</text>
</svg>
