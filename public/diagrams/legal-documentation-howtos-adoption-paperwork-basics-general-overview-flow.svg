<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="680" height="240" fill="#FBF8F1"/>
  <rect x="10" y="20" width="130" height="70" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="75" y="48" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="600">Home study &amp;</text>
  <text x="75" y="62" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="600">matching/</text>
  <text x="75" y="76" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="600">placement</text>

  <path d="M140 55 H165" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow6)"/>
  <rect x="165" y="20" width="130" height="70" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="230" y="48" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="600">Termination of</text>
  <text x="230" y="62" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="600">birth parents'</text>
  <text x="230" y="76" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="600">rights</text>

  <path d="M295 55 H320" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow6)"/>
  <rect x="320" y="20" width="130" height="70" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="385" y="48" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="600">Petition filed &amp;</text>
  <text x="385" y="62" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="600">court hearing</text>

  <path d="M450 55 H475" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow6)"/>
  <rect x="475" y="20" width="100" height="70" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="525" y="48" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="700">Adoption</text>
  <text x="525" y="62" text-anchor="middle" font-size="9.5" fill="#1F1B16" font-weight="700">decree issued</text>
  <text x="525" y="76" text-anchor="middle" font-size="8.5" fill="#4A443C">(legally final)</text>

  <path d="M575 55 H600" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow6)"/>
  <rect x="600" y="20" width="70" height="70" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="635" y="48" text-anchor="middle" font-size="9" fill="#1F1B16" font-weight="600">Amended</text>
  <text x="635" y="62" text-anchor="middle" font-size="9" fill="#1F1B16" font-weight="600">birth</text>
  <text x="635" y="76" text-anchor="middle" font-size="9" fill="#1F1B16" font-weight="600">certificate</text>

  <rect x="15" y="150" width="650" height="60" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="340" y="176" text-anchor="middle" font-size="11" fill="#4A443C">Specific steps and their order vary by adoption type — domestic infant,</text>
  <text x="340" y="194" text-anchor="middle" font-size="11" fill="#4A443C">foster care, stepparent, and international adoptions each differ meaningfully.</text>

  <defs>
    <marker id="arrow6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
