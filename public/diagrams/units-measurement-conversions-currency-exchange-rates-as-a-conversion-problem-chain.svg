<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="currencyChainTitle">
  <title id="currencyChainTitle">A chain diagram showing 200 US dollars multiplied by an exchange rate of 0.92 euros per dollar to get 184 euros, then reduced by a 2 percent conversion fee to a final result of about 180.32 euros.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="30" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Converting $200 USD to EUR, with a 2% fee</text>

  <rect x="30" y="70" width="150" height="80" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="105" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">$200</text>
  <text x="105" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">US Dollars</text>

  <text x="205" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">×</text>

  <rect x="230" y="70" width="150" height="80" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="305" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">0.92</text>
  <text x="305" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">EUR per USD (rate)</text>

  <text x="405" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">×</text>

  <rect x="430" y="70" width="150" height="80" rx="10" fill="#F3ECE4" stroke="#2C4A3E" stroke-width="2"/>
  <text x="505" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">0.98</text>
  <text x="505" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(1 - 2% fee)</text>

  <text x="605" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">=</text>

  <rect x="630" y="60" width="120" height="100" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="690" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">≈ €180.32</text>
  <text x="690" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">received</text>

  <text x="390" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The exchange rate is a conversion factor, exactly like a length or weight factor — the fee is a second multiplier applied on top.</text>
</svg>
