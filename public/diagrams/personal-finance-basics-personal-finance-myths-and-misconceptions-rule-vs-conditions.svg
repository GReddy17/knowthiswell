<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mythsRuleConditionsTitle">
  <title id="mythsRuleConditionsTitle">A diagram showing a rule of thumb, like the fifty thirty twenty budgeting split, at the center, with the specific underlying assumptions that make it work branching outward, such as a moderate income relative to cost of living, illustrating that the rule only holds when those conditions are actually met.</title>
  <rect width="620" height="300" fill="#FBF8F1"/>

  <circle cx="310" cy="150" r="70" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Rule of thumb</text>
  <text x="310" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">e.g. 50/30/20</text>

  <path d="M255 105 L120 60" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="20" y="30" width="200" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Assumption:</text>
  <text x="120" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">moderate income vs. cost of living</text>

  <path d="M255 195 L120 240" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="20" y="215" width="200" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Assumption:</text>
  <text x="120" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">stable, predictable expenses</text>

  <path d="M365 105 L500 60" fill="none" stroke="#B5493A" stroke-width="2"/>
  <rect x="400" y="30" width="200" height="55" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="500" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">If unmet:</text>
  <text x="500" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">rule stops fitting the situation</text>

  <path d="M365 195 L500 240" fill="none" stroke="#B5493A" stroke-width="2"/>
  <rect x="400" y="215" width="200" height="55" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="500" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Result:</text>
  <text x="500" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">rule gets misread as a "myth"</text>
</svg>
