<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="activityTitle">
  <title id="activityTitle">A diagram showing two separate boxes representing CDC's adult activity guideline: one box for 150 minutes per week of moderate-intensity aerobic activity or 75 minutes of vigorous activity, and a second, separate box for muscle-strengthening activity on 2 or more days per week, with both boxes labeled as independently recommended.</title>
  <rect width="780" height="240" fill="#FBF8F1"/>

  <text x="390" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">CDC adult activity guideline — two independent components</text>

  <rect x="60" y="60" width="300" height="130" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="210" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Aerobic activity</text>
  <text x="210" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">150 min/week moderate</text>
  <text x="210" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">or 75 min/week vigorous</text>
  <text x="210" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">splittable across the week</text>

  <text x="390" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">+</text>

  <rect x="420" y="60" width="300" height="130" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="570" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Strength activity</text>
  <text x="570" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">All major muscle groups</text>
  <text x="570" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">2+ days per week</text>
  <text x="570" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">separate from aerobic minutes</text>

  <text x="390" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Meeting one component does not automatically satisfy the other</text>
</svg>
