<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of Ancient Egypt's Old, Middle, and New Kingdoms separated by Intermediate Periods, ending with the Late Period and Cleopatra's death in 30 BCE</title>
  <rect width="680" height="220" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="120" width="150" height="40" fill="#EEF3EE"/>
    <text x="115" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Old Kingdom</text>
    <text x="115" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">2686–2181 BCE</text>

    <rect x="190" y="120" width="45" height="40" fill="#EDE7D8"/>
    <text x="212" y="103" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A443C">1st Int.</text>
    <text x="212" y="115" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A443C">Period</text>

    <rect x="235" y="120" width="150" height="40" fill="#EEF3EE"/>
    <text x="310" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Middle Kingdom</text>
    <text x="310" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">2055–1650 BCE</text>

    <rect x="385" y="120" width="45" height="40" fill="#EDE7D8"/>
    <text x="407" y="103" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A443C">2nd Int.</text>
    <text x="407" y="115" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A443C">Period</text>

    <rect x="430" y="120" width="150" height="40" fill="#EEF3EE"/>
    <text x="505" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">New Kingdom</text>
    <text x="505" y="180" text-anchor="middle" font-size="11" fill="#8B6F4E">1550–1070 BCE</text>

    <rect x="580" y="120" width="60" height="40" fill="#FBEDEA"/>
    <text x="610" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Late Period</text>
    <text x="610" y="180" text-anchor="middle" font-size="10" fill="#8B6F4E">ends 30 BCE</text>
  </g>
  <rect x="40" y="120" width="600" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="190" y1="120" x2="190" y2="160" stroke="#1F1B16"/>
  <line x1="235" y1="120" x2="235" y2="160" stroke="#1F1B16"/>
  <line x1="385" y1="120" x2="385" y2="160" stroke="#1F1B16"/>
  <line x1="430" y1="120" x2="430" y2="160" stroke="#1F1B16"/>
  <line x1="580" y1="120" x2="580" y2="160" stroke="#1F1B16"/>
  <text x="340" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" fill="#8B6F4E">Strong unified rule (kingdoms) alternates with fragmentation (intermediate periods)</text>
</svg>
