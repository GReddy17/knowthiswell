<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engineDispTitle">
  <title id="engineDispTitle">A horizontal chain showing an engine's displacement expressed in three equivalent unit systems: 350 cubic inches equals 5735 cubic centimeters equals 5.7 liters, illustrating how the same classic American V8 engine is described differently depending on which unit system the source uses</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <rect x="40" y="90" width="180" height="80" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="130" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">350 cu in</text>
  <text x="130" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">(classic US spec)</text>

  <text x="255" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">=</text>

  <rect x="290" y="90" width="200" height="80" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">5,735 cc</text>
  <text x="390" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">(cubic centimeters)</text>

  <text x="545" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">=</text>

  <rect x="580" y="90" width="160" height="80" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="660" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">5.7 L</text>
  <text x="660" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">("5.7 liter V8")</text>

  <text x="390" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Same physical engine, three labels: 1 cubic inch = 16.387 cc, and 1,000 cc = 1 liter.</text>
</svg>
