<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="threeCitiesTitle">
  <title id="threeCitiesTitle">Three columns, each showing a city name, its core constraint, and its chosen strategy. Column one: Copenhagen, constraint flat terrain dense grid, strategy protected bike lane network. Column two: Curitiba, constraint limited capital fast growth, strategy bus rapid transit with dedicated lanes. Column three: Singapore, constraint extreme land scarcity, strategy vertical greenery built into building codes.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>

  <!-- Column 1: Copenhagen -->
  <rect x="30" y="30" width="220" height="220" rx="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="140" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Copenhagen</text>
  <text x="140" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Constraint</text>
  <text x="140" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Flat terrain,</text>
  <text x="140" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">dense street grid</text>
  <line x1="60" y1="140" x2="220" y2="140" stroke="#2C4A3E" stroke-width="1" opacity="0.4"/>
  <text x="140" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Strategy</text>
  <text x="140" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Protected bike</text>
  <text x="140" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">lane network</text>

  <!-- Column 2: Curitiba -->
  <rect x="280" y="30" width="220" height="220" rx="12" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Curitiba</text>
  <text x="390" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Constraint</text>
  <text x="390" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Limited capital,</text>
  <text x="390" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">fast population growth</text>
  <line x1="310" y1="140" x2="470" y2="140" stroke="#2C4A3E" stroke-width="1" opacity="0.4"/>
  <text x="390" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Strategy</text>
  <text x="390" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Bus rapid transit,</text>
  <text x="390" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">dedicated lanes</text>

  <!-- Column 3: Singapore -->
  <rect x="530" y="30" width="220" height="220" rx="12" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="640" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Singapore</text>
  <text x="640" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Constraint</text>
  <text x="640" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Extreme land</text>
  <text x="640" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">scarcity</text>
  <line x1="560" y1="140" x2="720" y2="140" stroke="#2C4A3E" stroke-width="1" opacity="0.4"/>
  <text x="640" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Strategy</text>
  <text x="640" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Vertical greenery in</text>
  <text x="640" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">building codes</text>

  <text x="390" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Three different strategies, each matched to a different starting constraint.</text>
</svg>
