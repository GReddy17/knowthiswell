<svg viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="solarFlowTitle">
  <title id="solarFlowTitle">A left-to-right flow diagram: a sun icon with arrows pointing to a solar panel labeled photovoltaic cells generating DC current, an arrow to a box labeled inverter converting DC to AC, an arrow splitting into two paths — one labeled home usage going to a house icon, and one labeled surplus export going to a grid icon with a plus symbol for net metering credit.</title>
  <rect width="820" height="260" fill="#FBF8F1"/>

  <circle cx="55" cy="70" r="24" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="55" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">☀</text>
  <line x1="80" y1="80" x2="120" y2="100" stroke="#4A443C" stroke-width="1.6"/>

  <rect x="120" y="90" width="110" height="70" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="175" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Solar panel</text>
  <text x="175" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">(PV cells, DC)</text>

  <line x1="230" y1="125" x2="270" y2="125" stroke="#2C4A3E" stroke-width="1.8"/>
  <polygon points="270,120 280,125 270,130" fill="#2C4A3E"/>

  <rect x="280" y="90" width="110" height="70" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="335" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Inverter</text>
  <text x="335" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">DC → AC</text>

  <line x1="390" y1="115" x2="430" y2="60" stroke="#2C4A3E" stroke-width="1.6"/>
  <polygon points="425,58 435,58 429,68" fill="#2C4A3E"/>
  <line x1="390" y1="135" x2="430" y2="190" stroke="#2C4A3E" stroke-width="1.6"/>
  <polygon points="425,182 435,186 427,192" fill="#2C4A3E"/>

  <text x="440" y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Home usage</text>
  <rect x="440" y="55" width="100" height="65" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="490" y="93" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">🏠</text>

  <text x="440" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Surplus export</text>
  <rect x="440" y="190" width="150" height="65" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="515" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Grid</text>
  <text x="515" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">+ net metering credit</text>

  <text x="410" y="14" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Sunlight becomes usable AC power, split between direct use and grid export.</text>
</svg>
