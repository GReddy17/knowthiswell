<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tapeHookTitle">
  <title id="tapeHookTitle">Two diagrams of a tape measure's end hook riveted with a small amount of slop equal to the hook's own thickness: when pulled over an outside edge the hook slides to the outer limit of its slot so the zero mark starts exactly at the edge, and when pushed into an inside corner the hook slides inward to the case front by that same thickness, so the zero mark still starts exactly at the true surface either way.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">The loose hook self-corrects for push vs. pull</text>

  <!-- Lane A: pull, outside edge -->
  <text x="60" y="65" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">PULL — hooked over an outside edge</text>
  <rect x="130" y="55" width="10" height="55" fill="#4A443C"/>
  <rect x="140" y="50" width="26" height="10" fill="#4A443C"/>
  <line x1="140" y1="90" x2="650" y2="90" stroke="#8B6F4E" stroke-width="10"/>
  <line x1="180" y1="83" x2="180" y2="97" stroke="#FBF8F1" stroke-width="2"/>
  <line x1="240" y1="85" x2="240" y2="95" stroke="#FBF8F1" stroke-width="1.5"/>
  <line x1="300" y1="85" x2="300" y2="95" stroke="#FBF8F1" stroke-width="1.5"/>
  <text x="150" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2C4A3E">0</text>
  <line x1="146" y1="120" x2="164" y2="120" stroke="#2C4A3E" stroke-width="2"/>
  <text x="155" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C4A3E">hook at outer</text>
  <text x="155" y="147" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C4A3E">limit of its slot (t)</text>

  <!-- Lane B: push, inside corner -->
  <text x="60" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#8B6F4E">PUSH — butted into an inside corner</text>
  <rect x="130" y="190" width="10" height="55" fill="#4A443C"/>
  <rect x="130" y="190" width="55" height="10" fill="#4A443C"/>
  <rect x="140" y="200" width="26" height="16" rx="2" fill="#2C4A3E"/>
  <line x1="166" y1="225" x2="650" y2="225" stroke="#8B6F4E" stroke-width="10"/>
  <line x1="206" y1="218" x2="206" y2="232" stroke="#FBF8F1" stroke-width="2"/>
  <line x1="266" y1="220" x2="266" y2="230" stroke="#FBF8F1" stroke-width="1.5"/>
  <line x1="326" y1="220" x2="326" y2="230" stroke="#FBF8F1" stroke-width="1.5"/>
  <text x="150" y="247" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#8B6F4E">0</text>
  <line x1="140" y1="255" x2="166" y2="255" stroke="#8B6F4E" stroke-width="2"/>
  <text x="153" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">hook pushed to inner</text>
  <text x="153" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">limit — case front is zero</text>

  <text x="480" y="167" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Slot travel &#8776; hook thickness (t) — the same small offset that appears when</text>
  <text x="480" y="181" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">pulling and disappears when pushing, so the printed zero stays accurate either way.</text>
</svg>
