<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="predictiveTextTitle">
  <title id="predictiveTextTitle">Diagram showing the typed phrase "Can you call me" feeding into a language model trained on a keyboard's own typing history and common phrase patterns, which outputs a ranked list of likely next words with probability scores, such as "back" at 38 percent, "tonight" at 21 percent, and "later" at 14 percent, and the keyboard displays the top three as suggestion chips above the keys.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="40" y="40" width="220" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="150" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">Typed so far:</text>
  <text x="150" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">"Can you call me"</text>

  <rect x="310" y="30" width="200" height="80" rx="8" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="410" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Prediction model</text>
  <text x="410" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">trained on common</text>
  <text x="410" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">phrase patterns</text>

  <defs>
    <marker id="arrowPred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <path d="M260,70 L310,70" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowPred)"/>
  <path d="M410,110 L410,140" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowPred)"/>

  <rect x="270" y="140" width="280" height="110" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="410" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Ranked next-word odds</text>
  <text x="410" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">"back"       38%</text>
  <text x="410" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">"tonight"    21%</text>
  <text x="410" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">"later"       14%</text>
  <text x="410" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">(everything else splits the rest)</text>

  <path d="M410,250 L410,270" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowPred)"/>

  <rect x="200" y="270" width="380" height="40" rx="20" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1"/>
  <text x="300" y="295" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">back</text>
  <text x="390" y="295" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">tonight</text>
  <text x="480" y="295" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#1F1B16">later</text>
  <line x1="345" y1="278" x2="345" y2="302" stroke="#8B6F4E" stroke-width="1"/>
  <line x1="435" y1="278" x2="435" y2="302" stroke="#8B6F4E" stroke-width="1"/>

  <text x="670" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C" transform="rotate(90 670 180)">only the top few shown as chips</text>
</svg>
