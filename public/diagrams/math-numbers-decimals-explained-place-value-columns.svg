<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="decTitle">
  <title id="decTitle">The number 42.375 broken into place value columns: tens, ones, decimal point, tenths, hundredths, and thousandths, each shown with its column value</title>
  <rect width="640" height="380" fill="#FBF8F1"/>

  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#20362D">42.375 by place value</text>

  <!-- columns -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- tens -->
    <rect x="60" y="90" width="70" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="95" y="135" text-anchor="middle" font-size="30" font-weight="700" fill="#2C4A3E">4</text>
    <text x="95" y="180" text-anchor="middle" font-size="12" fill="#4A443C">tens</text>
    <text x="95" y="196" text-anchor="middle" font-size="11" fill="#8B6F4E">= 40</text>

    <!-- ones -->
    <rect x="140" y="90" width="70" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="175" y="135" text-anchor="middle" font-size="30" font-weight="700" fill="#2C4A3E">2</text>
    <text x="175" y="180" text-anchor="middle" font-size="12" fill="#4A443C">ones</text>
    <text x="175" y="196" text-anchor="middle" font-size="11" fill="#8B6F4E">= 2</text>

    <!-- decimal point -->
    <text x="228" y="150" text-anchor="middle" font-size="34" font-weight="700" fill="#C9412C">.</text>

    <!-- tenths -->
    <rect x="250" y="90" width="70" height="70" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
    <text x="285" y="135" text-anchor="middle" font-size="30" font-weight="700" fill="#C9412C">3</text>
    <text x="285" y="180" text-anchor="middle" font-size="12" fill="#4A443C">tenths</text>
    <text x="285" y="196" text-anchor="middle" font-size="11" fill="#8B6F4E">= 3/10</text>

    <!-- hundredths -->
    <rect x="330" y="90" width="70" height="70" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
    <text x="365" y="135" text-anchor="middle" font-size="30" font-weight="700" fill="#C9412C">7</text>
    <text x="365" y="180" text-anchor="middle" font-size="12" fill="#4A443C">hundredths</text>
    <text x="365" y="196" text-anchor="middle" font-size="11" fill="#8B6F4E">= 7/100</text>

    <!-- thousandths -->
    <rect x="410" y="90" width="70" height="70" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
    <text x="445" y="135" text-anchor="middle" font-size="30" font-weight="700" fill="#C9412C">5</text>
    <text x="445" y="180" text-anchor="middle" font-size="12" fill="#4A443C">thousandths</text>
    <text x="445" y="196" text-anchor="middle" font-size="11" fill="#8B6F4E">= 5/1000</text>
  </g>

  <text x="320" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">Each step right divides the place value by 10 —</text>
  <text x="320" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">mirrored across the decimal point.</text>
  <text x="320" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">42.375 = 40 + 2 + 3/10 + 7/100 + 5/1000</text>
</svg>
