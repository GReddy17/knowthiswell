<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="separationMethodsTitle">
  <title id="separationMethodsTitle">Four-column comparison chart: filtration exploits particle size, evaporation exploits boiling point where the solute doesn't evaporate, distillation exploits boiling point where both components evaporate and are recondensed separately, and chromatography exploits differing attraction to a fixed material</title>

  <rect x="0" y="0" width="640" height="440" fill="#FBF8F1"/>
  <text x="320" y="32" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="19" font-weight="600" fill="#1F1B16">Matching Method to Physical Property</text>

  <!-- 4 columns, each 140 wide, gaps: x starts 30, width 140, gap 20 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- Column 1: Filtration -->
    <g transform="translate(30,60)">
      <rect x="0" y="0" width="140" height="340" fill="#EEF3EE" opacity="0.4" rx="6" stroke="#E3DCC9"/>
      <text x="70" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Filtration</text>
      <!-- funnel with particles caught, liquid through -->
      <path d="M 30,50 L 110,50 L 80,100 L 60,100 Z" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
      <circle cx="55" cy="58" r="4" fill="#8B6F4E"/>
      <circle cx="75" cy="55" r="4" fill="#8B6F4E"/>
      <circle cx="90" cy="60" r="4" fill="#8B6F4E"/>
      <circle cx="65" cy="68" r="4" fill="#8B6F4E"/>
      <line x1="70" y1="100" x2="70" y2="140" stroke="#4A7A9E" stroke-width="2"/>
      <text x="70" y="160" text-anchor="middle" font-size="10" fill="#4A443C">Solid caught,</text>
      <text x="70" y="174" text-anchor="middle" font-size="10" fill="#4A443C">liquid passes</text>
      <text x="70" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#2C4A3E">Exploits:</text>
      <text x="70" y="222" text-anchor="middle" font-size="10.5" fill="#1F1B16">Particle size</text>
      <text x="70" y="255" text-anchor="middle" font-size="10" fill="#4A443C">Mud from water,</text>
      <text x="70" y="269" text-anchor="middle" font-size="10" fill="#4A443C">coffee grounds</text>
    </g>

    <!-- Column 2: Evaporation -->
    <g transform="translate(180,60)">
      <rect x="0" y="0" width="140" height="340" fill="#EEF3EE" opacity="0.4" rx="6" stroke="#E3DCC9"/>
      <text x="70" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Evaporation</text>
      <path d="M 30,90 Q 70,105 110,90 L 110,100 Q 70,115 30,100 Z" fill="#4A7A9E" opacity="0.5"/>
      <rect x="30" y="60" width="80" height="40" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
      <path d="M 55,55 C 52,45 58,40 55,32" stroke="#8B6F4E" stroke-width="1.5" fill="none"/>
      <path d="M 75,55 C 72,42 78,38 75,28" stroke="#8B6F4E" stroke-width="1.5" fill="none"/>
      <circle cx="55" cy="88" r="3" fill="#4A443C"/>
      <circle cx="65" cy="92" r="3" fill="#4A443C"/>
      <circle cx="80" cy="87" r="3" fill="#4A443C"/>
      <text x="70" y="160" text-anchor="middle" font-size="10" fill="#4A443C">Solvent leaves as</text>
      <text x="70" y="174" text-anchor="middle" font-size="10" fill="#4A443C">vapor, solute stays</text>
      <text x="70" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#2C4A3E">Exploits:</text>
      <text x="70" y="222" text-anchor="middle" font-size="10.5" fill="#1F1B16">Boiling point</text>
      <text x="70" y="222" dy="14" text-anchor="middle" font-size="9.5" fill="#4A443C">(solute doesn't evaporate)</text>
      <text x="70" y="255" text-anchor="middle" font-size="10" fill="#4A443C">Salt crystals</text>
      <text x="70" y="269" text-anchor="middle" font-size="10" fill="#4A443C">from seawater</text>
    </g>

    <!-- Column 3: Distillation -->
    <g transform="translate(330,60)">
      <rect x="0" y="0" width="140" height="340" fill="#EEF3EE" opacity="0.4" rx="6" stroke="#E3DCC9"/>
      <text x="70" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Distillation</text>
      <rect x="25" y="70" width="45" height="30" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
      <path d="M 70,80 L 115,80 L 115,110" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
      <path d="M 40,65 C 37,55 43,50 40,42" stroke="#8B6F4E" stroke-width="1.5" fill="none"/>
      <rect x="100" y="105" width="30" height="25" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
      <text x="115" y="145" text-anchor="middle" font-size="9" fill="#4A443C">collected</text>
      <text x="70" y="165" text-anchor="middle" font-size="10" fill="#4A443C">Vapor cooled and</text>
      <text x="70" y="179" text-anchor="middle" font-size="10" fill="#4A443C">recondensed separately</text>
      <text x="70" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#2C4A3E">Exploits:</text>
      <text x="70" y="222" text-anchor="middle" font-size="10.5" fill="#1F1B16">Boiling point</text>
      <text x="70" y="236" text-anchor="middle" font-size="9.5" fill="#4A443C">(both components evaporate)</text>
      <text x="70" y="255" text-anchor="middle" font-size="10" fill="#4A443C">Separating two</text>
      <text x="70" y="269" text-anchor="middle" font-size="10" fill="#4A443C">miscible liquids</text>
    </g>

    <!-- Column 4: Chromatography -->
    <g transform="translate(480,60)">
      <rect x="0" y="0" width="140" height="340" fill="#EEF3EE" opacity="0.4" rx="6" stroke="#E3DCC9"/>
      <text x="70" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Chromatography</text>
      <rect x="55" y="40" width="10" height="90" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1"/>
      <circle cx="60" cy="120" r="5" fill="#1F1B16"/>
      <ellipse cx="60" cy="90" rx="14" ry="4" fill="#C9412C" opacity="0.7"/>
      <ellipse cx="60" cy="70" rx="16" ry="4" fill="#4A7A9E" opacity="0.7"/>
      <ellipse cx="60" cy="52" rx="10" ry="4" fill="#2C4A3E" opacity="0.7"/>
      <text x="70" y="160" text-anchor="middle" font-size="10" fill="#4A443C">Components spread</text>
      <text x="70" y="174" text-anchor="middle" font-size="10" fill="#4A443C">at different speeds</text>
      <text x="70" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#2C4A3E">Exploits:</text>
      <text x="70" y="222" text-anchor="middle" font-size="10.5" fill="#1F1B16">Attraction to a</text>
      <text x="70" y="236" text-anchor="middle" font-size="10.5" fill="#1F1B16">fixed material</text>
      <text x="70" y="255" text-anchor="middle" font-size="10" fill="#4A443C">Separating plant</text>
      <text x="70" y="269" text-anchor="middle" font-size="10" fill="#4A443C">pigments, inks</text>
    </g>
  </g>

  <text x="320" y="420" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each method only works when its exploited property genuinely differs between the components</text>
</svg>
