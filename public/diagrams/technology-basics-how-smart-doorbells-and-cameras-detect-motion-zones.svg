<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="motionZoneTitle">
  <title id="motionZoneTitle">A top-down diagram of a doorbell camera's field of view divided into three shaded detection zones at different distances from the camera; a small heat-signature icon representing a passing car stays in the far outer zone and is filtered out, while a person-shaped icon crossing into the closer zones triggers a PIR sensor wake-up followed by a software check before an alert is sent.</title>
  <rect width="800" height="320" fill="#FBF8F1"/>

  <defs>
    <marker id="arrowMotion" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="20" y="140" width="50" height="40" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2" rx="4"/>
  <text x="45" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#1F1B16">camera</text>

  <path d="M70,130 L520,30 L520,290 L70,190 Z" fill="#F2ECE0" opacity="0.55" stroke="#2C4A3E" stroke-width="1"/>
  <path d="M70,140 L340,90 L340,230 L70,180 Z" fill="#EDE7D8" opacity="0.7" stroke="#2C4A3E" stroke-width="1"/>
  <path d="M70,150 L200,130 L200,190 L70,170 Z" fill="#D8CFB8" stroke="#2C4A3E" stroke-width="1"/>

  <text x="150" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">near zone</text>
  <text x="300" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">mid zone</text>
  <text x="470" y="275" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">far zone (often filtered)</text>

  <circle cx="150" cy="165" r="10" fill="#B5493A"/>
  <text x="150" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#B5493A">person</text>

  <circle cx="480" cy="260" r="8" fill="#8FBF7F"/>
  <text x="480" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">passing car</text>
  <text x="480" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">(filtered out)</text>

  <rect x="560" y="60" width="210" height="150" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5" rx="4"/>
  <text x="665" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">What triggers a check:</text>
  <text x="580" y="104" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">1. PIR sensor detects heat</text>
  <text x="580" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">    + motion change</text>
  <text x="580" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">2. Camera wakes, software</text>
  <text x="580" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">    checks shape/size/zone</text>
  <text x="580" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">3. Alert sent only if it</text>
  <text x="580" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">    passes both filters</text>

  <text x="400" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Most cameras stay low-power until a sensor trigger, then filter by zone and shape.</text>
</svg>
