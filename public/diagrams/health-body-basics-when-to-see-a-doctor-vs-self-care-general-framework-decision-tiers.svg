<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="careDecisionTitle">
  <title id="careDecisionTitle">A flow diagram with three tiers arranged left to right by increasing urgency: Self-Care for mild, stable, or improving symptoms; Urgent Care for prompt but non-emergency symptoms; and Emergency Care for any recognized warning sign, with a note that recognized warning signs bypass the other two tiers entirely regardless of starting severity</title>
  <rect width="800" height="260" fill="#FBF8F1"/>

  <rect x="30" y="60" width="210" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="135" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Self-Care</text>
  <text x="135" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">mild, stable,</text>
  <text x="135" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">or improving</text>

  <text x="255" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="295" y="60" width="210" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="400" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Urgent Care</text>
  <text x="400" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">prompt but</text>
  <text x="400" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">non-emergency</text>

  <text x="520" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="560" y="60" width="210" height="90" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.4"/>
  <text x="665" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A">Emergency Care</text>
  <text x="665" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">recognized</text>
  <text x="665" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">warning sign</text>

  <path d="M 135 155 Q 400 220 660 155" fill="none" stroke="#B5493A" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="400" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">Warning sign present? Bypass straight to Emergency Care.</text>
</svg>
