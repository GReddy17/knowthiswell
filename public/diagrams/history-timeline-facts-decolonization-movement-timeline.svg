<svg viewBox="0 0 1500 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Horizontal timeline of decolonization showing 1945 to 1949 South and Southeast Asian independence including India, Pakistan, and Indonesia, 1954 to 1962 the Algerian War of Independence, 1957 Ghana's independence as an early sub-Saharan African case, 1960 the Year of Africa with 17 nations gaining independence, and 1974 to 1975 the independence of Portugal's African colonies including Angola and Mozambique</title>
  <rect width="1500" height="230" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="750" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">Empires unwind across three decades, from South Asia to southern Africa</text>

    <rect x="40" y="115" width="230" height="40" fill="#EEF3EE"/>
    <text x="155" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">South &amp; SE Asian independence</text>
    <text x="155" y="138" text-anchor="middle" font-size="9" fill="#4A443C">India, Pakistan, Indonesia</text>
    <text x="155" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1945&#8211;1949</text>

    <rect x="270" y="115" width="215" height="40" fill="#EDE7D8"/>
    <text x="377" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Algerian War of Independence</text>
    <text x="377" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1954&#8211;1962</text>

    <rect x="485" y="115" width="255" height="40" fill="#FBEDEA"/>
    <text x="612" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Ghana's independence</text>
    <text x="612" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Early sub-Saharan African case</text>
    <text x="612" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1957</text>

    <rect x="740" y="115" width="255" height="40" fill="#EEF3EE"/>
    <text x="867" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Year of Africa</text>
    <text x="867" y="138" text-anchor="middle" font-size="9" fill="#4A443C">17 nations gain independence</text>
    <text x="867" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1960</text>

    <rect x="995" y="115" width="465" height="40" fill="#FBEDEA"/>
    <text x="1227" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Portugal's African colonies gain independence</text>
    <text x="1227" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Including Angola and Mozambique</text>
    <text x="1227" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1974&#8211;1975</text>
  </g>
  <rect x="40" y="115" width="1420" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="270" y1="115" x2="270" y2="155" stroke="#1F1B16"/>
  <line x1="485" y1="115" x2="485" y2="155" stroke="#1F1B16"/>
  <line x1="740" y1="115" x2="740" y2="155" stroke="#1F1B16"/>
  <line x1="995" y1="115" x2="995" y2="155" stroke="#1F1B16"/>
</svg>
