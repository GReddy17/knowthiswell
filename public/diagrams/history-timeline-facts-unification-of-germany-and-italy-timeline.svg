<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Two parallel timelines from 1859 to 1871: Italy's unification through the 1859 war against Austria, Garibaldi's 1860 conquest of the south, the 1861 proclamation of the Kingdom of Italy, and the 1870-71 annexation of Rome; and Germany's unification through the 1864 war against Denmark, the 1866 war against Austria forming the North German Confederation, the 1870-71 Franco-Prussian War, and the January 1871 proclamation of the German Empire at Versailles</title>
  <rect width="820" height="300" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="410" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">Two nations, two wars-into-unity, one decade</text>

    <text x="52" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2C4A3E">ITALY</text>

    <rect x="110" y="72" width="110" height="40" fill="#EEF3EE"/>
    <text x="165" y="57" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">War vs. Austria</text>
    <text x="165" y="132" text-anchor="middle" font-size="9.5" fill="#8B6F4E">1859</text>

    <rect x="220" y="72" width="175" height="40" fill="#FBEDEA"/>
    <text x="307" y="57" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Garibaldi conquers the south</text>
    <text x="307" y="132" text-anchor="middle" font-size="9.5" fill="#8B6F4E">1860</text>

    <rect x="395" y="72" width="195" height="40" fill="#EDE7D8"/>
    <text x="492" y="57" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Kingdom of Italy proclaimed</text>
    <text x="492" y="132" text-anchor="middle" font-size="9.5" fill="#8B6F4E">1861</text>

    <rect x="590" y="72" width="170" height="40" fill="#EEF3EE"/>
    <text x="675" y="57" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Rome annexed</text>
    <text x="675" y="86" text-anchor="middle" font-size="9" fill="#4A443C">unification complete</text>
    <text x="675" y="132" text-anchor="middle" font-size="9.5" fill="#8B6F4E">1870–71</text>

    <rect x="110" y="72" width="650" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
    <line x1="220" y1="72" x2="220" y2="112" stroke="#1F1B16"/>
    <line x1="395" y1="72" x2="395" y2="112" stroke="#1F1B16"/>
    <line x1="590" y1="72" x2="590" y2="112" stroke="#1F1B16"/>

    <text x="52" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B0503A">GERMANY</text>

    <rect x="110" y="192" width="120" height="40" fill="#EEF3EE"/>
    <text x="170" y="177" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">War vs. Denmark</text>
    <text x="170" y="252" text-anchor="middle" font-size="9.5" fill="#8B6F4E">1864</text>

    <rect x="230" y="192" width="160" height="40" fill="#FBEDEA"/>
    <text x="310" y="177" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">War vs. Austria</text>
    <text x="310" y="206" text-anchor="middle" font-size="9" fill="#4A443C">North German Confederation</text>
    <text x="310" y="252" text-anchor="middle" font-size="9.5" fill="#8B6F4E">1866</text>

    <rect x="390" y="192" width="150" height="40" fill="#EDE7D8"/>
    <text x="465" y="177" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Franco-Prussian War</text>
    <text x="465" y="252" text-anchor="middle" font-size="9.5" fill="#8B6F4E">1870–71</text>

    <rect x="540" y="192" width="220" height="40" fill="#EEF3EE"/>
    <text x="650" y="177" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">German Empire proclaimed</text>
    <text x="650" y="206" text-anchor="middle" font-size="9" fill="#4A443C">at Versailles</text>
    <text x="650" y="252" text-anchor="middle" font-size="9.5" fill="#8B6F4E">Jan 1871</text>

    <rect x="110" y="192" width="650" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
    <line x1="230" y1="192" x2="230" y2="232" stroke="#1F1B16"/>
    <line x1="390" y1="192" x2="390" y2="232" stroke="#1F1B16"/>
    <line x1="540" y1="192" x2="540" y2="232" stroke="#1F1B16"/>

    <line x1="110" y1="278" x2="760" y2="278" stroke="#E3DCC9" stroke-width="1.5"/>
    <text x="110" y="294" font-size="10" fill="#4A443C">1859</text>
    <text x="760" y="294" text-anchor="end" font-size="10" fill="#4A443C">1871</text>
  </g>
</svg>
