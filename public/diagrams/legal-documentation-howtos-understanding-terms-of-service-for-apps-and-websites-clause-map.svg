<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tosMapTitle">
  <title id="tosMapTitle">A simplified anatomy diagram of a terms of service document showing four highlighted sections: acceptance and formation near the top, license and content rights and limitation of liability in the middle, and dispute resolution and arbitration near the bottom, with the rest of the document shown as unhighlighted boilerplate</title>
  <rect width="700" height="460" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="120" y="20" width="460" height="410" rx="6" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.8"/>

    <rect x="140" y="40" width="420" height="50" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="160" y="60" font-size="12" font-weight="700" fill="#1F1B16">1. Acceptance &amp; formation</text>
    <text x="160" y="78" font-size="11" fill="#4A443C">How the agreement is created (clickwrap vs. browsewrap)</text>

    <rect x="140" y="100" width="420" height="26" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1" opacity="0.6"/>
    <text x="160" y="118" font-size="10" fill="#4A443C">Definitions &amp; general boilerplate</text>

    <rect x="140" y="136" width="420" height="60" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="160" y="157" font-size="12" font-weight="700" fill="#1F1B16">2. License &amp; content rights</text>
    <text x="160" y="175" font-size="11" fill="#4A443C">What the company can do with your content or data</text>

    <rect x="140" y="206" width="420" height="26" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1" opacity="0.6"/>
    <text x="160" y="224" font-size="10" fill="#4A443C">Account rules &amp; acceptable use</text>

    <rect x="140" y="242" width="420" height="60" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="160" y="263" font-size="12" font-weight="700" fill="#1F1B16">3. Limitation of liability</text>
    <text x="160" y="281" font-size="11" fill="#4A443C">Caps on what the company owes if something goes wrong</text>

    <rect x="140" y="312" width="420" height="26" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1" opacity="0.6"/>
    <text x="160" y="330" font-size="10" fill="#4A443C">Termination &amp; miscellaneous clauses</text>

    <rect x="140" y="348" width="420" height="60" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="160" y="369" font-size="12" font-weight="700" fill="#1F1B16">4. Dispute resolution &amp; arbitration</text>
    <text x="160" y="387" font-size="11" fill="#4A443C">Arbitration requirement and class-action waiver</text>
  </g>

  <text x="350" y="445" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Highlighted sections carry most of the practical weight; the rest is largely standard boilerplate.</text>
</svg>
