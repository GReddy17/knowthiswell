<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="idTheftTitle">
  <title id="idTheftTitle">How identity theft starts: collection routes (data breaches, phishing and phone scams, stolen mail or wallets, SIM swaps, people you know) feed a thief who assembles enough pieces to pose as you; misuse routes are new credit accounts (stopped by a credit freeze), account takeover (stopped by app-based multi-factor authentication or passkeys) and fake tax returns (stopped by an IRS Identity Protection PIN). If it happens, report at IdentityTheft.gov.</title>
  <rect width="640" height="470" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="105" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">1. Collection</text>
    <text x="320" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">2. Assembly</text>
    <text x="530" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">3. Misuse → defense</text>

    <rect x="20" y="44" width="170" height="40" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="105" y="69" text-anchor="middle" font-size="11" fill="#1F1B16">Data breach at a company</text>
    <rect x="20" y="94" width="170" height="40" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="105" y="119" text-anchor="middle" font-size="11" fill="#1F1B16">Phishing / phone scam</text>
    <rect x="20" y="144" width="170" height="40" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="105" y="169" text-anchor="middle" font-size="11" fill="#1F1B16">Stolen mail or wallet</text>
    <rect x="20" y="194" width="170" height="40" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="105" y="219" text-anchor="middle" font-size="11" fill="#1F1B16">SIM swap (phone number)</text>
    <rect x="20" y="244" width="170" height="40" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="105" y="269" text-anchor="middle" font-size="11" fill="#1F1B16">Someone you know</text>

    <g stroke="#8B6F4E" stroke-width="1.5" fill="none">
      <path d="M190 64 L240 160"/><path d="M190 114 L240 160"/><path d="M190 164 L240 164"/><path d="M190 214 L240 168"/><path d="M190 264 L240 168"/>
    </g>

    <rect x="240" y="110" width="160" height="110" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
    <text x="320" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Thief assembles</text>
    <text x="320" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">enough pieces</text>
    <text x="320" y="180" text-anchor="middle" font-size="10" fill="#4A443C">name + SSN + birth date</text>
    <text x="320" y="196" text-anchor="middle" font-size="10" fill="#4A443C">+ address, logins, phone</text>

    <g stroke="#8B6F4E" stroke-width="1.5" fill="none">
      <path d="M400 150 L440 84"/><path d="M400 165 L440 165"/><path d="M400 180 L440 246"/>
    </g>

    <rect x="440" y="50" width="180" height="70" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="530" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">New credit accounts</text>
    <text x="530" y="98" text-anchor="middle" font-size="10" fill="#2C4A3E">Stop: credit freeze at</text>
    <text x="530" y="112" text-anchor="middle" font-size="10" fill="#2C4A3E">all 3 bureaus (free)</text>
    <rect x="440" y="130" width="180" height="70" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="530" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Account takeover</text>
    <text x="530" y="178" text-anchor="middle" font-size="10" fill="#2C4A3E">Stop: app-based MFA</text>
    <text x="530" y="192" text-anchor="middle" font-size="10" fill="#2C4A3E">or passkeys, carrier PIN</text>
    <rect x="440" y="210" width="180" height="70" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="530" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Fake tax return</text>
    <text x="530" y="258" text-anchor="middle" font-size="10" fill="#2C4A3E">Stop: IRS Identity</text>
    <text x="530" y="272" text-anchor="middle" font-size="10" fill="#2C4A3E">Protection PIN</text>

    <rect x="120" y="330" width="400" height="56" rx="6" fill="#2C4A3E"/>
    <text x="320" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#FBF8F1">If it happens: IdentityTheft.gov</text>
    <text x="320" y="373" text-anchor="middle" font-size="11" fill="#FBF8F1">FTC report + personalized recovery plan</text>

    <text x="320" y="420" text-anchor="middle" font-size="10" fill="#4A443C">You can't fully stop collection (breaches happen to companies).</text>
    <text x="320" y="438" text-anchor="middle" font-size="10" fill="#4A443C">You can make the stolen pieces much less useful.</text>
  </g>
</svg>
