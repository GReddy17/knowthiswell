<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plungerTitle">
  <title id="plungerTitle">A comparison diagram of a plunger's two strokes on a clogged sink drain: the push stroke compresses the trapped, incompressible water in the cup and transmits force down through the trap directly against the clog, and the pull stroke that follows creates a brief reverse pull that helps loosen the clog from the other side.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">A plunger's two strokes work in opposite directions</text>

  <text x="195" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">Push stroke</text>
  <rect x="70" y="64" width="250" height="182" rx="8" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="195" y1="76" x2="195" y2="112" stroke="#4A443C" stroke-width="6"/>
  <path d="M 150,112 L 240,112 L 225,150 L 165,150 Z" fill="none" stroke="#2C4A3E" stroke-width="3"/>
  <text x="195" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#2C4A3E">water in cup</text>
  <line x1="195" y1="112" x2="195" y2="150" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowPL)"/>
  <path d="M 175,150 L 175,190" stroke="#4A443C" stroke-width="10"/>
  <line x1="195" y1="155" x2="195" y2="188" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowPL)"/>
  <text x="195" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#1F1B16">force pushes clog forward</text>
  <text x="195" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2C4A3E">incompressible water transmits force</text>

  <text x="585" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#8B6F4E">Pull stroke</text>
  <rect x="460" y="64" width="250" height="182" rx="8" fill="none" stroke="#8B6F4E" stroke-width="1.5"/>
  <line x1="585" y1="76" x2="585" y2="100" stroke="#4A443C" stroke-width="6"/>
  <line x1="585" y1="100" x2="585" y2="76" stroke="#8B6F4E" stroke-width="3" marker-end="url(#arrowPLup)"/>
  <path d="M 540,112 L 630,112 L 615,150 L 555,150 Z" fill="none" stroke="#8B6F4E" stroke-width="3"/>
  <text x="585" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8B6F4E">cup lifts, pressure drops</text>
  <path d="M 565,150 L 565,190" stroke="#4A443C" stroke-width="10"/>
  <line x1="585" y1="188" x2="585" y2="158" stroke="#8B6F4E" stroke-width="3" marker-end="url(#arrowPLup)"/>
  <text x="585" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#1F1B16">brief pull helps break clog free</text>
  <text x="585" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#8B6F4E">reverse force, not steady suction</text>

  <text x="390" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Repeating both strokes, with the cup fully submerged, does the actual work of dislodging a clog.</text>

  <defs>
    <marker id="arrowPL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowPLup" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,8 L8,4 L0,0 Z" fill="#8B6F4E"/>
    </marker>
  </defs>
</svg>
