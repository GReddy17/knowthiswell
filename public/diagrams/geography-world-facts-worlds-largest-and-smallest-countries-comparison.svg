<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="largestSmallestTitle">
  <title id="largestSmallestTitle">Side-by-side comparison: a bar chart ranking the four largest countries by land area — Russia, Canada, China, United States, with Russia's bar dramatically longer — next to a bar chart ranking the four largest countries by population — India, China, United States, Indonesia, with Russia notably absent from the population top four; an inset shows Vatican City as a tiny dot for scale against Russia's bar</title>
  <rect width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="24" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Largest vs. smallest countries: area and population rank differently</text>

  <!-- LEFT PANEL: area -->
  <g>
    <text x="160" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Largest by land area</text>

    <text x="16" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Russia</text>
    <rect x="70" y="64" width="230" height="18" fill="#2C4A3E"/>
    <text x="304" y="77" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">17.1M km&#178;</text>

    <text x="16" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Canada</text>
    <rect x="70" y="90" width="110" height="18" fill="#4A6E5D"/>
    <text x="184" y="103" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">10.0M km&#178;</text>

    <text x="16" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">China</text>
    <rect x="70" y="116" width="105" height="18" fill="#4A6E5D"/>
    <text x="179" y="129" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">9.6M km&#178;</text>

    <text x="16" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">United States</text>
    <rect x="70" y="142" width="104" height="18" fill="#4A6E5D"/>
    <text x="178" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">9.5M km&#178;</text>
  </g>

  <line x1="320" y1="40" x2="320" y2="200" stroke="#E3DCC9" stroke-width="1"/>

  <!-- RIGHT PANEL: population -->
  <g>
    <text x="480" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Largest by population</text>

    <text x="336" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">India</text>
    <rect x="390" y="64" width="230" height="18" fill="#B24A38"/>
    <text x="624" y="77" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">~1.44B</text>

    <text x="336" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">China</text>
    <rect x="390" y="90" width="222" height="18" fill="#C46F5E"/>
    <text x="616" y="103" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">~1.41B</text>

    <text x="336" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">United States</text>
    <rect x="390" y="116" width="68" height="18" fill="#C46F5E"/>
    <text x="462" y="129" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">~340M</text>

    <text x="336" y="154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Indonesia</text>
    <rect x="390" y="142" width="56" height="18" fill="#C46F5E"/>
    <text x="450" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">~280M</text>

    <text x="336" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-style="italic" fill="#8B6F4E">Russia (largest by area) doesn't</text>
    <text x="336" y="194" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-style="italic" fill="#8B6F4E">rank in the population top 4</text>
  </g>

  <line x1="40" y1="215" x2="600" y2="215" stroke="#E3DCC9" stroke-width="1"/>

  <!-- inset: Vatican City scale -->
  <g>
    <text x="320" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Smallest country, for scale</text>
    <rect x="70" y="256" width="500" height="14" fill="#2C4A3E"/>
    <text x="576" y="267" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Russia: 17.1M km&#178;</text>
    <circle cx="72" cy="263" r="2.2" fill="#C9412C"/>
    <line x1="72" y1="256" x2="72" y2="290" stroke="#C9412C" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="72" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#8A3626">Vatican City</text>
    <text x="72" y="317" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8A3626">0.44 km&#178; — a single dot</text>
    <text x="72" y="329" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8A3626">at this scale</text>
  </g>

  <text x="320" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">Vatican City would need to be repeated about 39 million times to equal Russia's land area.</text>
  <text x="320" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">Figures rounded for clarity; area and population change slowly over time.</text>
</svg>
