<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ratioTitle">
  <title id="ratioTitle">A bar split into a 2 to 3 ratio, with 2 equal green segments on the left and 3 equal red segments on the right, showing the same relationship as 12 to 18</title>
  <rect width="640" height="300" fill="#FBF8F1"/>

  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#20362D">12:18 simplifies to 2:3</text>

  <g transform="translate(110,100)">
    <rect x="0" y="0" width="84" height="80" fill="#2C4A3E"/>
    <rect x="84" y="0" width="84" height="80" fill="#2C4A3E"/>
    <rect x="168" y="0" width="84" height="80" fill="#C9412C"/>
    <rect x="252" y="0" width="84" height="80" fill="#C9412C"/>
    <rect x="336" y="0" width="84" height="80" fill="#C9412C"/>
    <line x1="84" y1="0" x2="84" y2="80" stroke="#FBF8F1" stroke-width="3"/>
    <line x1="252" y1="0" x2="252" y2="80" stroke="#FBF8F1" stroke-width="3"/>
    <line x1="336" y1="0" x2="336" y2="80" stroke="#FBF8F1" stroke-width="3"/>
    <line x1="168" y1="0" x2="168" y2="80" stroke="#1F1B16" stroke-width="3.5"/>
    <rect x="0" y="0" width="420" height="80" fill="none" stroke="#1F1B16" stroke-width="2.5"/>
  </g>

  <text x="194" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2C4A3E">2 parts</text>
  <text x="446" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#C9412C">3 parts</text>

  <text x="320" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Every segment is the same size — the ratio describes the relationship, not the amount.</text>
</svg>
