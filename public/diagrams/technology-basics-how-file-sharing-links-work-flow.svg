<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fileShareFlowTitle">
  <title id="fileShareFlowTitle">A flow diagram showing a file uploaded to cloud storage and assigned a unique address, that address wrapped into a shareable link, the link sent to a recipient, and the recipient's click routed through a permission check before either being granted access to the stored file or denied if the link has expired or been revoked.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <rect x="30" y="120" width="110" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">File uploaded</text>
  <text x="85" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">to cloud storage</text>

  <defs>
    <marker id="arrowFs" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M140,145 L198,145" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowFs)"/>

  <rect x="200" y="120" width="120" height="50" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="260" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Unique link</text>
  <text x="260" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">generated (token)</text>

  <path d="M320,145 L378,145" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowFs)"/>

  <rect x="380" y="120" width="110" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="435" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Sent to</text>
  <text x="435" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">recipient</text>

  <path d="M490,145 L548,145" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowFs)"/>

  <rect x="550" y="110" width="130" height="70" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="615" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Permission check</text>
  <text x="615" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">still active? expired?</text>
  <text x="615" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">password? revoked?</text>

  <path d="M680,135 C 720,110 745,90 745,70" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowFs)"/>
  <rect x="690" y="35" width="100" height="34" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.3"/>
  <text x="740" y="56" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1F1B16">Access granted</text>

  <path d="M680,158 C 720,190 745,215 745,235" fill="none" stroke="#B5493A" stroke-width="1.5" marker-end="url(#arrowFs)"/>
  <rect x="690" y="238" width="100" height="34" fill="#EDE7D8" stroke="#B5493A" stroke-width="1.3"/>
  <text x="740" y="259" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#B5493A">Access denied</text>

  <text x="400" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">The file never physically moves — the link is a key pointing back to one storage location.</text>
  <text x="400" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Anyone holding a valid link is checked the same way, every time.</text>
</svg>
