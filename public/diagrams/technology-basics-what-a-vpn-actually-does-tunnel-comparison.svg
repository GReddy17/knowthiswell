<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vpnTunnelTitle">
  <title id="vpnTunnelTitle">A comparison diagram showing, on top, a device connecting directly to a website with the ISP able to see the destination in between, and on the bottom, the same device connecting through an encrypted VPN tunnel to a VPN server, which then connects onward to the same website, with the ISP now only able to see encrypted traffic to the VPN server and the VPN server shown as the new point with visibility into the traffic.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <text x="30" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Without a VPN</text>

  <rect x="30" y="45" width="110" height="46" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Device</text>

  <rect x="330" y="45" width="110" height="46" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="385" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">ISP</text>

  <rect x="630" y="45" width="140" height="46" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
  <text x="700" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Website</text>

  <defs>
    <marker id="arrowVpn" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M140,68 L328,68" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowVpn)"/>
  <text x="234" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">plain traffic</text>
  <path d="M440,68 L628,68" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowVpn)"/>
  <text x="534" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">ISP sees destination</text>

  <text x="30" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">With a VPN</text>

  <rect x="30" y="165" width="110" height="46" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Device</text>

  <rect x="230" y="165" width="110" height="46" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="285" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">ISP</text>

  <rect x="430" y="165" width="140" height="46" fill="#EDE7D8" stroke="#B5493A" stroke-width="2"/>
  <text x="500" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">VPN server</text>
  <text x="500" y="201" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">(sees decrypted traffic)</text>

  <rect x="630" y="165" width="140" height="46" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
  <text x="700" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Website</text>

  <path d="M140,188 L228,188" fill="none" stroke="#2C4A3E" stroke-width="2.5" marker-end="url(#arrowVpn)"/>
  <text x="184" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2C4A3E">encrypted tunnel</text>
  <path d="M340,188 L428,188" fill="none" stroke="#2C4A3E" stroke-width="2.5" marker-end="url(#arrowVpn)"/>
  <text x="384" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2C4A3E">encrypted (ISP sees only this)</text>
  <path d="M570,188 L628,188" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowVpn)"/>
  <text x="599" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">plain onward</text>

  <text x="400" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Visibility relocates from the ISP to the VPN provider — it doesn't disappear.</text>
</svg>
