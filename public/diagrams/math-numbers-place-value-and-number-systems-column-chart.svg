<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pvTitle">
  <title id="pvTitle">The number 5,204 broken into place value columns: thousands, hundreds, tens, and ones, each shown with its column value</title>
  <rect width="640" height="380" fill="#FBF8F1"/>

  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#20362D">5,204 by place value</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="90" y="90" width="90" height="90" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="135" y="145" text-anchor="middle" font-size="34" font-weight="700" fill="#2C4A3E">5</text>
    <text x="135" y="200" text-anchor="middle" font-size="13" fill="#4A443C">thousands</text>
    <text x="135" y="218" text-anchor="middle" font-size="12" fill="#8B6F4E">= 5,000</text>

    <rect x="190" y="90" width="90" height="90" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="235" y="145" text-anchor="middle" font-size="34" font-weight="700" fill="#2C4A3E">2</text>
    <text x="235" y="200" text-anchor="middle" font-size="13" fill="#4A443C">hundreds</text>
    <text x="235" y="218" text-anchor="middle" font-size="12" fill="#8B6F4E">= 200</text>

    <rect x="290" y="90" width="90" height="90" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="335" y="145" text-anchor="middle" font-size="34" font-weight="700" fill="#8B6F4E">0</text>
    <text x="335" y="200" text-anchor="middle" font-size="13" fill="#4A443C">tens</text>
    <text x="335" y="218" text-anchor="middle" font-size="12" fill="#8B6F4E">= 0</text>

    <rect x="390" y="90" width="90" height="90" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
    <text x="435" y="145" text-anchor="middle" font-size="34" font-weight="700" fill="#C9412C">4</text>
    <text x="435" y="200" text-anchor="middle" font-size="13" fill="#4A443C">ones</text>
    <text x="435" y="218" text-anchor="middle" font-size="12" fill="#8B6F4E">= 4</text>
  </g>

  <text x="320" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">Each column is worth 10 times the column to its right —</text>
  <text x="320" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">the same digit means something different depending on position.</text>
  <text x="320" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">5,204 = 5,000 + 200 + 0 + 4</text>
</svg>
