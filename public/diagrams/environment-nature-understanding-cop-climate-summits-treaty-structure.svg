<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="copStructureTitle">
  <title id="copStructureTitle">A hierarchy diagram with the 1992 UNFCCC treaty at the top, an arrow down to the annual COP meeting as its governing body, and two branches below showing landmark outputs: the 1997 Kyoto Protocol from COP3 and the 2015 Paris Agreement from COP21, alongside a repeating row of ordinary annual COP sessions that produce incremental decisions</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="290" y="20" width="200" height="60" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">UNFCCC (1992)</text>
  <text x="390" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">the treaty itself</text>

  <line x1="390" y1="80" x2="390" y2="120" stroke="#2C4A3E" stroke-width="2"/>

  <rect x="270" y="120" width="240" height="60" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F1B16">COP — annual meeting</text>
  <text x="390" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">the treaty's governing body</text>

  <line x1="330" y1="180" x2="140" y2="220" stroke="#B5493A" stroke-width="2"/>
  <line x1="450" y1="180" x2="640" y2="220" stroke="#B5493A" stroke-width="2"/>
  <line x1="390" y1="180" x2="390" y2="250" stroke="#2C4A3E" stroke-width="1.6" stroke-dasharray="4,3"/>

  <rect x="30" y="220" width="220" height="60" rx="10" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="140" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">COP3 (1997)</text>
  <text x="140" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">-&gt; Kyoto Protocol</text>

  <rect x="530" y="220" width="220" height="60" rx="10" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="640" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">COP21 (2015)</text>
  <text x="640" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">-&gt; Paris Agreement</text>

  <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">(dashed line) most other ~30 annual COP sessions: incremental technical &amp; procedural decisions</text>
</svg>
