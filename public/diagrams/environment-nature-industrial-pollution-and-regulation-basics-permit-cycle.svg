<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="permitCycleTitle">
  <title id="permitCycleTitle">A circular flow diagram with four connected stages: permit issued with a BACT-based limit, facility operates and continuously monitors emissions, facility reports monitoring data to regulators, and regulators verify compliance — looping back to permit issued, with a branch off the reporting stage leading to an enforcement action box for any detected violation</title>
  <rect width="700" height="500" fill="#FBF8F1"/>

  <!-- Stage 1: top -->
  <rect x="250" y="20" width="200" height="80" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="350" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Permit issued</text>
  <text x="350" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">(BACT-based limit)</text>

  <path d="M450 60 Q560 100 570 220" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrowP)"/>

  <!-- Stage 2: right -->
  <rect x="480" y="230" width="200" height="80" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Facility operates</text>
  <text x="580" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">continuously monitors</text>

  <path d="M480 280 Q380 340 260 320" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrowP)"/>

  <!-- Stage 3: bottom -->
  <rect x="60" y="330" width="200" height="80" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="160" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Reports data</text>
  <text x="160" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">to regulators</text>

  <path d="M150 330 Q90 220 200 100" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrowP)"/>

  <!-- Stage 4: left -->
  <rect x="20" y="100" width="200" height="80" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Verify compliance</text>
  <text x="120" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">against permit limit</text>

  <path d="M220 130 Q280 60 250 40" stroke="#2C4A3E" stroke-width="2" fill="none" marker-end="url(#arrowP)"/>

  <!-- branch to enforcement -->
  <path d="M260 370 L350 400" stroke="#B5493A" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowPr)"/>
  <rect x="360" y="400" width="220" height="80" rx="10" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="470" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Enforcement action</text>
  <text x="470" y="450" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">(if violation detected)</text>

  <defs>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/></marker>
    <marker id="arrowPr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/></marker>
  </defs>
</svg>
