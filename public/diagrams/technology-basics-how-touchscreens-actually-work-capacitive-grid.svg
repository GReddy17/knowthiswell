<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="touchscreenTitle">
  <title id="touchscreenTitle">Diagram of a projected-capacitive touchscreen's grid of transparent electrodes, showing how a finger touching one intersection distorts the local electric field so the controller can calculate an X and Y coordinate</title>
  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <rect x="90" y="50" width="460" height="280" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>

  <!-- vertical electrode lines -->
  <g stroke="#2C4A3E" stroke-width="2" opacity="0.6">
    <line x1="140" y1="50" x2="140" y2="330"/>
    <line x1="210" y1="50" x2="210" y2="330"/>
    <line x1="280" y1="50" x2="280" y2="330"/>
    <line x1="350" y1="50" x2="350" y2="330"/>
    <line x1="420" y1="50" x2="420" y2="330"/>
    <line x1="490" y1="50" x2="490" y2="330"/>
  </g>
  <!-- horizontal electrode lines -->
  <g stroke="#8B6F4E" stroke-width="2" opacity="0.6">
    <line x1="90" y1="90" x2="550" y2="90"/>
    <line x1="90" y1="140" x2="550" y2="140"/>
    <line x1="90" y1="190" x2="550" y2="190"/>
    <line x1="90" y1="240" x2="550" y2="240"/>
    <line x1="90" y1="290" x2="550" y2="290"/>
  </g>

  <!-- finger touch point -->
  <circle cx="350" cy="190" r="26" fill="#C9412C" opacity="0.25"/>
  <circle cx="350" cy="190" r="10" fill="#C9412C"/>
  <!-- ripple rings showing field distortion -->
  <circle cx="350" cy="190" r="40" fill="none" stroke="#C9412C" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>
  <circle cx="350" cy="190" r="55" fill="none" stroke="#C9412C" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>

  <text x="350" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16" font-weight="600">Finger draws charge</text>
  <text x="350" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16" font-weight="600">from nearby electrodes</text>

  <!-- controller box -->
  <rect x="230" y="345" width="180" height="45" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Controller chip calculates X, Y</text>
  <path d="M 350,330 L 340,343 L 360,343 Z" fill="#2C4A3E"/>

  <text x="120" y="35" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Column electrodes</text>
  <text x="470" y="405" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Row electrodes</text>
</svg>
