<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hpaTitle">
  <title id="hpaTitle">A three-step flow diagram showing the hypothalamic-pituitary-adrenal axis: the hypothalamus signaling the pituitary gland, the pituitary gland signaling the adrenal glands, and the adrenal glands releasing cortisol into the bloodstream, with a branching note distinguishing a brief acute response that returns to baseline from a sustained chronic response that stays elevated.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <rect x="30" y="50" width="160" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Hypothalamus</text>

  <text x="215" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="240" y="50" width="160" height="70" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Pituitary gland</text>

  <text x="425" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="450" y="50" width="160" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="530" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Adrenal glands</text>
  <text x="530" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">release cortisol</text>

  <line x1="530" y1="120" x2="530" y2="150" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M 460 150 L 600 150" stroke="#2C4A3E" stroke-width="1.6"/>

  <rect x="330" y="170" width="180" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="420" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Acute: brief spike,</text>
  <text x="420" y="213" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">returns to baseline</text>

  <rect x="550" y="170" width="180" height="60" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
  <text x="640" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Chronic: stays</text>
  <text x="640" y="213" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">elevated over time</text>

  <text x="390" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Same relay in both branches — duration is what differs</text>
</svg>
