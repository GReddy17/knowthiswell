<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="barcodeTitle">
  <title id="barcodeTitle">A diagram of a barcode's black and white bars of varying widths, with a red laser scan line passing across them, and below it the bars grouped into pairs that map to the digits 0 through 9 printed underneath.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Bar widths encode digits, not the bars themselves</text>

  <!-- barcode bars -->
  <g transform="translate(150,60)">
    <rect x="0" width="3" height="120" fill="#1F1B16"/>
    <rect x="6" width="6" height="120" fill="#1F1B16"/>
    <rect x="16" width="2" height="120" fill="#1F1B16"/>
    <rect x="22" width="4" height="120" fill="#1F1B16"/>
    <rect x="32" width="8" height="120" fill="#1F1B16"/>
    <rect x="44" width="2" height="120" fill="#1F1B16"/>
    <rect x="50" width="3" height="120" fill="#1F1B16"/>
    <rect x="58" width="6" height="120" fill="#1F1B16"/>
    <rect x="68" width="2" height="120" fill="#1F1B16"/>
    <rect x="74" width="4" height="120" fill="#1F1B16"/>
    <rect x="84" width="3" height="120" fill="#1F1B16"/>
    <rect x="92" width="7" height="120" fill="#1F1B16"/>
    <rect x="104" width="2" height="120" fill="#1F1B16"/>
    <rect x="110" width="5" height="120" fill="#1F1B16"/>
    <rect x="120" width="3" height="120" fill="#1F1B16"/>
    <rect x="128" width="6" height="120" fill="#1F1B16"/>
    <rect x="138" width="2" height="120" fill="#1F1B16"/>
    <rect x="144" width="4" height="120" fill="#1F1B16"/>
    <rect x="154" width="8" height="120" fill="#1F1B16"/>
    <rect x="166" width="2" height="120" fill="#1F1B16"/>
    <rect x="172" width="3" height="120" fill="#1F1B16"/>
    <rect x="180" width="5" height="120" fill="#1F1B16"/>
    <rect x="190" width="2" height="120" fill="#1F1B16"/>
    <rect x="196" width="4" height="120" fill="#1F1B16"/>
    <rect x="206" width="3" height="120" fill="#1F1B16"/>
    <rect x="214" width="6" height="120" fill="#1F1B16"/>
    <rect x="224" width="2" height="120" fill="#1F1B16"/>
    <rect x="230" width="4" height="120" fill="#1F1B16"/>
    <rect x="240" width="3" height="120" fill="#1F1B16"/>
    <rect x="248" width="7" height="120" fill="#1F1B16"/>
    <rect x="260" width="2" height="120" fill="#1F1B16"/>
    <rect x="266" width="5" height="120" fill="#1F1B16"/>
    <rect x="276" width="3" height="120" fill="#1F1B16"/>
    <rect x="284" width="6" height="120" fill="#1F1B16"/>
    <rect x="294" width="2" height="120" fill="#1F1B16"/>
    <rect x="300" width="4" height="120" fill="#1F1B16"/>

    <!-- scan line -->
    <line x1="-10" y1="60" x2="320" y2="60" stroke="#B5493A" stroke-width="2"/>
    <circle cx="-10" cy="60" r="4" fill="#B5493A"/>

    <!-- grouped digit labels below -->
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">
      <text x="20" y="150">0</text>
      <text x="65" y="150">1</text>
      <text x="105" y="150">2</text>
      <text x="150" y="150">3</text>
      <text x="195" y="150">7</text>
      <text x="235" y="150">4</text>
      <text x="278" y="150">9</text>
    </g>
    <path d="M0,132 L38,132 L38,124 L0,124 Z" fill="none" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <rect x="90" y="200" width="600" height="60" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="390" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Scanner reads reflected light intensity along the line</text>
  <text x="390" y="242" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">wide bar/gap = binary "1"s in a row, narrow = fewer — width pattern per group maps to one digit</text>

  <text x="390" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">The scanner never "reads" a number visually — it measures timed light pulses and looks up the matching digit pattern.</text>
</svg>
