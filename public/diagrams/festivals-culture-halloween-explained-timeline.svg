<svg viewBox="0 0 1070 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline from the ancient Celtic festival of Samhain marking the end of harvest and start of winter in Ireland and the British Isles, through the Christian church's All Hallows' Eve and All Saints' Day observances overlapping that date, medieval souling and guising door-to-door practices, 19th-century Irish immigration carrying these customs to the United States, trick-or-treating becoming a widely codified American practice in the 1920s, and Halloween's spread today as a largely secular, commercial holiday in many countries</title>
  <rect width="1070" height="230" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="535" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">From an ancient Celtic festival to a modern commercial holiday</text>

    <rect x="40" y="115" width="175" height="40" fill="#EEF3EE"/>
    <text x="127" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Samhain</text>
    <text x="127" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">end of harvest, start of winter</text>
    <text x="127" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">ancient, Ireland &amp; Britain</text>

    <rect x="215" y="115" width="175" height="40" fill="#FBEDEA"/>
    <text x="302" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">All Hallows' Eve</text>
    <text x="302" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">Christian observance overlaps the date</text>
    <text x="302" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">medieval era</text>

    <rect x="390" y="115" width="175" height="40" fill="#EDE7D8"/>
    <text x="477" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Souling &amp; guising</text>
    <text x="477" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">door-to-door customs develop</text>
    <text x="477" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">medieval era</text>

    <rect x="565" y="115" width="175" height="40" fill="#EEF3EE"/>
    <text x="652" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Irish immigration</text>
    <text x="652" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">customs carried to the United States</text>
    <text x="652" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">19th century</text>

    <rect x="740" y="115" width="165" height="40" fill="#FBEDEA"/>
    <text x="822" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Trick-or-treating codified</text>
    <text x="822" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">becomes a widespread US practice</text>
    <text x="822" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1920s</text>

    <rect x="905" y="115" width="125" height="40" fill="#EDE7D8"/>
    <text x="967" y="100" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1B16">Secular &amp; commercial</text>
    <text x="967" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">widely marked in many countries</text>
    <text x="967" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Today</text>
  </g>
  <rect x="40" y="115" width="990" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="215" y1="115" x2="215" y2="155" stroke="#1F1B16"/>
  <line x1="390" y1="115" x2="390" y2="155" stroke="#1F1B16"/>
  <line x1="565" y1="115" x2="565" y2="155" stroke="#1F1B16"/>
  <line x1="740" y1="115" x2="740" y2="155" stroke="#1F1B16"/>
  <line x1="905" y1="115" x2="905" y2="155" stroke="#1F1B16"/>
  <text x="535" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Layers of Celtic, Christian, and immigrant custom, codified into an American practice by the 1920s</text>
</svg>
