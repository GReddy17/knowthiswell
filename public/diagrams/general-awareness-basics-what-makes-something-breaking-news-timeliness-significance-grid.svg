<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="breakingNewsGridTitle">
  <title id="breakingNewsGridTitle">A two-axis grid with timeliness on the horizontal axis and significance on the vertical axis. An earthquake story sits high on both axes. A scheduled economic report sits high on significance but low on timeliness. A small local fire sits high on timeliness but modest on significance. The breaking-news label clusters around stories high on the timeliness axis regardless of where they land on the significance axis</title>
  <rect width="780" height="340" fill="#FBF8F1"/>

  <line x1="80" y1="290" x2="700" y2="290" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="80" y1="40" x2="80" y2="290" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="390" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Timeliness &#8594;</text>
  <text x="35" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16" transform="rotate(-90 35 165)">Significance &#8594;</text>

  <rect x="500" y="200" width="170" height="60" rx="20" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.6"/>

  <circle cx="600" cy="80" r="9" fill="#B5493A"/>
  <text x="600" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Earthquake</text>

  <circle cx="150" cy="90" r="9" fill="#2C4A3E"/>
  <text x="150" y="75" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Scheduled econ. report</text>

  <circle cx="580" cy="230" r="9" fill="#2C4A3E"/>
  <text x="580" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Small local fire</text>

  <text x="585" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">&quot;breaking&quot; cluster</text>

  <text x="390" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">&quot;Breaking&quot; tracks timeliness, not significance alone</text>
</svg>
