<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="antarcticaCrossTitle">
  <title id="antarcticaCrossTitle">A cross-section of Antarctica showing the ice sheet rising to over 4 kilometers thick at the continent's interior, bedrock beneath the ice dipping below sea level in several regions, coastal research stations marked around the continent's edge where most population is concentrated, and the South Pole marked at the center of the high interior plateau</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Antarctica: ice sheet cross-section</text>

  <!-- ocean -->
  <rect x="30" y="60" width="580" height="260" fill="#EAF0F4"/>
  <line x1="30" y1="300" x2="610" y2="300" stroke="#5B7A99" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="580" y="296" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3F5E78">sea level</text>

  <!-- bedrock, dipping below sea level under the thickest ice -->
  <path d="M 40,285 C 130,282 210,300 280,325 C 330,343 350,346 320,346 C 250,346 190,335 150,320 C 100,300 60,290 40,288 Z" fill="#C9A66B" opacity="0.35"/>
  <path d="M 60,275 C 150,255 230,280 300,320 C 360,352 420,352 470,325 C 520,300 560,282 600,278" fill="none" stroke="#8B6F4E" stroke-width="2"/>
  <path d="M 300,320 C 360,352 420,352 470,325" fill="none" stroke="#8B6F4E" stroke-width="2"/>

  <!-- ice sheet dome -->
  <path d="M 60,275 C 110,220 180,150 260,110 C 300,90 340,80 380,85 C 440,95 500,140 550,200 C 575,232 592,258 600,278 L 600,278 C 560,282 520,300 470,325 C 420,352 360,352 300,320 C 230,280 150,255 60,275 Z"
        fill="#EEF3EE" stroke="#20362D" stroke-width="1.5" opacity="0.92"/>

  <!-- South Pole marker at the peak -->
  <g>
    <line x1="330" y1="82" x2="330" y2="60" stroke="#1F1B16" stroke-width="1.5"/>
    <path d="M 330,60 L 358,68 L 330,76 Z" fill="#8B4A3A"/>
    <circle cx="330" cy="82" r="3.5" fill="#1F1B16"/>
  </g>
  <text x="330" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">South Pole</text>
  <text x="330" y="60.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C" dy="14">interior plateau</text>

  <!-- coastal research stations -->
  <g fill="#B24A38">
    <circle cx="70" cy="270" r="4.5"/>
    <circle cx="560" cy="205" r="4.5"/>
    <circle cx="595" cy="268" r="4.5"/>
    <circle cx="140" cy="248" r="4.5"/>
  </g>
  <text x="70" y="256" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8A3626">station</text>
  <text x="595" y="254" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8A3626">station</text>
  <text x="320" y="386" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Most of Antarctica's ~70 research stations sit near the coast; only a handful, including the South Pole station, are in the interior.</text>

  <!-- ice thickness callout -->
  <line x1="330" y1="86" x2="330" y2="150" stroke="#4A443C" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="345" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">ice &gt; 4 km thick</text>

  <!-- bedrock label -->
  <text x="290" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6B5636">bedrock below sea level</text>
  <text x="70" y="415" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">ice sheet</text>
  <rect x="55" y="405" width="10" height="10" fill="#EEF3EE" stroke="#20362D"/>
  <text x="180" y="415" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">bedrock</text>
  <rect x="165" y="405" width="10" height="10" fill="#C9A66B" opacity="0.5" stroke="#8B6F4E"/>
</svg>
