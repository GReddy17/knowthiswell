<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bizRegFlowTitle">
  <title id="bizRegFlowTitle">A flow diagram showing four sequential steps: Choose a Business Structure, File Formation Documents with the State, Apply for a Federal EIN, and Obtain Industry or Local Licenses and Permits</title>
  <rect width="720" height="260" fill="#FBF8F1"/>

  <rect x="10" y="60" width="165" height="70" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="92" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Choose a Business</text>
  <text x="92" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Structure</text>

  <rect x="195" y="60" width="165" height="70" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="277" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">File Formation Docs</text>
  <text x="277" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">with the State</text>

  <rect x="380" y="60" width="165" height="70" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="462" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Apply for a</text>
  <text x="462" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Federal EIN</text>

  <rect x="565" y="60" width="150" height="70" rx="6" fill="#2C4A3E"/>
  <text x="640" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Local/Industry</text>
  <text x="640" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Licenses &amp; Permits</text>

  <line x1="175" y1="95" x2="195" y2="95" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="360" y1="95" x2="380" y2="95" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="545" y1="95" x2="565" y2="95" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow4)"/>
  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="360" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each step generally requires the previous one to already exist</text>
</svg>
