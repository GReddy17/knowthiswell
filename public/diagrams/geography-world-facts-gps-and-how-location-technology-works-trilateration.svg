<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trilaterationTitle">
  <title id="trilaterationTitle">Three-step diagram of GPS trilateration: one satellite's distance circle leaves many possible locations, a second satellite's circle narrows it to two points, and a third satellite's circle narrows it down to one exact receiver location, with a note that a fourth satellite corrects the receiver's clock error</title>
  <rect width="780" height="360" fill="#FBF8F1"/>

  <text x="390" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="19" font-weight="600" fill="#1F1B16">How trilateration finds your location</text>

  <line x1="260" y1="50" x2="260" y2="300" stroke="#E3DCC9" stroke-width="1"/>
  <line x1="520" y1="50" x2="520" y2="300" stroke="#E3DCC9" stroke-width="1"/>

  <!-- Step 1: one satellite circle -->
  <g>
    <text x="130" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4A443C">1. ONE SATELLITE</text>
    <circle cx="130" cy="180" r="90" fill="none" stroke="#2C4A3E" stroke-width="2"/>
    <circle cx="130" cy="180" r="3.5" fill="#2C4A3E"/>
    <text x="140" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">satellite A</text>
    <circle cx="130" cy="90" r="4" fill="#C9412C"/>
    <text x="130" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">many possible points</text>
    <text x="130" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(anywhere on the circle)</text>
  </g>

  <!-- Step 2: two circles, two intersection points -->
  <g>
    <text x="390" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4A443C">2. TWO SATELLITES</text>
    <circle cx="350" cy="190" r="90" fill="none" stroke="#2C4A3E" stroke-width="2"/>
    <circle cx="430" cy="190" r="90" fill="none" stroke="#4A7A9E" stroke-width="2"/>
    <circle cx="350" cy="190" r="3.5" fill="#2C4A3E"/>
    <circle cx="430" cy="190" r="3.5" fill="#4A7A9E"/>
    <circle cx="390" cy="120" r="5" fill="#C9412C"/>
    <circle cx="390" cy="256" r="5" fill="#C9412C"/>
    <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">narrowed to 2 points</text>
  </g>

  <!-- Step 3: three circles, one point -->
  <g>
    <text x="650" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4A443C">3. THREE SATELLITES</text>
    <circle cx="610" cy="200" r="85" fill="none" stroke="#2C4A3E" stroke-width="2"/>
    <circle cx="690" cy="200" r="85" fill="none" stroke="#4A7A9E" stroke-width="2"/>
    <circle cx="650" cy="130" r="85" fill="none" stroke="#C97C3D" stroke-width="2"/>
    <circle cx="650" cy="182" r="6" fill="#C9412C" stroke="#FBF8F1" stroke-width="1.5"/>
    <text x="650" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">exact location found</text>
  </g>

  <line x1="30" y1="330" x2="750" y2="330" stroke="#E3DCC9" stroke-width="1"/>
  <text x="390" y="352" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">A fourth satellite is used separately to correct the receiver's clock error.</text>
</svg>
