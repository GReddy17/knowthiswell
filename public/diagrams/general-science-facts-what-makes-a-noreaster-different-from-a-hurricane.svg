<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="noreasterTitle">
  <title id="noreasterTitle">Comparison of a hurricane, a warm-core storm fueled by heat from warm tropical ocean water, against a nor'easter, a cold-core storm fueled by cold Arctic air colliding with warm moist air over the Gulf Stream</title>
  <defs>
    <marker id="arrowGreenNE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowBrickNE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9412C"/>
    </marker>
  </defs>
  <rect width="640" height="340" fill="#FBF8F1"/>

  <text x="160" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="700" fill="#1F1B16">Hurricane (warm-core)</text>
  <circle cx="160" cy="150" r="55" fill="none" stroke="#C9412C" stroke-width="3"/>
  <text x="160" y="155" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="30">🌀</text>
  <path d="M160,260 L160,215" stroke="#C9412C" stroke-width="3" marker-end="url(#arrowBrickNE)"/>
  <text x="160" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#C9412C">Warm ocean water</text>
  <text x="160" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#C9412C">evaporating upward</text>
  <text x="160" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Fuel: one source (ocean heat)</text>

  <line x1="320" y1="40" x2="320" y2="300" stroke="#1F1B16" stroke-width="1" opacity="0.25"/>

  <text x="480" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="700" fill="#1F1B16">Nor'easter (cold-core)</text>
  <circle cx="480" cy="150" r="55" fill="none" stroke="#2C4A3E" stroke-width="3"/>
  <text x="480" y="155" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="30">🌀</text>
  <path d="M400,120 L440,140" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowGreenNE)"/>
  <text x="380" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">Cold Arctic air</text>
  <path d="M560,120 L520,140" stroke="#C9412C" stroke-width="3" marker-end="url(#arrowBrickNE)"/>
  <text x="580" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#C9412C">Warm Gulf Stream air</text>
  <text x="480" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Fuel: temperature clash</text>
  <text x="480" y="305" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">(baroclinic instability)</text>

  <text x="320" y="330" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">Same wind speeds are possible — the engines underneath are completely different</text>
</svg>
