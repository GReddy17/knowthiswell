<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="batEchoTitle">
  <title id="batEchoTitle">A bat sends out a call, the sound wave bounces off a moth, and the echo returns to the bat's ears, letting it compute the moth's distance and direction</title>
  <defs>
    <marker id="arrowGreenBat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowBrickBat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9412C"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#FBF8F1"/>

  <!-- bat -->
  <text x="90" y="175" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="40">🦇</text>
  <text x="90" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">Bat</text>

  <!-- moth -->
  <text x="550" y="175" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="30">🦋</text>
  <text x="550" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">Moth</text>

  <!-- outgoing call, green, curved arcs -->
  <path d="M130,140 C 250,90 350,90 470,150" fill="none" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowGreenBat)"/>
  <text x="300" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#2C4A3E">1. Bat calls (ultrasonic click)</text>

  <!-- returning echo, brick, curved arcs -->
  <path d="M470,190 C 350,250 250,250 130,195" fill="none" stroke="#C9412C" stroke-width="3" marker-end="url(#arrowBrickBat)"/>
  <text x="300" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#C9412C">2. Echo bounces back off moth</text>

  <text x="320" y="315" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Round-trip time + pitch shift → distance, direction, and speed</text>
</svg>
