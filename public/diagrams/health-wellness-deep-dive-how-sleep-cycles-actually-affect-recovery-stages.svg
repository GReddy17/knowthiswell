<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sleepStagesTitle">
  <title id="sleepStagesTitle">Roughly five repeating 90-minute sleep cycles across an 8-hour night, each split into light, deep, and REM sleep, with deep sleep concentrated early and REM sleep growing later.</title>
  <rect width="640" height="260" fill="#FBF8F1"/>
  <rect x="20" y="60" width="100" height="120" fill="#8B6F4E"/>
  <rect x="20" y="60" width="100" height="60" fill="#2C4A3E"/>
  <text x="70" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Cycle 1</text>
  <rect x="140" y="60" width="100" height="120" fill="#8B6F4E"/>
  <rect x="140" y="60" width="100" height="45" fill="#2C4A3E"/>
  <rect x="140" y="155" width="100" height="25" fill="#C9412C"/>
  <text x="190" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Cycle 2</text>
  <rect x="260" y="60" width="100" height="120" fill="#8B6F4E"/>
  <rect x="260" y="60" width="100" height="30" fill="#2C4A3E"/>
  <rect x="260" y="140" width="100" height="40" fill="#C9412C"/>
  <text x="310" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Cycle 3</text>
  <rect x="380" y="60" width="100" height="120" fill="#8B6F4E"/>
  <rect x="380" y="60" width="100" height="15" fill="#2C4A3E"/>
  <rect x="380" y="120" width="100" height="60" fill="#C9412C"/>
  <text x="430" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Cycle 4</text>
  <rect x="500" y="60" width="100" height="120" fill="#8B6F4E"/>
  <rect x="500" y="100" width="100" height="80" fill="#C9412C"/>
  <text x="550" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Cycle 5</text>
  <text x="320" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Dark green = deep sleep (early-heavy) · Red = REM sleep (later-heavy) · Tan = light sleep</text>
</svg>
