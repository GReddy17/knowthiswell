<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="doseUnitsTitle">
  <title id="doseUnitsTitle">A labeled medicine bottle diagram showing the two different units printed on a liquid medicine label: milligrams per milliliter as the concentration of active ingredient dissolved in the liquid, and milliliters as the volume of liquid actually measured out and given, with an arrow showing that dose in milligrams equals concentration in mg per mL multiplied by volume given in mL</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <rect x="60" y="60" width="150" height="170" rx="14" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5"/>
  <rect x="105" y="40" width="60" height="30" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="135" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Label reads:</text>
  <text x="135" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">25 mg / 5 mL</text>
  <text x="135" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(concentration)</text>

  <text x="290" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">×</text>

  <rect x="330" y="80" width="150" height="110" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="405" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">10 mL</text>
  <text x="405" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">given (volume)</text>

  <text x="560" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">=</text>

  <rect x="600" y="80" width="140" height="110" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="670" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">50 mg</text>
  <text x="670" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">total dose</text>

  <text x="390" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#B5493A">General unit literacy only — always follow the actual label, doctor, or pharmacist for a real dose.</text>
</svg>
