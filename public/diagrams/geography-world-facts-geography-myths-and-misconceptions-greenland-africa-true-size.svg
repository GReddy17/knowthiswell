<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trueSizeTitle">
  <title id="trueSizeTitle">Africa's true-size outline shown large, with Greenland's much smaller true-size outline placed inside it near the top, labeled to show Greenland's area fits inside Africa roughly 14 times; a small inset compares the two on a standard Mercator map, where they look nearly equal in size</title>
  <rect width="640" height="480" fill="#FBF8F1"/>

  <text x="30" y="34" font-family="ui-serif, Georgia, serif" font-size="19" font-weight="600" fill="#1F1B16">Same two landmasses, true relative size</text>

  <!-- Africa, true size, large -->
  <g transform="translate(60,50)">
    <path d="M 130,10 C 175,-10 230,10 260,55 L 275,95 L 290,125 L 265,145 L 250,195 L 215,255 L 175,310 L 140,340 L 110,300 L 80,250 C 65,225 45,210 55,180 L 40,150 L 25,110 L 20,70 L 40,30 C 60,10 95,0 130,10 Z"
          fill="#2C4A3E" opacity="0.85" stroke="#20362D" stroke-width="1.5"/>
    <text x="150" y="380" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Africa</text>
    <text x="150" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">~30.4 million km&#178;</text>

    <!-- Greenland, true size, placed inside near the top -->
    <g transform="translate(150,55) scale(0.42)">
      <path d="M 35,0 L 50,10 L 55,35 L 45,65 L 25,75 L 8,50 L 5,20 L 18,5 Z" fill="#4A7A9E" stroke="#3D6A83" stroke-width="2"/>
    </g>
    <text x="185" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Greenland</text>
    <text x="185" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(true size, ~2.16M km&#178;)</text>
  </g>

  <line x1="330" y1="60" x2="330" y2="430" stroke="#E3DCC9" stroke-width="1"/>

  <text x="360" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Greenland's true area fits inside</text>
  <text x="360" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Africa's roughly 14 times over.</text>

  <!-- inset: Mercator comparison -->
  <rect x="360" y="120" width="230" height="180" rx="6" fill="#EDE7D8" stroke="#E3DCC9"/>
  <text x="375" y="142" font-family="ui-serif, Georgia, serif" font-size="13" font-weight="600" fill="#1F1B16">On a standard Mercator map</text>

  <path d="M 385,270 C 400,255 415,258 420,270 L 422,280 L 405,285 L 388,280 Z" fill="#2C4A3E" opacity="0.8"/>
  <text x="404" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Africa</text>

  <path d="M 470,160 L 500,168 L 508,210 L 480,240 L 452,225 L 448,185 Z" fill="#4A7A9E" opacity="0.8"/>
  <text x="480" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Greenland</text>

  <text x="375" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B4A3A">they appear almost</text>
  <text x="375" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B4A3A">equal in size &#8212; not true size</text>

  <text x="30" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Mercator projection stretches landmasses near the poles, inflating high-latitude Greenland relative to equatorial Africa.</text>
</svg>
