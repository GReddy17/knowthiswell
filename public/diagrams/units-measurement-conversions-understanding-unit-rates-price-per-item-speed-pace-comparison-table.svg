<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="unitRateTitle">
  <title id="unitRateTitle">A table comparing two grocery packages: a 12-ounce box priced at 3.60 dollars and a 20-ounce box priced at 5.60 dollars, each divided down to a unit rate of 30 cents per ounce and 28 cents per ounce respectively, with the 20-ounce box highlighted as the better value despite costing more in total</title>
  <rect width="780" height="260" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Reducing to a unit rate reveals the better deal</text>

  <!-- Box A -->
  <rect x="60" y="60" width="280" height="150" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">12 oz box — $3.60</text>
  <line x1="90" y1="105" x2="310" y2="105" stroke="#2C4A3E" stroke-width="1"/>
  <text x="200" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">$3.60 ÷ 12 oz</text>
  <text x="200" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1F1B16">$0.30 / oz</text>

  <!-- Box B -->
  <rect x="440" y="60" width="280" height="150" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="580" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">20 oz box — $5.60</text>
  <line x1="470" y1="105" x2="690" y2="105" stroke="#2C4A3E" stroke-width="1"/>
  <text x="580" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">$5.60 ÷ 20 oz</text>
  <text x="580" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#B5493A">$0.28 / oz</text>
  <text x="580" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#B5493A">Better unit rate</text>

  <text x="390" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The 20 oz box costs more overall but less per ounce — the unit rate, not the sticker price, decides value.</text>
</svg>
