<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Two separate systems: algorithmic ranking, optimized for predicted engagement and running continuously in real time, and content moderation, which reviews and acts on specific flagged content, often after initial spread. They are separate systems with separate goals.</title>
  <rect width="680" height="300" fill="#FBF8F1"/>
  <rect x="20" y="20" width="305" height="205" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="20" y="20" width="305" height="44" rx="8" fill="#2C4A3E"/>
  <text x="172" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF8F1">Algorithmic ranking</text>
  <text x="40" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B5C48">GOAL</text>
  <text x="40" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Optimized for predicted engagement</text>
  <text x="40" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B5C48">TIMING</text>
  <text x="40" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Operates continuously,</text>
  <text x="40" y="188" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">in real time</text>
  <rect x="355" y="20" width="305" height="205" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <rect x="355" y="20" width="305" height="44" rx="8" fill="#C9412C"/>
  <text x="507" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF8F1">Content moderation</text>
  <text x="375" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B5C48">GOAL</text>
  <text x="375" y="115" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Reviews and acts on specific</text>
  <text x="375" y="133" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">flagged content</text>
  <text x="375" y="165" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B5C48">TIMING</text>
  <text x="375" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Often after initial spread</text>
  <text x="375" y="203" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">has already occurred</text>
  <text x="340" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Separate systems with separate goals</text>
</svg>
