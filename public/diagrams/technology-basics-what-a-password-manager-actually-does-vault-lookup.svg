<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pwmVaultTitle">
  <title id="pwmVaultTitle">A diagram showing one master password unlocking an encrypted vault, which contains many separate stored entries, each holding a unique username and password for a different site. A lookup arrow shows the vault matching the current website to the correct stored entry and auto-filling it, instead of the user searching or reusing one password everywhere.</title>
  <rect width="800" height="320" fill="#FBF8F1"/>

  <text x="30" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">One master password unlocks an encrypted vault</text>

  <rect x="30" y="55" width="150" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="105" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Master password</text>

  <defs>
    <marker id="arrowPwm" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M180,80 L268,80" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowPwm)"/>
  <text x="224" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">unlocks</text>

  <rect x="270" y="45" width="230" height="230" rx="8" fill="#F7F1E5" stroke="#8B6F4E" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="385" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Encrypted vault</text>

  <rect x="290" y="82" width="190" height="34" rx="4" fill="#FFFFFF" stroke="#E3DCC9"/>
  <text x="385" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">bank.example — user + pass</text>

  <rect x="290" y="124" width="190" height="34" rx="4" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="385" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">shop.example — user + pass</text>

  <rect x="290" y="166" width="190" height="34" rx="4" fill="#FFFFFF" stroke="#E3DCC9"/>
  <text x="385" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">email.example — user + pass</text>

  <rect x="290" y="208" width="190" height="34" rx="4" fill="#FFFFFF" stroke="#E3DCC9"/>
  <text x="385" y="229" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">work.example — user + pass</text>

  <rect x="600" y="55" width="170" height="50" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="685" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Browser is on</text>
  <text x="685" y="93" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">shop.example</text>

  <path d="M598,80 L560,141" fill="none" stroke="#C9412C" stroke-width="2" marker-end="url(#arrowPwm)"/>
  <text x="640" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#C9412C">looks up match</text>
  <path d="M480,141 L598,90" fill="none" stroke="#2C4A3E" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowPwm)"/>
  <text x="565" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#2C4A3E">auto-fills correct entry</text>

  <text x="400" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">It looks up the one matching entry by site address — it never guesses or reuses across sites.</text>
</svg>
