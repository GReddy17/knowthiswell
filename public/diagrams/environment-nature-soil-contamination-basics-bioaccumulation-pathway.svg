<svg viewBox="0 0 500 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bioaccumTitle">
  <title id="bioaccumTitle">A four-step vertical flow diagram: first, contaminated soil shown with metal particle icons; second, an arrow into a crop plant absorbing the particles through its roots; third, an arrow into a person or livestock eating the crop; fourth, an arrow showing concentration increasing at each step, labeled bioaccumulation, ending in a person icon with a warning marker</title>
  <rect width="500" height="620" fill="#FBF8F1"/>

  <!-- Step 1: contaminated soil -->
  <rect x="150" y="20" width="200" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="250" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Contaminated soil</text>
  <g fill="#B5493A">
    <circle cx="190" cy="75" r="4"/>
    <circle cx="215" cy="90" r="4"/>
    <circle cx="245" cy="70" r="4"/>
    <circle cx="270" cy="88" r="4"/>
    <circle cx="300" cy="72" r="4"/>
    <circle cx="320" cy="92" r="4"/>
  </g>
  <text x="250" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">heavy metal particles</text>

  <line x1="250" y1="110" x2="250" y2="150" stroke="#B5493A" stroke-width="2" marker-end="url(#arrowV)"/>

  <!-- Step 2: crop plant -->
  <rect x="150" y="155" width="200" height="110" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="250" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Crop plant</text>
  <line x1="250" y1="195" x2="250" y2="225" stroke="#3F7A4F" stroke-width="3"/>
  <path d="M250 200 Q230 190 220 205" stroke="#3F7A4F" stroke-width="2.5" fill="none"/>
  <path d="M250 205 Q270 195 280 210" stroke="#3F7A4F" stroke-width="2.5" fill="none"/>
  <path d="M250 225 Q235 235 225 248" stroke="#8A6A4A" stroke-width="2" fill="none"/>
  <path d="M250 225 Q265 235 275 248" stroke="#8A6A4A" stroke-width="2" fill="none"/>
  <circle cx="225" cy="250" r="3" fill="#B5493A"/>
  <circle cx="275" cy="250" r="3" fill="#B5493A"/>
  <text x="250" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">absorbs metals via roots</text>

  <line x1="250" y1="265" x2="250" y2="305" stroke="#B5493A" stroke-width="2" marker-end="url(#arrowV)"/>

  <!-- Step 3: livestock/person eats -->
  <rect x="150" y="310" width="200" height="110" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="250" y="333" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Livestock / person eats crop</text>
  <circle cx="250" cy="375" r="22" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <circle cx="243" cy="370" r="2.5" fill="#1F1B16"/>
  <circle cx="257" cy="370" r="2.5" fill="#1F1B16"/>
  <path d="M240 383 Q250 390 260 383" stroke="#1F1B16" stroke-width="1.6" fill="none"/>

  <line x1="250" y1="420" x2="250" y2="460" stroke="#B5493A" stroke-width="2" marker-end="url(#arrowV)"/>

  <!-- Step 4: concentration increases / person with warning -->
  <rect x="120" y="465" width="260" height="130" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="250" y="490" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Bioaccumulation</text>
  <circle cx="250" cy="535" r="26" fill="#EDE7D8" stroke="#B5493A" stroke-width="2"/>
  <circle cx="242" cy="528" r="3" fill="#1F1B16"/>
  <circle cx="258" cy="528" r="3" fill="#1F1B16"/>
  <path d="M238 545 Q250 552 262 545" stroke="#1F1B16" stroke-width="1.8" fill="none"/>
  <path d="M250 500 L258 515 L242 515 Z" fill="#B5493A"/>
  <text x="250" y="512" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1" font-weight="700">!</text>
  <text x="250" y="580" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">concentration increases at each step</text>

  <defs>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#B5493A"/>
    </marker>
  </defs>
</svg>
