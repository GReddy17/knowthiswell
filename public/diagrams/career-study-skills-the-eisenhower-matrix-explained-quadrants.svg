<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eisenhowerTitle">
  <title id="eisenhowerTitle">A two-by-two grid diagram with urgency on the horizontal axis and importance on the vertical axis, forming four labeled quadrants: top-left is Urgent and Important, labeled Do Now; top-right is Not Urgent but Important, labeled Schedule; bottom-left is Urgent but Not Important, labeled Delegate; bottom-right is Not Urgent and Not Important, labeled Eliminate, illustrating the four distinct responses the matrix recommends for each combination.</title>
  <rect width="700" height="560" fill="#FBF8F1"/>

  <text x="350" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Importance ↑</text>
  <text x="350" y="545" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Urgency →</text>

  <line x1="80" y1="60" x2="80" y2="500" stroke="#4A443C" stroke-width="2"/>
  <line x1="80" y1="500" x2="620" y2="500" stroke="#4A443C" stroke-width="2"/>

  <rect x="90" y="70" width="255" height="210" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="217" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">Urgent + Important</text>
  <text x="217" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#2C4A3E">DO NOW</text>

  <rect x="355" y="70" width="255" height="210" fill="#F2ECE0" stroke="#8B6F4E" stroke-width="2"/>
  <text x="482" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8B6F4E">Important, Not Urgent</text>
  <text x="482" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#8B6F4E">SCHEDULE</text>

  <rect x="90" y="290" width="255" height="200" fill="#F7F1E5" stroke="#8B6F4E" stroke-width="2"/>
  <text x="217" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8B6F4E">Urgent, Not Important</text>
  <text x="217" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#8B6F4E">DELEGATE</text>

  <rect x="355" y="290" width="255" height="200" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="482" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Not Urgent, Not Important</text>
  <text x="482" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#B5493A">ELIMINATE</text>

  <text x="350" y="525" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Left = urgent · Right = not urgent · Top = important · Bottom = not important</text>
</svg>
