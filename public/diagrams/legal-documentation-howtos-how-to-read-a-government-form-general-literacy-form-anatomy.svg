<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="formAnatomyTitle">
  <title id="formAnatomyTitle">A vertical diagram of a government form's five labeled sections in order: Header and Issuing Agency, Instructions and Required Documents, Fields to Complete, Certification and Signature, and Submission Details</title>
  <rect width="720" height="420" fill="#FBF8F1"/>

  <rect x="180" y="20" width="360" height="52" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">1. Header &amp; Issuing Agency</text>

  <rect x="180" y="88" width="360" height="52" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">2. Instructions &amp; Required Documents</text>

  <rect x="180" y="156" width="360" height="52" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">3. Fields to Complete</text>

  <rect x="180" y="224" width="360" height="52" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">4. Certification &amp; Signature</text>

  <rect x="180" y="292" width="360" height="52" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="324" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">5. Submission Details</text>

  <path d="M360 72 L360 88 M360 140 L360 156 M360 208 L360 224 M360 276 L360 292" stroke="#B5493A" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/>
    </marker>
  </defs>

  <text x="360" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Nearly every government form follows this same five-part order</text>
</svg>
