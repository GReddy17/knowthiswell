<svg viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of the Russian Revolution from the February 1917 revolution and abdication of Tsar Nicholas II, through the dual power of the Provisional Government and Petrograd Soviet, Lenin's April 1917 return, the October 1917 Bolshevik seizure of power, the 1918 Treaty of Brest-Litovsk exiting World War I, the 1917-1922 Russian Civil War, and the 1922 founding of the Soviet Union</title>
  <rect width="1200" height="230" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="600" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">Eight months from a tsar's abdication to a Bolshevik state</text>

    <rect x="40" y="115" width="170" height="40" fill="#EEF3EE"/>
    <text x="125" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">February Revolution</text>
    <text x="125" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Nicholas II abdicates</text>
    <text x="125" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Feb 1917</text>

    <rect x="210" y="115" width="160" height="40" fill="#FBEDEA"/>
    <text x="290" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Dual power</text>
    <text x="290" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Provisional Govt. vs. Soviet</text>
    <text x="290" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Feb–Oct 1917</text>

    <rect x="370" y="115" width="175" height="40" fill="#EDE7D8"/>
    <text x="457" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Lenin returns to Russia</text>
    <text x="457" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Apr 1917</text>

    <rect x="545" y="115" width="150" height="40" fill="#EEF3EE"/>
    <text x="620" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">October Revolution</text>
    <text x="620" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Bolsheviks seize power</text>
    <text x="620" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">Oct 1917</text>

    <rect x="695" y="115" width="170" height="40" fill="#FBEDEA"/>
    <text x="780" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Treaty of Brest-Litovsk</text>
    <text x="780" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Russia exits World War I</text>
    <text x="780" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1918</text>

    <rect x="865" y="115" width="140" height="40" fill="#EDE7D8"/>
    <text x="935" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Russian Civil War</text>
    <text x="935" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1917–1922</text>

    <rect x="1005" y="115" width="155" height="40" fill="#EEF3EE"/>
    <text x="1082" y="100" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Soviet Union founded</text>
    <text x="1082" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1922</text>
  </g>
  <rect x="40" y="115" width="1120" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="210" y1="115" x2="210" y2="155" stroke="#1F1B16"/>
  <line x1="370" y1="115" x2="370" y2="155" stroke="#1F1B16"/>
  <line x1="545" y1="115" x2="545" y2="155" stroke="#1F1B16"/>
  <line x1="695" y1="115" x2="695" y2="155" stroke="#1F1B16"/>
  <line x1="865" y1="115" x2="865" y2="155" stroke="#1F1B16"/>
  <line x1="1005" y1="115" x2="1005" y2="155" stroke="#1F1B16"/>
</svg>
