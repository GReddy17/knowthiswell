<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="foiTitle">
  <title id="foiTitle">Two side-by-side boxes. The left box, labeled Before FOI Law, shows Government Decides What to Release with an arrow to Public Sees Only That. The right box, labeled Under FOI Law, shows Records Presumed Releasable with an arrow branching to two outcomes: No Exemption Applies leading to Released, and Specific Exemption Applies leading to Withheld, Justification Required.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <rect x="30" y="30" width="330" height="240" rx="12" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="195" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Before FOI Law</text>
  <rect x="55" y="90" width="280" height="55" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="195" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Government Decides What to Release</text>
  <text x="195" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">↓</text>
  <rect x="55" y="175" width="280" height="55" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="195" y="207" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Public Sees Only That</text>

  <rect x="420" y="30" width="330" height="240" rx="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="585" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Under FOI Law</text>
  <rect x="450" y="88" width="270" height="50" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="585" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Records Presumed Releasable</text>

  <path d="M 545 138 L 490 165" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>
  <path d="M 625 138 L 680 165" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>

  <rect x="440" y="167" width="150" height="45" rx="7" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="515" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">No Exemption</text>
  <text x="515" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Applies</text>

  <rect x="600" y="167" width="150" height="45" rx="7" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="675" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Specific Exemption</text>
  <text x="675" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Applies</text>

  <text x="515" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Released</text>
  <text x="675" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#B5493A">Withheld,</text>
  <text x="675" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#B5493A">Justification Required</text>
</svg>
