<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="billLawTitle">
  <title id="billLawTitle">A flow diagram showing Introduction leading to Committee Review, with a large dotted branch labeled most bills die here peeling off, the surviving path continuing to Floor Vote, then Second Chamber if applicable, then Executive Signature or Veto, with a further branch showing a possible Override Vote after a veto</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <rect x="20" y="120" width="120" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="80" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Introduction</text>

  <text x="155" y="153" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="180" y="120" width="130" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="245" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Committee Review</text>

  <line x1="245" y1="175" x2="245" y2="230" stroke="#B5493A" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="245" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5493A">most bills die here</text>

  <text x="325" y="153" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="345" y="120" width="110" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="400" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Floor Vote</text>

  <text x="470" y="153" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="490" y="120" width="130" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="555" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Second Chamber</text>
  <text x="555" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">(if applicable)</text>

  <text x="635" y="153" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">&#8594;</text>

  <rect x="655" y="100" width="130" height="75" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.2"/>
  <text x="720" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Executive</text>
  <text x="720" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Signature</text>
  <text x="720" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">or Veto</text>

  <line x1="720" y1="175" x2="720" y2="215" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="720" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">possible Override Vote</text>

  <text x="400" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Most bills are filtered out at committee — very few reach a final vote.</text>
</svg>
