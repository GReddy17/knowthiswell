<svg viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nutritionTitle">
  <title id="nutritionTitle">Flow diagram of a meal breaking into three macronutrient streams — carbohydrates, protein, and fat — each digested into glucose, amino acids, or fatty acids and glycerol, absorbed through the small intestine into the bloodstream, then used by cells for immediate energy, short-term storage as glycogen, or long-term storage as fat</title>

  <rect x="0" y="0" width="640" height="500" fill="#FBF8F1"/>

  <!-- meal -->
  <rect x="255" y="15" width="130" height="46" rx="8" fill="#FBF8F1" stroke="#1F1B16" stroke-width="2"/>
  <text x="320" y="43" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Meal</text>

  <g stroke="#4A443C" stroke-width="1.5" fill="none">
    <path d="M 280,61 Q 200,85 130,100"/><path d="M 130,100 L 140,97 L 135,107 Z" fill="#4A443C" stroke="none"/>
    <path d="M 320,61 L 320,100"/><path d="M 320,100 L 316,91 L 324,91 Z" fill="#4A443C" stroke="none"/>
    <path d="M 360,61 Q 440,85 510,100"/><path d="M 510,100 L 500,97 L 505,107 Z" fill="#4A443C" stroke="none"/>
  </g>

  <!-- three macronutrient boxes -->
  <rect x="60" y="103" width="140" height="46" rx="7" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="130" y="131" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Carbohydrates</text>

  <rect x="250" y="103" width="140" height="46" rx="7" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="2"/>
  <text x="320" y="131" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Protein</text>

  <rect x="440" y="103" width="140" height="46" rx="7" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="510" y="131" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Fat</text>

  <!-- digested-into arrows and labels -->
  <g stroke="#4A443C" stroke-width="1.5"><line x1="130" y1="149" x2="130" y2="185"/><path d="M 130,185 L 126,176 L 134,176 Z" fill="#4A443C" stroke="none"/>
  <line x1="320" y1="149" x2="320" y2="185"/><path d="M 320,185 L 316,176 L 324,176 Z" fill="#4A443C" stroke="none"/>
  <line x1="510" y1="149" x2="510" y2="185"/><path d="M 510,185 L 506,176 L 514,176 Z" fill="#4A443C" stroke="none"/></g>

  <rect x="55" y="188" width="150" height="46" rx="7" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="130" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Glucose</text>

  <rect x="245" y="188" width="150" height="46" rx="7" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="320" y="209" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Amino acids</text>

  <rect x="425" y="188" width="170" height="46" rx="7" fill="#FBF8F1" stroke="#C9412C" stroke-width="1.5"/>
  <text x="510" y="209" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Fatty acids +</text>
  <text x="510" y="223" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">glycerol</text>

  <!-- converge to bloodstream -->
  <g stroke="#4A443C" stroke-width="1.5" fill="none">
    <path d="M 130,234 Q 200,270 260,280"/>
    <path d="M 320,234 L 320,280"/>
    <path d="M 510,234 Q 420,270 380,280"/>
  </g>
  <path d="M 320,280 L 316,271 L 324,271 Z" fill="#4A443C"/>

  <rect x="145" y="283" width="350" height="50" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="304" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14.5" font-weight="600" fill="#1F1B16">Absorbed via small intestine</text>
  <text x="320" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">into the bloodstream</text>

  <!-- diverge to 3 uses -->
  <g stroke="#4A443C" stroke-width="1.5" fill="none">
    <path d="M 220,333 Q 160,365 120,385"/><path d="M 120,385 L 128,381 L 125,391 Z" fill="#4A443C" stroke="none"/>
    <path d="M 320,333 L 320,385"/><path d="M 320,385 L 316,376 L 324,376 Z" fill="#4A443C" stroke="none"/>
    <path d="M 420,333 Q 480,365 520,385"/><path d="M 520,385 L 512,381 L 515,391 Z" fill="#4A443C" stroke="none"/>
  </g>

  <rect x="40" y="388" width="160" height="60" rx="7" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="120" y="412" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Immediate energy</text>
  <text x="120" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">ATP production</text>

  <rect x="240" y="388" width="160" height="60" rx="7" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="320" y="412" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Short-term storage</text>
  <text x="320" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">glycogen</text>

  <rect x="440" y="388" width="160" height="60" rx="7" fill="#FBF8F1" stroke="#C9412C" stroke-width="1.5"/>
  <text x="520" y="412" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Long-term storage</text>
  <text x="520" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">fat</text>
</svg>
