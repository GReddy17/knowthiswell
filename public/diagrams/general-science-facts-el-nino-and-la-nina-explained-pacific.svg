<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="elNinoTitle">
  <title id="elNinoTitle">Comparison of the normal Pacific Ocean state, with warm water and rain piled near Asia and cold water upwelling off South America, against the El Nino state, where weakened trade winds let warm water and rain shift east toward South America</title>
  <defs>
    <marker id="arrowGreenEN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowBrickEN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9412C"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#FBF8F1"/>

  <text x="320" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="700" fill="#1F1B16">Normal Pacific state</text>
  <rect x="30" y="50" width="580" height="110" fill="none" stroke="#1F1B16" stroke-width="1.5" opacity="0.3"/>
  <text x="60" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Asia</text>
  <text x="560" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">South America</text>
  <path d="M540,110 C 400,80 200,80 70,105" fill="none" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowGreenEN)"/>
  <text x="320" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2C4A3E">Trade winds push warm water west</text>
  <text x="90" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Warm water piles up,</text>
  <text x="90" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">heavy rain</text>
  <path d="M545,150 L545,120" stroke="#C9412C" stroke-width="3" marker-end="url(#arrowBrickEN)"/>
  <text x="545" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#C9412C">Cold water upwells</text>

  <text x="320" y="205" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="700" fill="#1F1B16">El Nino state</text>
  <rect x="30" y="225" width="580" height="110" fill="none" stroke="#1F1B16" stroke-width="1.5" opacity="0.3"/>
  <text x="60" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Asia</text>
  <text x="560" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">South America</text>
  <path d="M100,290 C 250,320 400,320 530,290" fill="none" stroke="#C9412C" stroke-width="3" marker-end="url(#arrowBrickEN)"/>
  <text x="320" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#C9412C">Weakened trade winds let warm water slide east</text>
  <text x="80" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Drier</text>
  <text x="555" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Warmer,</text>
  <text x="555" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">wetter, upwelling stalls</text>

  <text x="320" y="365" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">The heat doesn't disappear — it relocates, and the rain follows it</text>
</svg>
