<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fedUnitaryTitle">
  <title id="fedUnitaryTitle">A horizontal spectrum diagram with three positions. Left end: Unitary, power held centrally and delegated outward, revocable. Middle: Federal, power constitutionally split between national and state or provincial levels, neither fully revocable by the other. Right end: Confederal, power held mainly by member states, central authority is a coordinating body they can more easily leave</title>
  <rect width="780" height="220" fill="#FBF8F1"/>

  <line x1="60" y1="110" x2="720" y2="110" stroke="#2C4A3E" stroke-width="2.5"/>

  <circle cx="110" cy="110" r="9" fill="#2C4A3E"/>
  <text x="110" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Unitary</text>
  <text x="110" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Power held centrally,</text>
  <text x="110" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">delegated outward, revocable</text>

  <circle cx="390" cy="110" r="9" fill="#B5493A"/>
  <text x="390" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Federal</text>
  <text x="390" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Constitutionally split power,</text>
  <text x="390" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">neither level fully revocable</text>

  <circle cx="670" cy="110" r="9" fill="#2C4A3E"/>
  <text x="670" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Confederal</text>
  <text x="670" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Power mainly in member states,</text>
  <text x="670" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">center is a coordinating body</text>

  <text x="390" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">A spectrum of how much power sits at the center vs. the constituent parts.</text>
</svg>
