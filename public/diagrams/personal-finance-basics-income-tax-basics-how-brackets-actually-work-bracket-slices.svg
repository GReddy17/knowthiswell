<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bracketSlicesTitle">
  <title id="bracketSlicesTitle">A horizontal income bar divided into two segments: a lower segment from $0 to $50,000 labeled 10% tax rate, and an upper segment from $50,000 to $70,000 labeled 22% tax rate, with an arrow showing only the upper segment is taxed at the higher rate while the lower segment keeps its original 10% regardless of total income</title>
  <rect width="720" height="220" fill="#FBF8F1"/>

  <text x="40" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">$0</text>

  <rect x="40" y="60" width="450" height="60" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="265" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">10% rate — first $50,000</text>

  <rect x="490" y="60" width="180" height="60" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">22% rate</text>
  <text x="580" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">$50k–$70k slice</text>

  <text x="490" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">$50,000</text>
  <text x="670" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">$70,000</text>

  <line x1="490" y1="55" x2="490" y2="125" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="360" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4A443C">Only the shaded slice above $50,000 is taxed at 22% — the first $50,000 always stays at 10%,</text>
  <text x="360" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4A443C">no matter how much additional income is earned above the threshold.</text>
</svg>
