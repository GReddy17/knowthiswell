<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="currencyRoundTripTitle">
  <title id="currencyRoundTripTitle">Flow diagram: $1,000 converts through rate 1 EUR = 1.08 USD (divide) into about 925.93 euros, then a week later through rate 1 EUR = 1.05 USD (multiply) into about $972.22, with a bracket highlighting the roughly $27.78 gap caused purely by the rate shift</title>
  <rect width="640" height="320" fill="#FBF8F1"/>

  <!-- box 1 -->
  <rect x="40" y="110" width="150" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Start</text>
  <text x="115" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#20362D">$1,000</text>

  <!-- arrow 1 -->
  <line x1="190" y1="145" x2="272" y2="145" stroke="#1F1B16" stroke-width="2"/>
  <path d="M 272,145 L 262,140 L 262,150 Z" fill="#1F1B16"/>
  <text x="231" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">rate: 1 EUR</text>
  <text x="231" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">= 1.08 USD</text>
  <text x="231" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2C4A3E">(divide)</text>

  <!-- box 2 -->
  <rect x="275" y="110" width="150" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="350" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Converted</text>
  <text x="350" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#20362D">≈ €925.93</text>

  <!-- arrow 2 -->
  <line x1="425" y1="145" x2="507" y2="145" stroke="#1F1B16" stroke-width="2"/>
  <path d="M 507,145 L 497,140 L 497,150 Z" fill="#1F1B16"/>
  <text x="466" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">one week later</text>
  <text x="466" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">rate: 1 EUR</text>
  <text x="466" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">= 1.05 USD</text>
  <text x="466" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2C4A3E">(multiply)</text>

  <!-- box 3 -->
  <rect x="510" y="110" width="120" height="70" rx="10" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="570" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Result</text>
  <text x="570" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#C9412C">≈ $972.22</text>

  <!-- gap bracket -->
  <path d="M 115,220 L 115,240 L 570,240 L 570,220" fill="none" stroke="#C9412C" stroke-width="1.5"/>
  <text x="342" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C9412C">≈ $27.78 gap — from $1,000 down to $972.22</text>
  <text x="342" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8B6F4E">Caused purely by the rate shift between the two conversions — no fees involved.</text>
</svg>
