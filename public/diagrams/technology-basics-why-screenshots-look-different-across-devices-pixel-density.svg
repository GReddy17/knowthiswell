<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screenshotDensityTitle">
  <title id="screenshotDensityTitle">A diagram comparing two phone screens of the same physical size: one with a lower-resolution, coarser pixel grid producing a larger, blockier screenshot file, and one with a higher-resolution, finer pixel grid producing a smaller-looking but sharper screenshot of the same on-screen content, both scaled to fit their own screen at a different pixel density.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Same content, different pixel grid, different screenshot</text>

  <!-- Device A: lower res -->
  <g>
    <rect x="90" y="55" width="180" height="220" rx="14" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2.5"/>
    <text x="180" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Device A — lower PPI</text>
    <g stroke="#EEF3EE" stroke-width="1">
      <line x1="90" y1="75" x2="270" y2="75"/><line x1="90" y1="95" x2="270" y2="95"/><line x1="90" y1="115" x2="270" y2="115"/><line x1="90" y1="135" x2="270" y2="135"/><line x1="90" y1="155" x2="270" y2="155"/><line x1="90" y1="175" x2="270" y2="175"/><line x1="90" y1="195" x2="270" y2="195"/><line x1="90" y1="215" x2="270" y2="215"/><line x1="90" y1="235" x2="270" y2="235"/><line x1="90" y1="255" x2="270" y2="255"/>
      <line x1="110" y1="55" x2="110" y2="275"/><line x1="130" y1="55" x2="130" y2="275"/><line x1="150" y1="55" x2="150" y2="275"/><line x1="170" y1="55" x2="170" y2="275"/><line x1="190" y1="55" x2="190" y2="275"/><line x1="210" y1="55" x2="210" y2="275"/><line x1="230" y1="55" x2="230" y2="275"/><line x1="250" y1="55" x2="250" y2="275"/>
    </g>
    <circle cx="180" cy="165" r="40" fill="#B5493A" opacity="0.55"/>
    <text x="180" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">720 &#215; 1600, coarser grid</text>
  </g>

  <!-- Device B: higher res -->
  <g>
    <rect x="510" y="55" width="180" height="220" rx="14" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2.5"/>
    <text x="600" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Device B — higher PPI</text>
    <g stroke="#EEF3EE" stroke-width="0.5">
      <line x1="510" y1="65" x2="690" y2="65"/><line x1="510" y1="75" x2="690" y2="75"/><line x1="510" y1="85" x2="690" y2="85"/><line x1="510" y1="95" x2="690" y2="95"/><line x1="510" y1="105" x2="690" y2="105"/><line x1="510" y1="115" x2="690" y2="115"/><line x1="510" y1="125" x2="690" y2="125"/><line x1="510" y1="135" x2="690" y2="135"/><line x1="510" y1="145" x2="690" y2="145"/><line x1="510" y1="155" x2="690" y2="155"/><line x1="510" y1="165" x2="690" y2="165"/><line x1="510" y1="175" x2="690" y2="175"/><line x1="510" y1="185" x2="690" y2="185"/><line x1="510" y1="195" x2="690" y2="195"/><line x1="510" y1="205" x2="690" y2="205"/><line x1="510" y1="215" x2="690" y2="215"/><line x1="510" y1="225" x2="690" y2="225"/><line x1="510" y1="235" x2="690" y2="235"/><line x1="510" y1="245" x2="690" y2="245"/><line x1="510" y1="255" x2="690" y2="255"/><line x1="510" y1="265" x2="690" y2="265"/>
      <line x1="520" y1="55" x2="520" y2="275"/><line x1="530" y1="55" x2="530" y2="275"/><line x1="540" y1="55" x2="540" y2="275"/><line x1="550" y1="55" x2="550" y2="275"/><line x1="560" y1="55" x2="560" y2="275"/><line x1="570" y1="55" x2="570" y2="275"/><line x1="580" y1="55" x2="580" y2="275"/><line x1="590" y1="55" x2="590" y2="275"/><line x1="600" y1="55" x2="600" y2="275"/><line x1="610" y1="55" x2="610" y2="275"/><line x1="620" y1="55" x2="620" y2="275"/><line x1="630" y1="55" x2="630" y2="275"/><line x1="640" y1="55" x2="640" y2="275"/><line x1="650" y1="55" x2="650" y2="275"/><line x1="660" y1="55" x2="660" y2="275"/><line x1="670" y1="55" x2="670" y2="275"/><line x1="680" y1="55" x2="680" y2="275"/>
    </g>
    <circle cx="600" cy="165" r="40" fill="#B5493A" opacity="0.55"/>
    <text x="600" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">1440 &#215; 3200, finer grid</text>
  </g>

  <text x="390" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">same circle,</text>
  <text x="390" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">different pixel file</text>
</svg>
