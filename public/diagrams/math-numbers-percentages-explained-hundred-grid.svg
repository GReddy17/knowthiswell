<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pctTitle">
  <title id="pctTitle">A 10 by 10 grid of 100 small squares with 35 of them shaded, representing 35 percent as 35 out of 100</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#20362D">35% = 35 out of 100 squares</text>

  <g transform="translate(190,70)">
    <!-- 10x10 grid, cell 24px -->
    <!-- generate via repeated rects: rows 0-9, cols 0-9. Shade first 3 full rows + 5 cells of row 3 (35 total) -->
    <g stroke="#1F1B16" stroke-width="0.6">
      <!-- shaded rows 0,1,2 fully (30 cells), row 3 first 5 cells shaded -->
      <rect x="0" y="0" width="240" height="72" fill="#C9412C" opacity="0.85"/>
      <rect x="0" y="72" width="120" height="24" fill="#C9412C" opacity="0.85"/>
      <rect x="120" y="72" width="120" height="24" fill="#FBF8F1"/>
      <rect x="0" y="96" width="240" height="144" fill="#FBF8F1"/>
      <!-- grid lines -->
      <g>
        <line x1="24" y1="0" x2="24" y2="240" /><line x1="48" y1="0" x2="48" y2="240" />
        <line x1="72" y1="0" x2="72" y2="240" /><line x1="96" y1="0" x2="96" y2="240" />
        <line x1="120" y1="0" x2="120" y2="240" /><line x1="144" y1="0" x2="144" y2="240" />
        <line x1="168" y1="0" x2="168" y2="240" /><line x1="192" y1="0" x2="192" y2="240" />
        <line x1="216" y1="0" x2="216" y2="240" />
        <line x1="0" y1="24" x2="240" y2="24" /><line x1="0" y1="48" x2="240" y2="48" />
        <line x1="0" y1="72" x2="240" y2="72" /><line x1="0" y1="96" x2="240" y2="96" />
        <line x1="0" y1="120" x2="240" y2="120" /><line x1="0" y1="144" x2="240" y2="144" />
        <line x1="0" y1="168" x2="240" y2="168" /><line x1="0" y1="192" x2="240" y2="192" />
        <line x1="0" y1="216" x2="240" y2="216" />
      </g>
      <rect x="0" y="0" width="240" height="240" fill="none" stroke="#1F1B16" stroke-width="2.5"/>
    </g>
  </g>

  <text x="320" y="340" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1F1B16">35 red squares out of 100 total squares</text>
  <text x="320" y="370" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">35% = 35/100 = 0.35</text>
</svg>
