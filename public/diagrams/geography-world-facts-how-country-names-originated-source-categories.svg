<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="countryNamesTitle">
  <title id="countryNamesTitle">A four-quadrant diagram of country name origins: named after a person, with America and Bolivia; named after a geographic feature, with Chad and Iceland; a local word for people or land, with Canada and Deutschland; and a colonial-era or borrowed label, with Philippines and Australia</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="32" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="19" font-weight="600" fill="#1F1B16">Where country names come from</text>

  <line x1="320" y1="55" x2="320" y2="400" stroke="#E3DCC9" stroke-width="1"/>
  <line x1="30" y1="227" x2="610" y2="227" stroke="#E3DCC9" stroke-width="1"/>

  <!-- Quadrant 1: person -->
  <g>
    <text x="60" y="90" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Named after a person</text>
    <text x="60" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">honors an explorer or leader</text>
    <rect x="60" y="130" width="110" height="30" rx="15" fill="#2C4A3E"/>
    <text x="115" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">America</text>
    <rect x="180" y="130" width="100" height="30" rx="15" fill="#2C4A3E"/>
    <text x="230" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">Bolivia</text>
    <text x="60" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Amerigo Vespucci &#183; Sim&#243;n Bol&#237;var</text>
  </g>

  <!-- Quadrant 2: geographic feature -->
  <g>
    <text x="350" y="90" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Named after a geographic feature</text>
    <text x="350" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">describes the land itself</text>
    <rect x="350" y="130" width="90" height="30" rx="15" fill="#4A7A9E"/>
    <text x="395" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">Chad</text>
    <rect x="450" y="130" width="100" height="30" rx="15" fill="#4A7A9E"/>
    <text x="500" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">Iceland</text>
    <text x="350" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">"lake" (Lake Chad) &#183; "ice land"</text>
  </g>

  <!-- Quadrant 3: local word for people/land -->
  <g>
    <text x="60" y="262" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Local word for people or land</text>
    <text x="60" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">from the language of the people</text>
    <rect x="60" y="302" width="105" height="30" rx="15" fill="#C97C3D"/>
    <text x="112" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">Canada</text>
    <rect x="175" y="302" width="120" height="30" rx="15" fill="#C97C3D"/>
    <text x="235" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">Deutschland</text>
    <text x="60" y="357" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">"kanata," village &#183; "land of the people"</text>
  </g>

  <!-- Quadrant 4: colonial-era or borrowed label -->
  <g>
    <text x="350" y="262" font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" fill="#1F1B16">Colonial-era or borrowed label</text>
    <text x="350" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">named by outside powers</text>
    <rect x="350" y="302" width="120" height="30" rx="15" fill="#8B4A3A"/>
    <text x="410" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">Philippines</text>
    <rect x="480" y="302" width="110" height="30" rx="15" fill="#8B4A3A"/>
    <text x="535" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#FBF8F1">Australia</text>
    <text x="350" y="357" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">King Philip II of Spain &#183; Latin "southern land"</text>
  </g>
</svg>
