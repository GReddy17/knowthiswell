<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rockCycleTitle">
  <title id="rockCycleTitle">Circular rock cycle diagram with magma at the center: magma cools into igneous rock, igneous rock weathers and erodes into sediment, sediment compacts and cements into sedimentary rock, any rock type is heated and compressed into metamorphic rock, and any rock type can melt back into magma to restart the cycle</title>

  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20362D"/>
    </marker>
    <marker id="ah3d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B6F4E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="460" fill="#FBF8F1"/>

  <!-- dashed shortcut arrows: "any rock type" -->
  <path d="M 288 100 Q 250 170 287 208" fill="none" stroke="#8B6F4E" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah3d)"/>
  <text x="225" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">Melting</text>

  <path d="M 452 308 Q 400 288 362 262" fill="none" stroke="#8B6F4E" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah3d)"/>
  <text x="405" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">Melting</text>

  <path d="M 292 106 Q 175 220 186 300" fill="none" stroke="#8B6F4E" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah3d)"/>
  <text x="180" y="215" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">Heat &amp; pressure</text>

  <!-- main cycle arrows -->
  <line x1="320" y1="195" x2="320" y2="112" stroke="#20362D" stroke-width="2.2" marker-end="url(#ah3)"/>
  <text x="330" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Cooling</text>

  <line x1="356.6" y1="86.2" x2="470.8" y2="137" stroke="#20362D" stroke-width="2.2" marker-end="url(#ah3)"/>
  <text x="380" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Weathering</text>
  <text x="380" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">&amp; erosion</text>

  <line x1="496.6" y1="181.8" x2="484.2" y2="300.2" stroke="#20362D" stroke-width="2.2" marker-end="url(#ah3)"/>
  <text x="500" y="230" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Compaction &amp;</text>
  <text x="500" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">cementation</text>

  <line x1="440" y1="340" x2="200" y2="340" stroke="#20362D" stroke-width="2.2" marker-end="url(#ah3)"/>
  <text x="320" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Heat &amp; pressure</text>

  <line x1="193.9" y1="318.8" x2="281.8" y2="263.9" stroke="#20362D" stroke-width="2.2" marker-end="url(#ah3)"/>
  <text x="215" y="305" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Melting</text>

  <!-- nodes -->
  <circle cx="320" cy="240" r="45" fill="#C9412C"/>
  <text x="320" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FBF8F1">MAGMA</text>

  <circle cx="320" cy="70" r="40" fill="#C97C3D"/>
  <text x="320" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Igneous</text>
  <text x="320" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">rock</text>

  <circle cx="500" cy="150" r="32" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="500" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Sediment</text>

  <circle cx="480" cy="340" r="40" fill="#8B6F4E"/>
  <text x="480" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Sedimentary</text>
  <text x="480" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">rock</text>

  <circle cx="160" cy="340" r="40" fill="#2C4A3E"/>
  <text x="160" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Metamorphic</text>
  <text x="160" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">rock</text>

  <text x="320" y="435" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C" font-style="italic">Dashed arrows: any rock type can melt or be heated and compressed</text>
</svg>
