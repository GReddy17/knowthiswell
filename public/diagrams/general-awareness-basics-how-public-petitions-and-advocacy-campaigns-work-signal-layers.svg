<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="petitionTitle">
  <title id="petitionTitle">A funnel diagram with four stacked layers feeding into a single arrow pointing at Official Decision. From top to bottom the layers are labeled Petition Signatures, Media Coverage, Direct Meetings With Officials, and Coalition Support, illustrating that each layer adds to the same combined signal reaching the decision-maker.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="40" y="30" width="300" height="50" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="190" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Petition Signatures</text>

  <rect x="40" y="92" width="300" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="190" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Media Coverage</text>

  <rect x="40" y="154" width="300" height="50" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="190" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Direct Meetings With Officials</text>

  <rect x="40" y="216" width="300" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="190" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Coalition Support</text>

  <path d="M 350 55 L 480 148" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>
  <path d="M 350 117 L 480 148" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>
  <path d="M 350 179 L 480 148" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>
  <path d="M 350 241 L 480 148" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>

  <rect x="480" y="118" width="260" height="60" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="610" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Official Decision</text>

  <text x="390" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Each layer adds to the same combined signal — no single layer guarantees the outcome alone.</text>
</svg>
