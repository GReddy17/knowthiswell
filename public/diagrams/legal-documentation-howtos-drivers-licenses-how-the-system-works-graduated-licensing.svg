<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="680" height="200" fill="#FBF8F1"/>

  <rect x="30" y="65" width="180" height="70" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="94" text-anchor="middle" font-size="13" fill="#1F1B16" font-weight="600">Learner's permit</text>
  <text x="120" y="112" text-anchor="middle" font-size="11" fill="#4A443C">supervised driving</text>

  <path d="M210 100 H260" stroke="#2C4A3E" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="260" y="65" width="200" height="70" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="94" text-anchor="middle" font-size="13" fill="#1F1B16" font-weight="600">Provisional license</text>
  <text x="360" y="112" text-anchor="middle" font-size="11" fill="#4A443C">nighttime/passenger limits</text>

  <path d="M460 100 H510" stroke="#2C4A3E" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="510" y="65" width="140" height="70" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
  <text x="580" y="94" text-anchor="middle" font-size="13" fill="#1F1B16" font-weight="700">Full license</text>
  <text x="580" y="112" text-anchor="middle" font-size="11" fill="#4A443C">unrestricted</text>

  <text x="340" y="175" text-anchor="middle" font-size="11" fill="#4A443C">Each stage tied to real crash-risk data for new drivers</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
