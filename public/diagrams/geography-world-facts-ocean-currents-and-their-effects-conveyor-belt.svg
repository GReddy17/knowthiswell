<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="conveyorTitle">
  <title id="conveyorTitle">A world map with arrows showing warm surface currents in red, including the Gulf Stream flowing from the Gulf of Mexico across the North Atlantic toward Western Europe, and cold deep currents in blue sinking near Greenland and Antarctica and creeping along the ocean floor toward the Pacific and Indian Oceans before slowly resurfacing, forming one continuous looping conveyor-belt-shaped path around the globe</title>
  <rect width="640" height="480" fill="#FBF8F1"/>

  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">The global thermohaline "conveyor belt"</text>

  <!-- base landmasses -->
  <g fill="#EDE7D8" stroke="#D8CFBB" stroke-width="1">
    <path d="M63,114 L102,110 L172,100 L196,104 L219,130 L234,150 L211,166 L196,200 L169,198 L177,222 L191,232 L157,210 L138,184 L127,154 L118,140 L87,130 L63,130 Z"/>
    <path d="M200,226 L227,230 L242,250 L266,266 L258,296 L230,320 L214,360 L211,330 L209,286 L194,258 L200,240 Z"/>
    <path d="M306,164 L306,178 L343,176 L364,178 L374,160 L382,140 L367,130 L351,110 L328,126 L312,150 Z"/>
    <path d="M294,208 L336,176 L370,188 L387,226 L399,226 L382,280 L374,300 L351,318 L339,286 L334,246 L304,238 L294,220 Z"/>
    <path d="M382,160 L390,220 L413,200 L429,180 L426,234 L444,210 L460,206 L468,210 L483,230 L507,200 L510,170 L530,150 L546,130 L476,96 L413,110 L390,140 Z"/>
    <path d="M496,294 L521,274 L541,272 L558,304 L553,324 L533,320 L499,318 Z"/>
    <path d="M120,388 L560,388 L545,405 L400,411 L280,411 L135,403 Z"/>
    <path d="M236,78 L257,73 L270,88 L261,108 L241,104 L231,90 Z"/>
  </g>
  <text x="246" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Greenland</text>
  <text x="340" y="146" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">W. Europe</text>
  <text x="150" y="245" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Gulf of Mexico</text>
  <text x="25" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Pacific</text>
  <text x="565" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Pacific</text>
  <text x="450" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Indian Ocean</text>

  <!-- warm surface current: Gulf Stream -->
  <path d="M185,205 C205,175 220,150 245,135 C270,120 300,120 330,133" fill="none" stroke="#C9412C" stroke-width="3" marker-end="url(#warmArrow)"/>
  <text x="255" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8A2A1C">Gulf Stream</text>

  <!-- cold deep current: sinks near Greenland and Antarctica, creeps to Pacific/Indian, resurfaces -->
  <path d="M250,108 C220,180 190,280 200,390" fill="none" stroke="#3D6A83" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#coldArrow)"/>
  <text x="255" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#3D6A83">sinks near</text>
  <text x="255" y="141" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#3D6A83">Greenland</text>

  <path d="M200,395 C260,412 330,415 400,405" fill="none" stroke="#3D6A83" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="200" y="428" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#3D6A83">sinks near Antarctica</text>

  <path d="M400,405 C500,400 570,340 560,250" fill="none" stroke="#3D6A83" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#coldArrow)"/>
  <text x="580" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#3D6A83">resurfaces,</text>
  <text x="580" y="281" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#3D6A83">Pacific</text>

  <path d="M350,406 C380,370 420,330 440,290" fill="none" stroke="#3D6A83" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#coldArrow)"/>
  <text x="440" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#3D6A83">resurfaces,</text>
  <text x="440" y="326" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#3D6A83">Indian Ocean</text>

  <!-- thin return path completing the loop -->
  <path d="M555,250 C520,170 440,125 335,133" fill="none" stroke="#3D6A83" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.55"/>

  <defs>
    <marker id="warmArrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#C9412C"/>
    </marker>
    <marker id="coldArrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3D6A83"/>
    </marker>
  </defs>

  <!-- legend -->
  <line x1="60" y1="450" x2="90" y2="450" stroke="#C9412C" stroke-width="3"/>
  <text x="96" y="454" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Warm surface current</text>
  <line x1="280" y1="450" x2="310" y2="450" stroke="#3D6A83" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="316" y="454" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Cold deep current</text>

  <text x="320" y="470" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">Simplified schematic; the full circuit takes roughly 1,000 years to complete.</text>
</svg>
