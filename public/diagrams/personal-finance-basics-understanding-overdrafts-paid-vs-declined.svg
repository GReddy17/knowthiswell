<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="overdraft-compare-title">
  <title id="overdraft-compare-title">Comparison diagram: a transaction exceeding available balance splits into two possible bank decisions — pay it (resulting in a negative balance and an overdraft fee) or decline it (resulting in no completed transaction and possibly a separate NSF fee).</title>
  <rect width="800" height="300" fill="#FBF8F1"/>
  <style>
    .box { fill: #EEF3EE; stroke: #2C4A3E; stroke-width: 2; }
    .boxa { fill: #FBEDEA; stroke: #2C4A3E; stroke-width: 2; }
    .boxb { fill: #EDE7D8; stroke: #2C4A3E; stroke-width: 2; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 16px; fill: #1F1B16; font-weight: 600; }
    .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; fill: #4A443C; }
    .arrow { stroke: #2C4A3E; stroke-width: 2; fill: none; marker-end: url(#arrowhead2); }
  </style>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="300" y="20" width="200" height="60" rx="8" class="box"/>
  <text x="400" y="45" text-anchor="middle" class="label">Transaction exceeds</text>
  <text x="400" y="62" text-anchor="middle" class="label">available balance</text>

  <path d="M370,80 L200,140" class="arrow"/>
  <path d="M430,80 L600,140" class="arrow"/>

  <rect x="80" y="140" width="240" height="70" rx="8" class="boxa"/>
  <text x="200" y="168" text-anchor="middle" class="label">Bank pays it</text>
  <text x="200" y="188" text-anchor="middle" class="sub">Balance goes negative</text>
  <text x="200" y="203" text-anchor="middle" class="sub">Overdraft fee charged</text>

  <rect x="480" y="140" width="240" height="70" rx="8" class="boxb"/>
  <text x="600" y="168" text-anchor="middle" class="label">Bank declines it</text>
  <text x="600" y="188" text-anchor="middle" class="sub">Transaction not completed</text>
  <text x="600" y="203" text-anchor="middle" class="sub">NSF fee may apply instead</text>

  <path d="M200,210 L200,250" class="arrow"/>
  <text x="200" y="270" text-anchor="middle" class="sub">Flat fee per occurrence</text>

  <path d="M600,210 L600,250" class="arrow"/>
  <text x="600" y="270" text-anchor="middle" class="sub">No purchase made</text>
</svg>
