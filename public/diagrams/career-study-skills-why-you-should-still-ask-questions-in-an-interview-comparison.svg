<svg viewBox="0 0 780 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="closingQuestionsTitle">
  <title id="closingQuestionsTitle">A comparison diagram showing a candidate who asks a specific closing question gaining both real decision-relevant information and a genuine-interest signal to the interviewer, next to a candidate who declines to ask any questions losing both of those benefits.</title>
  <rect width="780" height="230" fill="#FBF8F1"/>

  <rect x="50" y="30" width="320" height="175" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2"/>
  <text x="210" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2C4A3E">Asks a specific question</text>
  <text x="72" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">✓ gathers real information</text>
  <text x="72" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">✓ signals genuine interest</text>
  <text x="72" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">✓ shows active listening</text>
  <text x="72" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">Both benefits, one action</text>

  <rect x="410" y="30" width="320" height="175" rx="8" fill="#FFFFFF" stroke="#8B6F4E" stroke-width="2"/>
  <text x="570" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#8B6F4E">"No, you covered it"</text>
  <text x="432" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">✗ no information gathered</text>
  <text x="432" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">✗ no engagement signal sent</text>
  <text x="432" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">✗ opportunity not recovered</text>
  <text x="432" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">Both benefits lost, one choice</text>
</svg>
