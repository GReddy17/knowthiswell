<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="640" height="400" fill="#FBF8F1"/>
  <rect x="40" y="20" width="560" height="360" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1B16">Rental Agreement</text>

  <g>
    <rect x="60" y="62" width="520" height="42" rx="5" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="80" y="88" font-size="13" fill="#1F1B16" font-weight="bold">1. Parties &amp; Property</text>
    <text x="260" y="88" font-size="12" fill="#4A443C">Who is renting, from whom, and which unit</text>
  </g>

  <g>
    <rect x="60" y="112" width="520" height="42" rx="5" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="80" y="138" font-size="13" fill="#1F1B16" font-weight="bold">2. Term</text>
    <text x="260" y="138" font-size="12" fill="#4A443C">Fixed lease length, or month-to-month</text>
  </g>

  <g>
    <rect x="60" y="162" width="520" height="42" rx="5" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="80" y="188" font-size="13" fill="#1F1B16" font-weight="bold">3. Rent</text>
    <text x="260" y="188" font-size="12" fill="#4A443C">Amount, due date, late fees, payment method</text>
  </g>

  <g>
    <rect x="60" y="212" width="520" height="42" rx="5" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="80" y="238" font-size="13" fill="#1F1B16" font-weight="bold">4. Security Deposit</text>
    <text x="260" y="238" font-size="12" fill="#4A443C">Amount and conditions for return</text>
  </g>

  <g>
    <rect x="60" y="262" width="520" height="42" rx="5" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="80" y="288" font-size="13" fill="#1F1B16" font-weight="bold">5. Maintenance</text>
    <text x="260" y="288" font-size="12" fill="#4A443C">Who repairs what, and how quickly</text>
  </g>

  <g>
    <rect x="60" y="312" width="248" height="42" rx="5" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="78" y="338" font-size="13" fill="#1F1B16" font-weight="bold">6. Rules &amp; Occupancy</text>
  </g>

  <g>
    <rect x="332" y="312" width="248" height="42" rx="5" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
    <text x="350" y="338" font-size="13" fill="#1F1B16" font-weight="bold">7. Termination</text>
  </g>
</svg>
