<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lcmTitle">
  <title id="lcmTitle">A Venn diagram of the factors of 12 and 18, with shared factors 1, 2, 3, and 6 in the overlap — the largest shared factor, 6, is the HCF</title>
  <rect width="640" height="400" fill="#FBF8F1"/>

  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#20362D">Factors of 12 and 18</text>

  <circle cx="260" cy="210" r="120" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5" opacity="0.85"/>
  <circle cx="380" cy="210" r="120" fill="#FBEDEA" stroke="#C9412C" stroke-width="2.5" opacity="0.85"/>

  <text x="180" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">Factors of 12</text>
  <text x="460" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#C9412C">Factors of 18</text>

  <text x="200" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1F1B16">4, 12</text>
  <text x="440" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1F1B16">9, 18</text>

  <text x="320" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">1, 2, 3, 6</text>
  <text x="320" y="228" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8B6F4E">shared factors</text>

  <text x="320" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">HCF = 6 (largest shared factor)   ·   LCM = 36 (smallest shared multiple)</text>
</svg>
