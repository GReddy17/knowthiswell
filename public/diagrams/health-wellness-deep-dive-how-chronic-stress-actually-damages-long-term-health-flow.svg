<svg viewBox="0 0 560 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="csTitle">
  <title id="csTitle">From a stress response to long-term wear: a stressor activates adrenaline and cortisol; if it resolves the body returns to baseline, if it continues allostatic load builds and is linked to effects on the heart, immune system, metabolism, brain and sleep, and cellular aging.</title>
  <rect width="560" height="500" fill="#FBF8F1"/>
  <text x="280" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">From a stress response to long-term wear</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="180" y="46" width="200" height="38" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="280" y="70" font-size="12" font-weight="700" fill="#1F1B16">Stressor</text>
    <text x="280" y="102" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="120" y="110" width="320" height="56" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="280" y="132" font-size="12" font-weight="700" fill="#1F1B16">Sympathetic system → adrenaline (seconds)</text>
    <text x="280" y="152" font-size="12" font-weight="700" fill="#1F1B16">HPA axis → cortisol (minutes)</text>
    <path d="M280 170 V184 M140 184 H420 M140 184 V198 M420 184 V198" fill="none" stroke="#8B6F4E" stroke-width="2"/>
    <rect x="40" y="202" width="200" height="56" rx="6" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="2"/>
    <text x="140" y="224" font-size="12" font-weight="700" fill="#2C4A3E">Stress resolves</text>
    <text x="140" y="242" font-size="11" fill="#4A443C">body returns to baseline</text>
    <rect x="320" y="202" width="200" height="56" rx="6" fill="#2C4A3E"/>
    <text x="420" y="224" font-size="12" font-weight="700" fill="#FBF8F1">Stress continues</text>
    <text x="420" y="242" font-size="11" fill="#FBF8F1">response stays switched on</text>
    <text x="420" y="276" font-size="16" fill="#8B6F4E">↓</text>
    <rect x="300" y="284" width="240" height="40" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="420" y="309" font-size="12" font-weight="700" fill="#1F1B16">Allostatic load builds</text>
  </g>
  <path d="M420 328 V340 M100 340 H500" fill="none" stroke="#8B6F4E" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="16" y="350" width="128" height="78" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="80" y="370" font-size="11" font-weight="700" fill="#1F1B16">Heart and vessels</text>
    <text x="80" y="388" font-size="10" fill="#4A443C">higher blood pressure;</text>
    <text x="80" y="402" font-size="10" fill="#4A443C">job strain: ~23% higher</text>
    <text x="80" y="416" font-size="10" fill="#4A443C">heart disease risk</text>
    <rect x="152" y="350" width="128" height="78" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="216" y="370" font-size="11" font-weight="700" fill="#1F1B16">Immune system</text>
    <text x="216" y="388" font-size="10" fill="#4A443C">weaker defenses; cells</text>
    <text x="216" y="402" font-size="10" fill="#4A443C">less responsive to cortisol</text>
    <text x="216" y="416" font-size="10" fill="#4A443C">→ more inflammation</text>
    <rect x="288" y="350" width="128" height="78" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="352" y="370" font-size="11" font-weight="700" fill="#1F1B16">Metabolism</text>
    <text x="352" y="388" font-size="10" fill="#4A443C">raised blood sugar;</text>
    <text x="352" y="402" font-size="10" fill="#4A443C">changes in appetite</text>
    <text x="352" y="416" font-size="10" fill="#4A443C">and fat storage</text>
    <rect x="424" y="350" width="120" height="78" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="484" y="370" font-size="11" font-weight="700" fill="#1F1B16">Brain, sleep, cells</text>
    <text x="484" y="388" font-size="10" fill="#4A443C">poorer sleep, mood</text>
    <text x="484" y="402" font-size="10" fill="#4A443C">and concentration;</text>
    <text x="484" y="416" font-size="10" fill="#4A443C">shorter telomeres</text>
  </g>
  <text x="280" y="458" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Group-level associations from NIH, McEwen (1998), Cohen (1991, 2012), Kivimäki (2012), Epel (2004).</text>
  <text x="280" y="474" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Not a diagnosis. Talk to a health care provider about your own situation.</text>
</svg>
