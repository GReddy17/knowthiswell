<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slopeInterceptTitle">
  <title id="slopeInterceptTitle">Coordinate grid showing a straight line crossing the y-axis at the y-intercept b, with a right triangle marking rise over run to illustrate slope m, plus a steeper comparison line and a downward-sloping comparison line</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- gridlines -->
  <g stroke="#EDE7D8" stroke-width="1">
    <line x1="140" y1="40" x2="140" y2="340"/>
    <line x1="200" y1="40" x2="200" y2="340"/>
    <line x1="260" y1="40" x2="260" y2="340"/>
    <line x1="320" y1="40" x2="320" y2="340"/>
    <line x1="380" y1="40" x2="380" y2="340"/>
    <line x1="440" y1="40" x2="440" y2="340"/>
    <line x1="500" y1="40" x2="500" y2="340"/>
    <line x1="560" y1="40" x2="560" y2="340"/>
    <line x1="80" y1="60" x2="600" y2="60"/>
    <line x1="80" y1="100" x2="600" y2="100"/>
    <line x1="80" y1="140" x2="600" y2="140"/>
    <line x1="80" y1="180" x2="600" y2="180"/>
    <line x1="80" y1="220" x2="600" y2="220"/>
    <line x1="80" y1="260" x2="600" y2="260"/>
    <line x1="80" y1="300" x2="600" y2="300"/>
  </g>

  <!-- axes -->
  <line x1="80" y1="300" x2="600" y2="300" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="140" y1="340" x2="140" y2="40" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M 600,300 L 590,295 L 590,305 Z" fill="#1F1B16"/>
  <path d="M 140,40 L 135,50 L 145,50 Z" fill="#1F1B16"/>
  <text x="602" y="304" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">x</text>
  <text x="146" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">y</text>

  <!-- comparison line: negative slope, terracotta dashed -->
  <path d="M 80,124 L 580,257" fill="none" stroke="#C9412C" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- comparison line: steeper positive slope, blue dashed -->
  <path d="M 140,340 L 460,84" fill="none" stroke="#3D6A83" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- main line y = mx + b -->
  <path d="M 80,240 L 500,100" fill="none" stroke="#2C4A3E" stroke-width="3"/>

  <!-- y-intercept point b -->
  <circle cx="140" cy="220" r="5" fill="#2C4A3E"/>
  <text x="112" y="212" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F1B16">b</text>
  <text x="112" y="228" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">y-intercept</text>

  <!-- rise/run triangle -->
  <path d="M 140,220 L 260,220 L 260,180 Z" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="196" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">run</text>
  <text x="272" y="204" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">rise</text>
  <text x="196" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2C4A3E">slope m = rise / run</text>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">
    <line x1="410" y1="356" x2="440" y2="356" stroke="#2C4A3E" stroke-width="3"/>
    <text x="448" y="360" fill="#1F1B16">y = mx + b</text>
    <line x1="410" y1="378" x2="440" y2="378" stroke="#3D6A83" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="448" y="382" fill="#1F1B16">steeper line (larger m)</text>
    <line x1="410" y1="400" x2="440" y2="400" stroke="#C9412C" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="448" y="404" fill="#1F1B16">downward line (m &lt; 0)</text>
  </g>
</svg>
