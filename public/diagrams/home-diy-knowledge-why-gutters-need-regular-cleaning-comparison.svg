<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gutterCompareTitle">
  <title id="gutterCompareTitle">Comparison of a working gutter carrying roof runoff through a downspout away from the house, versus a clogged gutter overflowing at its front edge and soaking the fascia, siding, and foundation soil.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Same rainfall, two different paths</text>

  <!-- LEFT: working gutter -->
  <text x="185" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">Clear gutter</text>
  <line x1="60" y1="60" x2="230" y2="100" stroke="#4A443C" stroke-width="4"/>
  <rect x="55" y="98" width="180" height="14" fill="#8B8378" stroke="#1F1B16" stroke-width="1.5"/>
  <rect x="215" y="112" width="12" height="110" fill="#8B8378" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M215,222 L215,240 L170,255" fill="none" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowG1)"/>
  <line x1="60" y1="255" x2="310" y2="255" stroke="#4A443C" stroke-width="6"/>
  <rect x="90" y="150" width="70" height="105" fill="#E8DEC8" stroke="#1F1B16" stroke-width="2"/>
  <text x="185" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2C4A3E">water carried away from foundation</text>

  <!-- divider -->
  <line x1="390" y1="45" x2="390" y2="285" stroke="#4A443C" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT: clogged gutter -->
  <text x="595" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#C9412C">Clogged gutter</text>
  <line x1="470" y1="60" x2="640" y2="100" stroke="#4A443C" stroke-width="4"/>
  <rect x="465" y="98" width="180" height="14" fill="#8B6F4E" stroke="#1F1B16" stroke-width="1.5"/>
  <!-- debris marks -->
  <circle cx="500" cy="104" r="3" fill="#4A443C"/>
  <circle cx="520" cy="102" r="2.5" fill="#4A443C"/>
  <circle cx="545" cy="105" r="3" fill="#4A443C"/>
  <!-- overflow spilling over front edge -->
  <path d="M465,112 L458,140 L465,170 L455,200 L462,222" fill="none" stroke="#C9412C" stroke-width="2.5" marker-end="url(#arrowG2)"/>
  <rect x="625" y="112" width="12" height="60" fill="#8B8378" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="650" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">blocked</text>
  <line x1="470" y1="255" x2="720" y2="255" stroke="#4A443C" stroke-width="6"/>
  <rect x="500" y="150" width="70" height="105" fill="#E8DEC8" stroke="#1F1B16" stroke-width="2"/>
  <!-- water staining down fascia/siding -->
  <rect x="463" y="112" width="6" height="110" fill="#C9412C" opacity="0.35"/>
  <ellipse cx="465" cy="248" rx="26" ry="8" fill="#8B6F4E" opacity="0.55"/>
  <text x="595" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#C9412C">soaks fascia, siding, foundation soil</text>

  <defs>
    <marker id="arrowG1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowG2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C9412C"/>
    </marker>
  </defs>
</svg>
