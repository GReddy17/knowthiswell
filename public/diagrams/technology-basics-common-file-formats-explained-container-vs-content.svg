<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fileFormatsTitle">
  <title id="fileFormatsTitle">Diagram showing the same photo saved as three different file formats, each with a different internal structure and file size, illustrating that a file format is a set of rules for how content is encoded, not just a name at the end of a file</title>
  <rect width="640" height="380" fill="#FBF8F1"/>
  <text x="320" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">Same photo, three formats, three different rulebooks</text>

  <rect x="40" y="60" width="170" height="260" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="125" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1F1B16">.PNG</text>
  <text x="125" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">lossless compression</text>
  <text x="125" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">supports transparency</text>
  <rect x="60" y="150" width="130" height="70" fill="#EDE7D8" stroke="#8B6F4E"/>
  <text x="125" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">larger file,</text>
  <text x="125" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">every pixel exact</text>

  <rect x="235" y="60" width="170" height="260" rx="10" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="320" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1F1B16">.JPG</text>
  <text x="320" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">lossy compression</text>
  <text x="320" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">no transparency</text>
  <rect x="255" y="150" width="130" height="45" fill="#E3DCC9" stroke="#8B6F4E"/>
  <text x="320" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">much smaller file,</text>
  <text x="320" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">some detail discarded</text>

  <rect x="430" y="60" width="170" height="260" rx="10" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="515" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1F1B16">.RAW</text>
  <text x="515" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">unprocessed sensor data</text>
  <text x="515" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">no compression</text>
  <rect x="450" y="150" width="130" height="130" fill="#E3DCC9" stroke="#8B6F4E"/>
  <text x="515" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">largest file,</text>
  <text x="515" y="314" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">most editable later</text>

  <text x="320" y="350" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#2C4A3E">Bar height above roughly represents relative file size for the same image</text>
</svg>
