<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="twoFactorFlowTitle">
  <title id="twoFactorFlowTitle">A login attempt with a correct password reaches a second checkpoint requiring a one-time code or hardware key; without that second factor, access is denied even though the password was correct.</title>
  <rect width="560" height="300" fill="#FBF8F1"/>
  <rect x="30" y="50" width="150" height="55" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="105" y="73" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Factor 1: correct</text>
  <text x="105" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">password entered</text>
  <text x="195" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">→</text>
  <rect x="210" y="50" width="160" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="290" y="73" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Factor 2 required:</text>
  <text x="290" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">code, app, or key</text>
  <text x="290" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="30" y="145" width="220" height="60" rx="6" fill="#2C4A3E"/>
  <text x="140" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Attacker has password only</text>
  <text x="140" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">→ access denied</text>
  <rect x="310" y="145" width="220" height="60" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="420" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Real owner has both factors</text>
  <text x="420" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">→ access granted</text>
</svg>
