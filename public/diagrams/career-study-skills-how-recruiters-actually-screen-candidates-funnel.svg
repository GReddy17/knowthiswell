<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recruiterScreenFunnelTitle">
  <title id="recruiterScreenFunnelTitle">A funnel diagram showing six narrowing stages of a typical recruiter screening process: applications received, resume and ATS screen, recruiter phone screen, hiring manager interview, panel or team interview, and offer extended, with each bar narrower than the one above it to show the pool shrinking at every stage.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="55" y="20" width="670" height="36" rx="6" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="390" y="43" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Applications received</text>

  <rect x="115" y="62" width="550" height="36" rx="6" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="390" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Resume / ATS keyword screen</text>

  <rect x="175" y="104" width="430" height="36" rx="6" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="390" y="127" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Recruiter phone screen</text>

  <rect x="235" y="146" width="310" height="36" rx="6" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="390" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Hiring manager interview</text>

  <rect x="275" y="188" width="230" height="36" rx="6" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="390" y="211" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Panel / team interview</text>

  <rect x="310" y="230" width="160" height="36" rx="6" fill="#2C4A3E"/>
  <text x="390" y="253" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#FBF8F1">Offer extended</text>

  <text x="390" y="295" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Each stage filters the pool further — the recruiter's own screen is one filter among several, not the final decision.</text>
</svg>
