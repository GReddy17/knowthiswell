<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="salaryRangeTitle">
  <title id="salaryRangeTitle">A comparison diagram showing a single stated salary number as a fixed point with no room to move in either direction, next to a researched salary range shown as a band with room to negotiate both upward and downward within it.</title>
  <rect width="780" height="220" fill="#FBF8F1"/>

  <text x="200" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Single number</text>
  <line x1="60" y1="110" x2="340" y2="110" stroke="#4A443C" stroke-width="2"/>
  <circle cx="200" cy="110" r="8" fill="#8B6F4E"/>
  <text x="200" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">$70,000</text>
  <text x="200" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">no room to move either way</text>

  <text x="580" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Researched range</text>
  <line x1="440" y1="110" x2="720" y2="110" stroke="#4A443C" stroke-width="2"/>
  <rect x="500" y="100" width="120" height="20" rx="4" fill="#2C4A3E"/>
  <text x="560" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">$65K–$78K</text>
  <text x="560" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">room to negotiate within the band</text>

  <text x="390" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Same underlying expectation — the range keeps the conversation open on both ends.</text>
</svg>
