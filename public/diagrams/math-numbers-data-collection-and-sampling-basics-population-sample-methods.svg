<g fill="#2C4A3E"><circle cx="257" cy="340" r="2.2"/><circle cx="311" cy="340" r="2.2"/><circle cx="365" cy="340" r="2.2"/><circle cx="275" cy="356" r="2.2"/><circle cx="329" cy="356" r="2.2"/><circle cx="383" cy="356" r="2.2"/><circle cx="257" cy="378" r="2.2"/><circle cx="311" cy="378" r="2.2"/><circle cx="365" cy="378" r="2.2"/><circle cx="257" cy="408" r="2.2"/><circle cx="311" cy="408" r="2.2"/><circle cx="365" cy="408" r="2.2"/></g>
<text x="320.0" y="484" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Proportional share</text>
<text x="320.0" y="498" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">sampled from each band</text>
<circle cx="520.0" cy="376" r="46" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
<g fill="#4A443C" opacity="0.3"><circle cx="488.0" cy="360" r="2.0"/><circle cx="488.0" cy="376" r="2.0"/><circle cx="488.0" cy="392" r="2.0"/><circle cx="504.0" cy="344" r="2.0"/><circle cx="504.0" cy="360" r="2.0"/><circle cx="504.0" cy="376" r="2.0"/><circle cx="504.0" cy="392" r="2.0"/><circle cx="504.0" cy="408" r="2.0"/><circle cx="520.0" cy="392" r="2.0"/><circle cx="520.0" cy="408" r="2.0"/><circle cx="536.0" cy="392" r="2.0"/><circle cx="536.0" cy="408" r="2.0"/><circle cx="552.0" cy="392" r="2.0"/></g>
<g fill="#2C4A3E"><circle cx="520.0" cy="344" r="2.4"/><circle cx="520.0" cy="360" r="2.4"/><circle cx="520.0" cy="376" r="2.4"/><circle cx="536.0" cy="344" r="2.4"/><circle cx="536.0" cy="360" r="2.4"/><circle cx="536.0" cy="376" r="2.4"/><circle cx="552.0" cy="360" r="2.4"/><circle cx="552.0" cy="376" r="2.4"/></g>
<circle cx="537.0" cy="359" r="25" fill="none" stroke="#C9412C" stroke-width="1.5" stroke-dasharray="3 3"/>
