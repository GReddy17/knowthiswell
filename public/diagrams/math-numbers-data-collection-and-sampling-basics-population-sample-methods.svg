<text x="520.0" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#20362D">Convenience sampling</text>
<circle cx="120.0" cy="376" r="46" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
<g fill="#4A443C" opacity="0.3"><circle cx="88.0" cy="376" r="2.0"/><circle cx="88.0" cy="392" r="2.0"/><circle cx="104.0" cy="360" r="2.0"/><circle cx="104.0" cy="376" r="2.0"/><circle cx="104.0" cy="408" r="2.0"/><circle cx="120.0" cy="344" r="2.0"/><circle cx="120.0" cy="376" r="2.0"/><circle cx="120.0" cy="392" r="2.0"/><circle cx="136.0" cy="344" r="2.0"/><circle cx="136.0" cy="360" r="2.0"/><circle cx="136.0" cy="392" r="2.0"/><circle cx="136.0" cy="408" r="2.0"/><circle cx="152.0" cy="376" r="2.0"/><circle cx="152.0" cy="392" r="2.0"/></g>
<g fill="#2C4A3E"><circle cx="88.0" cy="360" r="2.4"/><circle cx="104.0" cy="344" r="2.4"/><circle cx="104.0" cy="392" r="2.4"/><circle cx="120.0" cy="360" r="2.4"/><circle cx="120.0" cy="408" r="2.4"/><circle cx="136.0" cy="376" r="2.4"/><circle cx="152.0" cy="360" r="2.4"/></g>
<text x="120.0" y="484" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Equal chance for</text>
<text x="120.0" y="498" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">every individual</text>
<rect x="245" y="330" width="150" height="38" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1"/>
<text x="241" y="352.0" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Group A</text>
<rect x="245" y="368" width="150" height="30" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1"/>
<text x="241" y="386.0" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">Group B</text>
<rect x="245" y="398" width="150" height="22" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1"/>
