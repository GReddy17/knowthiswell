<svg viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="samplingTitle">
<title id="samplingTitle">A large circle labeled population containing many small dots representing individuals, with three smaller boxes below it illustrating sampling methods: random sampling showing scattered dots selected evenly throughout the population, stratified sampling showing the population divided into labeled subgroup bands with proportional selection from each band, and convenience sampling showing selected dots clustered only in one corner of the population circle.</title>
<rect width="640" height="540" fill="#FBF8F1"/>
<text x="320" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#20362D">Population vs. Sample</text>
<circle cx="465" cy="26" r="4" fill="#2C4A3E"/><text x="475" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">selected</text>
<circle cx="535" cy="26" r="4" fill="#4A443C" opacity="0.3"/><text x="545" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">not selected</text>
<circle cx="320" cy="128" r="86" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
<g fill="#4A443C" opacity="0.4"><circle cx="242" cy="102" r="2.6"/><circle cx="242" cy="128" r="2.6"/><circle cx="242" cy="154" r="2.6"/><circle cx="268" cy="76" r="2.6"/><circle cx="268" cy="102" r="2.6"/><circle cx="268" cy="128" r="2.6"/><circle cx="268" cy="154" r="2.6"/><circle cx="268" cy="180" r="2.6"/><circle cx="294" cy="50" r="2.6"/><circle cx="294" cy="76" r="2.6"/><circle cx="294" cy="102" r="2.6"/><circle cx="294" cy="128" r="2.6"/><circle cx="294" cy="154" r="2.6"/><circle cx="294" cy="180" r="2.6"/><circle cx="294" cy="206" r="2.6"/><circle cx="320" cy="50" r="2.6"/><circle cx="320" cy="76" r="2.6"/><circle cx="320" cy="102" r="2.6"/><circle cx="320" cy="128" r="2.6"/><circle cx="320" cy="154" r="2.6"/><circle cx="320" cy="180" r="2.6"/><circle cx="320" cy="206" r="2.6"/><circle cx="346" cy="50" r="2.6"/><circle cx="346" cy="76" r="2.6"/><circle cx="346" cy="102" r="2.6"/><circle cx="346" cy="128" r="2.6"/><circle cx="346" cy="154" r="2.6"/><circle cx="346" cy="180" r="2.6"/><circle cx="346" cy="206" r="2.6"/><circle cx="372" cy="76" r="2.6"/><circle cx="372" cy="102" r="2.6"/><circle cx="372" cy="128" r="2.6"/><circle cx="372" cy="154" r="2.6"/><circle cx="372" cy="180" r="2.6"/><circle cx="398" cy="102" r="2.6"/><circle cx="398" cy="128" r="2.6"/><circle cx="398" cy="154" r="2.6"/></g>
<text x="320" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Population</text>
<text x="320" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">every individual in the group being studied</text>
<rect x="30" y="268" width="180" height="250" rx="12" fill="#EDE7D8" stroke="#E3DCC9" stroke-width="1.5"/>
<text x="120.0" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#20362D">Random sampling</text>
