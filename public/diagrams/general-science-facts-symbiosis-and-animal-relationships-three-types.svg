<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="symbiosisTitle">
  <title id="symbiosisTitle">Three-column comparison of symbiosis types by which species benefits: Mutualism, where the clownfish and sea anemone both benefit (plus, plus); Commensalism, where the remora benefits and the shark is unaffected (plus, zero); and Parasitism, where the tick benefits and the deer is harmed (plus, minus)</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <line x1="213" y1="40" x2="213" y2="380" stroke="#E3DCC9" stroke-width="1"/>
  <line x1="427" y1="40" x2="427" y2="380" stroke="#E3DCC9" stroke-width="1"/>

  <!-- Column 1: Mutualism -->
  <text x="106" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">Mutualism</text>

  <path d="M 60,110 L 90,100 L 90,120 Z" fill="#D97D3D"/>
  <ellipse cx="65" cy="110" rx="10" ry="7" fill="#D97D3D"/>
  <text x="106" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Clownfish</text>
  <circle cx="150" cy="112" r="15" fill="#EEF3EE" stroke="#2C4A3E"/>
  <text x="150" y="117" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2C4A3E">+</text>

  <g stroke="#8B6F4E" stroke-width="2">
    <path d="M 90,200 Q 95,180 100,200 M 105,200 Q 110,178 115,200 M 120,200 Q 125,182 130,200"/>
  </g>
  <circle cx="106" cy="205" r="16" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="0"/>
  <text x="106" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Sea anemone</text>
  <circle cx="150" cy="200" r="15" fill="#EEF3EE" stroke="#2C4A3E"/>
  <text x="150" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2C4A3E">+</text>

  <line x1="106" y1="130" x2="106" y2="180" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="106" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Both species benefit</text>

  <!-- Column 2: Commensalism -->
  <text x="320" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">Commensalism</text>

  <ellipse cx="280" cy="112" rx="20" ry="9" fill="#5E8A73"/>
  <path d="M 260,112 L 250,106 L 250,118 Z" fill="#5E8A73"/>
  <text x="320" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Remora</text>
  <circle cx="364" cy="112" r="15" fill="#EEF3EE" stroke="#2C4A3E"/>
  <text x="364" y="117" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2C4A3E">+</text>

  <ellipse cx="300" cy="205" rx="36" ry="14" fill="#4A443C"/>
  <path d="M 264,205 L 244,196 L 244,214 Z" fill="#4A443C"/>
  <path d="M 300,191 L 310,175 L 316,191 Z" fill="#4A443C"/>
  <text x="320" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Shark</text>
  <circle cx="364" cy="200" r="15" fill="#EEF3EE" stroke="#2C4A3E"/>
  <text x="364" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#8B6F4E">0</text>

  <line x1="320" y1="130" x2="320" y2="180" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="320" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">One benefits, other unaffected</text>

  <!-- Column 3: Parasitism -->
  <text x="534" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">Parasitism</text>

  <ellipse cx="500" cy="112" rx="8" ry="9" fill="#6E3226"/>
  <text x="534" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Tick</text>
  <circle cx="578" cy="112" r="15" fill="#EEF3EE" stroke="#2C4A3E"/>
  <text x="578" y="117" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2C4A3E">+</text>

  <ellipse cx="510" cy="210" rx="30" ry="16" fill="#8B6F4E"/>
  <path d="M 500,196 L 490,178 M 500,196 L 505,176" stroke="#8B6F4E" stroke-width="2" fill="none"/>
  <path d="M 480,205 L 465,198" stroke="#8B6F4E" stroke-width="3" stroke-linecap="round"/>
  <text x="534" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Deer</text>
  <circle cx="578" cy="205" r="15" fill="#EEF3EE" stroke="#2C4A3E"/>
  <text x="578" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">−</text>

  <line x1="534" y1="130" x2="534" y2="180" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="534" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">One benefits, other is harmed</text>

  <text x="320" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Check the actual cost or benefit to each species — not just the physical setup — to classify correctly</text>
</svg>
