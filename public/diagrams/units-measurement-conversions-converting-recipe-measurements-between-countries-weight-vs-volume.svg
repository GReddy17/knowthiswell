<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recipeConvertTitle">
  <title id="recipeConvertTitle">Two paths compared for measuring 1 US cup of flour: the US path scoops flour by volume directly into a cup for roughly 120 grams with some variability from packing, while the weight-based path places a bowl on a kitchen scale and weighs out 120 grams directly, producing a more consistent result, illustrating why weight-based recipes common outside the US are more precisely repeatable than volume-based ones</title>
  <rect width="780" height="280" fill="#FBF8F1"/>

  <text x="195" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">US-style: by volume</text>
  <rect x="95" y="60" width="200" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="195" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Scoop flour into</text>
  <text x="195" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">"1 cup" measure</text>
  <text x="195" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">≈ 120 g, ±10-15 g</text>
  <text x="195" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">(varies with packing)</text>

  <text x="585" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Most-of-world: by weight</text>
  <rect x="485" y="60" width="200" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="585" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Weigh flour directly</text>
  <text x="585" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">on a kitchen scale</text>
  <text x="585" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">= 120 g, exactly</text>
  <text x="585" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(no packing variance)</text>

  <text x="390" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Weight-based recipes are more repeatable because grams don't compress or fluff up the way a cup of flour can.</text>
</svg>
