<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="640" height="280" fill="#FBF8F1"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1B16">Three recurring categories of tenant protection</text>

  <g>
    <rect x="40" y="55" width="170" height="180" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="125" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1B16">Habitability</text>
    <text x="125" y="115" text-anchor="middle" font-size="10" fill="#4A443C">Working heat,</text>
    <text x="125" y="130" text-anchor="middle" font-size="10" fill="#4A443C">plumbing, structural</text>
    <text x="125" y="145" text-anchor="middle" font-size="10" fill="#4A443C">safety</text>
    <text x="125" y="175" text-anchor="middle" font-size="10" fill="#2C4A3E" font-weight="bold">Can&#8217;t be waived</text>
    <text x="125" y="190" text-anchor="middle" font-size="10" fill="#2C4A3E" font-weight="bold">by lease language</text>
  </g>

  <g>
    <rect x="235" y="55" width="170" height="180" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="320" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1B16">Anti-Retaliation</text>
    <text x="320" y="115" text-anchor="middle" font-size="10" fill="#4A443C">Can&#8217;t evict or</text>
    <text x="320" y="130" text-anchor="middle" font-size="10" fill="#4A443C">penalize for</text>
    <text x="320" y="145" text-anchor="middle" font-size="10" fill="#4A443C">exercising a right</text>
    <text x="320" y="175" text-anchor="middle" font-size="10" fill="#2C4A3E" font-weight="bold">Motive can be</text>
    <text x="320" y="190" text-anchor="middle" font-size="10" fill="#2C4A3E" font-weight="bold">hard to prove</text>
  </g>

  <g>
    <rect x="430" y="55" width="170" height="180" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
    <text x="515" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1B16">Due Process</text>
    <text x="515" y="115" text-anchor="middle" font-size="10" fill="#4A443C">Notice + court</text>
    <text x="515" y="130" text-anchor="middle" font-size="10" fill="#4A443C">process required</text>
    <text x="515" y="145" text-anchor="middle" font-size="10" fill="#4A443C">before eviction</text>
    <text x="515" y="175" text-anchor="middle" font-size="10" fill="#B5493A" font-weight="bold">No self-help</text>
    <text x="515" y="190" text-anchor="middle" font-size="10" fill="#B5493A" font-weight="bold">lockouts allowed</text>
  </g>

  <text x="320" y="262" text-anchor="middle" font-size="11" fill="#4A443C">Specific rules vary by jurisdiction — these categories recur, the details don&#8217;t</text>
</svg>
