<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="factTitle">
  <title id="factTitle">The number 18 with its factor pairs connected by arcs: 1 and 18, 2 and 9, 3 and 6, showing every factor comes paired with another factor</title>
  <rect width="640" height="340" fill="#FBF8F1"/>

  <text x="320" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#20362D">The factor pairs of 18</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1F1B16" text-anchor="middle">
    <text x="60" y="210">1</text>
    <text x="150" y="210">2</text>
    <text x="240" y="210">3</text>
    <text x="330" y="210">6</text>
    <text x="420" y="210">9</text>
    <text x="510" y="210">18</text>
  </g>

  <!-- arcs pairing factors: 1-18 (outer), 2-9, 3-6 -->
  <path d="M 60 195 Q 285 90 510 195" fill="none" stroke="#C9412C" stroke-width="2.5"/>
  <path d="M 150 195 Q 285 120 420 195" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <path d="M 240 195 Q 285 155 330 195" fill="none" stroke="#8B6F4E" stroke-width="2.5"/>

  <!-- legend, clear of the arcs -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">
    <rect x="470" y="55" width="18" height="4" fill="#C9412C"/>
    <text x="495" y="63" fill="#C9412C">1 &#215; 18 = 18</text>
    <rect x="470" y="80" width="18" height="4" fill="#2C4A3E"/>
    <text x="495" y="88" fill="#2C4A3E">2 &#215; 9 = 18</text>
    <rect x="470" y="105" width="18" height="4" fill="#8B6F4E"/>
    <text x="495" y="113" fill="#8B6F4E">3 &#215; 6 = 18</text>
  </g>

  <text x="320" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">Every factor shows up paired with a partner factor —</text>
  <text x="320" y="275" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1F1B16">past &#8730;18 (&#8776;4.2), you're just re-finding pairs you already have.</text>
  <text x="320" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#C9412C">Factors of 18: 1, 2, 3, 6, 9, 18</text>
</svg>
