<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="systemsTitle">
  <title id="systemsTitle">The nervous, respiratory, circulatory, muscular, and digestive systems arranged around a central figure with arrows showing signal and resource flow during exercise: nervous system sending motor signals to muscles, respiratory system supplying oxygen to blood, circulatory system distributing oxygen and nutrients, digestive system supplying fuel, and the muscular system generating movement and heat that returns to circulation</title>

  <rect x="0" y="0" width="640" height="640" fill="#FBF8F1"/>

  <!-- central figure -->
  <circle cx="320" cy="320" r="62" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <circle cx="320" cy="295" r="13" fill="none" stroke="#1F1B16" stroke-width="2"/>
  <line x1="320" y1="308" x2="320" y2="340" stroke="#1F1B16" stroke-width="2"/>
  <line x1="300" y1="318" x2="340" y2="318" stroke="#1F1B16" stroke-width="2"/>
  <line x1="320" y1="340" x2="304" y2="365" stroke="#1F1B16" stroke-width="2"/>
  <line x1="320" y1="340" x2="336" y2="365" stroke="#1F1B16" stroke-width="2"/>
  <text x="320" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">during exercise</text>

  <!-- arrows -->
  <g fill="none" stroke-width="2.5">
    <path d="M 300,110 Q 200,180 128,235" stroke="#2C4A3E"/>
    <path d="M 128,235 L 133,225 L 142,235 Z" fill="#2C4A3E" stroke="none"/>

    <path d="M 522,270 Q 500,380 468,480" stroke="#5B7C99"/>
    <path d="M 468,480 L 476,472 L 465,466 Z" fill="#5B7C99" stroke="none"/>

    <path d="M 210,506 Q 320,540 435,506" stroke="#8B6F4E"/>
    <path d="M 435,506 L 424,504 L 429,514 Z" fill="#8B6F4E" stroke="none"/>

    <path d="M 440,480 Q 340,420 145,268" stroke="#C9412C"/>
    <path d="M 145,268 L 155,270 L 150,259 Z" fill="#C9412C" stroke="none"/>

    <path d="M 132,275 Q 330,470 428,495" stroke="#4A443C" stroke-dasharray="4 3"/>
    <path d="M 428,495 L 419,491 L 421,502 Z" fill="#4A443C" stroke="none"/>
  </g>

  <!-- arrow labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">
    <text x="180" y="185">motor signals</text>
    <text x="500" y="360">oxygen</text>
    <text x="300" y="536">fuel (glucose)</text>
    <text x="270" y="400">O2 + nutrients</text>
    <text x="255" y="470" fill="#4A443C">CO2 + heat</text>
  </g>

  <!-- system nodes -->
  <g font-family="ui-serif, Georgia, serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1F1B16">
    <rect x="255" y="60" width="130" height="56" rx="8" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="2"/>
    <text x="320" y="83">Nervous</text>
    <text x="320" y="101" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4A443C">motor control</text>

    <rect x="465" y="220" width="130" height="56" rx="8" fill="#FBF8F1" stroke="#5B7C99" stroke-width="2"/>
    <text x="530" y="243">Respiratory</text>
    <text x="530" y="261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4A443C">oxygen intake</text>

    <rect x="380" y="478" width="150" height="56" rx="8" fill="#FBF8F1" stroke="#C9412C" stroke-width="2"/>
    <text x="455" y="501">Circulatory</text>
    <text x="455" y="519" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4A443C">distributes O2 &amp; fuel</text>

    <rect x="110" y="478" width="150" height="56" rx="8" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="2"/>
    <text x="185" y="501">Digestive</text>
    <text x="185" y="519" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4A443C">supplies fuel</text>

    <rect x="36" y="220" width="130" height="56" rx="8" fill="#FBF8F1" stroke="#4A443C" stroke-width="2"/>
    <text x="101" y="243">Muscular</text>
    <text x="101" y="261" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#4A443C">movement + heat</text>
  </g>
</svg>
