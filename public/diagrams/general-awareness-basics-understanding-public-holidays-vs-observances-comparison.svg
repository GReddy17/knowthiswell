<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="holidayObservanceTitle">
  <title id="holidayObservanceTitle">A two-column comparison chart. Left column, 'Public Holiday': created by statute, triggers office/bank closures, triggers paid-leave law. Right column, 'Observance': created by resolution or proclamation, no closure requirement, no paid-leave trigger</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <!-- Left column: Public Holiday -->
  <rect x="50" y="30" width="320" height="50" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="210" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1F1B16">Public Holiday</text>

  <rect x="50" y="100" width="320" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="210" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Created by statute / law</text>

  <rect x="50" y="160" width="320" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="210" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Triggers office / bank closures</text>

  <rect x="50" y="220" width="320" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="210" y="242" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Triggers paid-leave law</text>

  <!-- Right column: Observance -->
  <rect x="410" y="30" width="320" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="570" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1F1B16">Observance</text>

  <rect x="410" y="100" width="320" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="570" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Created by resolution / proclamation</text>

  <rect x="410" y="160" width="320" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="570" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">No closure requirement</text>

  <rect x="410" y="220" width="320" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="570" y="242" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">No paid-leave trigger</text>

  <text x="390" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Same-looking calendar entries, different legal mechanisms underneath.</text>
</svg>
