<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">The hypothalamus as a thermostat: it compares sensed temperature to a set point. When too warm, sweating and widened blood vessels near the skin release heat. When too cold, shivering and narrowed blood vessels near the skin generate or conserve heat. Both branches feed back to the hypothalamus.</title>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F1B16"/></marker></defs>
  <rect width="680" height="340" fill="#FBF8F1"/>
  <rect x="240" y="20" width="200" height="75" rx="8" fill="#2C4A3E"/>
  <text x="340" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBF8F1">Hypothalamus</text>
  <text x="340" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">The body's thermostat</text>
  <text x="340" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Sensed temperature vs set point</text>
  <path d="M260 95 L150 135" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M420 95 L530 135" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="170" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C9412C">Too warm</text>
  <text x="510" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Too cold</text>
  <rect x="20" y="140" width="260" height="130" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="150" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Cooling response</text>
  <text x="150" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Sweating</text>
  <text x="150" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Blood vessels widen near the skin</text>
  <text x="150" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6B5C48">Both release heat</text>
  <rect x="400" y="140" width="260" height="130" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="530" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Warming response</text>
  <text x="530" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Shivering</text>
  <text x="530" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Blood vessels narrow near the skin</text>
  <text x="530" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6B5C48">Generate or conserve heat</text>
  <path d="M150 270 L150 300 L340 300 L340 100" stroke="#8B6F4E" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <path d="M530 270 L530 300 L340 300" stroke="#8B6F4E" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="340" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6B5C48">Feedback loops back to the hypothalamus, continuously</text>
</svg>
