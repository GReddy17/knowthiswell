<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="landmarksHeightTitle">
  <title id="landmarksHeightTitle">Comparative infographic showing the Eiffel Tower at 330 meters, the Great Pyramid of Giza at about 139 meters, the Statue of Liberty at about 93 meters including its pedestal, and the Colosseum at about 48 meters, all drawn to a shared vertical scale for direct comparison</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Famous landmarks, drawn to the same vertical scale</text>

  <!-- height gridlines -->
  <g stroke="#E3DCC9" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="289.1" x2="600" y2="289.1"/>
    <line x1="80" y1="198.2" x2="600" y2="198.2"/>
    <line x1="80" y1="107.3" x2="600" y2="107.3"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E" text-anchor="end">
    <text x="72" y="292.6">100 m</text>
    <text x="72" y="201.7">200 m</text>
    <text x="72" y="110.8">300 m</text>
  </g>

  <!-- baseline -->
  <line x1="60" y1="380" x2="600" y2="380" stroke="#1F1B16" stroke-width="1.5"/>

  <!-- Eiffel Tower, 330 m -->
  <g fill="#2C4A3E">
    <path d="M115,380 L205,380 L174,220 L146,220 Z"/>
    <path d="M146,220 L174,220 L164,95 L156,95 Z"/>
    <path d="M145,378 L122,338 Q160,354 198,338 Z" fill="#FBF8F1"/>
    <line x1="160" y1="95" x2="160" y2="80" stroke="#2C4A3E" stroke-width="2"/>
  </g>
  <text x="160" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">330 m</text>
  <text x="160" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Eiffel Tower</text>
  <text x="160" y="411" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">Paris, France</text>

  <!-- Great Pyramid of Giza, 139 m -->
  <g fill="#2C4A3E">
    <path d="M230,380 L370,380 L300,253.6 Z"/>
    <line x1="300" y1="253.6" x2="300" y2="380" stroke="#FBF8F1" stroke-width="1.5" opacity="0.6"/>
  </g>
  <text x="300" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">139 m</text>
  <text x="300" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Great Pyramid of Giza</text>
  <text x="300" y="411" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">Egypt</text>

  <!-- Statue of Liberty, 93 m incl. pedestal -->
  <g fill="#2C4A3E">
    <rect x="415" y="350" width="50" height="30"/>
    <path d="M420,350 L460,350 L450,310 L430,310 Z"/>
    <circle cx="440" cy="303" r="8"/>
    <path d="M433,296 L437,286 L440,296 Z"/>
    <path d="M440,296 L440,284 L443,296 Z"/>
    <path d="M443,296 L447,286 L444,296 Z"/>
    <line x1="450" y1="313" x2="461" y2="296" stroke="#2C4A3E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="462" cy="293" r="4.5"/>
  </g>
  <text x="440" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">93 m</text>
  <text x="440" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Statue of Liberty</text>
  <text x="440" y="411" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">New York, incl. pedestal</text>

  <!-- Colosseum, 48 m -->
  <g>
    <path d="M525,380 L525,357 Q525,336.4 570,336.4 Q615,336.4 615,357 L615,380 Z" fill="#2C4A3E"/>
    <g stroke="#FBF8F1" stroke-width="2" opacity="0.7">
      <line x1="538" y1="350" x2="538" y2="380"/>
      <line x1="554" y1="341" x2="554" y2="380"/>
      <line x1="570" y1="338" x2="570" y2="380"/>
      <line x1="586" y1="341" x2="586" y2="380"/>
      <line x1="602" y1="350" x2="602" y2="380"/>
    </g>
  </g>
  <text x="570" y="327" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">48 m</text>
  <text x="570" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Colosseum</text>
  <text x="570" y="411" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">Rome, Italy</text>
</svg>
