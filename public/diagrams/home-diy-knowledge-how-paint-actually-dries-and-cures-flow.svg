<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dryCureTitle">
  <title id="dryCureTitle">A timeline diagram showing that drying (solvent or water evaporating out of the paint film) finishes in a matter of hours, while curing (the polymer chains cross-linking or oxidizing into a hard film) continues for days to weeks after the paint is already dry to the touch.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Drying and curing run on two very different timelines</text>

  <!-- time axis -->
  <line x1="90" y1="230" x2="680" y2="230" stroke="#1F1B16" stroke-width="1.5" marker-end="url(#arrowTime)"/>
  <text x="90" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">0</text>
  <text x="260" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">few hours</text>
  <text x="440" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">days</text>
  <text x="640" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">2&#8211;4 weeks</text>

  <!-- drying bar -->
  <rect x="90" y="110" width="180" height="22" rx="4" fill="#2C4A3E"/>
  <circle cx="270" cy="121" r="5" fill="#2C4A3E"/>
  <text x="90" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">DRYING &#8212; solvent/water evaporates</text>
  <text x="280" y="125" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">dry to touch</text>

  <!-- curing bar -->
  <rect x="90" y="175" width="580" height="22" rx="4" fill="#8B6F4E"/>
  <circle cx="670" cy="186" r="5" fill="#8B6F4E"/>
  <text x="90" y="163" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#8B6F4E">CURING &#8212; chains cross-link / oxidize into a hard film</text>
  <text x="500" y="191" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">film hardens gradually the whole time</text>

  <defs>
    <marker id="arrowTime" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1F1B16"/>
    </marker>
  </defs>

  <text x="390" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Paint can be dry to the touch in hours while still soft and easily damaged for weeks underneath.</text>
</svg>
