<svg viewBox="0 0 780 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ficoWeightTitle">
  <title id="ficoWeightTitle">A horizontal stacked bar divided into five segments by width, labeled from largest to smallest: Payment History 35%, Amounts Owed (Utilization) 30%, Length of Credit History 15%, Credit Mix 10%, and New Credit 10%, with a caption noting income and savings are not inputs to the model at all</title>
  <rect width="780" height="220" fill="#FBF8F1"/>

  <rect x="40" y="40" width="245" height="60" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="162" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Payment History</text>
  <text x="162" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">35%</text>

  <rect x="285" y="40" width="210" height="60" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Amounts Owed</text>
  <text x="390" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">30%</text>

  <rect x="495" y="40" width="105" height="60" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="547" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">History</text>
  <text x="547" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Length</text>
  <text x="547" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">15%</text>

  <rect x="600" y="40" width="70" height="60" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="635" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Credit Mix</text>
  <text x="635" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">10%</text>

  <rect x="670" y="40" width="70" height="60" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
  <text x="705" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">New Credit</text>
  <text x="705" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">10%</text>

  <text x="390" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Approximate FICO factor weighting, per FICO's own published methodology.</text>
  <text x="390" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Income and savings are not inputs to this model at all.</text>
</svg>
