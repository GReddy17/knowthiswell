<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="syncFlowTitle">
  <title id="syncFlowTitle">A diagram showing Device A and Device B, each with their own local copy of the same data, both connected through the internet to a central server that holds the master copy. An arrow shows a change made on Device A traveling to the server, then the server forwarding that same change onward to Device B, illustrating that two devices only stay consistent by both reaching the same server, not by talking to each other directly.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <rect x="30" y="115" width="130" height="55" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="95" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Device A</text>
  <text x="95" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">local copy, edited</text>

  <rect x="640" y="115" width="130" height="55" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="705" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Device B</text>
  <text x="705" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">local copy, stale</text>

  <rect x="330" y="105" width="140" height="75" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="400" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Central server</text>
  <text x="400" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">holds the one</text>
  <text x="400" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">master copy</text>

  <defs>
    <marker id="arrowSync" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M160,135 L328,130" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowSync)"/>
  <text x="245" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">1. change uploaded</text>

  <path d="M470,132 L638,135" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowSync)"/>
  <text x="555" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">2. change pushed down</text>

  <path d="M95,172 C 95,220 400,225 400,182" fill="none" stroke="#B5493A" stroke-width="1.3" stroke-dasharray="4,3"/>
  <path d="M705,172 C 705,220 400,225 400,182" fill="none" stroke="#B5493A" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="400" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#B5493A">no direct device-to-device connection — both rely on reaching the server</text>

  <text x="400" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Without internet, either device can only see its own last-known copy.</text>
</svg>
