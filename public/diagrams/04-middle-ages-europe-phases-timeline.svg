<svg viewBox="0 0 880 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of the three phases of the European Middle Ages: the Early Middle Ages from c. 500 to 1000 CE, marked by political fragmentation after Rome's fall; the High Middle Ages from 1000 to 1300 CE, marked by population growth, the founding of universities, and Gothic architecture; and the Late Middle Ages from 1300 to 1500 CE, marked by crises including famine and the Black Death alongside the beginnings of Renaissance ideas, ending as the Renaissance begins around 1400-1500 CE</title>
  <rect width="880" height="230" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="440" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">Three phases across a thousand years, ending as the Renaissance begins</text>

    <rect x="40" y="115" width="190" height="40" fill="#EEF3EE"/>
    <text x="135" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1F1B16">Early Middle Ages</text>
    <text x="135" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">fragmentation after Rome's fall</text>
    <text x="135" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">c. 500-1000 CE</text>

    <rect x="230" y="115" width="250" height="40" fill="#FBEDEA"/>
    <text x="355" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1F1B16">High Middle Ages</text>
    <text x="355" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">growth, universities, Gothic architecture</text>
    <text x="355" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1000-1300 CE</text>

    <rect x="480" y="115" width="250" height="40" fill="#EDE7D8"/>
    <text x="605" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1F1B16">Late Middle Ages</text>
    <text x="605" y="138" text-anchor="middle" font-size="8.5" fill="#4A443C">famine, Black Death; early Renaissance ideas</text>
    <text x="605" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1300-1500 CE</text>

    <rect x="730" y="115" width="110" height="40" fill="none" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="785" y="100" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4A443C">Renaissance begins</text>
    <text x="785" y="175" text-anchor="middle" font-size="9.5" fill="#8B6F4E">c. 1400-1500</text>
  </g>
  <rect x="40" y="115" width="690" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="230" y1="115" x2="230" y2="155" stroke="#1F1B16"/>
  <line x1="480" y1="115" x2="480" y2="155" stroke="#1F1B16"/>
  <line x1="730" y1="115" x2="730" y2="155" stroke="#1F1B16" stroke-dasharray="4 3"/>
</svg>
