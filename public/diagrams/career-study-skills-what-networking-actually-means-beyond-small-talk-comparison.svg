<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="networkingVsSmallTalkTitle">
  <title id="networkingVsSmallTalkTitle">A comparison diagram showing small talk as a single isolated conversation that ends with no follow-up, next to real networking as a chain of connected touchpoints -- an initial conversation, a follow-up, and ongoing two-way value exchange -- building a maintained relationship over time.</title>
  <rect width="780" height="240" fill="#FBF8F1"/>

  <text x="200" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Small talk</text>
  <line x1="60" y1="140" x2="340" y2="140" stroke="#4A443C" stroke-width="2"/>
  <circle cx="200" cy="140" r="10" fill="#8B6F4E"/>
  <text x="200" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">One conversation</text>
  <text x="200" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">ends when the conversation ends</text>

  <text x="580" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Real networking</text>
  <line x1="440" y1="140" x2="720" y2="140" stroke="#4A443C" stroke-width="2"/>

  <circle cx="470" cy="140" r="10" fill="#2C4A3E"/>
  <circle cx="580" cy="140" r="10" fill="#2C4A3E"/>
  <circle cx="690" cy="140" r="10" fill="#2C4A3E"/>

  <line x1="481" y1="140" x2="569" y2="140" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowFwd)"/>
  <line x1="591" y1="140" x2="679" y2="140" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowFwd)"/>
  <path d="M680,124 L482,124" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowBack)" fill="none"/>

  <text x="470" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Conversation</text>
  <text x="580" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Follow-up</text>
  <text x="690" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Ongoing exchange</text>
  <text x="580" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">value flows in both directions over time</text>

  <text x="390" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Small talk is a single data point. Networking is a maintained, two-way connection built over repeated contact.</text>

  <defs>
    <marker id="arrowFwd" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
    <marker id="arrowBack" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/>
    </marker>
  </defs>
</svg>
