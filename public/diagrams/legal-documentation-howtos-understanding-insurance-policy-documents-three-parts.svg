<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="policyPartsTitle">
  <title id="policyPartsTitle">A diagram showing an insurance policy document split into three labeled sections: declarations page with coverage amounts and period, insuring agreement and exclusions with what triggers a payout and specific carve-outs, and conditions with policyholder obligations required to keep coverage valid</title>
  <rect width="700" height="400" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="150" y="20" width="400" height="360" rx="6" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.8"/>

    <rect x="170" y="40" width="360" height="90" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="190" y="62" font-size="13" font-weight="700" fill="#1F1B16">1. Declarations page</text>
    <text x="190" y="82" font-size="11" fill="#4A443C">Coverage limits, deductibles,</text>
    <text x="190" y="98" font-size="11" fill="#4A443C">policy period — the summary</text>
    <text x="190" y="114" font-size="11" fill="#4A443C">most people actually read</text>

    <rect x="170" y="145" width="360" height="100" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="190" y="167" font-size="13" font-weight="700" fill="#1F1B16">2. Insuring agreement &amp; exclusions</text>
    <text x="190" y="187" font-size="11" fill="#4A443C">What triggers a payout, and</text>
    <text x="190" y="203" font-size="11" fill="#4A443C">specific situations carved</text>
    <text x="190" y="219" font-size="11" fill="#4A443C">back out of coverage</text>

    <rect x="170" y="270" width="360" height="90" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
    <text x="190" y="292" font-size="13" font-weight="700" fill="#1F1B16">3. Conditions</text>
    <text x="190" y="312" font-size="11" fill="#4A443C">The policyholder's own</text>
    <text x="190" y="328" font-size="11" fill="#4A443C">obligations — reporting deadlines,</text>
    <text x="190" y="344" font-size="11" fill="#4A443C">safety requirements, etc.</text>
  </g>

  <text x="350" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">A claim outcome typically depends on all three sections, not the declarations page alone.</text>
</svg>
