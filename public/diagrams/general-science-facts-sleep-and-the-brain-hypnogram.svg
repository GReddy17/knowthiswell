<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hypnogramTitle">
  <title id="hypnogramTitle">A hypnogram chart across roughly eight hours showing the sleeper descending from awake through light NREM sleep into deep slow-wave sleep, then rising back up through lighter stages into a REM period, repeating this cycle about five times, with deep sleep segments largest early in the night and REM segments growing longer in each successive cycle later in the night</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- deep sleep shaded bands (shrinking across the night) -->
  <g fill="#EEF3EE">
    <rect x="125" y="260" width="65" height="40"/>
    <rect x="255" y="260" width="46" height="40"/>
    <rect x="365" y="260" width="32" height="40"/>
    <rect x="482" y="240" width="20" height="60"/>
  </g>
  <!-- REM shaded bands (growing across the night) -->
  <g fill="#FBEDEA">
    <rect x="210" y="110" width="10" height="20"/>
    <rect x="320" y="110" width="20" height="20"/>
    <rect x="411" y="110" width="26" height="20"/>
    <rect x="514" y="110" width="76" height="20"/>
  </g>

  <!-- y axis stage labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C" text-anchor="end">
    <text x="72" y="64">Awake</text>
    <text x="72" y="114">REM</text>
    <text x="72" y="154">N1</text>
    <text x="72" y="194">N2</text>
    <text x="72" y="264">N3 (deep)</text>
  </g>
  <g stroke="#E3DCC9" stroke-width="1">
    <line x1="80" y1="60" x2="600" y2="60"/>
    <line x1="80" y1="110" x2="600" y2="110"/>
    <line x1="80" y1="150" x2="600" y2="150"/>
    <line x1="80" y1="190" x2="600" y2="190"/>
    <line x1="80" y1="260" x2="600" y2="260"/>
  </g>

  <!-- hypnogram trace -->
  <polyline fill="none" stroke="#1F1B16" stroke-width="2" stroke-linejoin="round" points="
    80,60 90,150 105,190 125,260 190,260 204,190 210,110 220,110 230,150 240,190
    255,260 301,260 314,190 320,110 340,110 350,190 365,260 397,260 405,190 411,110 437,110
    450,190 465,150 482,240 502,240 508,190 514,110 590,110 600,60"/>

  <!-- axis -->
  <line x1="80" y1="300" x2="600" y2="300" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M 600,300 L 590,296 L 590,304 Z" fill="#1F1B16"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C" text-anchor="middle">
    <text x="80" y="316">0h</text>
    <text x="210" y="316">2h</text>
    <text x="340" y="316">4h</text>
    <text x="470" y="316">6h</text>
    <text x="600" y="316">8h</text>
  </g>
  <text x="340" y="336" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Time asleep →</text>

  <!-- callouts -->
  <text x="157" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#2C4A3E" font-weight="600">Deep sleep — largest early</text>
  <text x="550" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#C9412C" font-weight="600">REM — longest late in the night</text>
</svg>
