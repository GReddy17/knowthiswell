<svg viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vpnCmpTitle">
  <title id="vpnCmpTitle">What a VPN protects against: it encrypts traffic between your device and the VPN server, hides browsing from the local network and your internet provider, and masks your IP address from websites. What it does not protect against: phishing and malware, tracking by accounts you are logged into and browser fingerprinting, and it shifts trust to the VPN provider.</title>
  <rect width="560" height="290" fill="#FBF8F1"/>
  <text x="150" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">A VPN does protect</text>
  <rect x="40" y="46" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Traffic on public Wi-Fi</text>
  <text x="150" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(encrypted to the VPN server)</text>
  <rect x="40" y="104" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Browsing hidden from your</text>
  <text x="150" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">internet provider</text>
  <rect x="40" y="162" width="220" height="50" rx="6" fill="#2C4A3E"/>
  <text x="150" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Your IP address hidden</text>
  <text x="150" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">from the sites you visit</text>
  <text x="410" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8B6F4E">A VPN does not protect</text>
  <rect x="300" y="46" width="220" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="410" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Phishing pages and</text>
  <text x="410" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">malware downloads</text>
  <rect x="300" y="104" width="220" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="410" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Tracking by logged-in</text>
  <text x="410" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">accounts and fingerprints</text>
  <rect x="300" y="162" width="220" height="50" rx="6" fill="#8B6F4E"/>
  <text x="410" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">What the VPN provider</text>
  <text x="410" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">itself can see</text>
  <line x1="280" y1="46" x2="280" y2="212" stroke="#E3DCC9" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="280" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">A VPN moves who can see your traffic.</text>
  <text x="280" y="264" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">It doesn't make you anonymous or scam-proof.</text>
</svg>
