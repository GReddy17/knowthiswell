<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="foiaFlowTitle">
  <title id="foiaFlowTitle">A flow diagram showing four steps: Submit Request to Agency, Agency Review Within Statutory Timeframe, Response (Full Release, Partial Release with Redactions, or Denial with Cited Exemption), and an optional final step, Formal Appeal if Denied</title>
  <rect width="720" height="340" fill="#FBF8F1"/>

  <rect x="30" y="30" width="180" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Submit Request</text>
  <text x="120" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">to Agency</text>

  <rect x="270" y="30" width="180" height="60" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Agency Review Within</text>
  <text x="360" y="68" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Statutory Timeframe</text>

  <line x1="210" y1="60" x2="270" y2="60" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="90" y="140" width="160" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="170" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Full Release</text>

  <rect x="280" y="140" width="160" height="60" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Partial Release</text>
  <text x="360" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">(with redactions)</text>

  <rect x="470" y="140" width="180" height="60" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="560" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Denial</text>
  <text x="560" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">(with cited exemption)</text>

  <line x1="360" y1="90" x2="170" y2="140" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="360" y1="90" x2="360" y2="140" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="360" y1="90" x2="560" y2="140" stroke="#2C4A3E" stroke-width="1.5"/>

  <rect x="470" y="250" width="180" height="60" rx="6" fill="#2C4A3E"/>
  <text x="560" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Formal Appeal</text>
  <text x="560" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">(if denied or partial)</text>

  <line x1="560" y1="200" x2="560" y2="250" stroke="#B5493A" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="360" y1="200" x2="470" y2="270" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow5)"/>

  <defs>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
