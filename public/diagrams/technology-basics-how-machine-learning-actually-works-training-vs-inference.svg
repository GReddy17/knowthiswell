<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mlTrainInferTitle">
  <title id="mlTrainInferTitle">Two-stage diagram. Top stage, labeled Training: a loop showing example data with known answers going into a model, the model making a guess, the guess being compared to the known answer, and an adjustment step feeding back into the model, repeating many times. Bottom stage, labeled Inference: the same trained model now receiving new, unlabeled data and producing an output, with no comparison or adjustment step this time.</title>
  <rect width="820" height="380" fill="#FBF8F1"/>

  <text x="410" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2C4A3E">Training (happens once, offline, using known examples)</text>

  <rect x="40" y="50" width="140" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="110" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Labeled examples</text>
  <text x="110" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">input + correct answer</text>

  <rect x="240" y="50" width="140" height="60" rx="8" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="310" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Model guesses</text>
  <text x="310" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">produces a prediction</text>

  <rect x="440" y="50" width="140" height="60" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="510" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Compare to answer</text>
  <text x="510" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">measures the error</text>

  <rect x="640" y="50" width="140" height="60" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="710" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Adjust weights</text>
  <text x="710" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">nudges toward less error</text>

  <defs>
    <marker id="arrowMl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowMlRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/>
    </marker>
  </defs>

  <path d="M180,80 L240,80" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowMl)"/>
  <path d="M380,80 L440,80" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowMl)"/>
  <path d="M580,80 L640,80" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowMl)"/>
  <path d="M710,110 C 710,150 310,150 310,110" fill="none" stroke="#B5493A" stroke-width="1.5" marker-end="url(#arrowMlRed)"/>
  <text x="510" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5493A">repeat thousands to billions of times, error shrinking each pass</text>

  <line x1="40" y1="185" x2="780" y2="185" stroke="#D8D2C4" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="410" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#2C4A3E">Inference (happens every time you actually use it)</text>

  <rect x="140" y="240" width="160" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="220" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">New, unlabeled input</text>
  <text x="220" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">no correct answer attached</text>

  <rect x="380" y="240" width="160" height="60" rx="8" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="460" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Trained model</text>
  <text x="460" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">weights are now frozen</text>

  <rect x="620" y="240" width="160" height="60" rx="8" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="700" y="266" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Output</text>
  <text x="700" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">a prediction, no feedback loop</text>

  <path d="M300,270 L380,270" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowMl)"/>
  <path d="M540,270 L620,270" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowMl)"/>

  <text x="410" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">The adjustment loop only runs during training. Once deployed, the model applies what it already learned — it does not keep changing itself with every use.</text>
</svg>
