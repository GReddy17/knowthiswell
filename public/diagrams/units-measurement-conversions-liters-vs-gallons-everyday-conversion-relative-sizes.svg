<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="litersGallonsTitle">
  <title id="litersGallonsTitle">Three vertical bars compared side by side at proportional heights: a short bar labeled 1 liter, a taller bar about 3.8 times as tall labeled 1 US gallon equals 3.78541 liters, and the tallest bar about 4.5 times the liter bar's height labeled 1 UK imperial gallon equals 4.54609 liters, showing the UK gallon is noticeably larger than the US gallon</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <!-- baseline -->
  <line x1="60" y1="255" x2="720" y2="255" stroke="#2C4A3E" stroke-width="1.6"/>

  <!-- 1 liter bar -->
  <rect x="120" y="235" width="90" height="20" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="165" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">1 liter</text>

  <!-- 1 US gallon bar -->
  <rect x="330" y="103" width="90" height="152" rx="4" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="375" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">1 US gallon</text>
  <text x="375" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">3.78541 L</text>

  <!-- 1 UK gallon bar -->
  <rect x="540" y="73" width="90" height="182" rx="4" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="585" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1 UK gallon</text>
  <text x="585" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">4.54609 L</text>

  <text x="390" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The UK imperial gallon is about 20% larger than the US gallon — the same word, two different sizes.</text>
</svg>
