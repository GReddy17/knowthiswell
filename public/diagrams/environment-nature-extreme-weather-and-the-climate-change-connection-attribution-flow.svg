<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="attributionTitle">
  <title id="attributionTitle">A flow diagram showing a real extreme weather event branching into two parallel climate model simulations: one using actual observed climate conditions, producing a probability and intensity estimate, and one using a simulated pre-industrial climate without human-driven warming, producing a separate lower probability and intensity estimate; the two results are compared to produce a final attribution statement such as this event was made three times more likely by climate change.</title>
  <rect width="780" height="340" fill="#FBF8F1"/>

  <rect x="300" y="20" width="180" height="60" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Real extreme</text>
  <text x="390" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">weather event</text>

  <line x1="360" y1="80" x2="180" y2="130" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="420" y1="80" x2="600" y2="130" stroke="#2C4A3E" stroke-width="1.6"/>

  <!-- left branch: actual climate -->
  <rect x="60" y="130" width="240" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="180" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Model run: actual</text>
  <text x="180" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">observed climate</text>
  <text x="180" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">→ higher probability</text>
  <text x="180" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">and intensity</text>

  <!-- right branch: counterfactual -->
  <rect x="480" y="130" width="240" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Model run: simulated</text>
  <text x="600" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">pre-industrial climate</text>
  <text x="600" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">→ lower probability</text>
  <text x="600" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">and intensity</text>

  <line x1="180" y1="220" x2="330" y2="270" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="600" y1="220" x2="450" y2="270" stroke="#2C4A3E" stroke-width="1.6"/>

  <rect x="230" y="270" width="320" height="55" rx="10" fill="#EDE7D8" stroke="#B5493A" stroke-width="2.5"/>
  <text x="390" y="293" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Compare the two results:</text>
  <text x="390" y="311" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">&quot;made 3x more likely by climate change&quot;</text>
</svg>
