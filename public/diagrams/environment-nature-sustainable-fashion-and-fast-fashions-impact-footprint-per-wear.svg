<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fashionFootprintTitle">
  <title id="fashionFootprintTitle">Two identical shirt icons each labeled with the same fixed manufacturing footprint value. The left shirt has a row of 8 small tally marks beneath it labeled fast fashion, low utilization, with a large footprint-per-wear number shown. The right shirt has a row of 80 small tally marks beneath it labeled durable or secondhand, high utilization, with a footprint-per-wear number roughly one-tenth as large.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <!-- Left: low utilization -->
  <rect x="90" y="30" width="90" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="135" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#4A443C">👕</text>
  <text x="135" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Same fixed footprint</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">
    <text x="60" y="140">|</text><text x="70" y="140">|</text><text x="80" y="140">|</text><text x="90" y="140">|</text>
    <text x="100" y="140">|</text><text x="110" y="140">|</text><text x="120" y="140">|</text><text x="130" y="140">|</text>
  </g>
  <text x="135" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">8 wears</text>
  <text x="135" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Fast fashion,</text>
  <text x="135" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">low utilization</text>
  <rect x="90" y="205" width="90" height="34" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="135" y="227" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5493A">High / wear</text>

  <!-- Right: high utilization -->
  <rect x="600" y="30" width="90" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="645" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#4A443C">👕</text>
  <text x="645" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Same fixed footprint</text>

  <text x="645" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#2C4A3E">≡≡≡≡≡</text>
  <text x="645" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1F1B16">80 wears</text>
  <text x="645" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Durable / secondhand,</text>
  <text x="645" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">high utilization</text>
  <rect x="600" y="205" width="90" height="34" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="645" y="227" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Low / wear</text>

  <text x="390" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Same manufacturing footprint, divided across a very different number of wears.</text>
</svg>
