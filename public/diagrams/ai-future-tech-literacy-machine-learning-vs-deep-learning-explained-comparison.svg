<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mlDlTitle">
  <title id="mlDlTitle">Artificial intelligence is the largest category, machine learning is a subset of it, and deep learning is a smaller subset within machine learning that uses many-layered neural networks learning their own features from raw data.</title>
  <rect width="560" height="340" fill="#FBF8F1"/>
  <circle cx="280" cy="150" r="130" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8B6F4E">Artificial intelligence</text>
  <circle cx="280" cy="165" r="90" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="280" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">Machine learning</text>
  <circle cx="280" cy="185" r="50" fill="#2C4A3E"/>
  <text x="280" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Deep</text>
  <text x="280" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">learning</text>
  <line x1="20" y1="300" x2="540" y2="300" stroke="#E3DCC9" stroke-width="1"/>
  <text x="150" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Classical ML: person picks the features</text>
  <text x="410" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Deep learning: layers learn their own features</text>
</svg>
