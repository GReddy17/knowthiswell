<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cloudTopologyTitle">
  <title id="cloudTopologyTitle">A diagram showing a person's device on the left sending a request over the internet to a large building labeled Data Center on the right, which contains several rows of labeled server rack boxes, illustrating that "the cloud" is really physical computers owned by a company, housed in a real building, not a nebulous shape in the sky.</title>
  <rect width="800" height="320" fill="#FBF8F1"/>

  <rect x="30" y="130" width="120" height="60" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="90" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Your device</text>
  <text x="90" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">(phone, laptop)</text>

  <defs>
    <marker id="arrowCloud" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M150,160 L268,160" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowCloud)"/>
  <text x="210" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">the internet</text>

  <rect x="270" y="90" width="150" height="150" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2" rx="4"/>
  <text x="345" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">A real data center</text>
  <text x="345" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(a building, somewhere)</text>

  <rect x="290" y="140" width="110" height="18" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
  <rect x="290" y="163" width="110" height="18" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
  <rect x="290" y="186" width="110" height="18" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
  <rect x="290" y="209" width="110" height="18" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="345" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">server rack</text>
  <text x="345" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">server rack</text>
  <text x="345" y="199" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">server rack</text>
  <text x="345" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">server rack</text>

  <rect x="460" y="90" width="150" height="150" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2" rx="4" opacity="0.55"/>
  <text x="535" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">another data center</text>
  <text x="535" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(a different city)</text>

  <rect x="480" y="140" width="110" height="18" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.2" opacity="0.7"/>
  <rect x="480" y="163" width="110" height="18" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.2" opacity="0.7"/>
  <rect x="480" y="186" width="110" height="18" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.2" opacity="0.7"/>

  <path d="M420,165 L458,165" fill="none" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowCloud)"/>

  <text x="660" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C" font-weight="700">a company owns</text>
  <text x="660" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C" font-weight="700">and runs these</text>
  <text x="660" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C" font-weight="700">buildings for you</text>

  <text x="400" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">&quot;The cloud&quot; is someone else&apos;s computer, in someone else&apos;s building.</text>
</svg>
