<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ideologyAxisTitle">
  <title id="ideologyAxisTitle">A comparison diagram showing on the left a single horizontal left-right line with a dot placed on it, and on the right a two-dimensional grid with a horizontal left-right axis and a vertical authoritarian-libertarian axis, with the same dot now placed at a specific point on both axes, illustrating how the two-axis version distinguishes positions the single line collapses together</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="180" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Single line</text>
  <line x1="60" y1="160" x2="300" y2="160" stroke="#2C4A3E" stroke-width="2"/>
  <text x="60" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Left</text>
  <text x="280" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Right</text>
  <circle cx="195" cy="160" r="8" fill="#B5493A"/>

  <line x1="360" y1="60" x2="360" y2="290" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="580" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Two-axis grid</text>
  <line x1="440" y1="175" x2="720" y2="175" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="580" y1="60" x2="580" y2="290" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="440" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Econ. Left</text>
  <text x="670" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Econ. Right</text>
  <text x="585" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Authoritarian</text>
  <text x="585" y="285" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Libertarian</text>
  <circle cx="630" cy="130" r="8" fill="#B5493A"/>

  <text x="390" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">The same position, distinguishable on two axes but collapsed on one.</text>
</svg>
