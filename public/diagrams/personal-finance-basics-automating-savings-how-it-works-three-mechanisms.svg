<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autoSaveTitle">
  <title id="autoSaveTitle">A diagram showing three parallel paths into a savings account: a recurring bank transfer from checking on a schedule, a direct deposit split routing part of a paycheck before it reaches checking, and a round-up program sweeping spare change from card purchases.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <rect x="20" y="20" width="180" height="50" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="50" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Checking account</text>
  <line x1="200" y1="45" x2="560" y2="45" stroke="#2C4A3E" stroke-width="2" marker-end="url(#am)"/>
  <text x="380" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">recurring automatic transfer, fixed schedule</text>

  <rect x="20" y="120" width="180" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Paycheck (payroll)</text>
  <line x1="200" y1="145" x2="560" y2="145" stroke="#2C4A3E" stroke-width="2" marker-end="url(#am)"/>
  <text x="380" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">direct deposit split, before reaching checking</text>

  <rect x="20" y="220" width="180" height="50" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Card purchases</text>
  <text x="110" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">(round-up program)</text>
  <line x1="200" y1="245" x2="560" y2="145" stroke="#2C4A3E" stroke-width="2" marker-end="url(#am)"/>
  <text x="380" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">spare change swept per transaction</text>

  <rect x="560" y="95" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="660" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Savings account</text>

  <defs>
    <marker id="am" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/></marker>
  </defs>
</svg>
