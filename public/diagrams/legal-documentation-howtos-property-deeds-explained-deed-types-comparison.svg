<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="640" height="300" fill="#FBF8F1"/>
  <text x="320" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1B16">Deed types, by strength of title guarantee</text>

  <g>
    <rect x="40" y="60" width="170" height="180" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="125" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1B16">Warranty Deed</text>
    <text x="125" y="112" text-anchor="middle" font-size="11" fill="#4A443C">Strongest guarantee</text>
    <text x="125" y="140" text-anchor="middle" font-size="10" fill="#4A443C">Seller warrants clear</text>
    <text x="125" y="154" text-anchor="middle" font-size="10" fill="#4A443C">title, full history</text>
    <text x="125" y="180" text-anchor="middle" font-size="10" fill="#4A443C">Defends against</text>
    <text x="125" y="194" text-anchor="middle" font-size="10" fill="#4A443C">future claims</text>
  </g>

  <g>
    <rect x="235" y="60" width="170" height="180" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="320" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1B16">Grant Deed</text>
    <text x="320" y="112" text-anchor="middle" font-size="11" fill="#4A443C">Moderate guarantee</text>
    <text x="320" y="140" text-anchor="middle" font-size="10" fill="#4A443C">Covers only seller&#8217;s</text>
    <text x="320" y="154" text-anchor="middle" font-size="10" fill="#4A443C">own ownership period</text>
    <text x="320" y="180" text-anchor="middle" font-size="10" fill="#4A443C">No coverage for</text>
    <text x="320" y="194" text-anchor="middle" font-size="10" fill="#4A443C">earlier owners</text>
  </g>

  <g>
    <rect x="430" y="60" width="170" height="180" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
    <text x="515" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F1B16">Quitclaim Deed</text>
    <text x="515" y="112" text-anchor="middle" font-size="11" fill="#B5493A">No guarantee</text>
    <text x="515" y="140" text-anchor="middle" font-size="10" fill="#4A443C">Transfers only</text>
    <text x="515" y="154" text-anchor="middle" font-size="10" fill="#4A443C">whatever interest</text>
    <text x="515" y="168" text-anchor="middle" font-size="10" fill="#4A443C">the seller has, if any</text>
    <text x="515" y="194" text-anchor="middle" font-size="10" fill="#4A443C">Common for family</text>
    <text x="515" y="208" text-anchor="middle" font-size="10" fill="#4A443C">transfers</text>
  </g>

  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#4A443C">All three legally transfer ownership — they differ only in what they promise about that ownership</text>
</svg>
