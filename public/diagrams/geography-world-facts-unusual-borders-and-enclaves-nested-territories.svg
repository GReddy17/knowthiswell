<svg viewBox="0 0 660 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="enclavesTitle">
  <title id="enclavesTitle">Three side-by-side diagrams: Lesotho fully enclosed within South Africa as a pure enclave; Kaliningrad separated from Russia by Poland and Lithuania while touching open sea, an exclave that is not an enclave; and a Dutch counter-enclave nested inside a Belgian exclave which is itself inside the Netherlands</title>
  <rect width="660" height="320" fill="#FBF8F1"/>

  <line x1="220" y1="20" x2="220" y2="280" stroke="#E3DCC9" stroke-width="1"/>
  <line x1="440" y1="20" x2="440" y2="280" stroke="#E3DCC9" stroke-width="1"/>

  <!-- Panel 1: Lesotho / South Africa (pure enclave) -->
  <g>
    <rect x="30" y="40" width="160" height="150" rx="14" fill="#2C4A3E" opacity="0.85"/>
    <text x="110" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#FBF8F1">South Africa</text>
    <circle cx="110" cy="125" r="30" fill="#C97C3D"/>
    <text x="110" y="129" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Lesotho</text>
    <text x="110" y="220" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">Pure enclave</text>
    <text x="110" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">fully surrounded, no coast</text>
  </g>

  <!-- Panel 2: Kaliningrad (exclave, not an enclave) -->
  <g>
    <path d="M 260,40 Q 400,20 430,40 L 430,80 L 260,80 Z" fill="#4A7A9E" opacity="0.5"/>
    <text x="340" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#20362D">Baltic Sea</text>
    <rect x="330" y="85" width="90" height="100" fill="#2C4A3E" opacity="0.85"/>
    <text x="375" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">Poland /</text>
    <text x="375" y="119" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">Lithuania</text>
    <rect x="255" y="88" width="65" height="60" fill="#C9412C" opacity="0.85"/>
    <text x="287" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">Kalinin-</text>
    <text x="287" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">grad</text>
    <rect x="440" y="88" width="150" height="97" fill="#2C4A3E" opacity="0.6"/>
    <text x="515" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Russia</text>
    <text x="345" y="220" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">Exclave, not an enclave</text>
    <text x="345" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">cut off from Russia, but has a coast</text>
  </g>

  <!-- Panel 3: Baarle-style nested counter-enclaves -->
  <g>
    <rect x="470" y="40" width="160" height="150" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="550" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Netherlands</text>
    <circle cx="550" cy="125" r="48" fill="#C97C3D" opacity="0.85"/>
    <text x="550" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">Belgian exclave</text>
    <circle cx="550" cy="132" r="12" fill="#4A7A9E"/>
    <text x="550" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#1F1B16">Dutch</text>
    <text x="550" y="220" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">Nested counter-enclaves</text>
    <text x="550" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Baarle-Hertog / Baarle-Nassau</text>
  </g>
</svg>
