<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deliveredNotReadTitle">
  <title id="deliveredNotReadTitle">A decision tree starting from a message reaching Delivered status, branching into four possible reasons it may never advance to Read: the recipient has read receipts turned off, the recipient has not opened the specific conversation yet, the message arrived on a muted or non-default device, or the recipient saw it in a notification preview without opening the app.</title>
  <rect width="800" height="320" fill="#FBF8F1"/>

  <rect x="320" y="20" width="160" height="46" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Delivered</text>

  <defs>
    <marker id="arrowDecision" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M340,66 C 250,100 160,120 130,140" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowDecision)"/>
  <path d="M380,66 C 350,100 330,120 320,140" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowDecision)"/>
  <path d="M420,66 C 450,100 470,120 480,140" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowDecision)"/>
  <path d="M460,66 C 550,100 640,120 670,140" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowDecision)"/>

  <rect x="20" y="150" width="180" height="60" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Read receipts</text>
  <text x="110" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">turned off</text>
  <text x="110" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">signal never sent back</text>

  <rect x="220" y="150" width="180" height="60" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Conversation not</text>
  <text x="310" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">opened yet</text>
  <text x="310" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">app just hasn't been opened</text>

  <rect x="420" y="150" width="180" height="60" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="510" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Delivered to a</text>
  <text x="510" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">muted device</text>
  <text x="510" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">no alert fired there</text>

  <rect x="620" y="150" width="160" height="60" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
  <text x="700" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Seen in preview</text>
  <text x="700" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">only</text>
  <text x="700" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">notification banner, not opened</text>

  <rect x="60" y="255" width="680" height="45" fill="#FBF8F1" stroke="#D8D2C4" stroke-width="1"/>
  <text x="90" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">In every branch, "Delivered" is factually true — the network confirmed arrival. None of these branches mean the message failed; they mean the read signal specifically never fired.</text>
</svg>
