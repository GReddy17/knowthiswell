<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fiveSensesTitle">
  <title id="fiveSensesTitle">Five columns, one per sense — sight, hearing, smell, taste, and touch — each showing the physical stimulus, the receptor organ, and an arrow to a labeled region of the brain that interprets the signal</title>

  <rect x="0" y="0" width="640" height="460" fill="#FBF8F1"/>
  <text x="320" y="34" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="600" fill="#1F1B16">Stimulus → Receptor → Brain</text>

  <!-- column layout: x centers at 90, 218, 346, 474, 588 minus offset; use 5 columns spaced -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">

    <!-- Sight -->
    <g transform="translate(64,0)">
      <text x="0" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Sight</text>
      <text x="0" y="92" text-anchor="middle" font-size="10" fill="#4A443C">Light waves</text>
      <circle cx="0" cy="130" r="24" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
      <text x="0" y="134" text-anchor="middle" font-size="10" fill="#1F1B16">Eye</text>
      <line x1="0" y1="156" x2="0" y2="230" stroke="#4A443C" stroke-width="1.5"/>
      <path d="M 0,230 L -5,220 L 5,220 Z" fill="#4A443C"/>
      <rect x="-40" y="238" width="80" height="34" rx="4" fill="#FBEDEA" stroke="#C9412C" stroke-width="1"/>
      <text x="0" y="258" text-anchor="middle" font-size="10" fill="#1F1B16">Visual cortex</text>
    </g>

    <!-- Hearing -->
    <g transform="translate(192,0)">
      <text x="0" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Hearing</text>
      <text x="0" y="92" text-anchor="middle" font-size="10" fill="#4A443C">Sound waves</text>
      <circle cx="0" cy="130" r="24" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
      <text x="0" y="134" text-anchor="middle" font-size="10" fill="#1F1B16">Ear</text>
      <line x1="0" y1="156" x2="0" y2="230" stroke="#4A443C" stroke-width="1.5"/>
      <path d="M 0,230 L -5,220 L 5,220 Z" fill="#4A443C"/>
      <rect x="-40" y="238" width="80" height="34" rx="4" fill="#FBEDEA" stroke="#C9412C" stroke-width="1"/>
      <text x="0" y="258" text-anchor="middle" font-size="10" fill="#1F1B16">Auditory cortex</text>
    </g>

    <!-- Smell -->
    <g transform="translate(320,0)">
      <text x="0" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Smell</text>
      <text x="0" y="92" text-anchor="middle" font-size="10" fill="#4A443C">Airborne molecules</text>
      <circle cx="0" cy="130" r="24" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
      <text x="0" y="134" text-anchor="middle" font-size="10" fill="#1F1B16">Nose</text>
      <line x1="0" y1="156" x2="0" y2="230" stroke="#4A443C" stroke-width="1.5"/>
      <path d="M 0,230 L -5,220 L 5,220 Z" fill="#4A443C"/>
      <rect x="-42" y="238" width="84" height="34" rx="4" fill="#FBEDEA" stroke="#C9412C" stroke-width="1"/>
      <text x="0" y="258" text-anchor="middle" font-size="10" fill="#1F1B16">Olfactory bulb</text>
    </g>

    <!-- Taste -->
    <g transform="translate(448,0)">
      <text x="0" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Taste</text>
      <text x="0" y="92" text-anchor="middle" font-size="10" fill="#4A443C">Dissolved molecules</text>
      <circle cx="0" cy="130" r="24" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
      <text x="0" y="134" text-anchor="middle" font-size="10" fill="#1F1B16">Tongue</text>
      <line x1="0" y1="156" x2="0" y2="230" stroke="#4A443C" stroke-width="1.5"/>
      <path d="M 0,230 L -5,220 L 5,220 Z" fill="#4A443C"/>
      <rect x="-42" y="238" width="84" height="34" rx="4" fill="#FBEDEA" stroke="#C9412C" stroke-width="1"/>
      <text x="0" y="252" text-anchor="middle" font-size="10" fill="#1F1B16">Gustatory</text>
      <text x="0" y="264" text-anchor="middle" font-size="10" fill="#1F1B16">cortex</text>
    </g>

    <!-- Touch -->
    <g transform="translate(576,0)">
      <text x="0" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1F1B16">Touch</text>
      <text x="0" y="86" text-anchor="middle" font-size="10" fill="#4A443C">Pressure /</text>
      <text x="0" y="98" text-anchor="middle" font-size="10" fill="#4A443C">temperature</text>
      <circle cx="0" cy="132" r="24" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
      <text x="0" y="136" text-anchor="middle" font-size="10" fill="#1F1B16">Skin</text>
      <line x1="0" y1="158" x2="0" y2="230" stroke="#4A443C" stroke-width="1.5"/>
      <path d="M 0,230 L -5,220 L 5,220 Z" fill="#4A443C"/>
      <rect x="-42" y="238" width="84" height="34" rx="4" fill="#FBEDEA" stroke="#C9412C" stroke-width="1"/>
      <text x="0" y="252" text-anchor="middle" font-size="10" fill="#1F1B16">Somatosensory</text>
      <text x="0" y="264" text-anchor="middle" font-size="10" fill="#1F1B16">cortex</text>
    </g>
  </g>

  <line x1="30" y1="300" x2="610" y2="300" stroke="#E3DCC9" stroke-width="1"/>
  <text x="320" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Every sense follows the same pattern: a physical stimulus is</text>
  <text x="320" y="350" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">detected by a specialized receptor and interpreted by the brain.</text>
</svg>
