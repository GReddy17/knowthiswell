<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="liIonTitle">
  <title id="liIonTitle">Diagram of a lithium-ion cell showing lithium ions moving through the electrolyte from the graphite anode to the metal-oxide cathode during discharge, while electrons take the longer path through the external circuit to power a device</title>
  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="40" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="700" fill="#1F1B16">Discharging: powering a device</text>

  <!-- anode -->
  <rect x="90" y="80" width="90" height="220" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="135" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Anode</text>
  <text x="135" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(graphite)</text>

  <!-- electrolyte + separator -->
  <rect x="180" y="80" width="100" height="220" fill="#FBEDEA" opacity="0.7"/>
  <line x1="230" y1="80" x2="230" y2="300" stroke="#8B6F4E" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="230" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Electrolyte</text>
  <text x="230" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">+ separator</text>

  <!-- cathode -->
  <rect x="280" y="80" width="90" height="220" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="325" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Cathode</text>
  <text x="325" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(lithium metal oxide)</text>

  <!-- lithium ions moving through electrolyte -->
  <g fill="#C9412C">
    <circle cx="200" cy="130" r="6"/>
    <circle cx="215" cy="170" r="6"/>
    <circle cx="200" cy="210" r="6"/>
    <circle cx="220" cy="250" r="6"/>
  </g>
  <path d="M 185,190 L 275,190" stroke="#C9412C" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M 275,190 L 265,184 L 265,196 Z" fill="#C9412C"/>
  <text x="230" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#C9412C" font-weight="700">Li+ ions</text>

  <!-- external circuit for electrons -->
  <path d="M 135,80 L 135,40 L 325,40 L 325,80" stroke="#2C4A3E" stroke-width="2.5" fill="none"/>
  <rect x="200" y="20" width="60" height="30" rx="4" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="230" y="40" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Device</text>
  <path d="M 260,40 L 275,35 L 275,45 Z" fill="#2C4A3E"/>
  <text x="230" y="15" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Electrons — longer way round, doing the work</text>

  <!-- degradation note box -->
  <rect x="410" y="90" width="190" height="200" rx="8" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="505" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Why capacity fades</text>
  <text x="425" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">- Each full cycle stresses</text>
  <text x="425" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">  electrode structure</text>
  <text x="425" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">- A film (SEI layer) slowly</text>
  <text x="425" y="193" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">  builds on the anode</text>
  <text x="425" y="216" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">- Heat speeds up both</text>
  <text x="425" y="231" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">  effects</text>
  <text x="425" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">- Ages even while sitting</text>
  <text x="425" y="269" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">  unused (calendar aging)</text>

  <text x="320" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Charging reverses both flows: ions and electrons both head back to the anode.</text>
</svg>
