<svg viewBox="0 0 560 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="e2eeCompTitle">
  <title id="e2eeCompTitle">Encryption in transit versus end-to-end encryption: with in-transit encryption the service can read your messages on its servers; with end-to-end encryption only the sender and recipient devices hold the keys.</title>
  <rect width="560" height="336" fill="#FBF8F1"/>
  <rect x="20" y="20" width="250" height="56" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="145" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Encrypted in transit</text>
  <text x="145" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">(most email, many apps)</text>
  <rect x="20" y="92" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Locked between you and the server</text>
  <rect x="20" y="136" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Server unlocks and stores readable copy</text>
  <rect x="20" y="180" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Provider can read or hand over content</text>
  <rect x="20" y="224" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="145" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">A server breach can expose messages</text>
  <rect x="290" y="20" width="250" height="56" rx="6" fill="#2C4A3E"/>
  <text x="415" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">End-to-end encrypted</text>
  <text x="415" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">(Signal, WhatsApp, iMessage)</text>
  <rect x="290" y="92" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Locked on your device</text>
  <rect x="290" y="136" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Server only relays scrambled data</text>
  <rect x="290" y="180" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Only the two devices hold the keys</text>
  <rect x="290" y="224" width="250" height="36" rx="4" fill="#FFFFFF" stroke="#D9CBB3" stroke-width="1"/>
  <text x="415" y="246" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Metadata and backups may still leak</text>
  <text x="280" y="314" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">E2EE protects content in the middle, not your unlocked phone or who you talked to</text>
</svg>
