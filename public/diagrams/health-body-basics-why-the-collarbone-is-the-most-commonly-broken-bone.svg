<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clavicleTitle">
  <title id="clavicleTitle">Diagram of the collarbone's S-shaped curve connecting the shoulder blade to the breastbone, highlighting the middle third where roughly 80 percent of fractures occur</title>
  <rect width="640" height="300" fill="#FBF8F1"/>

  <text x="320" y="35" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="18" font-weight="700" fill="#1F1B16">The clavicle's S-curve</text>

  <text x="120" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Breastbone end</text>
  <text x="520" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1F1B16">Shoulder end</text>

  <path d="M140,170 C 220,120 260,220 320,170 C 380,120 420,220 500,170" fill="none" stroke="#1F1B16" stroke-width="14" stroke-linecap="round"/>
  <path d="M140,170 C 220,120 260,220 320,170 C 380,120 420,220 500,170" fill="none" stroke="#FBF8F1" stroke-width="8" stroke-linecap="round"/>

  <circle cx="320" cy="170" r="22" fill="none" stroke="#C9412C" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="320" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#C9412C">Middle third</text>
  <text x="320" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#C9412C">~80% of fractures happen here</text>

  <path d="M120,260 L120,220" stroke="#2C4A3E" stroke-width="3"/>
  <text x="120" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2C4A3E">Fall force travels</text>
  <text x="120" y="291" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2C4A3E">up the arm</text>

  <text x="320" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16" opacity="0.7"></text>
</svg>
