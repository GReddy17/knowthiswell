<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workRateTitle">
  <title id="workRateTitle">A diagram showing Pipe A filling a tank alone in 6 hours at a rate of one-sixth tank per hour, and Pipe B filling the same tank alone in 3 hours at a rate of one-third tank per hour, with their rates added together to give a combined rate of one-half tank per hour, meaning both pipes working together fill the tank in 2 hours</title>
  <rect width="780" height="280" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Combined work rate: add the rates, not the times</text>

  <rect x="50" y="55" width="220" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="160" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Pipe A alone</text>
  <text x="160" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">6 hours to fill tank</text>
  <text x="160" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">rate = 1/6 tank/hr</text>

  <text x="300" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">+</text>

  <rect x="330" y="55" width="220" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="440" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Pipe B alone</text>
  <text x="440" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">3 hours to fill tank</text>
  <text x="440" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">rate = 1/3 tank/hr</text>

  <text x="580" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">=</text>

  <rect x="610" y="55" width="140" height="90" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="680" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Combined rate</text>
  <text x="680" y="107" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">1/6 + 1/3 = 1/2</text>
  <text x="680" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A">2 hours together</text>

  <text x="390" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Time = 1 ÷ combined rate = 1 ÷ (1/2) = 2 hours — NOT the average of 6 and 3.</text>
  <text x="390" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Working together is always faster than the faster pipe working alone.</text>
</svg>
