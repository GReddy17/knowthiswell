<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="patchWindowTitle">
  <title id="patchWindowTitle">Timeline showing a flaw being discovered, then a red exposure window during which the flaw is known but unpatched, ending when a patch is released and installed, illustrating why delaying an update extends the exposure window</title>
  <rect width="640" height="320" fill="#FBF8F1"/>
  <text x="320" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">The exposure window a software update closes</text>

  <line x1="60" y1="160" x2="580" y2="160" stroke="#2C4A3E" stroke-width="2"/>

  <circle cx="110" cy="160" r="7" fill="#2C4A3E"/>
  <text x="110" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Flaw</text>
  <text x="110" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">discovered</text>

  <rect x="110" y="150" width="220" height="20" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="220" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#C9412C">known, unpatched — attackers can use it</text>

  <circle cx="330" cy="160" r="7" fill="#8B6F4E"/>
  <text x="330" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Patch</text>
  <text x="330" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">released</text>

  <rect x="330" y="150" width="150" height="20" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="405" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">still exposed if update is delayed</text>

  <circle cx="480" cy="160" r="7" fill="#2C4A3E"/>
  <text x="480" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">You</text>
  <text x="480" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">install it</text>

  <rect x="480" y="150" width="100" height="20" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="530" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">closed</text>

  <text x="320" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Every day between "patch released" and "you install it" is a day the fix existed but didn't protect you.</text>
</svg>
