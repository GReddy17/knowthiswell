<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="legalNoticeAnatomyTitle">
  <title id="legalNoticeAnatomyTitle">An anatomy diagram of a typical legal notice, labeling its key parts: the sender and case or reference number at the top, the recipient, a statement of the issue or claim, a required action, a response deadline, and contact information for questions.</title>
  <rect width="620" height="400" fill="#FBF8F1"/>

  <rect x="150" y="20" width="320" height="360" rx="6" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2"/>

  <rect x="170" y="40" width="280" height="30" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="310" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Sender + case/reference number</text>

  <rect x="170" y="85" width="280" height="30" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="310" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Recipient (your name/address)</text>

  <rect x="170" y="130" width="280" height="45" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="310" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Statement of the issue</text>
  <text x="310" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">or claim</text>

  <rect x="170" y="190" width="280" height="45" rx="4" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
  <text x="310" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Required action</text>
  <text x="310" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(what you must do)</text>

  <rect x="170" y="250" width="280" height="45" rx="4" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
  <text x="310" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Response deadline</text>
  <text x="310" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">(the most important date)</text>

  <rect x="170" y="310" width="280" height="45" rx="4" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="310" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Contact information</text>
  <text x="310" y="345" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">for questions</text>

  <text x="20" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C" transform="rotate(-90 20 200)">A typical legal notice</text>
</svg>
