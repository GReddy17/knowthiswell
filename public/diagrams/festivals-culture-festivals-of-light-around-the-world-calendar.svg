<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">A calendar comparison of five festival-of-light traditions across the year, showing each falls at a different time for a different reason</title>
  <rect width="760" height="300" fill="#FBF8F1"/>
  <line x1="60" y1="250" x2="720" y2="250" stroke="#1F1B16" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- month ticks Jan..Dec -->
    <g font-size="10" fill="#8B6F4E">
      <text x="70" y="266" text-anchor="middle">Jan</text>
      <text x="125" y="266" text-anchor="middle">Feb</text>
      <text x="180" y="266" text-anchor="middle">Mar</text>
      <text x="235" y="266" text-anchor="middle">Apr</text>
      <text x="290" y="266" text-anchor="middle">May</text>
      <text x="345" y="266" text-anchor="middle">Jun</text>
      <text x="400" y="266" text-anchor="middle">Jul</text>
      <text x="455" y="266" text-anchor="middle">Aug</text>
      <text x="510" y="266" text-anchor="middle">Sep</text>
      <text x="565" y="266" text-anchor="middle">Oct</text>
      <text x="620" y="266" text-anchor="middle">Nov</text>
      <text x="675" y="266" text-anchor="middle">Dec</text>
      <text x="710" y="266" text-anchor="middle">Jan</text>
    </g>
    <g stroke="#D8CFBB" stroke-width="1">
      <line x1="70" y1="80" x2="70" y2="250"/>
      <line x1="180" y1="80" x2="180" y2="250"/>
      <line x1="290" y1="80" x2="290" y2="250"/>
      <line x1="400" y1="80" x2="400" y2="250"/>
      <line x1="510" y1="80" x2="510" y2="250"/>
      <line x1="620" y1="80" x2="620" y2="250"/>
    </g>

    <!-- Chinese Lantern Festival: mid-Feb -->
    <circle cx="140" cy="100" r="7" fill="#C0392B"/>
    <text x="140" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Lantern Festival</text>
    <text x="140" y="125" text-anchor="middle" font-size="9.5" fill="#4A443C">Lunar New Year&#8217;s close</text>

    <!-- Diwali: late Oct / early Nov -->
    <circle cx="590" cy="140" r="7" fill="#B8860B"/>
    <text x="590" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Diwali</text>
    <text x="590" y="165" text-anchor="middle" font-size="9.5" fill="#4A443C">new moon, Kartika</text>

    <!-- Hanukkah: late Nov / Dec -->
    <circle cx="640" cy="180" r="7" fill="#2E6E8E"/>
    <text x="640" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Hanukkah</text>
    <text x="640" y="222" text-anchor="middle" font-size="9.5" fill="#4A443C">25 Kislev, 8 nights</text>

    <!-- St. Lucia's Day: Dec 13 -->
    <circle cx="662" cy="100" r="7" fill="#7B4B94"/>
    <text x="662" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">St. Lucia&#8217;s Day</text>
    <text x="662" y="125" text-anchor="middle" font-size="9.5" fill="#4A443C">Dec 13, fixed</text>

    <!-- Christmas lights: mid-late Dec -->
    <circle cx="685" cy="140" r="7" fill="#2E7D4F"/>
    <text x="685" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Christmas lights</text>
    <text x="685" y="182" text-anchor="middle" font-size="9.5" fill="#4A443C">Dec 25, fixed</text>
  </g>
</svg>
