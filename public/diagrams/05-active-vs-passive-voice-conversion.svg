<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Diagram converting an active sentence into passive voice, showing the object becoming the subject, the verb changing form, and the original subject moving into a by-phrase</title>
  <rect width="640" height="260" fill="#FBF8F1"/>

  <text x="320" y="35" text-anchor="middle" font-family="ui-utility, ui-sans-serif, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#8B6F4E">ACTIVE</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
    <rect x="40" y="50" width="140" height="36" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="110" y="73" text-anchor="middle" fill="#1F1B16">The scientist</text>
    <rect x="190" y="50" width="130" height="36" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="255" y="73" text-anchor="middle" fill="#1F1B16">discovered</text>
    <rect x="330" y="50" width="150" height="36" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
    <text x="405" y="73" text-anchor="middle" fill="#1F1B16">a new species</text>
  </g>
  <text x="110" y="102" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#8B6F4E">subject</text>
  <text x="255" y="102" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#8B6F4E">verb</text>
  <text x="405" y="102" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#8B6F4E">object</text>

  <g stroke="#2C4A3E" stroke-width="2" fill="none">
    <path d="M 405,86 Q 405,120 110,150" marker-end="url(#arrow)"/>
    <path d="M 110,86 Q 110,120 500,150" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="320" y="175" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#8B6F4E">PASSIVE</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
    <rect x="20" y="190" width="150" height="36" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
    <text x="95" y="213" text-anchor="middle" fill="#1F1B16">A new species</text>
    <rect x="180" y="190" width="150" height="36" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="255" y="213" text-anchor="middle" fill="#1F1B16">was discovered</text>
    <rect x="340" y="190" width="170" height="36" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="425" y="213" text-anchor="middle" fill="#1F1B16">by the scientist</text>
  </g>
  <text x="95" y="242" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#8B6F4E">new subject</text>
  <text x="255" y="242" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#8B6F4E">be + participle</text>
  <text x="425" y="242" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" fill="#8B6F4E">optional by-phrase</text>
</svg>
