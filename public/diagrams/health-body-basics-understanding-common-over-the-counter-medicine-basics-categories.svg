<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="otcCategoriesTitle">
  <title id="otcCategoriesTitle">A diagram showing five active-ingredient categories — pain relievers, antihistamines, decongestants, antacids, and cough suppressants — each connected by lines to three or four different generic brand-name boxes, illustrating that many different products on a shelf reduce down to a small number of underlying ingredient categories</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="30" y="20" width="180" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="120" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Pain relievers</text>

    <rect x="30" y="80" width="180" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="120" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Antihistamines</text>

    <rect x="30" y="140" width="180" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="120" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Decongestants</text>

    <rect x="30" y="200" width="180" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="120" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Antacids</text>

    <rect x="30" y="260" width="180" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="120" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Cough suppressants</text>

    <!-- brand boxes -->
    <rect x="500" y="10" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="560" y="29" text-anchor="middle" font-size="11" fill="#4A443C">Brand A</text>
    <rect x="640" y="10" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="700" y="29" text-anchor="middle" font-size="11" fill="#4A443C">Brand B</text>

    <rect x="500" y="70" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="560" y="89" text-anchor="middle" font-size="11" fill="#4A443C">Brand C</text>
    <rect x="640" y="70" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="700" y="89" text-anchor="middle" font-size="11" fill="#4A443C">Brand D</text>

    <rect x="500" y="130" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="560" y="149" text-anchor="middle" font-size="11" fill="#4A443C">Brand E</text>
    <rect x="640" y="130" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="700" y="149" text-anchor="middle" font-size="11" fill="#4A443C">Brand F</text>

    <rect x="500" y="190" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="560" y="209" text-anchor="middle" font-size="11" fill="#4A443C">Brand G</text>
    <rect x="640" y="190" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="700" y="209" text-anchor="middle" font-size="11" fill="#4A443C">Brand H</text>

    <rect x="500" y="250" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="560" y="269" text-anchor="middle" font-size="11" fill="#4A443C">Brand I</text>
    <rect x="640" y="250" width="120" height="28" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="700" y="269" text-anchor="middle" font-size="11" fill="#4A443C">Brand J</text>

    <g stroke="#2C4A3E" stroke-width="1.2" fill="none">
      <path d="M210,40 C350,40 380,24 500,24"/>
      <path d="M210,40 C350,40 380,84 500,84"/>
      <path d="M210,100 C350,100 380,84 500,84"/>
      <path d="M210,100 C350,100 380,144 500,144"/>
      <path d="M210,160 C350,160 380,144 500,144"/>
      <path d="M210,160 C350,160 380,204 500,204"/>
      <path d="M210,220 C350,220 380,204 500,204"/>
      <path d="M210,220 C350,220 380,264 500,264"/>
      <path d="M210,280 C350,280 380,264 500,264"/>
    </g>
  </g>
</svg>
