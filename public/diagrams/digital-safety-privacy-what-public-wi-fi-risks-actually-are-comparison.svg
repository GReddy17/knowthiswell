<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wifiRiskTitle">
  <title id="wifiRiskTitle">Public Wi-Fi threats and what stops each one. An eavesdropper on the same network is stopped by HTTPS encryption. An evil twin hotspot is countered by confirming the network name and turning off auto-join. A fake login portal is stopped by never entering account passwords on a Wi-Fi page, with two-factor authentication as backup. Other devices probing yours are stopped by turning off sharing and keeping the firewall on.</title>
  <rect width="600" height="330" fill="#FBF8F1"/>
  <text x="155" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8B6F4E">The threat</text>
  <text x="445" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">What actually stops it</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
    <rect x="30" y="46" width="250" height="44" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="155" y="73" text-anchor="middle" fill="#1F1B16">Eavesdropper on the same network</text>
    <rect x="320" y="46" width="250" height="44" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="445" y="73" text-anchor="middle" fill="#1F1B16">HTTPS (the padlock) encrypts content</text>
    <rect x="30" y="102" width="250" height="44" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="155" y="129" text-anchor="middle" fill="#1F1B16">Evil twin hotspot (copied name)</text>
    <rect x="320" y="102" width="250" height="44" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="445" y="121" text-anchor="middle" fill="#1F1B16">Confirm the name with staff,</text>
    <text x="445" y="137" text-anchor="middle" fill="#1F1B16">turn off auto-join</text>
    <rect x="30" y="158" width="250" height="44" rx="6" fill="#8B6F4E"/>
    <text x="155" y="185" text-anchor="middle" fill="#FBF8F1">Fake login portal (phishing)</text>
    <rect x="320" y="158" width="250" height="44" rx="6" fill="#2C4A3E"/>
    <text x="445" y="177" text-anchor="middle" fill="#FBF8F1">Never type account passwords there;</text>
    <text x="445" y="193" text-anchor="middle" fill="#FBF8F1">two-factor authentication as backup</text>
    <rect x="30" y="214" width="250" height="44" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="155" y="241" text-anchor="middle" fill="#1F1B16">Other devices probing yours</text>
    <rect x="320" y="214" width="250" height="44" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="445" y="233" text-anchor="middle" fill="#1F1B16">Sharing off, firewall on,</text>
    <text x="445" y="249" text-anchor="middle" fill="#1F1B16">software updated</text>
  </g>
  <g fill="#2C4A3E">
    <polygon points="290,62 308,68 290,74"/>
    <polygon points="290,118 308,124 290,130"/>
    <polygon points="290,174 308,180 290,186"/>
    <polygon points="290,230 308,236 290,242"/>
  </g>
  <text x="300" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">The darkest row is the most common real attack:</text>
  <text x="300" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">you handing details to a fake page, which no encryption can prevent.</text>
</svg>
