<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chatbotLoopTitle">
  <title id="chatbotLoopTitle">Diagram showing a user's typed message broken into small chunks called tokens, fed into a language model, which outputs a probability ranked list of candidate next tokens, picks the top one, appends it to the growing reply, and feeds the whole updated text back into the model to predict the next token again, repeating one token at a time until a stop signal.</title>
  <rect width="820" height="320" fill="#FBF8F1"/>

  <rect x="30" y="40" width="150" height="56" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="105" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">User message</text>
  <text x="105" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">split into tokens</text>

  <rect x="240" y="40" width="150" height="56" rx="8" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="315" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Trained model</text>
  <text x="315" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">weights fixed since training</text>

  <rect x="450" y="20" width="180" height="96" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="540" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Next-token odds</text>
  <text x="540" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">"the"    41%</text>
  <text x="540" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">"a"        23%</text>
  <text x="540" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">"an"       6%</text>
  <text x="540" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">(one likely token chosen)</text>

  <rect x="670" y="40" width="130" height="56" rx="8" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="735" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Reply so far</text>
  <text x="735" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">+1 token appended</text>

  <defs>
    <marker id="arrowBot" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M180,68 L240,68" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBot)"/>
  <path d="M390,68 L450,68" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBot)"/>
  <path d="M630,68 L670,68" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBot)"/>

  <path d="M735,96 C 735,190 315,190 315,96" fill="none" stroke="#B5493A" stroke-width="1.5" marker-end="url(#arrowBot)"/>
  <text x="525" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5493A">the updated text (message + reply so far) goes back in as input</text>

  <text x="410" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2C4A3E">One token out per pass. Repeat until a stop token is produced.</text>
  <text x="410" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Nothing in this loop checks whether the finished sentence is true — it only ranks which token is statistically likely to come next.</text>

  <rect x="150" y="270" width="520" height="36" rx="6" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1"/>
  <text x="410" y="293" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">"The" → "The capital" → "The capital of" → "The capital of France" → "The capital of France is" → ...</text>
</svg>
