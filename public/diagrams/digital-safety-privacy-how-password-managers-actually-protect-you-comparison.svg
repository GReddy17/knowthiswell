<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pwCompareTitle">
  <title id="pwCompareTitle">A comparison showing one reused password across five accounts where a breach compromises all five, versus five unique manager-generated passwords where a breach only affects one.</title>
  <rect width="620" height="340" fill="#FBF8F1"/>
  <rect x="30" y="30" width="270" height="280" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="165" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">One reused password</text>
  <text x="55" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Email — same password</text>
  <text x="55" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Banking — same password</text>
  <text x="55" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Shopping — same password</text>
  <text x="55" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Social — same password</text>
  <text x="55" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Work — same password</text>
  <text x="165" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C9412C">One breach = all five</text>
  <text x="165" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C9412C">accounts exposed</text>
  <rect x="320" y="30" width="270" height="280" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="455" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Manager-generated, unique</text>
  <text x="345" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Email — unique password</text>
  <text x="345" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Banking — unique password</text>
  <text x="345" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Shopping — unique password</text>
  <text x="345" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Social — unique password</text>
  <text x="345" y="195" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Work — unique password</text>
  <text x="455" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">One breach = only that</text>
  <text x="455" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">one account exposed</text>
</svg>
