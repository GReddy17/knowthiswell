<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Sign language families don't follow spoken-language geography: American Sign Language descends from French Sign Language, while British Sign Language belongs to a separate BANZSL family shared with Auslan and New Zealand Sign Language — so the US and UK, despite both being English-speaking countries, use unrelated, mutually unintelligible sign languages</title>
  <rect width="960" height="420" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="480" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14.5" font-weight="600" fill="#1F1B16">Sign language families don't follow spoken-language borders</text>

    <!-- LSF -> ASL -->
    <rect x="60" y="50" width="200" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
    <text x="160" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">LSF</text>
    <text x="160" y="88" text-anchor="middle" font-size="9.5" fill="#4A443C">French Sign Language</text>

    <path d="M 160,100 L 160,128" stroke="#1F1B16" stroke-width="1.5"/>
    <path d="M 160,128 L 154,118 L 166,118 Z" fill="#1F1B16"/>

    <rect x="60" y="130" width="200" height="70" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1"/>
    <text x="160" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">ASL</text>
    <text x="160" y="172" text-anchor="middle" font-size="9.5" fill="#4A443C">American Sign Language</text>
    <text x="160" y="187" text-anchor="middle" font-size="9" fill="#8B6F4E">United States, parts of Canada</text>

    <text x="160" y="230" text-anchor="middle" font-size="10.5" fill="#4A443C">Country's spoken language: English (US)</text>

    <!-- connector: unrelated -->
    <line x1="260" y1="165" x2="470" y2="165" stroke="#8B6F4E" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="365" cy="165" r="12" fill="#FBF8F1" stroke="#8B6F4E" stroke-width="1.5"/>
    <text x="365" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#8B6F4E">&#215;</text>
    <text x="365" y="140" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8B6F4E">historically unrelated</text>
    <text x="365" y="196" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8B6F4E">not mutually intelligible</text>

    <!-- BANZSL -> BSL / Auslan / NZSL -->
    <rect x="470" y="50" width="260" height="50" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1"/>
    <text x="600" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">BANZSL family</text>
    <text x="600" y="88" text-anchor="middle" font-size="9.5" fill="#4A443C">British, Australian &amp; New Zealand Sign Language</text>

    <path d="M 540,100 L 540,128" stroke="#1F1B16" stroke-width="1.5"/>
    <path d="M 540,128 L 534,118 L 546,118 Z" fill="#1F1B16"/>
    <path d="M 600,100 L 600,128" stroke="#1F1B16" stroke-width="1.5"/>
    <path d="M 600,128 L 594,118 L 606,118 Z" fill="#1F1B16"/>
    <path d="M 720,100 L 720,128" stroke="#1F1B16" stroke-width="1.5"/>
    <path d="M 720,128 L 714,118 L 726,118 Z" fill="#1F1B16"/>

    <rect x="470" y="130" width="140" height="70" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1"/>
    <text x="540" y="155" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">BSL</text>
    <text x="540" y="172" text-anchor="middle" font-size="9" fill="#4A443C">British Sign Language</text>
    <text x="540" y="187" text-anchor="middle" font-size="9" fill="#8B6F4E">United Kingdom</text>

    <rect x="630" y="130" width="140" height="70" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1"/>
    <text x="700" y="155" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">Auslan</text>
    <text x="700" y="172" text-anchor="middle" font-size="9" fill="#4A443C">Australian Sign Language</text>
    <text x="700" y="187" text-anchor="middle" font-size="9" fill="#8B6F4E">Australia</text>

    <rect x="790" y="130" width="140" height="70" fill="#FBEDEA" stroke="#8B6F4E" stroke-width="1"/>
    <text x="860" y="155" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F1B16">NZSL</text>
    <text x="860" y="172" text-anchor="middle" font-size="9" fill="#4A443C">New Zealand Sign Language</text>
    <text x="860" y="187" text-anchor="middle" font-size="9" fill="#8B6F4E">New Zealand</text>

    <text x="700" y="230" text-anchor="middle" font-size="10.5" fill="#4A443C">Country's spoken language: English (UK, Australia, NZ)</text>

    <!-- synthesis -->
    <rect x="60" y="270" width="840" height="90" fill="#EDE7D8" stroke="#E3DCC9" stroke-width="1"/>
    <text x="480" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Same spoken language, unrelated sign languages</text>
    <text x="480" y="320" text-anchor="middle" font-size="10.5" fill="#4A443C">The US and UK are both predominantly English-speaking, but ASL descends from French Sign</text>
    <text x="480" y="337" text-anchor="middle" font-size="10.5" fill="#4A443C">Language while BSL belongs to the separate BANZSL family — sign languages have their own</text>
    <text x="480" y="354" text-anchor="middle" font-size="10.5" fill="#4A443C">lines of descent, independent of the spoken language used in the surrounding country.</text>
  </g>
</svg>
