<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compressionTitle">
  <title id="compressionTitle">Diagram showing a repetitive string of letters being rewritten as a shorter count-based code, illustrating how lossless compression removes redundancy instead of removing information</title>
  <rect width="640" height="340" fill="#FBF8F1"/>
  <text x="320" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">Compression finds and removes redundancy — no information is lost</text>

  <rect x="60" y="70" width="520" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="80" y="98" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Original (24 characters)</text>
  <text x="320" y="126" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#4A443C">AAAAAAAABBBBCCCCCCCCCCCC</text>

  <line x1="320" y1="140" x2="320" y2="175" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="340" y="162" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">find repeats, encode as (count, symbol)</text>

  <rect x="60" y="185" width="520" height="70" rx="10" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="80" y="213" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1F1B16">Compressed (9 characters)</text>
  <text x="320" y="241" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#4A443C">8A4B12C</text>

  <text x="320" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">Same information, ~2.7x smaller — decompressing "8A4B12C" rebuilds the exact original string</text>
  <text x="320" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">Real algorithms (like DEFLATE, used in ZIP) use smarter versions of this same idea</text>

  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/>
    </marker>
  </defs>
</svg>
