<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hdiPipelineTitle">
  <title id="hdiPipelineTitle">A three-stage flow diagram. Stage one shows three raw input boxes: life expectancy in years, expected years of schooling, and gross national income per capita in dollars. Stage two shows each of the three boxes being normalized to a 0 to 1 scale using fixed minimum and maximum goalposts. Stage three shows the three normalized scores being combined with a geometric mean formula into one final HDI score box</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <rect x="20" y="30" width="150" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="95" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Life expectancy (yrs)</text>
  <rect x="20" y="122" width="150" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="95" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Expected years</text>
  <text x="95" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">of schooling</text>
  <rect x="20" y="214" width="150" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="95" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">GNI per capita</text>
  <text x="95" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">($)</text>

  <text x="200" y="153" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="230" y="30" width="170" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="315" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Normalized to 0-1 scale</text>
  <rect x="230" y="122" width="170" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="315" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Normalized to 0-1 scale</text>
  <rect x="230" y="214" width="170" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="315" y="237" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Normalized to 0-1 scale</text>
  <text x="315" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">(fixed min/max goalposts)</text>

  <text x="440" y="153" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="470" y="100" width="150" height="105" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="545" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Geometric mean</text>
  <text x="545" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">of three scores</text>
  <text x="545" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A">= HDI score</text>

  <text x="400" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Three raw indicators, each normalized, combined into one composite score.</text>
</svg>
