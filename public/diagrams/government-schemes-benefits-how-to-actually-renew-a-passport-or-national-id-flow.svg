<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="passportRenewalTitle">
  <title id="passportRenewalTitle">Renewal process: check the expiration window, gather required documents, submit online or in person, then wait through processing before receiving the renewed document.</title>
  <rect width="560" height="320" fill="#FBF8F1"/>
  <rect x="20" y="60" width="120" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="80" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Check expiration</text>
  <text x="80" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">window</text>
  <text x="155" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">→</text>
  <rect x="170" y="60" width="120" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="230" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Gather required</text>
  <text x="230" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">documents</text>
  <text x="305" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">→</text>
  <rect x="320" y="60" width="120" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="380" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Submit</text>
  <text x="380" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">online or in person</text>
  <text x="455" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">→</text>
  <rect x="470" y="60" width="70" height="60" rx="6" fill="#2C4A3E"/>
  <text x="505" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Processing</text>
  <text x="505" y="102" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">wait period</text>
  <text x="280" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="160" y="175" width="240" height="50" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Renewed document received</text>
  <text x="280" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Expedited/rush processing often available for an added fee</text>
</svg>
