<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dstTitle">
  <title id="dstTitle">Two clock diagrams: the left one labeled Spring Forward shows a clock hand jumping from 2 AM directly to 3 AM, skipping an hour, and the right one labeled Fall Back shows a clock hand at 2 AM repeating back to 1 AM, adding an hour</title>
  <rect width="780" height="260" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Spring forward, fall back</text>

  <!-- Spring forward -->
  <text x="195" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Spring Forward (March)</text>
  <circle cx="195" cy="150" r="80" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="195" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">12</text>
  <text x="270" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">3</text>
  <line x1="195" y1="150" x2="195" y2="105" stroke="#B5493A" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="150" x2="255" y2="150" stroke="#B5493A" stroke-width="3" stroke-linecap="round"/>
  <path d="M 195 90 A 60 60 0 0 1 250 150" fill="none" stroke="#B5493A" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowF)"/>
  <text x="195" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">2:00 AM jumps straight to 3:00 AM</text>
  <text x="195" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(1 hour is skipped — you lose an hour of sleep)</text>

  <!-- Fall back -->
  <text x="585" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Fall Back (November)</text>
  <circle cx="585" cy="150" r="80" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="585" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">12</text>
  <text x="510" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">9</text>
  <line x1="585" y1="150" x2="585" y2="105" stroke="#2C4A3E" stroke-width="3" stroke-linecap="round"/>
  <line x1="585" y1="150" x2="525" y2="150" stroke="#2C4A3E" stroke-width="3" stroke-linecap="round"/>
  <path d="M 585 90 A 60 60 0 0 0 530 150" fill="none" stroke="#2C4A3E" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>
  <text x="585" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">2:00 AM repeats back to 1:00 AM</text>
  <text x="585" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(1 hour repeats — you gain an hour of sleep)</text>

  <defs>
    <marker id="arrowF" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/></marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/></marker>
  </defs>
</svg>
