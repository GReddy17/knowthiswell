<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fiveGroupsTitle">
  <title id="fiveGroupsTitle">Five labeled boxes arranged side by side, one for each USDA MyPlate food group — fruits, vegetables, grains, protein foods, and dairy — each box listing its typical nutrient specialization, illustrating that the five groups' nutrient contributions only partially overlap.</title>
  <rect width="800" height="260" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="15" y="50" width="145" height="150" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="87" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Fruits</text>
    <text x="87" y="105" text-anchor="middle" font-size="11" fill="#4A443C">Vitamin C</text>
    <text x="87" y="125" text-anchor="middle" font-size="11" fill="#4A443C">Fiber</text>
    <text x="87" y="145" text-anchor="middle" font-size="11" fill="#4A443C">Potassium</text>

    <rect x="170" y="50" width="145" height="150" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="242" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Vegetables</text>
    <text x="242" y="105" text-anchor="middle" font-size="11" fill="#4A443C">Vitamin A/K</text>
    <text x="242" y="125" text-anchor="middle" font-size="11" fill="#4A443C">Folate</text>
    <text x="242" y="145" text-anchor="middle" font-size="11" fill="#4A443C">Fiber</text>

    <rect x="325" y="50" width="145" height="150" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="397" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Grains</text>
    <text x="397" y="105" text-anchor="middle" font-size="11" fill="#4A443C">Carbohydrate</text>
    <text x="397" y="125" text-anchor="middle" font-size="11" fill="#4A443C">B vitamins</text>
    <text x="397" y="145" text-anchor="middle" font-size="11" fill="#4A443C">Fiber (whole grain)</text>

    <rect x="480" y="50" width="145" height="150" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="552" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Protein foods</text>
    <text x="552" y="105" text-anchor="middle" font-size="11" fill="#4A443C">Protein</text>
    <text x="552" y="125" text-anchor="middle" font-size="11" fill="#4A443C">Iron</text>
    <text x="552" y="145" text-anchor="middle" font-size="11" fill="#4A443C">B12 (animal src.)</text>

    <rect x="635" y="50" width="145" height="150" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="707" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Dairy</text>
    <text x="707" y="105" text-anchor="middle" font-size="11" fill="#4A443C">Calcium</text>
    <text x="707" y="125" text-anchor="middle" font-size="11" fill="#4A443C">Vitamin D*</text>
    <text x="707" y="145" text-anchor="middle" font-size="11" fill="#4A443C">Protein</text>
  </g>
  <text x="400" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">*when fortified — no single box's list duplicates another's</text>
</svg>
