<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spackleCaulkTitle">
  <title id="spackleCaulkTitle">A comparison of spackle filling a small drywall hole with a rigid patch that sands flush but can crack if the surrounding surface ever moves, versus caulk filling the flexible joint where a baseboard meets a wall, remaining pliable so it stretches instead of cracking as the joint moves.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Same-looking gap filler, two different jobs</text>

  <!-- LEFT: spackle in a hole -->
  <circle cx="200" cy="150" r="82" fill="#E8DEC8" stroke="#4A443C" stroke-width="2"/>
  <rect x="150" y="100" width="100" height="100" fill="#FBF8F1" stroke="#1F1B16" stroke-width="2"/>
  <circle cx="200" cy="150" r="26" fill="#8B6F4E"/>
  <line x1="182" y1="140" x2="218" y2="140" stroke="#4A443C" stroke-width="1"/>
  <line x1="180" y1="150" x2="220" y2="150" stroke="#4A443C" stroke-width="1"/>
  <line x1="182" y1="160" x2="218" y2="160" stroke="#4A443C" stroke-width="1"/>
  <text x="200" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Spackle</text>
  <text x="200" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Hardens rigid, sands flush &#8212;</text>
  <text x="200" y="281" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">cracks if the joint ever moves</text>

  <!-- RIGHT: caulk at a moving joint -->
  <circle cx="580" cy="150" r="82" fill="#E8DEC8" stroke="#4A443C" stroke-width="2"/>
  <rect x="540" y="90" width="18" height="90" fill="#4A443C"/>
  <rect x="540" y="180" width="120" height="18" fill="#4A443C"/>
  <path d="M558,180 Q575,180 575,163 Q575,178 558,178 Z" fill="#2C4A3E"/>
  <path d="M540,180 Q551,180 558,163 Q555,175 540,178 Z" fill="#2C4A3E"/>
  <text x="580" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Caulk</text>
  <text x="580" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Stays flexible &#8212; stretches</text>
  <text x="580" y="281" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">with movement, won&#8217;t sand smooth</text>

  <text x="390" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="1" fill="none"> </text>
</svg>
