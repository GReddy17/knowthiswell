<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="paymentChainTitle">
  <title id="paymentChainTitle">A sequence diagram showing a card detail entered at a merchant's checkout, encrypted and sent to a payment processor, forwarded through a card network to the customer's issuing bank, which approves or declines the charge, with that response relayed back through the same chain to the merchant in reverse.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <defs>
    <marker id="arrowPay" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowPayBack" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="20" y="60" width="130" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Customer</text>
  <text x="85" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">enters card at checkout</text>

  <rect x="185" y="60" width="130" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="250" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Merchant site</text>
  <text x="250" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">never stores the raw number</text>

  <rect x="350" y="60" width="140" height="50" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="420" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Payment processor</text>
  <text x="420" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">encrypts and routes request</text>

  <rect x="530" y="60" width="120" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="590" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Card network</text>
  <text x="590" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">directs to the right bank</text>

  <rect x="680" y="60" width="100" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="730" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Issuing bank</text>
  <text x="730" y="97" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">approves or declines</text>

  <path d="M150,85 L183,85" fill="none" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrowPay)"/>
  <path d="M315,80 L348,80" fill="none" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrowPay)"/>
  <path d="M490,75 L528,75" fill="none" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrowPay)"/>
  <path d="M650,75 L678,75" fill="none" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrowPay)"/>

  <path d="M680,105 L650,120" fill="none" stroke="#2C4A3E" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowPayBack)"/>
  <path d="M530,120 L490,105" fill="none" stroke="#2C4A3E" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowPayBack)"/>
  <path d="M350,105 L315,120" fill="none" stroke="#2C4A3E" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowPayBack)"/>
  <path d="M185,120 L150,105" fill="none" stroke="#2C4A3E" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowPayBack)"/>

  <rect x="200" y="160" width="420" height="46" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="410" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Approve/decline response relayed back through the same chain</text>
  <text x="410" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">the whole round trip typically completes in a second or two</text>

  <text x="400" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">The merchant never sees a decision on its own — it is only ever relaying one.</text>
</svg>
