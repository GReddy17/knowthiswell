<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bluetoothTitle">
  <title id="bluetoothTitle">Diagram of two paired Bluetooth devices communicating over the 2.4GHz band, hopping between many channels roughly a thousand times a second to avoid interference from WiFi and other radios</title>
  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- two devices -->
  <rect x="50" y="170" width="90" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="95" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Phone</text>

  <rect x="500" y="170" width="90" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="545" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Earbuds</text>

  <!-- channel lanes -->
  <text x="320" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">2.4 GHz band split into ~79 channels</text>
  <g stroke="#E3DCC9" stroke-width="1">
    <line x1="150" y1="70" x2="500" y2="70"/>
    <line x1="150" y1="100" x2="500" y2="100"/>
    <line x1="150" y1="130" x2="500" y2="130"/>
    <line x1="150" y1="270" x2="500" y2="270"/>
    <line x1="150" y1="300" x2="500" y2="300"/>
    <line x1="150" y1="330" x2="500" y2="330"/>
  </g>

  <!-- hop path, zigzagging across lanes -->
  <path d="M 150,130 L 220,300 L 290,70 L 360,270 L 430,100 L 500,200" fill="none" stroke="#C9412C" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g fill="#C9412C">
    <circle cx="150" cy="130" r="4"/>
    <circle cx="220" cy="300" r="4"/>
    <circle cx="290" cy="70" r="4"/>
    <circle cx="360" cy="270" r="4"/>
    <circle cx="430" cy="100" r="4"/>
  </g>
  <text x="320" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Both devices hop to a new channel together, ~1,600 times per second</text>
  <text x="320" y="382" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">so a busy or noisy channel is only ever used for a fraction of a millisecond</text>

  <!-- interference marker -->
  <g transform="translate(280,130)">
    <path d="M0,-14 L4,-2 L16,-2 L6,6 L10,18 L0,10 L-10,18 L-6,6 L-16,-2 L-4,-2 Z" fill="#8B6F4E" opacity="0.7"/>
  </g>
  <text x="280" y="165" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">WiFi noise on this channel — skipped past quickly</text>
</svg>
