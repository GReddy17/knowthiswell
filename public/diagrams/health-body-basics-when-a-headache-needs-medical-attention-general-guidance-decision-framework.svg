<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Headache decision framework: starting from headache present, any warning sign (sudden severe onset, neurological symptoms, fever with stiff neck, headache after head injury, new pattern after age 50) leads to seek medical care; none present with a familiar pattern leads to a typical primary headache, handled with general self-care and monitoring per usual guidance.</title>
  <rect width="680" height="310" fill="#FBF8F1"/>
  <rect x="20" y="125" width="115" height="60" rx="6" fill="#2C4A3E"/>
  <text x="77" y="151" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Headache</text>
  <text x="77" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">present</text>
  <path d="M135 145 L160 90" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M135 165 L160 225" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="165" y="20" width="250" height="150" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="290" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Any warning sign present</text>
  <text x="290" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Sudden severe onset</text>
  <text x="290" y="89" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Neurological symptoms</text>
  <text x="290" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Fever with stiff neck</text>
  <text x="290" y="127" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Headache after head injury</text>
  <text x="290" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">New pattern after age 50</text>
  <path d="M415 95 L463 95" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="470" y="65" width="190" height="60" rx="6" fill="#C9412C"/>
  <text x="565" y="101" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">Seek medical care</text>
  <rect x="165" y="200" width="250" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="290" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">None of these present,</text>
  <text x="290" y="243" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">familiar pattern</text>
  <path d="M415 230 L463 230" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="470" y="195" width="190" height="70" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="565" y="219" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Typical primary headache</text>
  <text x="565" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">General self-care and</text>
  <text x="565" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">monitoring, per usual guidance</text>
  <text x="340" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">Informational orientation, not a diagnosis</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F1B16"/></marker></defs>
</svg>
