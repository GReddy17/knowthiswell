<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of Old English, Middle English, Early Modern English, and Modern English periods</title>
  <rect width="680" height="220" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="30" y="110" width="150" height="40" fill="#EEF3EE"/>
    <text x="105" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Old English</text>
    <text x="105" y="170" text-anchor="middle" font-size="11" fill="#8B6F4E">c. 450-1150</text>
    <text x="105" y="135" text-anchor="middle" font-size="9" fill="#4A443C">Anglo-Saxon settlement,</text>
    <text x="105" y="146" text-anchor="middle" font-size="9" fill="#4A443C">Viking contact</text>

    <rect x="180" y="110" width="160" height="40" fill="#FBEDEA"/>
    <text x="260" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Middle English</text>
    <text x="260" y="170" text-anchor="middle" font-size="11" fill="#8B6F4E">1150-1500</text>
    <text x="260" y="135" text-anchor="middle" font-size="9" fill="#4A443C">Norman Conquest (1066),</text>
    <text x="260" y="146" text-anchor="middle" font-size="9" fill="#4A443C">French vocabulary influx</text>

    <rect x="340" y="110" width="160" height="40" fill="#EDE7D8"/>
    <text x="420" y="95" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F1B16">Early Modern English</text>
    <text x="420" y="170" text-anchor="middle" font-size="11" fill="#8B6F4E">1500-1700</text>
    <text x="420" y="135" text-anchor="middle" font-size="9" fill="#4A443C">Printing press,</text>
    <text x="420" y="146" text-anchor="middle" font-size="9" fill="#4A443C">Great Vowel Shift</text>

    <rect x="500" y="110" width="150" height="40" fill="#E4ECF3"/>
    <text x="575" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1B16">Modern English</text>
    <text x="575" y="170" text-anchor="middle" font-size="11" fill="#8B6F4E">1700-today</text>
    <text x="575" y="135" text-anchor="middle" font-size="9" fill="#4A443C">Colonial expansion,</text>
    <text x="575" y="146" text-anchor="middle" font-size="9" fill="#4A443C">global borrowing</text>
  </g>
  <rect x="30" y="110" width="620" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="180" y1="110" x2="180" y2="150" stroke="#1F1B16"/>
  <line x1="340" y1="110" x2="340" y2="150" stroke="#1F1B16"/>
  <line x1="500" y1="110" x2="500" y2="150" stroke="#1F1B16"/>
</svg>
