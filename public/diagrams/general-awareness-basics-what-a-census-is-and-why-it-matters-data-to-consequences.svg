<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="censusFlowTitle">
  <title id="censusFlowTitle">A flow diagram starting with a box labeled "Census Count" branching into two downstream boxes: "Legislative Apportionment (seats per region)" and "Public Funding Formulas (dollars per capita)", each leading to a final box labeled "Real Political and Financial Consequences"</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <!-- Census count box -->
  <rect x="300" y="20" width="180" height="70" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Census Count</text>

  <!-- branch lines -->
  <line x1="390" y1="90" x2="180" y2="150" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="390" y1="90" x2="600" y2="150" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <!-- left box -->
  <rect x="60" y="150" width="240" height="80" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="180" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Legislative Apportionment</text>
  <text x="180" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">(seats per region)</text>

  <!-- right box -->
  <rect x="480" y="150" width="240" height="80" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Public Funding Formulas</text>
  <text x="600" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">(dollars per capita)</text>

  <!-- converge to final box -->
  <line x1="180" y1="230" x2="360" y2="270" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="600" y1="230" x2="420" y2="270" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#arrow2)"/>

  <rect x="230" y="270" width="320" height="40" rx="8" fill="#EDE7D8" stroke="#B5493A" stroke-width="2.5"/>
  <text x="390" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A">Real Political and Financial Consequences</text>
</svg>
