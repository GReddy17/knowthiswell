<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cutBurnTitle">
  <title id="cutBurnTitle">Two parallel sequences shown side by side: for a minor cut, apply direct pressure to stop bleeding, then clean with water, then cover with a bandage; for a minor burn, cool under running water for about ten minutes, then leave uncovered or cover loosely, with ice explicitly crossed out as an incorrect step</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <text x="30" y="35" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Minor cut</text>
  <rect x="30" y="50" width="150" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="105" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Direct pressure</text>
  <text x="195" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">→</text>
  <rect x="210" y="50" width="150" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="285" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Clean with water</text>
  <text x="375" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">→</text>
  <rect x="390" y="50" width="150" height="60" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="465" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Cover with bandage</text>

  <text x="30" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Minor burn</text>
  <rect x="30" y="165" width="180" height="60" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">Cool running water</text>
  <text x="120" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">~10 minutes</text>
  <text x="225" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A443C">→</text>
  <rect x="240" y="165" width="180" height="60" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="330" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Cover loosely / leave open</text>

  <rect x="460" y="165" width="150" height="60" rx="8" fill="#FBF8F1" stroke="#B5493A" stroke-width="2"/>
  <line x1="475" y1="180" x2="595" y2="210" stroke="#B5493A" stroke-width="2.5"/>
  <line x1="595" y1="180" x2="475" y2="210" stroke="#B5493A" stroke-width="2.5"/>
  <text x="535" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Never: direct ice</text>
</svg>
