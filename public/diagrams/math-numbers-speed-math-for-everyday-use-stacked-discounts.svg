<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stackedDiscountsTitle">
  <title id="stackedDiscountsTitle">Bar diagram showing an $80 original price as a full-length bar, shortened first by a 25% discount to 75%, then by a further 10% discount to a final 67.5%, contrasted against an incorrect dashed marker at 65% showing where naively adding the two percentages would have landed</title>
  <rect width="640" height="340" fill="#FBF8F1"/>

  <!-- reference lines: correct 67.5% (solid) and naive-add 65% (dashed) -->
  <line x1="414.5" y1="55" x2="414.5" y2="290" stroke="#2C4A3E" stroke-width="1.5"/>
  <line x1="401" y1="55" x2="401" y2="290" stroke="#B5502E" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Row 1: original price, 100% -->
  <text x="50" y="52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Original price</text>
  <rect x="50" y="60" width="540" height="34" rx="4" fill="#EDE7D8" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1F1B16">$80 (100%)</text>

  <!-- Row 2: after 25% off -->
  <text x="50" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">After 25% off</text>
  <rect x="50" y="140" width="540" height="34" rx="4" fill="#F6F0E8" stroke="#E3DCC9" stroke-width="1.5"/>
  <rect x="50" y="140" width="405" height="34" rx="4" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <rect x="455" y="140" width="135" height="34" fill="#F1DCD3" stroke="#B5502E" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="252" y="162" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1F1B16">$60 (75%)</text>
  <text x="522" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#B5502E">−25%</text>
  <text x="522" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8B6F4E">$20</text>

  <!-- Row 3: after additional 10% off -->
  <text x="50" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">After additional 10% off (final)</text>
  <rect x="50" y="220" width="540" height="34" rx="4" fill="#F6F0E8" stroke="#E3DCC9" stroke-width="1.5"/>
  <rect x="455" y="220" width="135" height="34" fill="#F1DCD3" opacity="0.5"/>
  <rect x="50" y="220" width="364.5" height="34" rx="4" fill="#2C4A3E"/>
  <rect x="364.5" y="220" width="50" height="34" fill="#E3B7A3" stroke="#B5502E" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="207" y="242" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#FBF8F1">$54 (67.5%)</text>
  <text x="389" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#7A3A22">−10%</text>
  <text x="389" y="251" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#7A3A22">$6</text>

  <!-- callouts for the two reference lines -->
  <text x="419" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2C4A3E">Correct: 67.5%</text>
  <text x="401" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#B5502E">Naive 35% off → 65% ($52)</text>

  <!-- baseline scale -->
  <line x1="50" y1="288" x2="590" y2="288" stroke="#4A443C" stroke-width="1"/>
  <line x1="50" y1="284" x2="50" y2="292" stroke="#4A443C" stroke-width="1"/>
  <line x1="590" y1="284" x2="590" y2="292" stroke="#4A443C" stroke-width="1"/>
  <text x="50" y="304" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">0%</text>
  <text x="590" y="304" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#8B6F4E">100%</text>
</svg>
