<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="640" height="260" fill="#FBF8F1"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1B16">Landlord obligations across the tenancy</text>

  <g>
    <rect x="30" y="60" width="180" height="130" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="120" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">Advertising &amp;</text>
    <text x="120" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">Screening</text>
    <text x="120" y="130" text-anchor="middle" font-size="10" fill="#4A443C">Fair housing law</text>
    <text x="120" y="146" text-anchor="middle" font-size="10" fill="#4A443C">applies from</text>
    <text x="120" y="162" text-anchor="middle" font-size="10" fill="#4A443C">the first ad</text>
  </g>

  <path d="M210 125 L248 125" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="248" y="60" width="180" height="130" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="338" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">During Tenancy</text>
    <text x="338" y="115" text-anchor="middle" font-size="10" fill="#4A443C">Habitability</text>
    <text x="338" y="131" text-anchor="middle" font-size="10" fill="#4A443C">maintenance</text>
    <text x="338" y="155" text-anchor="middle" font-size="10" fill="#4A443C">Notice before</text>
    <text x="338" y="171" text-anchor="middle" font-size="10" fill="#4A443C">non-emergency entry</text>
  </g>

  <path d="M428 125 L466 125" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="466" y="60" width="150" height="130" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
    <text x="541" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">If Ending</text>
    <text x="541" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F1B16">Tenancy</text>
    <text x="541" y="130" text-anchor="middle" font-size="10" fill="#B5493A">Formal notice</text>
    <text x="541" y="146" text-anchor="middle" font-size="10" fill="#B5493A">+ court process</text>
    <text x="541" y="162" text-anchor="middle" font-size="10" fill="#B5493A">required</text>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="320" y="225" text-anchor="middle" font-size="11" fill="#4A443C">None of these are one-time obligations — each applies continuously across its stage</text>
</svg>
