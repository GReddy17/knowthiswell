<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="circleAnatomyTitle">
  <title id="circleAnatomyTitle">A single circle diagram with the radius drawn as a line from the center to the edge and labeled r, the diameter drawn as a full line through the center from edge to edge and labeled 2r, and the circumference marked as a highlighted curved outline around the entire circle labeled with the formula 2 pi r, showing how all three measurements relate on one shape</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- circumference (highlighted outline) -->
  <circle cx="320" cy="215" r="140" fill="#FBF8F1" stroke="#C9412C" stroke-width="5"/>
  <text x="320" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#C9412C">circumference = 2&#960;r</text>
  <path d="M 320,60 Q 380,68 430,95" fill="none" stroke="#C9412C" stroke-width="1.2" marker-end="none"/>
  <path d="M 430,95 L 421,90 L 425,99 Z" fill="#C9412C"/>

  <!-- diameter -->
  <line x1="180" y1="215" x2="460" y2="215" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="180" y1="207" x2="180" y2="223" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="460" y1="207" x2="460" y2="223" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#20362D">diameter = 2r</text>

  <!-- radius -->
  <line x1="320" y1="215" x2="320" y2="75" stroke="#1F1B16" stroke-width="2.5"/>
  <text x="332" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">r</text>

  <!-- center -->
  <circle cx="320" cy="215" r="4" fill="#1F1B16"/>
  <text x="330" y="207" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">center</text>

  <text x="320" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">radius (r) is half the diameter (2r) &#8212; circumference is the full distance around</text>
</svg>
