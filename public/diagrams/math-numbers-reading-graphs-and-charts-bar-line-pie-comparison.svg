<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chartsTitle">
<title id="chartsTitle">Three side-by-side chart panels: a bar chart with rectangular bars of varying height compared against a shared vertical axis starting at zero, a line chart with points connected across a horizontal time axis showing a rising-then-falling trend, and a pie chart divided into labeled slices of varying angle that together sum to 100 percent.</title>
<rect width="900" height="400" fill="#FBF8F1"/>
<rect x="20" y="55" width="280" height="300" rx="12" fill="#EDE7D8" stroke="#E3DCC9" stroke-width="1.5"/>
<text x="160.0" y="77" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#20362D">Bar chart — quarterly revenue</text>
<rect x="320" y="55" width="280" height="300" rx="12" fill="#EDE7D8" stroke="#E3DCC9" stroke-width="1.5"/>
<text x="460.0" y="77" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#20362D">Line chart — monthly electricity bill</text>
<rect x="620" y="55" width="280" height="300" rx="12" fill="#EDE7D8" stroke="#E3DCC9" stroke-width="1.5"/>
<text x="760.0" y="77" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#20362D">Pie chart — household budget</text>
