<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="angleTypesTitle">
  <title id="angleTypesTitle">Top row shows five angle types in order of increasing measure: acute, right, obtuse, straight, and reflex, each with its degree range labeled. Bottom row shows a transversal line crossing two parallel lines, with corresponding angles, alternate interior angles, and co-interior angles each marked in a different color and labeled with their relationship</title>
  <rect width="640" height="460" fill="#FBF8F1"/>

  <text x="20" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Five angle types</text>

  <!-- Acute -->
  <line x1="80" y1="130" x2="120" y2="130" stroke="#1F1B16" stroke-width="2"/>
  <line x1="80" y1="130" x2="105.7" y2="99.4" stroke="#1F1B16" stroke-width="2"/>
  <path d="M 104,130 Q 107.2,117.3 95.4,111.6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="80" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Acute</text>
  <text x="80" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">0&#176;&#8211;90&#176;</text>

  <!-- Right -->
  <line x1="190" y1="130" x2="230" y2="130" stroke="#1F1B16" stroke-width="2"/>
  <line x1="190" y1="130" x2="190" y2="90" stroke="#1F1B16" stroke-width="2"/>
  <path d="M 204,130 L 204,116 L 190,116" fill="none" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="190" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Right</text>
  <text x="190" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">= 90&#176;</text>

  <!-- Obtuse -->
  <line x1="300" y1="130" x2="340" y2="130" stroke="#1F1B16" stroke-width="2"/>
  <line x1="300" y1="130" x2="274.3" y2="99.4" stroke="#1F1B16" stroke-width="2"/>
  <path d="M 324,130 Q 313.2,101.7 284.6,111.6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="300" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Obtuse</text>
  <text x="300" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">90&#176;&#8211;180&#176;</text>

  <!-- Straight -->
  <line x1="370" y1="130" x2="450" y2="130" stroke="#1F1B16" stroke-width="2"/>
  <path d="M 434,130 Q 410,98.8 386,130" fill="none" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="410" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Straight</text>
  <text x="410" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">= 180&#176;</text>

  <!-- Reflex -->
  <line x1="520" y1="110" x2="533.7" y2="147.6" stroke="#1F1B16" stroke-width="2"/>
  <line x1="520" y1="110" x2="506.3" y2="147.6" stroke="#1F1B16" stroke-width="2"/>
  <path d="M 508.4,141.9 A 34,34 0 1,1 531.6,141.9" fill="none" stroke="#C9412C" stroke-width="2.5"/>
  <path d="M 531.6,141.9 L 522.5,138.5 L 526.5,147.5 Z" fill="#C9412C"/>
  <text x="520" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Reflex</text>
  <text x="520" y="194" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">180&#176;&#8211;360&#176;</text>

  <line x1="20" y1="216" x2="620" y2="216" stroke="#E3DCC9" stroke-width="1.5"/>
  <text x="20" y="238" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Parallel lines cut by a transversal</text>

  <!-- parallel lines -->
  <line x1="60" y1="260" x2="580" y2="260" stroke="#1F1B16" stroke-width="1.8"/>
  <line x1="60" y1="380" x2="580" y2="380" stroke="#1F1B16" stroke-width="1.8"/>
  <path d="M 580,260 L 570,256 L 570,264 Z" fill="#1F1B16"/>
  <path d="M 580,380 L 570,376 L 570,384 Z" fill="#1F1B16"/>
  <text x="590" y="264" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">line 1</text>
  <text x="590" y="384" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">line 2</text>

  <!-- transversal -->
  <line x1="119" y1="213" x2="521" y2="427" stroke="#1F1B16" stroke-width="1.8"/>

  <!-- wedges at intersection 1 (207,260) -->
  <path d="M 237,260 Q 238,268 233.5,274 L 207,260 Z" fill="#3B6E8F" fill-opacity="0.55" stroke="#3B6E8F" stroke-width="1"/>
  <path d="M 233.5,274 Q 197.6,297.8 177,260 L 207,260 Z" fill="#C9412C" fill-opacity="0.45" stroke="#C9412C" stroke-width="1"/>
  <path d="M 177,260 Q 175,252.1 180.5,246 L 207,260 Z" fill="#E3DCC9" fill-opacity="0.5" stroke="#8B6F4E" stroke-width="1"/>
  <path d="M 180.5,246 Q 216.4,222.2 237,260 L 207,260 Z" fill="#E3DCC9" fill-opacity="0.5" stroke="#8B6F4E" stroke-width="1"/>
  <text x="220" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">1</text>
  <text x="196" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">2</text>
  <text x="192" y="252" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">3</text>
  <text x="212" y="240" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">4</text>

  <!-- wedges at intersection 2 (433,380) -->
  <path d="M 463,380 Q 464,388 457.5,394 L 433,380 Z" fill="#3B6E8F" fill-opacity="0.55" stroke="#3B6E8F" stroke-width="1"/>
  <path d="M 457.5,394 Q 423.6,417.8 403,380 L 433,380 Z" fill="#E3DCC9" fill-opacity="0.5" stroke="#8B6F4E" stroke-width="1"/>
  <path d="M 403,380 Q 401,372.1 406.5,366 L 433,380 Z" fill="#E3DCC9" fill-opacity="0.5" stroke="#8B6F4E" stroke-width="1"/>
  <path d="M 406.5,366 Q 442.4,342.2 463,380 L 433,380 Z" fill="#C9412C" fill-opacity="0.45" stroke="#C9412C" stroke-width="1"/>
  <text x="446" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">5</text>
  <text x="422" y="404" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">6</text>
  <text x="418" y="372" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">7</text>
  <text x="438" y="358" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">8</text>

  <!-- co-interior connector (links wedge 1 and wedge 8) -->
  <path d="M 225.8,264.7 Q 330,300 434.2,375.3" fill="none" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- legend -->
  <rect x="20" y="425" width="14" height="14" fill="#3B6E8F" fill-opacity="0.55" stroke="#3B6E8F"/>
  <text x="40" y="436" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">&#8736;1 &amp; &#8736;5 corresponding &#8212; equal</text>

  <rect x="255" y="425" width="14" height="14" fill="#C9412C" fill-opacity="0.45" stroke="#C9412C"/>
  <text x="275" y="436" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">&#8736;2 &amp; &#8736;8 alternate interior &#8212; equal</text>

  <line x1="465" y1="432" x2="479" y2="432" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="485" y="436" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">&#8736;1 &amp; &#8736;8 co-interior &#8212; sum to 180&#176;</text>
</svg>
