<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mythVsRealityTitle">
  <title id="mythVsRealityTitle">A comparison diagram with three rows. Row one: myth, a verbal agreement isn't a real contract, versus reality, many verbal agreements can be legally binding though hard to prove. Row two: myth, a notary certifies a document's contents are true, versus reality, a notary only certifies the signer's identity and willingness. Row three: myth, dying without a will means the government takes everything, versus reality, default succession laws generally distribute the estate to close relatives first.</title>
  <rect width="700" height="380" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="185" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#B5493A">MYTH</text>
    <text x="515" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4A3E">REALITY</text>

    <!-- row 1 -->
    <rect x="30" y="48" width="310" height="72" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="185" y="78" text-anchor="middle" font-size="11.5" fill="#1F1B16">"A verbal agreement</text>
    <text x="185" y="96" text-anchor="middle" font-size="11.5" fill="#1F1B16">isn't a real contract."</text>

    <rect x="360" y="48" width="310" height="72" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="515" y="72" text-anchor="middle" font-size="11.5" fill="#1F1B16">Many verbal agreements can</text>
    <text x="515" y="90" text-anchor="middle" font-size="11.5" fill="#1F1B16">be legally binding — just hard</text>
    <text x="515" y="106" text-anchor="middle" font-size="11.5" fill="#1F1B16">to prove without a record.</text>

    <!-- row 2 -->
    <rect x="30" y="140" width="310" height="72" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="185" y="170" text-anchor="middle" font-size="11.5" fill="#1F1B16">"A notary certifies a</text>
    <text x="185" y="188" text-anchor="middle" font-size="11.5" fill="#1F1B16">document's contents are true."</text>

    <rect x="360" y="140" width="310" height="72" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="515" y="164" text-anchor="middle" font-size="11.5" fill="#1F1B16">A notary only certifies the</text>
    <text x="515" y="182" text-anchor="middle" font-size="11.5" fill="#1F1B16">signer's identity and that they</text>
    <text x="515" y="198" text-anchor="middle" font-size="11.5" fill="#1F1B16">signed willingly.</text>

    <!-- row 3 -->
    <rect x="30" y="232" width="310" height="80" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="185" y="260" text-anchor="middle" font-size="11.5" fill="#1F1B16">"Dying without a will means</text>
    <text x="185" y="278" text-anchor="middle" font-size="11.5" fill="#1F1B16">the government takes</text>
    <text x="185" y="296" text-anchor="middle" font-size="11.5" fill="#1F1B16">everything."</text>

    <rect x="360" y="232" width="310" height="80" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="515" y="260" text-anchor="middle" font-size="11.5" fill="#1F1B16">Default succession laws</text>
    <text x="515" y="278" text-anchor="middle" font-size="11.5" fill="#1F1B16">generally distribute the estate</text>
    <text x="515" y="296" text-anchor="middle" font-size="11.5" fill="#1F1B16">to close relatives first.</text>

    <text x="350" y="345" text-anchor="middle" font-size="12" fill="#4A443C">In each case, legal effect depends on the document's substance and governing law —</text>
    <text x="350" y="362" text-anchor="middle" font-size="12" fill="#4A443C">not on how formal or official it looks.</text>
  </g>
</svg>
