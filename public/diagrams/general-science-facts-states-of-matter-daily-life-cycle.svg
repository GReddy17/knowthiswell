<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="statesCycleTitle">
  <title id="statesCycleTitle">Triangle diagram of solid, liquid, and gas water with labeled arrows for melting, freezing, evaporation, condensation, sublimation, and deposition, including a direct arrow between solid and gas that bypasses liquid</title>

  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- Solid <-> Liquid -->
  <line x1="215" y1="98" x2="425" y2="98" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowHead)"/>
  <line x1="425" y1="122" x2="215" y2="122" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowHead)"/>
  <text x="320" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2C4A3E">Melting</text>
  <text x="320" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Freezing</text>

  <!-- Liquid <-> Gas -->
  <line x1="441" y1="149" x2="345" y2="280" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowHead)"/>
  <line x1="360" y1="291" x2="455" y2="160" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowHead)"/>
  <text x="450" y="220" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2C4A3E">Evaporation</text>
  <text x="350" y="255" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Condensation</text>

  <!-- Solid <-> Gas (direct, bypassing liquid) -->
  <line x1="185" y1="160" x2="280" y2="291" stroke="#8B6F4E" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <line x1="295" y1="280" x2="200" y2="149" stroke="#8B6F4E" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <text x="175" y="220" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8B6F4E">Sublimation</text>
  <text x="205" y="250" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8B6F4E">Deposition</text>

  <!-- Solid node -->
  <circle cx="160" cy="110" r="55" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <g stroke="#2C4A3E" stroke-width="1.3" fill="none">
    <path d="M 138 92 h 44 M 138 102 h 44 M 138 112 h 44 M 138 122 h 44"/>
    <path d="M 142 88 v 40 M 152 88 v 40 M 162 88 v 40 M 172 88 v 40"/>
  </g>
  <text x="160" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F1B16">SOLID</text>

  <!-- Liquid node -->
  <circle cx="480" cy="110" r="55" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <g stroke="#C9412C" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M 456 96 q 8 -9 16 0 q 8 9 16 0 q 8 -9 16 0"/>
    <path d="M 456 112 q 8 -9 16 0 q 8 9 16 0 q 8 -9 16 0"/>
  </g>
  <text x="480" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F1B16">LIQUID</text>

  <!-- Gas node -->
  <circle cx="320" cy="330" r="55" fill="#EDE7D8" stroke="#8B6F4E" stroke-width="1.5"/>
  <g fill="#8B6F4E">
    <circle cx="298" cy="312" r="3"/>
    <circle cx="330" cy="305" r="2.5"/>
    <circle cx="342" cy="322" r="3.2"/>
    <circle cx="305" cy="332" r="2.6"/>
    <circle cx="336" cy="340" r="2.8"/>
    <circle cx="308" cy="318" r="2"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F1B16">GAS</text>
</svg>
