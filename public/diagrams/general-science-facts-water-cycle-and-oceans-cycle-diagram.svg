<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waterCycleTitle">
  <title id="waterCycleTitle">Water cycle diagram with the ocean on one side and mountains and land on the other, showing evaporation rising from the ocean, transpiration rising from plants, condensation forming clouds, precipitation falling onto the mountains, surface runoff flowing through rivers back to the ocean, and infiltration carrying water underground as groundwater that also flows back to the ocean</title>

  <defs>
    <marker id="ah5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A443C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- underground cross-section -->
  <rect x="220" y="320" width="420" height="100" fill="#EDE7D8"/>
  <path d="M 220 372 Q 320 364 420 373 T 640 370" fill="none" stroke="#5B7C99" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="560" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Water table (groundwater)</text>

  <!-- ocean -->
  <path d="M 0 262 Q 60 250 120 262 T 230 262 L 230 420 L 0 420 Z" fill="#5B7C99"/>
  <g stroke="#FBF8F1" stroke-width="1.4" opacity="0.5" fill="none">
    <path d="M 20 300 q 15 -8 30 0 t 30 0"/>
    <path d="M 20 330 q 15 -8 30 0 t 30 0"/>
    <path d="M 20 360 q 15 -8 30 0 t 30 0"/>
  </g>
  <text x="105" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Ocean</text>

  <!-- mountains -->
  <path d="M 260 320 L 340 160 L 420 320 Z" fill="#8B6F4E" opacity="0.7"/>
  <path d="M 360 320 L 445 180 L 530 320 Z" fill="#8B6F4E" opacity="0.55"/>
  <path d="M 325 195 L 340 160 L 355 195 Z" fill="#FBF8F1"/>
  <path d="M 428 210 L 445 180 L 462 210 Z" fill="#FBF8F1"/>

  <!-- tree -->
  <rect x="527" y="280" width="6" height="22" fill="#8B6F4E"/>
  <circle cx="530" cy="272" r="16" fill="#2C4A3E"/>

  <!-- clouds -->
  <g fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1">
    <ellipse cx="300" cy="112" rx="34" ry="18"/>
    <ellipse cx="330" cy="100" rx="26" ry="15"/>
    <ellipse cx="420" cy="100" rx="34" ry="18"/>
    <ellipse cx="448" cy="90" rx="24" ry="14"/>
  </g>
  <text x="365" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Condensation</text>

  <!-- evaporation -->
  <path d="M 140 275 C 130 220, 200 180, 280 135" fill="none" stroke="#5B7C99" stroke-width="2" marker-end="url(#ah5)"/>
  <text x="118" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C" transform="rotate(-58 118 215)">Evaporation</text>

  <!-- transpiration -->
  <path d="M 528 268 C 500 210, 460 160, 435 128" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#ah5)"/>
  <text x="500" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C" transform="rotate(56 500 195)">Transpiration</text>

  <!-- precipitation -->
  <g stroke="#5B7C99" stroke-width="1.6" stroke-linecap="round">
    <line x1="310" y1="135" x2="300" y2="155" marker-end="url(#ah5)"/>
    <line x1="335" y1="140" x2="328" y2="160" marker-end="url(#ah5)"/>
    <line x1="430" y1="120" x2="422" y2="140" marker-end="url(#ah5)"/>
    <line x1="452" y1="128" x2="446" y2="148" marker-end="url(#ah5)"/>
  </g>
  <text x="373" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Precipitation</text>

  <!-- surface runoff -->
  <path d="M 350 300 Q 300 320 260 328 Q 235 333 225 345" fill="none" stroke="#5B7C99" stroke-width="2.4" marker-end="url(#ah5)"/>
  <text x="290" y="313" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Surface runoff</text>

  <!-- infiltration -->
  <g stroke="#8B6F4E" stroke-width="1.6">
    <line x1="470" y1="302" x2="470" y2="322" marker-end="url(#ah5)"/>
    <line x1="500" y1="302" x2="500" y2="322" marker-end="url(#ah5)"/>
  </g>
  <text x="485" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Infiltration</text>

  <!-- groundwater flow to ocean -->
  <path d="M 480 385 Q 380 400 260 390 L 232 384" fill="none" stroke="#5B7C99" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ah5)"/>
  <text x="370" y="405" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Groundwater flows back to the ocean</text>
</svg>
