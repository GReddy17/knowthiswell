<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="noteMethodsTitle">
  <title id="noteMethodsTitle">A three-panel comparison diagram: the first panel shows a Cornell layout with a wide notes column, a narrow cue column, and a summary strip at the bottom; the second panel shows an outline with nested, indented bullet points; the third panel shows a mind map with a central circle and branching, connected nodes radiating outward, illustrating the three different structures each note-taking method imposes on the same underlying information.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="130" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Cornell</text>
  <rect x="30" y="40" width="200" height="190" fill="none" stroke="#4A443C" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="90" y2="230" stroke="#4A443C" stroke-width="1"/>
  <text x="60" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#8B6F4E">cues</text>
  <text x="160" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">notes</text>
  <rect x="30" y="230" width="200" height="35" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="130" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C4A3E">summary</text>

  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Outline</text>
  <rect x="290" y="40" width="200" height="190" fill="none" stroke="#4A443C" stroke-width="1.5"/>
  <text x="305" y="65" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">• Main idea</text>
  <text x="320" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">– Sub-point</text>
  <text x="335" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">· detail</text>
  <text x="320" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">– Sub-point</text>
  <text x="305" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">• Main idea</text>
  <text x="320" y="178" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">– Sub-point</text>

  <text x="650" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Mind map</text>
  <rect x="550" y="40" width="200" height="190" fill="none" stroke="#4A443C" stroke-width="1.5"/>
  <circle cx="650" cy="130" r="26" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="650" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C4A3E">topic</text>
  <line x1="650" y1="104" x2="650" y2="65" stroke="#4A443C" stroke-width="1.5"/>
  <circle cx="650" cy="60" r="14" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
  <line x1="626" y1="118" x2="590" y2="90" stroke="#4A443C" stroke-width="1.5"/>
  <circle cx="580" cy="82" r="14" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
  <line x1="626" y1="142" x2="588" y2="165" stroke="#4A443C" stroke-width="1.5"/>
  <circle cx="578" cy="175" r="14" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
  <line x1="674" y1="142" x2="712" y2="165" stroke="#4A443C" stroke-width="1.5"/>
  <circle cx="722" cy="175" r="14" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
  <line x1="580" y1="82" x2="578" y2="175" stroke="#4A443C" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Same underlying content, three different structures — choose based on how the material actually relates to itself.</text>
</svg>
