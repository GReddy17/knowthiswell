<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storageCompareTitle">
  <title id="storageCompareTitle">A comparison of a 1 terabyte drive measured two ways: a decimal bar showing 1,000,000,000,000 bytes labeled 1 TB, and a binary bar below it showing the same physical bytes now measured in gibibyte-based units, landing at approximately 931 GiB, with the gap between the two bar lengths labeled as the missing space users see in their operating system, not lost data.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="30" y="40" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Same physical drive, two counting systems</text>

  <!-- Decimal bar -->
  <text x="30" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Manufacturer (decimal, SI): 1,000,000,000,000 bytes</text>
  <rect x="30" y="100" width="700" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="380" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">1 TB (decimal)</text>

  <!-- Binary bar, slightly shorter -->
  <text x="30" y="175" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Operating system (binary, IEC): same bytes, measured in GiB</text>
  <rect x="30" y="185" width="651" height="40" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="355" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">≈ 931 GiB (shown as "GB")</text>

  <!-- Gap bracket -->
  <line x1="681" y1="185" x2="730" y2="185" stroke="#B5493A" stroke-width="1.6"/>
  <line x1="730" y1="100" x2="730" y2="225" stroke="#B5493A" stroke-width="1.6"/>
  <text x="745" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A" writing-mode="vertical-rl">gap = units, not lost data</text>

  <text x="390" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The "missing" ~69 GB is entirely a units-definition artifact — decimal kilo/mega/giga/tera (x1,000) vs binary kibi/mebi/gibi/tebi (x1,024).</text>
</svg>
