<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="complaintRoutesTitle">
  <title id="complaintRoutesTitle">A flow diagram starting from consumer harmed by a business practice branching into three paths based on scope: a broad widespread pattern going to the FTC or state attorney general, a more localized issue going to a state consumer protection office, and a single individual transaction dispute going to small claims court</title>
  <rect width="780" height="360" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="290" y="20" width="200" height="50" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="390" y="41" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Consumer harmed by</text>
    <text x="390" y="57" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">a business practice</text>
  </g>

  <line x1="390" y1="70" x2="150" y2="150" stroke="#2C4A3E" stroke-width="1.4" marker-end="url(#b3)"/>
  <line x1="390" y1="70" x2="390" y2="150" stroke="#2C4A3E" stroke-width="1.4" marker-end="url(#b3)"/>
  <line x1="390" y1="70" x2="630" y2="150" stroke="#2C4A3E" stroke-width="1.4" marker-end="url(#b3)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="155" width="220" height="50" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="150" y="175" text-anchor="middle" font-size="12" fill="#1F1B16">Broad, widespread</text>
    <text x="150" y="191" text-anchor="middle" font-size="12" fill="#1F1B16">pattern of harm</text>
    <line x1="150" y1="205" x2="150" y2="235" stroke="#2C4A3E" stroke-width="1.4" marker-end="url(#b3)"/>
    <rect x="55" y="240" width="190" height="45" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="150" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">FTC / state</text>
    <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">attorney general</text>

    <rect x="280" y="155" width="220" height="50" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="390" y="175" text-anchor="middle" font-size="12" fill="#1F1B16">More localized</text>
    <text x="390" y="191" text-anchor="middle" font-size="12" fill="#1F1B16">business practice issue</text>
    <line x1="390" y1="205" x2="390" y2="235" stroke="#2C4A3E" stroke-width="1.4" marker-end="url(#b3)"/>
    <rect x="295" y="240" width="190" height="45" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="390" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">State consumer</text>
    <text x="390" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">protection office</text>

    <rect x="520" y="155" width="220" height="50" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.6"/>
    <text x="630" y="175" text-anchor="middle" font-size="12" fill="#1F1B16">Single individual</text>
    <text x="630" y="191" text-anchor="middle" font-size="12" fill="#1F1B16">transaction dispute</text>
    <line x1="630" y1="205" x2="630" y2="235" stroke="#2C4A3E" stroke-width="1.4" marker-end="url(#b3)"/>
    <rect x="535" y="240" width="190" height="45" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="630" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Small claims court</text>
  </g>

  <text x="390" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Scope of the harm — not how strongly it feels — generally determines the right path.</text>

  <defs>
    <marker id="b3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/></marker>
  </defs>
</svg>
