<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waterConsTitle">
  <title id="waterConsTitle">Two horizontal bar rows across seven days labeled Monday through Sunday. The top row, labeled behavior-based saving, shows uneven bars of varying height with one day showing zero savings, representing inconsistent daily habit compliance. The bottom row, labeled fixture-based saving, shows seven identical, evenly sized bars every single day, representing automatic and consistent savings from a low-flow fixture.</title>
  <rect width="780" height="240" fill="#FBF8F1"/>

  <text x="30" y="35" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Behavior-based saving</text>
  <g>
    <rect x="30" y="45" width="80" height="30" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <rect x="120" y="55" width="80" height="20" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <rect x="210" y="40" width="80" height="35" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <rect x="300" y="65" width="80" height="10" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
    <rect x="390" y="50" width="80" height="25" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <rect x="480" y="42" width="80" height="33" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <rect x="570" y="58" width="80" height="17" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  </g>
  <text x="335" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">missed day</text>

  <text x="30" y="130" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Fixture-based saving</text>
  <g>
    <rect x="30" y="140" width="80" height="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="120" y="140" width="80" height="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="210" y="140" width="80" height="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="300" y="140" width="80" height="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="390" y="140" width="80" height="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="480" y="140" width="80" height="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="570" y="140" width="80" height="30" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C" text-anchor="middle">
    <text x="70" y="195">Mon</text><text x="160" y="195">Tue</text><text x="250" y="195">Wed</text>
    <text x="340" y="195">Thu</text><text x="430" y="195">Fri</text><text x="520" y="195">Sat</text><text x="610" y="195">Sun</text>
  </g>

  <text x="390" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Fixture-level savings stay constant every day; behavior-level savings vary and can drop to zero.</text>
</svg>
