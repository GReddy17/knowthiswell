<svg viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eiTlTitle">
  <title id="eiTlTitle">Leading, coincident and lagging indicators around a business-cycle peak. Leading indicators such as the yield curve, building permits, new orders, initial jobless claims and stock prices turn months before the peak. Coincident indicators such as payroll jobs, industrial production, real income and real sales turn at the peak. Lagging indicators such as unemployment duration and the unemployment rate turn after it. Every reading is an estimate with noise, for example about plus or minus 136,000 jobs on the monthly payroll change.</title>
  <rect width="560" height="480" fill="#FBF8F1"/>
  <text x="280" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Leading, coincident and lagging indicators</text>
  <path d="M30 190 C120 170 180 80 280 70 C380 80 440 170 530 200" fill="none" stroke="#2C4A3E" stroke-width="3"/>
  <line x1="30" y1="210" x2="530" y2="210" stroke="#4A443C" stroke-width="1.5"/>
  <text x="530" y="226" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">time →</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <line x1="140" y1="118" x2="140" y2="210" stroke="#8B6F4E" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="140" cy="118" r="5" fill="#8B6F4E"/>
    <text x="140" y="104" font-size="11" font-weight="700" fill="#8B6F4E">leading turns</text>
    <line x1="280" y1="70" x2="280" y2="210" stroke="#2C4A3E" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="280" cy="70" r="5" fill="#2C4A3E"/>
    <text x="280" y="56" font-size="11" font-weight="700" fill="#2C4A3E">peak: coincident turn</text>
    <line x1="420" y1="118" x2="420" y2="210" stroke="#4A443C" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="420" cy="118" r="5" fill="#4A443C"/>
    <text x="420" y="104" font-size="11" font-weight="700" fill="#4A443C">lagging turns</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <rect x="20" y="240" width="165" height="140" rx="6" fill="#8B6F4E"/>
    <text x="102" y="262" font-size="12" font-weight="700" fill="#FBF8F1">Leading</text>
    <text x="102" y="282" font-size="10" fill="#FBF8F1">yield curve (10y − 3m)</text>
    <text x="102" y="298" font-size="10" fill="#FBF8F1">building permits</text>
    <text x="102" y="314" font-size="10" fill="#FBF8F1">new orders, PMI vs 50</text>
    <text x="102" y="330" font-size="10" fill="#FBF8F1">weekly jobless claims</text>
    <text x="102" y="346" font-size="10" fill="#FBF8F1">stock prices</text>
    <text x="102" y="368" font-size="10" font-weight="700" fill="#FBF8F1">early, noisy, false alarms</text>
    <rect x="198" y="240" width="165" height="140" rx="6" fill="#2C4A3E"/>
    <text x="280" y="262" font-size="12" font-weight="700" fill="#FBF8F1">Coincident</text>
    <text x="280" y="282" font-size="10" fill="#FBF8F1">payroll jobs</text>
    <text x="280" y="298" font-size="10" fill="#FBF8F1">industrial production</text>
    <text x="280" y="314" font-size="10" fill="#FBF8F1">real personal income</text>
    <text x="280" y="330" font-size="10" fill="#FBF8F1">real sales, GDP</text>
    <text x="280" y="368" font-size="10" font-weight="700" fill="#FBF8F1">what NBER weighs</text>
    <rect x="376" y="240" width="165" height="140" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="458" y="262" font-size="12" font-weight="700" fill="#1F1B16">Lagging</text>
    <text x="458" y="282" font-size="10" fill="#4A443C">unemployment duration</text>
    <text x="458" y="298" font-size="10" fill="#4A443C">unemployment rate</text>
    <text x="458" y="314" font-size="10" fill="#4A443C">(around turning points)</text>
    <text x="458" y="330" font-size="10" fill="#4A443C">services inflation</text>
    <text x="458" y="368" font-size="10" font-weight="700" fill="#8B6F4E">confirms the turn</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle">
    <rect x="20" y="398" width="520" height="66" rx="6" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="280" y="420" fill="#4A443C">Every reading is an estimate: monthly payroll change ≈ ±136,000 jobs (90% CI).</text>
    <text x="280" y="438" fill="#4A443C">Read trends across releases and indicators, not one headline.</text>
    <text x="280" y="455" font-size="10" fill="#8B6F4E">Sources: BLS, BEA, NBER, Federal Reserve Bank of New York</text>
  </g>
</svg>
