<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="roundingLineTitle">
  <title id="roundingLineTitle">Number line showing two target rounding values, 340 and 350, with a marked halfway boundary point between them; numbers falling left of the boundary are shaded to round down to the lower target, numbers falling right of the boundary are shaded to round up to the higher target, and the exact boundary point is marked as the special case decided by the chosen rounding convention</title>
  <rect width="640" height="260" fill="#FBF8F1"/>

  <!-- shaded regions -->
  <rect x="80" y="112" width="240" height="20" fill="#EEF3EE"/>
  <rect x="320" y="112" width="240" height="20" fill="#FBEDEA"/>

  <!-- number line -->
  <line x1="80" y1="122" x2="560" y2="122" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M560,122 L550,117 L550,127 Z" fill="#1F1B16"/>

  <!-- ticks -->
  <g stroke="#4A443C" stroke-width="1.3">
    <line x1="80"  y1="116" x2="80"  y2="128"/>
    <line x1="200" y1="116" x2="200" y2="128"/>
    <line x1="440" y1="116" x2="440" y2="128"/>
    <line x1="560" y1="116" x2="560" y2="128"/>
  </g>
  <text x="80"  y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">335</text>
  <text x="200" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1F1B16">340</text>
  <text x="440" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#1F1B16">350</text>
  <text x="560" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">355</text>

  <!-- target markers -->
  <circle cx="200" cy="122" r="5" fill="#2C4A3E"/>
  <circle cx="440" cy="122" r="5" fill="#2C4A3E"/>

  <!-- boundary marker -->
  <line x1="320" y1="90" x2="320" y2="150" stroke="#B5493A" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="320" cy="122" r="5.5" fill="#B5493A"/>
  <text x="320" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#B5493A">345 — boundary</text>
  <text x="320" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">exact halfway point:</text>
  <text x="320" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">decided by rounding convention used</text>

  <!-- region labels -->
  <text x="150" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2C4A3E">Rounds down to 340</text>
  <text x="490" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#B5493A">Rounds up to 350</text>
</svg>
