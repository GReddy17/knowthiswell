<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="certChoiceComparisonTitle">
  <title id="certChoiceComparisonTitle">Three factors to check before choosing a certification: employer recognition in real job postings, the standing of the issuing organization, and total cost including recertification requirements.</title>
  <rect width="560" height="260" fill="#FBF8F1"/>
  <rect x="20" y="40" width="165" height="160" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="102" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Employer</text>
  <text x="102" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">recognition</text>
  <text x="102" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Check real job</text>
  <text x="102" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">postings for your</text>
  <text x="102" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">target role</text>
  <rect x="197" y="40" width="165" height="160" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="280" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Issuing body</text>
  <text x="280" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">standing</text>
  <text x="280" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Established vs.</text>
  <text x="280" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">newer, less-</text>
  <text x="280" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">recognized provider</text>
  <rect x="374" y="40" width="165" height="160" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="456" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Total cost</text>
  <text x="456" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Exam fee plus</text>
  <text x="456" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">ongoing</text>
  <text x="456" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">recertification</text>
  <rect x="20" y="215" width="519" height="35" rx="6" fill="#2C4A3E"/>
  <text x="280" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Weigh all three together for your specific target role</text>
</svg>
