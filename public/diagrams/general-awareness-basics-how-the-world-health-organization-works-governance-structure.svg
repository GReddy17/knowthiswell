<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="whoStructTitle">
  <title id="whoStructTitle">A top-down flow diagram showing the World Health Assembly (all member states, meets annually, sets policy) at the top, flowing down to the Executive Board (34 elected members, meets twice yearly, implements decisions), which flows down to the Secretariat headed by the Director-General, which flows down to six Regional Offices covering Africa, the Americas, South-East Asia, Europe, the Eastern Mediterranean, and the Western Pacific.</title>
  <rect width="700" height="480" fill="#FBF8F1"/>

  <rect x="150" y="24" width="400" height="80" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="350" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">World Health Assembly</text>
  <text x="350" y="74" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">All member states — meets annually, sets policy &amp; budget</text>
  <text x="350" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Elects the Director-General</text>

  <line x1="350" y1="104" x2="350" y2="134" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M 345 128 L 350 138 L 355 128" fill="none" stroke="#2C4A3E" stroke-width="2"/>

  <rect x="170" y="140" width="360" height="76" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="350" y="166" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Executive Board</text>
  <text x="350" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">34 elected members — meets twice yearly</text>
  <text x="350" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Implements Assembly decisions</text>

  <line x1="350" y1="216" x2="350" y2="246" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M 345 240 L 350 250 L 355 240" fill="none" stroke="#2C4A3E" stroke-width="2"/>

  <rect x="190" y="252" width="320" height="72" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="350" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Secretariat</text>
  <text x="350" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Headed by the Director-General</text>
  <text x="350" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Runs day-to-day operations</text>

  <line x1="350" y1="324" x2="350" y2="354" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M 345 348 L 350 358 L 355 348" fill="none" stroke="#2C4A3E" stroke-width="2"/>

  <text x="350" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Six Regional Offices</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">
    <rect x="10" y="392" width="106" height="46" rx="7" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="63" y="419" text-anchor="middle">Africa</text>
    <rect x="126" y="392" width="106" height="46" rx="7" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="179" y="419" text-anchor="middle">Americas</text>
    <rect x="242" y="392" width="106" height="46" rx="7" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="295" y="412" text-anchor="middle">South-East</text>
    <text x="295" y="426" text-anchor="middle">Asia</text>
    <rect x="358" y="392" width="106" height="46" rx="7" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="411" y="419" text-anchor="middle">Europe</text>
    <rect x="474" y="392" width="106" height="46" rx="7" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="527" y="412" text-anchor="middle">Eastern</text>
    <text x="527" y="426" text-anchor="middle">Mediterranean</text>
    <rect x="590" y="392" width="106" height="46" rx="7" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="643" y="412" text-anchor="middle">Western</text>
    <text x="643" y="426" text-anchor="middle">Pacific</text>
  </g>

  <text x="350" y="462" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Each level down handles more day-to-day operational work, adapting global guidance to local health systems.</text>
</svg>
