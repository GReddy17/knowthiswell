<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soapMechTitle">
  <title id="soapMechTitle">Cross-section diagram showing a soap molecule as a line with a hydrophilic circular head and a hydrophobic tail, several such molecules surrounding a virus particle's lipid envelope, prying it apart, with the freed pieces and virus lifted away from a skin surface into a layer of water that rinses away.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="20" y="250" width="740" height="18" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="30" y="300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Skin surface</text>

  <!-- Virus with lipid envelope, intact, left side -->
  <circle cx="150" cy="200" r="34" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <circle cx="150" cy="200" r="34" fill="none" stroke="#B5493A" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="150" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Virus</text>
  <text x="150" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">intact lipid envelope</text>

  <text x="300" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#4A443C">→</text>

  <!-- Soap molecules surrounding and prying apart a second virus -->
  <g>
    <circle cx="480" cy="150" r="7" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
    <line x1="480" y1="157" x2="500" y2="185" stroke="#2C4A3E" stroke-width="2"/>
    <circle cx="520" cy="150" r="7" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
    <line x1="520" y1="157" x2="505" y2="185" stroke="#2C4A3E" stroke-width="2"/>
    <circle cx="440" cy="220" r="7" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
    <line x1="447" y1="220" x2="480" y2="205" stroke="#2C4A3E" stroke-width="2"/>
    <circle cx="560" cy="220" r="7" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
    <line x1="553" y1="220" x2="520" y2="205" stroke="#2C4A3E" stroke-width="2"/>
  </g>
  <!-- Torn-apart virus envelope -->
  <path d="M 470 190 Q 460 175 480 170" fill="none" stroke="#B5493A" stroke-width="2"/>
  <path d="M 530 170 Q 550 175 540 190" fill="none" stroke="#B5493A" stroke-width="2"/>
  <path d="M 480 205 Q 470 215 485 220" fill="none" stroke="#B5493A" stroke-width="2"/>
  <path d="M 520 220 Q 535 215 525 205" fill="none" stroke="#B5493A" stroke-width="2"/>
  <text x="500" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">envelope pried apart, lifted into water film</text>

  <text x="700" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Soap molecule</text>
  <circle cx="700" cy="90" r="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="700" y1="98" x2="700" y2="130" stroke="#2C4A3E" stroke-width="2.2"/>
  <text x="715" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">hydrophilic head</text>
  <text x="715" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">hydrophobic tail</text>
</svg>
