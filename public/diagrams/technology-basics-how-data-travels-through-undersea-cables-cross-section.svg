<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cableCrossSectionTitle">
  <title id="cableCrossSectionTitle">A diagram showing a cross-section of a submarine cable with layered protective armor, insulation, and a bundle of thin glass fibers at its core, alongside a simplified map view showing the cable running from a landing station on one coastline, across the ocean floor with a repeater marked partway along its length, to a landing station on another coastline.</title>
  <rect width="800" height="340" fill="#FBF8F1"/>

  <text x="140" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Cable cross-section</text>
  <circle cx="140" cy="130" r="90" fill="#4A443C"/>
  <circle cx="140" cy="130" r="72" fill="#8A8272"/>
  <circle cx="140" cy="130" r="54" fill="#EDE7D8"/>
  <circle cx="140" cy="130" r="30" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="1.5"/>
  <circle cx="132" cy="124" r="4" fill="#2C4A3E"/>
  <circle cx="148" cy="122" r="4" fill="#2C4A3E"/>
  <circle cx="140" cy="138" r="4" fill="#2C4A3E"/>
  <circle cx="126" cy="138" r="4" fill="#2C4A3E"/>
  <circle cx="154" cy="136" r="4" fill="#2C4A3E"/>
  <text x="140" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">steel armor</text>
  <text x="140" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">waterproofing + insulation</text>
  <text x="140" y="275" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">glass fiber core (light pulses)</text>

  <text x="560" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Route across the ocean floor</text>
  <rect x="310" y="150" width="500" height="60" fill="#E3EEF2" stroke="#2C4A3E" stroke-width="1"/>
  <text x="335" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">seafloor</text>

  <rect x="300" y="120" width="70" height="40" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="335" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Landing A</text>

  <rect x="750" y="120" width="70" height="40" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="785" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Landing B</text>

  <path d="M335,160 Q 560,220 750,160" fill="none" stroke="#2C4A3E" stroke-width="3"/>
  <circle cx="545" cy="207" r="9" fill="#B5493A" stroke="#1F1B16" stroke-width="1"/>
  <text x="545" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#B5493A">repeater</text>

  <text x="560" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Repeaters boost the light signal at intervals over very long distances.</text>
</svg>
