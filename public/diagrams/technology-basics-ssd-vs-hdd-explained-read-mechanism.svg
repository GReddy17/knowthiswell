<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ssdHddTitle">
  <title id="ssdHddTitle">Comparison diagram showing an HDD's spinning platter and moving read/write arm versus an SSD's grid of flash memory cells accessed electronically with no moving parts</title>
  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <text x="160" y="40" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="700" fill="#1F1B16">HDD</text>
  <text x="480" y="40" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="700" fill="#1F1B16">SSD</text>
  <line x1="320" y1="20" x2="320" y2="380" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- HDD: spinning platter with head -->
  <circle cx="160" cy="180" r="110" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="160" cy="180" r="70" fill="none" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="160" cy="180" r="40" fill="none" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="160" cy="180" r="10" fill="#1F1B16"/>
  <!-- read/write arm -->
  <path d="M 160,180 L 255,110" stroke="#C9412C" stroke-width="4" stroke-linecap="round"/>
  <circle cx="255" cy="110" r="5" fill="#C9412C"/>
  <text x="160" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Spinning platter (5,400-7,200 RPM)</text>
  <text x="160" y="332" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Arm physically moves to each track</text>
  <text x="160" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Data read magnetically off the surface</text>
  <text x="160" y="370" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8B6F4E">Seek + rotate time = delay</text>

  <!-- SSD: grid of cells -->
  <g>
    <rect x="410" y="90" width="140" height="180" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <!-- 6x8 grid of small cells -->
    <g fill="#2C4A3E">
      <!-- generate manually a small grid -->
    </g>
    <g>
      <!-- rows -->
      <g fill="#2C4A3E" opacity="0.75">
        <rect x="420" y="100" width="14" height="14" rx="2"/><rect x="440" y="100" width="14" height="14" rx="2"/><rect x="460" y="100" width="14" height="14" rx="2"/><rect x="480" y="100" width="14" height="14" rx="2"/><rect x="500" y="100" width="14" height="14" rx="2"/><rect x="520" y="100" width="14" height="14" rx="2"/>
        <rect x="420" y="120" width="14" height="14" rx="2"/><rect x="440" y="120" width="14" height="14" rx="2" fill="#C9412C"/><rect x="460" y="120" width="14" height="14" rx="2"/><rect x="480" y="120" width="14" height="14" rx="2"/><rect x="500" y="120" width="14" height="14" rx="2" fill="#C9412C"/><rect x="520" y="120" width="14" height="14" rx="2"/>
        <rect x="420" y="140" width="14" height="14" rx="2"/><rect x="440" y="140" width="14" height="14" rx="2"/><rect x="460" y="140" width="14" height="14" rx="2" fill="#C9412C"/><rect x="480" y="140" width="14" height="14" rx="2"/><rect x="500" y="140" width="14" height="14" rx="2"/><rect x="520" y="140" width="14" height="14" rx="2"/>
        <rect x="420" y="160" width="14" height="14" rx="2"/><rect x="440" y="160" width="14" height="14" rx="2"/><rect x="460" y="160" width="14" height="14" rx="2"/><rect x="480" y="160" width="14" height="14" rx="2" fill="#C9412C"/><rect x="500" y="160" width="14" height="14" rx="2"/><rect x="520" y="160" width="14" height="14" rx="2"/>
        <rect x="420" y="180" width="14" height="14" rx="2"/><rect x="440" y="180" width="14" height="14" rx="2"/><rect x="460" y="180" width="14" height="14" rx="2"/><rect x="480" y="180" width="14" height="14" rx="2"/><rect x="500" y="180" width="14" height="14" rx="2"/><rect x="520" y="180" width="14" height="14" rx="2" fill="#C9412C"/>
        <rect x="420" y="200" width="14" height="14" rx="2"/><rect x="440" y="200" width="14" height="14" rx="2"/><rect x="460" y="200" width="14" height="14" rx="2"/><rect x="480" y="200" width="14" height="14" rx="2"/><rect x="500" y="200" width="14" height="14" rx="2"/><rect x="520" y="200" width="14" height="14" rx="2"/>
        <rect x="420" y="220" width="14" height="14" rx="2"/><rect x="440" y="220" width="14" height="14" rx="2" fill="#C9412C"/><rect x="460" y="220" width="14" height="14" rx="2"/><rect x="480" y="220" width="14" height="14" rx="2"/><rect x="500" y="220" width="14" height="14" rx="2"/><rect x="520" y="220" width="14" height="14" rx="2"/>
        <rect x="420" y="240" width="14" height="14" rx="2"/><rect x="440" y="240" width="14" height="14" rx="2"/><rect x="460" y="240" width="14" height="14" rx="2"/><rect x="480" y="240" width="14" height="14" rx="2"/><rect x="500" y="240" width="14" height="14" rx="2" fill="#C9412C"/><rect x="520" y="240" width="14" height="14" rx="2"/>
      </g>
    </g>
  </g>
  <text x="480" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Grid of NAND flash cells</text>
  <text x="480" y="332" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">No moving parts</text>
  <text x="480" y="349" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Any cell (red) reached electronically</text>
  <text x="480" y="370" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8B6F4E">No seek or rotate delay</text>
</svg>
