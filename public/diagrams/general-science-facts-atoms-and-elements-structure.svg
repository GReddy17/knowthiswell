<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atomStructureTitle">
  <title id="atomStructureTitle">A simplified atom showing a central nucleus of protons and neutrons surrounded by two electron shells, with the outer shell labeled as the one that determines chemical bonding</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- electron shells -->
  <circle cx="320" cy="210" r="160" fill="none" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="320" cy="210" r="90" fill="none" stroke="#E3DCC9" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- nucleus -->
  <circle cx="320" cy="210" r="34" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <g stroke="#FBF8F1" stroke-width="1">
    <circle cx="320" cy="210" r="7.5" fill="#C9412C"/>
    <circle cx="336" cy="210" r="7.5" fill="#C9412C"/>
    <circle cx="312" cy="224" r="7.5" fill="#4A443C"/>
    <circle cx="312" cy="196" r="7.5" fill="#C9412C"/>
    <circle cx="304" cy="210" r="7.5" fill="#4A443C"/>
    <circle cx="328" cy="224" r="7.5" fill="#4A443C"/>
    <circle cx="328" cy="196" r="7.5" fill="#C9412C"/>
  </g>
  <text x="320" y="264" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="14" font-weight="600" fill="#1F1B16">Nucleus</text>

  <!-- inner shell electrons -->
  <circle cx="389" cy="268" r="6" fill="#2C4A3E"/>
  <circle cx="251" cy="152" r="6" fill="#2C4A3E"/>

  <!-- outer shell electrons -->
  <circle cx="480" cy="210" r="6" fill="#2C4A3E"/>
  <circle cx="400" cy="349" r="6" fill="#2C4A3E"/>
  <circle cx="240" cy="349" r="6" fill="#2C4A3E"/>
  <circle cx="160" cy="210" r="6" fill="#2C4A3E"/>
  <circle cx="240" cy="71" r="6" fill="#2C4A3E"/>
  <circle cx="400" cy="71" r="6" fill="#2C4A3E"/>

  <!-- callout to outer shell -->
  <line x1="480" y1="210" x2="560" y2="150" stroke="#4A443C" stroke-width="1"/>
  <text x="564" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Outer shell</text>
  <text x="564" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">(valence) — determines</text>
  <text x="564" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">chemical bonding</text>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">
    <circle cx="60" cy="385" r="6.5" fill="#C9412C"/>
    <text x="74" y="389">Proton (p⁺)</text>
    <circle cx="180" cy="385" r="6.5" fill="#4A443C"/>
    <text x="194" y="389">Neutron (n)</text>
    <circle cx="300" cy="385" r="6" fill="#2C4A3E"/>
    <text x="313" y="389">Electron (e⁻)</text>
  </g>
</svg>
