<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phoneHeatTitle">
  <title id="phoneHeatTitle">A diagram showing four heat sources inside a phone — processor, battery charging, screen brightness, and radio signal — all feeding into a shared heat pool, which triggers thermal throttling that reduces processor speed, which in turn reduces further heat production, shown as a feedback loop.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Heat sources feed a shared budget — throttling is the safety valve</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">
    <rect x="30" y="55" width="140" height="50" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="100" y="85" text-anchor="middle">Processor (CPU/GPU)</text>

    <rect x="30" y="120" width="140" height="50" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="100" y="150" text-anchor="middle">Fast charging</text>

    <rect x="30" y="185" width="140" height="50" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="100" y="215" text-anchor="middle">Screen brightness</text>

    <rect x="30" y="250" width="140" height="50" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
    <text x="100" y="280" text-anchor="middle">Weak signal / radio</text>
  </g>

  <defs>
    <marker id="arrowHeat" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <path d="M170,80 L340,150" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHeat)"/>
  <path d="M170,145 L340,155" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHeat)"/>
  <path d="M170,210 L340,165" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHeat)"/>
  <path d="M170,275 L340,175" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowHeat)"/>

  <circle cx="400" cy="160" r="55" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
  <text x="400" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5493A">Shared</text>
  <text x="400" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5493A">heat pool</text>

  <path d="M455,160 L590,160" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowHeat)"/>

  <rect x="595" y="120" width="155" height="80" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
  <text x="672" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Thermal</text>
  <text x="672" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">throttling</text>
  <text x="672" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">slows the chip down</text>

  <path d="M595,180 C 500,240 300,240 175,90" fill="none" stroke="#8A6D3B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowHeat)"/>
  <text x="390" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8A6D3B">feedback loop: less speed -&gt; less heat produced</text>

  <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Throttling trades speed for temperature — it is a protective response, not a malfunction.</text>
</svg>
