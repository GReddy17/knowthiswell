<svg viewBox="0 0 880 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ejTimelineTitle">
  <title id="ejTimelineTitle">A horizontal timeline with four points: 1982, the Warren County PCB landfill protest; 1983, the US General Accounting Office study documenting the pattern; 1987, the United Church of Christ Toxic Wastes and Race report documenting it nationally; and the present day, the EPA Office of Environmental Justice reviewing cumulative impact as part of standard permitting decisions.</title>
  <rect width="880" height="240" fill="#FBF8F1"/>

  <line x1="60" y1="130" x2="820" y2="130" stroke="#2C4A3E" stroke-width="2.5"/>

  <circle cx="110" cy="130" r="9" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1982</text>
  <text x="110" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Warren County</text>
  <text x="110" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">PCB landfill protest</text>

  <circle cx="320" cy="130" r="9" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1983</text>
  <text x="320" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">GAO study documents</text>
  <text x="320" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">the siting pattern</text>

  <circle cx="530" cy="130" r="9" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="530" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1987</text>
  <text x="530" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">"Toxic Wastes and Race"</text>
  <text x="530" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">documents it nationally</text>

  <circle cx="760" cy="130" r="9" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="760" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Present day</text>
  <text x="760" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">EPA Office of Env. Justice</text>
  <text x="760" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">reviews cumulative impact</text>

  <text x="440" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">A grassroots protest became documented research, then a standing part of regulatory practice.</text>
</svg>
