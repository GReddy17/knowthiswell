<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="airplaneModeTitle">
  <title id="airplaneModeTitle">A diagram of a phone's four radios when airplane mode is switched on: the cellular radio is off and cannot be re-enabled while airplane mode is active, WiFi and Bluetooth are off by default but can be manually switched back on, and the GPS receiver keeps working because it only listens for satellite signals and never transmits.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Airplane mode is a group switch, not one single radio</text>

  <rect x="300" y="50" width="180" height="230" rx="18" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Airplane mode: ON</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
    <rect x="315" y="95" width="150" height="30" fill="#FBEDEA" stroke="#B5493A" stroke-width="1.5"/>
    <text x="390" y="114" text-anchor="middle" fill="#B5493A" font-weight="700">Cellular radio: OFF</text>

    <rect x="315" y="132" width="150" height="30" fill="#EDE7D8" stroke="#4A443C" stroke-width="1.5"/>
    <text x="390" y="151" text-anchor="middle" fill="#4A443C" font-weight="700">WiFi: OFF (toggle-able)</text>

    <rect x="315" y="169" width="150" height="30" fill="#EDE7D8" stroke="#4A443C" stroke-width="1.5"/>
    <text x="390" y="188" text-anchor="middle" fill="#4A443C" font-weight="700">Bluetooth: OFF (toggle-able)</text>

    <rect x="315" y="206" width="150" height="30" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="390" y="225" text-anchor="middle" fill="#2C4A3E" font-weight="700">GPS receiver: still ON</text>
  </g>
  <text x="390" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">GPS only listens — it never transmits, so it doesn't interfere with cabin electronics</text>

  <path d="M40,70 L200,150" fill="none" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M40,230 L200,160" fill="none" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="130" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C" text-anchor="middle">no signal sent</text>
  <text x="130" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C" text-anchor="middle">to cell towers</text>

  <path d="M740,70 L580,150" fill="none" stroke="#2C4A3E" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowAir)"/>
  <defs>
    <marker id="arrowAir" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <text x="650" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C" text-anchor="middle">satellites (receive-only)</text>

  <text x="390" y="305" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">The rule targets radios that transmit, which is why GPS-based maps can still work with no signal bars at all.</text>
</svg>
