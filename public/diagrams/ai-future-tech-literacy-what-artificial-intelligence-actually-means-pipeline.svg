<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aiPipelineTitle">
  <title id="aiPipelineTitle">A flow diagram showing labeled training data feeding into a training process that adjusts a model's parameters, producing a trained model, which takes new input and produces a prediction.</title>
  <rect width="640" height="260" fill="#FBF8F1"/>
  <rect x="20" y="90" width="130" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Labeled</text>
  <text x="85" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">training data</text>
  <path d="M150 130 H190" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="90" width="130" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="255" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Training</text>
  <text x="255" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">(adjusts params)</text>
  <path d="M320 130 H360" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="90" width="130" height="80" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="425" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Trained</text>
  <text x="425" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">model</text>
  <path d="M490 130 H530" stroke="#8B6F4E" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="530" y="90" width="95" height="80" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="577" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">New</text>
  <text x="577" y="141" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">input</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8B6F4E"/></marker>
  </defs>
  <text x="320" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">No step here involves innate understanding — only learned statistical patterns from data.</text>
</svg>
