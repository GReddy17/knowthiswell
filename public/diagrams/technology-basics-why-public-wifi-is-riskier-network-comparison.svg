<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pubWifiTitle">
  <title id="pubWifiTitle">A comparison of a home WiFi network and a public WiFi network. On a home network, a password-protected router encrypts traffic between the device and the router, and only trusted household devices share the network. On a public network, many unrelated strangers share the same unencrypted or weakly secured network, so someone else on that network can potentially observe traffic that is not separately protected by HTTPS.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <text x="30" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Home network</text>
  <rect x="30" y="45" width="90" height="42" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="75" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Device</text>

  <rect x="200" y="45" width="110" height="42" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
  <text x="255" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Router</text>
  <text x="255" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(password + encryption)</text>

  <defs>
    <marker id="arrowWifi" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <path d="M120,66 L198,66" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowWifi)"/>
  <text x="159" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C4A3E">encrypted link</text>

  <rect x="360" y="50" width="55" height="32" fill="#FFFFFF" stroke="#E3DCC9"/>
  <text x="387" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">trusted</text>
  <rect x="425" y="50" width="55" height="32" fill="#FFFFFF" stroke="#E3DCC9"/>
  <text x="452" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">household</text>
  <text x="440" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">Only devices with the password join</text>

  <text x="30" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Public WiFi (cafe, airport)</text>
  <rect x="30" y="167" width="90" height="42" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="75" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Device</text>

  <rect x="200" y="167" width="110" height="42" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="255" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1F1B16">Open access point</text>
  <text x="255" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(no password, weak/no encryption)</text>

  <path d="M120,188 L198,188" fill="none" stroke="#C9412C" stroke-width="2" marker-end="url(#arrowWifi)"/>
  <text x="159" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#C9412C">often unencrypted</text>

  <rect x="360" y="172" width="55" height="32" fill="#FBEDEA" stroke="#C9412C"/>
  <text x="387" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#C9412C">stranger</text>
  <rect x="425" y="172" width="55" height="32" fill="#FBEDEA" stroke="#C9412C"/>
  <text x="452" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#C9412C">stranger</text>
  <rect x="490" y="172" width="55" height="32" fill="#FBEDEA" stroke="#C9412C"/>
  <text x="517" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#C9412C">attacker?</text>
  <text x="452" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">Any unrelated person can join the same network</text>

  <text x="400" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">The risk is who else shares the network, not the WiFi signal itself — HTTPS still protects site traffic on either.</text>
</svg>
