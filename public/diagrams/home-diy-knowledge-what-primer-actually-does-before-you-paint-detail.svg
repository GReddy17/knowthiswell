<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="primerTitle">
  <title id="primerTitle">A cross-section comparison of a wall painted without primer, where topcoat soaks unevenly into the porous substrate leaving blotchy patches, versus a wall painted with primer first, where a uniform sealing layer produces an even, consistent topcoat on top.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Same wall, same paint &#8212; primer is the difference</text>

  <!-- LEFT: no primer -->
  <rect x="90" y="90" width="200" height="110" fill="#E8DEC8" stroke="#4A443C" stroke-width="2"/>
  <path d="M90,90 C115,78 130,96 150,84 C170,72 190,92 210,80 C230,68 250,90 270,78 C280,72 290,80 290,90 L290,70 L90,70 Z" fill="#8B6F4E" fill-opacity="0.75"/>
  <text x="190" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">No primer</text>
  <text x="190" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Topcoat absorbs unevenly &#8212;</text>
  <text x="190" y="249" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">blotchy sheen, weaker bond</text>

  <!-- RIGHT: with primer -->
  <rect x="490" y="90" width="200" height="110" fill="#E8DEC8" stroke="#4A443C" stroke-width="2"/>
  <rect x="490" y="78" width="200" height="12" fill="#4A443C"/>
  <rect x="490" y="62" width="200" height="16" fill="#2C4A3E"/>
  <text x="590" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">With primer</text>
  <text x="590" y="236" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Seals pores, blocks stains &#8212;</text>
  <text x="590" y="249" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">uniform, even topcoat</text>

  <!-- small legend -->
  <rect x="490" y="60" width="10" height="10" fill="#2C4A3E"/>
  <text x="505" y="69" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#1F1B16">topcoat</text>
  <rect x="560" y="60" width="10" height="10" fill="#4A443C"/>
  <text x="575" y="69" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#1F1B16">primer</text>

  <text x="390" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Primer gives the topcoat a uniform, sealed surface to bond to instead of a raw, porous one.</text>
</svg>
