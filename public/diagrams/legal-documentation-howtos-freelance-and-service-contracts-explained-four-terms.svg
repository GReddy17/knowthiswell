<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="freelance-terms-title">
  <title id="freelance-terms-title">Diagram showing four elements — Scope of Work, Payment Terms, Timeline, and Ownership — arranged around a central box labeled Freelance Contract.</title>
  <rect width="640" height="320" fill="#FBF8F1"/>
  <style>
    .box { fill: #EEF3EE; stroke: #2C4A3E; stroke-width: 2; }
    .center { fill: #FBEDEA; stroke: #2C4A3E; stroke-width: 2; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #1F1B16; font-weight: 600; }
    .arrow { stroke: #2C4A3E; stroke-width: 2; fill: none; marker-end: url(#ah4); }
  </style>
  <defs>
    <marker id="ah4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="160" height="55" rx="8" class="box"/>
  <text x="100" y="52" text-anchor="middle" class="label">Scope of Work</text>

  <rect x="460" y="20" width="160" height="55" rx="8" class="box"/>
  <text x="540" y="52" text-anchor="middle" class="label">Payment Terms</text>

  <rect x="20" y="245" width="160" height="55" rx="8" class="box"/>
  <text x="100" y="277" text-anchor="middle" class="label">Timeline</text>

  <rect x="460" y="245" width="160" height="55" rx="8" class="box"/>
  <text x="540" y="277" text-anchor="middle" class="label">Ownership</text>

  <rect x="240" y="130" width="160" height="60" rx="8" class="center"/>
  <text x="320" y="155" text-anchor="middle" class="label">Freelance</text>
  <text x="320" y="175" text-anchor="middle" class="label">Contract</text>

  <path d="M150,75 L280,130" class="arrow"/>
  <path d="M490,75 L360,130" class="arrow"/>
  <path d="M150,245 L280,190" class="arrow"/>
  <path d="M490,245 L360,190" class="arrow"/>
</svg>
