<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iucnTitle">
  <title id="iucnTitle">Horizontal bar of the seven IUCN Red List extinction risk categories from Least Concern to Extinct, colored from green through yellow and orange to dark red and black, with example species marked: the bald eagle at Least Concern, the northern white rhino near Extinct in the Wild, and the dodo at Extinct</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <text x="320" y="40" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="17" font-weight="600" fill="#1F1B16">Increasing extinction risk →</text>

  <!-- seven segments -->
  <g stroke="#FBF8F1" stroke-width="2">
    <rect x="40" y="200" width="80" height="70" fill="#4E7A5A"/>
    <rect x="120" y="200" width="80" height="70" fill="#8A9A4A"/>
    <rect x="200" y="200" width="80" height="70" fill="#C9A227"/>
    <rect x="280" y="200" width="80" height="70" fill="#D97D3D"/>
    <rect x="360" y="200" width="80" height="70" fill="#C9412C"/>
    <rect x="440" y="200" width="80" height="70" fill="#6E3226"/>
    <rect x="520" y="200" width="80" height="70" fill="#1F1B16"/>
  </g>

  <!-- category labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">
    <text x="80" y="288" text-anchor="middle">Least</text>
    <text x="80" y="300" text-anchor="middle">Concern</text>
    <text x="160" y="288" text-anchor="middle">Near</text>
    <text x="160" y="300" text-anchor="middle">Threatened</text>
    <text x="240" y="288" text-anchor="middle">Vulnerable</text>
    <text x="320" y="288" text-anchor="middle">Endangered</text>
    <text x="400" y="288" text-anchor="middle">Critically</text>
    <text x="400" y="300" text-anchor="middle">Endangered</text>
    <text x="480" y="288" text-anchor="middle">Extinct in</text>
    <text x="480" y="300" text-anchor="middle">the Wild</text>
    <text x="560" y="288" text-anchor="middle" font-weight="700">Extinct</text>
  </g>

  <!-- bald eagle marker: Least Concern -->
  <g transform="translate(80,150)">
    <path d="M -14,10 L 0,-8 L 14,10 L 6,4 L -6,4 Z" fill="#4E7A5A"/>
    <circle cx="0" cy="-8" r="4" fill="#4A443C"/>
  </g>
  <line x1="80" y1="155" x2="80" y2="200" stroke="#4A443C" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="80" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Bald eagle</text>
  <text x="80" y="151" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(recovered)</text>

  <!-- northern white rhino marker: edge of Extinct in the Wild -->
  <g transform="translate(475,150)">
    <ellipse cx="0" cy="4" rx="16" ry="8" fill="#6E3226"/>
    <rect x="-6" y="-4" width="3" height="6" fill="#6E3226"/>
    <rect x="2" y="-4" width="3" height="6" fill="#6E3226"/>
  </g>
  <line x1="480" y1="155" x2="480" y2="200" stroke="#4A443C" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="480" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">N. white rhino</text>

  <!-- dodo marker: Extinct -->
  <g transform="translate(560,150)">
    <ellipse cx="0" cy="4" rx="14" ry="9" fill="#1F1B16"/>
    <circle cx="14" cy="-2" r="6" fill="#1F1B16"/>
    <path d="M 20,-2 L 30,1 L 20,4 Z" fill="#1F1B16"/>
  </g>
  <line x1="560" y1="155" x2="560" y2="200" stroke="#4A443C" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="560" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Dodo</text>
  <text x="560" y="151" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(extinct 1681)</text>

  <text x="320" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Species can move either direction along this bar — except past Extinct, which cannot be reversed</text>
</svg>
