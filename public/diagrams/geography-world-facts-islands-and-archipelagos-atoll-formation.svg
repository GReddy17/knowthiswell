<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="atollFormationTitle">
  <title id="atollFormationTitle">Three-stage cross-section diagram showing a tall volcanic island with a fringing reef sinking over time into a barrier-reef stage with a lagoon, and finally into a fully submerged atoll: a ring of coral reef and low islands around an open lagoon</title>
  <rect width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">From volcanic island to atoll</text>

  <!-- sea baseline for all three stages -->
  <line x1="30" y1="300" x2="610" y2="300" stroke="#5B7A99" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- STAGE 1: volcanic island with fringing reef -->
  <g>
    <path d="M 95,300 L 135,150 L 175,300 Z" fill="#EDE7D8" stroke="#D8CFBB"/>
    <path d="M 80,300 L 95,300 L 175,300 L 190,300 L 182,290 L 88,290 Z" fill="#2C4A3E" opacity="0.55"/>
    <rect x="30" y="300" width="180" height="42" fill="#5B7A99" opacity="0.3"/>
    <text x="135" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">volcano</text>
    <text x="135" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#EEF3EE">fringing reef</text>
    <text x="120" y="366" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">1. Volcanic island</text>
    <text x="120" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Coral reef fringes the shore</text>
  </g>

  <!-- arrow 1 -->
  <path d="M 218,300 L 250,300" stroke="#8B6F4E" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="234" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8B6F4E">sinks</text>

  <!-- STAGE 2: barrier reef, volcano partly sunken -->
  <g>
    <path d="M 300,300 L 328,205 L 356,300 Z" fill="#EDE7D8" stroke="#D8CFBB"/>
    <rect x="266" y="300" width="180" height="42" fill="#5B7A99" opacity="0.3"/>
    <path d="M 270,300 L 285,300 L 285,290 L 270,290 Z M 372,300 L 442,300 L 442,290 L 372,290 Z" fill="#2C4A3E" opacity="0.55"/>
    <ellipse cx="330" cy="296" rx="45" ry="6" fill="#8FA9A0" opacity="0.4"/>
    <text x="328" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">volcano (sinking)</text>
    <text x="330" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#3F5E78">lagoon</text>
    <text x="406" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#EEF3EE">barrier reef</text>
    <text x="356" y="366" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">2. Barrier reef</text>
    <text x="356" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Reef separated by a lagoon</text>
  </g>

  <!-- arrow 2 -->
  <path d="M 466,300 L 498,300" stroke="#8B6F4E" stroke-width="1.6" marker-end="url(#arrowR)"/>
  <text x="482" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#8B6F4E">sinks</text>

  <!-- STAGE 3: atoll, volcano fully submerged -->
  <g>
    <rect x="514" y="300" width="96" height="42" fill="#5B7A99" opacity="0.3"/>
    <ellipse cx="562" cy="296" rx="40" ry="7" fill="#8FA9A0" opacity="0.45"/>
    <path d="M 522,290 a 40,7 0 0 1 80,0" fill="none" stroke="#2C4A3E" stroke-width="4" opacity="0.6"/>
    <circle cx="524" cy="290" r="3" fill="#2C4A3E"/>
    <circle cx="562" cy="285" r="3" fill="#2C4A3E"/>
    <circle cx="600" cy="290" r="3" fill="#2C4A3E"/>
    <text x="562" y="272" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#20362D">reef &amp; low islands</text>
    <text x="562" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#3F5E78">open lagoon</text>
    <text x="562" y="366" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">3. Atoll</text>
    <text x="562" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">Volcano fully submerged</text>
  </g>

  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#8B6F4E"/>
    </marker>
  </defs>

  <text x="320" y="405" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">Based on Darwin's subsidence theory of atoll formation; timescale is millions of years.</text>
</svg>
