<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="factCheckFlowTitle">
  <title id="factCheckFlowTitle">A flow diagram showing four sequential boxes left to right: a specific claim is selected, the claim is traced to primary sources, the evidence is weighed against the claim, and a published rating with visible sourcing is the final output</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#1F1B16">
    <rect x="20" y="90" width="160" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="100" y="128" text-anchor="middle" font-weight="700">1. Claim</text>
    <text x="100" y="146" text-anchor="middle" fill="#4A443C" font-size="11.5">selected</text>

    <rect x="220" y="90" width="160" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="300" y="122" text-anchor="middle" font-weight="700">2. Traced to</text>
    <text x="300" y="140" text-anchor="middle" font-weight="700">primary</text>
    <text x="300" y="158" text-anchor="middle" font-weight="700">sources</text>

    <rect x="420" y="90" width="160" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.8"/>
    <text x="500" y="122" text-anchor="middle" font-weight="700">3. Evidence</text>
    <text x="500" y="140" text-anchor="middle" font-weight="700">weighed vs.</text>
    <text x="500" y="158" text-anchor="middle" font-weight="700">claim</text>

    <rect x="620" y="80" width="140" height="110" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
    <text x="690" y="118" text-anchor="middle" font-weight="700">4. Rating</text>
    <text x="690" y="136" text-anchor="middle" font-weight="700">published</text>
    <text x="690" y="154" text-anchor="middle" fill="#4A443C" font-size="11">with sources</text>
    <text x="690" y="170" text-anchor="middle" fill="#4A443C" font-size="11">shown</text>
  </g>

  <line x1="180" y1="135" x2="216" y2="135" stroke="#4A443C" stroke-width="1.6"/>
  <polygon points="216,129 228,135 216,141" fill="#4A443C"/>
  <line x1="380" y1="135" x2="416" y2="135" stroke="#4A443C" stroke-width="1.6"/>
  <polygon points="416,129 428,135 416,141" fill="#4A443C"/>
  <line x1="580" y1="135" x2="616" y2="135" stroke="#4A443C" stroke-width="1.6"/>
  <polygon points="616,129 628,135 616,141" fill="#4A443C"/>

  <text x="390" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Each step is meant to stay visible in the final published fact-check, not compressed into an unexplained verdict.</text>
</svg>
