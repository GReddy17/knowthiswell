<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inflationRealNominalTitle">
  <title id="inflationRealNominalTitle">A diagram comparing two lines over a ten year period: a nominal balance line that rises steadily due to a low interest rate, and a real purchasing power line that declines because the interest rate is lower than the inflation rate, illustrating that a growing account balance can still represent shrinking real value.</title>
  <rect width="620" height="300" fill="#FBF8F1"/>

  <rect x="40" y="20" width="540" height="34" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="310" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">$10,000 starting balance, 10 years</text>

  <line x1="70" y1="250" x2="70" y2="80" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="70" y1="250" x2="560" y2="250" stroke="#2C4A3E" stroke-width="2"/>
  <text x="45" y="85" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">high</text>
  <text x="45" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">low</text>

  <polyline points="70,220 200,200 330,180 460,160 560,145" fill="none" stroke="#2C4A3E" stroke-width="3"/>
  <text x="555" y="140" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2C4A3E">Nominal balance</text>

  <polyline points="70,220 200,225 330,232 460,240 560,246" fill="none" stroke="#B5493A" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="555" y="272" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#B5493A">Real purchasing power</text>

  <text x="310" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Balance rises with 2% interest, but real value falls because inflation runs at 4%.</text>
</svg>
