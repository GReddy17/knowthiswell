<svg viewBox="0 0 560 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chatTrainTitle">
  <title id="chatTrainTitle">The three stages of training a chatbot: pretraining on trillions of tokens produces a base model; supervised fine-tuning on human-written example answers teaches the assistant format; preference tuning, where people rank answers and a reward model learns the rankings, tunes the chatbot toward preferred answers.</title>
  <rect width="560" height="500" fill="#FBF8F1"/>
  <rect x="100" y="20" width="360" height="76" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="44" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">1. Pretraining</text>
  <text x="280" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Trillions of tokens of text; predict the next token</text>
  <text x="280" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Result: a base model (knowledge + fluency)</text>
  <text x="280" y="116" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="100" y="126" width="360" height="76" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">2. Supervised fine-tuning</text>
  <text x="280" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Example prompts + answers written by people</text>
  <text x="280" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Result: learns the shape of a helpful reply</text>
  <text x="280" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="100" y="232" width="360" height="110" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">3. Preference tuning (e.g. RLHF)</text>
  <text x="280" y="276" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Model writes several answers → people rank them</text>
  <text x="280" y="294" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Reward model learns the rankings</text>
  <text x="280" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Chatbot tuned toward higher-scoring answers</text>
  <text x="280" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">(Constitutional AI: AI feedback guided by written principles)</text>
  <text x="280" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="150" y="372" width="260" height="50" rx="6" fill="#2C4A3E"/>
  <text x="280" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">The chat assistant you use</text>
  <text x="280" y="456" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Stage 1 uses most of the compute; stages 2 and 3 shape behavior.</text>
  <text x="280" y="474" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Preferred-sounding is not the same as verified-true.</text>
</svg>
