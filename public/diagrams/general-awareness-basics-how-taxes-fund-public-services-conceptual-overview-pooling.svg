<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="poolingTitle">
  <title id="poolingTitle">Many small icons representing individual taxpayers on the left, each with a small arrow flowing into a single large central pool labeled Public Budget, with arrows flowing out from the pool to three icons on the right labeled Roads, Schools, and Defense.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <g fill="#4A443C">
    <circle cx="50" cy="50" r="10"/>
    <circle cx="50" cy="90" r="10"/>
    <circle cx="50" cy="130" r="10"/>
    <circle cx="50" cy="170" r="10"/>
    <circle cx="50" cy="210" r="10"/>
  </g>
  <text x="50" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Taxpayers</text>

  <path d="M65 50 L280 128" stroke="#2C4A3E" stroke-width="1.4" fill="none"/>
  <path d="M65 90 L280 125" stroke="#2C4A3E" stroke-width="1.4" fill="none"/>
  <path d="M65 130 L280 130" stroke="#2C4A3E" stroke-width="1.4" fill="none"/>
  <path d="M65 170 L280 133" stroke="#2C4A3E" stroke-width="1.4" fill="none"/>
  <path d="M65 210 L280 135" stroke="#2C4A3E" stroke-width="1.4" fill="none"/>

  <ellipse cx="390" cy="130" rx="110" ry="60" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Public</text>
  <text x="390" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Budget</text>

  <path d="M500 110 L680 55" stroke="#2C4A3E" stroke-width="1.6" fill="none"/>
  <path d="M500 130 L680 130" stroke="#2C4A3E" stroke-width="1.6" fill="none"/>
  <path d="M500 150 L680 205" stroke="#2C4A3E" stroke-width="1.6" fill="none"/>

  <rect x="682" y="35" width="90" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="727" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Roads</text>
  <rect x="682" y="110" width="90" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="727" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Schools</text>
  <rect x="682" y="185" width="90" height="40" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="727" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Defense</text>
</svg>
