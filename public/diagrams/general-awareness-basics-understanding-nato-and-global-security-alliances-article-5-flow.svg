<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="natoTitle">
  <title id="natoTitle">A flow diagram showing an armed attack on one NATO member leading to consultation in the North Atlantic Council, then invocation of Article 5 by consensus, branching into separate boxes for how different individual members might respond — military forces, logistical support, or diplomatic support — emphasizing that the response is not uniform</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="20" y="30" width="180" height="70" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="110" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Armed attack on</text>
  <text x="110" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">one member</text>

  <text x="222" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="244" y="30" width="180" height="70" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="334" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">North Atlantic Council</text>
  <text x="334" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">consultation</text>

  <text x="446" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#4A443C">&#8594;</text>

  <rect x="468" y="30" width="200" height="70" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="568" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Article 5 invoked</text>
  <text x="568" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">by consensus</text>

  <line x1="568" y1="100" x2="568" y2="150" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="180" y1="150" x2="960" y2="150" stroke="#2C4A3E" stroke-width="1.6" transform="translate(-190,0)"/>
  <line x1="200" y1="150" x2="770" y2="150" stroke="#2C4A3E" stroke-width="1.6"/>

  <line x1="230" y1="150" x2="230" y2="190" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="500" y1="150" x2="500" y2="190" stroke="#2C4A3E" stroke-width="1.6"/>
  <line x1="740" y1="150" x2="740" y2="190" stroke="#2C4A3E" stroke-width="1.6"/>

  <rect x="130" y="190" width="200" height="90" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="230" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Member A:</text>
  <text x="230" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4A443C">military forces</text>
  <text x="230" y="263" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">deemed necessary</text>

  <rect x="400" y="190" width="200" height="90" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="500" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Member B:</text>
  <text x="500" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4A443C">logistical support</text>
  <text x="500" y="263" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">deemed necessary</text>

  <rect x="640" y="190" width="130" height="90" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.8"/>
  <text x="705" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Member C:</text>
  <text x="705" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4A443C">diplomatic</text>
  <text x="705" y="263" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">support</text>

  <text x="390" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Each member decides individually what assistance to provide — the response is not uniform.</text>
</svg>
