<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compatTitle">
  <title id="compatTitle">Diagram showing four layers that must each match between two devices for them to work together: physical connector, communication protocol, operating system support, and software format, illustrating that compatibility can fail at any single layer even if the others match</title>
  <rect width="640" height="340" fill="#FBF8F1"/>
  <text x="320" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2C4A3E">Four layers that all have to match, independently</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="60" y="55" width="520" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="80" y="88" font-size="13" font-weight="600" fill="#1F1B16">1. Physical connector</text>
    <text x="330" y="88" font-size="11.5" fill="#4A443C">does the plug shape fit the port?</text>

    <rect x="60" y="120" width="520" height="55" rx="8" fill="#F6F0E8" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="80" y="153" font-size="13" font-weight="600" fill="#1F1B16">2. Communication protocol</text>
    <text x="330" y="153" font-size="11.5" fill="#4A443C">do both sides speak the same signaling language?</text>

    <rect x="60" y="185" width="520" height="55" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
    <text x="80" y="218" font-size="13" font-weight="600" fill="#1F1B16">3. Operating system support</text>
    <text x="330" y="218" font-size="11.5" fill="#4A443C">does the OS have a driver for this device?</text>

    <rect x="60" y="250" width="520" height="55" rx="8" fill="#E3DCC9" stroke="#2C4A3E" stroke-width="1.5"/>
    <text x="80" y="283" font-size="13" font-weight="600" fill="#1F1B16">4. Software / file format</text>
    <text x="330" y="283" font-size="11.5" fill="#4A443C">can the program actually open this file or feature?</text>
  </g>
</svg>
