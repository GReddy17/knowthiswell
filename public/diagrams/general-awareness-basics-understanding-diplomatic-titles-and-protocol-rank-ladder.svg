<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diploRankTitle">
  <title id="diploRankTitle">A vertical ladder diagram showing diplomatic ranks from top to bottom: ambassador, accredited to a head of state and most senior; envoy or minister, a less common middle rank; and charge d'affaires, accredited to a foreign ministry rather than a head of state. A separate branch off to the side shows the consular track — consul-general, consul, vice-consul — labeled as a parallel function focused on citizen services and trade rather than political representation</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="200" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Diplomatic track</text>
  <rect x="90" y="50" width="220" height="55" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="73" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Ambassador</text>
  <text x="200" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">accredited to head of state</text>

  <line x1="200" y1="105" x2="200" y2="130" stroke="#2C4A3E" stroke-width="1.6"/>
  <rect x="90" y="130" width="220" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Envoy / Minister</text>
  <text x="200" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">less common middle rank</text>

  <line x1="200" y1="185" x2="200" y2="210" stroke="#2C4A3E" stroke-width="1.6"/>
  <rect x="90" y="210" width="220" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="200" y="233" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Charg&#233; d&#8217;affaires</text>
  <text x="200" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">accredited to foreign ministry,</text>
  <text x="200" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">not head of state</text>

  <line x1="390" y1="60" x2="390" y2="240" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="580" y="35" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A">Consular track (parallel)</text>
  <rect x="470" y="50" width="220" height="45" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="77" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Consul-General</text>
  <rect x="470" y="105" width="220" height="45" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Consul</text>
  <rect x="470" y="160" width="220" height="45" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Vice-Consul</text>
  <text x="580" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">citizen services and trade,</text>
  <text x="580" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">not political representation</text>

  <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Two separate rank ladders, running in parallel with different functions.</text>
</svg>
