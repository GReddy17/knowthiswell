<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="needsWantsTitle">
  <title id="needsWantsTitle">A decision flowchart starting with the question: if this spending stopped entirely, would there be a real, near-term consequence to health, safety, housing, or ability to work? A Yes answer leads to a box labeled Need. A No answer leads to a box labeled Want.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <rect x="180" y="30" width="420" height="90" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">If this spending stopped entirely, would there be a</text>
  <text x="390" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">real, near-term consequence to health, safety, or income?</text>

  <text x="230" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">Yes</text>
  <line x1="280" y1="120" x2="180" y2="170" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="60" y="175" width="240" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="180" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F1B16">Need</text>

  <text x="555" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A5A44">No</text>
  <line x1="500" y1="120" x2="600" y2="170" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="480" y="175" width="240" height="60" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F1B16">Want</text>

  <text x="390" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">One functional question, applied honestly, does most of the classification work.</text>
</svg>
