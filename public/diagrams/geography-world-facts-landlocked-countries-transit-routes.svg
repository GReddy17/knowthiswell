<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="landlockedTransitTitle">
  <title id="landlockedTransitTitle">Simplified map showing landlocked Switzerland with no coastline, connected by a highlighted transit corridor along the Rhine River through Germany to the seaport of Rotterdam in the Netherlands, illustrating the extra border crossing and dependence on foreign infrastructure landlocked trade requires compared to a direct coastal shipment</title>
  <rect width="640" height="420" fill="#FBF8F1"/>
  <text x="320" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">How a landlocked country's goods reach the sea</text>

  <!-- sea -->
  <rect x="40" y="60" width="150" height="300" fill="#5B7A99" opacity="0.22"/>
  <text x="115" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#3F5E78">North Sea</text>

  <!-- Netherlands (coastal transit country) -->
  <path d="M 190,150 L 235,140 L 260,165 L 250,200 L 200,205 L 185,175 Z" fill="#5B7A99" opacity="0.28" stroke="#3F5E78" stroke-width="1"/>
  <text x="222" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Netherlands</text>

  <!-- seaport -->
  <circle cx="205" cy="172" r="6" fill="#C9412C" stroke="#FBF8F1" stroke-width="1.3"/>
  <text x="205" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1F1B16">Rotterdam</text>
  <text x="205" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">(seaport)</text>

  <!-- Germany (transit country) -->
  <path d="M 260,165 L 340,145 L 400,175 L 405,260 L 350,300 L 285,280 L 250,200 Z" fill="#EDE7D8" stroke="#D8CFBB"/>
  <text x="330" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Germany</text>
  <text x="330" y="144" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">(transit country)</text>

  <!-- France (west) for context -->
  <path d="M 190,205 L 250,200 L 285,280 L 260,340 L 195,330 Z" fill="#EEF3EE" stroke="#D8CFBB"/>
  <text x="228" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">France</text>

  <!-- Switzerland: landlocked, center, highlighted -->
  <path d="M 285,280 L 350,300 L 385,320 L 355,355 L 300,350 L 270,320 Z" fill="#2C4A3E"/>
  <text x="325" y="325" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">Switzerland</text>
  <text x="325" y="339" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#EEF3EE">landlocked — no coastline</text>

  <!-- Austria/Italy neighbors for context, unlabeled small shapes -->
  <path d="M 385,320 L 430,315 L 440,345 L 400,360 L 355,355 Z" fill="#EDE7D8" stroke="#D8CFBB"/>

  <!-- transit corridor: Switzerland -> Rhine -> Germany -> Rotterdam -->
  <path d="M 320,315 Q 300,250 260,205 Q 235,185 205,172" fill="none" stroke="#B08D3E" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M 320,315 Q 300,250 260,205 Q 235,185 205,172" fill="none" stroke="#8B6F4E" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
  <circle cx="320" cy="315" r="4.5" fill="#2C4A3E"/>
  <text x="345" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#6B5636">Rhine River</text>
  <text x="345" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#6B5636">transit corridor</text>

  <!-- border-crossing markers along the route -->
  <g fill="#1F1B16">
    <rect x="280" y="248" width="5" height="7"/>
    <rect x="248" y="196" width="5" height="7"/>
  </g>
  <text x="255" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#4A443C">border crossing</text>

  <line x1="40" y1="378" x2="600" y2="378" stroke="#E3DCC9" stroke-width="1"/>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">
    <rect x="70" y="392" width="14" height="10" fill="#2C4A3E"/>
    <text x="90" y="401">Landlocked country (no direct route)</text>
    <line x1="330" y1="397" x2="360" y2="397" stroke="#B08D3E" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <text x="366" y="401">Road/rail/river transit route</text>
  </g>
  <text x="320" y="415" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#8B6F4E">Simplified example: Switzerland's exports reach Rotterdam via the Rhine, through Germany.</text>
</svg>
