<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="periodicTableTitle">
  <title id="periodicTableTitle">A simplified periodic table grid with most elements on the left and center shaded as metals, a thin diagonal staircase band of metalloids (boron, silicon, germanium, arsenic, antimony, tellurium) running from upper-left to lower-right, and the remaining upper-right elements shaded as non-metals</title>

  <rect x="0" y="0" width="640" height="400" fill="#FBF8F1"/>
  <text x="320" y="30" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="19" font-weight="600" fill="#1F1B16">Metals, Metalloids, and Non-Metals</text>

  <!-- grid: 18 columns x 7 rows, cell 32x32, starting x=20,y=50 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" text-anchor="middle">
    <!--
      We'll draw a simplified 18x7 grid. Color per cell:
      metal = #EEF3EE with #2C4A3E border
      metalloid = #F4E9D6 with #C9663F border (staircase: B(r2,c13), Si(r3,c14), Ge(r4,c14), As(r4,c15), Sb(r5,c15), Te(r5,c16), also At r6,c17 sometimes but keep to 6 listed)
      nonmetal = #FBEDEA with #4A7A9E... use blue for nonmetal per palette allowance
      Actually spec says non-metal shading distinct; use a muted blue #E4ECF2 border #4A7A9E
    -->
  </g>

  <!-- helper: cellX(col) = 20 + (col-1)*33 ; cellY(row) = 55 + (row-1)*33 ; col 1..18, row1..7 -->
  <g stroke-width="1">
    <!-- Row 1: H (col1, nonmetal), He (col18, nonmetal) -->
    <rect x="20" y="55" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <text x="35" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1F1B16">H</text>
    <rect x="581" y="55" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <text x="596" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1F1B16">He</text>

    <!-- Row 2: cols1-2 metal, cols13-17 mix, col18 nonmetal -->
    <rect x="20" y="88" width="30" height="30" fill="#EEF3EE" stroke="#2C4A3E"/>
    <rect x="53" y="88" width="30" height="30" fill="#EEF3EE" stroke="#2C4A3E"/>
    <!-- gap cols 3-12 -->
    <rect x="416" y="88" width="30" height="30" fill="#F4E9D6" stroke="#C9663F"/>
    <text x="431" y="107" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1F1B16">B</text>
    <rect x="449" y="88" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="482" y="88" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="515" y="88" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="548" y="88" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="581" y="88" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>

    <!-- Row 3: cols1-2 metal, col13 metal, col14 metalloid Si, col15-17 nonmetal, col18 nonmetal -->
    <rect x="20" y="121" width="30" height="30" fill="#EEF3EE" stroke="#2C4A3E"/>
    <rect x="53" y="121" width="30" height="30" fill="#EEF3EE" stroke="#2C4A3E"/>
    <rect x="416" y="121" width="30" height="30" fill="#EEF3EE" stroke="#2C4A3E"/>
    <rect x="449" y="121" width="30" height="30" fill="#F4E9D6" stroke="#C9663F"/>
    <text x="464" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1F1B16">Si</text>
    <rect x="482" y="121" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="515" y="121" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="548" y="121" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="581" y="121" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>

    <!-- Row 4: cols1-10 metal (transition), col11-13 metal, col14 metalloid Ge, col15 metalloid As, col16-17 nonmetal, col18 nonmetal -->
    <g fill="#EEF3EE" stroke="#2C4A3E">
      <rect x="20" y="154" width="30" height="30"/>
      <rect x="53" y="154" width="30" height="30"/>
      <rect x="86" y="154" width="30" height="30"/>
      <rect x="119" y="154" width="30" height="30"/>
      <rect x="152" y="154" width="30" height="30"/>
      <rect x="185" y="154" width="30" height="30"/>
      <rect x="218" y="154" width="30" height="30"/>
      <rect x="251" y="154" width="30" height="30"/>
      <rect x="284" y="154" width="30" height="30"/>
      <rect x="317" y="154" width="30" height="30"/>
      <rect x="350" y="154" width="30" height="30"/>
      <rect x="383" y="154" width="30" height="30"/>
      <rect x="416" y="154" width="30" height="30"/>
    </g>
    <rect x="449" y="154" width="30" height="30" fill="#F4E9D6" stroke="#C9663F"/>
    <text x="464" y="173" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1F1B16">Ge</text>
    <rect x="482" y="154" width="30" height="30" fill="#F4E9D6" stroke="#C9663F"/>
    <text x="497" y="173" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1F1B16">As</text>
    <rect x="515" y="154" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="548" y="154" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="581" y="154" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>

    <!-- Row 5: cols1-14 metal, col15 metalloid Sb, col16 metalloid Te, col17 nonmetal, col18 nonmetal -->
    <g fill="#EEF3EE" stroke="#2C4A3E">
      <rect x="20" y="187" width="30" height="30"/>
      <rect x="53" y="187" width="30" height="30"/>
      <rect x="86" y="187" width="30" height="30"/>
      <rect x="119" y="187" width="30" height="30"/>
      <rect x="152" y="187" width="30" height="30"/>
      <rect x="185" y="187" width="30" height="30"/>
      <rect x="218" y="187" width="30" height="30"/>
      <rect x="251" y="187" width="30" height="30"/>
      <rect x="284" y="187" width="30" height="30"/>
      <rect x="317" y="187" width="30" height="30"/>
      <rect x="350" y="187" width="30" height="30"/>
      <rect x="383" y="187" width="30" height="30"/>
      <rect x="416" y="187" width="30" height="30"/>
      <rect x="449" y="187" width="30" height="30"/>
    </g>
    <rect x="482" y="187" width="30" height="30" fill="#F4E9D6" stroke="#C9663F"/>
    <text x="497" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1F1B16">Sb</text>
    <rect x="515" y="187" width="30" height="30" fill="#F4E9D6" stroke="#C9663F"/>
    <text x="530" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1F1B16">Te</text>
    <rect x="548" y="187" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="581" y="187" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>

    <!-- Row 6: cols1-16 metal, col17 nonmetal (At treated as metal-leaning in some tables, keep simplified as metalloid-ish not required), col18 nonmetal -->
    <g fill="#EEF3EE" stroke="#2C4A3E">
      <rect x="20" y="220" width="30" height="30"/>
      <rect x="53" y="220" width="30" height="30"/>
      <rect x="86" y="220" width="30" height="30"/>
      <rect x="119" y="220" width="30" height="30"/>
      <rect x="152" y="220" width="30" height="30"/>
      <rect x="185" y="220" width="30" height="30"/>
      <rect x="218" y="220" width="30" height="30"/>
      <rect x="251" y="220" width="30" height="30"/>
      <rect x="284" y="220" width="30" height="30"/>
      <rect x="317" y="220" width="30" height="30"/>
      <rect x="350" y="220" width="30" height="30"/>
      <rect x="383" y="220" width="30" height="30"/>
      <rect x="416" y="220" width="30" height="30"/>
      <rect x="449" y="220" width="30" height="30"/>
      <rect x="482" y="220" width="30" height="30"/>
      <rect x="515" y="220" width="30" height="30"/>
    </g>
    <rect x="548" y="220" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>
    <rect x="581" y="220" width="30" height="30" fill="#E4ECF2" stroke="#4A7A9E"/>

    <!-- Row 7 (bottom, lanthanide/actinide placeholder row): all metal, shorter row cols1-15 -->
    <g fill="#EEF3EE" stroke="#2C4A3E">
      <rect x="20" y="253" width="30" height="30"/>
      <rect x="53" y="253" width="30" height="30"/>
      <rect x="86" y="253" width="30" height="30"/>
    </g>
  </g>

  <!-- staircase overlay line -->
  <path d="M 449,88 L 449,121 L 482,121 L 482,154 L 515,154 L 515,187 L 548,187 L 548,220" fill="none" stroke="#C9663F" stroke-width="2" stroke-dasharray="5 3" opacity="0.8"/>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <rect x="20" y="300" width="18" height="18" fill="#EEF3EE" stroke="#2C4A3E"/>
    <text x="44" y="314" fill="#1F1B16">Metals (~80% of elements)</text>
    <rect x="20" y="326" width="18" height="18" fill="#F4E9D6" stroke="#C9663F"/>
    <text x="44" y="340" fill="#1F1B16">Metalloids — B, Si, Ge, As, Sb, Te</text>
    <rect x="330" y="300" width="18" height="18" fill="#E4ECF2" stroke="#4A7A9E"/>
    <text x="354" y="314" fill="#1F1B16">Non-metals</text>
  </g>

  <text x="320" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The staircase line runs from boron down through the block — metalloids sit right on it</text>
</svg>
