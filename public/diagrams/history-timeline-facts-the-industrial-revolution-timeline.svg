<svg viewBox="0 0 1320 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of the Industrial Revolution from the spinning jenny and James Watt's improved steam engine around 1760 to 1770, through the early 1800s growth of factory towns like Manchester, the Luddite protests around 1811 to 1816, the expansion of railways in the 1830s, mid-19th century factory reform legislation limiting child labor, and the Second Industrial Revolution from about 1870 to 1914 bringing steel, electricity, and oil-based industry</title>
  <rect width="1320" height="230" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="660" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">A century and a half of machines reshaping work, cities, and daily life</text>

    <rect x="40" y="115" width="225" height="40" fill="#EEF3EE"/>
    <text x="152" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Spinning jenny &amp; steam engine</text>
    <text x="152" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Watt's improved engine patented</text>
    <text x="152" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1760s–1770s</text>

    <rect x="265" y="115" width="225" height="40" fill="#FBEDEA"/>
    <text x="377" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Factory towns grow</text>
    <text x="377" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Manchester and mill towns expand</text>
    <text x="377" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">early 1800s</text>

    <rect x="490" y="115" width="200" height="40" fill="#EDE7D8"/>
    <text x="590" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Luddite protests</text>
    <text x="590" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Workers resist mechanization</text>
    <text x="590" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1811–1816</text>

    <rect x="690" y="115" width="155" height="40" fill="#EEF3EE"/>
    <text x="767" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Railway expansion</text>
    <text x="767" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1830s</text>

    <rect x="845" y="115" width="185" height="40" fill="#FBEDEA"/>
    <text x="937" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Factory reform laws</text>
    <text x="937" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Limits on child labor</text>
    <text x="937" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">mid-1800s</text>

    <rect x="1030" y="115" width="250" height="40" fill="#EDE7D8"/>
    <text x="1155" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1F1B16">Second Industrial Revolution</text>
    <text x="1155" y="138" text-anchor="middle" font-size="9" fill="#4A443C">Steel, electricity, oil-based industry</text>
    <text x="1155" y="175" text-anchor="middle" font-size="10" fill="#8B6F4E">1870–1914</text>
  </g>
  <rect x="40" y="115" width="1240" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="265" y1="115" x2="265" y2="155" stroke="#1F1B16"/>
  <line x1="490" y1="115" x2="490" y2="155" stroke="#1F1B16"/>
  <line x1="690" y1="115" x2="690" y2="155" stroke="#1F1B16"/>
  <line x1="845" y1="115" x2="845" y2="155" stroke="#1F1B16"/>
  <line x1="1030" y1="115" x2="1030" y2="155" stroke="#1F1B16"/>
</svg>
