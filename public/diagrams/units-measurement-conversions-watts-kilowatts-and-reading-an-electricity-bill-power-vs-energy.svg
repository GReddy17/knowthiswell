<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wattsTitle">
  <title id="wattsTitle">A diagram showing a speedometer icon labeled watts (power, a rate) on the left, multiplied by a clock icon labeled hours running, with an equals sign pointing to a battery icon labeled kilowatt hours (energy, the total, what you're billed for) on the right.</title>
  <rect width="640" height="220" fill="#FBF8F1"/>

  <!-- Watts box -->
  <rect x="20" y="60" width="150" height="100" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="95" cy="100" r="22" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="95" y1="100" x2="107" y2="88" stroke="#B5493A" stroke-width="2.5"/>
  <text x="95" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Watts</text>
  <text x="95" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">power (a rate)</text>

  <text x="192" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">×</text>

  <!-- Hours box -->
  <rect x="212" y="60" width="150" height="100" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="287" cy="100" r="22" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="287" y1="100" x2="287" y2="86" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="287" y1="100" x2="297" y2="105" stroke="#2C4A3E" stroke-width="2"/>
  <text x="287" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Hours</text>
  <text x="287" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">time running</text>

  <text x="384" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">=</text>

  <!-- kWh box -->
  <rect x="404" y="60" width="200" height="100" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <rect x="480" y="88" width="48" height="26" rx="3" fill="none" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="528" y="95" width="6" height="12" fill="#2C4A3E"/>
  <text x="504" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Kilowatt-hours</text>
  <text x="504" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">energy — what you're billed for</text>

  <text x="320" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Rate × time = total — the same logic as speed × time = distance.</text>
</svg>
