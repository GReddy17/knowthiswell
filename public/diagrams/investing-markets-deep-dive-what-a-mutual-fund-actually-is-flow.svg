<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mutualFundFlowTitle">
  <title id="mutualFundFlowTitle">Money from many investors is pooled together, a professional manager invests the pool in a diversified basket of stocks and bonds, and each investor owns shares representing a proportional claim on the whole basket.</title>
  <rect width="560" height="300" fill="#FBF8F1"/>
  <rect x="30" y="40" width="150" height="55" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="105" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Many investors'</text>
  <text x="105" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">money pooled</text>
  <text x="195" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">→</text>
  <rect x="210" y="40" width="160" height="55" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="290" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Fund manager invests</text>
  <text x="290" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">per stated strategy</text>
  <text x="290" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="150" y="135" width="260" height="60" rx="6" fill="#2C4A3E"/>
  <text x="280" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">Diversified basket: many stocks,</text>
  <text x="280" y="175" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FBF8F1">bonds, or other securities</text>
  <text x="280" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#2C4A3E">↓</text>
  <rect x="140" y="225" width="280" height="55" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="248" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Each investor owns shares —</text>
  <text x="280" y="265" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">a proportional claim on the whole basket</text>
</svg>
