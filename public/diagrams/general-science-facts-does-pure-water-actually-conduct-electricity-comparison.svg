<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waterTitle">
  <title id="waterTitle">Diagram comparing pure water with almost no ions, conducting little current, versus tap water with dissolved mineral ions conducting current readily.</title>
  <rect width="780" height="240" fill="#FBF8F1"/>

  <text x="195" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Pure water: almost no ions</text>
  <rect x="60" y="50" width="270" height="150" fill="#DCE8EE" stroke="#1F1B16" stroke-width="1.5"/>
  <rect x="90" y="60" width="10" height="130" fill="#4A443C"/>
  <rect x="290" y="60" width="10" height="130" fill="#4A443C"/>
  <text x="195" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C6E8E">bulb: off / very dim</text>

  <text x="585" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Tap water: dissolved ions</text>
  <rect x="450" y="50" width="270" height="150" fill="#DCE8EE" stroke="#1F1B16" stroke-width="1.5"/>
  <rect x="480" y="60" width="10" height="130" fill="#4A443C"/>
  <rect x="680" y="60" width="10" height="130" fill="#4A443C"/>
  <circle cx="530" cy="90" r="5" fill="#C98A2C"/>
  <circle cx="560" cy="130" r="5" fill="#2C6E8E"/>
  <circle cx="600" cy="80" r="5" fill="#C98A2C"/>
  <circle cx="620" cy="150" r="5" fill="#2C6E8E"/>
  <circle cx="650" cy="110" r="5" fill="#C98A2C"/>
  <circle cx="580" cy="170" r="5" fill="#2C6E8E"/>
  <text x="585" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#C9542C">bulb: glows brightly</text>
</svg>
