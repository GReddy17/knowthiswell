<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="migrationFlowTitle">
  <title id="migrationFlowTitle">World map with curved arrows of varying thickness representing major documented international migration corridors, including Mexico to the United States, India and other South Asian countries to Gulf states, Bangladesh to India, and Ukraine to neighboring European countries, with arrow thickness roughly proportional to estimated migrant numbers along each route</title>
  <rect width="640" height="480" fill="#FBF8F1"/>

  <text x="320" y="28" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="16" font-weight="600" fill="#1F1B16">Major international migration corridors</text>

  <!-- base landmasses -->
  <g fill="#EDE7D8" stroke="#D8CFBB" stroke-width="1">
    <path d="M63,114 L102,110 L172,100 L196,104 L219,130 L234,150 L211,166 L196,200 L169,198 L177,222 L191,232 L157,210 L138,184 L127,154 L118,140 L87,130 L63,130 Z"/>
    <path d="M200,226 L227,230 L242,250 L266,266 L258,296 L230,320 L214,360 L211,330 L209,286 L194,258 L200,240 Z"/>
    <path d="M306,164 L306,178 L343,176 L364,178 L374,160 L382,140 L367,130 L351,110 L328,126 L312,150 Z"/>
    <path d="M294,208 L336,176 L370,188 L387,226 L399,226 L382,280 L374,300 L351,318 L339,286 L334,246 L304,238 L294,220 Z"/>
    <path d="M382,160 L390,220 L413,200 L429,180 L426,234 L444,210 L460,206 L468,210 L483,230 L507,200 L510,170 L530,150 L546,130 L476,96 L413,110 L390,140 Z"/>
    <path d="M496,294 L521,274 L541,272 L558,304 L553,324 L533,320 L499,318 Z"/>
  </g>

  <!-- corridor 1: Mexico -> United States (thick, large volume) -->
  <path d="M 128,182 Q 108,168 92,152" fill="none" stroke="#2C4A3E" stroke-width="5.5" stroke-linecap="round" marker-end="url(#mArrowG)"/>
  <circle cx="128" cy="182" r="3" fill="#20362D"/>
  <text x="150" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#20362D">Mexico</text>
  <text x="70" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#20362D">United States</text>

  <!-- corridor 2: India / South Asia -> Gulf states (thick) -->
  <path d="M 413,204 Q 400,196 388,187" fill="none" stroke="#B24A38" stroke-width="5" stroke-linecap="round" marker-end="url(#mArrowR)"/>
  <circle cx="413" cy="204" r="3" fill="#8A3626"/>
  <text x="424" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#8A3626">India / S. Asia</text>
  <text x="368" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#8A3626">Gulf states</text>

  <!-- corridor 3: Bangladesh -> India (thin, shorter distance) -->
  <path d="M 424,212 Q 415,220 405,225" fill="none" stroke="#5B7A99" stroke-width="3" stroke-linecap="round" marker-end="url(#mArrowB)"/>
  <circle cx="424" cy="212" r="2.5" fill="#3F5E78"/>
  <text x="440" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#3F5E78">Bangladesh</text>

  <!-- corridor 4: Ukraine -> neighboring Europe (medium) -->
  <path d="M 344,132 Q 330,126 318,122" fill="none" stroke="#8B6F4E" stroke-width="4" stroke-linecap="round" marker-end="url(#mArrowT)"/>
  <circle cx="344" cy="132" r="2.8" fill="#6B5636"/>
  <text x="358" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#6B5636">Ukraine</text>
  <text x="300" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="700" fill="#6B5636">Europe</text>

  <defs>
    <marker id="mArrowG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="mArrowR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#B24A38"/>
    </marker>
    <marker id="mArrowB" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#5B7A99"/>
    </marker>
    <marker id="mArrowT" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#8B6F4E"/>
    </marker>
  </defs>

  <line x1="40" y1="368" x2="600" y2="368" stroke="#E3DCC9" stroke-width="1"/>

  <!-- legend -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">
    <line x1="55" y1="390" x2="85" y2="390" stroke="#2C4A3E" stroke-width="5.5" stroke-linecap="round"/>
    <text x="92" y="393">Mexico &#8594; United States</text>
    <line x1="55" y1="412" x2="85" y2="412" stroke="#B24A38" stroke-width="5" stroke-linecap="round"/>
    <text x="92" y="415">South Asia &#8594; Gulf states</text>

    <line x1="330" y1="390" x2="360" y2="390" stroke="#8B6F4E" stroke-width="4" stroke-linecap="round"/>
    <text x="367" y="393">Ukraine &#8594; neighboring Europe</text>
    <line x1="330" y1="412" x2="360" y2="412" stroke="#5B7A99" stroke-width="3" stroke-linecap="round"/>
    <text x="367" y="415">Bangladesh &#8594; India</text>
  </g>

  <text x="320" y="438" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">Arrow thickness is roughly proportional to estimated migrant stock; routes and positions are simplified.</text>
  <text x="320" y="452" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">Not an exhaustive list of global migration corridors.</text>
</svg>
