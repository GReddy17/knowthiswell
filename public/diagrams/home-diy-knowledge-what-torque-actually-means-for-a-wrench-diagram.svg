<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="torqueWrenchTitle">
  <title id="torqueWrenchTitle">Two diagrams of a wrench turning a bolt: applying force straight down at the end of the handle, perpendicular to it, produces the full torque equal to force times lever-arm length, while applying the same force at an angle off perpendicular wastes part of it, so only the perpendicular component of the force actually turns the bolt.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="390" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Torque = force &#215; lever-arm length — and only the perpendicular part of the force counts</text>

  <!-- Panel A: perpendicular -->
  <circle cx="110" cy="95" r="11" fill="#2C4A3E"/>
  <line x1="110" y1="95" x2="430" y2="95" stroke="#4A443C" stroke-width="8" stroke-linecap="round"/>
  <text x="110" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2C4A3E">bolt (pivot)</text>
  <line x1="110" y1="135" x2="430" y2="135" stroke="#8B6F4E" stroke-width="1.5"/>
  <line x1="110" y1="129" x2="110" y2="141" stroke="#8B6F4E" stroke-width="1.5"/>
  <line x1="430" y1="129" x2="430" y2="141" stroke="#8B6F4E" stroke-width="1.5"/>
  <text x="270" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B6F4E">lever arm (r)</text>
  <line x1="430" y1="95" x2="430" y2="150" stroke="#2C4A3E" stroke-width="3" marker-end="url(#arrowTq1)"/>
  <text x="470" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#2C4A3E">Force (F)</text>
  <path d="M95,75 A 25,25 0 0 1 130,72" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowTq1)"/>
  <text x="390" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Force applied straight down, perpendicular to the handle: Torque = F &#215; r (maximum).</text>

  <!-- Panel B: angled -->
  <circle cx="110" cy="230" r="11" fill="#2C4A3E"/>
  <line x1="110" y1="230" x2="430" y2="230" stroke="#4A443C" stroke-width="8" stroke-linecap="round"/>
  <text x="110" y="257" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2C4A3E">bolt (pivot)</text>
  <line x1="430" y1="230" x2="465" y2="280" stroke="#8B6F4E" stroke-width="3" marker-end="url(#arrowTq2)"/>
  <text x="500" y="285" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8B6F4E">Applied force (F)</text>
  <line x1="430" y1="230" x2="430" y2="275" stroke="#2C4A3E" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrowTq1)"/>
  <text x="405" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#2C4A3E">effective part</text>
  <line x1="430" y1="230" x2="460" y2="230" stroke="#B0A98F" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="445" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">wasted part</text>

  <defs>
    <marker id="arrowTq1" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowTq2" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#8B6F4E"/>
    </marker>
  </defs>

  <text x="390" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Pulling at an angle wastes part of the effort: Torque = F &#215; r &#215; sin(&#952;), so only the perpendicular component turns the bolt.</text>
</svg>
