<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gpsTrilatTitle">
  <title id="gpsTrilatTitle">A diagram showing three satellites at the top, each broadcasting a signal shown as an expanding circle representing the calculated distance to a phone, with the three circles overlapping at a single point on the ground where the phone's location is determined, and a fourth satellite noted as needed to correct clock timing error.</title>
  <rect width="780" height="340" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Trilateration: three distances pinpoint one location</text>

  <!-- Satellites -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <circle cx="150" cy="60" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="150" y="64" text-anchor="middle" font-size="9" font-weight="700" fill="#1F1B16">S1</text>
    <circle cx="390" cy="45" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="390" y="49" text-anchor="middle" font-size="9" font-weight="700" fill="#1F1B16">S2</text>
    <circle cx="630" cy="60" r="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="630" y="64" text-anchor="middle" font-size="9" font-weight="700" fill="#1F1B16">S3</text>
  </g>

  <!-- distance circles (arcs, roughly overlapping near a common point) -->
  <circle cx="150" cy="60" r="190" fill="none" stroke="#2C4A3E" stroke-width="1.3" stroke-dasharray="4,4" opacity="0.7"/>
  <circle cx="390" cy="45" r="205" fill="none" stroke="#B5493A" stroke-width="1.3" stroke-dasharray="4,4" opacity="0.7"/>
  <circle cx="630" cy="60" r="190" fill="none" stroke="#8A6D3B" stroke-width="1.3" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- intersection point / phone -->
  <circle cx="390" cy="250" r="8" fill="#B5493A"/>
  <text x="390" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Your phone</text>
  <text x="390" y="298" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">the one point consistent with all three distances</text>

  <rect x="20" y="305" width="740" height="28" fill="none"/>
  <text x="390" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">Each satellite's circle = distance from signal travel time (c &#215; delay). A 4th satellite corrects the phone clock's timing error.</text>
</svg>
