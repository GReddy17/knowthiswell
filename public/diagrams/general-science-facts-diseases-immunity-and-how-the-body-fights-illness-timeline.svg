<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="immuneTitle">
  <title id="immuneTitle">Chart of immune response strength over time showing innate immunity rising sharply within hours to a moderate non-specific plateau, and adaptive immunity rising more slowly over days to a higher pathogen-specific peak, then declining to a persistent memory-cell baseline that enables a faster response on a second exposure</title>

  <rect x="0" y="0" width="640" height="420" fill="#FBF8F1"/>

  <!-- axes -->
  <line x1="80" y1="340" x2="600" y2="340" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="80" y2="40" stroke="#1F1B16" stroke-width="1.5"/>
  <path d="M 600,340 L 590,335 L 590,345 Z" fill="#1F1B16"/>
  <path d="M 80,40 L 75,50 L 85,50 Z" fill="#1F1B16"/>
  <text x="600" y="365" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Time since exposure →</text>
  <text x="60" y="40" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C" transform="rotate(-90 60 40)">Response strength →</text>

  <!-- x ticks -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C" text-anchor="middle">
    <line x1="150" y1="340" x2="150" y2="345" stroke="#1F1B16"/><text x="150" y="357">6h</text>
    <line x1="190" y1="340" x2="190" y2="345" stroke="#1F1B16"/><text x="190" y="357">24h</text>
    <line x1="310" y1="340" x2="310" y2="345" stroke="#1F1B16"/><text x="310" y="357">4d</text>
    <line x1="430" y1="340" x2="430" y2="345" stroke="#1F1B16"/><text x="430" y="357">8d</text>
    <line x1="520" y1="340" x2="520" y2="345" stroke="#1F1B16"/><text x="520" y="357">14d</text>
  </g>

  <!-- memory baseline dashed line -->
  <line x1="80" y1="220" x2="600" y2="220" stroke="#E3DCC9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="590" y="214" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">memory baseline</text>

  <!-- innate immunity curve -->
  <path d="M 80,340 C 95,260 105,150 130,145 C 180,138 260,155 310,175 C 350,195 390,240 430,280 C 460,305 500,325 600,335" fill="none" stroke="#2C4A3E" stroke-width="2.5"/>
  <circle cx="150" cy="147" r="4.5" fill="#2C4A3E"/>
  <text x="150" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#2C4A3E" font-weight="600">Innate immunity</text>
  <text x="150" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">rapid, non-specific</text>

  <!-- adaptive immunity curve -->
  <path d="M 80,340 C 130,338 170,332 200,320 C 240,300 280,240 340,150 C 380,95 400,72 430,68 C 460,72 490,110 520,160 C 550,195 580,215 600,220" fill="none" stroke="#C9412C" stroke-width="2.5"/>
  <circle cx="430" cy="68" r="4.5" fill="#C9412C"/>
  <text x="430" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#C9412C" font-weight="600">Adaptive immunity</text>
  <text x="430" y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">pathogen-specific peak</text>

  <text x="590" y="235" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">memory cells: faster 2nd response</text>
</svg>
