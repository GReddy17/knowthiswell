<svg viewBox="0 0 1090 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Timeline of the 19th-century age of empires from 1830 to 1914, showing British Crown rule in India from 1858, the Meiji Restoration in Japan from 1868, the 1884-85 Berlin Conference accelerating the Scramble for Africa, Japan's colonization of Taiwan in 1895 and Korea in 1910, the 1898 Spanish-American War, and the outbreak of World War I in 1914</title>
  <rect width="1090" height="220" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="545" y="26" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13.5" fill="#8B6F4E">Rival empires expand across three continents, then collide in 1914</text>

    <rect x="40" y="110" width="130" height="40" fill="#EEF3EE"/>
    <text x="105" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">British Crown rule</text>
    <text x="105" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">1858</text>

    <rect x="170" y="110" width="130" height="40" fill="#FBEDEA"/>
    <text x="235" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Meiji Restoration</text>
    <text x="235" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">1868</text>

    <rect x="300" y="110" width="150" height="40" fill="#EDE7D8"/>
    <text x="375" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Berlin Conference</text>
    <text x="375" y="133" text-anchor="middle" font-size="9" fill="#4A443C">Scramble for Africa</text>
    <text x="375" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">1884–85</text>

    <rect x="450" y="110" width="150" height="40" fill="#EEF3EE"/>
    <text x="525" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Japan colonizes Taiwan</text>
    <text x="525" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">1895</text>

    <rect x="600" y="110" width="150" height="40" fill="#FBEDEA"/>
    <text x="675" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Spanish–American War</text>
    <text x="675" y="133" text-anchor="middle" font-size="9" fill="#4A443C">US gains overseas territory</text>
    <text x="675" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">1898</text>

    <rect x="750" y="110" width="140" height="40" fill="#EDE7D8"/>
    <text x="820" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">Japan annexes Korea</text>
    <text x="820" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">1910</text>

    <rect x="890" y="110" width="160" height="40" fill="#EEF3EE"/>
    <text x="970" y="95" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1B16">World War I begins</text>
    <text x="970" y="133" text-anchor="middle" font-size="9" fill="#4A443C">Imperial rivalries erupt</text>
    <text x="970" y="170" text-anchor="middle" font-size="10" fill="#8B6F4E">1914</text>
  </g>
  <rect x="40" y="110" width="1010" height="40" fill="none" stroke="#1F1B16" stroke-width="1.5"/>
  <line x1="170" y1="110" x2="170" y2="150" stroke="#1F1B16"/>
  <line x1="300" y1="110" x2="300" y2="150" stroke="#1F1B16"/>
  <line x1="450" y1="110" x2="450" y2="150" stroke="#1F1B16"/>
  <line x1="600" y1="110" x2="600" y2="150" stroke="#1F1B16"/>
  <line x1="750" y1="110" x2="750" y2="150" stroke="#1F1B16"/>
  <line x1="890" y1="110" x2="890" y2="150" stroke="#1F1B16"/>
  <text x="40" y="205" font-size="10" fill="#4A443C">1830</text>
  <text x="1050" y="205" text-anchor="end" font-size="10" fill="#4A443C">1914</text>
</svg>
