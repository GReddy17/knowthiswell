<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="currencyFlowTitle">
  <title id="currencyFlowTitle">A flow diagram showing an amount of money starting at the quoted market exchange rate, then passing through a spread that reduces the effective rate, then through an explicit percentage fee, ending at a smaller final converted amount than the market rate alone would suggest.</title>
  <rect width="620" height="300" fill="#FBF8F1"/>

  <rect x="20" y="40" width="130" height="60" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="85" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">$500</text>
  <text x="85" y="83" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Market rate: 0.92</text>

  <path d="M150 70 L210 70" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="215" y="40" width="150" height="60" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="290" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Spread applied</text>
  <text x="290" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Effective rate: 0.92</text>

  <path d="M365 70 L425 70" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="430" y="40" width="150" height="60" rx="6" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="505" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Fee applied</text>
  <text x="505" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">3% conversion fee</text>

  <path d="M505 100 L505 150" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow1)"/>

  <rect x="410" y="155" width="190" height="60" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="505" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Final: €446.20</text>
  <text x="505" y="198" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">vs. €460 at raw market rate</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="310" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">The spread and fee each reduce the amount received below the raw market-rate figure.</text>
</svg>
