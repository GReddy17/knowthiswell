<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spacedRepTitle">
  <title id="spacedRepTitle">A timeline diagram showing five review points for the same flashcard, with the gap between each successful review growing longer each time: one day, then three days, then seven days, then fourteen days, then about a month, illustrating that spaced repetition intervals expand after each successful recall instead of staying fixed.</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <line x1="40" y1="140" x2="740" y2="140" stroke="#4A443C" stroke-width="2"/>

  <circle cx="60" cy="140" r="9" fill="#2C4A3E"/>
  <text x="60" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Day 0</text>
  <text x="60" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Learn</text>

  <circle cx="140" cy="140" r="9" fill="#2C4A3E"/>
  <text x="140" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Day 1</text>
  <text x="100" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">+1 day</text>

  <circle cx="260" cy="140" r="9" fill="#2C4A3E"/>
  <text x="260" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Day 4</text>
  <text x="200" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">+3 days</text>

  <circle cx="440" cy="140" r="9" fill="#2C4A3E"/>
  <text x="440" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Day 11</text>
  <text x="350" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">+7 days</text>

  <circle cx="720" cy="140" r="9" fill="#2C4A3E"/>
  <text x="720" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Day 25</text>
  <text x="580" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">+14 days</text>

  <text x="60" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">review</text>
  <text x="140" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">review</text>
  <text x="260" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">review</text>
  <text x="440" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">review</text>
  <text x="720" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">review → ~month gap next</text>

  <text x="390" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Each successful recall stretches the next gap further — the interval grows, it doesn't repeat.</text>
</svg>
