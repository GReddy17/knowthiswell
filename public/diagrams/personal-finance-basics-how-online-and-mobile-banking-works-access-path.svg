<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="onlineBankingTitle">
  <title id="onlineBankingTitle">A flow diagram showing a smartphone or laptop icon connecting through two sequential checkpoints, Encrypted Connection (TLS) and Multi-Factor Authentication, before reaching a central box labeled The Same Bank Account a Teller Would See, illustrating that digital banking is a protected path into one shared account rather than a separate system.</title>
  <rect width="800" height="220" fill="#FBF8F1"/>

  <rect x="20" y="80" width="150" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="95" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Phone / Laptop</text>
  <text x="95" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(customer device)</text>

  <line x1="172" y1="110" x2="222" y2="110" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="226" y="75" width="180" height="70" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="316" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Encrypted Connection</text>
  <text x="316" y="120" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(TLS)</text>

  <line x1="408" y1="110" x2="448" y2="110" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="452" y="75" width="190" height="70" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="547" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Multi-Factor</text>
  <text x="547" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1F1B16">Authentication</text>
  <text x="547" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(password + code)</text>

  <line x1="644" y1="110" x2="684" y2="110" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="688" y="55" width="105" height="110" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="740" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">The Same</text>
  <text x="740" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Account a</text>
  <text x="740" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">Teller Would</text>
  <text x="740" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">See</text>

  <text x="400" y="190" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Two checkpoints protect one shared account — not two separate systems</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
