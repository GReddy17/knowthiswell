<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ausOceaniaTitle">
  <title id="ausOceaniaTitle">A map showing Australia with its arid Outback interior shaded across roughly two-thirds of the continent, a tropical rainforest zone marked in the northeast around Queensland, temperate coastal zones in the southeast where most major cities sit, and alpine snowfield areas marked in the southeastern highlands, alongside a wider Pacific map showing Melanesia, Micronesia, and Polynesia as three labeled regions surrounding Australia and New Zealand</title>
  <rect width="640" height="460" fill="#FBF8F1"/>

  <text x="320" y="24" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="15.5" font-weight="600" fill="#1F1B16">Australia's climate zones and Oceania's three regions</text>

  <defs>
    <clipPath id="ausShape">
      <path d="M85,155 L145,120 L195,95 L225,120 L245,175 L255,225 L235,265 L195,278 L135,270 L95,245 L75,195 Z"/>
    </clipPath>
  </defs>

  <!-- Australia outline -->
  <path d="M85,155 L145,120 L195,95 L225,120 L245,175 L255,225 L235,265 L195,278 L135,270 L95,245 L75,195 Z"
        fill="#EDE7D8" stroke="#20362D" stroke-width="1.5"/>

  <g clip-path="url(#ausShape)">
    <rect x="70" y="90" width="200" height="200" fill="#C9A66B" opacity="0.55"/>
    <circle cx="215" cy="120" r="38" fill="#2C4A3E" opacity="0.55"/>
    <path d="M170,220 C210,205 245,220 250,255 L200,285 L160,265 Z" fill="#5B7A99" opacity="0.4"/>
    <circle cx="215" cy="235" r="14" fill="#EAF0F4" opacity="0.9" stroke="#5B7A99" stroke-width="1"/>
  </g>
  <path d="M85,155 L145,120 L195,95 L225,120 L245,175 L255,225 L235,265 L195,278 L135,270 L95,245 L75,195 Z"
        fill="none" stroke="#20362D" stroke-width="1.5"/>

  <!-- city dots -->
  <g fill="#1F1B16">
    <circle cx="205" cy="255" r="2.5"/>
    <circle cx="185" cy="268" r="2.5"/>
    <circle cx="222" cy="185" r="2.5"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#1F1B16">
    <text x="209" y="258">Sydney</text>
    <text x="160" y="278">Melbourne</text>
    <text x="226" y="182">Brisbane</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700">
    <text x="90" y="185" fill="#6B5636">Outback</text>
    <text x="90" y="196" fill="#6B5636" font-size="7.5" font-weight="400">arid / semi-arid, ~2/3 of continent</text>
    <text x="220" y="115" fill="#20362D">Tropical (Qld)</text>
    <text x="185" y="245" fill="#3F5E78">Temperate SE</text>
    <text x="222" y="234" fill="#3F5E78" font-size="7.5" font-weight="400">alpine</text>
  </g>
  <text x="150" y="300" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="12" font-weight="600" fill="#1F1B16">Australia</text>

  <!-- Pacific / Oceania panel -->
  <line x1="300" y1="55" x2="300" y2="420" stroke="#E3DCC9" stroke-width="1"/>
  <text x="470" y="55" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="13" font-weight="600" fill="#1F1B16">Oceania's three regions</text>

  <!-- mini Australia + NZ for reference -->
  <path d="M330,150 L365,130 L390,150 L395,180 L370,200 L340,195 Z" fill="#D8CFBB" stroke="#8B7E5E" stroke-width="0.8"/>
  <text x="360" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">Australia</text>
  <path d="M480,260 L490,270 L485,290 L475,282 Z" fill="#D8CFBB" stroke="#8B7E5E" stroke-width="0.8"/>
  <text x="482" y="302" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#4A443C">New Zealand</text>

  <!-- Melanesia -->
  <ellipse cx="400" cy="180" rx="55" ry="35" fill="none" stroke="#B24A38" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="#B24A38">
    <circle cx="385" cy="170" r="3"/>
    <circle cx="410" cy="165" r="3"/>
    <circle cx="420" cy="190" r="3"/>
    <circle cx="395" cy="195" r="3"/>
  </g>
  <text x="400" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8A3626">Melanesia</text>

  <!-- Micronesia -->
  <ellipse cx="460" cy="90" rx="60" ry="28" fill="none" stroke="#5B7A99" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="#5B7A99">
    <circle cx="420" cy="90" r="2.5"/>
    <circle cx="450" cy="80" r="2.5"/>
    <circle cx="480" cy="95" r="2.5"/>
    <circle cx="500" cy="82" r="2.5"/>
  </g>
  <text x="460" y="65" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#3F5E78">Micronesia</text>

  <!-- Polynesia: large triangular area east -->
  <path d="M 470,120 L 610,175 L 545,400 Z" fill="none" stroke="#8B6F4E" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="#8B6F4E">
    <circle cx="500" cy="180" r="2.5"/>
    <circle cx="540" cy="230" r="2.5"/>
    <circle cx="520" cy="300" r="2.5"/>
    <circle cx="555" cy="340" r="2.5"/>
    <circle cx="530" cy="370" r="2.5"/>
  </g>
  <text x="565" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#6B5636">Polynesia</text>

  <text x="470" y="440" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#8B6F4E">Region positions and boundaries are schematic, not exact.</text>
</svg>
