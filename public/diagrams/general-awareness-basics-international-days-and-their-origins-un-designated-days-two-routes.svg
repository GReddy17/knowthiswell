<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="twoRoutesTitle">
  <title id="twoRoutesTitle">A flowchart showing two parallel paths converging on a box labeled 'Officially recognized international day': the top path goes from 'Member state proposal' through 'UN General Assembly resolution', and the bottom path goes from 'Specialized agency mandate' through 'Agency governing body decision (e.g. WHO)'</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <!-- Top path -->
  <rect x="30" y="30" width="200" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="130" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Member state</text>
  <text x="130" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">proposal</text>
  <line x1="230" y1="60" x2="280" y2="60" stroke="#4A443C" stroke-width="2"/>
  <polygon points="288,60 276,54 276,66" fill="#4A443C"/>
  <rect x="290" y="30" width="220" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="400" y="55" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">UN General Assembly</text>
  <text x="400" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">resolution</text>

  <!-- Bottom path -->
  <rect x="30" y="220" width="200" height="60" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="130" y="245" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Specialized agency</text>
  <text x="130" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">mandate</text>
  <line x1="230" y1="250" x2="280" y2="250" stroke="#4A443C" stroke-width="2"/>
  <polygon points="288,250 276,244 276,256" fill="#4A443C"/>
  <rect x="290" y="220" width="220" height="60" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="400" y="242" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1F1B16">Agency governing body</text>
  <text x="400" y="259" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">decision (e.g. WHO)</text>

  <!-- Converge -->
  <line x1="510" y1="60" x2="580" y2="130" stroke="#4A443C" stroke-width="2"/>
  <line x1="510" y1="250" x2="580" y2="180" stroke="#4A443C" stroke-width="2"/>
  <polygon points="592,155 580,149 580,161" fill="#4A443C" transform="rotate(0)"/>

  <rect x="590" y="120" width="160" height="70" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="670" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Officially recognized</text>
  <text x="670" y="167" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">international day</text>

  <text x="390" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Both routes end in a documented, citable adoption — the difference is which body's mandate the topic falls under.</text>
</svg>
