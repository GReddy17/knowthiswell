<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gaCertTitle">
  <title id="gaCertTitle">What the Google Analytics Certification verifies and what it doesn't. Verified: GA4 event-based data model, properties and data streams, configuration, reports and explorations, key events and audiences, Google Ads linking. Not verified: tag setup and debugging on a live site, SQL and BigQuery, statistics and experiment design, privacy and consent law, turning data into decisions. Format as of September 2026: free on Skillshop, 80% to pass, 24-hour wait to retry, valid one year.</title>
  <rect width="640" height="430" fill="#FBF8F1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="20" y="16" width="600" height="44" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="320" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">The assessment (as of September 2026)</text>
    <text x="320" y="52" text-anchor="middle" font-size="11" fill="#1F1B16">Free on Google Skillshop · 80% to pass · 24-hour wait to retry · valid one year</text>

    <rect x="20" y="76" width="292" height="268" rx="6" fill="#FBF8F1" stroke="#2C4A3E" stroke-width="2"/>
    <rect x="20" y="76" width="292" height="36" rx="6" fill="#2C4A3E"/>
    <text x="166" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#FBF8F1">Verified: product knowledge</text>
    <g font-size="11" fill="#1F1B16">
      <text x="38" y="140">✓ GA4 event-based data model</text>
      <text x="38" y="172">✓ Properties and data streams</text>
      <text x="38" y="204">✓ Configuration settings</text>
      <text x="38" y="236">✓ Standard reports and explorations</text>
      <text x="38" y="268">✓ Key events and audiences</text>
      <text x="38" y="300">✓ Linking to Google Ads</text>
    </g>

    <rect x="328" y="76" width="292" height="268" rx="6" fill="#FBF8F1" stroke="#C9412C" stroke-width="2"/>
    <rect x="328" y="76" width="292" height="36" rx="6" fill="#C9412C"/>
    <text x="474" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#FBF8F1">Not verified: hands-on skill</text>
    <g font-size="11" fill="#1F1B16">
      <text x="346" y="140">✗ Tag setup and debugging on a live site</text>
      <text x="346" y="172">✗ SQL and BigQuery</text>
      <text x="346" y="204">✗ Statistics and experiment design</text>
      <text x="346" y="236">✗ Privacy and consent law</text>
      <text x="346" y="268">✗ Turning data into business decisions</text>
      <text x="346" y="300">✗ Universal Analytics (retired 2023)</text>
    </g>

    <rect x="20" y="360" width="600" height="50" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
    <text x="320" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">To cover the right-hand column: add a real GA4 project</text>
    <text x="320" y="398" text-anchor="middle" font-size="10" fill="#4A443C">Set it up, mark a key event, analyze a month of data, and show the decision it led to.</text>
  </g>
</svg>
