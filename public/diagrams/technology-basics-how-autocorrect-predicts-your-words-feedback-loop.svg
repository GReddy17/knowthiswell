<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autocorrectLoopTitle">
  <title id="autocorrectLoopTitle">A circular feedback loop diagram: you type a keystroke, the keyboard compares it against a dictionary and your personal word history, it suggests the most likely correction, you accept or reject that suggestion, and your choice updates the personal model used for the next keystroke.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>
  <text x="390" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F1B16">Autocorrect is a loop, not a one-time lookup</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">
    <rect x="55" y="45" width="150" height="55" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="130" y="68" text-anchor="middle">You type</text>
    <text x="130" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#4A443C">a keystroke</text>

    <rect x="315" y="45" width="150" height="55" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="390" y="68" text-anchor="middle">Compare</text>
    <text x="390" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#4A443C">to dictionary + your history</text>

    <rect x="575" y="45" width="150" height="55" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="650" y="68" text-anchor="middle">Suggest</text>
    <text x="650" y="86" text-anchor="middle" font-size="10.5" font-weight="400" fill="#4A443C">most likely word</text>

    <rect x="575" y="200" width="150" height="55" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
    <text x="650" y="223" text-anchor="middle">You accept</text>
    <text x="650" y="241" text-anchor="middle" font-size="10.5" font-weight="400" fill="#4A443C">or reject it</text>

    <rect x="315" y="200" width="150" height="55" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
    <text x="390" y="223" text-anchor="middle">Update</text>
    <text x="390" y="241" text-anchor="middle" font-size="10.5" font-weight="400" fill="#4A443C">personal word model</text>
  </g>

  <defs>
    <marker id="arrowAc" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2C4A3E"/>
    </marker>
  </defs>
  <path d="M205,72 L313,72" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowAc)"/>
  <path d="M465,72 L573,72" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowAc)"/>
  <path d="M650,100 L650,198" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowAc)"/>
  <path d="M573,227 L465,227" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowAc)"/>
  <path d="M315,222 C 200,210 130,160 130,102" fill="none" stroke="#B5493A" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowAc)"/>
  <text x="185" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#B5493A">feeds into your next keystroke</text>

  <text x="390" y="295" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">This is why autocorrect learns names and slang over time, and why a shared or reset device "forgets" your vocabulary.</text>
</svg>
