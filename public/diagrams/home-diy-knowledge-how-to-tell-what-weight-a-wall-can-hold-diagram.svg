<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wallWeightFlowTitle">
  <title id="wallWeightFlowTitle">A decision flow for judging what weight a wall can hold. First find out what is behind the surface — a solid stud or joist versus hollow drywall. If a stud is available, mount into solid wood or metal framing, which can support most household loads directly. If only hollow wall is available, check whether the load is light, moderate, or heavy: light loads suit a basic hollow-wall anchor, moderate loads suit a toggle-style anchor, and heavy or safety-critical loads should always be moved to a stud or joist, spread across multiple anchors, or backed with added blocking rather than trusted to a single hollow-wall anchor.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <text x="390" y="26" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Deciding what a wall can hold: a quick decision path</text>

  <rect x="310" y="45" width="160" height="46" rx="6" fill="#2C4A3E"/>
  <text x="390" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBF8F1">What&apos;s behind the</text>
  <text x="390" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBF8F1">wall surface?</text>

  <line x1="390" y1="91" x2="200" y2="130" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowWW1)"/>
  <text x="270" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">stud / joist found</text>
  <line x1="390" y1="91" x2="580" y2="130" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowWW1)"/>
  <text x="510" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#4A443C">hollow wall only</text>

  <rect x="110" y="135" width="180" height="50" rx="6" fill="#4A443C"/>
  <text x="200" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FBF8F1">Mount directly into</text>
  <text x="200" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FBF8F1">the solid framing —</text>
  <text x="200" y="181" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">handles most loads.</text>

  <rect x="490" y="135" width="180" height="50" rx="6" fill="#8B6F4E"/>
  <text x="580" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FBF8F1">How heavy, and how</text>
  <text x="580" y="169" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FBF8F1">much risk if it fails?</text>

  <line x1="500" y1="185" x2="400" y2="235" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowWW1)"/>
  <text x="425" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">light</text>
  <line x1="580" y1="185" x2="580" y2="235" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowWW1)"/>
  <text x="600" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">moderate</text>
  <line x1="660" y1="185" x2="720" y2="235" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowWW1)"/>
  <text x="700" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">heavy / risky</text>

  <rect x="320" y="240" width="160" height="55" rx="6" fill="#2C4A3E"/>
  <text x="400" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FBF8F1">Light hollow-wall</text>
  <text x="400" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">anchor — small frames,</text>
  <text x="400" y="287" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">light decor.</text>

  <rect x="500" y="240" width="160" height="55" rx="6" fill="#4A443C"/>
  <text x="580" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FBF8F1">Toggle-style anchor —</text>
  <text x="580" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">shelves, curtain rods,</text>
  <text x="580" y="287" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">mid-weight items.</text>

  <rect x="650" y="240" width="120" height="70" rx="6" fill="#8B6F4E"/>
  <text x="710" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FBF8F1">Find a stud,</text>
  <text x="710" y="271" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FBF8F1">add blocking, or</text>
  <text x="710" y="284" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FBF8F1">spread the load —</text>
  <text x="710" y="297" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">never one light anchor.</text>

  <defs>
    <marker id="arrowWW1" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
