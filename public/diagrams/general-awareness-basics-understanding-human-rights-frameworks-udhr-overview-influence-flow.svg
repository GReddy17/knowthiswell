<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="udhrTitle">
  <title id="udhrTitle">A flow diagram starting with a box labeled UDHR 1948, Non-Binding Declaration. Two arrows branch from it: one to a box labeled Binding UN Treaties, e.g. ICCPR, Ratified Country by Country, and another to a box labeled National Constitutions, UDHR Language Adopted Domestically. Both branches lead down to a final box labeled Actual Enforceable Legal Rights.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="290" y="25" width="200" height="60" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">UDHR 1948</text>
  <text x="390" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Non-Binding Declaration</text>

  <path d="M 340 85 L 200 145" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>
  <path d="M 440 85 L 580 145" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>

  <rect x="70" y="147" width="260" height="65" rx="9" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="200" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Binding UN Treaties</text>
  <text x="200" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">(e.g. ICCPR)</text>
  <text x="200" y="202" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">Ratified Country by Country</text>

  <rect x="450" y="147" width="260" height="65" rx="9" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="580" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">National Constitutions</text>
  <text x="580" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">UDHR Language Adopted Domestically</text>

  <path d="M 200 212 L 340 260" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>
  <path d="M 580 212 L 440 260" stroke="#2C4A3E" stroke-width="1.5" fill="none"/>

  <rect x="255" y="262" width="270" height="50" rx="9" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="390" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Actual Enforceable Legal Rights</text>
</svg>
