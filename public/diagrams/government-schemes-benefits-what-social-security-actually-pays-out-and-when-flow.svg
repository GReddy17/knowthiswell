<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ssaFlowTitle">
  <title id="ssaFlowTitle">Benefit amount by claiming age: age 62 gives a permanently reduced benefit, full retirement age gives the full calculated benefit, and delaying to age 70 gives a permanently increased benefit.</title>
  <rect width="560" height="260" fill="#FBF8F1"/>
  <rect x="20" y="120" width="150" height="90" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="95" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Age 62</text>
  <text x="95" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Permanently</text>
  <text x="95" y="183" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">reduced benefit</text>
  <rect x="200" y="85" width="160" height="90" rx="6" fill="#2C4A3E"/>
  <text x="280" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">Full retirement age</text>
  <text x="280" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">(66-67)</text>
  <text x="280" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">Full calculated</text>
  <text x="280" y="163" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#FBF8F1">benefit (PIA)</text>
  <rect x="390" y="40" width="150" height="90" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="465" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Age 70</text>
  <text x="465" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">Permanently</text>
  <text x="465" y="103" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">increased benefit</text>
  <text x="280" y="225" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">↑ Later claiming age → higher permanent monthly benefit</text>
</svg>
