<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quantifyTitle">
  <title id="quantifyTitle">A before-and-after diagram showing a vague duty statement such as 'responsible for sales' transformed step by step into a quantified achievement by finding a baseline number, a result number, and stating the change or scale explicitly.</title>
  <rect width="780" height="240" fill="#FBF8F1"/>

  <rect x="30" y="80" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="130" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">"Responsible for</text>
  <text x="130" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">regional sales"</text>
  <text x="130" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">no scale given</text>

  <line x1="230" y1="120" x2="278" y2="120" stroke="#4A443C" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="280" y="60" width="220" height="120" rx="8" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="2"/>
  <text x="390" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Find the numbers</text>
  <text x="300" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Baseline: $1.2M/year</text>
  <text x="300" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Result: $1.6M/year</text>
  <text x="300" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#1F1B16">Change: +33%</text>

  <line x1="500" y1="120" x2="548" y2="120" stroke="#4A443C" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="550" y="70" width="200" height="100" rx="8" fill="#2C4A3E"/>
  <text x="650" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">"Grew regional</text>
  <text x="650" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">sales from $1.2M</text>
  <text x="650" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">to $1.6M (33%)"</text>
  <text x="650" y="156" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#FBF8F1">gives a real scale</text>

  <text x="390" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Same underlying work — the only thing that changed is whether a scale is visible.</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
