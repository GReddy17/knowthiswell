<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zeroBasedTitle">
  <title id="zeroBasedTitle">A vertical diagram showing income at the top as a starting number, with a series of subtraction steps for each assignment category — rent, groceries, savings, debt payment, discretionary spending — stacking downward until the running total reaches exactly zero at the bottom, labeled every dollar assigned.</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <rect x="200" y="15" width="240" height="45" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="320" y="43" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Income: $4,000</text>

  <text x="320" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">− Rent $1,200</text>
  <text x="320" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">− Groceries $400</text>
  <text x="320" y="130" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">− Utilities $150</text>
  <text x="320" y="155" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">− Car payment $320</text>
  <text x="320" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">− Debt payment $150</text>
  <text x="320" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">− Savings $500</text>
  <text x="320" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">− Dining/Entertainment $280</text>
  <text x="320" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">− Other discretionary $1,000</text>

  <line x1="240" y1="270" x2="400" y2="270" stroke="#2C4A3E" stroke-width="2"/>

  <rect x="200" y="290" width="240" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2.5"/>
  <text x="320" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F1B16">Remaining: $0</text>
  <text x="320" y="335" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#2C4A3E">Every dollar assigned</text>

  <text x="320" y="395" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Savings and debt payments count as assignments too — zero means zero unassigned, not zero spent.</text>
</svg>
