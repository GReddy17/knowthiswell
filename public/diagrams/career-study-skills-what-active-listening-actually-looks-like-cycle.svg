<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="listeningCycleTitle">
  <title id="listeningCycleTitle">A cycle diagram showing four repeating steps of active listening: hearing what someone says, interpreting its meaning and intent, reflecting it back in your own words, and confirming or adjusting based on their response, with an arrow looping back to the start to show the cycle repeats for as long as the conversation continues.</title>
  <rect width="780" height="240" fill="#FBF8F1"/>

  <rect x="40" y="45" width="150" height="75" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="115" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Hear</text>
  <text x="115" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">take in the words</text>
  <text x="115" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">and the tone</text>

  <line x1="190" y1="82" x2="218" y2="82" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowListen)"/>

  <rect x="230" y="45" width="150" height="75" rx="8" fill="#FFFFFF" stroke="#4A443C" stroke-width="2"/>
  <text x="305" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Interpret</text>
  <text x="305" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">read meaning</text>
  <text x="305" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">and intent</text>

  <line x1="380" y1="82" x2="408" y2="82" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowListen)"/>

  <rect x="420" y="45" width="150" height="75" rx="8" fill="#2C4A3E"/>
  <text x="495" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Reflect back</text>
  <text x="495" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">paraphrase what</text>
  <text x="495" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">you heard</text>

  <line x1="570" y1="82" x2="598" y2="82" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowListen)"/>

  <rect x="610" y="45" width="150" height="75" rx="8" fill="#8B6F4E"/>
  <text x="685" y="78" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FBF8F1">Confirm / adjust</text>
  <text x="685" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">check you got</text>
  <text x="685" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#FBF8F1">it right</text>

  <path d="M 685 122 C 685 175, 115 175, 115 122" fill="none" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowListen)"/>
  <text x="400" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">loop continues for as long as the other person keeps talking</text>

  <text x="390" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Skipping the reflect-back step is the shortcut that lets misunderstandings go unnoticed.</text>

  <defs>
    <marker id="arrowListen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
