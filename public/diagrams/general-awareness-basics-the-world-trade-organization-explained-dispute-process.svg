<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wtoDisputeTitle">
  <title id="wtoDisputeTitle">A horizontal flow diagram showing four stages of a WTO trade dispute: Consultations (60 days, direct negotiation between the two governments), Panel (independent experts review and issue a report), Appeal (legal review, though non-functional since 2019 due to a blocked Appellate Body), and Implementation or Retaliation (the losing member must comply, or the winning member can be authorized to impose proportionate retaliatory tariffs).</title>
  <rect width="900" height="260" fill="#FBF8F1"/>
  <text x="450" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">WTO Dispute Settlement: Four Stages</text>

  <rect x="20" y="70" width="190" height="120" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="115" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">1. Consultations</text>
  <text x="115" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">60-day window</text>
  <text x="115" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Direct negotiation</text>
  <text x="115" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">between the two</text>
  <text x="115" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">governments</text>

  <text x="230" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">→</text>

  <rect x="250" y="70" width="190" height="120" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="345" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">2. Panel</text>
  <text x="345" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Independent experts</text>
  <text x="345" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">review evidence</text>
  <text x="345" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Issues a report</text>
  <text x="345" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">(~1 year typical)</text>

  <text x="460" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">→</text>

  <rect x="480" y="70" width="190" height="120" rx="10" fill="#EDE7D8" stroke="#B5493A" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="575" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">3. Appeal</text>
  <text x="575" y="118" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Legal review of</text>
  <text x="575" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">the panel report</text>
  <text x="575" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#B5493A">Stalled since 2019 —</text>
  <text x="575" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#B5493A">Appellate Body blocked</text>

  <text x="690" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#4A443C">→</text>

  <rect x="710" y="70" width="180" height="120" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="800" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">4. Implementation</text>
  <text x="800" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">or Retaliation</text>
  <text x="800" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Comply, or the</text>
  <text x="800" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">winner may be</text>
  <text x="800" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">authorized to</text>
  <text x="800" y="182" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">retaliate</text>

  <text x="450" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Most disputes actually resolve during or shortly after consultations, well before reaching a panel report.</text>
</svg>
