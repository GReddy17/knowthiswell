<svg viewBox="0 0 780 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="raiseTimingTitle">
  <title id="raiseTimingTitle">A flow diagram showing an annual compensation cycle as a timeline with a budget-planning window, illustrating that a raise request made before that window closes can be included in the cycle's proposal, while a request made after the budget is finalized typically has to wait for the next cycle unless a real off-cycle trigger applies.</title>
  <rect width="780" height="240" fill="#FBF8F1"/>

  <text x="390" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Compensation budget cycle (one year)</text>

  <line x1="50" y1="120" x2="730" y2="120" stroke="#4A443C" stroke-width="2"/>

  <rect x="50" y="105" width="220" height="30" rx="6" fill="#2C4A3E"/>
  <text x="160" y="125" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBF8F1">Budget-planning window</text>

  <rect x="290" y="105" width="15" height="30" fill="#8B6F4E"/>
  <text x="298" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">budget set</text>

  <line x1="330" y1="70" x2="330" y2="103" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowRT)"/>
  <circle cx="330" cy="65" r="9" fill="#2C4A3E"/>
  <text x="330" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Request A</text>
  <text x="255" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2C4A3E">asked before budget set —</text>
  <text x="255" y="193" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#2C4A3E">can be included this cycle</text>

  <line x1="560" y1="70" x2="560" y2="103" stroke="#4A443C" stroke-width="2" marker-end="url(#arrowRT)"/>
  <circle cx="560" cy="65" r="9" fill="#8B6F4E"/>
  <text x="560" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Request B</text>
  <text x="600" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">asked after budget set —</text>
  <text x="600" y="193" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#8B6F4E">waits for next cycle</text>

  <text x="390" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">Same case, different timing — only one lands inside the open budget window.</text>

  <defs>
    <marker id="arrowRT" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A443C"/>
    </marker>
  </defs>
</svg>
