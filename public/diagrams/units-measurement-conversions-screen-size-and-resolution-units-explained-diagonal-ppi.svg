<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screenSizeTitle">
  <title id="screenSizeTitle">A rectangle representing a screen with a diagonal line drawn corner to corner labeled as the measured screen size, alongside a small zoomed-in grid of pixels labeled pixels per inch, showing that screen size and sharpness are two separate measurements.</title>
  <rect width="780" height="280" fill="#FBF8F1"/>
  <text x="30" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F1B16">Screen size (diagonal) vs. sharpness (pixels per inch) are different measurements</text>

  <!-- Screen rectangle with diagonal -->
  <rect x="40" y="60" width="280" height="170" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="40" y1="60" x2="320" y2="230" stroke="#B5493A" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="180" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A" transform="rotate(31 180 150)">diagonal = "size"</text>
  <text x="180" y="255" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">e.g. 27-inch monitor</text>

  <!-- Pixel grid zoom -->
  <text x="420" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Zoomed in: pixel density</text>
  <g stroke="#2C4A3E" stroke-width="1">
    <rect x="420" y="95" width="20" height="20" fill="#FBEDEA"/>
    <rect x="440" y="95" width="20" height="20" fill="#F3ECE4"/>
    <rect x="460" y="95" width="20" height="20" fill="#FBEDEA"/>
    <rect x="480" y="95" width="20" height="20" fill="#F3ECE4"/>
    <rect x="420" y="115" width="20" height="20" fill="#F3ECE4"/>
    <rect x="440" y="115" width="20" height="20" fill="#FBEDEA"/>
    <rect x="460" y="115" width="20" height="20" fill="#F3ECE4"/>
    <rect x="480" y="115" width="20" height="20" fill="#FBEDEA"/>
    <rect x="420" y="135" width="20" height="20" fill="#FBEDEA"/>
    <rect x="440" y="135" width="20" height="20" fill="#F3ECE4"/>
    <rect x="460" y="135" width="20" height="20" fill="#FBEDEA"/>
    <rect x="480" y="135" width="20" height="20" fill="#F3ECE4"/>
  </g>
  <text x="420" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">More pixels packed into the</text>
  <text x="420" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">same physical inch = higher PPI</text>
  <text x="420" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">= sharper image, independent</text>
  <text x="420" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">of the diagonal "size" number.</text>
</svg>
