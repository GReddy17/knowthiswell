<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oralHygieneTitle">
  <title id="oralHygieneTitle">Cross-section of a tooth and gumline showing a toothbrush angled at 45 degrees toward the gum margin, with plaque highlighted along the gumline being brushed away, next to a smaller diagram comparing brushing twice daily for two minutes against flossing once daily to reach between teeth.</title>
  <rect width="780" height="300" fill="#FBF8F1"/>

  <!-- Tooth cross section -->
  <path d="M 120 80 Q 100 90 100 130 L 105 220 Q 108 240 130 240 L 140 240 Q 150 240 152 220 L 155 160 L 165 220 Q 168 240 178 240 L 188 240 Q 210 240 213 220 L 218 130 Q 218 90 198 80 Z" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <rect x="70" y="215" width="180" height="55" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="160" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Gum tissue</text>

  <!-- Plaque along gumline -->
  <ellipse cx="160" cy="222" rx="70" ry="8" fill="#B5493A" opacity="0.55"/>
  <text x="160" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#B5493A">plaque at gumline</text>

  <!-- Toothbrush at 45 degrees -->
  <g transform="translate(340,90) rotate(45)">
    <rect x="0" y="0" width="140" height="16" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="1.8"/>
    <rect x="0" y="16" width="140" height="8" fill="#2C4A3E"/>
    <line x1="10" y1="24" x2="10" y2="34" stroke="#2C4A3E" stroke-width="1.4"/>
    <line x1="25" y1="24" x2="25" y2="34" stroke="#2C4A3E" stroke-width="1.4"/>
    <line x1="40" y1="24" x2="40" y2="34" stroke="#2C4A3E" stroke-width="1.4"/>
    <line x1="55" y1="24" x2="55" y2="34" stroke="#2C4A3E" stroke-width="1.4"/>
    <line x1="70" y1="24" x2="70" y2="34" stroke="#2C4A3E" stroke-width="1.4"/>
  </g>
  <text x="330" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1F1B16">Brush at 45° toward gumline</text>

  <!-- Comparison panel -->
  <rect x="470" y="60" width="280" height="200" rx="10" fill="#FFFFFF" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="610" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Two complementary habits</text>
  <circle cx="500" cy="130" r="6" fill="#2C4A3E"/>
  <text x="515" y="135" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Brush 2x daily, 2 min each — surfaces</text>
  <circle cx="500" cy="175" r="6" fill="#B5493A"/>
  <text x="515" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">Floss 1x daily — between teeth,</text>
  <text x="515" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1F1B16">where a brush can't reach</text>
  <text x="610" y="235" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Together they cover the full tooth surface</text>
</svg>
