<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skewedDistTitle">
  <title id="skewedDistTitle">Histogram showing a right-skewed distribution with a tall cluster of bars on the left and a long, low tail of bars extending far to the right representing outliers, with two vertical marker lines: the median line positioned within the main cluster of bars, and the mean line positioned noticeably to the right of the median, pulled toward the long tail</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <!-- axis -->
  <line x1="60" y1="340" x2="600" y2="340" stroke="#1F1B16" stroke-width="1.5"/>
  <text x="330" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4A443C">Value (low → high, e.g. income or price)</text>

  <!-- bars: right-skewed distribution -->
  <g fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.4">
    <rect x="70"  y="300" width="30" height="40"/>
    <rect x="106" y="260" width="30" height="80"/>
    <rect x="142" y="200" width="30" height="140"/>
    <rect x="178" y="155" width="30" height="185"/>
    <rect x="214" y="170" width="30" height="170"/>
    <rect x="250" y="210" width="30" height="130"/>
    <rect x="286" y="250" width="30" height="90"/>
    <rect x="322" y="280" width="30" height="60"/>
    <rect x="358" y="300" width="30" height="40"/>
    <rect x="394" y="312" width="30" height="28"/>
    <rect x="430" y="320" width="30" height="20"/>
    <rect x="466" y="326" width="30" height="14"/>
    <rect x="502" y="330" width="30" height="10"/>
    <rect x="538" y="333" width="30" height="7"/>
  </g>

  <!-- median marker -->
  <line x1="193" y1="120" x2="193" y2="340" stroke="#2C4A3E" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="193" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2C4A3E">Median</text>

  <!-- mean marker -->
  <line x1="373" y1="120" x2="373" y2="340" stroke="#B5493A" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="373" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#B5493A">Mean</text>

  <!-- tail label -->
  <text x="490" y="365" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#8B6F4E">long tail of outliers</text>
  <path d="M470,352 L560,342" fill="none" stroke="#8B6F4E" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
