<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="680" height="260" fill="#FBF8F1"/>
  <rect x="240" y="15" width="200" height="36" rx="6" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="340" y="38" text-anchor="middle" font-size="12" fill="#1F1B16" font-weight="700">Divorce petition filed</text>

  <path d="M300 51 V70 H150 V85" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow5)"/>
  <path d="M380 51 V70 H530 V85" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="40" y="85" width="220" height="50" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-size="11" fill="#1F1B16" font-weight="600">Uncontested</text>
  <text x="150" y="120" text-anchor="middle" font-size="10" fill="#4A443C">spouses agree on terms</text>

  <rect x="420" y="85" width="220" height="50" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="530" y="105" text-anchor="middle" font-size="11" fill="#1F1B16" font-weight="600">Contested</text>
  <text x="530" y="120" text-anchor="middle" font-size="10" fill="#4A443C">disputed terms go to hearing</text>

  <path d="M150 135 V150" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow5)"/>
  <rect x="40" y="150" width="220" height="40" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="150" y="174" text-anchor="middle" font-size="10" fill="#1F1B16">Settlement agreement; judge reviews &amp; approves</text>

  <path d="M530 135 V150" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow5)"/>
  <rect x="420" y="150" width="220" height="40" rx="6" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="530" y="174" text-anchor="middle" font-size="10" fill="#1F1B16">Judge decides disputed terms</text>

  <path d="M150 190 V210 H340 V220" stroke="#2C4A3E" stroke-width="2"/>
  <path d="M530 190 V210 H340 V220" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="230" y="220" width="220" height="34" rx="6" fill="#EDE7D8" stroke="#B5493A" stroke-width="2"/>
  <text x="340" y="242" text-anchor="middle" font-size="11" fill="#1F1B16" font-weight="700">Divorce decree issued</text>

  <defs>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2C4A3E"/>
    </marker>
  </defs>
</svg>
