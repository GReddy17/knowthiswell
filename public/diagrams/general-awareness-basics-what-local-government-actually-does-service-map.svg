<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="localGovTitle">
  <title id="localGovTitle">A diagram with a central box labeled Local Government surrounded by service boxes: Public Works, Public Safety, Zoning and Permitting, Parks and Recreation, and Public Schools, each connected back to the central Local Government box</title>
  <rect width="700" height="400" fill="#FBF8F1"/>
  <rect x="270" y="170" width="160" height="60" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2.2"/>
  <text x="350" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Local Government</text>

  <rect x="30" y="30" width="180" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="120" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Public Works (roads, water, sewer)</text>
  <line x1="150" y1="85" x2="290" y2="170" stroke="#2C4A3E" stroke-width="1.2"/>

  <rect x="490" y="30" width="180" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Public Safety (police, fire)</text>
  <line x1="550" y1="85" x2="410" y2="170" stroke="#2C4A3E" stroke-width="1.2"/>

  <rect x="30" y="310" width="180" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="120" y="343" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Zoning and Permitting</text>
  <line x1="150" y1="310" x2="290" y2="230" stroke="#2C4A3E" stroke-width="1.2"/>

  <rect x="490" y="310" width="180" height="55" rx="8" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="580" y="343" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Parks and Recreation</text>
  <line x1="550" y1="310" x2="410" y2="230" stroke="#2C4A3E" stroke-width="1.2"/>

  <rect x="260" y="330" width="180" height="55" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.6"/>
  <text x="350" y="363" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#1F1B16">Public Schools (district)</text>
  <line x1="350" y1="330" x2="350" y2="230" stroke="#2C4A3E" stroke-width="1.2"/>
</svg>
