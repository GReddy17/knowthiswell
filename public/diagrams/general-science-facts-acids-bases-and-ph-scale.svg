<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="phScaleTitle">
  <title id="phScaleTitle">A horizontal pH scale from 0 to 14, red at the acidic end through green at neutral 7 to blue at the basic end, with common substances marked at their approximate pH: battery acid near 0, lemon juice and stomach acid near 2, black coffee near 5, pure water at 7, baking soda near 9, ammonia near 11, and drain cleaner near 13</title>

  <rect x="0" y="0" width="640" height="340" fill="#FBF8F1"/>
  <text x="320" y="34" text-anchor="middle" font-family="ui-serif, Georgia, serif" font-size="20" font-weight="600" fill="#1F1B16">The pH Scale</text>

  <defs>
    <linearGradient id="phGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9412C"/>
      <stop offset="50%" stop-color="#4C7A5A"/>
      <stop offset="100%" stop-color="#4A7A9E"/>
    </linearGradient>
  </defs>

  <!-- scale bar: x from 60 to 600, 14 units -->
  <rect x="60" y="90" width="540" height="34" fill="url(#phGrad)" rx="4"/>
  <rect x="60" y="90" width="540" height="34" fill="none" stroke="#1F1B16" stroke-width="1.5" rx="4"/>

  <!-- tick marks 0-14 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#1F1B16">
    <!-- 60 + n*(540/14) -->
    <line x1="60" y1="124" x2="60" y2="132" stroke="#1F1B16" stroke-width="1"/>
    <text x="60" y="144" text-anchor="middle">0</text>
    <line x1="176.6" y1="124" x2="176.6" y2="132" stroke="#1F1B16" stroke-width="1"/>
    <text x="176.6" y="144" text-anchor="middle">3</text>
    <line x1="253.7" y1="124" x2="253.7" y2="132" stroke="#1F1B16" stroke-width="1"/>
    <text x="253.7" y="144" text-anchor="middle">5</text>
    <line x1="330" y1="124" x2="330" y2="132" stroke="#1F1B16" stroke-width="1.5"/>
    <text x="330" y="144" text-anchor="middle" font-weight="600">7</text>
    <line x1="406.3" y1="124" x2="406.3" y2="132" stroke="#1F1B16" stroke-width="1"/>
    <text x="406.3" y="144" text-anchor="middle">9</text>
    <line x1="483.4" y1="124" x2="483.4" y2="132" stroke="#1F1B16" stroke-width="1"/>
    <text x="483.4" y="144" text-anchor="middle">11</text>
    <line x1="600" y1="124" x2="600" y2="132" stroke="#1F1B16" stroke-width="1"/>
    <text x="600" y="144" text-anchor="middle">14</text>
  </g>
  <text x="30" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Acidic</text>
  <text x="612" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Basic</text>

  <!-- substance markers: pH0 x=60, pH14 x=600, step = 540/14 = 38.57 -->
  <!-- battery acid ~0 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">
    <line x1="60" y1="60" x2="60" y2="90" stroke="#1F1B16" stroke-width="1"/>
    <circle cx="60" cy="60" r="3.5" fill="#1F1B16"/>
    <text x="60" y="50" text-anchor="middle">Battery acid</text>

    <!-- lemon juice ~2 -->
    <line x1="137.1" y1="180" x2="137.1" y2="124" stroke="#1F1B16" stroke-width="1"/>
    <circle cx="137.1" cy="180" r="3.5" fill="#1F1B16"/>
    <text x="137.1" y="196" text-anchor="middle">Lemon juice</text>

    <!-- stomach acid ~2 (slightly offset) -->
    <line x1="137.1" y1="220" x2="137.1" y2="180" stroke="#1F1B16" stroke-width="0.75" stroke-dasharray="2 2"/>
    <circle cx="137.1" cy="220" r="3.5" fill="#1F1B16"/>
    <text x="137.1" y="236" text-anchor="middle">Stomach acid</text>

    <!-- black coffee ~5 -->
    <line x1="253.7" y1="60" x2="253.7" y2="90" stroke="#1F1B16" stroke-width="1"/>
    <circle cx="253.7" cy="60" r="3.5" fill="#1F1B16"/>
    <text x="253.7" y="50" text-anchor="middle">Black coffee</text>

    <!-- pure water 7 -->
    <line x1="330" y1="180" x2="330" y2="124" stroke="#1F1B16" stroke-width="1"/>
    <circle cx="330" cy="180" r="3.5" fill="#1F1B16"/>
    <text x="330" y="196" text-anchor="middle" font-weight="600">Pure water</text>

    <!-- baking soda ~9 -->
    <line x1="406.3" y1="60" x2="406.3" y2="90" stroke="#1F1B16" stroke-width="1"/>
    <circle cx="406.3" cy="60" r="3.5" fill="#1F1B16"/>
    <text x="406.3" y="50" text-anchor="middle">Baking soda</text>

    <!-- ammonia ~11 -->
    <line x1="483.4" y1="180" x2="483.4" y2="124" stroke="#1F1B16" stroke-width="1"/>
    <circle cx="483.4" cy="180" r="3.5" fill="#1F1B16"/>
    <text x="483.4" y="196" text-anchor="middle">Ammonia</text>

    <!-- drain cleaner ~13 -->
    <line x1="560.6" y1="60" x2="560.6" y2="90" stroke="#1F1B16" stroke-width="1"/>
    <circle cx="560.6" cy="60" r="3.5" fill="#1F1B16"/>
    <text x="560.6" y="50" text-anchor="middle">Drain cleaner</text>
  </g>

  <line x1="60" y1="260" x2="600" y2="260" stroke="#E3DCC9" stroke-width="1"/>
  <text x="320" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">Each whole-number step is a 10x change in hydrogen ion concentration —</text>
  <text x="320" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#4A443C">drain cleaner is roughly 10,000 times more concentrated than baking soda.</text>
</svg>
