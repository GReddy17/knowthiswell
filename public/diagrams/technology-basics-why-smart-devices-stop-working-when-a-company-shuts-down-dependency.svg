<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shutdownDependencyTitle">
  <title id="shutdownDependencyTitle">A before-and-after diagram: on the left, a smart device works normally by sending a request to the manufacturer's cloud server, which processes it and sends back a response; on the right, the same device sends the same request, but the cloud server is now shown crossed out and offline, and the request simply times out with no response, leaving the physical device unable to perform the function that depended on that server.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <defs>
    <marker id="arrowDep" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowDepRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/>
    </marker>
  </defs>

  <text x="180" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">While the company operates</text>
  <rect x="60" y="90" width="120" height="60" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2" rx="4"/>
  <text x="120" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Smart device</text>
  <path d="M180,110 L255,90" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowDep)"/>
  <path d="M255,130 L180,130" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowDep)"/>
  <rect x="260" y="60" width="120" height="70" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2" rx="4"/>
  <text x="320" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Company's</text>
  <text x="320" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">cloud server</text>
  <text x="220" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">request → processed → response</text>
  <text x="220" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">feature works as expected</text>

  <line x1="440" y1="40" x2="440" y2="260" stroke="#2C4A3E" stroke-width="1" stroke-dasharray="3,4"/>

  <text x="620" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">After the company shuts down</text>
  <rect x="500" y="90" width="120" height="60" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2" rx="4"/>
  <text x="560" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" fill="#1F1B16">Same device</text>
  <path d="M620,110 L695,90" fill="none" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowDepRed)"/>
  <rect x="700" y="60" width="80" height="70" fill="#EDE7D8" stroke="#B5493A" stroke-width="2" rx="4" opacity="0.6"/>
  <text x="740" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#B5493A">server</text>
  <text x="740" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#B5493A">offline</text>
  <line x1="705" y1="65" x2="775" y2="125" stroke="#B5493A" stroke-width="2"/>
  <line x1="775" y1="65" x2="705" y2="125" stroke="#B5493A" stroke-width="2"/>
  <text x="620" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">request times out, no response</text>
  <text x="620" y="216" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">feature stops working — hardware is fine, unreachable</text>

  <text x="400" y="280" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">The physical device didn't break. The remote "brain" it depends on disappeared.</text>
</svg>
