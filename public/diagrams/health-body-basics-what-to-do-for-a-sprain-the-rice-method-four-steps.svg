<svg viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">RICE in four steps: Rest, avoid weight on the injured area; Ice, apply in short 15 to 20 minute intervals with breaks; Compression, wrap snugly but not tightly; Elevation, raise the injured area above heart level.</title>
  <rect width="680" height="230" fill="#FBF8F1"/>
  <rect x="20" y="30" width="145" height="140" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="92" cy="58" r="14" fill="#2C4A3E"/><text x="92" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">R</text>
  <text x="92" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Rest</text>
  <text x="92" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Avoid weight on</text>
  <text x="92" y="139" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">the injured area</text>
  <path d="M165 100 L182 100" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="185" y="30" width="145" height="140" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="257" cy="58" r="14" fill="#2C4A3E"/><text x="257" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">I</text>
  <text x="257" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Ice</text>
  <text x="257" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Short 15 to 20 minute</text>
  <text x="257" y="139" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">intervals, with breaks</text>
  <path d="M330 100 L347 100" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="350" y="30" width="145" height="140" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="422" cy="58" r="14" fill="#2C4A3E"/><text x="422" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">C</text>
  <text x="422" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Compression</text>
  <text x="422" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Wrap snugly,</text>
  <text x="422" y="139" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">but not tightly</text>
  <path d="M495 100 L512 100" stroke="#1F1B16" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="515" y="30" width="145" height="140" rx="6" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <circle cx="587" cy="58" r="14" fill="#2C4A3E"/><text x="587" y="63" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBF8F1">E</text>
  <text x="587" y="95" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Elevation</text>
  <text x="587" y="123" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">Raise the injured area</text>
  <text x="587" y="139" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">above heart level</text>
  <text x="340" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">Each step has one job; skipping or misapplying one weakens the whole</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F1B16"/></marker></defs>
</svg>
