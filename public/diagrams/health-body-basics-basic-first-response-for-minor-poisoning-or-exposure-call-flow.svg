<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="poisonControlFlowTitle">
  <title id="poisonControlFlowTitle">A flow diagram starting with a suspected poisoning or exposure, leading to a call to Poison Control at 1-800-222-1222, then to a specialist asking about the substance, amount, timing, and symptoms, branching into two outcomes: guidance for monitoring safely at home, or direction to seek emergency care immediately</title>
  <rect width="780" height="260" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="20" y="100" width="150" height="60" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
    <text x="95" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#B5493A">Suspected</text>
    <text x="95" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#B5493A">poisoning/exposure</text>

    <path d="M170,130 L210,130" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="210" y="100" width="170" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="295" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1F1B16">Call 1-800-222-1222</text>
    <text x="295" y="142" text-anchor="middle" font-size="11" fill="#4A443C">(Poison Control)</text>

    <path d="M380,130 L420,130" stroke="#2C4A3E" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="420" y="100" width="180" height="60" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="510" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">Specialist asks: substance,</text>
    <text x="510" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B16">amount, timing, symptoms</text>

    <path d="M600,115 C630,90 650,60 660,50" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="620" y="10" width="150" height="50" rx="8" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="695" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">Monitor safely</text>
    <text x="695" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#1F1B16">at home</text>

    <path d="M600,145 C630,170 650,200 660,210" stroke="#2C4A3E" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="620" y="200" width="150" height="50" rx="8" fill="#FBEDEA" stroke="#B5493A" stroke-width="2.5"/>
    <text x="695" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#B5493A">Seek emergency</text>
    <text x="695" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#B5493A">care immediately</text>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#2C4A3E"/>
      </marker>
    </defs>
  </g>
</svg>
