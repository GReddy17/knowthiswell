<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calKjTitle">
  <title id="calKjTitle">A horizontal bar chart comparing four food items on two parallel axes, Calories on top and kilojoules on bottom, showing an apple at 95 Calories and 397 kilojoules, a slice of bread at 80 Calories and 335 kilojoules, a candy bar at 250 Calories and 1046 kilojoules, and a fast food meal at 800 Calories and 3347 kilojoules, with both axes scaled proportionally to show the fixed 4.184 ratio between them.</title>
  <rect width="640" height="320" fill="#FBF8F1"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#1F1B16">
    <!-- Apple -->
    <text x="20" y="45" font-size="13" font-weight="600">Apple</text>
    <rect x="120" y="32" width="47" height="18" fill="#EEF3EE" stroke="#2C4A3E"/>
    <text x="175" y="45" font-size="12" fill="#4A443C">95 kcal</text>
    <rect x="120" y="54" width="66" height="14" fill="#FBEDEA" stroke="#2C4A3E"/>
    <text x="195" y="65" font-size="11" fill="#4A443C">397 kJ</text>

    <!-- Bread -->
    <text x="20" y="105" font-size="13" font-weight="600">Bread slice</text>
    <rect x="120" y="92" width="40" height="18" fill="#EEF3EE" stroke="#2C4A3E"/>
    <text x="168" y="105" font-size="12" fill="#4A443C">80 kcal</text>
    <rect x="120" y="114" width="56" height="14" fill="#FBEDEA" stroke="#2C4A3E"/>
    <text x="185" y="125" font-size="11" fill="#4A443C">335 kJ</text>

    <!-- Candy bar -->
    <text x="20" y="165" font-size="13" font-weight="600">Candy bar</text>
    <rect x="120" y="152" width="125" height="18" fill="#EEF3EE" stroke="#2C4A3E"/>
    <text x="253" y="165" font-size="12" fill="#4A443C">250 kcal</text>
    <rect x="120" y="174" width="175" height="14" fill="#FBEDEA" stroke="#2C4A3E"/>
    <text x="304" y="185" font-size="11" fill="#4A443C">1,046 kJ</text>

    <!-- Fast food meal -->
    <text x="20" y="225" font-size="13" font-weight="600">Fast food meal</text>
    <rect x="120" y="212" width="400" height="18" fill="#EEF3EE" stroke="#2C4A3E"/>
    <text x="528" y="225" font-size="12" fill="#4A443C">800 kcal</text>
    <rect x="120" y="234" width="560" height="14" fill="#FBEDEA" stroke="#2C4A3E"/>
    <text x="583" y="245" font-size="11" fill="#4A443C">3,347 kJ</text>
  </g>

  <text x="320" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">Top bar = Calories (kcal), bottom bar = kilojoules (kJ) — both scaled by the same fixed 4.184 ratio.</text>
</svg>
