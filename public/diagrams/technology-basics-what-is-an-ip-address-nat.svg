<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="natTitle">
  <title id="natTitle">A diagram showing several devices inside a home, each with its own private IP address like 192.168.1.x, all connecting through a home router that has one public IP address, which is the only address visible to the wider internet, with the router shown maintaining an internal translation table mapping requests to devices.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>

  <rect x="30" y="20" width="330" height="260" fill="none" stroke="#4A443C" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="195" y="45" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4A443C">Home network (private)</text>

  <rect x="55" y="65" width="130" height="46" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Laptop</text>
  <text x="120" y="101" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">192.168.1.10</text>

  <rect x="55" y="125" width="130" height="46" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Phone</text>
  <text x="120" y="161" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">192.168.1.14</text>

  <rect x="55" y="185" width="130" height="46" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="120" y="206" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Smart TV</text>
  <text x="120" y="221" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">192.168.1.22</text>

  <rect x="230" y="120" width="120" height="60" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="290" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Router</text>
  <text x="290" y="161" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">(NAT table)</text>

  <defs>
    <marker id="arrowNat" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M185,88 C 210,88 210,140 228,148" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowNat)"/>
  <path d="M185,148 L228,150" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowNat)"/>
  <path d="M185,208 C 210,208 210,160 228,152" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowNat)"/>

  <path d="M350,150 L560,150" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowNat)"/>
  <text x="455" y="138" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">one shared public IP</text>

  <rect x="565" y="120" width="180" height="60" fill="#F7F1E5" stroke="#2C4A3E" stroke-width="2"/>
  <text x="655" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">The internet</text>
  <text x="655" y="161" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#4A443C">sees: 203.0.113.5</text>

  <text x="390" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">Only the router's public IP is visible outside the dashed line — private IPs never leave the home network.</text>
</svg>
