<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="permissionsTitle">
  <title id="permissionsTitle">A diagram showing an app on the left unable to reach hardware and data resources directly. Every request passes through the operating system's permission layer in the middle, which checks a stored per-app, per-resource setting before allowing or blocking access to the camera, microphone, contacts, or location on the right.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <defs>
    <marker id="arrowPerm" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
    <marker id="arrowPermBlock" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B5493A"/>
    </marker>
  </defs>

  <rect x="30" y="120" width="130" height="60" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="95" y="145" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">App</text>
  <text x="95" y="162" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">requests access</text>

  <path d="M160,150 L268,150" fill="none" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrowPerm)"/>

  <rect x="270" y="90" width="180" height="140" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <text x="360" y="115" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1F1B16">OS permission layer</text>
  <text x="360" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">checks stored setting for</text>
  <text x="360" y="147" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#4A443C">(this app, this resource)</text>
  <text x="360" y="171" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2C4A3E">Allow</text>
  <text x="360" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#B5493A">or Deny</text>
  <text x="360" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8.5" fill="#4A443C">re-checked every request</text>

  <path d="M450,130 L558,90" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowPerm)"/>
  <path d="M450,150 L558,150" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowPerm)"/>
  <path d="M450,170 L558,210" fill="none" stroke="#B5493A" stroke-width="1.5" marker-end="url(#arrowPermBlock)" stroke-dasharray="4,3"/>

  <rect x="560" y="65" width="120" height="42" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="620" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Camera</text>

  <rect x="560" y="128" width="120" height="42" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="620" y="153" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Location</text>

  <rect x="560" y="191" width="120" height="42" fill="#F2E4E1" stroke="#B5493A" stroke-width="1.5"/>
  <text x="620" y="213" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Contacts</text>
  <text x="620" y="227" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#B5493A">blocked example</text>

  <text x="400" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#B5493A">A grant is per resource, not a master key — camera access says nothing about contacts.</text>
</svg>
