<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="blockTitle">
  <title id="blockTitle">A before-and-after comparison showing, before blocking, two people able to send messages and see each other's activity in both directions, and after blocking, the blocking person's server-side permission flag now stopping new messages and visibility in both directions, while existing past messages already delivered to each device remain untouched on both sides.</title>
  <rect width="800" height="300" fill="#FBF8F1"/>

  <text x="30" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">Before blocking</text>

  <rect x="30" y="45" width="120" height="46" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="90" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Person A</text>

  <rect x="640" y="45" width="120" height="46" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="700" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Person B</text>

  <defs>
    <marker id="arrowBlock" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <path d="M150,60 L638,60" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBlock)"/>
  <path d="M638,80 L150,80" fill="none" stroke="#2C4A3E" stroke-width="1.5" marker-end="url(#arrowBlock)"/>
  <text x="400" y="52" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">messages, profile views, status flow both ways</text>

  <text x="30" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F1B16">After A blocks B</text>

  <rect x="30" y="165" width="120" height="46" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="90" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Person A</text>

  <rect x="330" y="165" width="140" height="46" fill="#FBEDEA" stroke="#B5493A" stroke-width="2"/>
  <text x="400" y="187" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">Server-side</text>
  <text x="400" y="201" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1F1B16">permission flag</text>

  <rect x="640" y="165" width="120" height="46" fill="#F2ECE0" stroke="#2C4A3E" stroke-width="2"/>
  <text x="700" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">Person B</text>

  <path d="M150,188 L328,188" fill="none" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M472,188 L638,188" fill="none" stroke="#B5493A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="240" y="222" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#B5493A">new messages blocked both ways at the server</text>

  <rect x="60" y="245" width="680" height="45" fill="#F7F1E5" stroke="#D8D2C4" stroke-width="1"/>
  <text x="90" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">Not shown: messages exchanged before the block stay exactly where they already were delivered — on each person's own device. Blocking only stops what happens next.</text>
</svg>
