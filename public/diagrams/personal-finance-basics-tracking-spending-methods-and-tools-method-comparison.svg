<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="800" height="340" fill="#FBF8F1"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F1B16">Spending-Tracking Methods, by Effort and Automation</text>

  <g>
    <rect x="40" y="70" width="210" height="220" rx="10" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
    <text x="145" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">Manual Ledger</text>
    <line x1="60" y1="112" x2="230" y2="112" stroke="#2C4A3E" stroke-width="1"/>
    <text x="145" y="140" text-anchor="middle" font-size="12" fill="#4A443C">Entry effort:</text>
    <text x="145" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#B5493A">High</text>
    <text x="145" y="188" text-anchor="middle" font-size="12" fill="#4A443C">Review effort:</text>
    <text x="145" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4A3E">None</text>
    <text x="145" y="250" text-anchor="middle" font-size="11" fill="#4A443C">Write every</text>
    <text x="145" y="265" text-anchor="middle" font-size="11" fill="#4A443C">purchase by hand</text>
  </g>

  <g>
    <rect x="295" y="70" width="210" height="220" rx="10" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
    <text x="400" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">Spreadsheet</text>
    <line x1="315" y1="112" x2="485" y2="112" stroke="#2C4A3E" stroke-width="1"/>
    <text x="400" y="140" text-anchor="middle" font-size="12" fill="#4A443C">Entry effort:</text>
    <text x="400" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#B5493A">Medium</text>
    <text x="400" y="188" text-anchor="middle" font-size="12" fill="#4A443C">Review effort:</text>
    <text x="400" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4A3E">Low</text>
    <text x="400" y="250" text-anchor="middle" font-size="11" fill="#4A443C">Manual entry,</text>
    <text x="400" y="265" text-anchor="middle" font-size="11" fill="#4A443C">automatic totals</text>
  </g>

  <g>
    <rect x="550" y="70" width="210" height="220" rx="10" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
    <text x="655" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1B16">Bank-Linked App</text>
    <line x1="570" y1="112" x2="740" y2="112" stroke="#2C4A3E" stroke-width="1"/>
    <text x="655" y="140" text-anchor="middle" font-size="12" fill="#4A443C">Entry effort:</text>
    <text x="655" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#2C4A3E">Low</text>
    <text x="655" y="188" text-anchor="middle" font-size="12" fill="#4A443C">Review effort:</text>
    <text x="655" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#B5493A">Medium</text>
    <text x="655" y="250" text-anchor="middle" font-size="11" fill="#4A443C">Auto-import, needs</text>
    <text x="655" y="265" text-anchor="middle" font-size="11" fill="#4A443C">category correction</text>
  </g>

  <path d="M 255 180 L 290 180" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 510 180 L 545 180" stroke="#2C4A3E" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2C4A3E"/>
    </marker>
  </defs>

  <text x="400" y="320" text-anchor="middle" font-size="12" fill="#4A443C">All three can produce equally accurate category totals — the difference is which kind of effort each requires.</text>
</svg>
