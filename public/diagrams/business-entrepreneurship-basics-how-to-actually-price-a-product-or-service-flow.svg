<svg viewBox="0 0 560 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="priceFlowTitle">
  <title id="priceFlowTitle">Setting a price step by step: add up full cost per unit including overhead and your time (the floor), estimate what the result is worth to the customer (the ceiling), check competitors' prices, pick a price between floor and ceiling and check its margin, then test with real customers and adjust.</title>
  <rect width="560" height="510" fill="#FBF8F1"/>
  <rect x="130" y="20" width="300" height="60" rx="6" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="280" y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">1. Full cost per unit, incl. overhead</text>
  <text x="280" y="62" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">and your time = the FLOOR</text>
  <text x="280" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="130" y="106" width="300" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">2. Value to the customer</text>
  <text x="280" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">= the CEILING</text>
  <text x="280" y="184" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="130" y="192" width="300" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="218" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">3. Check competitors' prices to</text>
  <text x="280" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">see where expectations sit</text>
  <text x="280" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="130" y="278" width="300" height="60" rx="6" fill="#F3EBDD" stroke="#8B6F4E" stroke-width="2"/>
  <text x="280" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">4. Pick a price in between;</text>
  <text x="280" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1F1B16">margin = (price - cost) / price</text>
  <text x="280" y="356" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8B6F4E">↓</text>
  <rect x="130" y="364" width="300" height="60" rx="6" fill="#2C4A3E"/>
  <text x="280" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">5. Test with real buyers</text>
  <text x="280" y="406" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBF8F1">and adjust</text>
  <text x="280" y="488" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#4A443C">A 50% markup is only a 33% margin: know which one you mean</text>
</svg>
