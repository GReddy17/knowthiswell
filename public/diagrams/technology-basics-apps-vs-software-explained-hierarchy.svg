<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="appsVsSoftwareTitle">
  <title id="appsVsSoftwareTitle">Hierarchy diagram showing software as the large outer category, split into two branches: system software (operating system, drivers, utilities) and application software (apps), with apps labeled as one branch of software rather than a separate thing</title>
  <rect width="640" height="420" fill="#FBF8F1"/>

  <rect x="40" y="30" width="560" height="360" rx="16" fill="#EDE7D8" stroke="#2C4A3E" stroke-width="2"/>
  <text x="320" y="60" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">SOFTWARE</text>
  <text x="320" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#4A443C">any set of instructions a computer runs</text>

  <rect x="70" y="105" width="240" height="255" rx="12" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="1.5"/>
  <text x="190" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">System software</text>
  <text x="190" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">operating system</text>
  <text x="190" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">device drivers</text>
  <text x="190" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">background utilities</text>
  <text x="190" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">runs the machine itself,</text>
  <text x="190" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">mostly invisible to you</text>

  <rect x="330" y="105" width="240" height="255" rx="12" fill="#FBEDEA" stroke="#C9412C" stroke-width="1.5"/>
  <text x="450" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1F1B16">Application software</text>
  <text x="450" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">"apps"</text>
  <text x="450" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">browsers, editors</text>
  <text x="450" y="204" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4A443C">games, spreadsheets</text>
  <text x="450" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">does one job you asked</text>
  <text x="450" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8B6F4E">for, directly and visibly</text>
</svg>
