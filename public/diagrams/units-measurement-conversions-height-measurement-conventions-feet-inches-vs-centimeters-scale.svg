<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heightTitle">
  <title id="heightTitle">Two vertical measuring scales side by side, one marked in feet and inches from 0 to 6 feet 6 inches and one marked in centimeters from 0 to 198, aligned so 5 feet 9 inches lines up exactly with 175 centimeters.</title>
  <rect width="780" height="320" fill="#FBF8F1"/>
  <text x="390" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2C4A3E">Two rulers, one height: 5'9&quot; = 175 cm</text>

  <!-- ft/in ruler -->
  <rect x="230" y="55" width="60" height="230" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="230" y1="55" x2="290" y2="55" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="215" y="60" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">6'6&quot;</text>
  <line x1="230" y1="150" x2="290" y2="150" stroke="#B5493A" stroke-width="2.2"/>
  <text x="215" y="155" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5493A">5'9&quot;</text>
  <line x1="230" y1="285" x2="290" y2="285" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="215" y="290" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">0'0&quot;</text>

  <!-- cm ruler -->
  <rect x="490" y="55" width="60" height="230" fill="#FBEDEA" stroke="#2C4A3E" stroke-width="2"/>
  <line x1="490" y1="55" x2="550" y2="55" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="565" y="60" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">198 cm</text>
  <line x1="490" y1="150" x2="550" y2="150" stroke="#B5493A" stroke-width="2.2"/>
  <text x="565" y="155" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#B5493A">175 cm</text>
  <line x1="490" y1="285" x2="550" y2="285" stroke="#2C4A3E" stroke-width="1.4"/>
  <text x="565" y="290" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#4A443C">0 cm</text>

  <line x1="290" y1="150" x2="490" y2="150" stroke="#B5493A" stroke-width="1.4" stroke-dasharray="4,4"/>

  <text x="390" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4A443C">(5 × 12 + 9) inches × 2.54 = 175.26 cm</text>
</svg>
