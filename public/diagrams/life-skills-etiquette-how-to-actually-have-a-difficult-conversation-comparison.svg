<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="convoCompareTitle">
  <title id="convoCompareTitle">Two openings for the same conversation: an interpretation stated as fact leading to defensiveness, versus an observation plus impact plus open question leading to a more open exchange.</title>
  <rect width="620" height="300" fill="#FBF8F1"/>
  <rect x="30" y="30" width="270" height="240" rx="8" fill="#FBEDEA" stroke="#C9412C" stroke-width="2"/>
  <text x="165" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Interpretation as fact</text>
  <text x="50" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">&quot;You don&apos;t care about this.&quot;</text>
  <text x="165" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#C9412C">↓</text>
  <text x="165" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C9412C">Defensiveness,</text>
  <text x="165" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C9412C">conversation shuts down</text>
  <rect x="320" y="30" width="270" height="240" rx="8" fill="#EEF3EE" stroke="#2C4A3E" stroke-width="2"/>
  <text x="455" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F1B16">Observation + impact + question</text>
  <text x="340" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">&quot;The report was late, it</text>
  <text x="340" y="113" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#1F1B16">stressed me out — what happened?&quot;</text>
  <text x="455" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#2C4A3E">↓</text>
  <text x="455" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">Conversation stays open,</text>
  <text x="455" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2C4A3E">more likely productive</text>
</svg>
